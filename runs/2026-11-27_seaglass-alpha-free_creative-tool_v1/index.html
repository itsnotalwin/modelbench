<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Bitforge · Pixel Studio</title>
<style>
/* ============================================================
   Bitforge — art direction
   Dark warm-neutral workspace, single warm-orange accent,
   hairline panels, 120ms ease motion, synthesized sound.
   No external assets. Type = system stacks.
   ============================================================ */
:root{
  --bg:#141318; --panel:#1b1b22; --panel2:#23232c; --panel3:#2b2b36;
  --line:#2e2e39; --line2:#3c3c4a; --text:#eceaf2; --muted:#9b99ac; --faint:#6c6a7e;
  --acc:#ff6f3c; --acc-ink:#1a0d07; --acc2:#ffb454; --ok:#3ddc97; --warn:#ffd166; --danger:#ff5c5c;
  --radius:8px; --shadow:0 10px 34px rgba(0,0,0,.5);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --topbar-h:46px; --tools-w:54px; --right-w:288px; --status-h:26px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:13px; line-height:1.45; overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  user-select:none; -webkit-user-select:none;
}
::selection{background:var(--acc);color:var(--acc-ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid var(--panel)}
::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-radius:4px}
.hidden{display:none!important}

/* ---------- layout ---------- */
#app{display:grid;grid-template-rows:var(--topbar-h) 1fr var(--status-h);height:100%}
#topbar{
  display:flex;align-items:center;gap:6px;padding:0 10px;
  background:linear-gradient(180deg,#1c1c24,#17171d);
  border-bottom:1px solid var(--line); z-index:30;
}
#main{display:grid;grid-template-columns:var(--tools-w) 1fr var(--right-w);min-height:0}
#tools{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;
  overflow-y:auto;z-index:20;
}
#canvasWrap{position:relative;min-width:0;background:
  radial-gradient(circle at 50% 40%,#191920,#101015);overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
#right{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:20}
#statusbar{
  display:flex;align-items:center;gap:14px;padding:0 12px;
  background:var(--panel);border-top:1px solid var(--line);
  font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;
}
#statusbar .spacer{flex:1}
#statusbar b{color:var(--text);font-weight:600}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:9px;padding-right:10px;margin-right:4px;border-right:1px solid var(--line);height:100%}
.brand .mark{
  width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--acc),#ff9a5c);color:#1a0d07;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 1px 3px rgba(0,0,0,.4);
}
.brand .mark svg{width:15px;height:15px;display:block}
.brand .name{font-family:var(--serif);font-size:15px;letter-spacing:.2px;font-weight:600}
.brand .name em{font-style:normal;color:var(--acc)}
.brand .sub{font-size:10px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;margin-left:2px}

/* ---------- menubar ---------- */
.menubar{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.menu{position:relative}
.menu>summary{
  list-style:none;padding:5px 10px;border-radius:6px;color:var(--muted);
  cursor:pointer;font-size:12.5px;transition:background .12s var(--ease),color .12s var(--ease);
}
.menu>summary::-webkit-details-marker{display:none}
.menu>summary:hover{background:var(--panel2);color:var(--text)}
.menu[open]>summary{background:var(--panel2);color:var(--text)}
.menu .pop{
  position:absolute;top:calc(100% + 5px);left:0;min-width:230px;
  background:var(--panel2);border:1px solid var(--line2);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:5px;z-index:50;
  animation:popin .12s var(--ease);
}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pop button,.pop label.row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;
  padding:7px 9px;border-radius:6px;color:var(--text);text-align:left;font-size:12.5px;
}
.pop button:hover,.pop label.row:hover{background:var(--panel3)}
.pop button[disabled]{opacity:.4;cursor:not-allowed}
.pop .k{color:var(--faint);font-family:var(--mono);font-size:11px}
.pop hr{border:none;border-top:1px solid var(--line);margin:4px 6px}
.pop .sep-label{padding:5px 9px 3px;color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.12em}

/* ---------- topbar right ---------- */
.tb-group{display:flex;align-items:center;gap:6px}
.icon-btn{
  width:30px;height:30px;border-radius:7px;display:grid;place-items:center;
  color:var(--muted);background:transparent;transition:background .12s,color .12s,transform .08s;position:relative;
}
.icon-btn svg{width:17px;height:17px;display:block}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.on{background:var(--acc);color:var(--acc-ink)}
.icon-btn[data-tip]::after,.tool[data-tip]::after{
  content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);
  background:#0c0c10;color:#fff;border:1px solid var(--line2);padding:4px 8px;border-radius:6px;
  font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s .18s;z-index:100;
  font-family:var(--font);box-shadow:var(--shadow);
}
.icon-btn[data-tip]:hover::after,.tool[data-tip]:hover::after{opacity:1}
.tool[data-tip]::after{left:calc(100% + 10px);top:50%;transform:translateY(-50%)}

/* zoom */
.zoombox{display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px 4px}
.zoombox input{width:46px;background:transparent;border:none;text-align:center;font-family:var(--mono);font-size:12px;color:var(--text);padding:3px 0}
.zoombox input:focus{outline:none;color:var(--acc)}
.zoombox .pct{color:var(--faint);font-size:11px;font-family:var(--mono)}

/* ---------- tools rail ---------- */
.tool{
  width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--muted);
  position:relative;transition:background .12s,color .12s;margin:0;
}
.tool svg{width:19px;height:19px;display:block}
.tool:hover{background:var(--panel2);color:var(--text)}
.tool.on{background:var(--acc);color:var(--acc-ink)}
.tool.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--acc)}
.tool-sep{width:24px;height:1px;background:var(--line);margin:4px 0}
.tool .kbd{
  position:absolute;right:3px;bottom:2px;font-size:8px;font-family:var(--mono);color:var(--faint);opacity:.8;
}

/* ---------- right panels ---------- */
.panel{border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel.grow{flex:1;min-height:120px}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;background:var(--panel);position:sticky;top:0;z-index:2;
}
.panel-head h3{margin:0;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel-head .tools{display:flex;gap:2px}
.panel-body{padding:11px 12px;overflow:auto}
.panel-body.scroll{flex:1;min-height:0}

/* ---------- color ---------- */
.swatches{display:flex;gap:8px;align-items:center;margin-bottom:11px}
.swatch-stack{position:relative;width:44px;height:44px}
.swatch-stack .sw{position:absolute;width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer}
.swatch-stack .fg{left:0;top:0;z-index:2}
.swatch-stack .bg{right:0;bottom:0;z-index:1}
.checker{background-image:
  linear-gradient(45deg,#3a3a44 25%,transparent 25%,transparent 75%,#3a3a44 75%),
  linear-gradient(45deg,#3a3a44 25%,#26262e 25%,#26262e 75%,#3a3a44 75%);
  background-size:8px 8px;background-position:0 0,4px 4px}
.swap-btn{margin-left:auto}
.color-field{position:relative;width:100%;height:118px;border-radius:8px;overflow:hidden;border:1px solid var(--line2);cursor:crosshair;touch-action:none}
.color-field .sat{position:absolute;inset:0;background:linear-gradient(to right,#fff,transparent)}
.color-field .val{position:absolute;inset:0;background:linear-gradient(to top,#000,transparent)}
.color-field .cursor{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translate(-50%,-50%);pointer-events:none}
.hue-bar,.alpha-bar{position:relative;height:12px;border-radius:6px;margin-top:9px;border:1px solid var(--line2);cursor:pointer;touch-action:none}
.hue-bar{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.alpha-bar{overflow:hidden}
.alpha-bar .fill{position:absolute;inset:0}
.bar-cursor{position:absolute;top:50%;width:8px;height:16px;border-radius:4px;background:#fff;border:1px solid rgba(0,0,0,.5);transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.color-readouts{display:flex;gap:6px;margin-top:9px}
.color-readouts input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-family:var(--mono);font-size:11px}
.color-readouts input:focus{outline:none;border-color:var(--acc)}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:11px}
.palette .p{aspect-ratio:1;border-radius:5px;border:1px solid var(--line2);cursor:pointer;transition:transform .1s}
.palette .p:hover{transform:scale(1.12);z-index:1;border-color:var(--acc)}
.section-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:11px 0 6px}
.recent{display:flex;gap:5px;flex-wrap:wrap;min-height:22px}
.recent .p{width:20px;height:20px;border-radius:4px;border:1px solid var(--line2);cursor:pointer}

/* ---------- layers ---------- */
.layer-tools{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.layer-tools .icon-btn{width:27px;height:27px}
.layer-tools .icon-btn svg{width:15px;height:15px}
.layer-list{display:flex;flex-direction:column;gap:5px}
.layer{
  display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;border:1px solid transparent;
  background:var(--panel2);cursor:pointer;transition:border-color .12s,background .12s;position:relative;
}
.layer:hover{border-color:var(--line2)}
.layer.on{border-color:var(--acc);background:var(--panel3)}
.layer.on::before{content:"";position:absolute;left:-1px;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--acc)}
.layer .thumb{width:38px;height:38px;border-radius:5px;border:1px solid var(--line2);flex:none;image-rendering:pixelated;background-position:0 0}
.layer .meta{flex:1;min-width:0}
.layer .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.layer .sub{font-size:10px;color:var(--faint);font-family:var(--mono);display:flex;gap:7px;align-items:center;margin-top:1px}
.layer .vis,.layer .lock{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--muted);flex:none}
.layer .vis:hover,.layer .lock:hover{background:var(--panel);color:var(--text)}
.layer .vis.off{opacity:.4}
.layer .vis svg,.layer .lock svg{width:15px;height:15px}
.layer input.rename{width:100%;background:var(--panel);border:1px solid var(--acc);border-radius:4px;padding:2px 4px;font-size:12px}
.layer-props{margin-top:9px;display:flex;flex-direction:column;gap:8px}
.prop-row{display:flex;align-items:center;gap:8px}
.prop-row label{font-size:11px;color:var(--muted);width:54px;flex:none}
.prop-row select{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:11px}
.prop-row select:focus{outline:none;border-color:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:var(--line2);flex:1;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:var(--acc);border:2px solid var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.5);cursor:pointer}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--acc);border:2px solid var(--panel);cursor:pointer}
.op-val{font-family:var(--mono);font-size:10px;color:var(--muted);width:34px;text-align:right}

/* ---------- tool options strip ---------- */
#toolopts{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:15;
  display:flex;align-items:center;gap:10px;padding:6px 10px;flex-wrap:wrap;max-width:calc(100% - 40px);
  background:rgba(27,27,34,.92);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);
}
#toolopts:empty{display:none}
#toolopts .grp{display:flex;align-items:center;gap:6px}
#toolopts .grp label{font-size:11px;color:var(--muted)}
#toolopts .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
#toolopts .seg button{padding:4px 9px;font-size:11px;color:var(--muted);border-right:1px solid var(--line)}
#toolopts .seg button:last-child{border-right:none}
#toolopts .seg button.on{background:var(--acc);color:var(--acc-ink)}
#toolopts input[type=number]{width:52px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-family:var(--mono);font-size:11px}
#toolopts .chk{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);cursor:pointer}
#toolopts .chk input{accent-color:var(--acc)}
#toolopts .mini-range{width:90px}

/* ---------- toasts ---------- */
#toasts{position:fixed;right:16px;bottom:calc(var(--status-h) + 14px);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:9px;
  padding:10px 14px;box-shadow:var(--shadow);font-size:12.5px;max-width:320px;animation:toastin .22s var(--ease);
  display:flex;align-items:center;gap:9px;
}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--danger)} .toast.warn{border-left-color:var(--warn)}
.toast svg{width:16px;height:16px;flex:none}
@keyframes toastin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateX(18px)}}

/* ---------- loupe ---------- */
#loupe{
  position:fixed;z-index:180;pointer-events:none;width:132px;height:158px;border-radius:10px;overflow:hidden;
  background:#0c0c10;border:1px solid var(--line2);box-shadow:var(--shadow);display:none;
}
#loupe canvas{display:block;width:132px;height:132px;image-rendering:pixelated}
#loupe .read{font-family:var(--mono);font-size:10px;color:var(--text);padding:4px 6px;line-height:1.35;display:flex;justify-content:space-between}
#loupe .read b{color:var(--acc2);font-weight:600}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:rgba(8,8,11,.62);backdrop-filter:blur(3px);animation:popin .14s var(--ease)}
#modal .card{background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);width:min(440px,92vw);padding:20px}
#modal h2{margin:0 0 4px;font-size:16px;font-family:var(--serif);font-weight:600}
#modal p.sub{margin:0 0 16px;color:var(--muted);font-size:12.5px}
#modal .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#modal label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
#modal input,#modal select{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 9px;font-family:var(--mono);font-size:13px;width:100%}
#modal input:focus,#modal select:focus{outline:none;border-color:var(--acc)}
#modal .sizes{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
#modal .sizes button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:11px;color:var(--muted);font-family:var(--mono)}
#modal .sizes button:hover{border-color:var(--acc);color:var(--text)}
#modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 15px;font-size:12.5px;color:var(--text);transition:background .12s,border-color .12s,transform .08s}
.btn:hover{background:var(--panel3);border-color:var(--faint)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.primary:hover{background:#ff8252;border-color:#ff8252}
.btn.ghost{background:transparent}

/* ---------- drop hint ---------- */
#dropHint{position:absolute;inset:12px;border:2px dashed var(--acc);border-radius:14px;background:rgba(255,111,60,.08);display:none;place-items:center;z-index:14;pointer-events:none;color:var(--acc);font-size:15px;font-weight:600}
#canvasWrap.dragging #dropHint{display:grid}

/* shortcuts panel */
.keys{columns:2;column-gap:18px;font-size:11.5px;max-height:50vh;overflow:auto}
.keys div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;break-inside:avoid}
.keys kbd{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;font-size:10.5px;color:var(--text)}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
/* small screens */
@media (max-width:900px){
  #main{grid-template-columns:var(--tools-w) 1fr}
  #right{position:absolute;right:0;top:var(--topbar-h);bottom:var(--status-h);width:min(var(--right-w),86vw);box-shadow:var(--shadow);z-index:25}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="mark" id="brandmark"></span>
      <span class="name">Bit<em>forge</em></span>
      <span class="sub">Pixel Studio</span>
    </div>
    <nav class="menubar" id="menubar"></nav>
    <div class="tb-group">
      <button class="icon-btn" id="undoBtn" data-tip="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button class="icon-btn" id="redoBtn" data-tip="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
      <div class="zoombox" role="group" aria-label="Zoom">
        <button class="icon-btn" id="zoomOut" data-tip="Zoom out (Ctrl+-)" aria-label="Zoom out" style="width:24px;height:24px"></button>
        <input id="zoomInput" inputmode="numeric" aria-label="Zoom percent" value="100"><span class="pct">%</span>
        <button class="icon-btn" id="zoomIn" data-tip="Zoom in (Ctrl++)" aria-label="Zoom in" style="width:24px;height:24px"></button>
      </div>
      <button class="icon-btn" id="fitBtn" data-tip="Fit canvas (Ctrl+0)" aria-label="Fit"></button>
      <button class="icon-btn" id="soundBtn" data-tip="Toggle sound" aria-label="Toggle sound"></button>
    </div>
  </header>

  <div id="main">
    <nav id="tools" aria-label="Tools"></nav>
    <div id="canvasWrap">
      <canvas id="view" aria-label="Drawing canvas" tabindex="0"></canvas>
      <div id="toolopts"></div>
      <div id="dropHint">Drop image or project to open</div>
    </div>
    <aside id="right">
      <section class="panel" id="colorPanel">
        <div class="panel-head"><h3>Color</h3>
          <div class="tools"><button class="icon-btn" id="colorReset" data-tip="Reset colors" aria-label="Reset colors"></button></div>
        </div>
        <div class="panel-body" id="colorBody"></div>
      </section>
      <section class="panel grow" id="layersPanel">
        <div class="panel-head"><h3>Layers</h3><div class="layer-tools" id="layerTools"></div></div>
        <div class="panel-body scroll">
          <div class="layer-list" id="layerList"></div>
          <div class="layer-props" id="layerProps"></div>
        </div>
      </section>
    </aside>
  </div>

  <footer id="statusbar">
    <span id="stTool"><b>Pencil</b></span>
    <span id="stSize"></span>
    <span id="stPos">—</span>
    <span id="stPixel"></span>

/* ---------------- blending + compositing (exact integer math) ---------------- */
function blendChannel(mode,cb,cs){ // 0..255 ints -> 0..1 floats
  const b=cb/255, s=cs/255; let v;
  switch(mode){
    case 'multiply': v=b*s; break;
    case 'screen': v=b+s-b*s; break;
    case 'overlay': v=b<=0.5?2*b*s:1-2*(1-b)*(1-s); break;
    case 'darken': v=Math.min(b,s); break;
    case 'lighten': v=Math.max(b,s); break;
    case 'add': v=Math.min(1,b+s); break;
    case 'difference': v=Math.abs(b-s); break;
    default: v=s;
  }

function composite(){
  const w=doc.width, h=doc.height, n=w*h, out=new Uint8ClampedArray(n*4);

      out[k+2]=Math.round(clamp(coB,0,1)*255);
      out[k+3]=Math.round(clamp(ao,0,1)*255);
    }
  }

}

    for(let x=0;x<rect.w;x++){ const dx=rect.x+x; if(dx<0||dx>=W)continue; const si=(y*rect.w+x)*4,di=(dy*W+dx)*4; layer.pixels[di]=data[si];layer.pixels[di+1]=data[si+1];layer.pixels[di+2]=data[si+2];layer.pixels[di+3]=data[si+3]; } }

/* ---------------- painting ---------------- */
function plot(layer,x,y,color){

}
function plotErase(layer,x,y){ x|=0;y|=0; if(x<0||y<0||x>=doc.width||y>=doc.height)return; const i=(y*doc.width+x)*4; layer.pixels[i]=layer.pixels[i+1]=layer.pixels[i+2]=layer.pixels[i+3]=0; }

    const px=Math.round(cx-off+dx), py=Math.round(cy-off+dy);
    if(brushShape==='round'&&s>1){ const rx=dx-(s-1)/2, ry=dy-(s-1)/2; if(rx*rx+ry*ry > (s*s)/4) continue; }

function paintAt(layer,x,y,color,erase){

/* Bresenham line between two pixels */
function linePoints(x0,y0,x1,y1){
  const pts=[]; let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx-dy;

/* pixel-perfect filter (remove L-corners in staircases) */
function pixelPerfectFilter(pts){

    const a=out[out.length-1], b=pts[i], c=pts[i+1];

/* flood fill */

  const W=doc.width,H=doc.height; sx|=0;sy|=0; if(sx<0||sy<0||sx>=W||sy>=H)return;
  const target=[layer.pixels[(sy*W+sx)*4],layer.pixels[(sy*W+sx)*4+1],layer.pixels[(sy*W+sx)*4+2],layer.pixels[(sy*W+sx)*4+3]];
  const fill=[color.r,color.g,color.b,color.a];
  if(colorMatch(target,fill,tol)&&tol===0) { /* still proceed unless identical */ }
  if(target[0]===fill[0]&&target[1]===fill[1]&&target[2]===fill[2]&&target[3]===fill[3]&&tol===0) return;
  const setPix=(x,y)=>{const i=(y*W+x)*4;layer.pixels[i]=fill[0];layer.pixels[i+1]=fill[1];layer.pixels[i+2]=fill[2];layer.pixels[i+3]=fill[3];};

      const i=vi*4; if(colorMatch([layer.pixels[i],layer.pixels[i+1],layer.pixels[i+2],layer.pixels[i+3]],target,tol)){ visited[vi]=1; stack.push(nx,ny); } }

function fillOnMerged(sx,sy,color,tol,contiguous){
  const W=doc.width,H=doc.height; const merged=composite(); sx|=0;sy|=0; if(sx<0||sy<0||sx>=W||sy>=H)return;
  const layer=activeLayer();
  const target=[merged[(sy*W+sx)*4],merged[(sy*W+sx)*4+1],merged[(sy*W+sx)*4+2],merged[(sy*W+sx)*4+3]];
  const fill=[color.r,color.g,color.b,color.a];

  const mark=new Uint8Array(W*H);
  const inRegion=(x,y)=>{const i=(y*W+x)*4;return colorMatch([merged[i],merged[i+1],merged[i+2],merged[i+3]],target,tol);};
  if(!contiguous){ for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(inRegion(x,y)) mark[y*W+x]=1; }

/* shapes onto a scratch layer buffer (for preview + commit) */
function drawShapeInto(layer,kind,x0,y0,x1,y1,color,filled){
  if(x0>x1){const t=x0;x0=x1;x1=t;} if(y0>y1){const t=y0;y0=y1;y1=t;}
  if(kind==='line'){ for(const [x,y] of linePoints(x0,y0,x1,y1)) for(const [px,py] of symmetryPoints(x,y,doc.width,doc.height)) plot(layer,px,py,color); return; }
  if(kind==='rect'){
    for(let x=x0;x<=x1;x++){ for(const [px,py] of symmetryPoints(x,y0,doc.width,doc.height))plot(layer,px,py,color); for(const [px,py] of symmetryPoints(x,y1,doc.width,doc.height))plot(layer,px,py,color); }
    for(let y=y0;y<=y1;y++){ for(const [px,py] of symmetryPoints(x0,y,doc.width,doc.height))plot(layer,px,py,color); for(const [px,py] of symmetryPoints(x1,y,doc.width,doc.height))plot(layer,px,py,color); }
    if(filled){ for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++) for(const [px,py] of symmetryPoints(x,y,doc.width,doc.height)) plot(layer,px,py,color); }
    return;
  }

    const cx=(x0+x1)/2, cy=(y0+y1)/2, rx=Math.max(0.5,(x1-x0)/2), ry=Math.max(0.5,(y1-y0)/2);
    // filled

    return;

}

/* ---------------- selection ---------------- */
function normRect(x0,y0,x1,y1){ let x=Math.min(x0,x1),y=Math.min(y0,y1),w=Math.abs(x1-x0),h=Math.abs(y1-y0); return {x,y,w,h}; }
function clampSel(r){ const x=clamp(r.x,0,doc.width),y=clamp(r.y,0,doc.height); const w=clamp(r.w,0,doc.width-x),h=clamp(r.h,0,doc.height-y); return {x,y,w,h}; }

/* ---------------- rendering ---------------- */
function resetCompositeSize(){ compCanvas.width=doc.width; compCanvas.height=doc.height; prevCanvas.width=doc.width; prevCanvas.height=doc.height; }

}
function renderPreview(){

function requestRender(){ if(renderQueued)return; renderQueued=true; raf(()=>{renderQueued=false;render();}); }

const CHECKER=24;
function drawChecker(){
  // screen-space checker behind artwork
  const tile=12; const cw=view.width, ch=view.height;
  vctx.fillStyle='#15151b'; vctx.fillRect(0,0,cw,ch);
  vctx.save();
  vctx.beginPath(); vctx.rect(0,0,cw,ch); vctx.clip();
  // limit checker to artwork rect
  const a=worldToScreen(0,0), b=worldToScreen(doc.width,doc.height);
  vctx.beginPath(); vctx.rect(a.x,a.y,b.x-a.x,b.y-a.y); vctx.clip();
  const s=Math.max(2,tile);
  for(let y=a.y;y<b.y;y+=s){ for(let x=a.x;x<b.x;x+=s){
    const on=((Math.floor((x-a.x)/s)+Math.floor((y-a.y)/s))&1)===0;
    vctx.fillStyle=on?'#202028':'#17171d'; vctx.fillRect(x,y,s,s);

}
function worldToScreen(x,y){ return {x:x*view2.scale+view2.tx, y:y*view2.scale+view2.ty}; }
function screenToWorld(sx,sy){ return {x:(sx-view2.tx)/view2.scale, y:(sy-view2.ty)/view2.scale}; }

function render(){
  const W=cssW*dpr, H=cssH*dpr; if(view.width!==Math.round(W)||view.height!==Math.round(H)) resizeCanvas();

  drawChecker();
  if(compositeDirty) recomposite();
  const sc=view2.scale, tx=view2.tx, ty=view2.ty;
  // artwork
  vctx.save();
  vctx.translate(tx,ty); vctx.scale(sc,sc); vctx.imageSmoothingEnabled=false;
  // border
  vctx.drawImage(compCanvas,0,0);
  // preview layer
  if(previewPixels){ renderPreview(); vctx.drawImage(prevCanvas,0,0); }
  // move ghost
  if(moving){ vctx.globalAlpha=.85; vctx.drawImage(moving.floatingCanvas, moving.rect.x+moving.dx, moving.rect.y+moving.dy); vctx.globalAlpha=1; }
  vctx.restore();

function drawGrid(a,b,sc){
  vctx.save(); vctx.strokeStyle='rgba(255,255,255,.06)'; vctx.lineWidth=1; vctx.beginPath();
  const step=sc; const x0=Math.ceil(a.x),y0=Math.ceil(a.y);

  for(let y=a.y;y<=b.y+0.5;y+=step){ const py=Math.round(y)+.5; vctx.moveTo(a.x,py); vctx.lineTo(b.x,py); }

function drawCursor(){

/* ---------------- resize ---------------- */
function resizeCanvas(){

  view.width=Math.max(1,Math.round(cssW*dpr)); view.height=Math.max(1,Math.round(cssH*dpr));

function fitView(){

  const s=clamp(Math.min((cssW-pad)/w,(cssH-pad)/h),1/16,64);
  // snap to nice integer when close
  let scale=s; const nearest=Math.round(s); if(Math.abs(s-nearest)<0.02*nearest) scale=nearest||1;
  view2.scale=clamp(scale,1/16,64);

function download(filename,blob){ try{ const url=URL.createObjectURL(blob); const a=h('a',{href:url,download:filename}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500); }catch(e){ toast('Export failed','err','warn'); Sound.err(); } }

function exportPNG(scale){ scale=clamp(scale|0,1,16); const data=composite(); const c=document.createElement('canvas'); c.width=doc.width*scale;c.height=doc.height*scale; const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const tmp=document.createElement('canvas'); tmp.width=doc.width;tmp.height=doc.height; tmp.getContext('2d').putImageData(new ImageData(data,doc.width,doc.height),0,0); ctx.drawImage(tmp,0,0,c.width,c.height);
  c.toBlob(b=>{ if(b){ download(`bitforge-${doc.width}x${doc.height}-x${scale}.png`,b); toast('Exported PNG','ok'); Sound.ok(); } else toast('Export failed','err','warn'); },'image/png'); }

function exportSVG(){ const W=doc.width,H=doc.height; let body='';
  for(const layer of doc.layers){ if(!layer.visible||layer.opacity<=0)continue; const op=layer.opacity; let rects=''; const p=layer.pixels;
    // horizontal run merging per row
    for(let y=0;y<H;y++){ let x=0; while(x<W){ const i=(y*W+x)*4; if(p[i+3]===0){x++;continue;} const r=p[i],g=p[i+1],b=p[i+2],a=p[i+3]; let run=1;
        while(x+run<W){ const j=(y*W+x+run)*4; if(p[j]===r&&p[j+1]===g&&p[j+2]===b&&p[j+3]===a) run++; else break; }
        const hex='#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''); const fa=(a/255).toFixed(3);
        rects+=`<rect x="${x}" y="${y}" width="${run}" height="1" fill="${hex}" fill-opacity="${fa}"/>`; x+=run; } }
    const blend=layer.blend==='normal'?'normal':layer.blend==='add'?'lighter':layer.blend;
    body+=`<g style="mix-blend-mode:${blend}" opacity="${op}" data-name="${escapeHTML(layer.name)}">${rects}</g>`; }
  const svg=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges">${body}</svg>`;
  download(`bitforge-${W}x${H}.svg`,new Blob([svg],{type:'image/svg+xml'})); toast('Exported SVG','ok'); Sound.ok(); }

function exportProject(){ download(`bitforge-${doc.width}x${doc.height}.json`,new Blob([JSON.stringify(serializeProject(),null,2)],{type:'application/json'})); toast('Saved project','ok'); Sound.ok(); }

function openImageFile(file){
  const reader=new FileReader();
  reader.onload=()=>{ const img=new Image(); img.onload=()=>{ try{
      let w=img.naturalWidth,h=img.naturalHeight; const scale=Math.min(1,MAX_CANVAS/w,MAX_CANVAS/h); w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
      const tmp=document.createElement('canvas'); tmp.width=w;tmp.height=h; const tctx=tmp.getContext('2d'); tctx.imageSmoothingEnabled=false; tctx.drawImage(img,0,0,w,h);
      const data=tctx.getImageData(0,0,w,h).data;
      const before=snapshotStructure(); const base=makeLayer('Background',w,h); // transparent base
      const l=makeLayer(file.name.replace(/\.[^.]+$/,'').slice(0,40)||'Image',w,h); l.pixels.set(data);
      doc.width=w;doc.height=h;doc.layers=[base,l];doc.activeId=l.id;selection=null;resetCompositeSize();
      pushUndo({type:'struct',before,after:snapshotStructure()}); markDirty();renderLayers();fitView();updateStatus();toast('Opened image','ok');Sound.ok();
    }catch(e){ toast('Could not read image','err','warn'); Sound.err(); } };
    img.onerror=()=>{ toast('Unsupported image','err','warn'); Sound.err(); }; img.src=reader.result; };

/* ---------------- sample content generated in code ---------------- */
function createSampleDoc(){
  const W=32,H=32; const base=makeLayer('Sky',W,H); const sprite=makeLayer('Sprite',W,H);
  const result={width:W,height:H,layers:[base,sprite],activeId:sprite.id};
  const prevDoc=doc; doc=result; // plot() reads global doc dimensions
  const set=(l,x,y,c)=>plot(l,x,y,c);
  // sky gradient + sun + hills on base
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const t=y/H; set(base,x,y,{r:Math.round(lerp(255,120,t)),g:Math.round(lerp(176,150,t)),b:Math.round(lerp(120,210,t)),a:255}); }
  const sun={r:255,g:244,b:176,a:255}; for(let y=-5;y<=5;y++)for(let x=-5;x<=5;x++) if(x*x+y*y<=25) set(base,24+x,7+y,sun);
  // distant hill
  const hill={r:96,g:150,b:120,a:255}; for(let x=0;x<W;x++){ const hh=18+Math.round(3*Math.sin(x*0.5)); for(let y=hh;y<H;y++) set(base,x,y,hill); }
  // grass front
  const grass={r:62,g:120,b:78,a:255}; for(let x=0;x<W;x++){ const hh=22+Math.round(2*Math.sin(x*0.7+1)); for(let y=hh;y<H;y++) set(base,x,y,grass); }
  // little pixel character on sprite layer
  const ink={r:30,g:34,b:52,a:255}, shirt={r:255,g:111,b:60,a:255}, skin={r:255,g:205,b:160,a:255}, pants={r:60,g:80,b:140,a:255};
  // head
  for(let y=9;y<=14;y++)for(let x=13;x<=18;x++) set(sprite,x,y,skin);
  // hair
  for(let x=12;x<=19;x++) set(sprite,x,8,ink); for(let y=9;y<=11;y++){set(sprite,12,y,ink);set(sprite,19,y,ink);} set(sprite,13,9,ink);set(sprite,18,9,ink);
  // eyes
  set(sprite,14,11,ink); set(sprite,17,11,ink); set(sprite,15,13,{r:180,g:90,b:90,a:255}); // smile-ish
  // body
  for(let y=15;y<=20;y++)for(let x=13;x<=18;x++) set(sprite,x,y,shirt);
  // arms
  for(let y=15;y<=19;y++){set(sprite,12,y,shirt);set(sprite,19,y,shirt);}
  // legs
  for(let y=21;y<=25;y++){for(let x=13;x<=15;x++)set(sprite,x,y,pants);for(let x=16;x<=18;x++)set(sprite,x,y,pants);}
  // shoes
  for(let x=12;x<=15;x++)set(sprite,x,26,ink); for(let x=16;x<=19;x++)set(sprite,x,26,ink);
  doc=prevDoc; return result;
}

function rgbToHsv(r,g,b){ r/=255;g/=255;b/=255; const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min; let h=0; const s=max===0?0:d/max, v=max;
  if(d!==0){ if(max===r)h=((g-b)/d)%6; else if(max===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; } return {h,s,v}; }
function hsvToRgb(h,s,v){ const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c; let r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;} return {r:Math.round((r+m)*255),g:Math.round((g+m)*255),b:Math.round((b+m)*255)}; }

let pickFieldMode=null; function pickField(){}
function wireColorPickers(field,hue,alpha){

  let hd=false; hue.addEventListener('pointerdown',e=>{hd=true;hue.setPointerCapture(e.pointerId);setHue(e);}); hue.addEventListener('pointermove',e=>{if(hd)setHue(e);}); hue.addEventListener('pointerup',()=>hd=false);
  const setAlpha=(e)=>{ const r=alpha.getBoundingClientRect(); const a=Math.round(clamp((e.clientX-r.left)/r.width,0,1)*255); setFg({a},true); };
  let ad=false; alpha.addEventListener('pointerdown',e=>{ad=true;alpha.setPointerCapture(e.pointerId);setAlpha(e);}); alpha.addEventListener('pointermove',e=>{if(ad)setAlpha(e);}); alpha.addEventListener('pointerup',()=>ad=false);
}

/* ---------------- selection ops ---------------- */
function selectAll(){ selection={x:0,y:0,w:doc.width,h:doc.height};requestRender();updateStatus(); }
function clearSelection(){ selection=null;requestRender();updateStatus(); }
function deleteSelection(){
  const l=activeLayer(); if(l.locked)return; if(!selActive())return;
  const before=l.pixels.slice(); clearRegion(l,selection); const patch=diffPatch(l,before);
  if(patch) pushUndo({type:'paint',layerId:l.id,...patch}); markDirty();
}
function copySelection(){
  const l=activeLayer(); const r=selActive()?selection:{x:0,y:0,w:doc.width,h:doc.height};
  clipboard={w:r.w,h:r.h,data:extractRegion(l,r)}; toast('Copied','ok'); Sound.click();
}
function cutSelection(){ if(!selActive()){toast('Nothing selected','warn','warn');return;} copySelection(); deleteSelection(); }
function pasteClipboard(){
  if(!clipboard){toast('Clipboard empty','warn','warn');return;}
  const x=selActive()?selection.x:Math.floor((doc.width-clipboard.w)/2); const y=selActive()?selection.y:Math.floor((doc.height-clipboard.h)/2);
  structural(()=>{ const l=makeLayer('Pasted',doc.width,doc.height); pasteRegion(l,{x,y,w:clipboard.w,h:clipboard.h},clipboard.data,false); doc.layers.push(l); doc.activeId=l.id; },'');
  selection={x,y,w:clipboard.w,h:clipboard.h}; requestRender(); updateStatus(); Sound.layer();
}
function flipSelection(horiz){
  const l=activeLayer(); if(l.locked||!selActive())return; const r=selection; const before=l.pixels.slice(); const src=extractRegion(l,r);
  for(let y=0;y<r.h;y++)for(let x=0;x<r.w;x++){ const si=(y*r.w+x)*4; const tx=horiz?r.w-1-x:x, ty=horiz?y:r.h-1-y; const W=doc.width; const di=((r.y+ty)*W+(r.x+tx))*4; l.pixels[di]=src[si];l.pixels[di+1]=src[si+1];l.pixels[di+2]=src[si+2];l.pixels[di+3]=src[si+3]; }
  const patch=diffPatch(l,before); if(patch)pushUndo({type:'paint',layerId:l.id,...patch}); markDirty();
}

/* ---------------- pointer / drawing ---------------- */
function canvasPoint(e){ const r=view.getBoundingClientRect(); const sx=e.clientX-r.left, sy=e.clientY-r.top; const w=screenToWorld(sx,sy); return {sx,sy,wx:w.x,wy:w.y,px:Math.floor(w.x),py:Math.floor(w.y)}; }

function onPointerDown(e){
  e.preventDefault(); view.focus();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{ view.setPointerCapture(e.pointerId); }catch(_){}
  // pinch start
  if(pointers.size===2){ startPinch(); drawing=false;panning=false;return; }

  const p=canvasPoint(e); cursor={x:p.px,y:p.py,inside:true}; updateCursorStatus();
  const middle=e.button===1, right=e.button===2;
  // eyedropper shortcut
  if(e.altKey||tool==='picker'||right){
    pickColorAt(p.px,p.py,right); return;
  }
  if(tool==='hand'||spaceDown||middle){ panning=true; panStart={x:e.clientX,y:e.clientY,tx:view2.tx,ty:view2.ty}; requestRender(); return; }

  const l=activeLayer();
  if(!l.visible){ toast('Layer is hidden','warn','warn'); return; }
  if(l.locked&&tool!=='select'&&tool!=='hand'){ toast('Layer is locked','warn','warn'); Sound.err(); return; }

  if(tool==='select'){ marquee={x0:p.px,y0:p.py,x1:p.px,y1:p.py}; requestRender(); return; }

  if(tool==='fill'){
    const before=l.pixels.slice();
    const sym=symmetryPoints(p.px,p.py,doc.width,doc.height);
    for(const [sx,sy] of sym){ if(fillScope==='merged') fillOnMerged(sx,sy,fg,tolerance,fillMode==='contiguous'); else floodFill(l,sx,sy,fg,tolerance,fillMode==='contiguous'); }
    const patch=diffPatch(l,before); if(patch){pushUndo({type:'paint',layerId:l.id,...patch});markDirty();} Sound.paint(); requestRender(); return;
  }

  if(tool==='move'){
    const before=l.pixels.slice();
    let rect=selActive()?clampSel(selection):{x:0,y:0,w:doc.width,h:doc.height};
    // if clicking inside selection use it; else move whole layer
    const srcData=extractRegion(l,rect);
    clearRegion(l,rect);
    const fc=document.createElement('canvas'); fc.width=rect.w;fc.height=rect.h; fc.getContext('2d').putImageData(new ImageData(srcData,rect.w,rect.h),0,0);
    moving={rect,srcData,dx:0,dy:0,before,layerId:l.id,floatingCanvas:fc,startPx:p.px,startPy:p.py};
    movePointerStart={x:p.px,y:p.py}; markDirty(); requestRender(); return;
  }

  // painting tools
  drawing=true; strokeBefore=l.pixels.slice(); strokeLayerId=l.id; strokePoints=[]; lastPt=null; ppPrev=null;
  const erase=tool==='eraser';
  if(tool==='pencil'||tool==='eraser'){
    const start=[p.px,p.py]; strokePoints=[start]; paintAt(l,p.px,p.py,fg,erase); ppPrev=start; lastPt=start; markDirty(); Sound.paint(); requestRender(); return;
  }
  if(tool==='line'||tool==='rect'||tool==='ellipse'){ shapeStart={x:p.px,y:p.py}; previewPixels=makePreview(tool,shapeStart,{x:p.px,y:p.py},erase); requestRender(); return; }
}

function onPointerMove(e){
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){ updatePinch(); return; }
  const p=canvasPoint(e); cursor={x:p.px,y:p.py,inside:true}; updateCursorStatus();

  if(panning&&panStart){ view2.tx=panStart.tx+(e.clientX-panStart.x); view2.ty=panStart.ty+(e.clientY-panStart.y); requestRender(); return; }
  if(marquee){ marquee.x1=p.px;marquee.y1=p.py;requestRender(); return; }
  if(moving){ moving.dx=p.px-moving.startPx; moving.dy=p.py-moving.startPy; requestRender(); return; }

  if(drawing){
    const l=doc.layers.find(l=>l.id===strokeLayerId); if(!l)return;
    if(tool==='pencil'||tool==='eraser'){
      const erase=tool==='eraser'; const cur=[p.px,p.py];
      let pts=linePoints(lastPt[0],lastPt[1],cur[0],cur[1]);
      // continuous stroke accumulation (contiguous Bresenham) for pixel-perfect
      for(let i=1;i<pts.length;i++) strokePoints.push(pts[i]);
      if(tool==='pencil'&&pixelPerfect){
        // re-render whole stroke pixel-perfect: snapshot restore + reapply
        l.pixels.set(strokeBefore); const filtered=pixelPerfectFilter(strokePoints);
        for(const [x,y] of filtered) for(const [sx,sy] of symmetryPoints(x,y,doc.width,doc.height)) stampBrush(l,sx,sy,fg,false);
      } else {
        // append segment pts (skip first since already painted)
        for(let i=1;i<pts.length;i++) paintAt(l,pts[i][0],pts[i][1],fg,erase);
      }
      lastPt=cur; markDirty(); requestRender(); return;
    }
    if(shapeStart){ previewPixels=makePreview(tool,shapeStart,snapShape(shapeStart,{x:p.px,y:p.py},tool,e.shiftKey),tool==='eraser'); requestRender(); }
  }
  requestRender();
}

function onPointerUp(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2){ endPinch(); }
  const p=canvasPoint(e);
  if(panning){ panning=false;panStart=null;requestRender(); return; }

  if(marquee){ const r=clampSel(normRect(marquee.x0,marquee.y0,marquee.x1+1,marquee.y1+1)); selection=r.w>0&&r.h>0?r:null; marquee=null; requestRender(); updateStatus(); return; }

  if(moving){
    const l=doc.layers.find(l=>l.id===moving.layerId);
    if(l){ // restore then re-apply move atomically for clean undo
      l.pixels.set(moving.before); clearRegion(l,moving.rect); pasteRegionRaw(l,{x:moving.rect.x+moving.dx,y:moving.rect.y+moving.dy,w:moving.rect.w,h:moving.rect.h},moving.srcData);
      const patch=diffPatch(l,moving.before); if(patch) pushUndo({type:'paint',layerId:l.id,...patch});
    }
    moving=null; markDirty(); requestRender(); return;
  }

  if(drawing){
    drawing=false;
    const l=doc.layers.find(l=>l.id===strokeLayerId);
    if(l){
      if(tool==='line'||tool==='rect'||tool==='ellipse'){
        // commit shape onto layer
        const end=snapShape(shapeStart,{x:p.px,y:p.py},tool,e.shiftKey); const tmp=makeLayer('tmp',doc.width,doc.height); drawShapeInto(tmp,tool,shapeStart.x,shapeStart.y,end.x,end.y,fg,tool==='line'?true:shapeFill);
        // merge tmp onto layer source-over
        const before=strokeBefore; mergeLayerOver(l,tmp,before);
        previewPixels=null;
      }
      // pixel-perfect already applied incrementally; nothing more
      const patch=diffPatch(l,strokeBefore); if(patch){pushUndo({type:'paint',layerId:l.id,...patch});markDirty();} Sound.paint();
    }
    shapeStart=null; previewPixels=null; lastPt=null; ppPrev=null; requestRender();
  }
}
function onPointerLeave(){ cursor.inside=false; el('#loupe').style.display='none'; requestRender(); updateCursorStatus(); }

function mergeLayerOver(layer,over,restoreBefore){ if(restoreBefore) layer.pixels.set(restoreBefore); const w=doc.width,h=doc.height; const s=over.pixels,d=layer.pixels;
  for(let i=0;i<w*h;i++){ const k=i*4,a=s[k+3]; if(a===0)continue; const sa=a/255,da=d[k+3]/255,oa=sa+da*(1-sa); if(oa<=0)continue;
    const sR=s[k],sG=s[k+1],sB=s[k+2],dR=d[k],dG=d[k+1],dB=d[k+2];
    d[k]=Math.round((sR*sa+dR*da*(1-sa))/oa);d[k+1]=Math.round((sG*sa+dG*da*(1-sa))/oa);d[k+2]=Math.round((sB*sa+dB*da*(1-sa))/oa);d[k+3]=Math.round(oa*255); } }

function snapShape(a,b,kind,shift){
  if(!shift) return b; let dx=b.x-a.x, dy=b.y-a.y;
  if(kind==='rect'||kind==='ellipse'){ const m=Math.max(Math.abs(dx),Math.abs(dy)); dx=(dx<0?-m:m); dy=(dy<0?-m:m); }
  else if(kind==='line'){ const ang=Math.atan2(dy,dx); const len=Math.hypot(dx,dy); const snap=Math.round(ang/(Math.PI/4))*(Math.PI/4); dx=Math.round(len*Math.cos(snap)); dy=Math.round(len*Math.sin(snap)); }
  return {x:a.x+dx,y:a.y+dy};
}
function makePreview(kind,a,b,erase){ const tmp=makeLayer('tmp',doc.width,doc.height); drawShapeInto(tmp,kind,a.x,a.y,b.x,b.y,erase?{r:0,g:0,b:0,a:0}:fg,kind==='line'?true:shapeFill);
  // build ImageData cropped full canvas
  return {x:0,y:0,w:doc.width,h:doc.height,data:tmp.pixels.slice()}; }

function pickColorAt(x,y,toBg){ if(x<0||y<0||x>=doc.width||y>=doc.height)return; if(compositeDirty)recomposite(); const i=(y*doc.width+x)*4; const d=compCtx.getImageData(x,y,1,1).data; const c={r:d[0],g:d[1],b:d[2],a:d[3]};
  if(toBg) setBg(c); else { setFg(c); pushRecent(c);} Sound.pick(); }

function onPointerCancel(e){
  pointers.delete(e.pointerId); if(pointers.size<2) endPinch();
  panning=false;panStart=null;marquee=null;
  if(moving){ const l=doc.layers.find(l=>l.id===moving.layerId); if(l)l.pixels.set(moving.before); moving=null; markDirty(); }
  if(drawing){ const l=doc.layers.find(l=>l.id===strokeLayerId); if(l&&(tool==='pencil'||tool==='eraser')&&strokeBefore) l.pixels.set(strokeBefore); drawing=false; previewPixels=null;shapeStart=null;markDirty(); }
  previewPixels=null; requestRender();
}

/* pinch zoom */
let pinch=null;
function pointerDist(){ const pts=[...pointers.values()]; if(pts.length<2)return 0; const dx=pts[0].x-pts[1].x,dy=pts[0].y-pts[1].y; return Math.hypot(dx,dy); }
function pointerMid(){ const pts=[...pointers.values()]; return {x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2}; }
function startPinch(){ pinch={dist:pointerDist(),scale:view2.scale,tx:view2.tx,ty:view2.ty,mid:pointerMid()}; }
function updatePinch(){ if(!pinch)return; const d=pointerDist(); if(d<=0)return; const mid=pointerMid(); const r=view.getBoundingClientRect(); const k=d/pinch.dist;
  setZoom(pinch.scale*k,{x:mid.x-r.left,y:mid.y-r.top}); }
function endPinch(){ pinch=null; }

/* ---------------- keyboard ---------------- */
function isTyping(t){ return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable); }
function onKeyDown(e){
  if(isTyping(e.target)){ if(e.key==='Escape') e.target.blur(); return; }
  if(!el('#modal').hidden){ if(e.key==='Escape'){ closeModal(); } return; }
  const ctrl=e.ctrlKey||e.metaKey, key=e.key, lk=key.toLowerCase();
  // shortcuts
  if(ctrl){
    if(lk==='z'){ e.preventDefault(); if(e.shiftKey)redo(); else undo(); return; }
    if(lk==='y'){ e.preventDefault(); redo(); return; }
    if(lk==='c'){ e.preventDefault(); copySelection(); return; }
    if(lk==='x'){ e.preventDefault(); cutSelection(); return; }
    if(lk==='v'){ e.preventDefault(); pasteClipboard(); return; }
    if(lk==='a'){ e.preventDefault(); selectAll(); return; }
    if(lk==='d'){ e.preventDefault(); clearSelection(); return; }
    if(lk==='s'){ e.preventDefault(); saveAutosave(); toast('Saved','ok'); Sound.ok(); return; }
    if(lk==='o'){ e.preventDefault(); el('#fileProj').click(); return; }
    if(lk==='n'){ e.preventDefault(); openNewDialog(); return; }
    if(lk==='g'){ e.preventDefault(); showGrid=!showGrid; requestRender(); return; }
    if(lk==='0'){ e.preventDefault(); fitView(); return; }
    if(lk==='1'){ e.preventDefault(); zoom100(); return; }
    if(key==='='||key==='+'){ e.preventDefault(); setZoom(view2.scale*1.25); return; }
    if(key==='-'||key==='_'){ e.preventDefault(); setZoom(view2.scale/1.25); return; }
    if(e.shiftKey&&lk==='e'){ e.preventDefault(); exportPNG(1); return; }
    if(e.shiftKey&&lk==='n'){ e.preventDefault(); addLayer(); return; }
    return;
  }
  if(key===' '){ if(!spaceDown){spaceDown=true;requestRender();} e.preventDefault(); return; }
  if(key==='Escape'){ clearSelection(); marquee=null;requestRender(); return; }
  if(key==='Delete'||key==='Backspace'){ e.preventDefault(); if(selActive())deleteSelection(); else clearLayer(); return; }
  if(key==='x'||key==='X'){ swapColors(); return; }
  if(key==='['){ brush=clamp(brush-1,1,32); renderToolOptions();requestRender();updateStatus(); return; }
  if(key===']'){ brush=clamp(brush+1,1,32); renderToolOptions();requestRender();updateStatus(); return; }
  if(key==='?'||(key==='/'&&e.shiftKey)){ openShortcuts(); return; }
  if(key==='+'||key==='='){ setZoom(view2.scale*1.25); return; }
  if(key==='-'||key==='_'){ setZoom(view2.scale/1.25); return; }
  // tool keys
  const t=TOOLS.find(t=>t.key.toLowerCase()===lk); if(t){ setTool(t.id); return; }
  // nudge selection / layer
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(key)){
    e.preventDefault(); const dx=key==='ArrowLeft'?-1:key==='ArrowRight'?1:0, dy=key==='ArrowUp'?-1:key==='ArrowDown'?1:0; const step=e.shiftKey?10:1;
    if(selActive()){ selection={x:clamp(selection.x+dx*step,0,doc.width-selection.w),y:clamp(selection.y+dy*step,0,doc.height-selection.h),w:selection.w,h:selection.h}; requestRender(); }
    else { // nudge active layer pixels
      const l=activeLayer(); if(l.locked)return; const before=l.pixels.slice(); const W=doc.width,H=doc.height,src=l.pixels.slice(),dst=new Uint8ClampedArray(W*H*4);
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const nx=x+dx*step,ny=y+dy*step; if(nx<0||ny<0||nx>=W||ny>=H)continue; const si=(y*W+x)*4,di=(ny*W+nx)*4; dst[di]=src[si];dst[di+1]=src[si+1];dst[di+2]=src[si+2];dst[di+3]=src[si+3]; }
      l.pixels=dst; const patch=diffPatch(l,before); if(patch)pushUndo({type:'paint',layerId:l.id,...patch}); markDirty(); }
    return; }
}
function onKeyUp(e){ if(e.key===' '){spaceDown=false;requestRender();} }

/* ---------------- modals ---------------- */
function openModal(card){ const m=el('#modal'); m.innerHTML=''; m.append(card); m.hidden=false; const focusable=els('button,input,select,[tabindex]',card); (focusable[0]||card).focus&&(focusable[0]||card).focus(); }
function closeModal(){ el('#modal').hidden=true; el('#modal').innerHTML=''; }
el('#modal').addEventListener('pointerdown',e=>{ if(e.target===el('#modal')) closeModal(); });

function openNewDialog(){
  const card=h('div',{class:'card'},
    h('h2',{},'New canvas'), h('p',{class:'sub'},'Choose a size. Everything starts transparent.'),
    h('div',{class:'sizes'}, ...[8,16,32,64,128,256].map(s=>h('button',{onclick:()=>{setSizeFields(s,s);}},s+'²'))),
    h('div',{class:'grid'},
      h('label',{},'Width',h('input',{id:'nW',type:'number',min:1,max:MAX_CANVAS,value:doc.width})),
      h('label',{},'Height',h('input',{id:'nH',type:'number',min:1,max:MAX_CANVAS,value:doc.height}))),
    h('div',{class:'actions'}, h('button',{class:'btn ghost',onclick:closeModal},'Cancel'), h('button',{class:'btn primary',onclick:()=>{ const w=el('#nW').value|0,hh=el('#nH').value|0; newDocument(w,hh); closeModal(); }},'Create')));
  openModal(card);
}
function setSizeFields(w,hh){ el('#nW').value=w; el('#nH').value=hh; }
function newDocument(w,hh){
  w=clamp(w|0,1,MAX_CANVAS); hh=clamp(hh|0,1,MAX_CANVAS);
  const base=makeLayer('Background',w,hh); // transparent
  doc={width:w,height:hh,layers:[base],activeId:base.id}; selection=null;
  undoStack.length=0;redoStack.length=0; resetCompositeSize(); resetColors(); markDirty(); renderLayers(); fitView(); updateStatus(); updateUndoButtons(); Sound.ok(); toast('New canvas '+w+'×'+hh,'ok');
}
function openResizeDialog(){
  const card=h('div',{class:'card'},h('h2',{},'Resize canvas'),h('p',{class:'sub'},'Adds or crops space; pixels aren’t scaled.'),
    h('div',{class:'grid'},h('label',{},'Width',h('input',{id:'rW',type:'number',min:1,max:MAX_CANVAS,value:doc.width})),h('label',{},'Height',h('input',{id:'rH',type:'number',min:1,max:MAX_CANVAS,value:doc.height})),
      h('label',{},'Anchor',h('select',{id:'rAnchor'},h('option',{value:'top-left'},'Top-left'),h('option',{value:'center'},'Center'),h('option',{value:'bottom-right'},'Bottom-right')))),
    h('div',{class:'actions'},h('button',{class:'btn ghost',onclick:closeModal},'Cancel'),h('button',{class:'btn primary',onclick:()=>{resizeCanvasDoc(el('#rW').value|0,el('#rH').value|0,el('#rAnchor').value);closeModal();}},'Resize')));
  openModal(card);
}
function openScaleDialog(){
  const card=h('div',{class:'card'},h('h2',{},'Scale image'),h('p',{class:'sub'},'Resamples every layer (nearest neighbour).'),
    h('div',{class:'grid'},h('label',{},'Width',h('input',{id:'sW',type:'number',min:1,max:MAX_CANVAS,value:doc.width})),h('label',{},'Height',h('input',{id:'sH',type:'number',min:1,max:MAX_CANVAS,value:doc.height}))),
    h('div',{class:'actions'},h('button',{class:'btn ghost',onclick:closeModal},'Cancel'),h('button',{class:'btn primary',onclick:()=>{scaleImage(el('#sW').value|0,el('#sH').value|0);closeModal();}},'Scale')));
  openModal(card);
}
function openShortcuts(){
  const rows=[
    ['Pencil','B'],['Eraser','E'],['Fill','G'],['Line','L'],['Rectangle','R'],['Ellipse','O'],['Marquee','M'],['Move','V'],['Eyedropper','I / Alt'],['Hand','H / Space'],
    ['Undo','Ctrl+Z'],['Redo','Ctrl+Shift+Z / Ctrl+Y'],['Copy / Cut / Paste','Ctrl+C / X / V'],['Select all','Ctrl+A'],['Deselect','Ctrl+D / Esc'],
    ['Delete','Del / Backspace'],['Swap colors','X'],['Brush smaller / larger','[ / ]'],['Nudge','Arrows (+Shift ×10)'],
    ['Zoom in / out','Ctrl + / −'],['Fit','Ctrl+0'],['100%','Ctrl+1'],['Pixel grid','Ctrl+G'],['Pan','Space / Middle-drag'],['Pinch','Two-finger touch'],
    ['Save','Ctrl+S'],['Export PNG','Ctrl+Shift+E'],['New layer','Ctrl+Shift+N'],['New canvas','Ctrl+N'],['Open','Ctrl+O'],['Shortcuts','?'],
  ];
  const card=h('div',{class:'card'},h('h2',{},'Keyboard shortcuts'),h('p',{class:'sub'},'Everything is reachable by keyboard.'),
    h('div',{class:'keys'},...rows.map(([a,b])=>h('div',{},h('span',{},a),h('kbd',{},b)))),
    h('div',{class:'actions'},h('button',{class:'btn primary',onclick:closeModal},'Done')));
  openModal(card);
}

/* ---------------- sound button ---------------- */
function renderSoundBtn(){ el('#soundBtn').innerHTML=svg(Sound.enabled?'sound':'mute'); el('#soundBtn').classList.toggle('on',Sound.enabled); }

/* ---------------- RAF loop ---------------- */
function loop(t){
  const dt=t-lastT; lastT=t;
  if(!reducedMotion()&&selActive()){ antsOffset=(antsOffset+dt*0.02)%8; }
  render(); raf(loop);
}

/* ---------------- wire up ---------------- */
function init(){
  // brand mark
  el('#brandmark').innerHTML=svg('brand');
  // icon buttons
  el('#undoBtn').innerHTML=svg('undo'); el('#redoBtn').innerHTML=svg('redo');
  el('#zoomIn').innerHTML=svg('zoomin'); el('#zoomOut').innerHTML=svg('zoomout');
  el('#fitBtn').innerHTML=svg('fit'); el('#colorReset').innerHTML=svg('reset');
  renderSoundBtn();

  buildMenubar(); buildTools(); renderLayerTools(); renderToolOptions();

  // events
  view.addEventListener('pointerdown',onPointerDown);
  view.addEventListener('pointermove',onPointerMove);
  view.addEventListener('pointerup',onPointerUp);
  view.addEventListener('pointercancel',onPointerCancel);
  view.addEventListener('pointerleave',onPointerLeave);
  view.addEventListener('pointerenter',()=>{cursor.inside=true;});
  view.addEventListener('contextmenu',e=>e.preventDefault());
  view.addEventListener('wheel',onWheel,{passive:false});
  window.addEventListener('keydown',onKeyDown);
  window.addEventListener('keyup',onKeyUp);
  window.addEventListener('resize',()=>{resizeCanvas();requestRender();});
  window.addEventListener('blur',()=>{spaceDown=false;panning=false;});
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){requestRender();} });
  if(window.ResizeObserver){ const ro=new ResizeObserver(()=>{resizeCanvas();requestRender();}); ro.observe(wrap); }

  el('#undoBtn').addEventListener('click',undo); el('#redoBtn').addEventListener('click',redo);
  el('#zoomIn').addEventListener('click',()=>setZoom(view2.scale*1.25)); el('#zoomOut').addEventListener('click',()=>setZoom(view2.scale/1.25));
  el('#fitBtn').addEventListener('click',fitView);
  el('#soundBtn').addEventListener('click',()=>{ Sound.enabled=!Sound.enabled; renderSoundBtn(); savePrefs(); if(Sound.enabled)Sound.click(); });
  el('#colorReset').addEventListener('click',resetColors);
  el('#zoomInput').addEventListener('change',e=>{ const v=parseFloat(e.target.value); if(!Number.isNaN(v)) setZoom(clamp(v,1,3200)/100); else updateZoomUI(); });

  // file inputs
  el('#fileImg').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f)openImageFile(f); e.target.value=''; });
  el('#fileProj').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f)openProjectFile(f); e.target.value=''; });

  // drag & drop
  const dropZone=el('#canvasWrap');
  ['dragenter','dragover'].forEach(ev=>dropZone.addEventListener(ev,e=>{e.preventDefault();dropZone.classList.add('dragging');}));
  ['dragleave','drop'].forEach(ev=>dropZone.addEventListener(ev,e=>{e.preventDefault(); if(ev==='dragleave'&&dropZone.contains(e.relatedTarget))return; dropZone.classList.remove('dragging');}));
  dropZone.addEventListener('drop',e=>{ const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f)return;
    if(f.type==='application/json'||f.name.endsWith('.json')) openProjectFile(f); else if(f.type.startsWith('image/')||/\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name)) openImageFile(f); else toast('Unsupported file','err','warn'); });

  // init doc
  loadPrefs();
  resizeCanvas();
  if(!loadAutosave()){ doc=createSampleDoc(); resetCompositeSize(); }
  else { /* restored */ }
  renderLayers(); renderColor(); renderToolOptions(); updateUndoButtons();
  resizeCanvas(); fitView(); updateStatus(); requestRender(); renderSoundBtn();
  updateCursorStatus();

  raf(loop);

  // Ctrl+mousewheel prevent browser zoom handled in onWheel; also prevent gesture
  window.addEventListener('wheel',e=>{ if(e.ctrlKey) e.preventDefault(); },{passive:false});
}
function onWheel(e){
  e.preventDefault();
  const r=view.getBoundingClientRect(); const anchor={x:e.clientX-r.left,y:e.clientY-r.top};
  if(e.ctrlKey||e.metaKey){ setZoom(view2.scale*Math.exp(-e.deltaY*0.0015),anchor); }
  else if(e.shiftKey){ view2.tx-=e.deltaY; requestRender(); }
  else { view2.ty-=e.deltaY; if(e.deltaX)view2.tx-=e.deltaX; requestRender(); }
}

/* avoid double-registering pointer move when not needed */
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
</script>
</body>
