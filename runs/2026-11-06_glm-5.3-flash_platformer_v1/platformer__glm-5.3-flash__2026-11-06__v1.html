<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Pixel Bros. — platformer__glm-5.3-flash__2026-11-06__v1</title>
<style>
  html,body{margin:0;padding:0;background:#111;height:100%;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;
         box-shadow:0 0 40px rgba(0,0,0,.8);max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
"use strict";
/* ============================================================
   SUPER PIXEL BROS. — a classic Mario-style platformer
   Single file · Canvas 2D · vanilla JS · Web Audio (no assets)
   Physics: tile-based, axis-separated (X resolved first, then Y)
   ============================================================ */

// ---------------- Constants ----------------
const SCALE = 2;                 // pixel scale (logical 400x240 -> 800x480)
const TILE = 16;
const VIEW_W = 400, VIEW_H = 240;

// Physics (per frame @ 60fps fixed timestep)
const GRAV = 0.5;                // gravity px/frame^2
const GRAV_HOLD = 0.38;          // reduced gravity while jump held (variable height)
const JUMP_V = 9.0;              // jump impulse
const MAX_HOLD_FRAMES = 18;      // 300ms variable-jump window
const MAXFALL = 10;
const ACC = 0.8;                 // run acceleration
const DEC = 1.2;                 // deceleration on release
const MAXRUN = 6;                // max run speed
const COYOTE_FRAMES = 5;         // 80ms coyote time
const GOOMBA_SPEED = 0.6;
const MUSH_SPEED = 1.2;

// Tile ids
const T_EMPTY=0, T_GROUND=1, T_BRICK=2, T_QCOIN=3, T_QMUSH=4, T_QEMPTY=5,
      T_USED=6, T_PTL=7, T_PTR=8, T_PBL=9, T_PBR=10, T_COIN=11,
      T_POLE=12, T_BALL=13, T_STAIR=14, T_BLOCK=15;
const SOLID = new Set([T_GROUND,T_BRICK,T_QCOIN,T_QMUSH,T_QEMPTY,T_USED,
                       T_PTL,T_PTR,T_PBL,T_PBR,T_STAIR,T_BLOCK]);

const THEMES = {
  over: { bg:'#5C94FC', ground:'#8B4513', groundEdge:'#4A2000', groundLite:'#A0522D',
          brick:'#C84C0C', brickEdge:'#702A00',
          used:'#A0522D', usedEdge:'#5D2E0D' },
  under:{ bg:'#000000', ground:'#8A8A8A', groundEdge:'#3A3A3A', groundLite:'#9E9E9E',
          brick:'#9E9E9E', brickEdge:'#4A4A4A',
          used:'#7A7A7A', usedEdge:'#3A3A3A' }
};

// ---------------- Canvas ----------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---------------- Audio (Web Audio API, synthesized) ----------------
let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, when, slideTo){
  const a = ac(); if(!a) return;
  const t = a.currentTime + (when||0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.linearRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sJump  = () => tone(300, 0.20, 'square',   0.10, 0, 700);          // rising chirp
const sCoin  = () => tone(880, 0.10, 'square',   0.12);                   // A5 ding
const sStomp = () => tone(120, 0.15, 'triangle', 0.30, 0, 40);            // low thud
const sBump  = () => tone(90,  0.10, 'square',   0.15, 0, 60);            // block bump
const sDeath = () => [660,622,587,554].forEach((f,i)=>tone(f,0.15,'square',0.12,i*0.15)); // chromatic descent
const sPower = () => [262,330,392,523,659,784,1047,1319].forEach((f,i)=>tone(f,0.08,'square',0.10,i*0.07)); // 8-note arpeggio
const sShrink= () => [523,392].forEach((f,i)=>tone(f,0.12,'square',0.10,i*0.10));
const sClear = () => [523,659,784,1047,784,1047].forEach((f,i)=>tone(f, i===5?0.45:0.15,'square',0.12,i*0.15)); // 6-note jingle

// ---------------- Level construction ----------------
function mkGrid(W,H){ return Array.from({length:H},()=>new Array(W).fill(T_EMPTY)); }
function addPipe(g, x, h){                 // pipe rising from ground (ground top = row 13)
  for(let i=0;i<h;i++){
    const y = 13 - h + i;
    if(i===0){ g[y][x]=T_PTL; g[y][x+1]=T_PTR; }
    else     { g[y][x]=T_PBL; g[y][x+1]=T_PBR; }
  }
}
function addStairUp(g,x,h){ for(let i=0;i<h;i++) for(let y=12-i;y<=12;y++) g[y][x+i]=T_STAIR; }
function addStairDown(g,x,h){ for(let i=0;i<h;i++) for(let y=12-(h-1-i);y<=12;y++) g[y][x+i]=T_STAIR; }
function addFlag(g, fx){
  g[12][fx]=T_BLOCK;
  for(let y=4;y<=11;y++) g[y][fx]=T_POLE;
  g[3][fx]=T_BALL;
}

function buildLevel1(){
  const W=230, H=15, g=mkGrid(W,H);
  const ground=(a,b)=>{ for(let x=a;x<=b;x++){ g[13][x]=T_GROUND; g[14][x]=T_GROUND; } };
  // 3 gaps: 60-62, 86-89, 153-155
  ground(0,59); ground(63,85); ground(90,152); ground(156,W-1);

  const S=(x,y,t)=>{ g[y][x]=t; };
  // Question blocks: 3 coins, 1 mushroom, 1 empty (exactly 5)
  S(16,9,T_QCOIN);
  S(20,9,T_BRICK); S(21,9,T_QMUSH); S(22,9,T_BRICK); S(23,9,T_QCOIN); S(24,9,T_BRICK);
  S(22,5,T_QCOIN);
  S(78,9,T_QEMPTY); S(77,9,T_BRICK); S(79,9,T_BRICK);
  S(94,9,T_BRICK); S(95,9,T_BRICK);
  // 2+ pipes
  addPipe(g,28,2); addPipe(g,38,3); addPipe(g,46,4); addPipe(g,163,2);
  // Coins
  [[8,9],[9,9],[34,8],[35,8],[36,8],[60,7],[61,7],[62,7],[100,8],[101,8],
   [102,8],[130,7],[131,7],[160,8],[161,8]].forEach(([x,y])=>S(x,y,T_COIN));
  // Stairs before the flag
  addStairUp(g,183,4); addStairDown(g,188,4);
  // Flagpole
  addFlag(g,198);
  // 8 goombas
  const enemies=[26,41,43,55,80,82,112,130].map(x=>({x:x*TILE+1, y:13*TILE-14, type:'goomba'}));
  return { grid:g, W, H, theme:'over', flagX:198, name:'1-1',
           spawn:{x:2*TILE, y:13*TILE-14}, enemies };
}

function buildLevel2(){
  const W=212, H=15, g=mkGrid(W,H);
  const ground=(a,b)=>{ for(let x=a;x<=b;x++){ g[13][x]=T_GROUND; g[14][x]=T_GROUND; } };
  // Underground ceiling
  for(let x=0;x<W;x++) g[0][x]=T_BRICK;
  // 3 gaps: 50-53, 100-103, 140-142
  ground(0,49); ground(54,99); ground(104,139); ground(143,W-1);

  const S=(x,y,t)=>{ g[y][x]=t; };
  // Question blocks: 3 coins, 1 mushroom, 1 empty (exactly 5)
  S(14,9,T_QCOIN);
  S(15,9,T_BRICK); S(16,9,T_BRICK); S(17,9,T_BRICK);
  S(18,9,T_QMUSH); S(19,9,T_QCOIN);
  S(30,9,T_QCOIN); S(31,9,T_BRICK); S(32,9,T_BRICK);
  S(60,9,T_QEMPTY); S(61,9,T_BRICK); S(62,9,T_BRICK);
  S(31,5,T_BRICK); S(32,5,T_BRICK); S(33,5,T_BRICK);
  // 2 pipes
  addPipe(g,70,2); addPipe(g,120,3);
  // Coins
  [[25,8],[26,8],[27,8],[45,7],[46,7],[66,6],[67,6],[68,6],[90,8],[91,8],
   [110,7],[111,7],[150,8],[151,8],[152,8]].forEach(([x,y])=>S(x,y,T_COIN));
  // Stairs + flagpole
  addStairUp(g,172,4); addStairDown(g,177,4);
  addFlag(g,186);
  // 8 goombas
  const enemies=[24,42,44,80,96,108,130,150].map(x=>({x:x*TILE+1, y:13*TILE-14, type:'goomba'}));
  return { grid:g, W, H, theme:'under', flagX:186, name:'1-2',
           spawn:{x:2*TILE, y:13*TILE-14}, enemies };
}

// ---------------- Game state ----------------
let levelDefs = [], levelIdx = 0, level = null;
let state = 'title';   // title | playing | dying | flag | flagwalk | clear | gameover | win
let score = 0, coinsCount = 0, lives = 3, timeLeft = 400, timeTick = 0;
let camX = 0, tick = 0, clearT = 0, flagY = 0, flagPause = 0;
let bounces = new Map();          // "tx,ty" -> frame counter (block bounce animation)
let texts = [];                   // floating "+1" texts
let coinPops = [];                // coins that pop out of blocks
let goombas = [], mushrooms = [];
let mario = null;

function makeMario(x,y){
  return { x, y, w:12, h:14, vx:0, vy:0, face:1, big:false,
           onGround:false, coyote:0, airFrames:0, jumpHeld:false,
           animT:0, invuln:0, headRow:null, hitWall:0, deathT:0 };
}
function loadLevel(i){
  levelIdx = i;
  level = levelDefs[i];
  mario = makeMario(level.spawn.x, level.spawn.y);
  goombas = level.enemies.map(e => ({ ...e, w:14, h:14, vx:-GOOMBA_SPEED, vy:0,
                                      dir:-1, active:false, flat:false, flatT:0,
                                      animT:0, alive:true }));
  mushrooms = []; bounces.clear(); texts = []; coinPops = [];
  camX = 0; timeLeft = 400; timeTick = 0;
  flagY = 4*TILE + 4;
}
function resetGame(){
  score = 0; coinsCount = 0; lives = 3;
  levelDefs = [buildLevel1(), buildLevel2()];
  loadLevel(0);
}
function respawn(){
  lives--;
  if(lives <= 0){ state = 'gameover'; return; }
  const keep = level;
  mario = makeMario(keep.spawn.x, keep.spawn.y);
  goombas = keep.enemies.map(e => ({ ...e, w:14, h:14, vx:-GOOMBA_SPEED, vy:0,
                                     dir:-1, active:false, flat:false, flatT:0,
                                     animT:0, alive:true }));
  mushrooms = []; texts = []; coinPops = [];
  camX = 0; timeLeft = 400; timeTick = 0;
  state = 'playing';
}

// ---------------- Input ----------------
const keys = { left:false, right:false, jump:false };
let jumpPressed = false, prevJump = false;
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left',
  ArrowRight:'right', KeyD:'right',
  ArrowUp:'jump', KeyW:'jump', Space:'jump'
};
addEventListener('keydown', e => {
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  ac(); // unlock audio on first input
  const k = KEYMAP[e.code];
  if(k){
    if(k==='jump' && !keys.jump && !e.repeat) jumpPressed = true;
    keys[k] = true;
  }
  if(e.code === 'Enter'){
    if(state === 'title'){ state = 'playing'; }
    else if(state === 'gameover' || state === 'win'){ resetGame(); state = 'title'; }
  }
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if(k) keys[k] = false;
});

// ---------------- Tile helpers ----------------
function tileAt(tx,ty){
  if(tx < 0) return T_GROUND;                    // solid world edge
  if(!level || tx >= level.W || ty < 0 || ty >= level.H) return T_EMPTY;
  return level.grid[ty][tx];
}
function isSolid(tx,ty){ return SOLID.has(tileAt(tx,ty)); }
function collides(e){
  const tx0=Math.floor((e.x+0.01)/TILE), tx1=Math.floor((e.x+e.w-0.01)/TILE);
  const ty0=Math.floor((e.y+0.01)/TILE), ty1=Math.floor((e.y+e.h-0.01)/TILE);
  for(let ty=ty0;ty<=ty1;ty++) for(let tx=tx0;tx<=tx1;tx++) if(isSolid(tx,ty)) return true;
  return false;
}

// Axis-separated tile collision: X resolved first, then Y (prevents corner-catching)
function moveX(e){
  e.hitWall = 0;
  e.x += e.vx;
  const ty0 = Math.floor(e.y/TILE), ty1 = Math.floor((e.y + e.h - 0.01)/TILE);
  if(e.vx > 0){
    const tx = Math.floor((e.x + e.w)/TILE);
    for(let ty=ty0; ty<=ty1; ty++)
      if(isSolid(tx,ty)){ e.x = tx*TILE - e.w - 0.01; e.vx = 0; e.hitWall = 1; break; }
  } else if(e.vx < 0){
    const tx = Math.floor(e.x/TILE);
    for(let ty=ty0; ty<=ty1; ty++)
      if(isSolid(tx,ty)){ e.x = (tx+1)*TILE + 0.01; e.vx = 0; e.hitWall = -1; break; }
  }
}
function moveY(e){
  e.headRow = null; e.onGround = false;
  e.y += e.vy;
  const tx0 = Math.floor((e.x+0.01)/TILE), tx1 = Math.floor((e.x + e.w - 0.01)/TILE);
  if(e.vy > 0){
    const ty = Math.floor((e.y + e.h)/TILE);
    for(let tx=tx0; tx<=tx1; tx++)
      if(isSolid(tx,ty)){ e.y = ty*TILE - e.h - 0.01; e.vy = 0; e.onGround = true; break; }
  } else if(e.vy < 0){
    const ty = Math.floor(e.y/TILE);
    for(let tx=tx0; tx<=tx1; tx++)
      if(isSolid(tx,ty)){ e.y = (ty+1)*TILE + 0.01; e.vy = 0; e.headRow = ty; break; }
  }
}

// ---------------- Effects ----------------
function addText(x,y,txt){ texts.push({x, y, txt, t:0}); }

function hitBlock(tx,ty){
  const t = level.grid[ty][tx];
  if(t === T_BRICK){ bounces.set(tx+','+ty, 0); sBump(); return; }
  if(t === T_QCOIN || t === T_QMUSH || t === T_QEMPTY){
    level.grid[ty][tx] = T_USED;
    bounces.set(tx+','+ty, 0);
    if(t === T_QCOIN){
      coinsCount++; score += 200;
      addText(tx*TILE, ty*TILE - 10, '+1');
      coinPops.push({x:tx*TILE+3, y:ty*TILE-14, vy:-5, t:0});
      sCoin();
    } else if(t === T_QMUSH){
      mushrooms.push({x:tx*TILE+1, y:ty*TILE-14, w:14, h:14, vx:MUSH_SPEED, vy:0, hitWall:0, onGround:false});
      sPower();
    } else {
      sBump(); // empty block
    }
  }
}

function die(pit){
  if(state !== 'playing') return;
  state = 'dying';
  mario.deathT = 0;
  mario.vy = pit ? 4 : -10;   // death animation: jump up, then fall off screen
  sDeath();
}

// ---------------- Update: Mario ----------------
function updateMario(){
  const m = mario;

  // Horizontal input
  if(keys.right && !keys.left){ m.vx = Math.min(m.vx + ACC, MAXRUN); m.face = 1; }
  else if(keys.left && !keys.right){ m.vx = Math.max(m.vx - ACC, -MAXRUN); m.face = -1; }
  else {
    if(m.vx > 0) m.vx = Math.max(0, m.vx - DEC);
    else         m.vx = Math.min(0, m.vx + DEC);
  }

  // Coyote time: 80ms grace after walking off a platform
  if(m.onGround) m.coyote = COYOTE_FRAMES;
  else if(m.coyote > 0) m.coyote--;

  // Variable-height jump: reduced gravity while held (max 300ms)
  if(jumpPressed && (m.onGround || m.coyote > 0)){
    m.vy = -JUMP_V;
    m.onGround = false; m.coyote = 0; m.airFrames = 0; m.jumpHeld = true;
    sJump();
  }
  // Jump cut on early release
  if(prevJump && !keys.jump && m.vy < -3.5) m.vy *= 0.45;
  if(!keys.jump) m.jumpHeld = false;

  const g = (m.jumpHeld && keys.jump && m.vy < 0 && m.airFrames < MAX_HOLD_FRAMES) ? GRAV_HOLD : GRAV;
  m.airFrames++;
  m.vy = Math.min(m.vy + g, MAXFALL);

  // X first, then Y — axis-separated tile collision
  moveX(m);
  if(m.x < camX){ m.x = camX; if(m.vx < 0) m.vx = 0; }   // camera locks left edge
  moveY(m);

  // Head bump -> question blocks / bricks (pick the tile closest to Mario's centre)
  if(m.headRow !== null){
    const ty = m.headRow, cx = m.x + m.w/2;
    let best = -1, bd = 1e9;
    for(let tx = Math.floor(m.x/TILE); tx <= Math.floor((m.x + m.w)/TILE); tx++){
      const t = tileAt(tx,ty);
      if(t === T_QCOIN || t === T_QMUSH || t === T_QEMPTY || t === T_BRICK){
        const d = Math.abs(tx*TILE + 8 - cx);
        if(d < bd){ bd = d; best = tx; }
      }
    }
    if(best >= 0) hitBlock(best, ty);
  }

  // Coin tiles (walk-through collection)
  const tx0 = Math.floor(m.x/TILE), tx1 = Math.floor((m.x + m.w)/TILE);
  const ty0 = Math.floor(m.y/TILE), ty1 = Math.floor((m.y + m.h)/TILE);
  for(let ty=ty0; ty<=ty1; ty++) for(let tx=tx0; tx<=tx1; tx++){
    if(tileAt(tx,ty) === T_COIN){
      level.grid[ty][tx] = T_EMPTY;
      coinsCount++; score += 200;
      addText(tx*TILE, ty*TILE - 8, '+1');
      sCoin();
    }
  }

  // Pit death
  if(m.y > (level.H + 2) * TILE){ die(true); return; }

  // Walk animation
  if(m.onGround && Math.abs(m.vx) > 0.3) m.animT++; else m.animT = 0;
  if(m.invuln > 0) m.invuln--;

  // Flagpole: trigger at the pole column edge (the solid base block stops ground travel)
  if(m.x + m.w >= level.flagX*TILE - 1){
    state = 'flag';
    m.x = level.flagX*TILE + 7 - m.w;
    m.vx = 0; m.vy = 0;
    score += 1000;
    addText(m.x, m.y - 10, '+1000');
    sCoin();
  }
}

// ---------------- Update: enemies & items ----------------
function updateGoombas(){
  for(const gb of goombas){
    if(!gb.alive) continue;
    if(gb.flat){ gb.flatT--; if(gb.flatT <= 0) gb.alive = false; continue; }
    if(!gb.active){
      if(gb.x < camX + VIEW_W + 32) gb.active = true;
      else continue;
    }
    gb.animT++;
    gb.vx = GOOMBA_SPEED * gb.dir;
    moveX(gb);
    if(gb.hitWall) gb.dir *= -1;              // reverse on wall
    gb.vy = Math.min(gb.vy + GRAV, MAXFALL);
    moveY(gb);
    if(gb.onGround){                          // reverse at ledges
      const frontX = gb.dir > 0 ? gb.x + gb.w + 1 : gb.x - 1;
      const below = tileAt(Math.floor(frontX/TILE), Math.floor((gb.y + gb.h + 2)/TILE));
      if(!SOLID.has(below)) gb.dir *= -1;
    }
    if(gb.y > (level.H + 2) * TILE){ gb.alive = false; continue; }

    // Mario interaction
    const m = mario;
    if(state === 'playing' &&
       m.x < gb.x + gb.w && m.x + m.w > gb.x &&
       m.y < gb.y + gb.h && m.y + m.h > gb.y){
      if(m.vy > 0 && (m.y + m.h) - gb.y < 10){       // stomp from above
        gb.flat = true; gb.flatT = 30;               // 500ms flatten
        score += 100;
        addText(gb.x, gb.y - 8, '+100');
        sStomp();
        m.vy = keys.jump ? -8 : -6;
      } else if(m.invuln <= 0){
        if(m.big){
          m.big = false; m.y += 7; m.h = 14; m.invuln = 90; sShrink();
        } else die(false);
      }
    }
  }
}

function updateMushrooms(){
  for(let i = mushrooms.length - 1; i >= 0; i--){
    const mu = mushrooms[i];
    moveX(mu);
    if(mu.hitWall) mu.vx *= -1;                 // reverse on wall
    mu.vy = Math.min(mu.vy + GRAV, MAXFALL);
    moveY(mu);
    if(mu.y > (level.H + 2) * TILE){ mushrooms.splice(i,1); continue; }

    const m = mario;
    if(state === 'playing' &&
       m.x < mu.x + mu.w && m.x + m.w > mu.x &&
       m.y < mu.y + mu.h && m.y + m.h > mu.y){
      if(!m.big){
        m.big = true; m.h = 21;
        const oldY = m.y; m.y -= 7;
        if(collides(m)) m.y = oldY;             // no headroom: keep feet planted
        score += 1000;
        addText(mu.x, mu.y - 10, '+1000');
      } else { score += 1000; addText(mu.x, mu.y - 10, '+1000'); }
      sPower();
      mushrooms.splice(i,1);
    }
  }
}

function updateEffects(){
  for(const [k,v] of bounces){ if(v >= 16) bounces.delete(k); else bounces.set(k, v+1); }
  for(let i = texts.length-1; i >= 0; i--){
    const t = texts[i]; t.y -= 0.5; t.t++;
    if(t.t > 45) texts.splice(i,1);
  }
  for(let i = coinPops.length-1; i >= 0; i--){
    const c = coinPops[i]; c.y += c.vy; c.vy += 0.35; c.t++;
    if(c.t > 28) coinPops.splice(i,1);
  }
}

// ---------------- Update: flag sequence ----------------
function updateFlag(){
  const m = mario;
  m.y += 2.5; flagY += 2.5;                       // slide down the pole
  const groundTop = 13*TILE;
  if(m.y + m.h >= groundTop){
    m.y = groundTop - m.h;
    if(flagY > groundTop - 28) flagY = groundTop - 28;
    flagPause++;
    if(flagPause > 40){
      state = 'flagwalk';
      // hop onto the pole's base block, then walk off to the right
      m.x = level.flagX*TILE + 2;
      m.y = 12*TILE - m.h;
      m.vx = 0; m.vy = 0; m.face = 1;
    }
  }
}
function updateFlagWalk(){
  const m = mario;
  m.vx = 1.5;
  m.vy = Math.min(m.vy + GRAV, MAXFALL);
  moveX(m); moveY(m);
  m.animT++;
  if(m.x > level.flagX*TILE + 110 || m.x > level.W*TILE - 20){
    state = 'clear'; clearT = 0;
    const bonus = timeLeft * 50;                  // time bonus
    score += bonus;
    sClear();
  }
}

// ---------------- Main update ----------------
function update(){
  tick++;

  if(state === 'playing'){
    // Timer: ~0.4s per unit
    if(++timeTick >= 24){ timeTick = 0; timeLeft--; if(timeLeft <= 0){ timeLeft = 0; die(false); } }
    updateMario();
    updateGoombas();
    updateMushrooms();
    // Camera: follows Mario, clamped to level bounds
    camX = Math.max(0, Math.min(mario.x + mario.w/2 - VIEW_W/2, level.W*TILE - VIEW_W));
  }
  else if(state === 'dying'){
    mario.deathT++;
    mario.vy += GRAV;
    mario.y += mario.vy;
    if(mario.deathT > 160) respawn();
  }
  else if(state === 'flag'){ updateFlag(); }
  else if(state === 'flagwalk'){ updateFlagWalk(); }
  else if(state === 'clear'){
    clearT++;
    if(clearT > 300){                             // 5s, then next level / win
      if(levelIdx === 0){ loadLevel(1); state = 'playing'; }
      else state = 'win';
    }
  }

  updateEffects();
  prevJump = keys.jump;
  jumpPressed = false;   // consume the edge-trigger after this frame has used it
}

// ---------------- Drawing ----------------
function fill(c,x,y,w,h){ ctx.fillStyle = c; ctx.fillRect(x,y,w,h); }

function drawTile(t, x, y, th){
  const px = x*TILE, py = y*TILE;
  switch(t){
    case T_GROUND:
      fill(th.ground, px, py, TILE, TILE);
      fill(th.groundEdge, px, py, TILE, 1); fill(th.groundEdge, px, py, 1, TILE);
      fill(th.groundEdge, px+TILE-1, py, 1, TILE); fill(th.groundEdge, px, py+TILE-1, TILE, 1);
      fill(th.groundLite, px+2, py+2, 3, 1); fill(th.groundLite, px+9, py+8, 3, 1);
      break;
    case T_STAIR:
      fill(th.ground, px, py, TILE, TILE);
      fill(th.groundEdge, px, py, TILE, 2); fill(th.groundEdge, px, py+TILE-2, TILE, 2);
      fill(th.groundEdge, px, py, 2, TILE); fill(th.groundEdge, px+TILE-2, py, 2, TILE);
      break;
    case T_BRICK:
      fill(th.brick, px, py, TILE, TILE);
      fill(th.brickEdge, px, py+7, TILE, 1);
      fill(th.brickEdge, px+7, py, 1, 7); fill(th.brickEdge, px+3, py+8, 1, 8); fill(th.brickEdge, px+12, py+8, 1, 8);
      fill(th.brickEdge, px, py+TILE-1, TILE, 1);
      break;
    case T_QCOIN: case T_QMUSH: case T_QEMPTY: case T_USED: {
      const used = (t === T_USED);
      const th2 = used ? th.used : '#FFD700';
      const ed2 = used ? th.usedEdge : '#7B5800';
      fill(th2, px, py, TILE, TILE);
      fill(ed2, px, py, TILE, 2); fill(ed2, px, py+TILE-2, TILE, 2);
      fill(ed2, px, py, 2, TILE); fill(ed2, px+TILE-2, py, 2, TILE);
      // corner rivets
      fill(ed2, px+3, py+3, 2, 2); fill(ed2, px+11, py+3, 2, 2);
      fill(ed2, px+3, py+11, 2, 2); fill(ed2, px+11, py+11, 2, 2);
      if(!used){
        ctx.fillStyle = '#7B5800';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', px+8, py+9);
      }
      break;
    }
    case T_PTL: case T_PTR: {
      const left = t === T_PTL;
      fill('#00A800', px, py, TILE, TILE);
      fill('#005000', px, py, TILE, 2);                       // cap top
      fill('#005000', left ? px : px+TILE-2, py, 2, TILE);    // cap side
      fill('#005000', px, py+TILE-1, TILE, 1);
      fill('#58D858', px + (left?3:5), py+3, 3, TILE-4);      // highlight
      break;
    }
    case T_PBL: case T_PBR: {
      const left = t === T_PBL;
      fill('#00A800', left?px+1:px, py, TILE-1, TILE);
      fill('#005000', left ? px+1 : px+TILE-2, py, 2, TILE);  // body side
      fill('#58D858', px + (left?4:6), py, 2, TILE);          // highlight
      break;
    }
    case T_POLE:
      fill('#B8B8B8', px+7, py, 2, TILE);
      fill('#E8E8E8', px+7, py, 1, TILE);
      break;
    case T_BALL:
      fill('#B8B8B8', px+7, py+8, 2, TILE-8);
      ctx.fillStyle = '#30A020';
      ctx.beginPath(); ctx.arc(px+8, py+5, 4, 0, Math.PI*2); ctx.fill();
      break;
    case T_BLOCK:
      fill('#B8860B', px, py, TILE, TILE);
      fill('#7B5800', px, py, TILE, 2); fill('#7B5800', px, py+TILE-2, TILE, 2);
      fill('#7B5800', px, py, 2, TILE); fill('#7B5800', px+TILE-2, py, 2, TILE);
      break;
  }
}

function drawCoinSpin(cx, cy){
  const phase = Math.floor(tick/7) % 4;                    // ~8fps spin
  const sx = [1, 0.6, 0.2, 0.6][phase];
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(Math.max(sx, 0.15), 1);
  ctx.fillStyle = '#FFD700';
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#B8860B';
  ctx.fillRect(-1, -3, 2, 6);
  ctx.restore();
}

function drawMario(){
  const m = mario;
  if(m.invuln > 0 && Math.floor(tick/4) % 2 === 0) return; // hurt flash
  const s = m.big ? 1.5 : 1;
  const frame = (m.onGround && Math.abs(m.vx) > 0.3) ? Math.floor(m.animT/6) % 2 : 1;
  ctx.save();
  if(state === 'dying'){
    ctx.translate(m.x + m.w/2, m.y + m.h/2);
    ctx.rotate(Math.PI);                                    // upside-down death pose
    ctx.translate(-m.w/2, -m.h/2 * (m.big?1.5:1) * (m.big?1:1));
    ctx.scale(m.face * s, s * (m.big?1:1));
  } else {
    ctx.translate(m.x + m.w/2, m.y + m.h);
    ctx.scale(m.face * s, s);
  }
  // 12x14 sprite, origin bottom-centre, facing right
  fill('#E52521', -6, -14, 12, 3);                          // red cap
  fill('#E52521', -6, -12, 13, 1);                          // brim
  fill('#FFCC99', -4, -11, 8, 4);                           // skin face
  fill('#000', 2, -11, 1, 2);                               // eye
  fill('#7C3A00', -2, -8, 6, 1);                            // mustache
  fill('#7C3A00', -6, -10, 2, 2);                           // sideburn
  fill('#E52521', -6, -7, 12, 2);                           // red shirt
  fill('#2038EC', -5, -5, 10, frame === 0 ? 3 : 2);         // blue overalls
  fill('#FFD700', -3, -5, 1, 1); fill('#FFD700', 2, -5, 1, 1); // buttons
  if(frame === 0){                                          // walk frame A: legs apart
    fill('#5C2E00', -6, -2, 4, 2);
    fill('#5C2E00', 2, -2, 4, 2);
  } else {                                                  // walk frame B: legs together
    fill('#5C2E00', -4, -3, 3, 3);
    fill('#5C2E00', 1, -3, 4, 3);
  }
  ctx.restore();
}

function drawGoomba(gb){
  if(!gb.alive) return;
  if(gb.flat){
    fill('#6B3E1E', gb.x, gb.y + gb.h - 6, gb.w, 6);
    fill('#3E2723', gb.x, gb.y + gb.h - 2, gb.w, 2);
    return;
  }
  const f = Math.floor(gb.animT/8) % 2;
  fill('#7B3F00', gb.x, gb.y, 14, 10);                      // dark brown body
  fill('#5C2E00', gb.x + 1, gb.y, 12, 2);                   // dome shading
  fill('#FFF', gb.x + 2, gb.y + 2, 3, 4);                   // eyes
  fill('#FFF', gb.x + 9, gb.y + 2, 3, 4);
  fill('#000', gb.x + (gb.dir < 0 ? 2 : 3), gb.y + 3, 2, 2); // pupils
  fill('#000', gb.x + (gb.dir < 0 ? 9 : 10), gb.y + 3, 2, 2);
  fill('#3E2723', gb.x + 2, gb.y + 1, 3, 1);                // angry brows
  fill('#3E2723', gb.x + 9, gb.y + 1, 3, 1);
  fill('#3E2723', gb.x + 2, gb.y + 5, 10, 1);               // frown
  if(f){                                                    // alternating feet
    fill('#3E2723', gb.x, gb.y + 10, 6, 4);
    fill('#3E2723', gb.x + 8, gb.y + 10, 6, 4);
  } else {
    fill('#3E2723', gb.x + 1, gb.y + 10, 6, 4);
    fill('#3E2723', gb.x + 7, gb.y + 10, 6, 4);
  }
}

function drawMushroom(mu){
  fill('#E52521', mu.x, mu.y, 14, 7);                       // red cap
  fill('#FFF', mu.x + 2, mu.y + 1, 3, 2);                   // white spots
  fill('#FFF', mu.x + 9, mu.y + 1, 3, 2);
  fill('#FFF', mu.x + 5, mu.y + 3, 4, 2);
  fill('#FFE6C7', mu.x + 2, mu.y + 7, 10, 7);               // cream stem
  fill('#000', mu.x + 4, mu.y + 9, 1, 2);                   // eyes
  fill('#000', mu.x + 9, mu.y + 9, 1, 2);
}

function drawFlag(){
  const px = level.flagX*TILE + 7;
  // pole is drawn via T_POLE/T_BALL tiles; here: the green flag
  ctx.fillStyle = '#00A800';
  ctx.beginPath();
  ctx.moveTo(px, flagY);
  ctx.lineTo(px - 13, flagY + 6);
  ctx.lineTo(px, flagY + 12);
  ctx.closePath();
  ctx.fill();
  fill('#005000', px - 1, flagY, 1, 12);
}

function drawCastle(){
  // simple decorative castle after the flagpole
  const bx = (level.flagX + 6) * TILE, by = 13*TILE;
  const th = THEMES[level.theme];
  fill(th.ground, bx, by - 48, 80, 48);
  fill(th.groundEdge, bx, by - 48, 80, 2);
  for(let i=0;i<5;i++) fill(th.ground, bx + i*16, by - 56, 10, 8);   // crenellations
  fill('#000', bx + 32, by - 20, 16, 20);                            // doorway
  ctx.beginPath(); ctx.fillStyle = '#000';
  ctx.arc(bx + 40, by - 20, 8, Math.PI, 0); ctx.fill();
  fill('#000', bx + 12, by - 40, 8, 8); fill('#000', bx + 60, by - 40, 8, 8); // windows
}

function drawWorld(){
  const th = THEMES[level.theme];
  ctx.fillStyle = th.bg;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  ctx.save();
  ctx.scale(SCALE, SCALE);
  ctx.translate(-Math.round(camX), 0);

  // visible tile columns only
  const c0 = Math.max(0, Math.floor(camX/TILE) - 1);
  const c1 = Math.min(level.W - 1, Math.ceil((camX + VIEW_W)/TILE) + 1);
  for(let y = 0; y < level.H; y++){
    for(let x = c0; x <= c1; x++){
      const t = level.grid[y][x];
      if(t === T_EMPTY) continue;
      if(t === T_COIN){ drawCoinSpin(x*TILE + 8, y*TILE + 8); continue; }
      let oy = 0;
      const b = bounces.get(x + ',' + y);                    // question-block bounce
      if(b !== undefined) oy = -8 * Math.sin(Math.PI * b / 16);
      ctx.save(); ctx.translate(0, oy);
      drawTile(t, x, y, th);
      ctx.restore();
    }
  }

  drawCastle();
  drawFlag();
  for(const mu of mushrooms) drawMushroom(mu);
  for(const gb of goombas) drawGoomba(gb);
  drawMario();

  // coin pops from blocks
  for(const c of coinPops) drawCoinSpin(c.x + 5, c.y + 5);

  // floating score texts
  ctx.font = 'bold 8px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const t of texts){
    ctx.globalAlpha = Math.max(0, 1 - t.t/45);
    ctx.fillStyle = '#FFF';
    ctx.fillText(t.txt, t.x + 8, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawHUD(){
  ctx.save();
  ctx.scale(SCALE, SCALE);
  ctx.fillStyle = '#FFF';
  ctx.font = 'bold 8px monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('SCORE', 16, 6);   ctx.fillText(String(score).padStart(6,'0'), 16, 16);
  ctx.fillText('COINS', 110, 6);  ctx.fillText('x' + String(coinsCount).padStart(2,'0'), 110, 16);
  ctx.fillText('WORLD', 180, 6);  ctx.fillText(level.name, 184, 16);
  ctx.fillText('TIME', 250, 6);   ctx.fillText(String(timeLeft).padStart(3,'0'), 252, 16);
  ctx.fillText('LIVES', 330, 6);  ctx.fillText('x' + lives, 334, 16);
  ctx.restore();
}

function overlayBox(){
  ctx.save();
  ctx.scale(SCALE, SCALE);
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 60, VIEW_W, 120);
  ctx.fillStyle = '#FFF';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
}

function drawTitle(){
  drawWorld(); drawHUD();
  overlayBox();
  ctx.font = 'bold 16px monospace';
  ctx.fillStyle = '#FFD700';
  ctx.fillText('SUPER PIXEL BROS.', 200, 90);
  ctx.font = 'bold 8px monospace';
  ctx.fillStyle = '#FFF';
  ctx.fillText('World 1-1  ·  3 lives', 200, 112);
  ctx.fillText('ARROWS / A,D = move    UP / W / SPACE = jump (hold = higher)', 200, 130);
  ctx.fillText('Stomp goombas · hit ? blocks · reach the flagpole!', 200, 144);
  ctx.fillStyle = '#58D858';
  ctx.fillText('PRESS ENTER TO START', 200, 164);
  ctx.restore();
}
function drawGameOver(){
  drawWorld(); drawHUD();
  overlayBox();
  ctx.font = 'bold 16px monospace';
  ctx.fillStyle = '#E52521';
  ctx.fillText('GAME OVER', 200, 105);
  ctx.font = 'bold 8px monospace';
  ctx.fillStyle = '#FFF';
  ctx.fillText('Final score: ' + score, 200, 130);
  ctx.fillStyle = '#58D858';
  ctx.fillText('PRESS ENTER TO TRY AGAIN', 200, 155);
  ctx.restore();
}
function drawClear(){
  drawWorld(); drawHUD();
  overlayBox();
  ctx.font = 'bold 16px monospace';
  ctx.fillStyle = '#FFD700';
  ctx.fillText('LEVEL CLEAR!', 200, 95);
  ctx.font = 'bold 8px monospace';
  ctx.fillStyle = '#FFF';
  ctx.fillText('Time bonus: ' + timeLeft + ' x 50 = ' + (timeLeft*50), 200, 120);
  ctx.fillText('Score: ' + score, 200, 134);
  if(levelIdx === 0){
    ctx.fillStyle = '#58D858';
    ctx.fillText('NEXT: WORLD 1-2 (UNDERGROUND)...', 200, 158);
  }
  ctx.restore();
}
function drawWin(){
  drawWorld(); drawHUD();
  overlayBox();
  ctx.font = 'bold 16px monospace';
  ctx.fillStyle = '#FFD700';
  ctx.fillText('YOU WIN!', 200, 95);
  ctx.font = 'bold 8px monospace';
  ctx.fillStyle = '#FFF';
  ctx.fillText('You cleared World 1-1 and World 1-2!', 200, 120);
  ctx.fillText('Final score: ' + score + '   Coins: ' + coinsCount, 200, 136);
  ctx.fillStyle = '#58D858';
  ctx.fillText('PRESS ENTER TO PLAY AGAIN', 200, 160);
  ctx.restore();
}

function draw(){
  if(state === 'title') drawTitle();
  else if(state === 'gameover') drawGameOver();
  else if(state === 'clear') drawClear();
  else if(state === 'win') drawWin();
  else { drawWorld(); drawHUD(); }
}

// ---------------- Loop (fixed 60fps timestep) ----------------
let last = performance.now(), acc = 0;
function frame(now){
  acc += Math.min(now - last, 100);
  last = now;
  while(acc >= 1000/60){ update(); acc -= 1000/60; }
  draw();
  requestAnimationFrame(frame);
}

// Boot
resetGame();
requestAnimationFrame(frame);
</script>
