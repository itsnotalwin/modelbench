<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b1026" />
<title>LUMENFALL — a game of light and wind</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#070b18;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#eaf0ff;-webkit-user-select:none;user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(ellipse at 50% 35%,#141d3d 0%,#070b18 65%,#03050d 100%)}
  canvas{display:block;width:100%;height:100%;image-rendering:auto;outline:none}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;letter-spacing:.14em;
    color:#8fa2cc;text-transform:uppercase;pointer-events:none;text-align:center;line-height:1.7;
    text-shadow:0 1px 8px #000a;opacity:.9;white-space:nowrap}
  @media (max-width:760px){#hint{font-size:10px;letter-spacing:.1em}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" aria-label="LUMENFALL game canvas" tabindex="0"></canvas></div>
<div id="hint">WASD / ARROWS move &nbsp;·&nbsp; SPACE dash &nbsp;·&nbsp; mouse aims &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute &nbsp;·&nbsp; R restart</div>
<script>
"use strict";
/* ============================================================
   LUMENFALL
   A single-file 2D action game. Hand-drawn canvas art, procedural
   synthesized audio. Delta-timed, resolution independent.
   ============================================================ */

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha:false });
const hintEl = document.getElementById('hint');

/* ---------- utilities ---------- */
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const rand = (a=1,b=0)=> b + Math.random()*(a-b);
const randi = (a,b)=> Math.floor(rand(b+1,a));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const dist2 = (x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1;return dx*dx+dy*dy;};
const smooth = t => t*t*(3-2*t);
function hash2(x,y){ let n = x*374761393 + y*668265263; n = (n ^ (n>>13)) * 1274126177; return ((n ^ (n>>16)) >>> 0) / 4294967295; }

/* ---------- sizing / DPR ---------- */
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width  = Math.floor(W*DPR);
  cvs.height = Math.floor(H*DPR);
  cvs.style.width = W+'px';
  cvs.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = true;
  buildBackground();
}
window.addEventListener('resize', ()=>{ resize(); });
window.addEventListener('orientationchange', ()=>setTimeout(resize,80));

/* ---------- high score ---------- */
const SAVE_KEY = 'lumenfall.save.v1';
let save = { best:0, runs:0, muted:false };
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){ const o = JSON.parse(raw); if(o && typeof o==='object'){
      save.best = Number(o.best)||0; save.runs = Number(o.runs)||0; save.muted = !!o.muted;
    }}
  }catch(e){ /* storage blocked */ }
}
function writeSave(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
}
loadSave();

/* ============================================================
   AUDIO — all sound is synthesized at runtime
   ============================================================ */
const Audio = (()=>{
  let ac=null, master=null, musicGain=null, sfxGain=null, comp=null;
  let noiseBuf=null, started=false;
  let musicTimer=0, musicOn=true;
  const state = { muted: save.muted };

  function init(){
    if(ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      ac = new AC();
      master = ac.createGain(); master.gain.value = state.muted?0:0.85;
      comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 22; comp.ratio.value = 6;
      comp.attack.value = 0.004; comp.release.value = 0.22;
      comp.connect(master); master.connect(ac.destination);
      sfxGain = ac.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(comp);
      musicGain = ac.createGain(); musicGain.gain.value = 0.30; musicGain.connect(comp);
      // noise buffer
      const len = Math.floor(ac.sampleRate*1.2);
      noiseBuf = ac.createBuffer(1,len,ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }catch(e){ ac=null; }
  }
  function resume(){
    init(); if(!ac) return;
    if(ac.state==='suspended') ac.resume().catch(()=>{});
  }
  function setMuted(m){
    state.muted = m; save.muted = m; writeSave();
    if(master && ac) master.gain.setTargetAtTime(m?0:0.85, ac.currentTime, 0.02);
  }
  function tone({freq=440, type='sine', dur=0.2, vol=0.2, slide=null, attack=0.006, decay=null, when=0, pan=0}){
    if(!ac) return;
    const t0 = ac.currentTime + when;
    const o = ac.createOscillator(); const g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(Math.max(20,freq), t0);
    if(slide!=null) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide), t0+dur);
    const a = Math.max(0.001, attack);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(vol, t0+a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g);
    if(pan!==0 && ac.createStereoPanner){ const p=ac.createStereoPanner(); p.pan.value=clamp(pan,-1,1); g.connect(p); p.connect(sfxGain); }
    else g.connect(sfxGain);
    o.start(t0); o.stop(t0+dur+0.02);
  }
  function noise({dur=0.3, vol=0.25, freq=900, q=1, type='bandpass', slide=null, when=0, pan=0, attack=0.004}){
    if(!ac || !noiseBuf) return;
    const t0 = ac.currentTime + when;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t0); f.Q.value=q;
    if(slide!=null) f.frequency.exponentialRampToValueAtTime(Math.max(60,slide), t0+dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(vol,t0+attack);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f); f.connect(g);
    if(pan!==0 && ac.createStereoPanner){ const p=ac.createStereoPanner(); p.pan.value=clamp(pan,-1,1); g.connect(p); p.connect(sfxGain); }
    else g.connect(sfxGain);
    s.start(t0); s.stop(t0+dur+0.02);
  }
  const sfx = {
    pickup(n=0){
      const base = 620 + Math.min(n,9)*46;
      tone({freq:base, type:'triangle', dur:0.13, vol:0.16});
      tone({freq:base*1.5, type:'sine', dur:0.22, vol:0.12, when:0.04});
      tone({freq:base*2, type:'sine', dur:0.18, vol:0.05, when:0.08});
    },
    dash(){
      noise({dur:0.24, vol:0.15, freq:1600, q:0.8, slide:220, type:'bandpass'});
      tone({freq:220, slide:80, type:'sine', dur:0.22, vol:0.12});
    },
    hurt(){
      noise({dur:0.3, vol:0.3, freq:340, q:0.7, slide:90, type:'lowpass'});
      tone({freq:150, slide:52, type:'sawtooth', dur:0.32, vol:0.18});
      tone({freq:75, slide:40, type:'square', dur:0.36, vol:0.09});
    },
    kill(){
      noise({dur:0.18, vol:0.2, freq:2400, q:0.5, slide:600, type:'highpass'});
      tone({freq:520, slide:120, type:'triangle', dur:0.16, vol:0.1});
    },
    shoot(){
      tone({freq:1180 + Math.random()*90, type:'triangle', dur:0.055, vol:0.045, slide:640});
    },
    jump(){
      tone({freq:340, slide:620, type:'triangle', dur:0.13, vol:0.10});
    },
    land(){
      noise({dur:0.12, vol:0.10, freq:260, q:0.8, type:'lowpass'});
    },
    nova(){
      tone({freq:110, slide:40, type:'sine', dur:0.9, vol:0.3});
      noise({dur:0.9, vol:0.3, freq:1800, q:0.4, slide:120, type:'bandpass'});
      tone({freq:880, slide:110, type:'triangle', dur:0.7, vol:0.14});
    },
    select(){
      tone({freq:520, type:'sine', dur:0.08, vol:0.14});
      tone({freq:780, type:'sine', dur:0.14, vol:0.1, when:0.05});
    },
    start(){
      [0,0.11,0.22,0.36].forEach((t,i)=>{
        const notes=[392,523.25,659.25,783.99];
        tone({freq:notes[i], type:'triangle', dur:0.5, vol:0.13, when:t});
      });
      noise({dur:0.8, vol:0.06, freq:900, q:0.4, slide:2600, type:'bandpass'});
    },
    levelup(){
      [523.25,659.25,783.99,1046.5].forEach((f,i)=> tone({freq:f, type:'sine', dur:0.35, vol:0.12, when:i*0.07}));
    },
    gameover(){
      [440,349.23,261.63,196].forEach((f,i)=> tone({freq:f, type:'triangle', dur:0.6, vol:0.14, when:i*0.16}));
      noise({dur:1.2, vol:0.12, freq:600, q:0.5, slide:80, type:'lowpass'});
    },
    portal(){
      tone({freq:200, slide:900, type:'sine', dur:0.6, vol:0.12});
    },
    bubble(){
      tone({freq:300, slide:700, type:'sine', dur:0.18, vol:0.06});
    }
  };

  // generative ambient score: slow pad chords + sparse arpeggio
  const SCALE = [0,3,5,7,10,12,15];
  const ROOT = 130.81; // C3
  function padChord(root, dur){
    if(!ac || state.muted) return;
    const t0 = ac.currentTime;
    const ratios = [1, 1.5, 2, 2.9966];
    ratios.forEach((r,i)=>{
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = i===0?'sine':'triangle';
      o.frequency.value = root*r*(1 + (i*0.0009));
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.linearRampToValueAtTime(0.035/(i+1), t0+dur*0.35);
      g.gain.linearRampToValueAtTime(0.0001, t0+dur);
      o.connect(g); g.connect(musicGain); o.start(t0); o.stop(t0+dur+0.05);
    });
  }
  function musicTick(dt, intensity){
    if(!ac || state.muted || !musicOn) return;
    musicTimer -= dt;
    if(musicTimer<=0){
      const roots = [ROOT, ROOT*1.2, ROOT*1.5, ROOT*1.333];
      const root = roots[randi(0,3)];
      padChord(root, 4.2 + Math.random()*1.6);
      if(Math.random()<0.6){
        const n = SCALE[randi(0,SCALE.length-1)];
        const f = ROOT*4*Math.pow(2,n/12);
        tone({freq:f, type:'sine', dur:1.2+Math.random(), vol:0.035, when:0.3+Math.random()*0.6, pan:rand(0.6,-0.6)});
      }
      musicTimer = 2.4 + Math.random()*1.8 - Math.min(0.9, intensity*0.04);
    }
  }
  return { resume, tone, noise, sfx, musicTick, setMuted,
    get muted(){return state.muted;}, get ctx(){return ac;} };
})();

/* ============================================================
   INPUT
   ============================================================ */
const keys = Object.create(null);
const input = {
  x:0, y:0,
  aimX:0, aimY:0,
  aimAngle:0,
  dash:false,
  pausePressed:false,
  startPressed:false,
  restartPressed:false,
  mutePressed:false,
  usingPointer:false,
  pointerX:0, pointerY:0,
  mouseDown:false,
  touch:false,
  touchUsed:false
};
const keyMap = {
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  Space:'dash', ShiftLeft:'dash', ShiftRight:'dash',
  KeyP:'pause', Escape:'pause', KeyM:'mute', KeyR:'restart', Enter:'start'
};

window.addEventListener('keydown', e=>{
  Audio.resume();
  const k = keyMap[e.code];
  if(k){
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code)) e.preventDefault();
    if(!keys[k]){ // just pressed
      if(k==='pause') input.pausePressed = true;
      if(k==='mute') input.mutePressed = true;
      if(k==='restart') input.restartPressed = true;
      if(k==='start') input.startPressed = true;
      if(k==='dash') input.startPressed = true;
    }
    keys[k]=true;
    if(['up','down','left','right','dash','start'].includes(k)) { /* any key starts */ input.startPressed = input.startPressed; }
  }
  if(e.code==='Space' && !e.repeat) input.startPressed = true;
});
window.addEventListener('keyup', e=>{
  const k = keyMap[e.code];
  if(k) keys[k]=false;
  if(e.code==='Space') keys['dash']=false;
});
window.addEventListener('blur', ()=>{
  for(const k in keys) keys[k]=false;
  if(game.state==='playing') togglePause(true);
});

// pointer
function setPointerFromEvent(e){
  const r = cvs.getBoundingClientRect();
  input.pointerX = (e.clientX - r.left);
  input.pointerY = (e.clientY - r.top);
  input.usingPointer = true;
}
cvs.addEventListener('mousemove', e=>{ setPointerFromEvent(e); });
cvs.addEventListener('mousedown', e=>{ setPointerFromEvent(e); input.mouseDown=true; Audio.resume(); });
window.addEventListener('mouseup', ()=>{ input.mouseDown=false; });
cvs.addEventListener('contextmenu', e=>e.preventDefault());

// touch: virtual joystick left, dash button right
const touchUI = { active:false, moveId:null, moveOx:0, moveOy:0, mx:0, my:0, dashId:null, novaId:null, pauseId:null, dashT:0 };
function setupTouch(){
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
  input.touch = isTouch;
  if(!isTouch) return;
  hintEl.style.display = 'none';
  cvs.addEventListener('touchstart', e=>{
    e.preventDefault(); Audio.resume();
    input.touchUsed = true;
    const pad=18;
    const novaX = W-pad-58, novaY = H-pad-150;
    const dashX = W-pad-58, dashY = H-pad-58;
    const pauseX = pad+70, pauseY = H-pad-140;
    for(const t of e.changedTouches){
      if(Math.hypot(t.clientX-pauseX, t.clientY-pauseY) < 30 && (game.state==='playing' || game.state==='paused') && touchUI.pauseId===null){
        touchUI.pauseId = t.identifier;
        togglePause();
        continue;
      }
      if(t.clientX < W*0.52 && touchUI.moveId===null){
        touchUI.moveId = t.identifier; touchUI.moveOx = t.clientX; touchUI.moveOy = t.clientY;
        touchUI.mx = 0; touchUI.my = 0;
      } else if(t.clientX >= W*0.52){
        if(Math.hypot(t.clientX-novaX, t.clientY-novaY) < 48 && touchUI.novaId===null){
          touchUI.novaId = t.identifier; doNova();
        } else if(touchUI.dashId===null){
          touchUI.dashId = t.identifier; touchUI.dashT = 0.16; input.dash = true;
        }
      }
    }
    if(game.state==='title' || game.state==='gameover') input.startPressed = true;
  }, {passive:false});
  cvs.addEventListener('touchmove', e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier===touchUI.moveId){
        let dx = t.clientX - touchUI.moveOx, dy = t.clientY - touchUI.moveOy;
        const d = Math.hypot(dx,dy), max = 70;
        if(d>max){ dx *= max/d; dy *= max/d; touchUI.moveOx = t.clientX - dx; touchUI.moveOy = t.clientY - dy; }
        touchUI.mx = dx/max; touchUI.my = dy/max;
      }
    }
  }, {passive:false});
  function endTouch(e){
    for(const t of e.changedTouches){
      if(t.identifier===touchUI.moveId){ touchUI.moveId=null; touchUI.mx=0; touchUI.my=0; }
      if(t.identifier===touchUI.dashId){ touchUI.dashId=null; input.dash=false; }
      if(t.identifier===touchUI.novaId){ touchUI.novaId=null; }
      if(t.identifier===touchUI.pauseId){ touchUI.pauseId=null; }
    }
  }
  cvs.addEventListener('touchend', e=>{ e.preventDefault(); endTouch(e); }, {passive:false});
  cvs.addEventListener('touchcancel', endTouch, {passive:false});
}
setupTouch();

/* ============================================================
   GAME STATE
   ============================================================ */
const game = {
  state:'title',      // title | playing | paused | gameover | levelup
  time:0,
  score:0,
  best: save.best,
  wave:1,
  waveKills:0,
  waveNeed:8,
  combo:0,
  comboT:0,
  multiplier:1,
  nova:0,           // 0..1 charge
  shake:0,
  shakeX:0, shakeY:0,
  flash:0,
  hitstop:0,
  slowmo:0,
  particles:[],
  motes:[],
  floaters:[],
  enemies:[],
  bullets:[],
  pickups:[],
  trails:[],
  spawnTimer:0,
  waveBanner:0,
  waveBannerText:'',
  deathTimer:0,
  last:0,
  runTime:0,
  diff:0,
  night:0,
  colorShift:0
};

const player = {
  x:0, y:0, vx:0, vy:0, r:15,
  speed:250, dashSpeed:1000,
  dashTime:0, dashCd:0, dashCdMax:1.05,
  dashDirX:1, dashDirY:0,
  hp:5, maxHp:5,
  invuln:0,
  aimAngle:0,
  facing:1,
  bob:0,
  trailT:0,
  dashGhostT:0,
  squash:1,
  landT:0,
  airTime:0,
  z:0, vz:0,       // hop height (purely visual, used for dashes over gaps)
  shots:0
};

/* ============================================================
   BACKGROUND (parallax layers pre-rendered offscreen)
   ============================================================ */
let bgLayers = [];
let vignette = null;

function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1,Math.floor(w)); c.height=Math.max(1,Math.floor(h)); return c; }

function buildBackground(){
  bgLayers = [];
  const w = Math.max(640, Math.floor(W)), h = Math.max(360, Math.floor(H));
  // layer 0: deep sky gradient + stars + aurora bands
  {
    const c = makeCanvas(w, h), x = c.getContext('2d');
    const g = x.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#070a1c');
    g.addColorStop(0.45,'#0c1233');
    g.addColorStop(0.75,'#151a45');
    g.addColorStop(1,'#1d2350');
    x.fillStyle=g; x.fillRect(0,0,w,h);
    // nebula blooms
    for(let i=0;i<7;i++){
      const cx = rand(w), cy = rand(h*0.7), rr = rand(260,110);
      const rg = x.createRadialGradient(cx,cy,0,cx,cy,rr);
      const hue = randi(190,270);
      rg.addColorStop(0,`hsla(${hue},70%,60%,0.10)`);
      rg.addColorStop(1,`hsla(${hue},70%,60%,0)`);
      x.fillStyle=rg; x.beginPath(); x.arc(cx,cy,rr,0,TAU); x.fill();
    }
    // stars
    for(let i=0;i<220;i++){
      const sx = rand(w), sy = rand(h*0.85);
      const s = rand(1.6,0.4), a = rand(0.85,0.15);
      x.fillStyle = `rgba(${randi(190,255)},${randi(210,255)},255,${a})`;
      x.beginPath(); x.arc(sx,sy,s,0,TAU); x.fill();
    }
    bgLayers.push({c, parallax:0.03, drift:0.4});
  }
  // layer 1: distant mountains / spires
  {
    const c = makeCanvas(w, h), x = c.getContext('2d');
    const baseY = h*0.86;
    const peaks = [];
    let px = -100;
    while(px < w+140){
      const pw = rand(220,90);
      peaks.push({x:px, w:pw, h:rand(210,70)});
      px += pw*rand(0.62,0.4);
    }
    x.fillStyle = '#0e1330';
    x.beginPath(); x.moveTo(-50,h);
    for(const p of peaks){ x.lineTo(p.x, baseY); x.lineTo(p.x+p.w*0.5, baseY-p.h); x.lineTo(p.x+p.w, baseY); }
    x.lineTo(w+50,h); x.closePath(); x.fill();
    // rim light
    x.strokeStyle='rgba(120,190,255,0.16)'; x.lineWidth=1.4;
    x.beginPath();
    for(const p of peaks){ x.moveTo(p.x,baseY); x.lineTo(p.x+p.w*0.5, baseY-p.h); x.lineTo(p.x+p.w,baseY); }
    x.stroke();
    bgLayers.push({c, parallax:0.10, drift:0.9});
  }
  // layer 2: nearer crystal spires
  {
    const c = makeCanvas(w,h), x = c.getContext('2d');
    const baseY = h*1.02;
    x.fillStyle = '#0a0e24';
    for(let i=0;i<26;i++){
      const sx = rand(w+120,-60);
      const sw = rand(46,14);
      const sh = rand(190,50);
      x.beginPath();
      x.moveTo(sx-sw*0.5, baseY);
      x.lineTo(sx, baseY-sh);
      x.lineTo(sx+sw*0.5, baseY);
      x.closePath(); x.fill();
      x.strokeStyle = 'rgba(130,210,255,0.10)'; x.lineWidth = 1;
      x.beginPath(); x.moveTo(sx, baseY-sh); x.lineTo(sx+sw*0.5, baseY); x.stroke();
    }
    bgLayers.push({c, parallax:0.22, drift:1.6});
  }
  // vignette
  vignette = makeCanvas(w,h);
  {
    const x = vignette.getContext('2d');
    const rg = x.createRadialGradient(w/2,h*0.48,Math.min(w,h)*0.22, w/2,h*0.48,Math.max(w,h)*0.78);
    rg.addColorStop(0,'rgba(0,0,0,0)');
    rg.addColorStop(0.72,'rgba(0,0,0,0.28)');
    rg.addColorStop(1,'rgba(0,0,0,0.72)');
    x.fillStyle=rg; x.fillRect(0,0,w,h);
  }
}

/* ============================================================
   HELPERS: particles, floaters, trails
   ============================================================ */
function spawnParticle(x,y,opts={}){
  if(game.particles.length > 900) return;
  const a = opts.angle!=null?opts.angle:rand(TAU);
  const sp = opts.speed!=null?opts.speed:rand(160,20);
  game.particles.push({
    x,y,
    vx: Math.cos(a)*sp + (opts.vx||0),
    vy: Math.sin(a)*sp + (opts.vy||0),
    life: opts.life!=null?opts.life:rand(0.7,0.25),
    maxLife: opts.life!=null?opts.life:rand(0.7,0.25),
    size: opts.size!=null?opts.size:rand(4.5,1.4),
    color: opts.color || '#9be7ff',
    drag: opts.drag!=null?opts.drag:2.6,
    grav: opts.grav||0,
    glow: opts.glow!==false,
    kind: opts.kind||'dot',
    spin: rand(TAU),
    spinV: rand(6,-6),
    additive: opts.additive!==false
  });
}
function burst(x,y,n,color,opts={}){
  for(let i=0;i<n;i++){
    spawnParticle(x,y,{
      angle: rand(TAU),
      speed: opts.speed!=null?rand(opts.speed, opts.speed*0.2):rand(230,30),
      life: opts.life!=null?rand(opts.life, opts.life*0.5):rand(0.65,0.22),
      size: opts.size!=null?rand(opts.size,1):rand(4,1.2),
      color: color,
      kind: opts.kind||'dot',
      grav: opts.grav||0,
      drag: opts.drag!=null?opts.drag:2.8
    });
  }
}
function floater(x,y,text,color='#fff',size=14,vy=-46,life=0.9){
  game.floaters.push({x,y,text,color,size,vy,life,maxLife:life});
}
function addShake(n){ game.shake = Math.min(26, game.shake + n); }
function addFlash(n){ game.flash = Math.min(1, game.flash + n); }

  },

  },

    hp:2, r:13, speed:104, score:22, color:'#c49bff', name:'ORBITER',

  },

  },
