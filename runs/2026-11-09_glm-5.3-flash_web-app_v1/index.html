<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Galley — a story desk for small newsrooms: pitch, edit, slot and publish a paper from one page.">
  <title>Galley — story desk</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1814'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-weight='700' font-size='20' fill='%23faf7f0' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot-inner">
      <div class="boot-mark">G</div>
      <div class="boot-rule"></div>
      <div class="boot-word">GALLEY</div>
      <div class="boot-sub">Setting the type&hellip;</div>
    </div>
  </div>

  <a class="skip-link" href="#view-root">Skip to the desk</a>

  <div id="app" class="app">
    <header id="topbar" class="topbar" aria-label="Galley — story desk"></header>
    <div id="banners" class="banners" aria-live="polite"></div>
    <div class="app-body">
      <nav id="rail" class="rail" aria-label="Desk sections"></nav>
      <main id="view-root" class="view" tabindex="-1"></main>
    </div>
  </div>

  <aside id="drawer-root" class="drawer-root" aria-label="Story panel"></aside>
  <div id="welcome-root"></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-label="Notifications"></div>

  <noscript>
    <div style="max-width:560px;margin:15vh auto;padding:2rem;font-family:Georgia,serif;text-align:center;">
      <h1>Galley needs JavaScript</h1>
      <p>This is a fully offline, single-page application &mdash; every workflow (board, ledger, edition desk) runs in your browser. Enable JavaScript and reload.</p>
    </div>
  </noscript>

  <script src="assets/js/domain.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/views.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
