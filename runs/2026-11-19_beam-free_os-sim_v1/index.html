      <div class="mcard"><div class="mlabel">Memory</div><div class="mval" id="mMem">0%</div><canvas class="mchart" id="mMemChart" height="60"></canvas></div>
      <div class="mcard"><div class="mlabel">Uptime</div><div class="mval" id="mUp">0s</div></div>
      <div class="mcard"><div class="mlabel">Windows</div><div class="mval" id="mWin">0</div></div>
    </div>
    <div style="flex:1;overflow:auto;background:var(--surface2);border-radius:10px;padding:10px">
      <div style="font-weight:600;margin-bottom:8px;font-size:13px">Processes</div>
      <div id="mProc"></div>
    </div>
  `;
  const style=document.createElement('style');
  style.textContent='.mcard{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px}.mlabel{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}.mval{font-size:24px;font-weight:600;margin:4px 0;color:var(--accent)}.mchart{width:100%;display:block}';
  document.head.appendChild(style);
  const cpuHist=[]; const memHist=[];
  let raf=null;
  function drawChart(canvas,hist,color){
    const ctx=canvas.getContext('2d'); const dpr=window.devicePixelRatio||1;
    const rect=canvas.getBoundingClientRect();
    canvas.width=rect.width*dpr; canvas.height=60*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,rect.width,60);
    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath();
    hist.forEach((v,i)=>{ const x=i/(hist.length-1||1)*rect.width; const y=60-v/100*58; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.stroke();
  }
  function tick(){
    const cpu=10+Math.random()*30+ (windows.length*5);
    const mem=30+Math.random()*15;
    cpuHist.push(cpu); if(cpuHist.length>40) cpuHist.shift();
    memHist.push(mem); if(memHist.length>40) memHist.shift();
    root.querySelector('#mCpu').textContent=cpu.toFixed(0)+'%';
    root.querySelector('#mMem').textContent=mem.toFixed(0)+'%';
    root.querySelector('#mUp').textContent=Math.floor(performance.now()/1000)+'s';
    root.querySelector('#mWin').textContent=windows.length;
    drawChart(root.querySelector('#mCpuChart'),cpuHist,'var(--accent)');
    // css var not usable in canvas; use hex
    drawChart2(root.querySelector('#mCpuChart'),cpuHist,'#4ff0c8');
    drawChart2(root.querySelector('#mMemChart'),memHist,'#ff5fa3');
    // processes
    const proc=root.querySelector('#mProc');
    const apps=['kernel','aether-shell','window-manager','files-daemon','audio-engine',...windows.map(w=>w.appId+' ('+w.id+')')];
    proc.innerHTML=apps.map((a,i)=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px;font-family:var(--mono)"><span>${esc(a)}</span><span style="color:var(--text3)">${(Math.random()*5+0.5).toFixed(1)}%</span></div>`).join('');
    raf=requestAnimationFrame(tick);
  }
  function drawChart2(canvas,hist,color){
    const ctx=canvas.getContext('2d'); const dpr=window.devicePixelRatio||1;
    const rect=canvas.getBoundingClientRect();
    canvas.width=rect.width*dpr; canvas.height=60*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,rect.width,60);
    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath();
    hist.forEach((v,i)=>{ const x=i/(hist.length-1||1)*rect.width; const y=60-v/100*56-2; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.stroke();
  }
  tick();
  return {unmount(){ if(raf) cancelAnimationFrame(raf); }};
};

    if(b==='C'){ expr=''; disp.textContent='0'; return; }
    if(b==='⌫'){ expr=expr.slice(0,-1); disp.textContent=expr||'0'; return; }
    if(b==='='){
      try{
        // safe eval-like: use Function with sanitized? Use manual? We'll use Function but sanitize: only digits/operators/dot/space/parens
        if(!/^[0-9+\-*/().%\s^]+$/.test(expr)){ throw new Error('invalid'); }
        const safe=expr.replace(/\^/g,'**');
        const r=new Function('return '+safe)();
        disp.textContent=r; expr=String(r);
      }catch(e){ disp.textContent='Error'; expr=''; SFX.error(); }
      return;
    }
    expr+=b; disp.textContent=expr;
  }
  // keyboard
  const kh=e=>{
    if(e.key>='0'&&e.key<='9') press(e.key);

  window.addEventListener('keydown',kh);
  // only when window focused? simple global; ok
  return {unmount(){ window.removeEventListener('keydown',kh); }};
};

// ---------- Easter egg: Konami code ----------
const konami=[38,38,40,40,37,39,37,39,66,65]; let ki=0;
window.addEventListener('keydown',e=>{
  if(e.keyCode===konami[ki]) ki++; else ki=0;
  if(ki===konami.length){
    ki=0;
    // spawn a spirit orb
    const orb=document.createElement('div');
    orb.style.cssText='position:fixed;bottom:80px;right:40px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(79,240,200,.9),rgba(255,95,163,.4));box-shadow:0 0 40px #4ff0c8;z-index:9000;cursor:pointer;animation:pop .3s';
    orb.title='Spirit';
    document.body.appendChild(orb);
    orb.addEventListener('click',()=>{
      notify('You found the spirit','"The best interface is the one you forget is there." — Aether', 'settings', 6000);
      SFX.success();
      orb.remove();
    });
    setTimeout(()=>{ if(orb.parentNode) orb.remove(); },8000);
  }
});

// ---------- Tray buttons ----------
$('#traySound').addEventListener('click',()=>{ settings.sound=!settings.sound; saveSettings(); updateTraySound(); SFX.click(); });
function updateTraySound(){ const b=$('#traySound'); b.style.opacity=settings.sound?'1':'.4'; }
$('#trayNotif').addEventListener('click',()=>{ notify('Notifications','All caught up!','settings'); });

// ---------- Launcher events ----------
$('#startBtn').addEventListener('click',()=>{ if($('#launcher').classList.contains('show')) closeLauncher(); else openLauncher(); });
$('#launcherSearch').addEventListener('input',e=>renderLauncher(e.target.value));
$('#launcher').addEventListener('click',e=>{ if(e.target.id==='launcher') closeLauncher(); });
