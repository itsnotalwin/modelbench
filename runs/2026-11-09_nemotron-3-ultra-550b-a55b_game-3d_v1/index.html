<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Voxel Resonance - A 3D Phase-Shift Puzzle Game">
<title>Voxel Resonance</title>
<style>
:root {
--bg:#0a0a0f; --fg:#e8e8f0; --muted:#6a6a8a; --accent:#00d4aa; --accent-dim:#00d4aa88;
--warn:#ff6b3d; --card:#12121e; --border:#2a2a3e; --glow:#00d4aa44;
--font-sans:'Inter','SF Pro Text',system-ui,sans-serif; --font-mono:'JetBrains Mono','Fira Code',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:clamp(14px,1.5vw,18px);line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#game-canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.overlay{position:fixed;inset:0;pointer-events:none;z-index:10}
.overlay>*{pointer-events:auto}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:flex-start;padding:clamp(12px,2vh,20px) clamp(16px,3vw,32px);font-family:var(--font-mono);font-size:clamp(11px,1.2vw,14px)}
.hud-panel{display:flex;flex-direction:column;gap:4px}
.hud-label{color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-size:0.7em}
.hud-value{color:var(--fg);font-weight:600;font-size:1.3em;letter-spacing:0.02em}
.hud-value.accent{color:var(--accent)}
.phase-indicator{display:flex;gap:6px;align-items:center;margin-top:8px;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;min-width:180px}
.phase-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;position:relative}
.phase-bar::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--accent),#00ffcc);transform:translateX(-100%);animation:scan 2s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(-100%)}50%{transform:translateX(100%)}100%{transform:translateX(100%)}}
.phase-mark{width:2px;height:14px;background:var(--border);border-radius:1px;transition:all 0.2s}
.phase-mark.active{background:var(--accent);height:18px;box-shadow:0 0 8px var(--glow)}
.phase-mark.current{background:var(--warn);height:20px;box-shadow:0 0 10px #ff6b3d88}

/* Crosshair */
.crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;pointer-events:none;z-index:20;opacity:0;transition:opacity 0.2s}
.crosshair.visible{opacity:1}
.crosshair svg{width:100%;height:100%;stroke:var(--fg);stroke-width:1.5;filter:drop-shadow(0 0 2px #000)}

/* Menus */
.menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,var(--card) 0%,var(--bg) 70%);z-index:100;padding:24px;gap:24px;text-align:center}
.menu.hidden{display:none}
.menu-title{font-size:clamp(2rem,6vw,4rem);font-weight:800;letter-spacing:-0.02em;background:linear-gradient(135deg,var(--fg) 0%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.menu-subtitle{color:var(--muted);font-size:clamp(1rem,2.5vw,1.4rem);max-width:60ch;line-height:1.6}
.menu-buttons{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 24px;font-family:var(--font-sans);font-size:1rem;font-weight:600;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer;transition:all 0.15s;min-height:52px}
.btn:hover:not(:disabled){background:var(--border);border-color:var(--accent);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:linear-gradient(135deg,var(--accent) 0%,#00b894 100%);border-color:transparent;color:#051014}
.btn.primary:hover{box-shadow:0 4px 24px var(--glow)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-icon{width:20px;height:20px;flex-shrink:0}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;width:100%;max-width:600px;text-align:left}
.setting{display:flex;flex-direction:column;gap:8px}
.setting label{font-size:0.85rem;color:var(--muted);display:flex;align-items:center;gap:8px;cursor:pointer}
.setting input[type=range]{flex:1;accent-color:var(--accent);height:6px}
.setting select,.setting input[type=text]{padding:10px 12px;font-family:var(--font-sans);font-size:1rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--fg);width:100%}
.setting select:focus,.setting input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px; border-color:var(--accent)}

/* Progress / Objectives */
.objectives{position:fixed;bottom:clamp(12px,2vh,20px);left:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:8px;z-index:15;max-width:320px;pointer-events:none}
.objective{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 24px #00000088;animation:slideIn 0.3s ease;pointer-events:auto}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.objective.completed{opacity:0.6;border-color:var(--accent)}
.objective.completed .obj-icon{color:var(--accent)}
.objective.current{border-color:var(--accent);box-shadow:0 4px 24px var(--glow)}
.obj-icon{width:20px;height:20px;flex-shrink:0;color:var(--muted)}
.obj-text{font-size:0.9rem;line-height:1.4}
.obj-progress{margin-left:auto;font-family:var(--font-mono);font-size:0.85rem;color:var(--muted)}
.obj-progress.accent{color:var(--accent)}

/* Completion Screen */
.completion{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0a1a14 0%,var(--bg) 70%);z-index:200;padding:24px;gap:32px;text-align:center;opacity:0;pointer-events:none;transition:opacity 0.5s}
.completion.visible{opacity:1;pointer-events:auto}
.completion-icon{width:120px;height:120px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.completion-title{font-size:clamp(2.5rem,6vw,4.5rem);font-weight:800;letter-spacing:-0.02em;background:linear-gradient(135deg,var(--accent) 0%,#00ffcc 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.completion-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(16px,3vw,32px);font-family:var(--font-mono);font-size:clamp(0.9rem,1.5vw,1.2rem);color:var(--muted)}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat-value{color:var(--fg);font-weight:700;font-size:1.5em}
.completion-message{color:var(--muted);max-width:50ch;line-height:1.7;font-size:clamp(1rem,2vw,1.2rem)}

/* Pause overlay */
.pause-overlay{position:fixed;inset:0;background:#000000cc;backdrop-filter:blur(4px);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;opacity:0;pointer-events:none;transition:opacity 0.2s}
.pause-overlay.visible{opacity:1;pointer-events:auto}
.pause-title{font-size:clamp(1.5rem,4vw,2.5rem);font-weight:700;color:var(--fg)}

/* Tooltip / Help */
.help-hint{position:fixed;bottom:clamp(12px,2vh,20px);right:clamp(16px,3vw,32px);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:0.85rem;color:var(--muted);max-width:280px;line-height:1.6;z-index:15;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:none}
.help-hint.visible{opacity:1;transform:translateY(0)}
.help-hint kbd{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-family:var(--font-mono);font-size:0.8em;color:var(--fg);margin:0 2px}

/* Mobile touch controls */
.touch-controls{position:fixed;inset:0;pointer-events:none;z-index:30;display:none}
.touch-controls.visible{display:block}
.touch-stick{position:fixed;bottom:24px;left:24px;width:120px;height:120px;pointer-events:auto;touch-action:none}
.touch-stick-base{position:absolute;inset:0;background:var(--card);border:1px solid var(--border);border-radius:50%;opacity:0.6}
.touch-stick-knob{position:absolute;top:50%;left:50%;width:50px;height:50px;background:var(--accent);border-radius:50%;transform:translate(-50%,-50%);opacity:0.8;transition:transform 0.05s;pointer-events:none}
.touch-look{position:fixed;inset:0;pointer-events:auto;touch-action:none;z-index:29}
.touch-btn{position:fixed;bottom:24px;right:24px;width:64px;height:64px;background:var(--card);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);opacity:0.8;pointer-events:auto;touch-action:none;transition:all 0.1s}
.touch-btn:active{opacity:1;transform:scale(0.95);background:var(--accent);color:#051014}
.touch-btn.scan{right:104px}
.touch-btn.phase{right:184px}

/* Quality indicator */
.quality-badge{position:fixed;top:12px;right:12px;padding:4px 10px;background:var(--card);border:1px solid var(--border);border-radius:20px;font-family:var(--font-mono);font-size:0.75rem;color:var(--muted);z-index:15;opacity:0.7}

/* Reduced motion */
@media (prefers-reduced-motion:reduce){
*, *::before, *::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}
.phase-bar::before{animation:none;transform:translateX(0)}
}

/* High contrast */
@media (prefers-contrast:high){
:root{--border:#888;--muted:#ccc;--card:#1a1a2e}
.btn{border-width:2px}
}
</style>
</head>
<body>
<canvas id="game-canvas" aria-hidden="true"></canvas>

<div class="overlay">
<div class="hud" role="status" aria-live="polite" aria-label="Game status">
<div class="hud-panel">
<div class="hud-label">Resonances</div>
<div class="hud-value accent" id="hud-resonances">0 / 0</div>
</div>
<div class="hud-panel" style="align-items:flex-end">
<div class="hud-label">Phase</div>
<div class="hud-value" id="hud-phase">1.0</div>
<div class="phase-indicator" role="img" aria-label="Phase frequency indicator">
<div class="phase-bar" id="phase-bar"></div>
</div>
</div>
</div>

<svg class="crosshair" id="crosshair" viewBox="0 0 24 24" aria-hidden="true"><g stroke-linecap="round"><circle cx="12" cy="12" r="6" fill="none"/><line x1="12" y1="4" x2="12" y2="7"/><line x1="12" y1="17" x2="12" y2="20"/><line x1="4" y1="12" x2="7" y2="12"/><line x1="17" y1="12" x2="20" y2="12"/></g></svg>

<div class="objectives" id="objectives" role="region" aria-label="Objectives" aria-live="polite"></div>

<div class="help-hint" id="help-hint" aria-hidden="true"></div>

<div class="quality-badge" id="quality-badge" aria-live="polite">Quality: Auto</div>
</div>

<div class="menu" id="main-menu" role="dialog" aria-modal="true" aria-labelledby="menu-title">
<h1 class="menu-title" id="menu-title">Voxel Resonance</h1>
<p class="menu-subtitle">Tune your scanner. Reveal the hidden architecture. Escape the resonance cascade.</p>
<div class="menu-buttons">
<button class="btn primary" id="btn-start" type="button"><svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>New Game</button>
<button class="btn" id="btn-continue" type="button" disabled><svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v12h16V6H4zm5 7.5v-5l5 2.5-5 2.5z"/></svg>Continue</button>
<button class="btn" id="btn-settings" type="button"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>Settings</button>
</div>
</div>

<div class="menu hidden" id="settings-menu" role="dialog" aria-modal="true" aria-labelledby="settings-title">
<h1 class="menu-title" id="settings-title">Settings</h1>
<div class="settings-grid">
<div class="setting">
<label>Graphics Quality
<select id="setting-quality" aria-label="Graphics quality preset">
<option value="auto">Auto</option>
<option value="low">Low</option>
<option value="medium">Medium</option>
<option value="high">High</option>
<option value="ultra">Ultra</option>
</select>
</label>
</div>

<input type="range" id="setting-sensitivity" min="0.3" max="3" step="0.1" value="1" aria-label="Mouse sensitivity">
<span id="sens-value">1.0x</span>
</label>
</div>
<div class="setting">
<label>FOV
<input type="range" id="setting-fov" min="60" max="110" step="1" value="75" aria-label="Field of view">
<span id="fov-value">75°</span>
</label>
</div>
<div class="setting">
<label>Master Volume
<input type="range" id="setting-volume" min="0" max="1" step="0.05" value="0.7" aria-label="Master volume">
<span id="vol-value">70%</span>
</label>
</div>
<div class="setting">
<label>SFX Volume
<input type="range" id="setting-sfx" min="0" max="1" step="0.05" value="0.8" aria-label="Sound effects volume">
<span id="sfx-value">80%</span>
</label>
</div>
<div class="setting">
<label>Music Volume
<input type="range" id="setting-music" min="0" max="1" step="0.05" value="0.4" aria-label="Music volume">

</label>
</div>

</div>
<div class="setting">

</div>
<div class="setting">

</div>
<div class="setting">
<label><input type="checkbox" id="setting-particles" aria-label="Particles" checked> Particle Effects</label>
</div>
</div>
<div class="menu-buttons">
<button class="btn" id="btn-back" type="button">Back</button>
</div>
</div>

<div class="menu hidden" id="pause-menu" role="dialog" aria-modal="true" aria-labelledby="pause-title">
<div class="pause-overlay visible" style="position:static;background:none;backdrop-filter:none">

<button class="btn" id="btn-quit" type="button"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Main Menu</button>
</div>
</div>
</div>

<div class="completion" id="completion-screen" role="dialog" aria-modal="true" aria-labelledby="completion-title">
<svg class="completion-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="30" stroke="var(--accent)" stroke-width="4" stroke-dasharray="188" stroke-dashoffset="188" style="animation:dash 1.5s ease-out forwards"><animate attributeName="stroke-dashoffset" from="188" to="0" dur="1.5s" fill="freeze"/></svg>
<h1 class="completion-title" id="completion-title">Resonance Stabilized</h1>
<div class="completion-stats" id="completion-stats"></div>
<p class="completion-message" id="completion-message"></p>
<div class="menu-buttons" style="max-width:320px">
<button class="btn primary" id="btn-next" type="button">Next Sector</button>
<button class="btn" id="btn-replay" type="button">Replay Sector</button>
<button class="btn" id="btn-menu" type="button">Main Menu</button>
</div>
</div>

<div class="touch-controls" id="touch-controls" aria-hidden="true">
<div class="touch-stick" id="touch-stick" role="img" aria-label="Movement joystick"><div class="touch-stick-base"></div><div class="touch-stick-knob"></div></div>

<button class="touch-btn phase" id="touch-phase" aria-label="Phase shift"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v6M12 15v6M4 12h6M14 12h6"/><circle cx="12" cy="12" r="3"/></svg></button>
<button class="touch-btn" id="touch-jump" aria-label="Jump" style="right:104px;bottom:104px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
</div>

</script>
<script type="module">
// ============================================
// VOXEL RESONANCE - Complete 3D Game
// ============================================

import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// --- Configuration ---
const CONFIG = {

},

},

],

};

// --- Quality Presets ---
const QUALITY = {
low: {shadows:false,ssao:false,bloom:false,particles:50,reflection:false,lodBias:2},

};

// --- Global State ---
const state = {

},

};

// --- Three.js Core ---
let renderer, scene, camera, controls, clock;
const raycaster = new THREE.Raycaster();
const playerCollider = new THREE.Sphere();
const phaseMaterials = [];
const phaseGeometries = [];
let levelMeshes = {static:[],phased:[],crystals:[],exit:null};
let scanEffect, bloomPass, composer;
let audioCtx, audioBuffers = {}, musicSource, musicGain, sfxGain, masterGain;
let animationId = null;

// --- DOM Elements ---
const els = {
canvas: document.getElementById('game-canvas'),
crosshair: document.getElementById('crosshair'),
hudResonances: document.getElementById('hud-resonances'),
hudPhase: document.getElementById('hud-phase'),
phaseBar: document.getElementById('phase-bar'),
objectives: document.getElementById('objectives'),
helpHint: document.getElementById('help-hint'),

// ============================================
async function initAudio() {
try {
audioCtx = new (window.AudioContext||window.webkitAudioContext)();
masterGain = audioCtx.createGain(); masterGain.gain.value = state.settings.volume; masterGain.connect(audioCtx.destination);
musicGain = audioCtx.createGain(); musicGain.gain.value = state.settings.music; musicGain.connect(masterGain);
sfxGain = audioCtx.createGain(); sfxGain.gain.value = state.settings.sfx; sfxGain.connect(masterGain);

// Generate procedural sounds
audioBuffers.click = generateTone(800, 0.05, 'square', 0.3);
audioBuffers.scan = generateScanSound();
audioBuffers.phaseShift = generatePhaseShift();
audioBuffers.crystal = generateCrystalSound();
audioBuffers.footstep = generateFootstep();
audioBuffers.jump = generateTone(200, 0.1, 'sine', 0.2);
audioBuffers.land = generateTone(150, 0.08, 'sine', 0.15);
audioBuffers.ambience = generateAmbience();
audioBuffers.complete = generateCompletionSound();

} catch(e) { console.warn('Audio init failed:', e); }
}
function generateTone(freq, dur, type='sine', gain=1) {
const sr = audioCtx.sampleRate;
const len = sr * dur;
const buf = audioCtx.createBuffer(1, len, sr);
const data = buf.getChannelData(0);
for(let i=0;i<len;i++) {
const t = i/sr;
const env = Math.exp(-t*12);
let sample = 0;
if(type==='sine') sample = Math.sin(2*Math.PI*freq*t);
else if(type==='square') sample = Math.sin(2*Math.PI*freq*t)>0?1:-1;
else if(type==='saw') sample = 2*(t*freq-Math.floor(t*freq+0.5));
data[i] = sample * env * gain;
}
return buf;
}
function generateScanSound() {
const sr = audioCtx.sampleRate;
const dur = 0.8;
const len = sr * dur;
const buf = audioCtx.createBuffer(1, len, sr);
const data = buf.getChannelData(0);
for(let i=0;i<len;i++) {
const t = i/sr;
const prog = t/dur;
const freq = 200 + 1200*prog;
const env = Math.sin(Math.PI*prog) * Math.exp(-t*3);
data[i] = Math.sin(2*Math.PI*freq*t) * env * 0.4;
}
return buf;
}
function generatePhaseShift() {
const sr = audioCtx.sampleRate;
const dur = 0.6;
const len = sr * dur;
const buf = audioCtx.createBuffer(1, len, sr);
const data = buf.getChannelData(0);
for(let i=0;i<len;i++) {
const t = i/sr;
const prog = t/dur;
const freq = 400*(1-prog) + 100*prog;
const env = Math.exp(-t*5) * (1-prog);
data[i] = (Math.sin(2*Math.PI*freq*t) + 0.5*Math.sin(2*Math.PI*freq*2*t)) * env * 0.5;
}
return buf;
}
function generateCrystalSound() {
const sr = audioCtx.sampleRate;
const dur = 1.2;
const len = sr * dur;
const buf = audioCtx.createBuffer(1, len, sr);
const data = buf.getChannelData(0);
const notes = [523.25, 659.25, 783.99, 1046.5];
for(let i=0;i<len;i++) {
const t = i/sr;
let sample = 0;
notes.forEach((f,n)=> {
const delay = n*0.15;
if(t>delay) sample += Math.sin(2*Math.PI*f*(t-delay)) * Math.exp(-(t-delay)*4);
});
data[i] = sample * 0.3;
}
return buf;
}
function generateFootstep() {
const sr = audioCtx.sampleRate;
const dur = 0.12;
const len = sr * dur;
const buf = audioCtx.createBuffer(1, len, sr);
const data = buf.getChannelData(0);
for(let i=0;i<len;i++) {
const t = i/sr;
const env = Math.exp(-t*40);
data[i] = (Math.random()*2-1) * env * 0.15;
}
return buf;
}
function generateAmbience() {
const sr = audioCtx.sampleRate;
const dur = 30;
const len = sr * dur;
const buf = audioCtx.createBuffer(2, len, sr);
for(let ch=0;ch<2;ch++) {
const data = buf.getChannelData(ch);
for(let i=0;i<len;i++) {
const t = i/sr;
let sample = 0;
[40,60,80,120,160].forEach(f=> sample += Math.sin(2*Math.PI*f*t + Math.random()*6) * 0.02);
data[i] = sample * Math.sin(t*0.1) * 0.3;
}
}
return buf;
}
function generateCompletionSound() {
const sr = audioCtx.sampleRate;
const dur = 2.5;
const len = sr * dur;
const buf = audioCtx.createBuffer(1, len, sr);
const data = buf.getChannelData(0);
const notes = [261.63, 329.63, 392, 523.25, 659.25, 783.99, 1046.5];
for(let i=0;i<len;i++) {
const t = i/sr;
let sample = 0;
notes.forEach((f,n)=> {
const delay = n*0.12;
if(t>delay) sample += Math.sin(2*Math.PI*f*(t-delay)) * Math.exp(-(t-delay)*2);
});
data[i] = sample * 0.25;
}
return buf;
}
function playSfx(name, opts={}) {
if(!audioBuffers[name]||!sfxGain) return;
const src = audioCtx.createBufferSource();
src.buffer = audioBuffers[name];
const gain = audioCtx.createGain();
gain.gain.value = (opts.gain??1) * state.settings.sfx;
src.connect(gain).connect(sfxGain);
if(opts.rate) src.playbackRate.value = opts.rate;
if(opts.pan) { const p=audioCtx.createStereoPanner(); p.pan.value=opts.pan; gain.connect(p).connect(sfxGain); }
src.start(audioCtx.currentTime + (opts.delay||0));
return src;
}
function startMusic() {
if(musicSource) musicSource.stop();
musicSource = audioCtx.createBufferSource();
musicSource.buffer = audioBuffers.ambience;
musicSource.loop = true;
musicSource.connect(musicGain);
musicSource.start();
}
function stopMusic() { if(musicSource) { musicSource.stop(); musicSource=null; } }
function setMasterVolume(v) { state.settings.volume=v; if(masterGain) masterGain.gain.value=v; els.volValue.textContent=Math.round(v*100)+'%'; }
function setMusicVolume(v) { state.settings.music=v; if(musicGain) musicGain.gain.value=v; els.musicValue.textContent=Math.round(v*100)+'%'; }
function setSfxVolume(v) { state.settings.sfx=v; if(sfxGain) sfxGain.gain.value=v; els.sfxValue.textContent=Math.round(v*100)+'%'; }

// ============================================
// SHADERS
// ============================================
const phaseVertexShader = `
varying vec3 vWorldPos; varying vec3 vNormal; varying vec2 vUv;
uniform float uPhase; uniform float uTime; uniform float uPhaseOffset;
void main() {
vUv = uv;
vNormal = normalize(normalMatrix * normal);
vec4 worldPos = modelMatrix * vec4(position, 1.0);
vWorldPos = worldPos.xyz;
float phaseDiff = mod(uPhase - uPhaseOffset + 4.0, 4.0);
float reveal = smoothstep(0.3, 0.7, 1.0 - phaseDiff);
gl_Position = projectionMatrix * viewMatrix * worldPos;
}
`;

const phaseFragmentShader = `
varying vec3 vWorldPos; varying vec3 vNormal; varying vec2 vUv;
uniform float uPhase; uniform float uTime; uniform float uPhaseOffset;
uniform vec3 uBaseColor; uniform vec3 uGlowColor; uniform float uIntensity;
void main() {
float phaseDiff = mod(uPhase - uPhaseOffset + 4.0, 4.0);
float reveal = smoothstep(0.2, 0.6, 1.0 - phaseDiff);
float pulse = sin(uTime * 3.0 + vWorldPos.x * 0.5 + vWorldPos.z * 0.5) * 0.15 + 0.85;
vec3 color = mix(vec3(0.05), uBaseColor, reveal * pulse);
float fresnel = pow(1.0 - max(0.0, dot(normalize(vNormal), normalize(vWorldPos - cameraPosition))), 3.0);
color += uGlowColor * fresnel * reveal * 0.6 * pulse;
float scanline = sin(vWorldPos.y * 8.0 + uTime * 10.0) * 0.03;
color += vec3(scanline) * reveal;
gl_FragColor = vec4(color, reveal * uIntensity);
}
`;

const crystalVertexShader = `
varying vec3 vWorldPos; varying vec3 vNormal; varying vec2 vUv;
uniform float uTime; uniform float uPhase; uniform float uPhaseOffset;
void main() {
vUv = uv;
vNormal = normalize(normalMatrix * normal);
vec4 worldPos = modelMatrix * vec4(position, 1.0);
vWorldPos = worldPos.xyz;
gl_Position = projectionMatrix * viewMatrix * worldPos;
}
`;

const crystalFragmentShader = `
varying vec3 vWorldPos; varying vec3 vNormal; varying vec2 vUv;
uniform float uTime; uniform float uPhase; uniform float uPhaseOffset;
uniform vec3 uColor; uniform float uRevealed;
void main() {
float phaseDiff = mod(uPhase - uPhaseOffset + 4.0, 4.0);
float reveal = uRevealed > 0.5 ? 1.0 : smoothstep(0.2, 0.6, 1.0 - phaseDiff);
float pulse = sin(uTime * 4.0) * 0.2 + 0.8;
float spin = uTime * 0.5;
vec3 color = uColor * pulse * reveal;
float fresnel = pow(1.0 - max(0.0, dot(normalize(vNormal), normalize(vWorldPos - cameraPosition))), 4.0);
color += vec3(1.0, 1.0, 1.0) * fresnel * reveal * 0.8;
float sparkle = sin(vWorldPos.x * 20.0 + uTime * 15.0) * sin(vWorldPos.z * 20.0 + uTime * 15.0) * 0.5 + 0.5;
color += vec3(1.0) * sparkle * reveal * 0.3;
gl_FragColor = vec4(color, reveal);
}
`;

const scanVertexShader = `
varying vec3 vWorldPos; varying vec3 vNormal;
void main() {
vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
vNormal = normalize(normalMatrix * normal);
gl_Position = projectionMatrix * viewMatrix * vec4(vWorldPos, 1.0);
}
`;

const scanFragmentShader = `
varying vec3 vWorldPos; varying vec3 vNormal;
uniform float uTime; uniform vec3 uScannerPos; uniform float uScanProgress; uniform float uPhase;
void main() {
float dist = length(vWorldPos - uScannerPos);
float wave = smoothstep(uScanProgress - 0.15, uScanProgress, dist * 0.05) - smoothstep(uScanProgress, uScanProgress + 0.15, dist * 0.05);
float phaseMatch = 1.0 - abs(mod(uPhase + 0.5, 1.0) - 0.5) * 2.0;
float intensity = wave * phaseMatch * 0.8;
vec3 color = mix(vec3(0.0, 0.8, 0.6), vec3(1.0, 1.0, 0.5), phaseMatch);
gl_FragColor = vec4(color, intensity);
}
`;

// PHASE MATERIALS
// ============================================
function createPhaseMaterials() {
const phaseColors = [
{base:new THREE.Color(0x00d4aa), glow:new THREE.Color(0x00ffcc)},
{base:new THREE.Color(0x0088ff), glow:new THREE.Color(0x44aaff)},
{base:new THREE.Color(0xff6b3d), glow:new THREE.Color(0xffaa44)},
{base:new THREE.Color(0xaa44ff), glow:new THREE.Color(0xcc88ff)}
];
for(let i=0;i<CONFIG.phases;i++) {
const mat = new THREE.ShaderMaterial({
vertexShader: phaseVertexShader,
fragmentShader: phaseFragmentShader,
uniforms: {
uPhase:{value:0}, uTime:{value:0}, uPhaseOffset:{value:i},
uBaseColor:{value:phaseColors[i].base}, uGlowColor:{value:phaseColors[i].glow}, uIntensity:{value:1}
},
transparent:true, depthWrite:true, side:THREE.DoubleSide
});
phaseMaterials.push(mat);
}
const crystalMat = new THREE.ShaderMaterial({
vertexShader: crystalVertexShader,
fragmentShader: crystalFragmentShader,
uniforms: {
uTime:{value:0}, uPhase:{value:0}, uPhaseOffset:{value:0},
uColor:{value:new THREE.Color(0x00ffcc)}, uRevealed:{value:0}
},
transparent:true, depthWrite:false, side:THREE.DoubleSide
});
phaseMaterials.push(crystalMat); // index 4

const scanMat = new THREE.ShaderMaterial({
vertexShader: scanVertexShader,
fragmentShader: scanFragmentShader,
uniforms: {uTime:{value:0}, uScannerPos:{value:new THREE.Vector3()}, uScanProgress:{value:0}, uPhase:{value:0}},
transparent:true, depthWrite:false, side:THREE.DoubleSide
});
phaseMaterials.push(scanMat); // index 5
}

function generateLevel(levelIndex) {
clearLevel();
const lv = CONFIG.levels[levelIndex];
state.totalCrystals = lv.crystals;
state.crystals = 0;
state.collected.clear();
state.levelStartTime = performance.now();
updateHUD();

const themeColors = [
{bg:0x080810, fog:0x080810, ground:0x1a1a2e, accent:0x00d4aa},
{bg:0x051018, fog:0x030810, ground:0x0d1f2e, accent:0x0088ff},
{bg:0x180510, fog:0x080308, ground:0x2e0d1f, accent:0xff6b3d},
{bg:0x0a0518, fog:0x050308, ground:0x1a0d2e, accent:0xaa44ff},
{bg:0x030303, fog:0x000000, ground:0x0a0a0a, accent:0xffffff}
];
const theme = themeColors[lv.theme%themeColors.length];

scene.background = new THREE.Color(theme.bg);
scene.fog = new THREE.FogExp2(theme.fog, 0.006 + lv.complexity*0.001);

// Ground plane
const groundGeo = new THREE.PlaneGeometry(lv.size*2, lv.size*2, 64, 64);
const groundMat = new THREE.MeshStandardMaterial({
color:theme.ground, roughness:0.9, metalness:0.1,
normalMap:createNoiseNormalMap(256)
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
ground.userData.phase = -1;
scene.add(ground);
levelMeshes.static.push(ground);

// Perlin noise for terrain
function perlin2D(x,z,scale=1,octaves=4) {
let val=0, amp=1, freq=scale, max=0;
for(let i=0;i<octaves;i++) {
val += noise2D(x*freq, z*freq) * amp;
max += amp;
amp *= 0.5; freq *= 2;
}
return val/max;
}
function noise2D(x,z) {
const X=Math.floor(x)&255, Z=Math.floor(z)&255;
x-=Math.floor(x); z-=Math.floor(z);
const u=fade(x), v=fade(z);
const A=perm[X]+Z, B=perm[X+1]+Z;
const n00 = grad(perm[A], x, z);
const n10 = grad(perm[B], x-1, z);
const n01 = grad(perm[A+1], x, z-1);
const n11 = grad(perm[B+1], x-1, z-1);
const ix0 = lerp(n00, n10, u);
const ix1 = lerp(n01, n11, u);
return lerp(ix0, ix1, v);
}
const perm = new Array(512);
for(let i=0;i<256;i++) perm[i]=i;
for(let i=255;i>0;i--) {const j=Math.floor(Math.random()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]];}
for(let i=0;i<256;i++) perm[i+256]=perm[i];
function fade(t){return t*t*t*(t*(t*6-15)+10);}
function lerp(a,b,t){return a+t*(b-a);}
function grad(hash,x,z){const h=hash&3; const u=h<2?x:z; const v=h<2?z:x; return ((h&1)?-u:u)+((h&2)?-v:v);}

// Generate terrain height
const positions = groundGeo.attributes.position;
for(let i=0;i<positions.count;i++) {
const x = positions.getX(i);
const z = positions.getY(i);
const h = perlin2D(x*0.05, z*0.05, 1, 3) * (1.5 + lv.complexity*0.5);
positions.setZ(i, h);
}
groundGeo.computeVertexNormals();
groundGeo.attributes.position.needsUpdate = true;

// Platforms & structures
const platformCount = 20 + lv.complexity * 15;
for(let i=0;i<platformCount;i++) {
const phase = Math.floor(Math.random()*CONFIG.phases);
const size = 3 + Math.random()*6;
const height = 2 + Math.random()*(8+lv.complexity*2);
const x = (Math.random()-0.5)*lv.size*1.5;
const z = (Math.random()-0.5)*lv.size*1.5;
createPlatform(x, height, z, size, phase, lv.theme);
}

// Vertical columns
const columnCount = 8 + lv.complexity * 5;
for(let i=0;i<columnCount;i++) {
const phase = Math.floor(Math.random()*CONFIG.phases);
const height = 5 + Math.random()*15;
const radius = 0.8 + Math.random()*1.5;
const x = (Math.random()-0.5)*lv.size*1.5;
const z = (Math.random()-0.5)*lv.size*1.5;
createColumn(x, 0, z, radius, height, phase);
}

// Bridges between phases
if(lv.complexity>=2) {
const bridgeCount = 3 + lv.complexity;
for(let i=0;i<bridgeCount;i++) {
const p1 = Math.floor(Math.random()*CONFIG.phases);
const p2 = (p1+1+Math.floor(Math.random()*(CONFIG.phases-1)))%CONFIG.phases;
const x = (Math.random()-0.5)*lv.size;
const z = (Math.random()-0.5)*lv.size;
const y = 3 + Math.random()*8;
createBridge(x, y, z, p1, p2);
}
}

// Crystals
for(let i=0;i<lv.crystals;i++) {
let attempts=0;
let x,z,y,valid=false;
while(!valid&&attempts<50) {
x = (Math.random()-0.5)*lv.size*1.3;
z = (Math.random()-0.5)*lv.size*1.3;
y = 1.5 + Math.random()*10;
valid = true;
for(const c of levelMeshes.crystals) {
if(c.position.distanceTo(new THREE.Vector3(x,y,z))<4) {valid=false;break;}
}
attempts++;
}
if(valid) createCrystal(x, y, z, Math.floor(Math.random()*CONFIG.phases), i);
}

// Exit portal
const exitX = (Math.random()-0.5)*lv.size*0.8;
const exitZ = (Math.random()-0.5)*lv.size*0.8;
createExit(exitX, 2, exitZ);

// Lighting
setupLighting(theme, lv);

// Particles
if(state.settings.particles) createParticles(theme, lv);
}
function createPlatform(x,y,z,size,phase,theme) {
const geo = new THREE.BoxGeometry(size, 0.4, size);
const mat = phaseMaterials[phase].clone();
const mesh = new THREE.Mesh(geo, mat);
mesh.position.set(x, y, z);
mesh.castShadow = true;
mesh.receiveShadow = true;
mesh.userData.phase = phase;
mesh.userData.type = 'platform';
scene.add(mesh);
levelMeshes.phased.push(mesh);
}
function createColumn(x,y,z,radius,height,phase) {
const geo = new THREE.CylinderGeometry(radius*0.8, radius, height, 8);
const mat = phaseMaterials[phase].clone();
const mesh = new THREE.Mesh(geo, mat);
mesh.position.set(x, y+height/2, z);
mesh.castShadow = true;
mesh.receiveShadow = true;
mesh.userData.phase = phase;
mesh.userData.type = 'column';
scene.add(mesh);
levelMeshes.phased.push(mesh);
}
function createBridge(x,y,z,p1,p2) {
const geo = new THREE.BoxGeometry(12, 0.3, 2);
const mat1 = phaseMaterials[p1].clone();
const mat2 = phaseMaterials[p2].clone();
const mesh1 = new THREE.Mesh(geo, mat1);
const mesh2 = new THREE.Mesh(geo, mat2);
mesh1.position.set(x, y, z);
mesh2.position.set(x, y, z);
mesh1.rotation.y = Math.random()*Math.PI;
mesh2.rotation.y = mesh1.rotation.y;
mesh1.userData.phase = p1; mesh1.userData.type='bridge';
mesh2.userData.phase = p2; mesh2.userData.type='bridge';
scene.add(mesh1); scene.add(mesh2);
levelMeshes.phased.push(mesh1, mesh2);
}
function createCrystal(x,y,z,phase,index) {
const geo = new THREE.OctahedronGeometry(0.6, 1);
const mat = phaseMaterials[4].clone();
mat.uniforms.uPhaseOffset.value = phase;
const mesh = new THREE.Mesh(geo, mat);
mesh.position.set(x, y, z);
mesh.userData = {phase, index, collected:false, bobOffset:Math.random()*Math.PI*2};
mesh.castShadow = true;
scene.add(mesh);
levelMeshes.crystals.push(mesh);
}
function createExit(x,y,z) {
const geo = new THREE.TorusGeometry(2, 0.3, 16, 32);
const mat = new THREE.MeshBasicMaterial({color:0x00ffcc, transparent:true, opacity:0.6, side:THREE.DoubleSide});
const mesh = new THREE.Mesh(geo, mat);
mesh.position.set(x, y+2, z);
mesh.rotation.x = Math.PI/2;
mesh.userData = {type:'exit', active:false};
scene.add(mesh);
levelMeshes.exit = mesh;

// Particle ring
const pGeo = new THREE.BufferGeometry();
const count = 100;
const positions = new Float32Array(count*3);
for(let i=0;i<count;i++) {
const ang = (i/count)*Math.PI*2;
const r = 2 + Math.random()*0.5;
positions[i*3] = Math.cos(ang)*r;
positions[i*3+1] = (Math.random()-0.5)*4;
positions[i*3+2] = Math.sin(ang)*r;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
const pMat = new THREE.PointsMaterial({color:0x00ffcc, size:0.15, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending});
const particles = new THREE.Points(pGeo, pMat);
particles.position.copy(mesh.position);
scene.add(particles);
mesh.userData.particles = particles;
}
function setupLighting(theme, lv) {
const hemi = new THREE.HemisphereLight(theme.accent, 0x080810, 0.4);
scene.add(hemi);

const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(lv.size*0.5, lv.size, lv.size*0.3);

dir.shadow.bias = -0.0005;
dir.shadow.normalBias = 0.02;
scene.add(dir);

const dir2 = new THREE.DirectionalLight(theme.accent, 0.3);
dir2.position.set(-lv.size*0.3, lv.size*0.5, -lv.size*0.5);

for(let i=0;i<4;i++) {

pl.castShadow = true;

}
function createParticles(theme, lv) {
const count = Math.min(500, 100 + lv.complexity*100);
const geo = new THREE.BufferGeometry();
const positions = new Float32Array(count*3);
const sizes = new Float32Array(count);
const alphas = new Float32Array(count);
for(let i=0;i<count;i++) {
positions[i*3] = (Math.random()-0.5)*lv.size*2;
positions[i*3+1] = Math.random()*20;
positions[i*3+2] = (Math.random()-0.5)*lv.size*2;
sizes[i] = Math.random()*0.3+0.1;
alphas[i] = Math.random()*0.5+0.1;
}
geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
geo.setAttribute('size', new THREE.BufferAttribute(sizes,1));
geo.setAttribute('alpha', new THREE.BufferAttribute(alphas,1));
const mat = new THREE.PointsMaterial({
color:theme.accent, size:0.3, transparent:true, opacity:0.4,
blending:THREE.AdditiveBlending, depthWrite:false, vertexColors:false
});
const particles = new THREE.Points(geo, mat);
particles.userData = {type:'ambient', positions, originalY:positions.slice()};
scene.add(particles);
levelMeshes.static.push(particles);
}
function createNoiseNormalMap(size) {
const canvas = document.createElement('canvas');
canvas.width = canvas.height = size;
const ctx = canvas.getContext('2d');
const imgData = ctx.createImageData(size, size);
for(let y=0;y<size;y++) for(let x=0;x<size;x++) {
const n = noise2D(x*0.1, y*0.1);
const idx = (y*size+x)*4;
imgData.data[idx] = 128;
imgData.data[idx+1] = 128;
imgData.data[idx+2] = 255;
imgData.data[idx+3] = 255;
}

const tex = new THREE.CanvasTexture(canvas);

}
function clearLevel() {
[...levelMeshes.static, ...levelMeshes.phased, ...levelMeshes.crystals].forEach(m=>{scene.remove(m);m.geometry.dispose();if(m.material.dispose) m.material.dispose(); else if(Array.isArray(m.material)) m.material.forEach(mat=>mat.dispose());});
if(levelMeshes.exit) {scene.remove(levelMeshes.exit); levelMeshes.exit.geometry.dispose(); levelMeshes.exit.material.dispose();}
levelMeshes = {static:[],phased:[],crystals:[],exit:null};

// ============================================
// PLAYER MOVEMENT & PHYSICS
// ============================================
function updatePlayer(delta) {
if(state.paused||!state.running) return;

const speed = state.input.crouch ? CONFIG.player.crouchSpeed : (state.input.run ? CONFIG.player.runSpeed : CONFIG.player.walkSpeed);
const targetHeight = state.input.crouch ? CONFIG.player.crouchHeight : CONFIG.player.height;
const eyeHeight = state.input.crouch ? CONFIG.player.crouchHeight * 0.9 : CONFIG.player.eyeHeight;

// Horizontal movement
const forward = new THREE.Vector3();
camera.getWorldDirection(forward);
forward.y = 0; forward.normalize();
const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0));

const inputDir = new THREE.Vector3();
inputDir.addScaledVector(forward, -state.input.forward);
inputDir.addScaledVector(right, state.input.right);
if(inputDir.length()>0) inputDir.normalize();

const accel = state.onGround ? 40 : 40 * CONFIG.player.airControl;
state.velocity.addScaledVector(inputDir, accel * delta);

const horizVel = new THREE.Vector3(state.velocity.x, 0, state.velocity.z);
const horizSpeed = horizVel.length();
if(horizSpeed > speed) {
horizVel.normalize().multiplyScalar(speed);
state.velocity.x = horizVel.x; state.velocity.z = horizVel.z;
}
if(horizSpeed < 0.1 && inputDir.length()===0) {
state.velocity.x *= Math.pow(0.01, delta);
state.velocity.z *= Math.pow(0.01, delta);
}

// Jump
if(state.input.jump && state.onGround) {
state.velocity.y = CONFIG.player.jumpVelocity;
state.onGround = false;
playSfx('jump', {gain:0.5});
}

// Gravity
state.velocity.y -= CONFIG.player.gravity * delta;
state.velocity.y = Math.max(state.velocity.y, CONFIG.player.terminalVelocity);

// Move with collision
const moveDelta = state.velocity.clone().multiplyScalar(delta);
playerCollider.center.copy(camera.position);
playerCollider.center.y -= CONFIG.player.eyeHeight - CONFIG.player.height/2;
playerCollider.radius = CONFIG.player.radius;

const newPos = playerCollider.center.clone().add(moveDelta);
const collision = checkCollisions(playerCollider.center, newPos);
if(collision) {
moveDelta.copy(collision.safePos).sub(playerCollider.center);
if(collision.hitNormal.y > 0.7) state.onGround = true;
if(collision.hitNormal.y < -0.7) state.velocity.y = 0;
}

// Step up
if(state.onGround && moveDelta.length()>0.01) {
const stepRay = new THREE.Raycaster(newPos.clone().add(new THREE.Vector3(0,CONFIG.player.stepHeight,0)), new THREE.Vector3(0,-1,0));
stepRay.far = CONFIG.player.stepHeight + 0.1;
const hits = stepRay.intersectObjects(levelMeshes.static.concat(levelMeshes.phased.filter(m=>isPhaseVisible(m))), true);
if(hits.length>0 && hits[0].distance < CONFIG.player.stepHeight) {
moveDelta.y = hits[0].distance - CONFIG.player.stepHeight;
}
}

camera.position.add(moveDelta);
camera.position.y = Math.max(camera.position.y, eyeHeight);

// Footstep sounds
if(state.onGround && horizSpeed > 1.5) {
state.footstepTimer = (state.footstepTimer||0) - delta;
if(state.footstepTimer <= 0) {
playSfx('footstep', {gain:0.3+horizSpeed*0.05, rate:0.8+horizSpeed*0.05});
state.footstepTimer = 0.35 / (horizSpeed/CONFIG.player.walkSpeed);
}
}

// Smooth camera height
camera.position.y += (eyeHeight - (camera.position.y - (newPos.y - CONFIG.player.height/2))) * CONFIG.player.stepSmooth * delta;

// Update crosshair visibility
els.crosshair.classList.toggle('visible', state.pointerLocked && state.running && !state.paused);
}
function checkCollisions(from, to) {
const dir = new THREE.Vector3().subVectors(to, from);
const dist = dir.length();
if(dist < 0.001) return null;
dir.normalize();

raycaster.set(from, dir);
raycaster.far = dist + 0.1;

const checkObjects = levelMeshes.static.concat(levelMeshes.phased.filter(m=>isPhaseVisible(m)));
const hits = raycaster.intersectObjects(checkObjects, true);

if(hits.length > 0 && hits[0].distance < dist + 0.05) {
const hit = hits[0];
const safePos = hit.point.clone().addScaledVector(hit.face.normal, CONFIG.player.radius + 0.02);
return {hitNormal:hit.face.normal, safePos};
}
return null;
}
function isPhaseVisible(mesh) {
if(!mesh.userData.phase) return true;
const phase = mesh.userData.phase;
const currentPhase = Math.round(state.phase);
return phase === currentPhase || phase === (currentPhase+1)%CONFIG.phases; // Allow adjacent phase blending
}

// ============================================
// SCANNER & PHASE MECHANICS
// ============================================
function updateScanner(delta) {
if(state.scanning) {
state.scanTime += delta;
const progress = Math.min(state.scanTime / CONFIG.scanner.scanDuration, 1);
phaseMaterials[5].uniforms.uScanProgress.value = progress * CONFIG.scanner.baseRange;
phaseMaterials[5].uniforms.uScannerPos.value.copy(camera.position);
phaseMaterials[5].uniforms.uPhase.value = state.phase;

if(progress >= 1) {
state.scanning = false;
state.revealTime = CONFIG.scanner.revealDuration;
state.scanCooldown = CONFIG.scanner.cooldown;
state.scansUsed++;
playSfx('scan', {gain:0.6});
revealPhaseGeometry();
}
} else {
if(state.scanCooldown > 0) state.scanCooldown -= delta;
if(state.revealTime > 0) {
state.revealTime -= delta;
updateReveal();
}
}

els.crosshair.classList.toggle('scanning', state.scanning);
}
function startScan() {
if(state.scanning || state.scanCooldown > 0 || state.revealTime > 0) return;
state.scanning = true;
state.scanTime = 0;
}
function revealPhaseGeometry() {
const currentPhase = Math.round(state.phase);
levelMeshes.phased.forEach(mesh=>{
if(mesh.userData.phase === currentPhase) {
mesh.material.uniforms.uIntensity.value = 1;
mesh.userData.revealed = true;
}
});
}
function updateReveal() {
const reveal = Math.max(state.revealTime / CONFIG.scanner.revealDuration, 0);
levelMeshes.phased.forEach(mesh=>{
if(mesh.userData.revealed && mesh.userData.phase !== Math.round(state.phase)) {
mesh.material.uniforms.uIntensity.value = reveal * 0.3;
}
});
levelMeshes.crystals.forEach(crystal=>{
if(!crystal.userData.collected) {
const match = crystal.userData.phase === Math.round(state.phase);
crystal.material.uniforms.uRevealed.value = match ? 1 : (reveal * 0.4);
}
});
}
function shiftPhase(direction) {
const newPhase = (state.phase + direction + CONFIG.phases) % CONFIG.phases;
state.targetPhase = newPhase;
playSfx('phaseShift', {gain:0.5, rate:direction>0?1:0.9});
}
function updatePhase(delta) {
const diff = state.targetPhase - state.phase;
if(Math.abs(diff) > 0.01) {
state.phase += diff * Math.min(delta * 5, 1);
if(Math.abs(state.targetPhase - state.phase) < 0.01) state.phase = state.targetPhase;
}
phaseMaterials.forEach((m,i)=>{
if(m.uniforms.uPhase) m.uniforms.uPhase.value = state.phase;
});
phaseMaterials[4].uniforms.uPhase.value = state.phase; // crystals
phaseMaterials[5].uniforms.uPhase.value = state.phase; // scan

// Update phase indicator
const phaseInt = Math.round(state.phase);
els.hudPhase.textContent = (phaseInt+1).toFixed(1);
for(let i=0;i<CONFIG.phases;i++) {
let mark = els.phaseBar.children[i];
if(!mark) { mark=document.createElement('div'); mark.className='phase-mark'; els.phaseBar.appendChild(mark); }
mark.classList.toggle('active', i===phaseInt);
mark.classList.toggle('current', Math.abs(i-state.phase)<0.3);
}
}

// ============================================
// CRYSTAL COLLECTION & OBJECTIVES
// ============================================
function checkCrystals() {
const playerPos = camera.position.clone();
levelMeshes.crystals.forEach(crystal=>{
if(crystal.userData.collected) return;
const dist = playerPos.distanceTo(crystal.position);
if(dist < 1.5 && crystal.userData.phase === Math.round(state.phase)) {
collectCrystal(crystal);
}
});
}
function collectCrystal(crystal) {
crystal.userData.collected = true;
state.crystals++;
state.collected.add(crystal.userData.index);
crystal.material.uniforms.uRevealed.value = 0;
playSfx('crystal', {gain:0.7});
updateHUD();
updateObjectives();

if(state.crystals >= state.totalCrystals) {
activateExit();
}
}
function activateExit() {
if(levelMeshes.exit) {
levelMeshes.exit.userData.active = true;
levelMeshes.exit.material.opacity = 1;
levelMeshes.exit.material.color.setHex(0x00ffcc);
playSfx('complete', {gain:0.8});
}
}
function checkExit() {
if(!levelMeshes.exit || !levelMeshes.exit.userData.active) return;
const dist = camera.position.distanceTo(levelMeshes.exit.position);
if(dist < 3) {
completeLevel();
}
}
function completeLevel() {
state.running = false;
controls.unlock();
showCompletionScreen();
}
function updateHUD() {
els.hudResonances.textContent = `${state.crystals} / ${state.totalCrystals}`;
}
function updateObjectives() {
els.objectives.innerHTML = '';
const obj = document.createElement('div');
obj.className = 'objective current';
obj.innerHTML = `
<svg class="obj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
<span class="obj-text">Resonances: <span class="obj-progress accent">${state.crystals}</span> / ${state.totalCrystals}</span>
`;
els.objectives.appendChild(obj);

if(state.crystals >= state.totalCrystals) {
const obj2 = document.createElement('div');
obj2.className = 'objective';
obj2.innerHTML = `
<svg class="obj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
<span class="obj-text">Find the exit portal</span>
`;
els.objectives.appendChild(obj2);
}
}

// ============================================
// RENDER LOOP
// ============================================
function animate() {
animationId = requestAnimationFrame(animate);
if(!state.running || state.paused) return;

const delta = Math.min(clock.getDelta(), CONFIG.render.maxDelta);
state.stats.frameTime = delta;
state.stats.frames++;
if(state.stats.frames % 30 === 0) {
const now = performance.now();
state.stats.fps = 30000 / (now - state.stats.lastTime);
state.stats.lastTime = now;
}

updatePhase(delta);
updateScanner(delta);
updatePlayer(delta);
checkCrystals();
checkExit();
updateParticles(delta);
updateExitAnimation(delta);

updateShaderTime(delta);
renderScene();
}
function updateShaderTime(delta) {
const time = clock.getElapsedTime();
phaseMaterials.forEach(m=>{ if(m.uniforms.uTime) m.uniforms.uTime.value = time; });
}
function renderScene() {
renderer.render(scene, camera);
}
function updateParticles(delta) {
levelMeshes.static.forEach(mesh=>{
if(mesh.userData.type==='ambient') {
const pos = mesh.geometry.attributes.position;
const origY = mesh.userData.originalY;
for(let i=0;i<pos.count;i++) {
pos.array[i*3+1] = origY[i*3+1] + Math.sin(clock.getElapsedTime()*0.5 + i*0.1) * 0.5;
}
pos.needsUpdate = true;
}
});
}
function updateExitAnimation(delta) {
if(levelMeshes.exit && levelMeshes.exit.userData.active) {
const t = clock.getElapsedTime();
levelMeshes.exit.rotation.z = t * 0.5;
levelMeshes.exit.material.opacity = 0.5 + Math.sin(t*3)*0.3;
if(levelMeshes.exit.userData.particles) {
levelMeshes.exit.userData.particles.rotation.z = -t * 0.3;
levelMeshes.exit.userData.particles.material.opacity = 0.4 + Math.sin(t*2)*0.2;
}
}
}

// ============================================
// INPUT HANDLING
// ============================================
function setupInput() {
document.addEventListener('keydown', onKeyDown);
document.addEventListener('keyup', onKeyUp);
document.addEventListener('mousemove', onMouseMove);
document.addEventListener('contextmenu', e=>e.preventDefault());

// Touch controls
setupTouchControls();

// Buttons
els.btnStart.addEventListener('click',()=>startGame(0));
els.btnContinue.addEventListener('click',()=>startGame(state.level));
els.btnSettings.addEventListener('click',()=>showMenu('settings'));
els.btnBack.addEventListener('click',()=>showMenu('main'));
els.btnResume.addEventListener('click',()=>togglePause());
els.btnRestart.addEventListener('click',()=>restartLevel());
els.btnQuit.addEventListener('click',()=>quitToMenu());
els.btnNext.addEventListener('click',()=>nextLevel());
els.btnReplay.addEventListener('click',()=>restartLevel());
els.btnMenu.addEventListener('click',()=>quitToMenu());

// Settings
els.settingQuality.addEventListener('change',onQualityChange);
els.settingSensitivity.addEventListener('input',onSensitivityChange);
els.settingFov.addEventListener('input',onFovChange);
els.settingVolume.addEventListener('input',onVolumeChange);
els.settingSfx.addEventListener('input',onSfxChange);
els.settingMusic.addEventListener('input',onMusicChange);
els.settingInvert.addEventListener('change',onInvertChange);
els.settingReduced.addEventListener('change',onReducedChange);
els.settingVsync.addEventListener('change',onVsyncChange);
els.settingParticles.addEventListener('change',onParticlesChange);

window.addEventListener('blur',()=>{ if(state.running&&!state.paused) togglePause(true); });
}
function onKeyDown(e) {
if(e.repeat) return;
switch(e.code) {
case 'KeyW': case 'ArrowUp': state.input.forward=1; break;
case 'KeyS': case 'ArrowDown': state.input.forward=-1; break;
case 'KeyD': case 'ArrowRight': state.input.right=1; break;
case 'KeyA': case 'ArrowLeft': state.input.right=-1; break;
case 'Space': state.input.jump=true; break;
case 'ShiftLeft': case 'ShiftRight': state.input.run=true; break;
case 'ControlLeft': case 'ControlRight': state.input.crouch=true; break;
case 'KeyE': case 'Mouse0': startScan(); break;
case 'KeyQ': shiftPhase(-1); break;
case 'KeyR': shiftPhase(1); break;
case 'Escape': if(state.running) togglePause(); break;
case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4':
state.targetPhase = parseInt(e.code[5])-1; break;
}
}
function onKeyUp(e) {
switch(e.code) {
case 'KeyW': case 'ArrowUp': case 'KeyS': case 'ArrowDown': state.input.forward=0; break;
case 'KeyD': case 'ArrowRight': case 'KeyA': case 'ArrowLeft': state.input.right=0; break;
case 'Space': state.input.jump=false; break;
case 'ShiftLeft': case 'ShiftRight': state.input.run=false; break;
case 'ControlLeft': case 'ControlRight': state.input.crouch=false; break;
}
}
function onMouseMove(e) {
if(!state.pointerLocked || state.paused) return;
const sens = state.settings.sensitivity * 0.002;
controls.movePointer(-e.movementX * sens, -e.movementY * sens * (state.settings.invertY?-1:1));
}

// Touch controls
function setupTouchControls() {
const isTouch = 'ontouchstart' in window;
els.touchControls.classList.toggle('visible', isTouch);
if(!isTouch) return;

let stickActive = false, stickId = null, stickStart = {x:0,y:0};
const stickBase = els.touchStick.querySelector('.touch-stick-base');

els.touchStick.addEventListener('touchstart',e=>{
const touch = e.changedTouches[0];
stickActive = true; stickId = touch.identifier;
stickStart = {x:touch.clientX, y:touch.clientY};
}, {passive:true});

els.touchStick.addEventListener('touchmove',e=>{
if(!stickActive) return;
const touch = [...e.changedTouches].find(t=>t.identifier===stickId);
if(!touch) return;
const dx = touch.clientX - stickStart.x;
const dy = touch.clientY - stickStart.y;
const dist = Math.hypot(dx,dy);
const maxR = 50;
const angle = Math.atan2(dy, dx);
const r = Math.min(dist, maxR);
state.input.forward = -Math.sin(angle) * (r/maxR);
state.input.right = Math.cos(angle) * (r/maxR);
els.touchStickKnob.style.transform = `translate(-50%,-50%) translate(${Math.cos(angle)*r}px,${Math.sin(angle)*r}px)`;
}, {passive:true});

els.touchStick.addEventListener('touchend',e=>{
const touch = [...e.changedTouches].find(t=>t.identifier===stickId);
if(touch) { stickActive=false; state.input.forward=0; state.input.right=0; els.touchStickKnob.style.transform='translate(-50%,-50%)'; }
}, {passive:true});

els.touchLook.addEventListener('touchmove',e=>{
if(state.paused||!state.running) return;
const touch = e.changedTouches[0];
if(touch.identifier===stickId) return;
const sens = state.settings.sensitivity * 0.004;
controls.movePointer(-touch.movementX * sens, -touch.movementY * sens * (state.settings.invertY?-1:1));
}, {passive:true});

els.touchScan.addEventListener('touchstart',e=>{e.preventDefault(); state.touch.scan=true; startScan();},{passive:false});
els.touchScan.addEventListener('touchend',e=>{e.preventDefault(); state.touch.scan=false;},{passive:false});
els.touchPhase.addEventListener('touchstart',e=>{e.preventDefault(); shiftPhase(1);},{passive:false});
els.touchJump.addEventListener('touchstart',e=>{e.preventDefault(); state.input.jump=true; setTimeout(()=>state.input.jump=false,100);},{passive:false});
}
function onQualityChange(e) { applyQuality(e.target.value); }
function onSensitivityChange(e) { state.settings.sensitivity=parseFloat(e.target.value); els.sensValue.textContent=state.settings.sensitivity.toFixed(1)+'x'; }
function onFovChange(e) { state.settings.fov=parseInt(e.target.value); camera.fov=state.settings.fov; camera.updateProjectionMatrix(); els.fovValue.textContent=state.settings.fov+'°'; }
function onVolumeChange(e) { setMasterVolume(parseFloat(e.target.value)); }
function onSfxChange(e) { setSfxVolume(parseFloat(e.target.value)); }
function onMusicChange(e) { setMusicVolume(parseFloat(e.target.value)); }
function onInvertChange(e) { state.settings.invertY=e.target.checked; }
function onReducedChange(e) { state.settings.reducedMotion=e.target.checked; document.body.classList.toggle('reduced-motion', e.target.checked); }
function onVsyncChange(e) { state.settings.vsync=e.target.checked; }
function onParticlesChange(e) { state.settings.particles=e.target.checked; if(state.running) generateLevel(state.level); }
function applyQuality(preset) {
state.settings.quality = preset;
const q = QUALITY[preset] || QUALITY.auto;
if(q) {
renderer.shadowMap.enabled = q.shadows;
state.settings.particles = q.particles;
els.settingParticles.checked = q.particles;
els.qualityBadge.textContent = `Quality: ${preset.charAt(0).toUpperCase()+preset.slice(1)}`;
} else {
els.qualityBadge.textContent = 'Quality: Auto';
}
}

// ============================================
// MENU & UI FLOW
// ============================================
function showMenu(which) {
[els.mainMenu, els.settingsMenu, els.pauseMenu, els.completionScreen].forEach(m=>m.classList.add('hidden'));
if(which==='main') els.mainMenu.classList.remove('hidden');
else if(which==='settings') els.settingsMenu.classList.remove('hidden');
else if(which==='pause') els.pauseMenu.classList.remove('hidden');
else if(which==='completion') els.completionScreen.classList.remove('hidden');
}
function startGame(levelIndex) {
state.level = levelIndex;
state.totalStartTime = state.totalStartTime || performance.now();
state.deaths = 0;
state.scansUsed = 0;
state.running = true;
state.paused = false;
showMenu(null);
controls.lock();
generateLevel(levelIndex);
initAudio().then(()=>{ startMusic(); animate(); });
els.btnContinue.disabled = false;
hideHelpHint();
}
function restartLevel() {
showMenu(null);
controls.lock();
state.paused = false;
state.deaths++;
generateLevel(state.level);
}
function nextLevel() {
if(state.level < CONFIG.levels.length-1) {
startGame(state.level+1);
} else {
quitToMenu();
}
}
function quitToMenu() {
state.running = false;
state.paused = false;
controls.unlock();
stopMusic();
showMenu('main');
els.crosshair.classList.remove('visible');
showHelpHint();
}
function togglePause(force) {
if(force===true) { state.paused=true; }
else if(force===false) { state.paused=false; }
else { state.paused = !state.paused; }
if(state.paused) {
controls.unlock();
showMenu('pause');
} else {
showMenu(null);
controls.lock();
}
}
function showCompletionScreen() {
const time = (performance.now() - state.levelStartTime) / 1000;
const totalTime = (performance.now() - state.totalStartTime) / 1000;
const mins = Math.floor(time/60), secs = Math.floor(time%60);
const totalMins = Math.floor(totalTime/60), totalSecs = Math.floor(totalTime%60);

els.completionStats.innerHTML = `
<div class="stat"><span class="stat-value">${mins}:${secs.toString().padStart(2,'0')}</span>Sector Time</div>
<div class="stat"><span class="stat-value">${totalMins}:${totalSecs.toString().padStart(2,'0')}</span>Total Time</div>
<div class="stat"><span class="stat-value">${state.scansUsed}</span>Scans Used</div>
<div class="stat"><span class="stat-value">${state.deaths}</span>Resets</div>
`;

const messages = [
"The resonance stabilizes. The architecture reveals its true form.",
"Phase coherence achieved. The path forward materializes.",
"Frequency locked. The void yields its secrets.",
"Harmonic convergence. The cascade reverses."
];
els.completionMessage.textContent = messages[state.level % messages.length];

showMenu('completion');
playSfx('complete', {gain:0.8});
}
function showHelpHint() {
const hints = [
'Use <kbd>WASD</kbd> to move, <kbd>Mouse</kbd> to look, <kbd>Space</kbd> to jump',
'Hold <kbd>Shift</kbd> to sprint, <kbd>Ctrl</kbd> to crouch',
'Press <kbd>E</kbd> to scan, <kbd>Q</kbd>/<kbd>R</kbd> to shift phase',
'Collect all resonances to open the exit'
];
els.helpHint.innerHTML = hints.join('<br>');
els.helpHint.classList.add('visible');
setTimeout(()=>els.helpHint.classList.remove('visible'), 10000);
}
function hideHelpHint() { els.helpHint.classList.remove('visible'); }

// ============================================
// SAVE/LOAD
// ============================================
function saveProgress() {
try {
const data = {
level: state.level,
crystals: state.crystals,
totalCrystals: state.totalCrystals,
collected: [...state.collected],
phase: state.phase,
settings: state.settings,
stats: {deaths: state.deaths, scansUsed: state.scansUsed, totalTime: performance.now() - state.totalStartTime}
};
localStorage.setItem('voxelResonanceSave', JSON.stringify(data));
} catch(e) { console.warn('Save failed:', e); }
}
function loadProgress() {
try {
const data = JSON.parse(localStorage.getItem('voxelResonanceSave')||'null');
if(data) {
state.level = data.level||0;
state.crystals = data.crystals||0;
state.totalCrystals = data.totalCrystals||0;
state.collected = new Set(data.collected||[]);
state.phase = data.phase||0;
state.targetPhase = state.phase;
state.settings = {...state.settings, ...data.settings};
state.deaths = data.stats?.deaths||0;
state.scansUsed = data.stats?.scansUsed||0;
state.totalStartTime = data.stats?.totalTime ? performance.now() - data.stats.totalTime : performance.now();
applySettingsToUI();
return true;
}
} catch(e) { console.warn('Load failed:', e); }
return false;
}
function applySettingsToUI() {
els.settingQuality.value = state.settings.quality;
els.settingSensitivity.value = state.settings.sensitivity;
els.settingFov.value = state.settings.fov;
els.settingVolume.value = state.settings.volume;
els.settingSfx.value = state.settings.sfx;
els.settingMusic.value = state.settings.music;
els.settingInvert.checked = state.settings.invertY;
els.settingReduced.checked = state.settings.reducedMotion;
els.settingVsync.checked = state.settings.vsync;
els.settingParticles.checked = state.settings.particles;
els.sensValue.textContent = state.settings.sensitivity.toFixed(1)+'x';
els.fovValue.textContent = state.settings.fov+'°';
els.volValue.textContent = Math.round(state.settings.volume*100)+'%';
els.sfxValue.textContent = Math.round(state.settings.sfx*100)+'%';
els.musicValue.textContent = Math.round(state.settings.music*100)+'%';
document.body.classList.toggle('reduced-motion', state.settings.reducedMotion);
applyQuality(state.settings.quality);
}

// ============================================
// INITIALIZATION
// ============================================
async function init() {
createPhaseMaterials();
initRenderer();
setupInput();
loadProgress();
applySettingsToUI();

if('ontouchstart' in window) {
els.touchControls.classList.add('visible');
}

showMenu('main');

window.addEventListener('beforeunload', saveProgress);

console.log('Voxel Resonance initialized');
}
init();
</script>
</body>
</html>
