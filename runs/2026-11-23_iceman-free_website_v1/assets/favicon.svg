<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) { .bg { fill: #fff; } .fg { fill: #000; } }
    </style>
  </defs>
  <rect class="bg" width="32" height="32" fill="#000"/>
  <rect class="fg" x="5" y="5" width="22" height="22" fill="none" stroke="#fff" stroke-width="2"/>
  <rect class="fg" x="10" y="10" width="12" height="12" fill="#fff"/>
  <circle class="bg" cx="16" cy="16" r="3" fill="#000"/>
</svg>
