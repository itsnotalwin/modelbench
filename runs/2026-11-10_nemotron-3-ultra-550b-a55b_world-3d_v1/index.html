<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aether Isles — Living 3D World</title>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
:root {
  --bg: #0a0812;
  --fg: #e8e4f0;
  --muted: #6a647a;
  --accent: #00d4aa;
  --accent-dim: #008a6b;
  --warn: #ff6b4a;
  --panel: rgba(18,14,30,0.92);
  --panel-border: rgba(0,212,170,0.18);
  --focus: #00ffcc;
  --font-ui: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-display: 'Outfit', 'Space Grotesk', system-ui, sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; }
#app { width: 100%; height: 100%; position: relative; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* UI Panels */
.panel {
  position: absolute;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 12px;
  color: var(--fg);
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.03);
  z-index: 100;
}
.panel h3 { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
.panel-row { display: flex; justify-content: space-between; gap: 12px; margin: 6px 0; font-size: 11px; }
.panel-row .label { color: var(--muted); }
.panel-row .value { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
.panel-divider { height: 1px; background: var(--panel-border); margin: 8px 0; }

#hud-top { top: 16px; left: 50%; transform: translateX(-50%); min-width: 280px; text-align: center; }
#hud-top .time-display { font-family: var(--font-display); font-size: 28px; font-weight: 300; letter-spacing: 0.02em; color: var(--fg); }
#hud-top .weather-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-top: 2px; }
#hud-top .energy-bar { height: 3px; background: rgba(0,0,0,0.4); border-radius: 2px; margin-top: 8px; overflow: hidden; }
#hud-top .energy-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #7cffd6); width: 100%; transition: width 0.3s ease; box-shadow: 0 0 8px var(--accent); }

#hud-left { top: 16px; left: 16px; min-width: 200px; }
#hud-right { top: 16px; right: 16px; min-width: 220px; }
#hud-bottom { bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.mode-btn { background: rgba(0,212,170,0.1); border: 1px solid var(--panel-border); color: var(--fg); padding: 8px 14px; border-radius: 6px; font-family: var(--font-ui); font-size: 11px; cursor: pointer; transition: all 0.15s ease; text-transform: uppercase; letter-spacing: 0.06em; }
.mode-btn:hover, .mode-btn:focus-visible { background: var(--accent); color: var(--bg); outline: none; box-shadow: 0 0 12px var(--accent); }
.mode-btn.active { background: var(--accent); color: var(--bg); box-shadow: 0 0 16px var(--accent); }
.mode-btn:disabled { opacity: 0.4; cursor: not-allowed; }

#compass { bottom: 16px; right: 16px; width: 140px; height: 140px; padding: 12px; }
.compass-ring { width: 100%; height: 100%; border: 2px solid var(--panel-border); border-radius: 50%; position: relative; overflow: hidden; }
.compass-ring::before { content: ''; position: absolute; top: 50%; left: 50%; width: 2px; height: 50%; background: var(--warn); transform-origin: bottom center; transform: translateX(-50%) rotate(0deg); z-index: 2; }
.compass-marks { position: absolute; inset: 0; }
.compass-mark { position: absolute; top: 4px; left: 50%; width: 1px; height: 8px; background: var(--muted); transform-origin: bottom center; transform: translateX(-50%) rotate(var(--r)); font-size: 7px; color: var(--muted); }
.compass-mark.cardinal { height: 14px; background: var(--accent); color: var(--accent); font-weight: 600; }
.compass-center { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 8px var(--accent); }
.compass-player { position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 14px solid var(--fg); transform: translate(-50%, -50%) rotate(var(--pr, 0deg)); z-index: 3; filter: drop-shadow(0 0 4px var(--fg)); }

#minimap { bottom: 16px; left: 16px; width: 200px; height: 200px; padding: 8px; }
#minimap canvas { width: 100%; height: 100%; border-radius: 6px; border: 1px solid var(--panel-border); image-rendering: pixelated; }

/* Modal / Menu */
.modal-overlay { position: fixed; inset: 0; background: rgba(6,4,14,0.92); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
.modal-overlay.visible { opacity: 1; pointer-events: auto; }
.modal { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 32px; max-width: 520px; width: 90%; max-height: 85vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform 0.3s ease; }
.modal-overlay.visible .modal { transform: scale(1); }
.modal h2 { font-family: var(--font-display); font-size: 24px; font-weight: 500; color: var(--accent); margin-bottom: 20px; }
.modal-section { margin-bottom: 24px; }
.modal-section h3 { font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.keybind-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; }
.keybind-row:last-child { border-bottom: none; }
.keybind-key { background: rgba(255,255,255,0.06); border: 1px solid var(--panel-border); border-radius: 4px; padding: 2px 8px; font-family: var(--font-ui); font-size: 11px; color: var(--accent); min-width: 60px; text-align: center; }
.btn { background: linear-gradient(135deg, var(--accent), var(--accent-dim)); border: none; color: var(--bg); padding: 12px 24px; border-radius: 6px; font-family: var(--font-ui); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s ease; text-transform: uppercase; letter-spacing: 0.06em; }
.btn:hover, .btn:focus-visible { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,212,170,0.4); outline: none; }
.btn:active { transform: translateY(0); }
.btn.secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--fg); }
.btn.secondary:hover { background: rgba(255,255,255,0.05); box-shadow: none; }
.btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
.input-field { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--panel-border); border-radius: 6px; padding: 10px 12px; color: var(--fg); font-family: var(--font-ui); font-size: 13px; margin-bottom: 12px; }
.input-field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,212,170,0.2); }
.save-slot { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--panel-border); border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s ease; }
.save-slot:hover { background: rgba(0,212,170,0.08); border-color: var(--accent); }
.save-slot.empty { opacity: 0.6; }
.save-slot-info { display: flex; flex-direction: column; gap: 2px; }
.save-slot-name { font-weight: 500; }
.save-slot-meta { font-size: 11px; color: var(--muted); }
.save-slot-actions { display: flex; gap: 6px; }
.icon-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border); border-radius: 4px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); transition: all 0.15s ease; }
.icon-btn:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.icon-btn.delete:hover { background: var(--warn); border-color: var(--warn); }

/* Discovery Toast */
#toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 150; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); transform: translateY(100px); opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto; }
.toast.visible { transform: translateY(0); opacity: 1; }
.toast-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.toast-icon.discovery { background: linear-gradient(135deg, #00d4aa, #7cffd6); color: var(--bg); }
.toast-icon.landmark { background: linear-gradient(135deg, #ffb800, #ff6b4a); color: var(--bg); }
.toast-icon.creature { background: linear-gradient(135deg, #a855f7, #ec4899); color: var(--bg); }
.toast-text { display: flex; flex-direction: column; gap: 2px; }
.toast-title { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--fg); }
.toast-desc { font-size: 11px; color: var(--muted); }

/* Crosshair */
#crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; pointer-events: none; z-index: 50; opacity: 0; transition: opacity 0.2s ease; }
#crosshair.visible { opacity: 1; }
.crosshair-line { position: absolute; background: var(--fg); opacity: 0.8; }
.crosshair-line.h { width: 12px; height: 1px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.crosshair-line.v { width: 1px; height: 12px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.crosshair-gap { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; border: 1px solid var(--fg); border-radius: 50%; transform: translate(-50%, -50%); opacity: 0.5; }

/* Loading Screen */
#loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; gap: 24px; }
#loading.hidden { display: none; }
.loading-title { font-family: var(--font-display); font-size: 48px; font-weight: 300; color: var(--fg); letter-spacing: 0.04em; }
.loading-subtitle { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.15em; }
.loading-bar { width: 300px; height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
.loading-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #7cffd6); width: 0%; transition: width 0.3s ease; box-shadow: 0 0 12px var(--accent); }
.loading-status { font-size: 11px; color: var(--muted); font-family: var(--font-ui); min-height: 16px; }

/* Performance Graph */
#perf-graph { position: fixed; bottom: 16px; right: 180px; width: 160px; height: 60px; z-index: 80; pointer-events: none; }
#perf-graph canvas { width: 100%; height: 100%; border-radius: 4px; background: rgba(6,4,14,0.7); border: 1px solid var(--panel-border); }

/* Debug Info */
#debug-info { position: fixed; top: 16px; right: 16px; font-size: 10px; color: var(--muted); font-family: var(--font-ui); z-index: 80; pointer-events: none; text-align: right; line-height: 1.6; }
#debug-info.visible { display: block; }
#debug-info.hidden { display: none; }

/* Reduced Motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* Mobile Adjustments */
@media (max-width: 768px) {
  :root { font-size: 13px; }
  #hud-top { top: 8px; min-width: 200px; }
  #hud-top .time-display { font-size: 20px; }
  #hud-left, #hud-right { top: 8px; left: 8px; right: 8px; min-width: 0; }
  #hud-bottom { bottom: 8px; }
  .mode-btn { padding: 10px 12px; font-size: 10px; }
  #compass { bottom: 8px; right: 8px; width: 110px; height: 110px; }
  #minimap { bottom: 8px; left: 8px; width: 150px; height: 150px; }
  #perf-graph { display: none; }
}
@media (max-width: 480px) {
  .panel { padding: 10px 12px; }
  .modal { padding: 20px; margin: 16px; }
  .loading-title { font-size: 32px; }
}
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite">
  <div class="loading-title">AETHER ISLES</div>
  <div class="loading-subtitle">Initializing World</div>
  <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
  <div class="loading-status" id="loading-status">Preparing shaders...</div>
</div>

<div id="app" role="application" aria-label="Aether Isles - Living 3D World">
  <canvas id="gl-canvas" tabindex="0" aria-label="3D World View"></canvas>

  <!-- HUD -->
  <div id="hud-top" class="panel" role="region" aria-label="World Status">
    <div class="time-display" id="time-display">06:00</div>
    <div class="weather-tag" id="weather-tag">Clear Dawn</div>
    <div class="energy-bar" aria-label="Energy Level"><div class="energy-fill" id="energy-fill" style="width: 100%"></div></div>
  </div>

  <div id="hud-left" class="panel" role="region" aria-label="Player Status">
    <h3>Pilot Status</h3>
    <div class="panel-row"><span class="label">Mode</span><span class="value" id="mode-value">WALK</span></div>
    <div class="panel-row"><span class="label">Altitude</span><span class="value" id="alt-value">0 m</span></div>
    <div class="panel-row"><span class="label">Velocity</span><span class="value" id="vel-value">0 m/s</span></div>
    <div class="panel-divider"></div>
    <div class="panel-row"><span class="label">Energy</span><span class="value" id="energy-value">100%</span></div>
    <div class="panel-row"><span class="label">Crystals</span><span class="value" id="crystals-value">0</span></div>
    <div class="panel-row"><span class="label">Discoveries</span><span class="value" id="discoveries-value">0/47</span></div>
  </div>

  <div id="hud-right" class="panel" role="region" aria-label="Environment">
    <h3>Atmosphere</h3>
    <div class="panel-row"><span class="label">Biome</span><span class="value" id="biome-value">—</span></div>
    <div class="panel-row"><span class="label">Temperature</span><span class="value" id="temp-value">—°C</span></div>
    <div class="panel-row"><span class="label">Wind</span><span class="value" id="wind-value">— km/h</span></div>
    <div class="panel-row"><span class="label">Humidity</span><span class="value" id="humidity-value">—%</span></div>
    <div class="panel-divider"></div>
    <div class="panel-row"><span class="label">Nearby Life</span><span class="value" id="life-value">0</span></div>
    <div class="panel-row"><span class="label">Anomaly Level</span><span class="value" id="anomaly-value">Stable</span></div>
  </div>

  <div id="hud-bottom" class="panel" role="region" aria-label="Movement Modes">
    <button class="mode-btn active" data-mode="walk" aria-pressed="true" title="Walk [1]">Walk</button>
    <button class="mode-btn" data-mode="glide" aria-pressed="false" title="Glide [2]">Glide</button>
    <button class="mode-btn" data-mode="flight" aria-pressed="false" title="Flight [3]">Flight</button>
    <button class="mode-btn" data-mode="skimmer" aria-pressed="false" title="Skimmer [4]">Skimmer</button>
  </div>

  <div id="compass" class="panel" role="img" aria-label="Compass showing North and player heading">
    <h3 style="margin-bottom:8px;text-align:center;">COMPASS</h3>
    <div class="compass-ring" id="compass-ring">
      <div class="compass-marks" id="compass-marks"></div>
      <div class="compass-center"></div>
      <div class="compass-player" id="compass-player"></div>
    </div>
  </div>

  <div id="minimap" class="panel" role="img" aria-label="Minimap showing explored area">
    <h3 style="margin-bottom:8px;text-align:center;">CHART</h3>
    <canvas id="minimap-canvas" width="184" height="184" aria-hidden="true"></canvas>
  </div>

  <div id="crosshair" aria-hidden="true">
    <div class="crosshair-line h"></div>
    <div class="crosshair-line v"></div>
    <div class="crosshair-gap"></div>
  </div>

  <div id="perf-graph" aria-hidden="true"><canvas id="perf-canvas" width="160" height="60"></canvas></div>

  <div id="debug-info" class="hidden" aria-hidden="true"></div>

  <!-- Toasts -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal" role="document">
      <h2 id="modal-title">AETHER ISLES</h2>
      <div id="modal-content"></div>
    </div>
  </div>
</div>

<!-- Shaders -->
<script type="x-shader/x-vertex" id="vs-atmosphere">
uniform vec3 uSunDirection; uniform float uTime; uniform float uSunIntensity; uniform vec3 uFogColor; uniform float uFogDensity;
varying vec3 vWorldPos; varying vec3 vNormal; varying vec2 vUv; varying float vHeight;
void main() {
  vUv = uv; vNormal = normalize(normalMatrix * normal); vec4 worldPos = modelMatrix * vec4(position, 1.0); vWorldPos = worldPos.xyz; vHeight = worldPos.y;
  gl_Position = projectionMatrix * viewMatrix * worldPos;
}
</script>

<script type="x-shader/x-fragment" id="fs-atmosphere">
uniform vec3 uSunDirection; uniform float uTime; uniform float uSunIntensity; uniform vec3 uFogColor; uniform float uFogDensity;
uniform vec3 uHorizonColor; uniform vec3 uZenithColor; uniform vec3 uGroundColor; uniform float uCloudCover; uniform float uCloudSpeed;
varying vec3 vWorldPos; varying vec3 vNormal; varying vec2 vUv; varying float vHeight;
#define PI 3.14159265359
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }
float fbm(vec2 p, int octaves) { float v = 0.0; float a = 0.5; float f = 1.0; for (int i = 0; i < 6; i++) { if (i >= octaves) break; v += a * noise(p * f); f *= 2.0; a *= 0.5; } return v; }
vec3 hsv2rgb(vec3 c) { vec3 rgb = clamp(abs(mod(c.x * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); return c.z * mix(vec3(1.0), rgb, c.y); }
void main() {
  vec3 viewDir = normalize(vWorldPos - cameraPosition);
  float sunDot = max(dot(viewDir, uSunDirection), 0.0);
  float horizonDot = 1.0 - max(abs(viewDir.y), 0.0);
  vec3 skyColor = mix(uZenithColor, uHorizonColor, pow(horizonDot, 0.5));
  float sunGlow = pow(sunDot, 256.0) * uSunIntensity * 3.0;
  skyColor += vec3(sunGlow) * vec3(1.0, 0.85, 0.6);
  vec2 cloudUv = vWorldPos.xz * 0.0003 + uTime * uCloudSpeed;
  float clouds = fbm(cloudUv, 4) * uCloudCover;
  skyColor += vec3(clouds * 0.3) * vec3(1.0, 0.95, 0.85);
  float stars = 0.0;
  if (uSunIntensity < 0.3) { vec2 starUv = vWorldPos.xz * 0.001; stars = pow(noise(starUv), 8.0) * (1.0 - uSunIntensity * 3.0); skyColor += vec3(stars) * vec3(1.0, 1.0, 0.9); }
  float aurora = 0.0;
  if (uSunIntensity < 0.2) { float a = fbm(vWorldPos.xz * 0.0001 + uTime * 0.001, 3); aurora = smoothstep(0.6, 0.8, a) * sin(vWorldPos.y * 0.01 + uTime * 0.5) * 0.3; skyColor += vec3(0.0, aurora * 0.8, aurora * 0.4); }
  float fogFactor = 1.0 - exp(-uFogDensity * length(vWorldPos - cameraPosition) * 0.001);
  vec3 finalColor = mix(skyColor, uFogColor, fogFactor);
  float vignette = 1.0 - 0.15 * length(vUv - 0.5) * 2.0;
  finalColor *= vignette;
  gl_FragColor = vec4(finalColor, 1.0);
}
</script>

<script type="x-shader/x-vertex" id="vs-island">
uniform float uTime; uniform vec3 uWindDirection; uniform float uWindStrength;
attribute float aSeed; attribute float aHeight; attribute vec3 aColor1; attribute vec3 aColor2;
varying vec3 vWorldPos; varying vec3 vNormal; varying vec2 vUv; varying float vHeight; varying vec3 vColor1; varying vec3 vColor2; varying float vSeed;
vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

    ground = new THREE.Color(0x8f7a5c);
    fog = new THREE.Color(0xa8c8e8).lerp(new THREE.Color(0x8888aa), weatherData.cloudCover * 0.5);
  }
  
  if (weather.type === 'aurora') {
    zenith.lerp(new THREE.Color(0x004422), 0.3);
    horizon.lerp(new THREE.Color(0x006633), 0.2);
  }
  if (weather.type === 'void_haze') {
    zenith.lerp(new THREE.Color(0x0a0215), 0.5);
    fog.lerp(new THREE.Color(0x0d021a), 0.7);
  }
  
  return { horizon, zenith, ground, fog };
}

function getBiomeAt(pos) {
  let bestDist = Infinity;
  let bestBiome = BIOMES[0];
  for (const island of STATE.islands) {
    const dist = pos.distanceTo(new THREE.Vector3(island.x, 0, island.z)) - island.radius;
    if (dist < bestDist) {
      bestDist = dist;
      bestBiome = BIOMES.find(b => b.id === island.biome) || BIOMES[0];
    }
  }
  return bestBiome;
}

function showToast(title, desc, type = 'discovery') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `
    <div class="toast-icon ${type}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg></div>
    <div class="toast-text"><div class="toast-title">${title}</div><div class="toast-desc">${desc}</div></div>
  `;
  container.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('visible'));
  setTimeout(() => { toast.classList.remove('visible'); setTimeout(() => toast.remove(), 400); }, 5000);
}

function saveGame(slotName = null) {
  const data = {
    version: CONFIG.SAVE_VERSION,
    timestamp: Date.now(),
    time: STATE.time,
    weather: STATE.weather,
    player: {
      pos: [STATE.player.pos.x, STATE.player.pos.y, STATE.player.pos.z],
      yaw: STATE.player.yaw,
      pitch: STATE.player.pitch,
      mode: STATE.player.mode,
      energy: STATE.player.energy,
      crystals: STATE.player.crystals,
      discoveries: Array.from(STATE.player.discoveries),
    },
    islands: STATE.islands.map(i => ({ x: i.x, z: i.z, radius: i.radius, biome: i.biome, height: i.height, seed: i.seed, landmarks: i.landmarks })),
    discoveries: STATE.discoveries,
    quality: STATE.quality,
  };
  const slot = slotName || `save_${Date.now()}`;
  try {
    localStorage.setItem(`aether_${slot}`, JSON.stringify(data));
    STATE.currentSave = slot;
    loadSaveList();
    showToast('Game Saved', `Progress stored in ${slot}`, 'landmark');
  } catch (e) {
    console.error('Save failed:', e);
    showToast('Save Failed', 'Storage quota exceeded or unavailable', 'creature');
  }
}

function loadGame(slot) {
  try {
    const data = JSON.parse(localStorage.getItem(`aether_${slot}`));
    if (!data || data.version !== CONFIG.SAVE_VERSION) throw new Error('Invalid save');
    STATE.time = data.time;
    STATE.weather = data.weather;
    STATE.player.pos.set(...data.player.pos);
    STATE.player.yaw = data.player.yaw;
    STATE.player.pitch = data.player.pitch;
    STATE.player.mode = data.player.mode;
    STATE.player.energy = data.player.energy;
    STATE.player.crystals = data.player.crystals;
    STATE.player.discoveries = new Set(data.player.discoveries);
    STATE.islands = data.islands;
    STATE.discoveries = data.discoveries || [];
    STATE.quality = data.quality || 'high';
    STATE.currentSave = slot;
    rebuildWorld();
    showToast('Game Loaded', `Resumed from ${slot}`, 'landmark');
    closeModal();
  } catch (e) {
    console.error('Load failed:', e);
    showToast('Load Failed', 'Corrupted or incompatible save', 'creature');
  }
}

function loadSaveList() {
  STATE.saveSlots = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key?.startsWith('aether_')) {
      try {
        const data = JSON.parse(localStorage.getItem(key));
        STATE.saveSlots.push({ key: key.replace('aether_', ''), data });
      } catch {}
    }
  }
  STATE.saveSlots.sort((a, b) => b.data.timestamp - a.data.timestamp);
}

function deleteSave(slot) {
  localStorage.removeItem(`aether_${slot}`);
  loadSaveList();
  renderSaveList();
}

function exportSave(slot) {
  const data = localStorage.getItem(`aether_${slot}`);
  if (data) {
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `aether_${slot}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
}

function importSave(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      const slot = `import_${Date.now()}`;
      localStorage.setItem(`aether_${slot}`, JSON.stringify(data));
      loadSaveList();
      renderSaveList();
      showToast('Import Successful', 'Save file imported', 'landmark');
    } catch {
      showToast('Import Failed', 'Invalid save file format', 'creature');
    }
  };
  reader.readAsText(file);
}

function requestPointerLock() {
  if (!STATE.isPointerLocked) {
    document.getElementById('gl-canvas').requestPointerLock();
  }
}

function onPointerLockChange() {
  STATE.isPointerLocked = document.pointerLockElement === document.getElementById('gl-canvas');
  document.getElementById('crosshair').classList.toggle('visible', STATE.isPointerLocked && STATE.player.mode !== 'walk');
}

function onKeyDown(e) {
  if (e.target.tagName === 'INPUT') return;
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': STATE.input.forward = 1; break;
    case 'KeyS': case 'ArrowDown': STATE.input.forward = -1; break;
    case 'KeyA': case 'ArrowLeft': STATE.input.right = -1; break;
    case 'KeyD': case 'ArrowRight': STATE.input.right = 1; break;
    case 'Space': STATE.input.up = 1; e.preventDefault(); break;
    case 'ShiftLeft': case 'ShiftRight': STATE.input.boost = true; break;
    case 'KeyE': STATE.input.interact = true; break;
    case 'KeyM': STATE.input.map = true; break;
    case 'Escape': STATE.input.menu = true; break;
    case 'Digit1': STATE.input.mode = 'walk'; break;
    case 'Digit2': STATE.input.mode = 'glide'; break;
    case 'Digit3': STATE.input.mode = 'flight'; break;
    case 'Digit4': STATE.input.mode = 'skimmer'; break;
    case 'KeyP': togglePerformance(); break;
    case 'KeyF5': saveGame(); break;
    case 'KeyF9': loadGame(STATE.currentSave || STATE.saveSlots[0]?.key); break;
  }
}

function onKeyUp(e) {
  if (e.target.tagName === 'INPUT') return;
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': if (STATE.input.forward === 1) STATE.input.forward = 0; break;
    case 'KeyS': case 'ArrowDown': if (STATE.input.forward === -1) STATE.input.forward = 0; break;
    case 'KeyA': case 'ArrowLeft': if (STATE.input.right === -1) STATE.input.right = 0; break;
    case 'KeyD': case 'ArrowRight': if (STATE.input.right === 1) STATE.input.right = 0; break;
    case 'Space': STATE.input.up = 0; break;
    case 'ShiftLeft': case 'ShiftRight': STATE.input.boost = false; break;
    case 'KeyE': STATE.input.interact = false; break;
    case 'KeyM': STATE.input.map = false; break;
    case 'Escape': STATE.input.menu = false; break;
  }
}

document.addEventListener('mousemove', (e) => {

    STATE.input.yaw -= e.movementX * 0.002;
    STATE.input.pitch = clamp(STATE.input.pitch - e.movementY * 0.002, -Math.PI/2 + 0.01, Math.PI/2 - 0.01);
  }
});

function generateWorld() {
  RNG.setSeed(CONFIG.WORLD_SEED);
  STATE.islands = [];
  
  // Central hub island
  STATE.islands.push({
    x: 0, z: 0, radius: 300, biome: 'crystal', height: 80, seed: RNG.nextInt(0, 10000),
    landmarks: [{ type: 'crystal_heart', angle: 0, dist: 0 }]
  });
  DISCOVERIES.find(d => d.id === 'crystal_heart').pos = new THREE.Vector3(0, 100, 0);

  // Distribute other islands
  for (let i = 1; i < CONFIG.ISLAND_COUNT; i++) {
    const angle = RNG.nextFloat(0, Math.PI * 2);
    const dist = RNG.nextFloat(600, 4000);
    const biome = BIOMES[RNG.nextInt(0, BIOMES.length)];
    const radius = RNG.nextFloat(120, 400);
    const height = biome.height * RNG.nextFloat(0.7, 1.3);
    const island = {
      x: Math.cos(angle) * dist,
      z: Math.sin(angle) * dist,
      radius,
      biome: biome.id,
      height,
      seed: RNG.nextInt(0, 10000),
      landmarks: [],
    };
    
    // Assign landmark if biome matches
    const biomeDiscoveries = DISCOVERIES.filter(d => d.biome === biome.id && d.type === 'landmark');
    if (biomeDiscoveries.length > 0 && RNG.next() < 0.7) {
      const disc = biomeDiscoveries[RNG.nextInt(0, biomeDiscoveries.length)];
      if (!disc.pos) {
        const landmarkAngle = RNG.nextFloat(0, Math.PI * 2);
        const landmarkDist = RNG.nextFloat(radius * 0.2, radius * 0.8);
        island.landmarks.push({ type: disc.id, angle: landmarkAngle, dist: landmarkDist });
        disc.pos = new THREE.Vector3(
          island.x + Math.cos(landmarkAngle) * landmarkDist,
          height * 0.8 + 20,
          island.z + Math.sin(landmarkAngle) * landmarkDist
        );
      }
    }
    
    // Creature discoveries
    const creatureDiscs = DISCOVERIES.filter(d => d.biome === biome.id && d.type === 'creature');
    if (creatureDiscs.length > 0 && RNG.next() < 0.5) {
      const disc = creatureDiscs[RNG.nextInt(0, creatureDiscs.length)];
      if (!disc.pos) {
        disc.pos = new THREE.Vector3(
          island.x + RNG.nextFloat(-radius * 0.5, radius * 0.5),
          height * 0.5 + 20,
          island.z + RNG.nextFloat(-radius * 0.5, radius * 0.5)
        );
      }
    }
    
    STATE.islands.push(island);
  }

  // Generate initial chunks around player
  const startChunk = getChunkCoord(STATE.player.pos.x, STATE.player.pos.z);
  for (let cx = -CONFIG.VIEW_DISTANCE; cx <= CONFIG.VIEW_DISTANCE; cx++) {
    for (let cz = -CONFIG.VIEW_DISTANCE; cz <= CONFIG.VIEW_DISTANCE; cz++) {
      generateChunk(startChunk.x + cx, startChunk.z + cz);
    }
  }

  // Spawn initial creatures
  spawnCreatures();
}

function getChunkCoord(x, z) {
  return { x: Math.floor(x / CONFIG.CHUNK_SIZE), z: Math.floor(z / CONFIG.CHUNK_SIZE) };
}

function getChunkKey(cx, cz) { return `${cx},${cz}`; }

function generateChunk(cx, cz) {
  const key = getChunkKey(cx, cz);
  if (STATE.chunks.has(key)) return;
  
  const worldX = cx * CONFIG.CHUNK_SIZE;
  const worldZ = cz * CONFIG.CHUNK_SIZE;
  
  // Find influencing islands
  const influences = STATE.islands.map(island => {
    const dx = (worldX + CONFIG.CHUNK_SIZE/2) - island.x;
    const dz = (worldZ + CONFIG.CHUNK_SIZE/2) - island.z;
    const dist = Math.sqrt(dx*dx + dz*dz) - island.radius;
    return { island, dist, influence: Math.max(0, 1 - dist / (island.radius * 1.5)) };
  }).filter(i => i.influence > 0).sort((a, b) => b.influence - a.influence);
  
  if (influences.length === 0) {
    // Ocean chunk - just water
    STATE.chunks.set(key, { cx, cz, mesh: null, type: 'ocean' });
    return;
  }
  
  // Blend biomes
  let totalInf = 0;
  let blendedHeight = 0;
  let blendedColor1 = new THREE.Color();
  let blendedColor2 = new THREE.Color();
  
  for (const inf of influences) {
    totalInf += inf.influence;
  }
  
  for (const inf of influences) {
    const w = inf.influence / totalInf;
    const biome = BIOMES.find(b => b.id === inf.island.biome);
    blendedHeight += biome.height * w;
    blendedColor1.lerp(biome.color1, w);
    blendedColor2.lerp(biome.color2, w);
  }
  
  // Generate heightmap
  const res = CONFIG.CHUNK_RESOLUTION;
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];
  const heights = new Float32Array((res + 1) * (res + 1));
  const seeds = new Float32Array((res + 1) * (res + 1));
  const color1s = new Float32Array((res + 1) * (res + 1) * 3);
  const color2s = new Float32Array((res + 1) * (res + 1) * 3);
  
  const chunkSeed = hashStr(key);
  const rnd = seededRandom(chunkSeed);
  
  for (let gz = 0; gz <= res; gz++) {
    for (let gx = 0; gx <= res; gx++) {
      const x = worldX + (gx / res) * CONFIG.CHUNK_SIZE;
      const z = worldZ + (gz / res) * CONFIG.CHUNK_SIZE;
      
      let h = 0;
      // Base island shape
      for (const inf of influences) {
        const dx = x - inf.island.x;
        const dz = z - inf.island.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        const islandH = inf.island.height * Math.max(0, 1 - dist / inf.island.radius);
        h += islandH * inf.influence;
      }
      h /= totalInf;
      
      // Procedural detail
      const detail = fbm(x * 0.005, z * 0.005, 5, chunkSeed) * 15;
      h += detail;
      
      // Cliffs and overhangs
      const cliff = Math.pow(fbm(x * 0.02, z * 0.02, 3, chunkSeed + 1000), 3) * 30;
      if (h > 10) h += cliff;
      
      // Caves and arches (simplified)
      if (h > 30 && fbm(x * 0.01, z * 0.01, 2, chunkSeed + 2000) > 0.85) {
        h -= 20;
      }
      
      heights[gz * (res + 1) + gx] = h;
      seeds[gz * (res + 1) + gx] = rnd();
      
      color1s[(gz * (res + 1) + gx) * 3] = blendedColor1.r;
      color1s[(gz * (res + 1) + gx) * 3 + 1] = blendedColor1.g;
      color1s[(gz * (res + 1) + gx) * 3 + 2] = blendedColor1.b;
      color2s[(gz * (res + 1) + gx) * 3] = blendedColor2.r;
      color2s[(gz * (res + 1) + gx) * 3 + 1] = blendedColor2.g;
      color2s[(gz * (res + 1) + gx) * 3 + 2] = blendedColor2.b;
      
      positions.push(x, h, z);
      uvs.push(gx / res, gz / res);
    }
  }
  
  // Calculate normals
  for (let gz = 0; gz <= res; gz++) {
    for (let gx = 0; gx <= res; gx++) {
      const idx = gz * (res + 1) + gx;
      const hL = gx > 0 ? heights[gz * (res + 1) + gx - 1] : heights[idx];
      const hR = gx < res ? heights[gz * (res + 1) + gx + 1] : heights[idx];
      const hD = gz > 0 ? heights[(gz - 1) * (res + 1) + gx] : heights[idx];
      const hU = gz < res ? heights[(gz + 1) * (res + 1) + gx] : heights[idx];
      const nx = hL - hR;
      const nz = hD - hU;
      const ny = 2 * CONFIG.CHUNK_SIZE / res;
      const len = Math.sqrt(nx*nx + ny*ny + nz*nz);
      normals.push(nx/len, ny/len, nz/len);
    }
  }
  
  // Indices
  for (let gz = 0; gz < res; gz++) {
    for (let gx = 0; gx < res; gx++) {
      const a = gz * (res + 1) + gx;
      const b = a + 1;
      const c = (gz + 1) * (res + 1) + gx;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setAttribute('aHeight', new THREE.Float32BufferAttribute(heights, 1));
  geometry.setAttribute('aSeed', new THREE.Float32BufferAttribute(seeds, 1));
  geometry.setAttribute('aColor1', new THREE.Float32BufferAttribute(color1s, 3));
  geometry.setAttribute('aColor2', new THREE.Float32BufferAttribute(color2s, 3));
  geometry.setIndex(indices);
  geometry.computeBoundingSphere();
  
  const material = new THREE.ShaderMaterial({
    vertexShader: document.getElementById('vs-island').textContent,
    fragmentShader: document.getElementById('fs-island').textContent,
    uniforms: {
      uTime: { value: 0 },
      uSunDirection: { value: new THREE.Vector3() },
      uSunIntensity: { value: 1 },
      uWindDirection: { value: new THREE.Vector3(1, 0, 0) },
      uWindStrength: { value: 0.2 },
      uFogColor: { value: new THREE.Color(0x0a0812) },
      uFogDensity: { value: 0.0003 },
    },
  });
  
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.frustumCulled = true;
  scene.add(mesh);
  
  STATE.chunks.set(key, { cx, cz, mesh, type: 'land', heightData: heights, res });
  
  return mesh;
}

function fbm(x, z, octaves, seed) {
  let v = 0, a = 0.5, f = 1;
  const rnd = seededRandom(seed || 0);
  for (let i = 0; i < octaves; i++) {
    v += a * noise2D(x * f, z * f, rnd);
    f *= 2; a *= 0.5;
  }
  return v;
}

function noise2D(x, z, rnd) {
  const X = Math.floor(x), Z = Math.floor(z);
  const fx = x - X, fz = z - Z;
  const u = fx * fx * (3 - 2 * fx);
  const v = fz * fz * (3 - 2 * fz);
  const hash = (a, b) => {
    const s = (a * 127.1 + b * 311.7) >>> 0;
    return (Math.sin(s) * 43758.5453) % 1;
  };
  const n00 = hash(X, Z);
  const n10 = hash(X + 1, Z);
  const n01 = hash(X, Z + 1);
  const n11 = hash(X + 1, Z + 1);
  return n00 * (1 - u) * (1 - v) + n10 * u * (1 - v) + n01 * (1 - u) * v + n11 * u * v;
}

function updateChunks() {
  const playerChunk = getChunkCoord(STATE.player.pos.x, STATE.player.pos.z);
  
  // Generate needed chunks
  for (let cx = playerChunk.x - CONFIG.VIEW_DISTANCE; cx <= playerChunk.x + CONFIG.VIEW_DISTANCE; cx++) {
    for (let cz = playerChunk.z - CONFIG.VIEW_DISTANCE; cz <= playerChunk.z + CONFIG.VIEW_DISTANCE; cz++) {
      generateChunk(cx, cz);
    }
  }
  
  // Unload distant chunks
  for (const [key, chunk] of STATE.chunks) {
    const dx = Math.abs(chunk.cx - playerChunk.x);
    const dz = Math.abs(chunk.cz - playerChunk.z);
    if (dx > CONFIG.VIEW_DISTANCE + 1 || dz > CONFIG.VIEW_DISTANCE + 1) {
      if (chunk.mesh) {
        scene.remove(chunk.mesh);
        chunk.mesh.geometry.dispose();
        chunk.mesh.material.dispose();
      }
      STATE.chunks.delete(key);
    }
  }
}

// ============================================================================
// CREATURE SYSTEM
// ============================================================================
function spawnCreatures() {
  let spawned = 0;
  for (const island of STATE.islands) {
    const biome = BIOMES.find(b => b.id === island.biome);
    if (!biome) continue;
    
    const creatureTypes = biome.creatures.map(id => CREATURE_TYPES[id]).filter(c => c);
    const count = Math.floor(island.radius / 30) * 3;
    
    for (let i = 0; i < count && spawned < CONFIG.MAX_CREATURES; i++) {
      const type = creatureTypes[RNG.nextInt(0, creatureTypes.length)];
      const angle = RNG.nextFloat(0, Math.PI * 2);
      const dist = RNG.nextFloat(20, island.radius * 0.9);
      const y = getTerrainHeightAt(island.x + Math.cos(angle) * dist, island.z + Math.sin(angle) * dist) + RNG.nextFloat(5, 50);
      
      const creature = {
        id: spawned,
        type: type,
        pos: new THREE.Vector3(island.x + Math.cos(angle) * dist, y, island.z + Math.sin(angle) * dist),
        vel: new THREE.Vector3(),
        target: null,
        state: 'idle',
        phase: RNG.nextFloat(0, Math.PI * 2),
        homeIsland: island,
        wanderTarget: null,
        wanderTimer: 0,
      };
      
      updateCreatureInstance(spawned, creature);
      STATE.creatures.push(creature);
      spawned++;
    }
  }
}

function updateCreatureInstance(index, creature) {
  const matrix = new THREE.Matrix4();
  const quat = new THREE.Quaternion();
  if (creature.vel.lengthSq() > 0.01) {
    quat.setFromUnitVectors(new THREE.Vector3(0, 1, 0), creature.vel.clone().normalize());
  }
  matrix.makeRotationFromQuaternion(quat);
  matrix.setPosition(creature.pos);
  creatureMesh.setMatrixAt(index, matrix);
  
  const color = new THREE.Color(creature.type.color);
  const colorArr = creatureMesh.geometry.attributes.aColor.array;
  colorArr[index * 3] = color.r;
  colorArr[index * 3 + 1] = color.g;
  colorArr[index * 3 + 2] = color.b;
  creatureMesh.geometry.attributes.aColor.needsUpdate = true;
  
  const scaleArr = creatureMesh.geometry.attributes.aScale.array;
  const s = creature.type.size;
  scaleArr[index * 3] = s;
  scaleArr[index * 3 + 1] = s;
  scaleArr[index * 3 + 2] = s;
  creatureMesh.geometry.attributes.aScale.needsUpdate = true;
  
  const phaseArr = creatureMesh.geometry.attributes.aPhase.array;
  phaseArr[index] = creature.phase;
  creatureMesh.geometry.attributes.aPhase.needsUpdate = true;
  
  creatureMesh.instanceMatrix.needsUpdate = true;
}

function updateCreatures(dt) {
  const playerPos = STATE.player.pos;
  let activeCount = 0;
  
  for (let i = 0; i < STATE.creatures.length; i++) {
    const c = STATE.creatures[i];
    if (c.pos.distanceTo(playerPos) > 2000) {
      // Despawn distant creatures, respawn near player
      if (RNG.next() < 0.01) {
        respawnCreatureNearPlayer(c);
      }
      continue;
    }
    activeCount++;
    
    const behavior = c.type.behavior;
    const speed = c.type.speed;
    
    switch (behavior) {
      case 'flock':
        updateFlockBehavior(c, dt, speed);
        break;
      case 'school':
        updateSchoolBehavior(c, dt, speed);
        break;
      case 'swarm':
        updateSwarmBehavior(c, dt, speed);
        break;
      case 'drift':
        updateDriftBehavior(c, dt, speed);
        break;
      case 'wander':
        updateWanderBehavior(c, dt, speed);
        break;
      case 'hunt':
        updateHuntBehavior(c, dt, speed);
        break;
      case 'patrol':
        updatePatrolBehavior(c, dt, speed);
        break;
      case 'orbit':
        updateOrbitBehavior(c, dt, speed);
        break;
      case 'soar':
        updateSoarBehavior(c, dt, speed);
        break;
      case 'skirmish':
        updateSkirmishBehavior(c, dt, speed);
        break;
      case 'ambush':
        updateAmbushBehavior(c, dt, speed);
        break;
      case 'stalk':
        updateStalkBehavior(c, dt, speed);
        break;
      case 'territorial':
        updateTerritorialBehavior(c, dt, speed);
        break;
      case 'sessile':
        updateSessileBehavior(c, dt, speed);
        break;
      case 'filter':
        updateFilterBehavior(c, dt, speed);
        break;
    }
    
    // Collision with terrain
    const terrainY = getTerrainHeightAt(c.pos.x, c.pos.z);
    if (c.pos.y < terrainY + c.type.size) {
      c.pos.y = terrainY + c.type.size;
      c.vel.y = 0;
    }
    
    // Water interaction
    if (c.pos.y < 5 && c.type.habitat.includes('crystal')) {
      c.vel.y += 0.5;
    }
    
    updateCreatureInstance(i, c);
  }
  
  document.getElementById('life-value').textContent = activeCount;
}

function respawnCreatureNearPlayer(creature) {
  const angle = RNG.nextFloat(0, Math.PI * 2);
  const dist = RNG.nextFloat(100, 500);
  const biome = getBiomeAt(new THREE.Vector3(STATE.player.pos.x + Math.cos(angle) * dist, 0, STATE.player.pos.z + Math.sin(angle) * dist));
  const types = biome.creatures.map(id => CREATURE_TYPES[id]).filter(c => c);
  if (types.length === 0) return;
  
  creature.type = types[RNG.nextInt(0, types.length)];
  creature.pos.set(
    STATE.player.pos.x + Math.cos(angle) * dist,
    getTerrainHeightAt(STATE.player.pos.x + Math.cos(angle) * dist, STATE.player.pos.z + Math.sin(angle) * dist) + RNG.nextFloat(10, 60),
    STATE.player.pos.z + Math.sin(angle) * dist
  );
  creature.vel.set(0, 0, 0);
  creature.state = 'idle';
  creature.phase = RNG.nextFloat(0, Math.PI * 2);
}

function getNearbyCreatures(creature, radius) {
  return STATE.creatures.filter(c => c !== creature && c.pos.distanceTo(creature.pos) < radius);
}

function getAlignment(creatures) {
  const avg = new THREE.Vector3();
  for (const c of creatures) avg.add(c.vel.clone().normalize());
  return avg.lengthSq() > 0 ? avg.normalize() : new THREE.Vector3();
}

function getCohesion(creatures, pos) {
  const avg = new THREE.Vector3();
  for (const c of creatures) avg.add(c.pos);
  avg.divideScalar(creatures.length);
  return avg.sub(pos).normalize();
}

function getSeparation(creatures, pos, radius) {
  const avg = new THREE.Vector3();
  let count = 0;
  for (const c of creatures) {
    const d = pos.distanceTo(c.pos);
    if (d < radius && d > 0) {
      avg.add(pos.clone().sub(c.pos).normalize().divideScalar(d));
      count++;
    }
  }
  return count > 0 ? avg.divideScalar(count).normalize() : new THREE.Vector3();
}

function updateFlockBehavior(c, dt, speed) {
  const nearby = getNearbyCreatures(c, 50);
  const align = getAlignment(nearby).multiplyScalar(1.5);
  const cohere = getCohesion(nearby, c.pos).multiplyScalar(1.0);
  const separate = getSeparation(nearby, c.pos, 15).multiplyScalar(2.5);
  const wander = new THREE.Vector3(
    Math.sin(c.phase + STATE.time) * 0.5,
    Math.cos(c.phase * 1.3 + STATE.time) * 0.3,
    Math.cos(c.phase + STATE.time * 0.7) * 0.5
  );
  const targetDir = new THREE.Vector3().add(align).add(cohere).add(separate).add(wander).normalize();
  c.vel.lerp(targetDir.multiplyScalar(speed), dt * 3);
  c.pos.addScaledVector(c.vel, dt);
  c.phase += dt;
}

function updateSchoolBehavior(c, dt, speed) {
  const nearby = getNearbyCreatures(c, 30);
  const cohere = getCohesion(nearby, c.pos).multiplyScalar(2.0);
  const separate = getSeparation(nearby, c.pos, 8).multiplyScalar(3.0);
  const depth = Math.sin(c.phase + STATE.time * 0.5) * 10;
  const targetY = getTerrainHeightAt(c.pos.x, c.pos.z) + 5 + depth;
  const vertical = new THREE.Vector3(0, targetY - c.pos.y, 0).normalize().multiplyScalar(speed * 0.5);
  const targetDir = new THREE.Vector3().add(cohere).add(separate).add(vertical).normalize();
  c.vel.lerp(targetDir.multiplyScalar(speed), dt * 4);
  c.pos.addScaledVector(c.vel, dt);
  c.phase += dt;
}

function updateSwarmBehavior(c, dt, speed) {
  const playerDist = c.pos.distanceTo(STATE.player.pos);
  if (playerDist < 30) {
    const flee = c.pos.clone().sub(STATE.player.pos).normalize().multiplyScalar(speed * 2);
    c.vel.lerp(flee, dt * 5);
  } else {
    const center = new THREE.Vector3(0, 50, 0);
    const toCenter = center.clone().sub(c.pos).normalize().multiplyScalar(0.5);
    const wander = new THREE.Vector3(
      Math.sin(c.phase * 2 + STATE.time) * 2,
      Math.cos(c.phase * 1.5 + STATE.time) * 1,
      Math.cos(c.phase * 2 + STATE.time * 0.8) * 2
    );
    const targetDir = new THREE.Vector3().add(toCenter).add(wander).normalize();
    c.vel.lerp(targetDir.multiplyScalar(speed), dt * 2);
  }
  c.pos.addScaledVector(c.vel, dt);
  c.phase += dt;
}

function updateDriftBehavior(c, dt, speed) {
  const wind = new THREE.Vector3(Math.sin(STATE.time * 0.1) * 0.5, 0, Math.cos(STATE.time * 0.1) * 0.5);
  const buoyancy = new THREE.Vector3(0, Math.sin(c.phase + STATE.time * 0.3) * 0.5, 0);
  const targetDir = new THREE.Vector3().add(wind).add(buoyancy).normalize();
  c.vel.lerp(targetDir.multiplyScalar(speed), dt * 1);
  c.pos.addScaledVector(c.vel, dt);
  c.phase += dt;
}

function updateWanderBehavior(c, dt, speed) {
  c.wanderTimer -= dt;
  if (c.wanderTimer <= 0 || !c.wanderTarget) {
    const angle = RNG.nextFloat(0, Math.PI * 2);
    const dist = RNG.nextFloat(20, 100);
    c.wanderTarget = new THREE.Vector3(
      c.homeIsland.x + Math.cos(angle) * Math.min(dist, c.homeIsland.radius * 0.8),
      getTerrainHeightAt(c.homeIsland.x + Math.cos(angle) * dist, c.homeIsland.z + Math.sin(angle) * dist) + 2,
      c.homeIsland.z + Math.sin(angle) * dist
    );
    c.wanderTimer = RNG.nextFloat(5, 15);
  }
  const toTarget = c.wanderTarget.clone().sub(c.pos);
  if (toTarget.length() < 5) {
    c.wanderTimer = 0;
  } else {
    c.vel.lerp(toTarget.normalize().multiplyScalar(speed), dt * 2);
    c.pos.addScaledVector(c.vel, dt);
  }
  c.phase += dt;
}

function updateHuntBehavior(c, dt, speed) {
  // Hunt smaller creatures
  const prey = STATE.creatures.find(p => p !== c && p.type.size < c.type.size * 0.8 && p.pos.distanceTo(c.pos) < 100);
  if (prey) {
    const toPrey = prey.pos.clone().sub(c.pos).normalize();
    c.vel.lerp(toPrey.multiplyScalar(speed * 1.5), dt * 4);
  } else {
    updateWanderBehavior(c, dt, speed * 0.5);
  }
  c.pos.addScaledVector(c.vel, dt);
  c.phase += dt;
}

function updatePatrolBehavior(c, dt, speed) {
  if (!c.patrolPoints) {
    c.patrolPoints = [];
    for (let i = 0; i < 4; i++) {
      const angle = (i / 4) * Math.PI * 2;
      c.patrolPoints.push(new THREE.Vector3(
        c.homeIsland.x + Math.cos(angle) * c.homeIsland.radius * 0.7,
        getTerrainHeightAt(c.homeIsland.x + Math.cos(angle) * c.homeIsland.radius * 0.7, c.homeIsland.z + Math.sin(angle) * c.homeIsland.radius * 0.7) + 3,
        c.homeIsland.z + Math.sin(angle) * c.homeIsland.radius * 0.7
      ));
    }
    c.patrolIndex = 0;
  }
  const target = c.patrolPoints[c.patrolIndex];
  const toTarget = target.clone().sub(c.pos);
  if (toTarget.length() < 10) {
    c.patrolIndex = (c.patrolIndex + 1) % c.patrolPoints.length;
  } else {
    c.vel.lerp(toTarget.normalize().multiplyScalar(speed), dt * 1);
    c.pos.addScaledVector(c.vel, dt);
  }
  c.phase += dt;
}

function updateOrbitBehavior(c, dt, speed) {
  const center = c.homeIsland;
  const radius = c.homeIsland.radius * 0.6 + Math.sin(c.phase) * 20;
  const targetAngle = STATE.time * 0.1 + c.phase;
  const targetPos = new THREE.Vector3(
    center.x + Math.cos(targetAngle) * radius,
    center.height * 0.5 + Math.sin(c.phase * 0.5) * 20 + 30,
    center.z + Math.sin(targetAngle) * radius
  );
  const toTarget = targetPos.clone().sub(c.pos);
  c.vel.lerp(toTarget.normalize().multiplyScalar(speed), dt * 2);
  c.pos.addScaledVector(c.vel, dt);
  c.phase += dt;
}

function updateSoarBehavior(c, dt, speed) {
  const thermal = new THREE.Vector3(0, Math.sin(STATE.time * 0.05 + c.phase) * 2, 0);
  const circle = new THREE.Vector3(
    Math.cos(c.phase + STATE.time * 0.03) * 30,
    0,
    Math.sin(c.phase + STATE.time * 0.03) * 30
  );
  const center = new THREE.Vector3(c.homeIsland.x, c.homeIsland.height + 50, c.homeIsland.z);
  const targetPos = center.clone().add(circle).add(thermal);
  const toTarget = targetPos.clone().sub(c.pos);
  c.vel.lerp(toTarget.normalize().multiplyScalar(speed), dt * 1.5);
  c.pos.addScaledVector(c.vel, dt);
  c.phase += dt;
}

function updateSkirmishBehavior(c, dt, speed) {
  const nearby = getNearbyCreatures(c, 60);
  const separate = getSeparation(nearby, c.pos, 25).multiplyScalar(3.0);
  const playerDist = c.pos.distanceTo(STATE.player.pos);
  let playerInfluence = new THREE.Vector3();
  if (playerDist < 50) {
    playerInfluence = c.pos.clone().sub(STATE.player.pos).normalize().multiplyScalar(2.0);
  }
  const wander = new THREE.Vector3(
    Math.sin(c.phase * 1.5 + STATE.time) * 2,
    Math.sin(c.phase * 0.7 + STATE.time) * 1,
    Math.cos(c.phase * 1.5 + STATE.time * 0.8) * 2
  );
  const targetDir = new THREE.Vector3().add(separate).add(playerInfluence).add(wander).normalize();
  c.vel.lerp(targetDir.multiplyScalar(speed), dt * 3);
  c.pos.addScaledVector(c.vel, dt);
  c.phase += dt;
}

function updateAmbushBehavior(c, dt, speed) {
  c.ambushTimer = (c.ambushTimer || 0) - dt;
  if (c.ambushTimer <= 0) {
    c.ambushPos = c.pos.clone();
    c.ambushTimer = RNG.nextFloat(10, 30);
  }
  const toAmbush = c.ambushPos.clone().sub(c.pos);
  if (toAmbush.length() > 2) {
    c.vel.lerp(toAmbush.normalize().multiplyScalar(speed * 0.3), dt * 1);
  } else {
    c.vel.multiplyScalar(0.95);
  }
  c.pos.addScaledVector(c.vel, dt);
  c.phase += dt;
}

function updateStalkBehavior(c, dt, speed) {
  const playerDist = c.pos.distanceTo(STATE.player.pos);
  if (playerDist < 100 && playerDist > 20) {
    const toPlayer = STATE.player.pos.clone().sub(c.pos);
    toPlayer.y *= 0.5;
    c.vel.lerp(toPlayer.normalize().multiplyScalar(speed * 0.8), dt * 2);
  } else if (playerDist <= 20) {
    const away = c.pos.clone().sub(STATE.player.pos).normalize();
    c.vel.lerp(away.multiplyScalar(speed * 1.5), dt * 4);
  } else {
    updateDriftBehavior(c, dt, speed * 0.5);
  }
  c.pos.addScaledVector(c.vel, dt);
  c.phase += dt;
}

function updateTerritorialBehavior(c, dt, speed) {
  const territoryCenter = new THREE.Vector3(c.homeIsland.x, 0, c.homeIsland.z);
  const toCenter = territoryCenter.clone().sub(c.pos);
  toCenter.y = 0;
  
  const playerDist = c.pos.distanceTo(STATE.player.pos);
  if (playerDist < 40) {
    const threaten = c.pos.clone().sub(STATE.player.pos).normalize();
    c.vel.lerp(threaten.multiplyScalar(speed * 1.2), dt * 3);
  } else if (toCenter.length() > c.homeIsland.radius * 0.5) {
    c.vel.lerp(toCenter.normalize().multiplyScalar(speed), dt * 2);
  } else {
    const wander = new THREE.Vector3(
      Math.sin(c.phase + STATE.time) * 1,
      0,
      Math.cos(c.phase + STATE.time) * 1
    );
    c.vel.lerp(wander.normalize().multiplyScalar(speed * 0.5), dt * 1);
  }
  c.pos.addScaledVector(c.vel, dt);
  c.phase += dt;
}

function updateSessileBehavior(c, dt, speed) {
  c.vel.multiplyScalar(0.98);
  c.pos.addScaledVector(c.vel, dt);
  c.phase += dt;
}

function updateFilterBehavior(c, dt, speed) {
  const current = new THREE.Vector3(Math.sin(STATE.time * 0.02) * 0.5, 0, Math.cos(STATE.time * 0.02) * 0.5);
  const circle = new THREE.Vector3(
    Math.cos(c.phase + STATE.time * 0.02) * 40,
    Math.sin(c.phase * 0.3) * 10,
    Math.sin(c.phase + STATE.time * 0.02) * 40
  );
  const center = new THREE.Vector3(c.homeIsland.x, c.homeIsland.height + 20, c.homeIsland.z);
  const targetPos = center.clone().add(circle).add(current.multiplyScalar(5));
  const toTarget = targetPos.clone().sub(c.pos);
  c.vel.lerp(toTarget.normalize().multiplyScalar(speed), dt * 1.5);
  c.pos.addScaledVector(c.vel, dt);
  c.phase += dt;
}

// ============================================================================
// PARTICLE SYSTEM
// ============================================================================
function emitParticle(pos, vel, life, color, size, delay = 0) {
  // Find dead particle slot
  const lifeArr = particleMesh.geometry.attributes.aLife.array;
  const delayArr = particleMesh.geometry.attributes.aDelay.array;
  const startArr = particleMesh.geometry.attributes.aStartPos.array;
  const velArr = particleMesh.geometry.attributes.aVelocity.array;
  const colorArr = particleMesh.geometry.attributes.aColor.array;
  const sizeArr = particleMesh.geometry.attributes.aSize.array;
  
  for (let i = 0; i < CONFIG.MAX_PARTICLES; i++) {
    const t = (STATE.time * 1000 - delayArr[i]) / lifeArr[i];
    if (t >= 1 || lifeArr[i] === 0) {
      startArr[i * 3] = pos.x;
      startArr[i * 3 + 1] = pos.y;
      startArr[i * 3 + 2] = pos.z;
      velArr[i * 3] = vel.x;
      velArr[i * 3 + 1] = vel.y;
      velArr[i * 3 + 2] = vel.z;
      lifeArr[i] = life;
      delayArr[i] = STATE.time * 1000 + delay;
      colorArr[i * 3] = color.r;
      colorArr[i * 3 + 1] = color.g;
      colorArr[i * 3 + 2] = color.b;
      sizeArr[i] = size;
      particleMesh.geometry.attributes.aStartPos.needsUpdate = true;
      particleMesh.geometry.attributes.aVelocity.needsUpdate = true;
      particleMesh.geometry.attributes.aLife.needsUpdate = true;
      particleMesh.geometry.attributes.aDelay.needsUpdate = true;
      particleMesh.geometry.attributes.aColor.needsUpdate = true;
      particleMesh.geometry.attributes.aSize.needsUpdate = true;
      return;
    }
  }
}

      ),

      RNG.nextFloat(0.5, 1.5)
    );

  if (biome.id === 'luminous' && RNG.next() < 0.08) {

        STATE.player.pos.z + RNG.nextFloat(-40, 40)
      ),

      RNG.nextFloat(5, 15),
      new THREE.Color(0xc084fc),
      RNG.nextFloat(0.3, 1)
    );
  }
  
  if (biome.id === 'thermal' && RNG.next() < 0.1) {
    emitParticle(

        STATE.player.pos.z + RNG.nextFloat(-20, 20)

}

// ============================================================================
// PLAYER CONTROLLER
// ============================================================================
function updatePlayer(dt) {
  const p = STATE.player;
  const input = STATE.input;
  const mode = p.mode;
  
  // Mode switching
  if (input.mode) {
    const modes = ['walk', 'glide', 'flight', 'skimmer'];
    const canFlight = p.energy > 30;
    const canSkimmer = p.energy > 10;
    if (input.mode === 'flight' && !canFlight) { showToast('Insufficient Energy', 'Flight requires 30% energy', 'creature'); input.mode = null; }
    else if (input.mode === 'skimmer' && !canSkimmer) { showToast('Insufficient Energy', 'Skimmer requires 10% energy', 'creature'); input.mode = null; }
    else {
      p.mode = input.mode;
      updateModeButtons();
      input.mode = null;
      showToast(`Mode: ${input.mode.charAt(0).toUpperCase() + input.mode.slice(1)}`, '', 'landmark');
    }
  }
  
  // Energy management
  const energyCost = { walk: 0, glide: 0.5, flight: 2, skimmer: 0.8 };
  const energyRegen = { walk: 1.5, glide: 0.2, flight: -1, skimmer: 0.1 };
  p.energy = clamp(p.energy - energyCost[mode] * dt + energyRegen[mode] * dt, 0, p.maxEnergy);
  
  if (p.energy <= 0 && mode !== 'walk') {
    p.mode = 'walk';
    updateModeButtons();
    showToast('Energy Depleted', 'Reverted to Walk mode', 'creature');
  }
  
  // Movement
  const forward = new THREE.Vector3(Math.sin(p.yaw), 0, Math.cos(p.yaw)).normalize();
  const right = new THREE.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw)).normalize();
  
  let accel = new THREE.Vector3();
  
  switch (mode) {
    case 'walk': {
      const speed = input.boost ? 12 : 6;
      if (input.forward !== 0) accel.addScaledVector(forward, input.forward * speed);
      if (input.right !== 0) accel.addScaledVector(right, input.right * speed);
      p.vel.x = lerp(p.vel.x, accel.x, dt * 10);
      p.vel.z = lerp(p.vel.z, accel.z, dt * 10);
      p.vel.y -= 9.81 * dt * 2;
      
      // Ground collision
      const terrainY = getTerrainHeightAt(p.pos.x, p.pos.z);
      if (p.pos.y <= terrainY + 1.8) {
        p.pos.y = terrainY + 1.8;
        p.vel.y = Math.max(0, p.vel.y);
        if (input.up > 0) p.vel.y = 12;
      }
      
      // Water collision
      if (p.pos.y < 2) {
        p.pos.y = 2;
        p.vel.y = Math.max(0, p.vel.y);
      }
      break;
    }
    
    case 'glide': {
      const speed = input.boost ? 25 : 15;
      const glideRatio = 0.15;
      if (input.forward !== 0) accel.addScaledVector(forward, input.forward * speed);
      if (input.right !== 0) accel.addScaledVector(right, input.right * speed * 0.5);
      if (input.up !== 0) accel.y += input.up * speed * 0.5;
      
      p.vel.lerp(accel, dt * 3);
      p.vel.y -= 9.81 * dt * glideRatio;
      
      // Terrain following
      const terrainY = getTerrainHeightAt(p.pos.x, p.pos.z);
      const targetHeight = terrainY + 10;
      if (p.pos.y < targetHeight) {
        p.vel.y += (targetHeight - p.pos.y) * dt * 3;
      }
      break;
    }
    
    case 'flight': {
      const speed = input.boost ? 60 : 35;
      if (input.forward !== 0) accel.addScaledVector(forward, input.forward * speed);
      if (input.right !== 0) accel.addScaledVector(right, input.right * speed * 0.7);
      if (input.up !== 0) accel.y += input.up * speed;
      
      p.vel.lerp(accel, dt * 5);
      break;
    }
    
    case 'skimmer': {
      const speed = input.boost ? 30 : 18;
      if (input.forward !== 0) accel.addScaledVector(forward, input.forward * speed);
      if (input.right !== 0) accel.addScaledVector(right, input.right * speed * 0.6);
      
      p.vel.lerp(accel, dt * 4);
      
      // Maintain height above water/ground
      const terrainY = getTerrainHeightAt(p.pos.x, p.pos.z);
      const waterY = 0;
      const targetHeight = Math.max(terrainY, waterY) + 3;
      if (p.pos.y < targetHeight) {
        p.vel.y += (targetHeight - p.pos.y) * dt * 5;
      } else if (p.pos.y > targetHeight + 5) {
        p.vel.y -= (p.pos.y - targetHeight) * dt * 2;
      }
      break;
    }
  }
  
  // Apply velocity
  p.pos.addScaledVector(p.vel, dt);
  
  // World bounds
  const maxDist = 25000;
  const dist = Math.sqrt(p.pos.x * p.pos.x + p.pos.z * p.pos.z);
  if (dist > maxDist) {
    p.pos.x = (p.pos.x / dist) * maxDist;
    p.pos.z = (p.pos.z / dist) * maxDist;
    p.vel.x *= -0.5;
    p.vel.z *= -0.5;
  }
  
  // Camera update
  updateCamera(dt);
  
  // Discovery check
  checkDiscoveries();
  
  // Crystal collection
  checkCrystals();
}

function updateCamera(dt) {
  const p = STATE.player;
  const mode = p.mode;
  
  // Smooth yaw/pitch
  p.yaw += STATE.input.yaw;
  p.pitch = clamp(p.pitch + STATE.input.pitch, -Math.PI/2 + 0.1, Math.PI/2 - 0.1);
  STATE.input.yaw = 0;
  STATE.input.pitch = 0;
  
  let targetOffset;
  switch (mode) {
    case 'walk':
      targetOffset = new THREE.Vector3(0, 1.8, 5);
      break;
    case 'glide':
      targetOffset = new THREE.Vector3(0, 2.5, 8);
      break;
    case 'flight':
      targetOffset = new THREE.Vector3(0, 3, 12);
      break;
    case 'skimmer':
      targetOffset = new THREE.Vector3(0, 2, 10);
      break;
  }
  
  // Apply pitch to offset
  const pitchQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -p.pitch * 0.5);
  targetOffset.applyQuaternion(pitchQuat);
  
  STATE.camera.offset.lerp(targetOffset, dt * 5);
  
  const yawQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), p.yaw);
  const camOffset = STATE.camera.offset.clone().applyQuaternion(yawQuat);
  
  STATE.camera.target.lerp(p.pos.clone().add(new THREE.Vector3(0, 1.5, 0)), dt * 10);
  camera.position.lerp(STATE.camera.target.clone().add(camOffset), dt * 8);
  camera.lookAt(STATE.camera.target);
  
  // Camera shake
  if (STATE.camera.shake > 0) {
    camera.position.x += (Math.random() - 0.5) * STATE.camera.shake;
    camera.position.y += (Math.random() - 0.5) * STATE.camera.shake;
    STATE.camera.shake *= 0.9;
  }
}

function updateModeButtons() {
  document.querySelectorAll('.mode-btn').forEach(btn => {
    const active = btn.dataset.mode === STATE.player.mode;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', active);
  });
  document.getElementById('mode-value').textContent = STATE.player.mode.toUpperCase();
}

function getTerrainHeightAt(x, z) {
  const chunk = getChunkCoord(x, z);
  const key = getChunkKey(chunk.x, chunk.z);
  const chunkData = STATE.chunks.get(key);
  if (!chunkData || !chunkData.heightData) {
    // Fallback: check islands directly
    let h = 0;
    for (const island of STATE.islands) {
      const dx = x - island.x;
      const dz = z - island.z;
      const dist = Math.sqrt(dx*dx + dz*dz);
      if (dist < island.radius) {
        h = Math.max(h, island.height * (1 - dist / island.radius));
      }
    }
    return h;
  }
  
  const res = chunkData.res;
  const localX = x - chunk.x * CONFIG.CHUNK_SIZE;
  const localZ = z - chunk.z * CONFIG.CHUNK_SIZE;
  const gx = (localX / CONFIG.CHUNK_SIZE) * res;
  const gz = (localZ / CONFIG.CHUNK_SIZE) * res;
  const ix = Math.floor(gx);
  const iz = Math.floor(gz);
  const fx = gx - ix;
  const fz = gz - iz;
  
  if (ix < 0 || ix >= res || iz < 0 || iz >= res) return 0;
  
  const h00 = chunkData.heightData[iz * (res + 1) + ix];
  const h10 = ix < res ? chunkData.heightData[iz * (res + 1) + ix + 1] : h00;
  const h01 = iz < res ? chunkData.heightData[(iz + 1) * (res + 1) + ix] : h00;
  const h11 = (ix < res && iz < res) ? chunkData.heightData[(iz + 1) * (res + 1) + ix + 1] : h00;
  
  return lerp(lerp(h00, h10, fx), lerp(h01, h11, fx), fz);
}

function checkDiscoveries() {
  for (const disc of DISCOVERIES) {
    if (disc.pos && !STATE.player.discoveries.has(disc.id)) {
      const dist = STATE.player.pos.distanceTo(disc.pos);
      if (dist < 50) {
        STATE.player.discoveries.add(disc.id);
        STATE.player.crystals += disc.reward;
        showToast(`Discovered: ${disc.name}`, disc.desc, disc.type);
        updateHUD();
      }
    }
  }
}

function checkCrystals() {
  // Procedural crystals near player
  const chunk = getChunkCoord(STATE.player.pos.x, STATE.player.pos.z);
  const key = getChunkKey(chunk.x, chunk.z);
  if (!STATE.chunks.has(key)) return;
  
  // Simple crystal spawn check
  if (RNG.next() < 0.001) {
    const crystalPos = new THREE.Vector3(
      STATE.player.pos.x + RNG.nextFloat(-20, 20),
      getTerrainHeightAt(STATE.player.pos.x + RNG.nextFloat(-20, 20), STATE.player.pos.z + RNG.nextFloat(-20, 20)) + 2,
      STATE.player.pos.z + RNG.nextFloat(-20, 20)
    );
    if (crystalPos.distanceTo(STATE.player.pos) < 5) {
      STATE.player.crystals += RNG.nextInt(1, 5);
      showToast('Crystal Collected', `+${RNG.nextInt(1, 5)} Aether Crystals`, 'landmark');
      updateHUD();
      // Visual feedback
      for (let i = 0; i < 10; i++) {
        emitParticle(crystalPos, new THREE.Vector3(RNG.nextFloat(-2,2), RNG.nextFloat(1,5), RNG.nextFloat(-2,2)), 1, new THREE.Color(0x00ffcc), 0.5);
      }
    }
  }
}

// ============================================================================
// TIME & WEATHER
// ============================================================================
function updateTimeAndWeather(dt) {
  STATE.time += dt * STATE.timeScale * 24;
  if (STATE.time >= 24) STATE.time -= 24;
  
  // Weather transitions
  const weather = STATE.weather;
  weather.transition -= dt;
  
  if (weather.transition <= 0) {
    // Chance to change weather
    if (RNG.next() < 0.0005) {
      const types = Object.keys(WEATHER_TYPES);
      const currentIdx = types.indexOf(weather.type);
      let newType;
      do { newType = types[RNG.nextInt(0, types.length)]; } while (newType === weather.type && types.length > 1);
      
      weather.type = newType;
      weather.targetIntensity = RNG.nextFloat(0.3, 1.0);
      weather.transition = RNG.nextFloat(300, 1200); // 5-20 minutes
      showToast(`Weather Changing`, `${WEATHER_TYPES[newType].name} approaching`, 'landmark');
    }
  }
  
  // Smooth intensity transition
  weather.intensity = lerp(weather.intensity, weather.targetIntensity, dt * 0.1);
  
  // Aurora at night
  const intensity = getSunIntensity(STATE.time);
  if (intensity < 0.15 && RNG.next() < 0.0001) {
    weather.type = 'aurora';
    weather.targetIntensity = RNG.nextFloat(0.5, 1);
    weather.transition = RNG.nextFloat(60, 180);
  }
  
  // Void haze near void islands
  const biome = getBiomeAt(STATE.player.pos);
  if (biome.id === 'void' && weather.type === 'clear' && RNG.next() < 0.001) {
    weather.type = 'void_haze';
    weather.targetIntensity = RNG.nextFloat(0.4, 0.8);
    weather.transition = RNG.nextFloat(120, 300);
  }
}

// ============================================================================
// RENDERING
// ============================================================================
function render() {
  if (!STATE.initialized) return;
  
  const dt = Math.min(clock.getDelta(), 0.1);
  STATE.frameTime = dt * 1000;
  STATE.fps = 1 / dt;
  
  if (!STATE.paused) {
    updateTimeAndWeather(dt);
    updatePlayer(dt);
    updateCreatures(dt);
    updateParticles(dt);
    updateChunks();
    updateHUD();
    updateMinimap();
    updateCompass();
    updateShaders(dt);
  }
  
  // Render to offscreen target
  renderer.setRenderTarget(renderTarget);
  renderer.render(scene, camera);
  
  // Post-process
  renderer.setRenderTarget(null);
  renderer.render(postQuad, new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1));
  
  updatePerformanceGraph();
  requestAnimationFrame(render);
}

function updateShaders(dt) {
  const time = STATE.time * 3600; // Convert to seconds for shader
  const sunDir = getSunDirection(STATE.time);
  const sunIntensity = getSunIntensity(STATE.time);
  const weather = STATE.weather;
  const weatherData = WEATHER_TYPES[weather.type];
  const colors = getSkyColors(STATE.time, weather);
  const fogDensity = weatherData.fog * (1 + weather.intensity * 2);
  
  // Atmosphere
  atmosphereMesh.material.uniforms.uSunDirection.value.copy(sunDir);
  atmosphereMesh.material.uniforms.uTime.value = time;
  atmosphereMesh.material.uniforms.uSunIntensity.value = sunIntensity;
  atmosphereMesh.material.uniforms.uFogColor.value.copy(colors.fog);
  atmosphereMesh.material.uniforms.uFogDensity.value = fogDensity;
  atmosphereMesh.material.uniforms.uHorizonColor.value.copy(colors.horizon);
  atmosphereMesh.material.uniforms.uZenithColor.value.copy(colors.zenith);
  atmosphereMesh.material.uniforms.uGroundColor.value.copy(colors.ground);
  atmosphereMesh.material.uniforms.uCloudCover.value = weatherData.cloudCover;
  atmosphereMesh.material.uniforms.uCloudSpeed.value = weatherData.wind * 0.0001;
  
  // Water
  waterMesh.material.uniforms.uTime.value = time;
  waterMesh.material.uniforms.uSunDirection.value.copy(sunDir);
  waterMesh.material.uniforms.uSunIntensity.value = sunIntensity;
  waterMesh.material.uniforms.uFogColor.value.copy(colors.fog);
  waterMesh.material.uniforms.uFogDensity.value = fogDensity;
  
  // Islands
  for (const [, chunk] of STATE.chunks) {
    if (chunk.mesh) {
      chunk.mesh.material.uniforms.uTime.value = time;
      chunk.mesh.material.uniforms.uSunDirection.value.copy(sunDir);
      chunk.mesh.material.uniforms.uSunIntensity.value = sunIntensity;
      chunk.mesh.material.uniforms.uWindStrength.value = weatherData.wind;
      chunk.mesh.material.uniforms.uFogColor.value.copy(colors.fog);
      chunk.mesh.material.uniforms.uFogDensity.value = fogDensity;
    }
  }
  
  // Creatures
  creatureMesh.material.uniforms.uTime.value = time;
  creatureMesh.material.uniforms.uSunIntensity.value = sunIntensity;
  creatureMesh.material.uniforms.uFogColor.value.copy(colors.fog);
  creatureMesh.material.uniforms.uFogDensity.value = fogDensity;
  
  // Particles
  particleMesh.material.uniforms.uTime.value = time;
  particleMesh.material.uniforms.uFogColor.value.copy(colors.fog);
  particleMesh.material.uniforms.uFogDensity.value = fogDensity;
  
  // Lighting
  sunLight.position.copy(sunDir.clone().multiplyScalar(1000));
  sunLight.intensity = sunIntensity * 2.5 * (1 - weatherData.cloudCover * 0.5);
  sunLight.color.setHSL(0.1, 0.3, 0.8 + sunIntensity * 0.2);
  
  ambientLight.intensity = 0.3 + sunIntensity * 0.3;
  ambientLight.color.copy(colors.zenith).multiplyScalar(0.3);
  
  hemisphereLight.intensity = 0.5 + sunIntensity * 0.3;
  hemisphereLight.color.set(colors.zenith);
  hemisphereLight.groundColor.set(colors.ground);
  
  // Scene fog
  scene.fog.color.copy(colors.fog);
  scene.fog.density = fogDensity;
  
  // Post-processing
  postMaterial.uniforms.uTime.value = time;
  postMaterial.uniforms.uExposure.value = sunIntensity < 0.2 ? 1.5 : 1.0;
  postMaterial.uniforms.uBloomIntensity.value = sunIntensity > 0.5 ? 0.4 : 0.2;
  postMaterial.uniforms.uColorGrade.value.copy(colors.zenith).lerp(new THREE.Color(0xffffff), 0.9);
  
  // Sun shadow camera
  sunLight.shadow.camera.position.copy(camera.position).add(sunDir.clone().multiplyScalar(200));
  sunLight.shadow.camera.lookAt(camera.position);
}

function updateHUD() {
  document.getElementById('time-display').textContent = formatTime(STATE.time);
  document.getElementById('weather-tag').textContent = WEATHER_TYPES[STATE.weather.type].name.toUpperCase();
  document.getElementById('energy-fill').style.width = `${STATE.player.energy}%`;
  document.getElementById('energy-value').textContent = `${Math.round(STATE.player.energy)}%`;
  document.getElementById('crystals-value').textContent = STATE.player.crystals;
  document.getElementById('discoveries-value').textContent = `${STATE.player.discoveries.size}/${DISCOVERIES.length}`;
  
  const biome = getBiomeAt(STATE.player.pos);
  document.getElementById('biome-value').textContent = biome.name;
  document.getElementById('temp-value').textContent = `${Math.round(biome.temp + WEATHER_TYPES[STATE.weather.type].tempMod)}°C`;
  document.getElementById('wind-value').textContent = `${Math.round(WEATHER_TYPES[STATE.weather.type].wind * 20)} km/h`;
  document.getElementById('humidity-value').textContent = `${biome.humidity}%`;
  document.getElementById('anomaly-value').textContent = STATE.weather.type === 'void_haze' ? 'Elevated' : (STATE.weather.type === 'aurora' ? 'Mystical' : 'Stable');
  document.getElementById('alt-value').textContent = `${Math.round(STATE.player.pos.y)} m`;
  document.getElementById('vel-value').textContent = `${Math.round(STATE.player.vel.length() * 3.6)} km/h`;
}

function updateCompass() {
  const player = document.getElementById('compass-player');
  player.style.setProperty('--pr', `${-STATE.player.yaw}rad`);
}

function updateMinimap() {
  const canvas = document.getElementById('minimap-canvas');
  const ctx = canvas.getContext('2d');
  const size = 184;
  const scale = 0.03; // world units to pixels
  
  ctx.fillStyle = '#0a0812';
  ctx.fillRect(0, 0, size, size);
  
  // Draw islands
  for (const island of STATE.islands) {
    const x = (island.x - STATE.player.pos.x) * scale + size/2;
    const y = (island.z - STATE.player.pos.z) * scale + size/2;
    const r = island.radius * scale;
    
    if (x + r > 0 && x - r < size && y + r > 0 && y - r < size) {
      const biome = BIOMES.find(b => b.id === island.biome);
      const gradient = ctx.createRadialGradient(x, y, 0, x, y, r);
      gradient.addColorStop(0, biome.color1.getStyle());
      gradient.addColorStop(1, biome.color2.getStyle());
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      
      // Landmarks
      for (const lm of island.landmarks) {
        const lx = x + Math.cos(lm.angle) * lm.dist * scale;
        const ly = y + Math.sin(lm.angle) * lm.dist * scale;
        ctx.fillStyle = '#ffb800';
        ctx.beginPath();
        ctx.arc(lx, ly, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  
  // Draw player
  const px = size/2;
  const py = size/2;
  ctx.fillStyle = '#00ffcc';
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, Math.PI * 2);
  ctx.fill();
  
  // Heading line
  ctx.strokeStyle = '#00ffcc';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.sin(-STATE.player.yaw) * 15, py + Math.cos(-STATE.player.yaw) * 15);
  ctx.stroke();
  
  // Discovered discoveries
  for (const disc of DISCOVERIES) {
    if (disc.pos && STATE.player.discoveries.has(disc.id)) {
      const x = (disc.pos.x - STATE.player.pos.x) * scale + size/2;
      const y = (disc.pos.z - STATE.player.pos.z) * scale + size/2;
      if (x > 0 && x < size && y > 0 && y < size) {
        ctx.fillStyle = '#ffb800';
        ctx.fillRect(x - 2, y - 2, 4, 4);
      }
    }
  }
}

function updatePerformanceGraph() {
  const canvas = document.getElementById('perf-canvas');
  const ctx = canvas.getContext('2d');
  const w = 160, h = 60;
  
  if (!ctx.buffer) {
    ctx.buffer = new Float32Array(w).fill(60);
  }
  
  ctx.buffer = new Float32Array([...ctx.buffer.slice(1), STATE.fps]);
  
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(6,4,14,0.7)';
  ctx.fillRect(0, 0, w, h);
  
  ctx.strokeStyle = STATE.fps >= 45 ? '#00d4aa' : '#ff6b4a';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < w; i++) {
    const y = h - (ctx.buffer[i] / 120) * h;
    if (i === 0) ctx.moveTo(i, y);
    else ctx.lineTo(i, y);
  }
  ctx.stroke();
  
  ctx.fillStyle = STATE.fps >= 45 ? '#00d4aa' : '#ff6b4a';
  ctx.font = '10px IBM Plex Mono';
  ctx.fillText(`${Math.round(STATE.fps)} FPS`, 4, 12);
}

function startNewGame() {
  const name = document.getElementById('new-save-name').value || `expedition_${Date.now()}`;
  STATE.player = { pos: new THREE.Vector3(0, 50, 0), vel: new THREE.Vector3(), yaw: 0, pitch: 0, mode: 'walk', energy: 100, maxEnergy: 100, crystals: 0, discoveries: new Set() };
  STATE.time = 6;
  STATE.weather = { type: 'clear', intensity: 0, targetIntensity: 0, transition: 0 };
  STATE.chunks.clear();
  STATE.creatures = [];
  STATE.discoveries = [];
  for (const disc of DISCOVERIES) disc.pos = null;
  generateWorld();
  camera.position.copy(STATE.player.pos);
  closeModal();
  saveGame(name);
  showToast('New Expedition', 'Your journey begins at the Crystal Heart', 'landmark');
}

function setQuality(level) {
  STATE.quality = level;
  const q = CONFIG.QUALITY_LEVELS[level];
  renderer.shadowMap.enabled = q.shadowMapSize > 0;
  if (sunLight.shadow) {
    sunLight.shadow.mapSize.set(q.shadowMapSize, q.shadowMapSize);
  }
  postMaterial.uniforms.uBloomIntensity.value = q.bloom ? 0.3 : 0;
  // Adjust particle count would require rebuilding mesh - skip for simplicity
  showToast('Quality Changed', `Set to ${level.charAt(0).toUpperCase() + level.slice(1)}`, 'landmark');
}

function setTimeScale(val) {
  STATE.timeScale = parseFloat(val);
}

function toggleReducedMotion(enabled) {
  STATE.reducedMotion = enabled;
  document.body.style.setProperty('--reduced', enabled ? '1' : '0');
}

// ============================================================================
// REBUILD WORLD (for loading saves)
// ============================================================================
function rebuildWorld() {
  // Clear existing
  for (const [, chunk] of STATE.chunks) {
    if (chunk.mesh) {
      scene.remove(chunk.mesh);
      chunk.mesh.geometry.dispose();
      chunk.mesh.material.dispose();
    }
  }
  STATE.chunks.clear();
  scene.remove(creatureMesh);
  scene.remove(particleMesh);
  
  // Recreate creatures
  // ... (simplified - full rebuild would be complex)
  
  // Regenerate chunks around player
  const startChunk = getChunkCoord(STATE.player.pos.x, STATE.player.pos.z);
  for (let cx = -CONFIG.VIEW_DISTANCE; cx <= CONFIG.VIEW_DISTANCE; cx++) {
    for (let cz = -CONFIG.VIEW_DISTANCE; cz <= CONFIG.VIEW_DISTANCE; cz++) {
      generateChunk(startChunk.x + cx, startChunk.z + cz);
    }
  }
  
  spawnCreatures();
  camera.position.copy(STATE.player.pos);
}

// ============================================================================
// INITIALIZATION
// ============================================================================
async function init() {
  // Initialize STATE after Three.js is loaded
  STATE = createInitialState();
  
  // Initialize biomes (requires THREE.Color)
  initBiomes();
  
  const loadingStatus = document.getElementById('loading-status');
  const loadingFill = document.getElementById('loading-fill');
  
  const steps = [
    { name: 'Initializing Three.js', fn: initThree, progress: 10 },
    { name: 'Generating world', fn: generateWorld, progress: 40 },
    { name: 'Spawning inhabitants', fn: spawnCreatures, progress: 60 },
    { name: 'Building shaders', fn: () => {}, progress: 80 },
    { name: 'Finalizing', fn: () => {}, progress: 100 },
  ];
  
  for (const step of steps) {
    loadingStatus.textContent = step.name;
    loadingFill.style.width = `${step.progress}%`;
    await new Promise(r => setTimeout(r, 50));
    step.fn();
  }
  
  document.getElementById('loading').classList.add('hidden');
  loadSaveList();
  render();
  
  // Auto-save every 30 seconds
  setInterval(() => {
    if (STATE.currentSave) saveGame(STATE.currentSave);
  }, 30000);
  
  // Welcome toast
  setTimeout(() => {
    showToast('Welcome to Aether Isles', 'Click to lock pointer • WASD to move • 1-4 for modes', 'landmark');
  }, 1000);
}

// Expose for inline handlers
window.loadGame = loadGame;
window.deleteSave = deleteSave;
window.exportSave = exportSave;
window.importSave = importSave;
window.startNewGame = startNewGame;
window.setQuality = setQuality;
window.setTimeScale = setTimeScale;
window.toggleReducedMotion = toggleReducedMotion;
window.closeModal = closeModal;

// Start
init();
</script>
