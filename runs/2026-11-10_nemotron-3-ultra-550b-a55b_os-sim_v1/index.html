<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#0a0f1a">
  <title>Lumina OS</title>
  <link rel="preload" as="style" href="assets/styles/core.css">
  <link rel="stylesheet" href="assets/styles/core.css">
  <link rel="preload" as="script" href="assets/js/core.js">
  <script type="module" src="assets/js/core.js"></script>
</head>
<body>
  <div id="os-root" class="os-root" role="application" aria-label="Lumina OS Desktop">
    <!-- Boot Screen -->
    <div id="boot-screen" class="boot-screen" aria-hidden="true" role="status" aria-live="polite">
      <div class="boot-content">
        <svg class="boot-logo" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="bootGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="50%" stop-color="#a855f7"/>
              <stop offset="100%" stop-color="#ec4899"/>
            </linearGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <circle cx="60" cy="60" r="54" fill="url(#bootGradient)" filter="url(#glow)" opacity="0.3"/>
          <path d="M60 18 C35 18 16 37 16 62 C16 78 28 92 44 98 C48 99 52 99 56 98 C72 92 84 78 84 62 C84 37 65 18 60 18 Z" 
                fill="none" stroke="url(#bootGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M48 58 L56 66 L72 46" fill="none" stroke="url(#bootGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1 class="boot-title">Lumina</h1>
        <p class="boot-subtitle">A new kind of desktop</p>
        <div class="boot-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="boot-progress-bar"></div>
        </div>
        <p class="boot-status">Initializing...</p>
      </div>
    </div>

    <!-- Lock Screen -->
    <div id="lock-screen" class="lock-screen" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Lock Screen">
      <div class="lock-background"></div>
      <div class="lock-overlay">
        <div class="lock-clock" id="lock-clock" aria-live="polite">
          <time class="lock-time" id="lock-time">00:00</time>
          <div class="lock-date" id="lock-date">Loading...</div>
        </div>
        <div class="lock-greeting" id="lock-greeting">Welcome back</div>
        <div class="lock-hint">Press any key or click to unlock</div>
        <div class="lock-notifications" id="lock-notifications" aria-live="polite"></div>
      </div>
    </div>

    <!-- Desktop Layer -->
    <div id="desktop" class="desktop" aria-hidden="true">
      <!-- Wallpaper -->
      <div id="wallpaper" class="wallpaper" role="img" aria-label="Desktop wallpaper"></div>
      
      <!-- Desktop Icons -->
      <div id="desktop-icons" class="desktop-icons" role="list" aria-label="Desktop icons"></div>

      <!-- Window Container -->
      <div id="windows-container" class="windows-container" role="region" aria-label="Application windows"></div>

      <!-- Taskbar -->
      <div id="taskbar" class="taskbar" role="region" aria-label="Taskbar">
        <button id="start-button" class="start-button" aria-label="Open launcher" aria-expanded="false" aria-controls="launcher" type="button">
          <svg class="start-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <span class="start-text">Lumina</span>
        </button>
        <div id="taskbar-apps" class="taskbar-apps" role="list" aria-label="Running applications"></div>
        <div id="taskbar-system" class="taskbar-system">
          <div id="notifications-button" class="taskbar-btn" aria-label="Notifications" aria-expanded="false" aria-controls="notification-center" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notification-badge" id="notification-badge" aria-live="polite" aria-hidden="true">0</span>
          </div>
          <div id="system-tray" class="taskbar-btn" aria-label="System tray" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </div>
          <time id="taskbar-clock" class="taskbar-clock" aria-live="polite">00:00</time>
        </div>
      </div>
    </div>

    <!-- Launcher -->
    <div id="launcher" class="launcher" role="dialog" aria-modal="true" aria-label="Application Launcher" aria-hidden="true">
      <div class="launcher-backdrop" tabindex="-1"></div>
      <div class="launcher-panel">
        <div class="launcher-header">
          <h2 class="launcher-title">Applications</h2>
          <div class="launcher-search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="search" id="launcher-search" class="launcher-search-input" placeholder="Search apps, files, settings..." aria-label="Search" autocomplete="off" spellcheck="false">
            <kbd class="search-shortcut">⌘K</kbd>
          </div>
        </div>
        <div class="launcher-content">
          <div class="launcher-apps" id="launcher-apps" role="listbox" aria-label="Applications"></div>
          <div class="launcher-recent" id="launcher-recent" role="listbox" aria-label="Recent" hidden>
            <h3 class="launcher-section-title">Recent</h3>
            <div class="launcher-recent-list" id="launcher-recent-list"></div>
          </div>
          <div class="launcher-files" id="launcher-files" role="listbox" aria-label="Files" hidden>
            <h3 class="launcher-section-title">Files</h3>
            <div class="launcher-files-list" id="launcher-files-list"></div>
          </div>
        </div>
        <div class="launcher-footer">
          <div class="launcher-user">
            <div class="user-avatar" aria-hidden="true">U</div>
            <div class="user-info">
              <span class="user-name" id="user-name">User</span>
              <span class="user-device">Lumina OS</span>
            </div>
          </div>
          <div class="launcher-power">
            <button class="power-btn" id="btn-lock" aria-label="Lock" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="9" width="10" height="11" rx="2"/><path d="M22 11h-4M22 16h-4"/></svg></button>
            <button class="power-btn" id="btn-restart" aria-label="Restart" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
            <button class="power-btn" id="btn-shutdown" aria-label="Shutdown" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="8"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Notification Center -->
    <div id="notification-center" class="notification-center" role="dialog" aria-modal="true" aria-label="Notifications" aria-hidden="true">
      <div class="notification-backdrop" tabindex="-1"></div>
      <div class="notification-panel">
        <div class="notification-header">
          <h2>Notifications</h2>
          <button id="clear-notifications" class="notification-clear" aria-label="Clear all" type="button">Clear All</button>
        </div>
        <div class="notification-list" id="notification-list" role="log" aria-live="polite" aria-label="Notification list"></div>
        <div class="notification-empty" id="notification-empty" hidden>No notifications</div>
      </div>
    </div>

    <!-- Context Menu (shared) -->
    <div id="context-menu" class="context-menu" role="menu" aria-hidden="true"></div>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

    <!-- Alt-Tab Switcher -->
    <div id="alt-tab-switcher" class="alt-tab-switcher" role="dialog" aria-modal="true" aria-label="Window Switcher" aria-hidden="true">
      <div class="alt-tab-backdrop"></div>
      <div class="alt-tab-panel">
        <div class="alt-tab-hint">Hold <kbd>Alt</kbd> + <kbd>Tab</kbd> to switch</div>
        <div class="alt-tab-list" id="alt-tab-list" role="listbox" aria-label="Open windows"></div>
      </div>
    </div>

    <!-- Audio Context for system sounds -->
    <audio id="system-audio" preload="auto"></audio>
  </div>

  <!-- Template for window chrome -->
  <template id="window-template">
    <div class="window" role="application" tabindex="0">
      <div class="window-chrome">
        <div class="window-titlebar">
          <div class="window-title">
            <svg class="window-icon" aria-hidden="true"></svg>
            <span class="window-title-text"></span>
          </div>
          <div class="window-controls">
            <button class="window-btn minimize" aria-label="Minimize" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
            <button class="window-btn maximize" aria-label="Maximize" type="button"><svg class="max-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/></svg><svg class="restore-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="9" y="9" width="10" height="10" rx="1"/></svg></button>
            <button class="window-btn close" aria-label="Close" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>
        </div>
        <div class="window-content"></div>
        <div class="window-resize-handles">
          <div class="resize-handle n" data-dir="n"></div>
          <div class="resize-handle ne" data-dir="ne"></div>
          <div class="resize-handle e" data-dir="e"></div>
          <div class="resize-handle se" data-dir="se"></div>
          <div class="resize-handle s" data-dir="s"></div>
          <div class="resize-handle sw" data-dir="sw"></div>
          <div class="resize-handle w" data-dir="w"></div>
          <div class="resize-handle nw" data-dir="nw"></div>
        </div>
      </div>
    </div>
  </template>

  <!-- Templates for apps will be injected dynamically -->
  <div id="app-templates" hidden></div>

  <!-- AppRegistry global placeholder (set by core.js) -->
  <script>
    window.AppRegistry = { apps: new Map(), instances: new Map(), register: function(app) { this.apps.set(app.id, app); }, get: function(id) { return this.apps.get(id); }, getAll: function() { return [...this.apps.values()].sort((a, b) => a.name.localeCompare(b.name)); }, search: function(query) { const q = query.toLowerCase(); return this.getAll().filter(app => app.name.toLowerCase().includes(q) || (app.keywords && app.keywords.some(k => k.toLowerCase().includes(q)))); }, launch: function(appId, options = {}) { const app = this.apps.get(appId); if (!app) { console.warn('App not found:', appId); return null; } if (app.singleInstance) { const existing = window.LuminaOS?.windowManager?.getAppWindows(appId)[0]; if (existing) { window.LuminaOS.windowManager.focus(existing.id); if (options.path && existing.appInstance && existing.appInstance.openPath) existing.appInstance.openPath(options.path); return existing; } } const win = window.LuminaOS?.windowManager?.create(appId, { title: options.title || app.name, icon: app.icon, width: options.width || app.width, height: options.height || app.height, x: options.x, y: options.y }); if (!win) return null; const instance = new app.class(win, options); win.appInstance = instance; this.instances.set(win.id, instance); if (instance.init) instance.init(); return win; }, close: function(appId) { const windows = window.LuminaOS?.windowManager?.getAppWindows(appId); windows?.forEach(w => window.LuminaOS.windowManager.close(w.id)); } };
  </script>

  <!-- App Modules -->
  <script type="module" src="apps/files.js"></script>
  <script type="module" src="apps/terminal.js"></script>
  <script type="module" src="apps/editor.js"></script>
  <script type="module" src="apps/paint.js"></script>
  <script type="module" src="apps/music.js"></script>
  <script type="module" src="apps/calendar.js"></script>
  <script type="module" src="apps/system-monitor.js"></script>
  <script type="module" src="apps/browser.js"></script>
  <script type="module" src="apps/settings.js"></script>
  <script type="module" src="apps/calculator.js"></script>
</body>
</html>
