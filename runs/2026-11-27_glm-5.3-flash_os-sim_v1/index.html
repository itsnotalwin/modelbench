/* ---------- 29 · Editor (Quill) ---------- */
Apps.register({
  id:'editor', name:'Editor', icon:'quill', tint:'#9d8cff',
  w:780, h:540, min:[460,300],
  mount(win, args){
    const st = { path:(args&&args.path)||null, saved:'\n\n', wrap:true };
    let previewOn=false;
    const ta = h('textarea',{class:'ed-ta wrap', spellcheck:'false', 'aria-label':'Text editor'});
    const gut = h('div',{class:'ed-gutter'});
    const preview = h('div',{class:'ed-preview', style:{display:'none'}});
    const status = h('div',{class:'app-foot'});
    const btnSave = h('button',{class:'btn small primary'}, icon('save',13), h('span',{text:'Save'}));
    const btnSaveAs = h('button',{class:'btn small'}, icon('download',13), h('span',{text:'Save as…'}));
    const segWrap = h('button',{class:'icon-btn on', 'aria-label':'Toggle word wrap', title:'Word wrap'}, icon('list',15));
    const btnPrev = h('button',{class:'icon-btn', 'aria-label':'Markdown preview', title:'Markdown preview'}, icon('eye',15));
    const btnMinus = h('button',{class:'icon-btn', 'aria-label':'Smaller text', title:'Smaller text'}, icon('minus',14));
    const btnPlus = h('button',{class:'icon-btn', 'aria-label':'Bigger text', title:'Bigger text'}, icon('plus',14));
    const pathChip = h('span',{class:'chip mono', style:{marginLeft:'auto', maxWidth:'240px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}, text: st.path||'unsaved'});
    win.body.append(h('div',{class:'ed'},
      h('div',{class:'app-bar'}, btnSave, btnSaveAs, h('span',{style:{width:'4px'}}), segWrap, btnPrev, btnMinus, btnPlus, pathChip),
      h('div',{class:'ed-wrap'}, gut, ta, preview),
      status));
    function load(){
      if (!st.path){ ta.value=''; st.saved='\n\n'; gutUpdate(); statusUpdate(); titleUpdate(); return; }
      const n = VFS.node(st.path);
      if (!n || n.type!=='file'){ Notify.push({title:'File not found', body:st.path}); return; }
      ta.value = n.content||'';
      st.saved = ta.value;
      win.setTitle(VFS.basename(st.path)+' — Editor');
      pathChip.textContent = st.path;
      gutUpdate(); statusUpdate(); titleUpdate();
    }
    function titleUpdate(){
      const base = st.path ? VFS.basename(st.path) : 'untitled';
      win.setTitle((win.dirty?'● ':'')+base+' — Editor');
    }
    function gutUpdate(){
      const lines = ta.value.split('\n').length;
      let s='';
      for (let i2=1;i2<=lines;i2++) s += i2+'\n';
      gut.textContent = s;
      gut.scrollTop = ta.scrollTop;
    }
    function statusUpdate(){
      const pos = ta.selectionStart;
      const upto = ta.value.slice(0,pos);
      const ln = upto.split('\n').length;
      const col = pos - upto.lastIndexOf('\n');
      const words = (ta.value.match(/\S+/g)||[]).length;
      status.innerHTML='';
      status.append(
        h('span',{class:'tnum', text:'Ln '+ln+', Col '+col}),
        h('span',{text:ta.value.length+' chars · '+words+' words'}),
        h('span',{style:{marginLeft:'auto'}, text: win.dirty?'unsaved changes':'saved'}));
    }
    function mdToHtml(src){
      const lines = String(src).split('\n');
      let html='', inCode=false, inList=null;
      const inline = s=>{
        s = esc(s);
        s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
        s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
        s = s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="#" onclick="return false">$1</a>');
        return s;
      };
      for (const raw of lines){
        const line = raw;
        if (line.trim().startsWith('```')){ inCode=!inCode; html += inCode?'<pre><code>':'</code></pre>'; continue; }
        if (inCode){ html += esc(line)+'\n'; continue; }
        const h3m = line.match(/^(#{1,3})\s+(.*)/);
        if (h3m){ if (inList){html+='</'+inList+'>'; inList=null;} html += '<h'+h3m[1].length+'>'+inline(h3m[2])+'</h'+h3m[1].length+'>'; continue; }
        if (/^\s*[-*]\s+/.test(line)){ if (inList!=='ul'){ if(inList)html+='</'+inList+'>'; html+='<ul>'; inList='ul'; } html+='<li>'+inline(line.replace(/^\s*[-*]\s+/,''))+'</li>'; continue; }
        if (/^\s*\d+\.\s+/.test(line)){ if (inList!=='ol'){ if(inList)html+='</'+inList+'>'; html+='<ol>'; inList='ol'; } html+='<li>'+inline(line.replace(/^\s*\d+\.\s+/,''))+'</li>'; continue; }
        if (inList){ html+='</'+inList+'>'; inList=null; }
        if (/^\s*>\s?/.test(line)){ html += '<blockquote>'+inline(line.replace(/^\s*>\s?/,''))+'</blockquote>'; continue; }
        if (/^\s*---+\s*$/.test(line)){ html += '<hr>'; continue; }
        if (!line.trim()){ continue; }
        html += '<p>'+inline(line)+'</p>';
      }
      if (inList) html+='</'+inList+'>';
      if (inCode) html+='</code></pre>';
      return html;
    }
    function collectDirs(sel){
      const dirs = VFS.findDirs();
      return dirs.map(d=>h('option',{value:d, selected:d===sel?true:null}, d));
    }
    function saveAs(){
      Dialog.custom({build:(card, finish)=>{
        const name = h('input',{class:'field', value: st.path?VFS.basename(st.path):'untitled.txt', style:{width:'100%'}});
        const dirSel = h('select',{class:'field', style:{width:'100%'}}, collectDirs(st.path?VFS.dirname(st.path):'/Documents'));
        const go = ()=>{
          let nm = name.value.trim();
          if (!nm || /[\\/]/.test(nm)) return;
          const dir = VFS.node(dirSel.value);
          if (!dir || dir.type!=='dir') return;
          const ex = VFS.node(VFS.join(dirSel.value, nm));
          let finalName;
          if (ex && ex.type==='file'){ VFS.write(VFS.join(dirSel.value, nm), ta.value); finalName = nm; }
          else { finalName = VFS.uniqueName(dir, nm);
            dir.children.push({id:uid('n'), name:finalName, type:'file', content:ta.value, mime:VFS.mimeOf(finalName), mtime:Date.now()});
          }
          VFS.changed('write');
          st.path = VFS.join(dirSel.value, finalName);
          st.saved = ta.value; win.dirty=false;
          pathChip.textContent = st.path;
          titleUpdate(); statusUpdate();
          finish(true);
          Notify.push({title:'Saved', body:st.path, icon:'save'});
        };
        name.addEventListener('keydown', e=>{ e.stopPropagation(); if (e.key==='Enter'){ e.preventDefault(); go(); } });
        dirSel.addEventListener('keydown', e=>e.stopPropagation());
        card.append(h('h3',{text:'Save as'}),
          h('div',{class:'micro', style:{marginTop:'12px'}, text:'folder'}),
          dirSel,
          h('div',{class:'micro', style:{marginTop:'10px'}, text:'name'}),
          name,
          h('div',{class:'modal-foot'}, h('button',{class:'btn', text:'Cancel', onclick:()=>finish(false)}), h('button',{class:'btn primary', text:'Save', onclick:go})));
        setTimeout(()=>{ dirSel.value = st.path ? VFS.dirname(st.path) : '/Documents'; name.select(); }, 50);
      }});
    }
    function save(){
      if (!st.path){ saveAs(); return; }
      const n = VFS.node(st.path);
      if (!n || n.type!=='file'){ saveAs(); return; }
      VFS.write(st.path, ta.value);
      VFS.changed('write');
      st.saved = ta.value; win.dirty=false;
      titleUpdate(); statusUpdate();
      Notify.push({title:'Saved', body:st.path, icon:'save', timeout:2200});
    }
    ta.addEventListener('input', ()=>{
      win.dirty = ta.value!==st.saved;
      titleUpdate(); gutUpdate(); statusUpdate();
      if (previewOn) preview.innerHTML = mdToHtml(ta.value);
    });
    ta.addEventListener('scroll', ()=>{ gut.scrollTop = ta.scrollTop; });
    ta.addEventListener('keyup', statusUpdate);
    ta.addEventListener('click', statusUpdate);
    ta.addEventListener('keydown', e=>{
      e.stopPropagation();
      if ((e.ctrlKey||e.metaKey) && e.key==='s' && !e.shiftKey){ e.preventDefault(); save(); }
      else if ((e.ctrlKey||e.metaKey) && (e.key==='S' || (e.key==='s'&&e.shiftKey))){ e.preventDefault(); saveAs(); }
      else if (e.key==='Tab'){ e.preventDefault();
        const s0=ta.selectionStart, e0=ta.selectionEnd;
        ta.value = ta.value.slice(0,s0)+'  '+ta.value.slice(e0);
        ta.selectionStart=ta.selectionEnd=s0+2;
        ta.dispatchEvent(new Event('input'));
      }
    });
    btnSave.addEventListener('click', save);
    btnSaveAs.addEventListener('click', saveAs);
    segWrap.addEventListener('click', ()=>{ st.wrap=!st.wrap; ta.classList.toggle('wrap', st.wrap); segWrap.classList.toggle('on', st.wrap); Sound.play('toggle'); });
    btnPrev.addEventListener('click', ()=>{
      previewOn=!previewOn;
      preview.style.display = previewOn?'':'none';
      ta.style.display = previewOn?'none':'';
      gut.style.display = previewOn?'none':'';
      btnPrev.classList.toggle('on', previewOn);
      if (previewOn) preview.innerHTML = mdToHtml(ta.value);
      Sound.play('toggle');
    });
    let fs=12.8;
    btnMinus.addEventListener('click', ()=>{ fs=Math.max(10, fs-1); ta.style.fontSize=fs+'px'; gut.style.fontSize=fs+'px'; });
    btnPlus.addEventListener('click', ()=>{ fs=Math.min(22, fs+1); ta.style.fontSize=fs+'px'; gut.style.fontSize=fs+'px'; });
    load();
    setTimeout(()=>ta.focus(), 80);
    return null;
  },
});

      Dialog.prompt({title:'Save to Pictures', label:'File name', value:'painting-'+(new Date().getHours())+pad2(new Date().getMinutes())+'.png', ok:'Save'})
        .then(name=>{
          if (!name) return;
          let nm = name.toLowerCase().endsWith('.png') ? name : name+'.png';
          const dir = VFS.node('/Pictures');
          nm = VFS.uniqueName(dir, nm);
          dir.children.push({id:uid('n'), name:nm, type:'file', content:base.toDataURL('image/png'), mime:'image/png', mtime:Date.now()});
          VFS.changed('create');
          Notify.push({title:'Saved to /Pictures', body:nm, icon:'easel'});
        });
    });
    const exportBtn = foot.querySelectorAll('.btn')[1];
    exportBtn.addEventListener('click', ()=>{
      try{
        const a = h('a',{href:base.toDataURL('image/png'), download:'vesper-painting.png'});
        document.body.append(a); a.click(); a.remove();
        Notify.push({title:'PNG exported', icon:'download'});
      }catch(e){ Notify.push({title:'Export failed', body:'The canvas refused.', icon:'info'}); }
    });
    btnUndo.addEventListener('click', undo);
    btnRedo.addEventListener('click', redo);
    btnClear.addEventListener('click', ()=>{
      Dialog.confirm({title:'Clear canvas', body:'Erase the whole painting? (Undo still works.)', ok:'Clear', danger:true})
        .then(ok=>{ if (ok){ snap(); bctx.fillStyle='#12141c'; bctx.fillRect(0,0,AW,AH); } });
    });

    function snap(){
      history.length = hIdx+1;
      history.push(base.toDataURL());
      if (history.length>26) history.shift();
      hIdx = history.length-1;
    }
    function restore(url){
      const im = new Image();
      im.onload = ()=>{ bctx.clearRect(0,0,AW,AH); bctx.drawImage(im,0,0); };
      im.src = url;
    }
    function undo(){ if (hIdx>0){ hIdx--; restore(history[hIdx]); Sound.play('click'); } }
    function redo(){ if (hIdx<history.length-1){ hIdx++; restore(history[hIdx]); Sound.play('click'); } }
    snap();

    /* coords */
    function pos(e){
      const r = base.getBoundingClientRect();
      return { x: clamp((e.clientX-r.left)*(AW/r.width), 0, AW), y: clamp((e.clientY-r.top)*(AH/r.height), 0, AH) };
    }
    function pickColorAt(p){
      try{
        const d = bctx.getImageData(Math.round(p.x), Math.round(p.y), 1, 1).data;
        return '#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
      }catch(e){ return null; }
    }
    function strokeSeg(from, to, erase){
      bctx.save();
      bctx.strokeStyle = erase ? '#12141c' : color;
      bctx.lineWidth = size; bctx.lineCap='round'; bctx.lineJoin='round';
      bctx.beginPath(); bctx.moveTo(from.x, from.y); bctx.lineTo(to.x, to.y); bctx.stroke();
      bctx.restore();
    }
    function constrain(p){
      if (!shift) return p;
      const dx=p.x-sx, dy=p.y-sy;
      if (tool==='line'){
        const ang = Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4);
        const len = Math.hypot(dx,dy);
        return {x:sx+Math.cos(ang)*len, y:sy+Math.sin(ang)*len};
      }
      const m = Math.max(Math.abs(dx), Math.abs(dy));
      return {x: sx+Math.sign(dx||1)*m, y: sy+Math.sign(dy||1)*m};
    }
    function shapePreview(p){
      octx.clearRect(0,0,AW,AH);
      const q = constrain(p);
      octx.strokeStyle=color; octx.lineWidth=size; octx.lineCap='round';
      octx.beginPath();
      if (tool==='line'){ octx.moveTo(sx,sy); octx.lineTo(q.x,q.y); }
      else if (tool==='rect'){ octx.rect(Math.min(sx,q.x), Math.min(sy,q.y), Math.abs(q.x-sx), Math.abs(q.y-sy)); }
      else if (tool==='ellipse'){ octx.ellipse((sx+q.x)/2,(sy+q.y)/2, Math.abs(q.x-sx)/2||1, Math.abs(q.y-sy)/2||1, 0, 0, Math.PI*2); }
      octx.stroke();
    }
    function flood(p){
      const x0=Math.round(p.x), y0=Math.round(p.y);
      const img = bctx.getImageData(0,0,AW,AH);
      const d = img.data, Wp=AW;
      const idx=(x,y)=>(y*Wp+x)*4;
      const tgt = [d[idx(x0,y0)], d[idx(x0,y0)+1], d[idx(x0,y0)+2]];
      const rep = [parseInt(color.slice(1,3),16), parseInt(color.slice(3,5),16), parseInt(color.slice(5,7),16)];
      if (Math.abs(tgt[0]-rep[0])+Math.abs(tgt[1]-rep[1])+Math.abs(tgt[2]-rep[2]) < 6) return;
      const tol = 52;
      const match = (i)=>{
        const dr=d[i]-tgt[0], dg=d[i+1]-tgt[1], db=d[i+2]-tgt[2];
        return Math.abs(dr)+Math.abs(dg)+Math.abs(db) <= tol;
      };
      const setPix = i=>{ d[i]=rep[0]; d[i+1]=rep[1]; d[i+2]=rep[2]; d[i+3]=255; };
      const stack2=[[x0,y0]];
      let guard = 0;
      while (stack2.length && guard++<2000000){
        const [x,y] = stack2.pop();
        if (x<0||y<0||x>=AW||y>=AH) continue;
        let i = idx(x,y);
        if (!match(i)) continue;
        let w=x, e2=x;
        while (w>0 && match(idx(w-1,y))) w--;
        while (e2<AW-1 && match(idx(e2+1,y))) e2++;
        for (let xi=w; xi<=e2; xi++){ i=idx(xi,y); setPix(i); if (y>0 && match(idx(xi,y-1))) stack2.push([xi,y-1]); if (y<AH-1 && match(idx(xi,y+1))) stack2.push([xi,y+1]); }
      }
      bctx.putImageData(img,0,0);
    }
    over.addEventListener('pointerdown', e=>{
      if (e.button!==0) return;
      const p = pos(e); shift = e.shiftKey;
      if (tool==='picker'){
        const c = pickColorAt(p);
        if (c){ color=c; $$('.swatch',colorRow).forEach(x=>x.classList.remove('on')); paintDot(); }
        return;
      }
      drawing = true; sx=p.x; sy=p.y; lx=p.x; ly=p.y;
      try{ over.setPointerCapture(e.pointerId); }catch(err){}
      if (tool==='brush'||tool==='eraser'||tool==='fill') snap();
      if (tool==='fill'){ flood(p); drawing=false; Sound.play('toggle'); }
      else if (tool==='brush'||tool==='eraser') strokeSeg(p, {x:p.x+.01,y:p.y+.01}, tool==='eraser');
    });
    over.addEventListener('pointermove', e=>{
      const p = pos(e);
      shift = e.shiftKey;
      if (!drawing) return;
      if (tool==='brush'||tool==='eraser'){ strokeSeg({x:lx,y:ly}, p, tool==='eraser'); lx=p.x; ly=p.y; }
      else if (tool==='line'||tool==='rect'||tool==='ellipse') shapePreview(p);
    });
    const finishDraw = e=>{
      if (!drawing) return;
      drawing=false;
      const p = pos(e);
      if (tool==='line'||tool==='rect'||tool==='ellipse'){
        snap();
        octx.clearRect(0,0,AW,AH);
        const q = constrain(p);
        bctx.save(); bctx.strokeStyle=color; bctx.lineWidth=size; bctx.lineCap='round';
        bctx.beginPath();
        if (tool==='line'){ bctx.moveTo(sx,sy); bctx.lineTo(q.x,q.y); }
        else if (tool==='rect'){ bctx.rect(Math.min(sx,q.x), Math.min(sy,q.y), Math.abs(q.x-sx), Math.abs(q.y-sy)); }
        else { bctx.ellipse((sx+q.x)/2,(sy+q.y)/2, Math.abs(q.x-sx)/2||1, Math.abs(q.y-sy)/2||1, 0, 0, Math.PI*2); }
        bctx.stroke(); bctx.restore();
      }
    };
    over.addEventListener('pointerup', finishDraw);
    over.addEventListener('pointercancel', ()=>{ drawing=false; octx.clearRect(0,0,AW,AH); });
    over.addEventListener('contextmenu', e=>{
      e.preventDefault();
      const c = pickColorAt(pos(e));
      if (c){ color=c; $$('.swatch',colorRow).forEach(x=>x.classList.remove('on')); paintDot(); }
    });
    win.listen(window, 'keydown', e=>{ if (e.key==='Shift') shift=true; });
    win.listen(window, 'keyup', e=>{ if (e.key==='Shift') shift=false; });
    if (args && args.image) win.setTitle('Easel — '+(args.name||'image'));
    return ()=>{ stackRO.disconnect(); };
  },
});

/* ---------- 31 · Resonance — generative radio ---------- */
const MusicEngine = (()=>{
  let bus=null, analyser=null, verb=null, delay=null, delayFB=null, delayGain=null;
  let timer=null, nextT=0, step=0, stationId=null, playing=false, startedAt=0, rainSrc=null;
  let trackName='';
  const ADJ=['Glass','Amber','Velvet','Quiet','Neon','Midnight','Paper','Crystal','Slow','Violet','Hollow','Silver'];
  const NOUN=['Meridian','Harbour','Circuit','Tide','Signal','Orbit','Ember','Drift','Lantern','Field','Static','Cartographer'];
  const midi = m => 440*Math.pow(2,(m-69)/12);
  function ensureGraph(){
    const ctx = Sound.ensure();
    if (!ctx) return false;
    if (bus) return true;
    bus = ctx.createGain(); bus.gain.value = .8;
    analyser = ctx.createAnalyser(); analyser.fftSize=512; analyser.smoothingTimeConstant=.82;
    bus.connect(analyser);
    if (Sound.master) bus.connect(Sound.master);
    verb = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate*2.2), ir = ctx.createBuffer(2,len,ctx.sampleRate);
    for (let ch2=0; ch2<2; ch2++){ const d=ir.getChannelData(ch2);
      for (let i2=0;i2<len;i2++) d[i2]=(Math.random()*2-1)*Math.pow(1-i2/len,2.6)*.5; }
    verb.buffer = ir;
    const verbGain = ctx.createGain(); verbGain.gain.value=.5;
    verb.connect(verbGain); verbGain.connect(bus);
    delay = ctx.createDelay(1.4); delay.delayTime.value=.34;
    delayFB = ctx.createGain(); delayFB.gain.value=.38;
    delayGain = ctx.createGain(); delayGain.gain.value=.28;
    delay.connect(delayFB); delayFB.connect(delay); delay.connect(delayGain); delayGain.connect(bus);
    return true;
  }
  function pluck(f, t, dur, g, type, send){
    const ctx=Sound.ctx;
    const o=ctx.createOscillator(); o.type=type||'sine'; o.frequency.value=f;
    const fl=ctx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=2400;
    const gn=ctx.createGain();
    gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(g,t+.012); gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(fl); fl.connect(gn); gn.connect(bus);
    if (send){ const s=ctx.createGain(); s.gain.value=send; gn.connect(s); s.connect(delay); }
    o.start(t); o.stop(t+dur+.15);
  }
  function pad(freqs, t, dur, g){
    const ctx=Sound.ctx;
    freqs.forEach(f=>{
      [[-4,.06],[5,.05]].forEach(([det,gg])=>{
        const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f; o.detune.value=det;
        const fl=ctx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=1000;
        const gn=ctx.createGain();
        gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(gg, t+dur*.35); gn.gain.linearRampToValueAtTime(0, t+dur);
        o.connect(fl); fl.connect(gn); gn.connect(bus);
        const s=ctx.createGain(); s.gain.value=.4; gn.connect(s); s.connect(verb);
        o.start(t); o.stop(t+dur+.2);
      });
    });
  }
  function bass(f, t, dur, g){
    const ctx=Sound.ctx;
    const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
    const fl=ctx.createBiquadFilter(); fl.type='lowpass'; fl.Q.value=5;
    fl.frequency.setValueAtTime(680,t); fl.frequency.exponentialRampToValueAtTime(130, t+dur);
    const gn=ctx.createGain();
    gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(g,t+.008); gn.gain.setValueAtTime(g,t+dur*.55); gn.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(fl); fl.connect(gn); gn.connect(bus);
    o.start(t); o.stop(t+dur+.05);
  }
  function kick(t, g){
    const ctx=Sound.ctx;
    const o=ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+.14);
    const gn=ctx.createGain(); gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.001,t+.24);
    o.connect(gn); gn.connect(bus);
    o.start(t); o.stop(t+.3);
  }
  function hat(t, g){
    const ctx=Sound.ctx;
    const src=ctx.createBufferSource(); src.buffer=Sound.noiseBuf();
    const f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=7500;
    const gn=ctx.createGain(); gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.001,t+.05);
    src.connect(f); f.connect(gn); gn.connect(bus);
    src.start(t); src.stop(t+.08);
  }
  function snare(t, g){
    const ctx=Sound.ctx;
    const src=ctx.createBufferSource(); src.buffer=Sound.noiseBuf();
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1900; f.Q.value=.9;
    const gn=ctx.createGain(); gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.001,t+.16);
    src.connect(f); f.connect(gn); gn.connect(bus);
    const s=ctx.createGain(); s.gain.value=.35; gn.connect(s); s.connect(verb);
    src.start(t); src.stop(t+.2);
  }
  function startRain(){
    const ctx=Sound.ctx; if (!ctx) return;
    stopRain();
    rainSrc = ctx.createBufferSource(); rainSrc.buffer=Sound.noiseBuf(); rainSrc.loop=true;
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=850;
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=300;
    const gn=ctx.createGain(); gn.gain.value=.016;
    rainSrc.connect(hp); hp.connect(f); f.connect(gn); gn.connect(bus);
    rainSrc._gain = gn;
    rainSrc.start();
  }
  function stopRain(){
    if (!rainSrc) return;
    try{ rainSrc.stop(); }catch(e){}
    rainSrc=null;
  }
  const STATIONS = {
    moonwash:{
      name:'Moonwash', desc:'Slow pads in dusk keys, plucked starlight, long echoes.', bpm:56, div:2,
      gen(t, s){
        const chords=[[45,57,60,64,71],[41,53,57,60,64],[36,48,55,59,62],[43,55,59,62,66]];
        const ci = Math.floor(s/8)%4;
        const ch = chords[ci];
        if (s%8===0) pad(ch.map(midi), t, 8*60/56/2*1.05, .05);
        if (s%32===0) pluck(midi(ch[0]), t, 3.2, .04, 'sine', .15);
        if (Math.random()<.36){
          const semi = pick([0,3,5,7,10,12,15,17]);
          pluck(midi(ch[0]+12+semi), t, 1.2, .085, 'sine', .6);
        }
      },
    },
    nightdrive:{
      name:'Nightdrive', desc:'Four chords, a kick that means it, arpeggios in the rain.', bpm:108, div:4,
      gen(t, s){
        const prog=[[45,57,60,64],[41,53,57,60],[48,60,64,67],[43,55,59,62]];
        const st=s%16, bar=Math.floor(s/16)%4;
        const ch=prog[bar];
        if (st%4===0) kick(t, .5);
        if (st%4===2) hat(t, .05);
        if (st===4||st===12) snare(t, .11);
        if (st%2===0) bass(midi(ch[0]+(st%8===6?12:0)), t, .13, .13);
        const arp=[ch[1],ch[2],ch[3],ch[2]+12];
        pluck(midi(arp[st%4]+12+(st>=8?12:0)), t, .16, .045, 'triangle', .3);
        if (st===0) pad(ch.slice(1).map(midi), t, 16*60/108/4*.95, .028);
      },
    },
    rainfall:{
      name:'Rainfall', desc:'Lo-fi keys, vinyl dust, rain on the window glass.', bpm:74, div:2,
      gen(t, s){
        const prog=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
        const st=s%16, bar=Math.floor(s/16)%4;
        const ch=prog[bar];
        if (st===0) kick(t, .3);
        if (st===8) kick(t, .18);
        if (st===4||st===12) snare(t, .06);
        if (Math.random()<.14) hat(t, .012);
        if (st===2||st===6||st===11){
          const swing = st%2 ? .06 : 0;
          ch.forEach(m=> pluck(midi(m), t+swing, 1.3, .042, 'triangle', .28));
        }
        if (Math.random()<.2) pluck(midi(pick(ch)+24), t, .9, .05, 'sine', .5);
      },
    },
  };
  function tickSched(){
    if (!playing) return;
    const ctx = Sound.ctx; if (!ctx) return;
    const station = STATIONS[stationId];
    if (!station){ stop(); return; }
    const stepSec = 60/station.bpm/station.div;
    const horizon = ctx.currentTime + .3;
    let guard = 0;
    while (nextT < horizon && guard++<64){
      try{ station.gen(nextT, step); }catch(e){}
      nextT += stepSec; step++;
    }
  }
  function start(id){
    if (!ensureGraph()) return;
    Sound.unlock();
    if (timer){ clearInterval(timer); timer=null; }
    if (stationId!==id || !rainSrc && id==='rainfall'){
      stationId = id;
      if (id==='rainfall') startRain(); else stopRain();
    }
    const ctx=Sound.ctx;
    step=0; nextT = ctx.currentTime+.08; startedAt=Date.now();
    playing=true;
    bus.gain.cancelScheduledValues(ctx.currentTime);
    bus.gain.setValueAtTime(bus.gain.value, ctx.currentTime);
    timer = setInterval(tickSched, 90);
    trackName = pick(ADJ)+' '+pick(NOUN);
    Bus.emit('music');
  }
  function stop(){
    playing=false;
    if (timer){ clearInterval(timer); timer=null; }
    stopRain();
    Bus.emit('music');
  }
  function toggle(){ playing ? stop() : start(stationId||'moonwash'); }
  function setVol(v){
    if (bus && Sound.ctx) bus.gain.setTargetAtTime(clamp(v,0,1), Sound.ctx.currentTime, .06);
  }
  return { start, stop, toggle, setVol, STATIONS,
    get playing(){ return playing; }, get station(){ return stationId; },
    get track(){ return trackName; }, get startedAt(){ return startedAt; },
    get analyser(){ return analyser; }, get bus(){ return bus; } };
})();

    /* visualizer */
    const freq = new Uint8Array(256);
    let phase=0;
    const unsubTick = Ticker.add((dt, t)=>{

      c.clearRect(0,0,w,hh);

      const n = 42;
      const acc = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#eeb258';
      for (let i=0;i<n;i++){

      }
      c.globalAlpha=1;
      phase += dt*(MusicEngine.playing? .6 : 1.4);
    });
    if (MusicEngine.playing) sync();
    return ()=>{ offMusic(); unsubTick(); clearInterval(tickTimer); };
  },
});

/* ---------- 32 · Comet ---------- */
Apps.register({
  id:'comet', name:'Comet', icon:'comet', tint:'#ff8a70', single:true,
  w:820, h:560, min:[480,360],
  mount(win){
    win.setTitle('Comet');
    const cv = h('canvas');
    const scoreEl = h('span',{class:'tnum', text:'0'});
    const bestEl = h('span',{class:'tnum', text:String(Store.get('comet.best',0))});
    const waveEl = h('span',{class:'tnum', text:'1'});
    const livesEl = h('span',{class:'lives'});
    const hud = h('div',{class:'gm-hud'},
      h('span',{}, 'SCORE ', scoreEl), h('span',{}, 'BEST ', bestEl), h('span',{}, 'WAVE ', waveEl), livesEl);
    const ovTitle = h('h2',{text:'COMET'});
    const ovBody = h('p',{});
    const ovScore = h('div',{class:'gm-score-big'});
    const overlay = h('div',{class:'gm-overlay'}, ovTitle, ovBody, ovScore,
      h('button',{class:'btn primary', text:'Launch'}, ));
    const touch = h('div',{class:'touch-ui'},
      h('div',{class:'tbtn', style:{left:'14px', bottom:'14px'}}, icon('chevL',22)),
      h('div',{class:'tbtn', style:{left:'84px', bottom:'14px'}}, icon('chevR',22)),
      h('div',{class:'tbtn', style:{right:'14px', bottom:'14px'}}, icon('zap',22)));
    win.body.append(h('div',{class:'gm'}, cv, hud, overlay, touch));
    const c2 = cv.getContext('2d');
    const W = { w:0, h:0 };
    let state='ready', score=0, best=Store.get('comet.best',0), lives=3, wave=0;
    const ship={x:0,y:0,vx:0,vy:0,a:-Math.PI/2,inv:0,cd:0,thrusting:false};
    let bullets=[], rocks=[], parts=[], stars=[];
    const keys = new Set();
    const STEP = 1/120;
    let acc=0, shake=0;

    function fit(){
      const f = fitCanvas(cv, 2);
      W.w = f.w; W.h = f.h;
      makeStars();
      ship.x = clamp(ship.x||W.w/2, 0, W.w); ship.y = clamp(ship.y||W.h/2, 0, W.h);
    }
    function makeStars(){
      stars = [];
      for (let i=0;i<70;i++) stars.push({x:rand(W.w), y:rand(W.h), s:rand(.5,1.8), v:rand(2,10)});
    }
    function drawShipIcon(el, size){
      const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
      s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('width',size); s.setAttribute('height',size);
      s.setAttribute('fill','none'); s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width','2');
      s.innerHTML = '<path d="M12 3 19 20 12 16 5 20Z" fill="currentColor" stroke="none"/>';
      el.append(s);
    }
    function paintLives(){
      livesEl.innerHTML='';
      for (let i=0;i<lives;i++){ const sp=h('span',{style:{color:'var(--accent)', display:'inline-flex'}}); drawShipIcon(sp,12); livesEl.append(sp); }
    }
    function reset(startPlaying){
      score=0; lives=3; wave=0; bullets=[]; rocks=[]; parts=[];
      ship.x=W.w/2; ship.y=W.h/2; ship.vx=0; ship.vy=0; ship.a=-Math.PI/2; ship.inv=2;
      scoreEl.textContent='0'; waveEl.textContent='1'; paintLives();
      if (startPlaying){ state='playing'; overlay.classList.add('hidden'); nextWave(); }
    }
    function nextWave(){
      wave++; waveEl.textContent = String(wave);
      const n = 3 + Math.min(wave, 6);
      for (let i=0;i<n;i++){
        let x,y,tries=0;
        do { x=rand(W.w); y=rand(W.h); tries++; } while (Math.hypot(x-ship.x,y-ship.y)<160 && tries<40);
        spawnRock(x,y,58);
      }
    }
    function spawnRock(x,y,r){
      const ang = rand(Math.PI*2);
      const sp = rand(36, 76) + wave*7;
      const verts=[];
      const nv = randi(8,12);
      for (let i=0;i<nv;i++) verts.push(r*(.72+rand(.36)));
      rocks.push({x,y,r, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, rot:rand(6.28), vr:rand(-1.4,1.4), verts});
    }
    function boom(x,y,col,n,spd){
      for (let i=0;i<n;i++){
        const a=rand(Math.PI*2), v=rand(.3,1)*spd;
        parts.push({x,y,vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:rand(.4,.9), max:1, col});
      }
    }
    function fire(){
      if (ship.cd>0) return;
      ship.cd = .21;
      bullets.push({x:ship.x+Math.cos(ship.a)*14, y:ship.y+Math.sin(ship.a)*14, vx:Math.cos(ship.a)*520+ship.vx*.4, vy:Math.sin(ship.a)*520+ship.vy*.4, life:1});
      Sound.play('laser');
    }
    function hitShip(){
      if (ship.inv>0) return;
      lives--; paintLives();
      boom(ship.x, ship.y, '#ff8a70', 26, 220);
      shake = 10;
      Sound.play('boom2');
      if (lives<=0){
        state='over';
        Sound.thrust(false);
        if (score>best){ best=score; Store.set('comet.best', best); bestEl.textContent=String(best); }
        showOverlay('over');
      } else {
        ship.x=W.w/2; ship.y=W.h/2; ship.vx=0; ship.vy=0; ship.inv=2.2;
      }
    }
    function splitRock(r){
      const pts = r.r>46?20 : r.r>24?50 : 100;
      score += pts; scoreEl.textContent = String(score);
      boom(r.x, r.y, '#9aa3c0', Math.round(r.r*.5), r.r*3);
      Sound.play(r.r>30?'boom':'boom2');
      if (r.r>24){ spawnRock(r.x,r.y,r.r*.55); spawnRock(r.x,r.y,r.r*.55); }
    }
    function physics(dt){
      ship.cd -= dt;
      if (ship.inv>0) ship.inv -= dt;
      const TURN = 4.2, THR = 300;
      if (keys.has('left')) ship.a -= TURN*dt;
      if (keys.has('right')) ship.a += TURN*dt;
      const wasThrust = ship.thrusting;
      ship.thrusting = keys.has('up');
      if (ship.thrusting){
        ship.vx += Math.cos(ship.a)*THR*dt;
        ship.vy += Math.sin(ship.a)*THR*dt;
        if (!wasThrust) Sound.thrust(true);
        if (Math.random()<.5) parts.push({x:ship.x-Math.cos(ship.a)*12, y:ship.y-Math.sin(ship.a)*12,
          vx:-Math.cos(ship.a)*rand(60,140)+rand(-30,30), vy:-Math.sin(ship.a)*rand(60,140)+rand(-30,30), life:.3, max:.3, col:'#eeb258'});
      } else if (wasThrust) Sound.thrust(false);
      const damp = Math.pow(.35, dt);
      ship.vx *= damp; ship.vy *= damp;
      const vmax = 420;
      const sp = Math.hypot(ship.vx, ship.vy);
      if (sp>vmax){ ship.vx = ship.vx/sp*vmax; ship.vy = ship.vy/sp*vmax; }
      ship.x += ship.vx*dt; ship.y += ship.vy*dt;
      if (ship.x<-12) ship.x+=W.w+24; if (ship.x>W.w+12) ship.x-=W.w+24;
      if (ship.y<-12) ship.y+=W.h+24; if (ship.y>W.h+12) ship.y-=W.h+24;
      if (keys.has('fire')) fire();
      for (let i=bullets.length-1;i>=0;i--){
        const b=bullets[i];
        b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
        if (b.life<=0 || b.x<-8||b.y<-8||b.x>W.w+8||b.y>W.h+8) bullets.splice(i,1);
      }
      for (const r of rocks){
        r.x+=r.vx*dt; r.y+=r.vy*dt; r.rot+=r.vr*dt;
        if (r.x<-r.r) r.x+=W.w+r.r*2; if (r.x>W.w+r.r) r.x-=W.w+r.r*2;
        if (r.y<-r.r) r.y+=W.h+r.r*2; if (r.y>W.h+r.r) r.y-=W.h+r.r*2;
      }
      for (let i=bullets.length-1;i>=0;i--){
        const b=bullets[i];
        for (let j=rocks.length-1;j>=0;j--){
          const r=rocks[j];
          if (Math.hypot(b.x-r.x, b.y-r.y) < r.r*.85){
            bullets.splice(i,1);
            rocks.splice(j,1);
            splitRock(r);
            break;
          }
        }
      }
      if (ship.inv<=0){
        for (const r of rocks){
          if (Math.hypot(ship.x-r.x, ship.y-r.y) < r.r*.78+10){ hitShip(); break; }
        }
      }
      for (let i=parts.length-1;i>=0;i--){
        const p=parts[i];
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.985; p.vy*=.985; p.life-=dt;
        if (p.life<=0) parts.splice(i,1);
      }
      if (!rocks.length && state==='playing') nextWave();
    }
    function render(t){
      const f = fitCanvas(cv, 2);
      const w=f.w, hh=f.h;
      c2.setTransform(f.ctx.getTransform());
      c2.clearRect(0,0,w,hh);
      c2.save();
      if (shake>0){ c2.translate(rand(-shake,shake), rand(-shake,shake)); shake*=.88; if (shake<.4) shake=0; }
      /* stars */
      c2.fillStyle='rgba(220,228,255,.7)';
      for (const s of stars){
        s.y += s.v*.016*(1+wave*.06);
        if (s.y>hh) { s.y=0; s.x=rand(w); }
        c2.globalAlpha = .25+.5*(s.s/1.8);
        c2.fillRect(s.x, s.y, s.s, s.s);
      }
      c2.globalAlpha=1;
      /* particles */
      for (const p of parts){
        c2.globalAlpha = clamp(p.life/p.max,0,1)*.9;
        c2.fillStyle = p.col;
        c2.fillRect(p.x-1.5, p.y-1.5, 3, 3);
      }
      c2.globalAlpha=1;
      /* bullets */
      c2.fillStyle='#eeb258';
      for (const b of bullets){
        c2.beginPath(); c2.arc(b.x, b.y, 2.6, 0, 7); c2.fill();
        c2.globalAlpha=.3; c2.beginPath(); c2.arc(b.x-b.vx*.008, b.y-b.vy*.008, 2, 0, 7); c2.fill(); c2.globalAlpha=1;
      }
      /* rocks */
      c2.strokeStyle='#9aa3c0'; c2.fillStyle='rgba(60,66,90,.35)'; c2.lineWidth=1.6;
      for (const r of rocks){
        c2.beginPath();
        r.verts.forEach((rv,i)=>{
          const a = r.rot + i/r.verts.length*Math.PI*2;
          const x=r.x+Math.cos(a)*rv, y=r.y+Math.sin(a)*rv;
          i===0?c2.moveTo(x,y):c2.lineTo(x,y);
        });
        c2.closePath(); c2.fill(); c2.stroke();
      }
      /* ship */
      if (state!=='over' && (!ship.inv || Math.floor(performance.now()/120)%2===0 || ship.inv<=0)){
        c2.save();
        c2.translate(ship.x, ship.y); c2.rotate(ship.a+Math.PI/2);
        c2.shadowColor='rgba(255,138,112,.8)'; c2.shadowBlur=10;
        c2.strokeStyle='#ff8a70'; c2.lineWidth=2; c2.lineJoin='round';
        c2.beginPath(); c2.moveTo(0,-13); c2.lineTo(9,11); c2.lineTo(0,6); c2.lineTo(-9,11); c2.closePath();
        c2.fillStyle='rgba(20,12,16,.85)'; c2.fill(); c2.stroke();
        if (ship.thrusting){
          c2.shadowBlur=0; c2.strokeStyle='#eeb258';
          c2.beginPath(); c2.moveTo(-4,10); c2.lineTo(0, 16+rand(6)); c2.lineTo(4,10); c2.stroke();
        }
        c2.restore();
      }
      c2.restore();
    }
    function showOverlay(kind){
      overlay.classList.remove('hidden');
      if (kind==='ready'){
        ovTitle.textContent='COMET';
        ovBody.innerHTML='';
        ovBody.append('The dusk belt is shedding rocks. Steer with the arrow keys or WASD, fire with Space. ');
        ovBody.append(h('span',{class:'muted', text:'P pauses. The comet waits.'}));
        ovScore.textContent = best>0 ? 'best run · '+best : '';
        overlay.querySelector('button').textContent='Launch';
      } else if (kind==='paused'){
        ovTitle.textContent='PAUSED';
        ovBody.innerHTML=''; ovBody.append('The rocks hang in the sky, politely waiting.');
        ovScore.textContent = 'score · '+score;
        overlay.querySelector('button').textContent='Resume';
      } else {
        ovTitle.textContent='FLAMEOUT';
        ovBody.innerHTML=''; ovBody.append('The belt claims another pilot. Wave '+wave+', '+score+' points'+(score>=best&&score>0?' — a new best.':'.'));
        ovScore.textContent = 'best · '+best;
        overlay.querySelector('button').textContent='Fly again';
      }
    }
    function startGame(){ reset(true); Sound.play('launch'); }
    overlay.querySelector('button').addEventListener('click', ()=>{
      if (state==='paused'){ state='playing'; overlay.classList.add('hidden'); }
      else startGame();
    });
    /* input */
    const KEYMAP = {ArrowLeft:'left', a:'left', A:'left', ArrowRight:'right', d:'right', D:'right', ArrowUp:'up', w:'up', W:'up', ' ':'fire'};
    win.listen(document, 'keydown', e=>{
      if (e.target && e.target.closest && e.target.closest('input,textarea,[contenteditable]')) return;
      const k = KEYMAP[e.key];
      if (k){ if (state==='playing'){ e.preventDefault(); keys.add(k); } return; }
      if (e.key==='Enter'){
        if (state==='ready'||state==='over'){ e.preventDefault(); startGame(); }
        else if (state==='paused'){ state='playing'; overlay.classList.add('hidden'); }
      }
      if ((e.key==='p'||e.key==='P') && (state==='playing'||state==='paused')){
        e.preventDefault();
        if (state==='playing'){ state='paused'; Sound.thrust(false); ship.thrusting=false; showOverlay('paused'); }
        else { state='playing'; overlay.classList.add('hidden'); }
      }
    });
    win.listen(document, 'keyup', e=>{ const k=KEYMAP[e.key]; if (k) keys.delete(k); });
    win.listen(document, 'visibilitychange', ()=>{
      if (document.hidden && state==='playing'){ state='paused'; Sound.thrust(false); ship.thrusting=false; showOverlay('paused'); }
    });
    /* touch buttons */
    $$('.tbtn', touch).forEach((b,i)=>{
      const k = ['left','right','fire'][i];
      b.addEventListener('pointerdown', e=>{ e.preventDefault(); keys.add(k); try{ b.setPointerCapture(e.pointerId); }catch(err){} });
      const off = ()=>keys.delete(k);
      b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off);
    });
    if ('ontouchstart' in window) win.body.firstElementChild.classList.add('touch');
    /* loop */
    const unsub = Ticker.add((dt, t)=>{
      if (state==='playing'){
        acc += dt;
        let guard=0;
        while (acc>STEP && guard++<10){ physics(STEP); acc-=STEP; }
      } else acc=0;
      render(t);
    });
    const ro = new ResizeObserver(fit);
    ro.observe(win.body);
    fit();
    paintLives();
    showOverlay('ready');
    return ()=>{ unsub(); ro.disconnect(); Sound.thrust(false); };
  },
});

/* ---------- 33 · Pulse (system monitor) ---------- */
Apps.register({
  id:'monitor', name:'Pulse', icon:'pulse', tint:'#57c7ff', single:true,
  w:740, h:560, min:[520,380],
  mount(win){
    win.setTitle('Pulse — system monitor');
    function spark(){
      const c = h('canvas',{height:'38'});
      const data = [];
      let t = 0;
      return {
        el: c,
        push(v){ data.push(v); if (data.length>90) data.shift(); t++; },
        draw(max, col){
          const f = fitCanvas(c, 2);
          const ctx=f.ctx, w=f.w, hh=f.h;
          ctx.clearRect(0,0,w,hh);
          if (data.length<2) return;
          ctx.beginPath();
          data.forEach((v,i)=>{
            const x = i/(data.length-1)*w;
            const y = hh - clamp(v/max,0,1)*(hh-4)-2;
            i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
          });
          ctx.strokeStyle = col; ctx.lineWidth=1.6; ctx.stroke();
          ctx.lineTo(w, hh); ctx.lineTo(0, hh); ctx.closePath();
          ctx.globalAlpha=.12; ctx.fillStyle=col; ctx.fill(); ctx.globalAlpha=1;
        },
      };
    }
    const fpsC = spark(), cpuC = spark(), memC = spark();
    const fpsV=h('span',{}, '—'), cpuV=h('span',{}, '—'), memV=h('span',{}, '—');
    const grid = h('div',{class:'pm-grid'},
      h('div',{class:'stat'}, h('div',{class:'s-label', text:'framerate'}), h('div',{class:'s-val'}, fpsV, h('small',{text:' fps'})), fpsC.el),
      h('div',{class:'stat'}, h('div',{class:'s-label', text:'cpu · simulated'}), h('div',{class:'s-val'}, cpuV, h('small',{text:' %'})), cpuC.el),
      h('div',{class:'stat'}, h('div',{class:'s-label', text:'memory heap'}), h('div',{class:'s-val'}, memV), memC.el),
      h('div',{class:'stat'}, h('div',{class:'s-label', text:'storage (localStorage)'}),
        h('div',{class:'s-val', id:'pm-store'}, '—'),
        h('div',{class:'s-bar'}, h('i',{id:'pm-storebar'})),
        h('div',{class:'dim', style:{fontSize:'11px', marginTop:'6px'}, text:'the whole OS lives here'}),
      ),
      h('div',{class:'stat'}, h('div',{class:'s-label', text:'uptime'}), h('div',{class:'s-val', id:'pm-up'}, '—')),
      h('div',{class:'stat'}, h('div',{class:'s-label', text:'display'}), h('div',{class:'s-val', id:'pm-disp'}, '—')),
    );
    const procHead = h('div',{class:'proc-row', style:{borderBottom:'1px solid var(--stroke)'}},
      h('span',{class:'micro', text:'process'}), h('span',{class:'micro', text:'pid'}),
      h('span',{class:'micro', text:'cpu'}), h('span',{class:'micro', text:'state'}),
      h('span',{}));
    const procList = h('div',{});
    const procCard = h('div',{class:'card proc-card'}, procHead, procList);
    win.body.append(h('div',{class:'pm'}, grid, procCard));

    const memMax = (performance.memory && performance.memory.jsHeapSizeLimit) ? performance.memory.jsHeapSizeLimit/1048576 : 1024;
    let cpuWander = 30;
    const iv = setInterval(()=>{
      const fps = Ticker.fps;
      fpsV.textContent = fps.toFixed(0);
      fpsC.push(Ticker.frameMs/33.4); fpsC.draw(1.4, '#57c7ff');
      cpuWander = clamp(cpuWander + rand(-6,6), 8, 88);
      const cpu = clamp(6 + (Ticker.frameMs-16.7)*7 + WM.list().length*5 + cpuWander*.25 + rand(0,4), 2, 97);
      cpuV.innerHTML = cpu.toFixed(0);
      cpuC.push(cpu/100); cpuC.draw(1, '#eeb258');
      let memMB;
      if (performance.memory){ memMB = performance.memory.usedJSHeapSize/1048576; }
      else memMB = 140 + WM.list().length*18 + Store.bytes()/1048576;
      memV.innerHTML = memMB.toFixed(0)+'<small> / '+memMax.toFixed(0)+' MB</small>';
      memC.push(memMB/memMax); memC.draw(1, '#9d8cff');
      const used = Store.bytes();
      $('#pm-store', win.body).textContent = fmtBytes(used);
      $('#pm-storebar', win.body).style.width = clamp(used/5242880*100, 2, 100)+'%';
      $('#pm-up', win.body).textContent = fmtUptime(Date.now()-BOOT_T);
      $('#pm-disp', win.body).innerHTML = innerWidth+'×'+innerHeight+'<small> @'+(devicePixelRatio||1).toFixed(1)+'x</small>';
      /* processes */
      procList.innerHTML='';
      const wins = WM.mru();
      for (const w2 of wins){
        const pid = (hashStr(w2.id)%9000+1000);
        const cpuP = (2 + Math.random()*w2.def.id.length + (w2===WM.focused?9:2)).toFixed(1);
        const icoSpan = h('span',{class:'row', style:{gap:'8px', minWidth:'0'}}, icon(w2.def.icon,14), h('span',{style:{overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}, text:w2.def.name}));
        icoSpan.firstChild.style.color = w2.def.tint;
        const kill = h('button',{class:'proc-kill', 'aria-label':'End process', title:'End process'}, icon('x',13));
        kill.addEventListener('click', ()=>WM.close(w2));
        const row = h('div',{class:'proc-row'},
          icoSpan,
          h('span',{class:'pid', text:String(pid)}),
          h('span',{class:'p-cpu', text:cpuP+'%'}),
          h('span',{class:'p-state', text: w2===WM.focused ? 'focused' : w2.minimized ? 'minimized' : 'running'}),
          kill);
        procList.append(row);
      }
      if (!wins.length) procList.append(h('div',{class:'dim', style:{padding:'10px 4px'}, text:'No windows open. Eerily quiet.'}));
    }, 600);
    return ()=>clearInterval(iv);
  },
});

/* ---------- 34 · Settings ---------- */
Apps.register({
  id:'settings', name:'Settings', icon:'settings', tint:'#a9abc4', single:true,
  w:880, h:580, min:[620,420],
  mount(win){
    win.setTitle('Settings');
    const SECTIONS = [
      ['appearance','Appearance','sun'], ['sound','Sound','volume'], ['dock','Dock','grid'],
      ['account','Account','user'], ['system','System','pulse'], ['about','About','info'],
    ];

      navBtns[id]=b; nav.append(b);
    }

    function switchEl(on, fn){

      s.addEventListener('click', ()=>{ const now = !s.classList.contains('on'); s.classList.toggle('on', now); s.setAttribute('aria-checked', String(now)); fn(now); Sound.play('toggle'); });

    }
    function themePreview(kind){
      const palettes = {
        dusk:['#0b0f1e','#161d38','#ecebf4'],
        dawn:['#efe9dc','#fdfbf5','#2b2519'],
        phosphor:['#020604','#05160c','#c8ffd9'],
      }[kind];

/* ---------- 35 · Calculator ---------- */
Apps.register({
  id:'calc', name:'Calculator', icon:'calc', tint:'#eeb258',
  w:320, h:470, min:[280,400],
  mount(win){
    win.setTitle('Calculator');
    const histEl = h('div',{class:'ca-hist'});
    const expEl = h('div',{class:'ca-exp', text:''});
    const resEl = h('div',{class:'ca-res', text:'0'});
    let expr='';
    const hist=[];
    function calcEval(src){
      const s2 = String(src).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'%%');
      const toks = s2.match(/\d+\.?\d*(?:%%)|\d+\.?\d*|[+\-*/]/g);
      if (!toks) return null;
      const prec={'+' :1,'-':1,'*':2,'/':2};
      const out=[], ops=[];
      let prevType=null;
      for (const t of toks){
        if (/[0-9]/.test(t[0])){
          let v = parseFloat(t.replace('%%','%'));
          if (t.endsWith('%%')) v = v/100;
          out.push(v); prevType='n';
        } else {
          if (t==='-' && prevType!=='n'){ out.push(0); }
          while (ops.length && prec[ops[ops.length-1]]>=prec[t]) out.push(ops.pop());
          ops.push(t); prevType='o';
        }
      }
      while (ops.length) out.push(ops.pop());
      const st=[];
      for (const tk of out){
        if (typeof tk==='number'){ st.push(tk); continue; }
        if (st.length<2) return null;
        const b=st.pop(), a=st.pop();
        if (tk==='+') st.push(a+b);
        else if (tk==='-') st.push(a-b);
        else if (tk==='*') st.push(a*b);
        else { if (b===0) return NaN; st.push(a/b); }
      }
      if (st.length!==1) return null;
      return st[0];
    }
    function fmtRes(v){
      if (v==null) return '—';
      if (!isFinite(v)) return 'Undefined';
      const r = Math.round(v*1e10)/1e10;
      let s2 = String(r);
      if (s2.length>13) s2 = r.toPrecision(10).replace(/\.?0+$/,'');
      return s2;
    }
    function paint(){
      expEl.textContent = expr || ' ';
      if (!expr.trim()){ resEl.textContent='0'; return; }
      const v = calcEval(expr);
      resEl.textContent = v==null ? '' : fmtRes(v);
      resEl.style.color = (v!==null && !isFinite(v)) ? 'var(--danger)' : '';
    }
    function press(k){
      Sound.play('click');
      if (k==='C'){ expr=''; paint(); return; }
      if (k==='back'){ expr = expr.slice(0,-1); paint(); return; }
      if (k==='='){
        const v = calcEval(expr);
        if (v!=null && expr.trim()){
          const line = expr+' = '+fmtRes(v);
          hist.unshift(line); if (hist.length>3) hist.pop();
          histEl.innerHTML='';
          hist.forEach((l2,i2)=>{
            const b = h('button',{text:l2, title:'Reuse result'});
            b.addEventListener('click', ()=>{ expr = fmtRes(calcEval(expr)); paint(); });
            histEl.append(b);
          });
          expr = fmtRes(v);
        }
        paint(); return;
      }
      if (k==='±'){
        const m = expr.match(/(\d+\.?\d*)$/);
        if (m){
          const start = expr.length - m[1].length;
          const before = expr.slice(0, start);
          if (before.endsWith('−')) expr = before.slice(0,-1)+m[1];
          else expr = before+'−'+m[1];
        } else if (!expr) expr = '−';
        paint(); return;
      }
      if ('+−×÷'.includes(k)){
        if (!expr) { if (k!=='−') return; }
        if (/[+−×÷]$/.test(expr)) expr = expr.slice(0,-1);
        expr += k; paint(); return;
      }
      if (k==='%'){ if (/\d$/.test(expr)){ expr += '%'; paint(); } return; }
      if (k==='.'){ const seg = expr.split(/[+−×÷]/).pop(); if (!seg.includes('.')) { expr = expr || '0'; expr+='.'; paint(); } return; }
      if (/[0-9]/.test(k)){ expr += k; paint(); return; }
    }
    const layout = [['C','fn'],['±','fn'],['%','fn'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['0','wide'],['.'],['⌫','op'],['=','eq']];
    const grid = h('div',{class:'ca-grid'});
    for (const [k, cls] of layout){
      const b = h('button',{class:'ck'+(cls?' '+cls:''), text:k, dataset:{k}});
      b.addEventListener('click', ()=>press(k));
      grid.append(b);
    }
    win.body.append(h('div',{class:'ca'}, histEl, h('div',{class:'ca-out'}, expEl, resEl), grid));
    paint();
    win.listen(document, 'keydown', e=>{
      if (e.target && e.target.closest && e.target.closest('input,textarea,[contenteditable]')) return;
      const map = {'/':'÷','*':'×','-':'−','+':'+','%':'%','Enter':'=','=':'=','Backspace':'back','Escape':'C','.':'.'};
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (map[e.key]){ e.preventDefault(); press(map[e.key]); }
    });
    return null;
  },
});

Apps.register({
  id:'calendar', name:'Calendar', icon:'calendar', tint:'#ff8a70', single:true,
  w:780, h:520, min:[560,420],
  mount(win){
    win.setTitle('Calendar');
    let events = Store.get('calendar', null);
    if (!events){
      events = {};
      const seedDate = (off, t, title)=>{
        const d = new Date(); d.setDate(d.getDate()+off);
        const key = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
        (events[key]=events[key]||[]).push({t, title});
      };
      seedDate(2, '21:30', 'Stargazing night');
      seedDate(5, '19:00', 'Write the dusk journal');
      Store.set('calendar', events);
    }
    const today = new Date();
    let viewY = today.getFullYear(), viewM = today.getMonth();
    let selKey = null;
    const gridEl = h('div',{class:'kal-grid'});
    const dows = h('div',{class:'kal-dows'});
    for (const d2 of ['Mo','Tu','We','Th','Fr','Sa','Su']) dows.append(h('span',{text:d2}));
    const monthEl = h('h3',{});
    const listEl = h('div',{class:'col', style:{gap:'6px'}});
    const upEl = h('div',{class:'col', style:{gap:'6px'}});
    const timeIn = h('input',{class:'field', type:'time', value:'19:00', style:{width:'110px'}});
    const titleIn = h('input',{class:'field', placeholder:'Event title', style:{flex:'1'}});
    const addBtn = h('button',{class:'btn small primary', text:'Add'});
    const sideTitle = h('h4',{text:'Pick a day'});
    win.body.append(h('div',{class:'kal'},
      h('div',{class:'kal-left'},
        h('div',{class:'kal-head'},
          h('button',{class:'icon-btn','aria-label':'Previous month'}, icon('chevL',16)),
          monthEl,
          h('button',{class:'icon-btn','aria-label':'Next month'}, icon('chevR',16)),
          h('button',{class:'btn small', text:'Today'})),
        dows, gridEl),
      h('div',{class:'kal-side'},
        sideTitle, listEl,
        h('hr',{class:'hr'}),
        h('div',{class:'micro', text:'upcoming'}),
        upEl,
        h('div',{class:'ev-add', style:{marginTop:'auto'}},
          h('div',{class:'micro', text:'new event'}),
          h('div',{class:'row'}, timeIn, titleIn), addBtn))));
    const [prevBtn, nextBtn, todayBtn] = $$('.kal-head button', win.body);
    const keyOf = (y,m,d2)=> y+'-'+pad2(m+1)+'-'+pad2(d2);
    function save(){ Store.set('calendar', events); }
    function render(){
      monthEl.textContent = new Date(viewY, viewM, 1).toLocaleString(undefined, {month:'long', year:'numeric'});
      gridEl.innerHTML='';
      const first = new Date(viewY, viewM, 1);
      let startIdx = (first.getDay()+6)%7;
      const dim = new Date(viewY, viewM+1, 0).getDate();
      const cells=[];
      for (let i2=0;i2<startIdx;i2++) cells.push(new Date(viewY, viewM, -(startIdx-1-i2)));
      for (let d2=1;d2<=dim;d2++) cells.push(new Date(viewY, viewM, d2));
      while (cells.length%7) cells.push(new Date(viewY, viewM+1, cells.length-startIdx-dim+1));
      const tKey = keyOf(today.getFullYear(), today.getMonth(), today.getDate());
      for (const d2 of cells){
        const k = keyOf(d2.getFullYear(), d2.getMonth(), d2.getDate());
        const evs = events[k]||[];
        const cellEl = h('button',{class:'day'+(d2.getMonth()!==viewM?' out':'')+(k===tKey?' today':'')+(k===selKey?' sel':'')},
          h('b',{text:String(d2.getDate())}),
          h('div',{class:'ev-dots'}, evs.slice(0,4).map(()=>h('span',{class:'ev-dot'}))));
        cellEl.addEventListener('click', ()=>{ selKey=k; render(); renderSide(); });
        gridEl.append(cellEl);
      }
      /* upcoming */
      upEl.innerHTML='';
      const future = Object.keys(events).filter(k=>k>=tKey && events[k].length).sort().slice(0,5);
      if (!future.length) upEl.append(h('div',{class:'dim', style:{fontSize:'12px'}, text:'Nothing scheduled ahead.'}));
      for (const k of future){
        const [y,m,d2] = k.split('-').map(Number);
        for (const ev of events[k]){
          upEl.append(h('div',{class:'row', style:{fontSize:'12px'}},
            h('span',{class:'tnum dim', style:{width:'52px'}, text: pad2(d2)+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]}),
            h('span',{style:{overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}, ev.t+' · '+ev.title)));
        }
      }
    }
    function renderSide(){
      listEl.innerHTML='';
      if (!selKey){ sideTitle.textContent='Pick a day'; listEl.append(h('div',{class:'dim', style:{fontSize:'12px'}, text:'Click a date to see or add events.'})); return; }
      const [y,m,d2] = selKey.split('-').map(Number);
      sideTitle.textContent = new Date(y, m-1, d2).toLocaleString(undefined, {weekday:'long', month:'long', day:'numeric'});
      const evs = events[selKey]||[];
      if (!evs.length) listEl.append(h('div',{class:'dim', style:{fontSize:'12px'}, text:'A clear evening.'}));
      for (let i2=0;i2<evs.length;i2++){
        const ev = evs[i2];
        const del = h('button',{class:'ev-del','aria-label':'Delete event'}, icon('x',12));
        del.addEventListener('click', ()=>{ evs.splice(i2,1); if (!evs.length) delete events[selKey]; save(); render(); renderSide(); Sound.play('trash'); });
        listEl.append(h('div',{class:'ev-item'}, h('time',{text:ev.t}), h('span',{style:{overflow:'hidden', textOverflow:'ellipsis'}, text:ev.title}), del));
      }
    }
    function addEvent(){
      if (!selKey){ Notify.push({title:'Pick a day first', body:'Click a date, then add the event.', icon:'calendar'}); return; }
      const title = titleIn.value.trim();
      if (!title){ titleIn.focus(); return; }
      (events[selKey]=events[selKey]||[]).push({t:timeIn.value||'12:00', title});
      events[selKey].sort((a,b)=>a.t<b.t?-1:1);
      titleIn.value='';
      save(); render(); renderSide(); Sound.play('toggle');
    }
    addBtn.addEventListener('click', addEvent);
    titleIn.addEventListener('keydown', e=>{ e.stopPropagation(); if (e.key==='Enter') addEvent(); });
    timeIn.addEventListener('keydown', e=>e.stopPropagation());
    prevBtn.addEventListener('click', ()=>{ viewM--; if (viewM<0){ viewM=11; viewY--; } render(); });
    nextBtn.addEventListener('click', ()=>{ viewM++; if (viewM>11){ viewM=0; viewY++; } render(); });
    todayBtn.addEventListener('click', ()=>{ viewY=today.getFullYear(); viewM=today.getMonth(); render(); });
    render(); renderSide();
    return null;
  },
});

    } else if (args && args.image){ img.src = args.image; win.setTitle('Viewer'); }
    btns[0].addEventListener('click', ()=>{ zoom=Math.max(.1, zoom/1.25); fitMode=false; img.style.maxWidth='none'; img.style.maxHeight='none'; paint(); });
    btns[1].addEventListener('click', ()=>{ zoom=Math.min(8, zoom*1.25); fitMode=false; img.style.maxWidth='none'; img.style.maxHeight='none'; paint(); });
    btns[2].addEventListener('click', ()=>{ zoom=1; rot=0; fitMode=true; img.style.maxWidth='90%'; img.style.maxHeight='90%'; paint(); });
    btns[3].addEventListener('click', ()=>{ zoom=1; fitMode=false; img.style.maxWidth='none'; img.style.maxHeight='none'; paint(); });
    btns[4].addEventListener('click', ()=>{ rot=(rot+90)%360; paint(); });
    btns[5].addEventListener('click', ()=>WM.open('paint', {image:img.src, name:win.title}));
    stage.addEventListener('wheel', e=>{
      if (!e.ctrlKey) return;
      e.preventDefault();
      zoom = clamp(zoom*(e.deltaY<0?1.12:.9), .1, 8);
      fitMode=false; paint();
    }, {passive:false});
    img.addEventListener('dblclick', ()=>{ btns[2].click(); });
    img.style.maxWidth='90%'; img.style.maxHeight='90%';
    paint();
    return null;
  },
});

/* ---------- 38 · Welcome ---------- */

/* ================================================================
   39 · INIT
   ================================================================ */
(function init(){
  let errNotified=false;
  window.addEventListener('error', e=>{
    console.error('Vesper:', e.error||e.message);
    if (!errNotified){ errNotified=true;
      try{ Notify.push({title:'Vesper hit a snag', body:'Something failed quietly — the console has the details. Everything else keeps running.', icon:'info'}); }catch(err){}
      setTimeout(()=>{ errNotified=false; }, 8000);
    }
  });
  window.addEventListener('unhandledrejection', e=>{ console.error('Vesper promise:', e.reason); });
  try{
    Wallpaper.init();
    VFS.load();
    Topbar.init();
    Dock.init();
    DesktopIcons.init();
    applySettings();
    initShortcuts();
    document.addEventListener('visibilitychange', ()=>{ if (document.hidden) Sound.thrust(false); });
    if (!Store.get('settings', null)) saveS();
    Boot.run();
  }catch(e){
    console.error('Vesper boot failed:', e);
    document.body.innerHTML = '<div style="display:grid;place-items:center;height:100vh;color:#ecebf4;background:#05070d;font-family:sans-serif;text-align:center">Vesper failed to boot.<br>Open the console for details.</div>';
  }
})();
</script>
