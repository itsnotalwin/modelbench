    register(def){ map.set(def.id, def); },
    get(id){ return map.get(id); },
    all(){ return Array.from(map.values()).filter(d=>!d.hidden); },
  };
})();

/* ---------- 10 · escape stack ---------- */
const EscStack = (()=>{
  const stack = [];
  document.addEventListener('keydown', e=>{
    if (e.key==='Escape' && stack.length){
      const top = stack[stack.length-1];
      if (top(e) === true) e.preventDefault();
    }
  }, true);
  return {
    push(fn){ stack.push(fn); },
    pop(fn){ const i = stack.lastIndexOf(fn); if (i>=0) stack.splice(i,1); },
    get size(){ return stack.length; },
  };
})();

/* ---------- 11 · context menus ---------- */
const Menus = (()=>{
  let el = null, escFn = null;
  function close(){
    if (!el) return;
    el.remove(); el = null;
    if (escFn){ EscStack.pop(escFn); escFn = null; }
  }
  function open(x, y, items){
    close();
    el = h('div', {class:'menu', role:'menu'});
    for (const it of items){
      if (!it) continue;
      if (it.sep){ el.append(h('div',{class:'menu-sep'})); continue; }
      if (it.head){ el.append(h('div',{class:'menu-head', text:it.head})); continue; }
      const mi = h('button', {class:'mi'+(it.danger?' danger':'')+(it.disabled?' disabled':''), role:'menuitem'},
        it.icon ? icon(it.icon,15) : null,
        h('span',{text:it.label}),
        it.key ? h('span',{class:'mi-key',text:it.key}) : null,
        it.checked ? icon('check',14) : null);
      mi.addEventListener('click', ()=>{ close(); it.fn?.(); });
      el.append(mi);
    }
    document.body.append(el);
    const r = el.getBoundingClientRect();
    el.style.left = clamp(x, 4, innerWidth - r.width - 4) + 'px';
    el.style.top  = clamp(y, 4, innerHeight - r.height - 4) + 'px';
    escFn = ()=>{ close(); return true; };
    EscStack.push(escFn);
    setTimeout(()=>{
      const off = ev=>{ if (el && !el.contains(ev.target)) close(); };
      document.addEventListener('pointerdown', off, {capture:true, once:true});
    },0);
    return el;
  }
  return { open, close, get isOpen(){ return !!el; } };
})();

/* ---------- 12 · popovers ---------- */
const Popovers = (()=>{
  let el=null, anchor=null, escFn=null, offFn=null;
  function close(){
    if (!el) return;
    el.remove(); el=null; anchor=null;
    if (escFn){ EscStack.pop(escFn); escFn=null; }
    if (offFn){ document.removeEventListener('pointerdown', offFn, {capture:true}); offFn=null; }
  }
  function toggle(btn, build){
    if (el && anchor===btn){ close(); return null; }
    close();
    el = h('div', {class:'popover', role:'dialog'});
    const content = build(el);
    if (content) el.append(content);
    document.body.append(el);
    anchor = btn;
    const br = btn.getBoundingClientRect(), pr = el.getBoundingClientRect();
    let left = br.left + br.width/2 - pr.width/2;
    left = clamp(left, 8, innerWidth - pr.width - 8);
    el.style.left = left+'px';
    el.style.top  = (br.bottom + 8) + 'px';
    escFn = ()=>{ close(); return true; };
    EscStack.push(escFn);
    setTimeout(()=>{
      offFn = ev=>{ if (el && !el.contains(ev.target) && ev.target!==btn && !btn.contains(ev.target)) close(); };
      document.addEventListener('pointerdown', offFn, {capture:true});
    },0);
    return el;
  }
  return { toggle, close };
})();

/* ---------- 13 · dialogs ---------- */
const Dialog = (()=>{
  function open(build){
    return new Promise(resolve=>{
      const back = h('div', {class:'modal-back'});
      const card = h('div', {class:'modal', role:'dialog', 'aria-modal':'true'});
      const finish = val=>{
        if (!back.isConnected) return;
        back.remove(); EscStack.pop(onEsc); resolve(val);
      };
      const onEsc = ()=>{ finish(null); return true; };
      build(card, finish);
      back.append(card);
      back.addEventListener('pointerdown', e=>{ if (e.target===back) finish(null); });
      document.body.append(back);
      EscStack.push(onEsc);
      const inp = card.querySelector('input,textarea');
      setTimeout(()=>{ (inp||card.querySelector('button')).focus(); }, 30);
    });
  }
  return {
    alert(opts){ return open((card, finish)=>{
      card.append(h('h3',{text:opts.title||'Notice'}),
        h('p',{text:opts.body||''}),
        h('div',{class:'modal-foot'}, h('button',{class:'btn primary', text:opts.ok||'OK', onclick:()=>finish(true)})));
    }); },
    confirm(opts){ return open((card, finish)=>{
      card.append(h('h3',{text:opts.title||'Are you sure?'}),
        h('p',{text:opts.body||''}),
        h('div',{class:'modal-foot'},
          h('button',{class:'btn', text:'Cancel', onclick:()=>finish(false)}),
          h('button',{class:'btn '+(opts.danger?'danger':'primary'), text:opts.ok||'Confirm', onclick:()=>finish(true)})));
    }); },
    prompt(opts){ return open((card, finish)=>{
      const inp = h('input', {class:'field', type:opts.password?'password':'text', placeholder:opts.placeholder||'', value:opts.value||'', maxlength:opts.maxlength||null});
      inp.style.width='100%'; inp.style.marginTop='12px';
      if (opts.password) inp.setAttribute('inputmode','numeric');
      const go = ()=>{ const v = inp.value; finish(opts.allowEmpty || v.trim() ? v : null); };
      inp.addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); go(); } });
      card.append(h('h3',{text:opts.title||'Input'}),
        opts.body ? h('p',{text:opts.body}) : null,
        opts.label ? h('div',{class:'micro', style:{marginTop:'12px'}, text:opts.label}) : null,
        inp,
        h('div',{class:'modal-foot'},
          h('button',{class:'btn', text:'Cancel', onclick:()=>finish(null)}),
          h('button',{class:'btn primary', text:opts.ok||'OK', onclick:go})));
    }); },
    custom(opts){ return open(opts.build); },
  };
})();

/* ---------- 14 · notifications ---------- */
const Notify = (()=>{
  const history = [];
  let unread = 0;
  function push(o){
    o = o||{};
    const item = { title:o.title||'', body:o.body||'', icon:o.icon||'sparkle', time:Date.now(), actions:o.actions||[] };
    history.unshift(item); if (history.length>30) history.pop();
    unread++;
    Bus.emit('notify');
    if (S.dnd) return;
    const t = h('div', {class:'toast', role:'status'});
    const icoEl = h('div',{class:'n-ico'}, icon(item.icon,16));
    const body = h('div',{class:'grow'}, h('b',{text:item.title}), item.body?h('p',{text:item.body}):null);
    const closeBtn = h('button',{class:'toast-x','aria-label':'Dismiss'}, icon('x',12));
    closeBtn.addEventListener('click', ()=>dismiss());
    t.append(icoEl, body, closeBtn);
    for (const a of item.actions.slice(0,2)){
      const ab = h('button',{class:'btn small', text:a.label, style:{marginTop:'8px'}});
      ab.addEventListener('click', ()=>{ dismiss(); a.fn?.(); });
      body.append(ab);
    }
    const dismiss = ()=>{
      if (!t.isConnected) return;
      t.classList.add('out');
      setTimeout(()=>t.remove(), 240);
    };
    $('#toasts').append(t);
    Sound.play('notify');
    let timer = setTimeout(dismiss, o.timeout||4600);
    t.addEventListener('pointerenter', ()=>clearTimeout(timer));
    t.addEventListener('pointerleave', ()=>{ timer = setTimeout(dismiss, 2200); });
  }
  return { push, history, get unread(){ return unread; }, markRead(){ unread=0; Bus.emit('notify'); } };
})();

/* ---------- 15 · window manager ---------- */
const WM = (()=>{
  const wins = new Set();
  let zTop = 20, focused = null, cascade = 0;
  const layer = ()=>$('#winlayer');
  function WA(){
    const bottom = S.dockAutohide ? 12 : 84;
    return { x:0, y:36, w:innerWidth, h:Math.max(220, innerHeight-36-bottom) };
  }
  const T = w => `translate(${Math.round(w.x)}px, ${Math.round(w.y)}px)`;
  const list = ()=>Array.from(wins);
  const mru = ()=>Array.from(wins).sort((a,b)=>(b.z||0)-(a.z||0));
  function focusTop(){
    const next = mru().find(w=>!w.minimized);
    if (next) focus(next); else { focused=null; Topbar.setApp(null); Bus.emit('wm'); }
  }
  function focus(win){
    if (!win || win._closing) return;
    if (focused && focused!==win) focused.el.classList.remove('active');
    win.el.classList.add('active');
    win.z = ++zTop;
    win.el.style.zIndex = win.z;
    focused = win;
    Topbar.setApp(win.def.name);
    Bus.emit('wm');
  }
  function setRect(win, r, animate){
    win.x = Math.round(r.x); win.y = Math.round(r.y);
    win.w = Math.round(Math.max(win.minW, r.w)); win.h = Math.round(Math.max(win.minH, r.h));
    if (animate && !RM()){
      win.el.animate(
        [{transform:T(win), width:win.w+'px', height:win.h+'px'}],
        {duration:0});
    }
    win.apply();
  }
  function open(appId, args){
    const def = Apps.get(appId);
    if (!def){ Notify.push({title:'Missing app', body:'No app registered as "'+appId+'".'}); return null; }
    if (def.single){
      const ex = mru().find(w=>w.appId===appId);
      if (ex){
        if (ex.minimized) ex.restoreMin(); else focus(ex);
        if (def.onReopen) def.onReopen(ex, args);
        return ex;
      }
    }
    Store.set('recents', [appId, ...Store.get('recents',[]).filter(x=>x!==appId)].slice(0,6));
    const win = createWindow(def, args);
    Sound.play('open');
    Dock.render(); Dock.bounce(appId);
    Bus.emit('wm');
    return win;
  }
  function createWindow(def, args){
    const wa = WA();
    const minW = (def.min?.[0]) || 340, minH = (def.min?.[1]) || 240;
    let w = Math.min(def.w||720, wa.w-24), hgt = Math.min(def.h||480, wa.h-24);
    const off = (cascade++ % 6) * 26;
    let x = clamp(wa.x + (wa.w-w)/2 + off - 50, wa.x+8, wa.x+wa.w-w-8);
    let y = clamp(wa.y + (wa.h-hgt)/2.6 + off - 20, wa.y+8, wa.y+wa.h-hgt-8);
    const ac = new AbortController();
    const el = h('div', {class:'win', role:'dialog', 'aria-label':def.name, dataset:{app:def.id}});
    const ico = h('div',{class:'win-ico'}, icon(def.icon,16));
    const titleEl = h('div',{class:'win-title', text:def.name});
    const btnMin = h('button',{class:'wc-btn', 'aria-label':'Minimize', title:'Minimize'}, icon('min',8));
    const btnMax = h('button',{class:'wc-btn', 'aria-label':'Maximize', title:'Maximize'}, icon('maxi',7));
    const btnClose = h('button',{class:'wc-btn close', 'aria-label':'Close', title:'Close'}, icon('x',8));
    const tb = h('div',{class:'win-tb'}, ico, titleEl, h('div',{class:'win-controls'}, btnMin, btnMax, btnClose));
    const body = h('div',{class:'win-body'});
    el.append(tb, body);
    for (const d of ['n','s','e','w','ne','nw','se','sw']) el.append(h('div',{class:'rs '+d, dataset:{dir:d}}));
    const win = {
      id: uid('win'), appId:def.id, def, el, tb, body,
      x, y, w, h:hgt, minW, minH,
      minimized:false, maximized:false, saved:null, dirty:false, _closing:false, _force:false, z:0,
      ac,
      listen(target, type, fn, opts){ target.addEventListener(type, fn, {...(opts||{}), signal:ac.signal}); },
      setTitle(t){ titleEl.textContent = t; },
      apply(){ el.style.transform = T(win); el.style.width = win.w+'px'; el.style.height = win.h+'px'; },
      close(){ close(win); },
      focus(){ focus(win); },
      minimize(){ minimize(win); },
      restoreMin(){ restoreMin(win); },
      toggleMax(){ toggleMax(win); },
    };
    win.apply();
    layer().append(el);
    wins.add(win);
    focus(win);
    if (!RM()){
      el.animate(
        [{transform:T(win)+' scale(.95)', opacity:0},{transform:T(win)+' scale(1)', opacity:1}],
        {duration:210, easing:'cubic-bezier(.22,1,.36,1)'});
    }
    /* title bar buttons */
    btnMin.addEventListener('click', ()=>{ Sound.play('min'); minimize(win); });
    btnMax.addEventListener('click', ()=>{ Sound.play('max'); toggleMax(win); });
    btnClose.addEventListener('click', ()=>close(win));
    tb.addEventListener('dblclick', e=>{ if (!e.target.closest('.wc-btn')) toggleMax(win); });
    tb.addEventListener('contextmenu', e=>{
      e.preventDefault();
      Menus.open(e.clientX, e.clientY, [
        {label:'Minimize', icon:'min', fn:()=>minimize(win)},
        {label:win.maximized?'Restore':'Maximize', icon:win.maximized?'restore':'maxi', fn:()=>toggleMax(win)},
        {sep:true},
        {label:'Close', icon:'x', key:'Alt+W', danger:true, fn:()=>close(win)},
      ]);
    });
    /* drag + snap */
    tb.addEventListener('pointerdown', e=>{
      if (e.button!==0 || e.target.closest('.wc-btn')) return;
      focus(win);
      let moved=false, px=e.clientX, py=e.clientY, zone=null;
      try{ tb.setPointerCapture(e.pointerId); }catch(err){}
      const ghost = $('#snapghost');
      const zones = ()=>{
        const wa2 = WA(), cw=innerWidth, ch=innerHeight, C=64;
        if (py < 34) return px<C ? 'tl' : px>cw-C ? 'tr' : 'max';
        if (px < 6)  return py>ch-120 ? 'bl' : 'left';
        if (px > cw-6) return py>ch-120 ? 'br' : 'right';
        return null;
      };
      const zoneRect = z=>{
        const wa2 = WA(), hw = Math.round(wa2.w/2), hh = Math.round(wa2.h/2);
        return {
          max:{x:0,y:wa2.y,w:wa2.w,h:wa2.h},
          left:{x:0,y:wa2.y,w:hw,h:wa2.h}, right:{x:hw,y:wa2.y,w:wa2.w-hw,h:wa2.h},
          tl:{x:0,y:wa2.y,w:hw,h:hh}, tr:{x:hw,y:wa2.y,w:wa2.w-hw,h:hh},
          bl:{x:0,y:wa2.y+hh,w:hw,h:wa2.h-hh}, br:{x:hw,y:wa2.y+hh,w:wa2.w-hw,h:wa2.h-hh},
        }[z];
      };
      const mm = ev=>{
        const dx = ev.clientX-px, dy = ev.clientY-py; px=ev.clientX; py=ev.clientY;
        if (!moved && Math.abs(dx)+Math.abs(dy) < 4) return;
        if (!moved){
          moved = true; el.classList.add('dragging');
          if (win.maximized || win.snapped){
            const ratio = (px - win.x)/win.w;
            win.w = (win.saved?.w)||Math.min(win.def.w||720, WA().w-24);
            win.h = (win.saved?.h)||win.minH*1.5;
            win.x = Math.round(px - win.w*ratio);
            win.y = Math.round(py - 16);
            win.maximized=false; win.snapped=null; win.saved=null;
            el.classList.remove('maximized');
            btnMax.innerHTML=''; btnMax.append(icon('maxi',7));
            win.apply();
          }
        }
        win.x = clamp(win.x+dx, -win.w+110, innerWidth-70);
        win.y = clamp(win.y+dy, 0, innerHeight-42);
        win.apply();
        zone = zones();
        if (zone){
          const r = zoneRect(zone);
          ghost.style.left=r.x+'px'; ghost.style.top=r.y+'px';
          ghost.style.width=r.w+'px'; ghost.style.height=r.h+'px';
          ghost.classList.add('show');
        } else ghost.classList.remove('show');
      };
      const up = ev=>{
        tb.removeEventListener('pointermove', mm);
        tb.removeEventListener('pointerup', up);
        tb.removeEventListener('pointercancel', up);
        el.classList.remove('dragging');
        ghost.classList.remove('show');
        if (zone){
          if (!win.maximized && !win.saved) win.saved = {x:win.x, y:win.y, w:win.w, h:win.h};
          setRect(win, zoneRect(zone));
          if (zone==='max'){ win.maximized=true; el.classList.add('maximized'); }
          else win.snapped = zone;
          Sound.play('snap');
        }
        zone = null;
      };
      tb.addEventListener('pointermove', mm);
      tb.addEventListener('pointerup', up);
      tb.addEventListener('pointercancel', up);
    });
    /* resize */
    el.addEventListener('pointerdown', e=>{
      const hd = e.target.closest('.rs');
      if (!hd || e.button!==0) return;
      e.preventDefault(); e.stopPropagation();
      focus(win);
      const dir = hd.dataset.dir;
      const sx=e.clientX, sy=e.clientY, ox=win.x, oy=win.y, ow=win.w, oh=win.h;
      try{ hd.setPointerCapture(e.pointerId); }catch(err){}
      const mm = ev=>{
        const dx=ev.clientX-sx, dy=ev.clientY-sy;
        let nx=ox, ny=oy, nw=ow, nh=oh;
        if (dir.includes('e')) nw = ow+dx;
        if (dir.includes('s')) nh = oh+dy;
        if (dir.includes('w')){ nw = ow-dx; nx = ox+dx; }
        if (dir.includes('n')){ nh = oh-dy; ny = oy+dy; }
        if (nw < win.minW){ if (dir.includes('w')) nx = ox+ow-win.minW; nw = win.minW; }
        if (nh < win.minH){ if (dir.includes('n')) ny = oy+oh-win.minH; nh = win.minH; }
        if (ny < 0){ nh += ny; ny = 0; }
        win.x=Math.round(nx); win.y=Math.round(ny); win.w=Math.round(nw); win.h=Math.round(nh);
        win.maximized=false; win.snapped=null;
        win.apply();
      };
      const up = ()=>{ hd.removeEventListener('pointermove', mm); hd.removeEventListener('pointerup', up); hd.removeEventListener('pointercancel', up); };
      hd.addEventListener('pointermove', mm);
      hd.addEventListener('pointerup', up);
      hd.addEventListener('pointercancel', up);
    });
    el.addEventListener('pointerdown', ()=>focus(win), {capture:true});
    /* mount app */
    try{
      const cleanup = def.mount(win, args);
      if (typeof cleanup === 'function') win.cleanup = cleanup;
    }catch(err){
      console.error('app mount failed:', err);
      body.append(h('div',{class:'empty-state'}, icon('info',30), h('div',{},'This app hit a snag while starting. Check the console for details.')));
    }
    return win;
  }
  function minimize(win){
    if (win.minimized) return;
    const r = Dock.iconRect(win.appId) || {x:innerWidth/2, y:innerHeight-40, width:40, height:40};
    const tx = r.x + r.width/2 - (win.x + win.w/2);
    const ty = r.y + r.height/2 - (win.y + win.h/2);
    const sc = Math.max(.05, r.width/win.w);
    const doMin = ()=>{
      win.minimized = true;
      win.el.style.display = 'none';
      if (focused===win) focusTop();
      Bus.emit('wm');
    };
    if (RM()){ doMin(); return; }
    win.el.animate(
      [{transform:T(win)+' scale(1)', opacity:1},
       {transform:`translate(${win.x+tx}px, ${win.y+ty}px) scale(${sc})`, opacity:.2}],
      {duration:240, easing:'cubic-bezier(.5,0,.9,.4)'}).onfinish = doMin;
  }
  function restoreMin(win){
    if (!win.minimized) return;
    win.minimized = false;
    win.el.style.display = '';
    if (!RM()){
      const r = Dock.iconRect(win.appId) || {x:innerWidth/2, y:innerHeight-40, width:40, height:40};
      const tx = r.x + r.width/2 - (win.x + win.w/2);
      const ty = r.y + r.height/2 - (win.y + win.h/2);
      const sc = Math.max(.05, r.width/win.w);
      win.el.animate(
        [{transform:`translate(${win.x+tx}px, ${win.y+ty}px) scale(${sc})`, opacity:.2},
         {transform:T(win)+' scale(1)', opacity:1}],
        {duration:260, easing:'cubic-bezier(.22,1,.36,1)'});
    }
    focus(win);
    Sound.play('open');
  }
  function toggleMax(win){
    if (win.maximized){
      win.maximized = false;
      win.el.classList.remove('maximized');
      const r = win.saved || {x:WA().x+(WA().w-win.w)/2, y:WA().y+40, w:win.w, h:win.h};
      win.saved = null;
      setRect(win, r);
      const b = win.tb.querySelector('[aria-label="Maximize"]'); if (b){ b.innerHTML=''; b.append(icon('maxi',7)); }
    } else {
      win.saved = {x:win.x, y:win.y, w:win.w, h:win.h};
      win.maximized = true;
      win.el.classList.add('maximized');
      setRect(win, WA());
      const b = win.tb.querySelector('[aria-label="Maximize"]'); if (b){ b.innerHTML=''; b.append(icon('restore',7)); }
    }
  }
  function close(win){
    if (!win || win._closing) return;
    if (win.dirty && !win._force){
      win._closing = true;
      Dialog.confirm({title:'Unsaved changes', body:'This document has unsaved changes. Close it anyway?', ok:'Discard changes', danger:true})
        .then(ok=>{ if (ok){ win._force=true; win._closing=false; close(win); } else win._closing=false; });
      return;
    }
    win._closing = true;
    try{ win.cleanup?.(); }catch(e){ console.error(e); }
    try{ win.ac.abort(); }catch(e){}
    wins.delete(win);
    if (focused===win) focusTop(); else { Bus.emit('wm'); }
    const el = win.el;
    if (RM()) el.remove();
    else el.animate(
      [{transform:T(win)+' scale(1)', opacity:1},{transform:T(win)+' scale(.94)', opacity:0}],
      {duration:170, easing:'cubic-bezier(.4,0,1,1)'}).onfinish = ()=>el.remove();
    Sound.play('close');
    Dock.render();
    Bus.emit('wm');
  }
  function clampAll(){
    const wa = WA();
    for (const win of wins){
      if (win.maximized){ setRect(win, wa); continue; }
      win.x = clamp(win.x, -win.w+110, wa.w-70);
      win.y = clamp(win.y, 0, innerHeight-42);
      win.w = Math.min(win.w, wa.w+80); win.h = Math.min(win.h, innerHeight+40);
      win.apply();
    }
  }
  window.addEventListener('resize', clampAll);
  return { open, close, focus, minimize, WA, list, mru, clampAll,
    get focused(){ return focused; } };
})();

/* ---------- 16 · open a VFS path with the right app ---------- */
function openPath(path){
  const n = VFS.node(path);
  if (!n){ Notify.push({title:'Not found', body:'Nothing lives at '+path+' anymore.'}); return; }
  if (n.type==='dir'){ WM.open('files', {path}); return; }
  const e = VFS.ext(n.name);
  if (e==='app'){
    try{ const data = JSON.parse(n.content||'{}');
      if (data.app && Apps.get(data.app)) WM.open(data.app, data.args); else Notify.push({title:'Broken shortcut', body:n.name+' does not point anywhere.'});
    }catch(err){ Notify.push({title:'Broken shortcut', body:n.name+' is not a valid launcher file.'}); }
    return;
  }
  if ((n.mime&&n.mime.startsWith('image/')) || ['png','jpg','jpeg','gif','webp'].includes(e)){ WM.open('viewer', {path}); return; }
  WM.open('editor', {path});
}

/* ---------- 17 · import real files from outside ---------- */
function importFiles(fileList, dest){
  const dir = VFS.node(dest);
  if (!dir || dir.type!=='dir') return;
  const files = Array.from(fileList||[]).slice(0,8);
  if (!files.length) return;
  const jobs = files.map(f => new Promise(res=>{
    if (f.size > 4*1024*1024) return res(null);
    const e = VFS.ext(f.name);
    const isImg = /^image\//.test(f.type) || ['png','jpg','jpeg','gif','webp'].includes(e);
    const isTxt = !isImg && (f.size < 800*1024) && (/^text\//.test(f.type) || !f.type || ['md','txt','json','log','csv'].includes(e));
    const rd = new FileReader();
    rd.onerror = ()=>res(null);
    rd.onload = ()=>{
      if (isImg && /^data:image\//.test(rd.result)){
        const n = VFS.node(VFS.join(dest,f.name));
        if (n){ res(null); return; }
        const node2 = { id:uid('n'), name:VFS.uniqueName(dir,f.name), type:'file', content:rd.result, mime:f.type||VFS.mimeOf(f.name), mtime:Date.now() };
        res(node2);
      } else if (isTxt && typeof rd.result === 'string'){
        const node2 = { id:uid('n'), name:VFS.uniqueName(dir,f.name), type:'file', content:rd.result, mime:VFS.mimeOf(f.name), mtime:Date.now() };
        res(node2);
      } else res(null);
    };
    if (isImg) rd.readAsDataURL(f); else if (isTxt) rd.readAsText(f); else res(null);
  }));
  Promise.all(jobs).then(nodes=>{
    const made = nodes.filter(Boolean);
    for (const n of made) dir.children.push(n);
    if (made.length) VFS.changed('import');
    Notify.push({title: made.length ? 'Imported '+made.length+' file'+(made.length>1?'s':'') : 'Nothing imported',
      body: made.length ? 'Placed into '+dest+'.' : 'Files were too large or of an unsupported type.',
      icon:'files'});
  });
}

/* ---------- 19 · dock ---------- */
const Dock = (()=>{
  let wrap, dockEl, hideTimer=null;
  function init(){
    wrap = $('#dockwrap'); dockEl = $('#dock');
    wrap.addEventListener('pointerenter', ()=>reveal(true));
    wrap.addEventListener('pointerleave', ()=>reveal(false));
    document.addEventListener('pointermove', e=>{
      if (!S.dockAutohide) return;
      if (e.clientY > innerHeight-10) reveal(true);
      else reveal(false);
    }, {passive:true});
    render(); apply();
  }
  function reveal(on){
    if (!S.dockAutohide) return;
    clearTimeout(hideTimer);
    if (on) wrap.classList.add('reveal');
    else hideTimer = setTimeout(()=>wrap.classList.remove('reveal'), 500);
  }
  function apply(){
    dockEl.style.setProperty('--dock-ic', S.dockSize+'px');
    wrap.classList.toggle('autohide', S.dockAutohide);
  }
  function render(){
    dockEl.innerHTML='';
    for (const def of Apps.all()){
      const insts = WM.list().filter(w=>w.appId===def.id);
      const b = h('button',{class:'dock-item'+(insts.length?' running':''), 'data-tip':def.name, 'aria-label':def.name, dataset:{app:def.id}},
        h('span',{class:'d-ico', style:{color:def.tint}}, icon(def.icon, 22)),
        h('span',{class:'dock-dot'}));
      b.addEventListener('click', ()=>{
        const insts2 = WM.list().filter(w=>w.appId===def.id);
        if (insts2.length){ const top = insts2.sort((a,b2)=>b2.z-a.z)[0];
          if (top.minimized) top.restoreMin(); else WM.focus(top); Sound.play('switch'); }
        else WM.open(def.id);
      });
      b.addEventListener('contextmenu', e=>{
        e.preventDefault();
        Menus.open(e.clientX, e.clientY, [
          {head:def.name},
          {label:'New window', icon:'plus', fn:()=>WM.open(def.id)},
          {label: insts.length?'Close all '+def.name:'Quit', icon:'x', danger:true, disabled:!insts.length,
            fn:()=>{ WM.list().filter(w=>w.appId===def.id).forEach(w=>WM.close(w)); }},
        ]);
      });
      dockEl.append(b);
    }
    dockEl.append(h('div',{class:'dock-sep'}));
    const trash = h('button',{class:'dock-item','data-tip':'Trash', 'aria-label':'Trash', dataset:{app:'trash'}},
      h('span',{class:'d-ico', style:{color:'var(--text-3)'}}, icon('trash',22)),
      h('span',{class:'dock-dot'}));
    trash.addEventListener('click', ()=>WM.open('files', {path:'/Trash'}));
    trash.addEventListener('contextmenu', e=>{
      e.preventDefault();
      Menus.open(e.clientX, e.clientY, [
        {head:'Trash'},
        {label:'Open Trash', icon:'trash', fn:()=>WM.open('files',{path:'/Trash'})},
        {label:'Empty Trash', icon:'x', danger:true, fn:()=>{
          Dialog.confirm({title:'Empty Trash', body:'Permanently delete everything in /Trash?', ok:'Empty', danger:true})
            .then(ok=>{ if(ok){ VFS.emptyTrash(); Sound.play('trash'); Notify.push({title:'Trash emptied', icon:'trash'}); } });
        }},
      ]);
    });
    dockEl.append(trash);
  }
  function iconRect(appId){
    const b = dockEl.querySelector('[data-app="'+appId+'"]');
    if (!b) return null;
    const r = b.getBoundingClientRect();
    return {x:r.left, y:r.top, width:r.width, height:r.height};
  }
  function bounce(appId){
    const b = dockEl.querySelector('[data-app="'+appId+'"]');
    if (!b || RM()) return;
    b.animate([{transform:'translateY(0)'},{transform:'translateY(-13px)'},{transform:'translateY(-3px)'},{transform:'translateY(0)'}],
      {duration:480, easing:'cubic-bezier(.3,.7,.4,1.2)'});
  }
  return { init, render, apply, iconRect, bounce };
})();

/* ---------- 20 · desktop icons ---------- */
const DesktopIcons = (()=>{
  let desk, posCache = null, selected = new Set();
  const GW = 96, GH = 102;
  function init(){
    desk = $('#desktop');
    desk.addEventListener('contextmenu', e=>{
      if (e.target.closest('.dt-icon')) return;
      e.preventDefault();
      Menus.open(e.clientX, e.clientY, [
        {head:'Desktop'},
        {label:'New folder', icon:'folderPlus', fn:()=>newItem(true)},
        {label:'New file', icon:'filePlus', fn:()=>newItem(false)},
        {sep:true},
        {label:'Tidy icons', icon:'grid', fn:tidy},
        {label:'Change wallpaper…', icon:'sun', fn:()=>WM.open('settings')},
        {label:'Open Terminal here', icon:'terminal', fn:()=>WM.open('terminal', {cwd:'/Desktop'})},
      ]);
    });
    desk.addEventListener('pointerdown', e=>{
      if (!e.target.closest('.dt-icon')){
        for (const s of selected) s.classList.remove('sel');
        selected.clear();
      }
    });
    const drop = e=>{
      e.preventDefault();
      desk.classList.remove('extdrop');
      if (e.dataTransfer?.files?.length) importFiles(e.dataTransfer.files, '/Desktop');
    };
    desk.addEventListener('dragover', e=>{ e.preventDefault(); desk.classList.add('extdrop'); });
    desk.addEventListener('dragleave', e=>{ if (e.target===desk) desk.classList.remove('extdrop'); });
    desk.addEventListener('drop', drop);
    const rerender = debounce(()=>render(), 80);
    Bus.on('vfs', rerender);
    render();
  }
  function posMap(){ posCache = Store.get('desktop-pos', {}); return posCache; }
  function savePos(){ Store.set('desktop-pos', posCache||{}); }
  function newItem(dir){
    Dialog.prompt({title: dir?'New folder':'New file', label:'Name', value: dir?'New folder':'untitled.txt', ok:'Create'})
      .then(name=>{
        if (!name) return;
        const d = VFS.node('/Desktop');
        name = VFS.uniqueName(d, name.trim());
        if (dir) d.children.push({id:uid('n'), name, type:'dir', children:[], mtime:Date.now()});
        else d.children.push({id:uid('n'), name, type:'file', content:'', mime:VFS.mimeOf(name), mtime:Date.now()});
        VFS.changed('create');
        Sound.play('toggle');
      });
  }
  function tidy(){
    const d = VFS.node('/Desktop'); if (!d) return;
    const rows = Math.max(3, Math.floor((innerHeight-140)/GH));
    const items = [...d.children].sort((a,b)=> (a.type===b.type ? a.name.localeCompare(b.name) : a.type==='dir'?-1:1));
    posCache = posMap();
    items.forEach((n,i)=>{
      posCache[n.id] = { x: 14 + Math.floor(i/rows)*GW, y: 8 + (i%rows)*GH };
    });
    savePos(); render();
  }
  function render(){
    if (!desk) return;
    desk.innerHTML='';
    const d = VFS.node('/Desktop'); if (!d) return;
    posMap();
    const rows = Math.max(3, Math.floor((innerHeight-140)/GH));
    let autoIdx = 0;
    const items = [...d.children].sort((a,b)=> (a.type===b.type ? a.name.localeCompare(b.name) : a.type==='dir'?-1:1));
    for (const n of items){
      let p = posCache[n.id];
      if (!p || p.x==null){ p = { x:14 + Math.floor(autoIdx/rows)*GW, y:8 + (autoIdx%rows)*GH }; posCache[n.id]=p; autoIdx++; }
      const art = h('div',{class:'dt-art'}, icon(fileIcon(n), 26));
      const ic = h('div',{class:'dt-icon', style:{left:p.x+'px', top:p.y+'px'}, dataset:{id:n.id}, tabindex:'0', role:'button', 'aria-label':n.name},
        art, h('div',{class:'dt-label', text:n.name}));
      if (selected.has(n.id)) ic.classList.add('sel');
      ic.addEventListener('pointerdown', e=>{
        if (e.button!==0) return;
        if (!e.ctrlKey && !ic.classList.contains('sel')){
          for (const s of selected) s.classList.remove('sel');
          selected.clear();
        }
        ic.classList.add('sel'); selected.add(n.id);
        /* drag */
        let moved=false, px=e.clientX, py=e.clientY, ox=p.x, oy=p.y;
        try{ ic.setPointerCapture(e.pointerId); }catch(err){}
        const mm = ev=>{
          const dx=ev.clientX-px, dy=ev.clientY-py;
          if (!moved && Math.abs(dx)+Math.abs(dy)<5) return;
          if (!moved){ moved=true; ic.classList.add('dragging'); }
          ic.style.left = clamp(ox+dx, 0, innerWidth-90)+'px';
          ic.style.top  = clamp(oy+dy, 0, innerHeight-120)+'px';
        };
        const up = ()=>{
          ic.removeEventListener('pointermove', mm);
          ic.removeEventListener('pointerup', up);
          ic.removeEventListener('pointercancel', up);
          if (moved){
            ic.classList.remove('dragging');
            const x = Math.round((parseFloat(ic.style.left))/GW)*GW + 14;
            const y = Math.round((parseFloat(ic.style.top))/GH)*GH + 8;
            ic.style.left = clamp(x,4,innerWidth-100)+'px';
            ic.style.top  = clamp(y,4,innerHeight-130)+'px';
            posCache[n.id] = {x:parseFloat(ic.style.left), y:parseFloat(ic.style.top)};
            savePos();
          }
        };
        ic.addEventListener('pointermove', mm);
        ic.addEventListener('pointerup', up);
        ic.addEventListener('pointercancel', up);
      });
      ic.addEventListener('dblclick', ()=>openPath('/Desktop/'+n.name));
      ic.addEventListener('keydown', e=>{ if (e.key==='Enter') openPath('/Desktop/'+n.name); });
      ic.addEventListener('contextmenu', e=>{
        e.preventDefault(); e.stopPropagation();
        Menus.open(e.clientX, e.clientY, [
          {label:'Open', icon:fileIcon(n), fn:()=>openPath('/Desktop/'+n.name)},
          {label:'Rename…', icon:'quill', fn:()=>Dialog.prompt({title:'Rename', label:'Name', value:n.name, ok:'Rename'}).then(v=>{
            if (v && v!==n.name){ VFS.rename('/Desktop/'+n.name, v); VFS.changed('rename'); }})},
          {sep:true},
          {label:'Move to Trash', icon:'trash', danger:true, fn:()=>{ VFS.trash('/Desktop/'+n.name); Sound.play('trash'); }},
        ]);
      });
      desk.append(ic);
    }
  }
  return { init, render, tidy };
})();

/* ---------- 21 · launcher ---------- */
const Launcher = (()=>{
  let el=null, input=null, listEl=null, results=[], sel=0, escFn=null;
  function close(){
    if (!el) return;
    el.classList.remove('open');
    if (escFn){ EscStack.pop(escFn); escFn=null; }
    setTimeout(()=>{ if (el && !el.classList.contains('open')) el.remove(); el=null; }, 200);
  }
  function open(){
    close();
    el = h('div',{id:'launcher', class:'open'});
    const panel = h('div',{class:'l-panel'});
    const searchRow = h('div',{class:'l-search-row'}, icon('search',18), input = h('input',{class:'l-input', placeholder:'Search apps and files…', 'aria-label':'Search'}), h('span',{class:'l-esc', text:'esc'}));
    panel.append(searchRow);
    listEl = h('div',{class:'l-body'}, h('div',{class:'l-scroll'}));
    panel.append(listEl);
    el.append(panel);
    el.addEventListener('pointerdown', e=>{ if (e.target===el) close(); });
    document.body.append(el);
    escFn = ()=>{ close(); return true; };
    EscStack.push(escFn);
    input.addEventListener('input', ()=>render(input.value));
    input.addEventListener('keydown', e=>{
      if (e.key==='ArrowDown'){ e.preventDefault(); move(1); }
      else if (e.key==='ArrowUp'){ e.preventDefault(); move(-1); }
      else if (e.key==='Enter'){ e.preventDefault(); activate(); }
    });
    render('');
    setTimeout(()=>input.focus(), 40);
    Sound.play('launch');
  }
  function toggle(){ el ? close() : open(); }
  function move(d){
    if (!results.length) return;
    sel = (sel+d+results.length)%results.length;
    paintSel();
  }
  function paintSel(){
    $$('.l-tile,.l-res', listEl).forEach((n,i)=>n.classList.toggle('sel', i===sel));
    const s = $$('.l-tile,.l-res', listEl)[sel];
    s?.scrollIntoView?.({block:'nearest'});
  }
  function activate(){
    const r = results[sel] || results[0];
    if (!r) return;
    close();
    if (r.kind==='app') WM.open(r.id, r.args);
    else openPath(r.path);
  }
  function render(q){
    q = (q||'').trim().toLowerCase();
    sel = 0; results = [];
    const scroll = listEl.firstChild; scroll.innerHTML='';
    if (!q){
      const recents = Store.get('recents',[]).map(id=>Apps.get(id)).filter(Boolean).slice(0,6);
      if (recents.length){
        scroll.append(h('div',{class:'l-cap', text:'Recent'}));
        const g = h('div',{class:'l-grid'});
        for (const d of recents){
          results.push({kind:'app', id:d.id, name:d.name});
          const t = h('button',{class:'l-tile'}, h('span',{class:'l-art', style:{color:d.tint}}, icon(d.icon,22)), h('span',{text:d.name}));
          t.addEventListener('click', ()=>{ close(); WM.open(d.id); });
          g.append(t);
        }
        scroll.append(g);
      }
      scroll.append(h('div',{class:'l-cap', text:'Applications'}));
      const g2 = h('div',{class:'l-grid'});
      for (const d of Apps.all()){
        results.push({kind:'app', id:d.id, name:d.name});
        const t = h('button',{class:'l-tile'}, h('span',{class:'l-art', style:{color:d.tint}}, icon(d.icon,22)), h('span',{text:d.name}));
        t.addEventListener('click', ()=>{ close(); WM.open(d.id); });
        g2.append(t);
      }
      scroll.append(g2);
    } else {
      for (const d of Apps.all()){
        if (d.name.toLowerCase().includes(q)) results.push({kind:'app', id:d.id, name:d.name, sub:'Application'});
      }
      let fc = 0;
      VFS.walk((n, p)=>{
        if (fc>=7 || n.type!=='file') return;
        const nl = n.name.toLowerCase();
        let hit = nl.includes(q) ? 1 : 0;
        if (!hit && (n.content||'').length < 200000 && (n.content||'').toLowerCase().includes(q)) hit = 2;
        if (hit) { fc++; results.push({kind:'file', path:p, name:n.name, sub:p, rank:hit}); }
      });
      results.sort((a,b)=> (a.rank||0)-(b.rank||0) || a.name.length-b.name.length);
      if (!results.length){ scroll.append(h('div',{class:'l-empty', text:'Nothing matches “'+q+'”.'})); return; }
      scroll.append(h('div',{class:'l-cap', text:q.length+' result'+(q.length>1?'s':'')}));
      const lst = h('div',{});
      for (const r of results){
        const isApp = r.kind==='app';
        const d = isApp ? Apps.get(r.id) : null;
        const row = h('button',{class:'l-res'},
          h('span',{class:'l-art', style:{color: isApp? d.tint : 'var(--text-2)'}}, icon(isApp? d.icon : 'file',17)),
          h('div',{class:'grow'}, h('b',{text:r.name}), h('span',{text: isApp?'Application':r.sub})));
        row.addEventListener('click', ()=>{ close(); if (isApp) WM.open(r.id); else openPath(r.path); });
        lst.append(row);
      }
      scroll.append(lst);
    }
    paintSel();
  }
  return { toggle, close, get isOpen(){ return !!el && el.classList.contains('open'); } };
})();

const Switcher = (()=>{
  let el=null, cards=null, order=[], sel=0, escFn=null, quickTimer=null;
  function build(){
    order = WM.mru();
    el = h('div',{id:'switcher', class:'open'});
    cards = h('div',{class:'sw-cards'});
    order.forEach((w,i)=>{
      const c = h('div',{class:'sw-card'+(i===sel?' sel':''), role:'button', tabindex:'-1'},
        h('div',{class:'sw-art', style:{color:w.def.tint}}, icon(w.def.icon,24)),
        h('b',{text:w.title||w.def.name}), h('span',{text:w.def.name}));
      c.addEventListener('pointerdown', e=>{ e.stopPropagation(); commit(i); });
      cards.append(c);
    });
    if (!order.length) cards.append(h('div',{class:'l-empty', text:'No open windows'}));
    el.append(cards);
    el.addEventListener('pointerdown', e=>{ commit(order.findIndex(w=>!w.minimized)); });
    document.body.append(el);
  }
  function open(startSel){
    destroy();
    sel = order.length ? Math.min(startSel??1, order.length-1) : 0;
    build();
    escFn = ()=>{ destroy(); return true; };
    EscStack.push(escFn);
  }
  function cycle(dir){
    if (!el){ open(1); return; }
    if (!order.length) return;
    sel = (sel+dir+order.length)%order.length;
    $$('.sw-card', cards).forEach((c,i)=>c.classList.toggle('sel', i===sel));
  }
  function commit(idx){
    const w = order[idx!=null?idx:sel];
    destroy();
    if (w){ if (w.minimized) w.restoreMin(); else WM.focus(w); Sound.play('switch'); }
  }
  function destroy(){
    if (!el) return;
    el.remove(); el=null; cards=null; order=[]; 
    if (escFn){ EscStack.pop(escFn); escFn=null; }
  }
  function cycleQuick(dir){
    if (el){ cycle(dir); commit(); return; }
    open(1);
    clearTimeout(quickTimer);
    quickTimer = setTimeout(()=>{ if (el) commit(); }, 700);
  }
  function handleKey(e){
    if (!el) return false;
    if (e.key==='Tab'){ e.preventDefault(); cycle(e.shiftKey?-1:1); return true; }
    if (e.key==='Enter'){ e.preventDefault(); commit(); return true; }
    return false;
  }
  return { cycle, cycleQuick, commit, handleKey,
    get isOpen(){ return !!el; },
    get active(){ return !!el; } };
})();

/* ---------- 23 · global shortcuts ---------- */
function initShortcuts(){
  document.addEventListener('keydown', e=>{
    if (Switcher.handleKey(e)) return;
    if (e.altKey && e.key==='Tab'){ e.preventDefault(); Switcher.cycle(e.shiftKey?-1:1); return; }
    if (e.ctrlKey && e.key==='`'){ e.preventDefault(); Switcher.cycleQuick(1); return; }
    if (e.ctrlKey && e.code==='Space'){ e.preventDefault(); Launcher.toggle(); return; }
    if (e.ctrlKey && e.altKey && (e.key==='t'||e.key==='T')){ e.preventDefault(); WM.open('terminal'); return; }
    if (e.ctrlKey && e.altKey && (e.key==='l'||e.key==='L')){ e.preventDefault(); Power.lock(); return; }
    if (e.altKey && (e.key==='w'||e.key==='W')){ if (WM.focused){ e.preventDefault(); WM.close(WM.focused); } return; }
  });
  document.addEventListener('keyup', e=>{
    if (e.key==='Alt' && Switcher.isOpen) Switcher.commit();
  });
}

/* ---------- 24 · lock screen ---------- */
const Lock = (()=>{
  let el=null, timer=null, pinBuf='';
  let active = false;
  function show(){
    if (active) return;
    active = true;
    pinBuf = '';
    el = $('#lock');
    el.innerHTML='';
    const inner = h('div',{class:'lock-inner'});
    const timeEl = h('div',{class:'lock-time'});
    const dateEl = h('div',{class:'lock-date'});
    const upd = ()=>{
      const d = new Date();
      timeEl.textContent = fmtClock(d)+':'+pad2(d.getSeconds());
      const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
      dateEl.textContent = days[d.getDay()]+', '+months[d.getMonth()]+' '+d.getDate();
    };
    upd(); timer = setInterval(upd, 1000);
    inner.append(timeEl, dateEl);
    const userRow = h('div',{class:'lock-user'});
    userRow.append(h('div',{class:'lock-avatar', text:(S.userName||'V').trim().charAt(0).toUpperCase()||'V'}));
    userRow.append(h('div',{class:'lock-name', text:S.userName||'Explorer'}));
    inner.append(userRow);
    if (S.pin){
      const dots = h('div',{class:'pin-dots'});
      const dotEls = [];
      for (let i=0;i<4;i++){ const d=h('span',{class:'pin-dot'}); dots.append(d); dotEls.push(d); }
      const pad = h('div',{class:'pin-pad'});
      const paintDots = ()=>dotEls.forEach((d,i)=>d.classList.toggle('fill', i<pinBuf.length));
      const submit = ()=>{
        if (hashStr(pinBuf+'|vesper')===S.pin) unlock();
        else {
          Sound.play('error');
          inner.classList.remove('shake'); void inner.offsetWidth; inner.classList.add('shake');
          pinBuf=''; paintDots();
        }
      };
      const press = k=>{ Sound.play('click');
        if (k==='back'){ pinBuf = pinBuf.slice(0,-1); paintDots(); return; }
        if (pinBuf.length>=4) return;
        pinBuf += k; paintDots();
        if (pinBuf.length===4) setTimeout(submit, 140);
      };
      for (let i=1;i<=9;i++) pad.append(h('button',{class:'pin-key', text:String(i), onclick:()=>press(String(i))}));
      pad.append(h('button',{class:'pin-key', style:{visibility:'hidden'}, tabindex:'-1'}, ''));
      pad.append(h('button',{class:'pin-key', text:'0', onclick:()=>press('0')}));
      pad.append(h('button',{class:'pin-key', 'aria-label':'Delete', onclick:()=>press('back')}, icon('chevL',16)));
      inner.append(h('div',{class:'lock-hint', text:'Enter your PIN'}), dots, pad);
    } else {
      inner.append(h('div',{class:'lock-hint', text:'Press Enter or click anywhere to begin'}));
    }
    el.append(inner);
    el.classList.add('open');
    const onKey = e=>{
      if (!active) return;
      if (S.pin){
        if (/^[0-9]$/.test(e.key)) press(e.key);
        else if (e.key==='Backspace') press('back');
        else if (e.key==='Enter' && pinBuf.length===4) submit();
      } else if (e.key==='Enter' || e.key===' '){ e.preventDefault(); unlock(); }
    };
    const onClick = e=>{ if (!S.pin && active) unlock(); };
    document.addEventListener('keydown', onKey, true);
    el.addEventListener('pointerdown', onClick);
    el._cleanup = ()=>{ document.removeEventListener('keydown', onKey, true); el.removeEventListener('pointerdown', onClick); };
  }
  function unlock(){
    if (!active) return;
    active = false;
    clearInterval(timer); timer=null;
    const elx = $('#lock');
    elx._cleanup?.();
    elx.classList.remove('open');
    setTimeout(()=>{ if (!elx.classList.contains('open')) elx.innerHTML=''; }, 600);
    Sound.play('unlock');
    const h2 = new Date().getHours();
    const greet = h2<5 ? 'Good night' : h2<12 ? 'Good morning' : h2<18 ? 'Good afternoon' : 'Good evening';
    setTimeout(()=>Notify.push({title: greet+', '+(S.userName||'Explorer')+'.', body: S.firstRun ? 'Welcome to Vesper — your introduction is opening.' : 'Everything is where you left it.', icon:'sparkle'}), 500);
    if (S.firstRun){
      S.firstRun = false; saveS();
      setTimeout(()=>WM.open('welcome'), 900);
    }
  }
  return { show, get isLocked(){ return active; } };
})();

/* ---------- 26 · boot sequence ---------- */
const Boot = (()=>{
  function run(){
    const boot = $('#boot');
    const mark = $('#boot-mark');
    mark.innerHTML='';
    for (const ch of 'VESPER') mark.append(h('span',{class:'boot-letter', text:ch}));
    const letters = $$('.boot-letter', mark);
    const cvs = $('#boot-canvas');
    const reduced = RM();
    const t0 = performance.now();
    const DUR = reduced ? 500 : 2600;
    let done = false, raf = 0;
    /* star ignition animation on canvas */
    const sparks = [];
    function finish(){
      if (done) return;
      done = true;
      cancelAnimationFrame(raf);
      letters.forEach((l,i)=>setTimeout(()=>l.classList.add('on'), i*70));
      setTimeout(()=>{
        boot.classList.add('done');
        setTimeout(()=>{ boot.remove(); Lock.show(); }, 750);
      }, Math.max(200, DUR - (performance.now()-t0)));
    }
    const onSkip = ()=>{ finish(); };
    boot.addEventListener('pointerdown', onSkip, {once:true});
    document.addEventListener('keydown', onSkip, {once:true});
    try{ Sound.play('boot'); }catch(e){}
    if (reduced){ finish(); return; }
    $('#boot-fill').style.width = '100%';
    $('#boot-sub').classList.add('on');
    letters.forEach((l,i)=>setTimeout(()=>l.classList.add('on'), 350+i*110));
    function frame(t){
      if (done) return;
      const p = Math.min(1, (t-t0)/DUR);
      const r = cvs.getBoundingClientRect();
      const dpr = Math.min(devicePixelRatio||1, 2);
      if (cvs.width !== Math.round(r.width*dpr)){ cvs.width=Math.round(r.width*dpr); cvs.height=Math.round(r.height*dpr); }
      const c = cvs.getContext('2d');
      c.setTransform(dpr,0,0,dpr,0,0);
      c.fillStyle = '#04060c'; c.fillRect(0,0,r.width,r.height);
      const cx0 = r.width/2, cy0 = r.height/2 - 30;
      const ease = 1-Math.pow(1-p,3);
      const R = 30+ease*Math.min(r.width,r.height)*.16;
      const glow = c.createRadialGradient(cx0,cy0,0, cx0,cy0,R*2.4);
      glow.addColorStop(0,'rgba(238,178,88,'+(.5*(1-p*.7))+')');
      glow.addColorStop(1,'rgba(238,178,88,0)');
      c.fillStyle=glow; c.fillRect(0,0,r.width,r.height);
      c.strokeStyle='rgba(238,178,88,'+(.85-p*.5)+')';
      c.lineWidth=1.4;
      c.beginPath();
      for(let a=0;a<=Math.PI*2+.05;a+=.05){
        const rr = R*(0.35+0.65*Math.abs(Math.cos(a*2)));
        const x=cx0+Math.cos(a-Math.PI/2)*rr, y=cy0+Math.sin(a-Math.PI/2)*rr;
        a===0?c.moveTo(x,y):c.lineTo(x,y);
      }
      c.stroke();
      if (sparks.length<130 && p<.85) for(let i=0;i<3;i++) sparks.push({a:rand(Math.PI*2), v:rand(60,340), life:rand(.5,1.3), t:0});
      for (const s of sparks){
        s.t+=.016;
        const d = s.v*s.t*(1-p*.4);
        const a = Math.max(0, s.life-s.t);
        c.fillStyle='rgba(255,205,140,'+(a*.8)+')';
        c.fillRect(cx0+Math.cos(s.a)*d, cy0+Math.sin(s.a)*d, 1.6, 1.6);
      }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    setTimeout(finish, DUR);
  }
  return { run };
})();

          ['Size', n.type==='dir' ? VFS.count(n)+' items · '+fmtBytes(VFS.du(n)) : fmtBytes(VFS.du(n))],
          ['Modified', new Date(n.mtime).toLocaleString()],

    function openItem(n, p){
      if (n.type==='dir') nav(p);
      else openPath(p);
    }
    function beginDrag(e, n, elements){
      if (e.button!==0) return;
      const ids = st.sel.has(n.id) ? [...st.sel] : (select(n, e.ctrlKey), [n.id]);
      let moved=false, ghost=null, px=e.clientX, py=e.clientY;
      const mm = ev=>{
        const dx=ev.clientX-px, dy=ev.clientY-py;
        if (!moved && Math.abs(dx)+Math.abs(dy)<6) return;
        if (!moved){ moved=true; ghost = h('div',{class:'drag-ghost'}, icon(fileIcon(n),15), h('span',{text: ids.length>1 ? ids.length+' items' : n.name})); document.body.append(ghost); }
        ghost.style.left = (ev.clientX+12)+'px'; ghost.style.top = (ev.clientY+10)+'px';
        $$('.drop-hot').forEach(x=>x.classList.remove('drop-hot'));
        const hit = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-dropto]');
        if (hit && hit.dataset.dropto) hit.classList.add('drop-hot');
      };
      const up = ev=>{
        document.removeEventListener('pointermove', mm);
        document.removeEventListener('pointerup', up);
        if (ghost) ghost.remove();
        $$('.drop-hot').forEach(x=>x.classList.remove('drop-hot'));
        if (!moved) return;
        const hit = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-dropto]');
        if (!hit) return;
        const dest = hit.dataset.dropto;
        if (!dest) return;
        let count=0;
        for (const id of ids){
          const node2 = (VFS.list(st.path)||[]).find(x=>x.id===id);
          if (!node2) continue;
          const src = VFS.join(st.path, node2.name);
          if (node2.type==='dir' && dest!=='/' && (dest+'/').startsWith(src+'/')) continue;
          if (VFS.move(src, dest)) count++;
        }
        if (count){ Sound.play('toggle'); render(); }
      };
      document.addEventListener('pointermove', mm);
      document.addEventListener('pointerup', up);
    }
    function cell(n, isInTrash){
      const nameEl = h('div',{class:'f-name', text:n.name});
      const c = h('div',{class:'fm-cell'+(st.sel.has(n.id)?' sel':''), tabindex:'0', role:'button', dataset:{dropto:n.type==='dir'?VFS.join(st.path,n.name):''}},
        h('div',{class:'f-art', style:{color:n.type==='dir'?'var(--accent)':'var(--text-2)'}}, icon(fileIcon(n),24)),
        nameEl);
      if (st.renaming===n.id){ st.renaming=null; startRename(n, nameEl); }
      c.addEventListener('click', e=>select(n, e.ctrlKey||e.metaKey));
      c.addEventListener('dblclick', ()=>{ if (!isInTrash) openItem(n, VFS.join(st.path,n.name)); else Notify.push({title:'Restore first', body:'Open items from Trash after restoring them.'}); });
      c.addEventListener('keydown', e=>{
        if (e.key==='Enter') openItem(n, VFS.join(st.path,n.name));
        else if (e.key==='F2' && !isInTrash){ st.renaming=n.id; render(); }
        else if (e.key==='Delete'){ VFS.trash(VFS.join(st.path,n.name)); Sound.play('trash'); }
      });
      c.addEventListener('contextmenu', e=>itemMenu(e, n, isInTrash));
      c.addEventListener('pointerdown', e=>{ if (e.button===0 && !isInTrash) beginDrag(e, n, cell); });
      return c;
    }
    function rowEl(n, isInTrash){
      const nameEl = h('em',{text:n.name});
      const r = h('div',{class:'fm-row'+(st.sel.has(n.id)?' sel':''), tabindex:'0', role:'button', dataset:{dropto:n.type==='dir'?VFS.join(st.path,n.name):''}},
        h('div',{class:'f-name'}, h('span',{style:{color:n.type==='dir'?'var(--accent)':'var(--text-3)'}}, icon(fileIcon(n),16)), nameEl),
        h('span',{class:'f-meta', text:n.type==='dir' ? VFS.count(n)+' items' : fmtBytes(VFS.du(n))}),
        h('span',{class:'f-meta', text:fmtStamp(n.mtime)}));
      if (st.renaming===n.id){ st.renaming=null; startRename(n, nameEl); }
      r.addEventListener('click', e=>select(n, e.ctrlKey||e.metaKey));
      r.addEventListener('dblclick', ()=>{ if (!isInTrash) openItem(n, VFS.join(st.path,n.name)); });
      r.addEventListener('keydown', e=>{
        if (e.key==='Enter') openItem(n, VFS.join(st.path,n.name));
        else if (e.key==='F2' && !isInTrash){ st.renaming=n.id; render(); }
        else if (e.key==='Delete'){ VFS.trash(VFS.join(st.path,n.name)); Sound.play('trash'); }
      });
      r.addEventListener('contextmenu', e=>itemMenu(e, n, isInTrash));
      r.addEventListener('pointerdown', e=>{ if (e.button===0 && !isInTrash) beginDrag(e, n, rowEl); });
      return r;
    }
    /* toolbar wiring */
    btnBack.addEventListener('click', ()=>{ if (st.hi>0){ st.hi--; nav(st.hist[st.hi], true); } });
    btnFwd.addEventListener('click', ()=>{ if (st.hi<st.hist.length-1){ st.hi++; nav(st.hist[st.hi], true); } });
    btnUp.addEventListener('click', ()=>nav(VFS.dirname(st.path)));
    searchIn.addEventListener('input', ()=>{ st.search = searchIn.value; render(); });
    searchIn.addEventListener('keydown', e=>e.stopPropagation());
    btnNewDir.addEventListener('click', ()=>Dialog.prompt({title:'New folder', label:'Name', value:'New folder', ok:'Create'}).then(v=>{
      if (v){ VFS.mkdir(VFS.node(st.path), v.trim()); VFS.changed('create'); }}));
    btnNewFile.addEventListener('click', ()=>Dialog.prompt({title:'New file', label:'Name', value:'untitled.txt', ok:'Create'}).then(v=>{
      if (v){ const d=VFS.node(st.path);
        d.children.push({id:uid('n'), name:VFS.uniqueName(d, v.trim()), type:'file', content:'', mime:VFS.mimeOf(v.trim()), mtime:Date.now()});
        VFS.changed('create'); }}));
    $$('.seg-btn', segView).forEach((b,i)=>b.addEventListener('click', ()=>{ st.view = i===0?'grid':'list'; Store.set('files.view', st.view); render(); }));
    /* context menu on empty area */
    view.addEventListener('contextmenu', e=>{
      if (e.target.closest('.fm-cell,.fm-row')) return;
      e.preventDefault();
      const items = [
        {label:'New folder', icon:'folderPlus', fn:()=>btnNewDir.click()},
        {label:'New file', icon:'filePlus', fn:()=>btnNewFile.click()},
        {sep:true},
        {label:'Select all', icon:'check', fn:()=>{ (VFS.list(st.path)||[]).forEach(n=>st.sel.add(n.id)); render(); }},
        {label:'Open in Terminal', icon:'terminal', fn:()=>WM.open('terminal', {cwd:st.path})},
      ];
      if (isTrash()) items.push({sep:true},{label:'Empty Trash', icon:'trash', danger:true, fn:()=>{ VFS.emptyTrash(); Sound.play('trash'); }});
      Menus.open(e.clientX, e.clientY, items);
    });
    /* external drop */
    view.addEventListener('dragover', e=>{ e.preventDefault(); view.classList.add('extdrop'); });
    view.addEventListener('dragleave', e=>{ if (e.target===view) view.classList.remove('extdrop'); });
    view.addEventListener('drop', e=>{
      e.preventDefault(); view.classList.remove('extdrop');
      if (e.dataTransfer?.files?.length) importFiles(e.dataTransfer.files, st.path);
    });
    /* keyboard on window */
    win.listen(win.body, 'keydown', e=>{
      if (e.target && e.target.closest && e.target.closest('input,textarea')) return;
      if (e.key==='Delete' && st.sel.size){
        for (const id of st.sel){ const n=(VFS.list(st.path)||[]).find(x=>x.id===id); if (n) VFS.trash(VFS.join(st.path,n.name)); }
        Sound.play('trash'); e.preventDefault();
      }
      if ((e.ctrlKey||e.metaKey) && e.key==='a'){ e.preventDefault(); (VFS.list(st.path)||[]).forEach(n=>st.sel.add(n.id)); render(); }
      if (e.key==='F2' && st.sel.size===1){
        const n=(VFS.list(st.path)||[]).find(x=>st.sel.has(x.id));
        if (n && !isTrash()){ st.renaming=n.id; render(); }
      }
    });
    const offVfs = Bus.on('vfs', ()=>{ if (win.el.isConnected) refresh(); });
    nav(st.path);
    return ()=>{ offVfs(); };
  },
});

/* ---------- 28 · Terminal (vsh) ---------- */
Apps.register({
  id:'terminal', name:'Terminal', icon:'terminal', tint:'#7ed0a0',
  w:760, h:460, min:[430,260],
  mount(win, args){
    const st = { cwd:(args&&args.cwd)||'/', hist:[], hi:0 };
    win.setTitle('Terminal');
    const out = h('div',{class:'t-out', 'aria-live':'polite'});
    const ps1 = h('span',{class:'t-ps1'});
    const input = h('input',{class:'t-input', 'aria-label':'Terminal input', spellcheck:'false', autocomplete:'off'});
    const line = h('div',{class:'t-inline'}, ps1, input);
    win.body.append(h('div',{class:'term', onclick:()=>{ if (!getSelection().toString()) input.focus(); }}, out, line));

    function promptText(){
      const home = st.cwd==='/' ? '~' : st.cwd.replace(/^\//,'');
      return '✦ '+home+' ❯ ';
    }
    function print(text, cls){
      const l = h('div',{class:'t-line'+(cls?' '+cls:'')});
      l.textContent = text;
      out.append(l); out.scrollTop = out.scrollHeight;
    }
    function printHTML(htmlSafe){
      const l = h('div',{class:'t-line'}); l.innerHTML = htmlSafe;
      out.append(l); out.scrollTop = out.scrollHeight;
    }
    function printErr(t){ print(t, 't-err'); }

    const CMDS = {};
    const def = (name, help, fn)=>CMDS[name] = {help, fn};
    const io = (stdin, redirect)=>{
      const chunks=[];
      return {
        stdin,
        out(t){ chunks.push(String(t)); },
        err(t){ printErr(t); },
        text(){ return chunks.join('\n'); },
        redirect,
      };
    };

    /* --- fs helpers for commands --- */
    function resolveOne(p){ return VFS.norm(p, st.cwd); }
    function readText(p){
      const n = VFS.node(p);
      if (!n) { return {err:'no such file: '+p}; }
      if (n.type==='dir') return {err:'is a directory: '+p};
      return {text: n.content||''};
    }
    function lineSplit(t){ return String(t).split('\n'); }

    def('help','list commands', (a, i2)=>{
      const names = Object.keys(CMDS).sort();
      i2.out('vsh — the Vesper shell\n');
      let lineTxt='';
      names.forEach((n2,idx)=>{
        lineTxt += n2.padEnd(11);
        if (lineTxt.length>=44){ i2.out(lineTxt.trimEnd()); lineTxt=''; }
      });
      if (lineTxt) i2.out(lineTxt.trimEnd());
      i2.out('');
      i2.out('pipes  a | b      redirect  > file   append  >> file');
      i2.out('tab completes · ↑↓ history · ctrl+L clear · ctrl+C cancel');
    });
    def('clear','clear screen', ()=>{ out.innerHTML=''; });
    def('pwd','print working directory', (a,i2)=>i2.out(st.cwd));
    def('ls','list directory', (a,i2)=>{
      const long = a.includes('-l');
      const target = resolveOne(a.find(x=>!x.startsWith('-')) || '.');
      const list = VFS.list(target);
      if (!list){ const n=VFS.node(target); if (n){ i2.out(VFS.basename(target)); return 0; } i2.err('ls: not a directory: '+target); return 1; }
      const items = list.slice().sort((x,y)=> x.type===y.type ? x.name.localeCompare(y.name) : x.type==='dir'?-1:1);
      if (long){
        for (const n of items){
          const kind = n.type==='dir'?'d':'-';
          const size = n.type==='dir' ? '-' : String(Math.max(1, Math.round((n.content||'').length*.75)));
          i2.out(kind+'rw-  '+size.padStart(8)+'  '+fmtStamp(n.mtime)+'  '+n.name+(n.type==='dir'?'/':''));
        }
      } else {
        i2.out(items.map(n=>n.name+(n.type==='dir'?'/':'')).join('  ') || '(empty)');
      }
      return 0;
    });
    def('cd','change directory', (a)=>{
      const t = resolveOne(a[0]||'/');
      const n = VFS.node(t);
      if (!n || n.type!=='dir'){ printErr('cd: not a directory: '+t); return 1; }
      st.cwd = t;
      return 0;
    });
    def('cat','print files', (a,i2)=>{
      if (!a.length){ i2.err('cat: needs a file'); return 1; }
      let code=0;
      for (const p of a){
        const r = readText(resolveOne(p));
        if (r.err){ i2.err('cat: '+r.err); code=1; } else i2.out(r.text);
      }
      return code;
    });
    def('echo','print text', (a,i2)=>{
      let idx=0; let nl=true;
      if (a[0]==='-n'){ nl=false; idx=1; }
      i2.out(a.slice(idx).join(' ')+(nl?'\n':''));
      return 0;
    });
    def('head','first lines', (a,i2)=>{
      let n2=10; const files=[];
      for (let k=0;k<a.length;k++){
        if (a[k]==='-n') n2 = parseInt(a[++k],10)||10;
        else files.push(a[k]);
      }
      const src = files.length ? readText(resolveOne(files[0])) : {text:i2.stdin};
      if (src.err){ i2.err('head: '+src.err); return 1; }
      i2.out(lineSplit(src.text).slice(0,n2).join('\n'));
      return 0;
    });
    def('tail','last lines', (a,i2)=>{
      let n2=10; const files=[];
      for (let k=0;k<a.length;k++){
        if (a[k]==='-n') n2 = parseInt(a[++k],10)||10;
        else files.push(a[k]);
      }
      const src = files.length ? readText(resolveOne(files[0])) : {text:i2.stdin};
      if (src.err){ i2.err('tail: '+src.err); return 1; }
      i2.out(lineSplit(src.text).slice(-n2).join('\n'));
      return 0;
    });
    def('wc','count lines/words/chars', (a,i2)=>{
      let m='lwc'; const files=[];
      for (const t of a){ if (t.startsWith('-')) m = t.slice(1)||'lwc'; else files.push(t); }
      const src = files.length ? readText(resolveOne(files[0])) : {text:i2.stdin};
      if (src.err){ i2.err('wc: '+src.err); return 1; }
      const text = src.text;
      const parts=[];
      if (m.includes('l')) parts.push(String(text.split('\n').length));
      if (m.includes('w')) parts.push(String(text.split(/\s+/).filter(Boolean).length));
      if (m.includes('c')) parts.push(String(text.length));
      i2.out(parts.join(' '));
      return 0;
    });
    def('grep','filter lines', (a,i2)=>{
      let ci=false, inv=false; const rest=[];
      for (const t of a){
        if (t==='-i') ci=true; else if (t==='-v') inv=true; else rest.push(t);
      }
      if (!rest.length){ i2.err('grep: needs a pattern'); return 1; }
      const pat = rest.shift();
      const src = rest.length ? readText(resolveOne(rest[0])) : {text:i2.stdin};
      if (src.err){ i2.err('grep: '+src.err); return 1; }
      const needle = ci ? pat.toLowerCase() : pat;
      const hits = lineSplit(src.text).filter(l=>{
        const v = ci ? l.toLowerCase() : l;
        return inv ? !v.includes(needle) : v.includes(needle);
      });
      i2.out(hits.join('\n'));
      return 0;
    });
    def('sort','sort lines', (a,i2)=>{
      const rev = a.includes('-r');
      const files = a.filter(t=>!t.startsWith('-'));
      const src = files.length ? readText(resolveOne(files[0])) : {text:i2.stdin};
      if (src.err){ i2.err('sort: '+src.err); return 1; }
      const lines = lineSplit(src.text).filter(x=>x!=='').sort();
      if (rev) lines.reverse();
      i2.out(lines.join('\n'));
      return 0;
    });
    def('uniq','dedupe adjacent lines', (a,i2)=>{
      const cnt = a.includes('-c');
      const files = a.filter(t=>!t.startsWith('-'));
      const src = files.length ? readText(resolveOne(files[0])) : {text:i2.stdin};
      if (src.err){ i2.err('uniq: '+src.err); return 1; }
      const res=[]; let prev=null, c=0;
      for (const l of lineSplit(src.text)){
        if (l===prev) c++;
        else { if (prev!=null) res.push(cnt? String(c).padStart(4)+' '+prev : prev); prev=l; c=1; }
      }
      if (prev!=null) res.push(cnt? String(c).padStart(4)+' '+prev : prev);
      i2.out(res.join('\n'));
      return 0;
    });
    def('mkdir','make directories', (a,i2)=>{
      const rec = a.includes('-p');
      const targets = a.filter(x=>!x.startsWith('-'));
      if (!targets.length){ i2.err('mkdir: needs a name'); return 1; }
      let code=0;
      for (const t of targets){
        const full = VFS.norm(t, st.cwd);
        const parent = VFS.node(VFS.dirname(full));
        if (!parent || parent.type!=='dir'){ i2.err('mkdir: no such directory: '+VFS.dirname(full)); code=1; continue; }
        const nm = VFS.basename(full);
        if (VFS.mkdir(parent, nm)){ VFS.changed('mkdir'); }
        else if (rec){ i2.out('mkdir: exists: '+nm); }
        else { i2.err('mkdir: exists: '+nm); code=1; }
      }
      return code;
    });
    def('touch','create empty files', (a,i2)=>{
      if (!a.length){ i2.err('touch: needs a file'); return 1; }
      for (const t of a){
        const full = VFS.norm(t, st.cwd);
        const parent = VFS.node(VFS.dirname(full));
        if (!parent || parent.type!=='dir'){ i2.err('touch: no such directory'); continue; }
        const ex = VFS.node(full);
        if (ex && ex.type==='file'){ ex.mtime=Date.now(); }
        else { parent.children.push({id:uid('n'), name:VFS.basename(full), type:'file', content:'', mime:VFS.mimeOf(VFS.basename(full)), mtime:Date.now()}); VFS.changed('touch'); }
      }
      return 0;
    });
    def('rm','move to Trash', (a,i2)=>{
      const targets = a.filter(x=>!x.startsWith('-'));
      if (!targets.length){ i2.err('rm: needs a path (everything goes to Trash, never obliterated)'); return 1; }
      let code=0;
      for (const t of targets){
        const full = VFS.norm(t, st.cwd);
        if (full==='/'){ i2.err('rm: refusing to trash the whole disk'); code=1; continue; }
        if (!VFS.node(full)){ i2.err('rm: no such file: '+full); code=1; continue; }
        VFS.trash(full);
      }
      if (!code) i2.out('moved to /Trash (see Files to restore)');
      return code;
    });
    def('mv','move files', (a,i2)=>{
      if (a.length<2){ i2.err('mv: mv source... destination'); return 1; }
      const destP = resolveOne(a[a.length-1]);
      let code=0;
      for (const s of a.slice(0,-1)){
        const src = resolveOne(s);
        const nodeN = VFS.node(src);
        if (!nodeN){ i2.err('mv: no such file: '+src); code=1; continue; }
        const destNode = VFS.node(destP);
        let target = destP;
        if (destNode && destNode.type==='dir') target = destP;
        else { target = VFS.dirname(destP); }
        const r = VFS.move(src, target);
        if (!r){ i2.err('mv: cannot move '+src+' → '+target); code=1; }
      }
      return code;
    });
    def('cp','copy files', (a,i2)=>{
      if (a.length<2){ i2.err('cp: cp source... destination-dir'); return 1; }
      const destP = resolveOne(a[a.length-1]);
      let code=0;
      for (const s of a.slice(0,-1)){
        const src = resolveOne(s);
        if (!VFS.node(src)){ i2.err('cp: no such file: '+src); code=1; continue; }
        if (!VFS.copy(src, destP)){ i2.err('cp: cannot copy into '+destP); code=1; }
      }
      return code;
    });
    def('tree','recursive listing', (a,i2)=>{
      const root = resolveOne(a[0]||'.');
      const n = VFS.node(root);
      if (!n || n.type!=='dir'){ i2.err('tree: not a directory: '+root); return 1; }
      let lines = [VFS.basename(root)||(root)];
      let count=0;
      const walk = (node, prefix, depth)=>{
        if (depth>5 || count>220) return;
        const kids = (node.children||[]).slice().sort((x,y)=> x.type===y.type ? x.name.localeCompare(y.name) : x.type==='dir'?-1:1);
        kids.forEach((k,idx)=>{
          count++;
          const last = idx===kids.length-1;
          lines.push(prefix + (last?'└─ ':'├─ ') + k.name + (k.type==='dir'?'/':''));
          if (k.type==='dir') walk(k, prefix+(last?'   ':'│  '), depth+1);
        });
      };
      walk(n,'',0);
      if (count>220) lines.push('… (truncated)');
      i2.out(lines.join('\n'));
      return 0;
    });
    def('find','find by name', (a,i2)=>{
      const pat = (a[0]||'').toLowerCase();
      const res=[];
      VFS.walk((n,p)=>{ if (!pat || n.name.toLowerCase().includes(pat)) res.push(p+(n.type==='dir'?'/':'')); });
      i2.out(res.slice(0,120).join('\n') || '(no matches)');
      return 0;
    });
    def('open','open with GUI app', (a)=>{
      if (!a.length){ printErr('open: needs a path'); return 1; }
      const full = resolveOne(a[0]);
      if (!VFS.node(full)){ printErr('open: no such file: '+full); return 1; }
      openPath(full);
      return 0;
    });
    def('edit','open in Editor', (a)=>{
      if (!a.length){ printErr('edit: needs a path'); return 1; }
      const full = resolveOne(a[0]);
      if (!VFS.node(full)){ printErr('edit: no such file: '+full); return 1; }
      WM.open('editor', {path:full});
      return 0;
    });
    def('date','current date', (a,i2)=>i2.out(new Date().toString()));
    def('whoami','who you are', (a,i2)=>i2.out((S.userName||'explorer').toLowerCase().replace(/\s+/g,'-')));
    def('uname','system name', (a,i2)=>i2.out(a.includes('-a')
      ? 'VesperOS vsh 1.0 web '+navigator.platform+' '+ (navigator.hardwareConcurrency||'?') + ' cores'
      : 'VesperOS'));
    def('uptime','time since boot', (a,i2)=>i2.out('up '+fmtUptime(Date.now()-BOOT_T)));
    def('history','command history', (a,i2)=>{ st.hist.forEach((c2,idx)=>i2.out(String(idx+1).padStart(4)+'  '+c2)); return 0; });
    def('notify','send a notification', (a,i2)=>{ Notify.push({title:'Terminal says', body:a.join(' ')||'…'}); return 0; });
    def('theme','set theme', (a,i2)=>{
      if (!a.length) i2.out('themes: dusk, dawn, phosphor (current: '+S.theme+')');
      else if (['dusk','dawn','phosphor'].includes(a[0])){ S.theme=a[0]; saveS(); applySettings(); i2.out('theme → '+a[0]); }
      else { i2.err('theme: unknown theme '+a[0]); return 1; }
      return 0;
    });
    def('wallpaper','set wallpaper', (a,i2)=>{
      const ids = Object.keys(Wallpaper.painters);
      if (!a.length) i2.out('wallpapers: '+ids.join(', ')+' (current: '+(Wallpaper.id||'—')+')');
      else if (ids.includes(a[0])){ S.wallpaper=a[0]; saveS(); Wallpaper.set(a[0], {force:true}); i2.out('wallpaper → '+a[0]); }
      else { i2.err('wallpaper: unknown id (try one of: '+ids.join(', ')+')'); return 1; }
      return 0;
    });
    def('volume','set volume 0-100', (a,i2)=>{
      if (!a.length){ i2.out('volume: '+Math.round(S.volume*100)); return 0; }
      const v = clamp(parseInt(a[0],10)||0, 0, 100);
      S.volume = v/100; saveS(); Sound.vol(); i2.out('volume → '+v); return 0;
    });
    def('fortune','evening wisdom', (a,i2)=>{ i2.out(pick(FORTUNES)); return 0; });
    def('sudo','escalate', (a,i2)=>{ i2.out('vsh: permission granted — though everything here was already yours.'); return 0; });
    def('exit','close terminal', ()=>{ win.close(); return 0; });
    def('neofetch','system summary', (a,i2)=>{
      const info = [
        ['user', (S.userName||'explorer').toLowerCase().replace(/\s+/g,'-')+'@vesper'],
        ['os', 'Vesper OS 1.0 "duskfall"'],
        ['shell', 'vsh 1.0'],
        ['wm', 'nocturne-wm'],
        ['theme', S.theme+' · '+S.accent],
        ['wallpaper', Wallpaper.id||'—'],
        ['windows', WM.list().length+' open'],
        ['storage', fmtBytes(Store.bytes())+' used'],
        ['uptime', fmtUptime(Date.now()-BOOT_T)],
        ['display', innerWidth+'×'+innerHeight+' @'+(devicePixelRatio||1).toFixed(1)+'x'],
      ];
      const art = [
        '      ◆      ',
        '   ◆  ◆  ◆   ',
        '     ◆ ◆     ',
        '  ◆ ◆   ◆ ◆  ',
        '     ◆ ◆     ',
        '   ◆  ◆  ◆   ',
        '      ◆      ',
      ];
      const rows = Math.max(art.length, info.length+1);
      for (let r2=0;r2<rows;r2++){
        const left = art[r2]||'              ';
        let right = '';
        if (r2===0) right = info[0][1];
        else if (info[r2]) right = info[r2][0].padEnd(10)+' '+info[r2][1];
        const lEsc = esc(left), rEsc = esc(right);
        printHTML('<span class="t-accent">'+lEsc+'</span>'.padEnd(0)+'  '+
          (r2===0 ? '<span class="t-head">'+rEsc+'</span>' : (info[r2]&&info[r2][0] ? '<span class="t-dim">'+esc(info[r2][0].padEnd(10))+'</span>'+esc(info[r2][1]) : '')));
      }
      return 0;
    });

    /* --- tokenizer & pipeline --- */
    function tokenize(s){
      const toks=[]; let cur='', quote=null;
      for (const ch of s){
        if (quote){ if (ch===quote) quote=null; else cur+=ch; }
        else if (ch==='"'||ch==="'") quote=ch;
        else if (ch===' '||ch==='\t'){ if (cur){ toks.push(cur); cur=''; } }
        else cur+=ch;
      }
      if (cur) toks.push(cur);
      return toks;
    }
    function splitPipe(line){
      const segs=[]; let cur='', quote=null;
      for (const ch of line){
        if (quote){ if (ch===quote) quote=null; cur+=ch; }
        else if (ch==='|'){ segs.push(cur); cur=''; }
        else if (ch==='"'||ch==="'") { quote=ch; cur+=ch; }
        else cur+=ch;
      }
      segs.push(cur);
      return segs.map(s=>s.trim());
    }
    function runLine(raw){
      const line = raw.trim();
      if (!line) return;
      printHTML('<span class="t-accent">'+esc(promptText())+'</span>'+esc(raw));
      const segs = splitPipe(line);
      let stdin='';
      let finalOut='';
      for (let si=0; si<segs.length; si++){
        const seg = segs[si];
        if (!seg.trim()){ printErr('vsh: empty command in pipeline'); return; }
        const toks = tokenize(seg);
        let redirect = null;
        for (let k=0;k<toks.length;k++){
          if (toks[k]==='>'||toks[k]==='>>'){
            const file = toks[k+1];
            if (!file){ printErr('vsh: redirection needs a file'); return; }
            redirect = {file: VFS.norm(file, st.cwd), append: toks[k]==='>>'};
            toks.splice(k,2); break;
          }
        }
        const cmdName = (toks[0]||'').toLowerCase();
        const cmd = CMDS[cmdName];
        if (!cmd){ printErr('vsh: unknown command: '+cmdName+'  (try "help")'); Sound.play('error'); return; }
        const i2 = io(stdin, redirect);
        try{ cmd.fn(toks.slice(1), i2); }
        catch(err){ printErr('vsh: '+cmdName+' crashed: '+err.message); return; }
        const text = i2.text();
        if (redirect){
          const parent = VFS.node(VFS.dirname(redirect.file));
          if (!parent || parent.type!=='dir'){ printErr('vsh: no such directory: '+VFS.dirname(redirect.file)); return; }
          const ex = VFS.node(redirect.file);
          if (ex && ex.type==='file'){
            VFS.write(redirect.file, redirect.append ? (ex.content||'')+'\n'+text : text);
          } else if (!ex){
            parent.children.push({id:uid('n'), name:VFS.basename(redirect.file), type:'file', content:text, mime:'text/plain', mtime:Date.now()});
          } else { printErr('vsh: not a file: '+redirect.file); return; }
          VFS.changed('write');
          if (si===segs.length-1) finalOut='';
        } else if (si===segs.length-1){
          finalOut = text;
        } else {
          stdin = text;
        }
      }
      if (finalOut && finalOut.trim()) printHTML(safeColor(finalOut));
      else if (finalOut) print('');
    }
    function safeColor(text){
      return esc(text);
    }

    /* --- completion & history --- */
    let lastTab = null;
    function complete(){
      const v = input.value;
      const parts = v.split(/\s+/);
      const completingFirst = parts.length<=1 && !v.endsWith(' ');
      const token = completingFirst ? (parts[0]||'') : (v.endsWith(' ') ? '' : parts[parts.length-1]||'');
      let options = [];
      let base = token;
      if (completingFirst) options = Object.keys(CMDS).filter(c=>c.startsWith(token)).sort();
      else {
        const norm = VFS.norm(token, st.cwd);
        const dirPart = token.endsWith('/') ? norm : VFS.dirname(norm);
        base = token.endsWith('/') ? '' : VFS.basename(norm);
        const list = VFS.list(dirPart)||[];
        options = list.filter(n=>n.name.startsWith(base)).map(n=>n.name+(n.type==='dir'?'/':'')).sort();
        if (!options.length && base){
          const lb = base.toLowerCase();
          options = list.filter(n=>n.name.toLowerCase().startsWith(lb)).map(n=>n.name+(n.type==='dir'?'/':'')).sort();
        }
      }
      if (!options.length) return;
      const pre = completingFirst ? '' : v.slice(0, v.length - base.length);
      if (options.length===1){
        input.value = (completingFirst ? '' : pre) + options[0] + (options[0].endsWith('/')?'':' ');
        lastTab = null;
      } else {
        let prefix = options[0];
        for (const o of options){ let i2=0; while (i2<prefix.length && i2<o.length && prefix[i2]===o[i2]) i2++; prefix = prefix.slice(0,i2); }
        if (prefix.length > base.length) input.value = pre + prefix;
        const key = v+'|'+options.join(',');
        if (lastTab===key){ printHTML('<span class="t-dim">'+esc(options.map(o=>o.replace(/\/$/,'')).join('   '))+'</span>'); lastTab=null; }
        else lastTab = key;
      }
    }
    input.addEventListener('keydown', e=>{
      e.stopPropagation();
      if (e.key==='Enter'){
        const v = input.value;
        input.value=''; lastTab=null;
        if (v.trim()){ st.hist.push(v); }
        st.hi = st.hist.length;
        runLine(v);
      } else if (e.key==='ArrowUp'){
        e.preventDefault();
        if (st.hist.length){ st.hi = clamp(st.hi-1, 0, st.hist.length); input.value = st.hist[st.hi]||''; }
      } else if (e.key==='ArrowDown'){
        e.preventDefault();
        st.hi = clamp(st.hi+1, 0, st.hist.length);
        input.value = st.hist[st.hi]||'';
      } else if (e.key==='Tab'){
        e.preventDefault(); complete();
      } else if (e.key==='l' && e.ctrlKey){
        e.preventDefault(); out.innerHTML='';
      } else if (e.key==='c' && e.ctrlKey){
        printHTML('<span class="t-accent">'+esc(promptText())+'</span>'+esc(input.value)+'^C');
        input.value='';
      }
    });
    const drawPrompt = ()=>{ ps1.textContent = promptText(); };
    drawPrompt();
    const offVfs = Bus.on('vfs', drawPrompt);
    printHTML('<span class="t-dim">vsh 1.0 — the Vesper shell. Type </span><span class="t-head">help</span><span class="t-dim"> to begin, </span><span class="t-head">neofetch</span><span class="t-dim"> to show off.</span>');
    if (args && args.banner) print(args.banner);
    setTimeout(()=>input.focus(), 80);
    win.listen(win.el, 'pointerdown', ()=>{ setTimeout(()=>{ if (!getSelection().toString()) input.focus(); }, 0); });
    return ()=>{ offVfs(); };
  },
});
