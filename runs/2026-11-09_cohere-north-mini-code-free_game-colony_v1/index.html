<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Colony Builder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        #ui-container {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        .resource-display {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .resource-slot {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 4px;
            min-width: 80px;
            text-align: center;
        }
        .resource-slot.active {
            background: rgba(50, 200, 50, 0.3);
            border: 1px solid #50c850;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .control-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
        }
        .tab {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .tab button {
            background: rgba(255, 255, 255, 0.2);
        }
        .tab button.active {
            background: #4CAF50;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .building-preview {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            display: none;
            z-index: 200;
        }
        .construction-progress {
            width: 200px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar {
            height: 100%;
            background: #4CAF50;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <h1>3D Colony Builder</h1>
        <div id="status">Loading...</div>
        <div class="resource-display" id="resources">
            <div class="resource-slot">
                <div>Food</div>
                <div id="food">0</div>
            </div>
            <div class="resource-slot">
                <div>Water</div>
                <div id="water">0</div>
            </div>
            <div class="resource-slot">
                <div>Energy</div>
                <div id="energy">0</div>
            </div>
            <div class="resource-slot">
                <div>Population</div>
                <div id="population">0</div>
            </div>
        </div>
        <div id="construction-info">
            <div id="construction-status">No construction in progress</div>
        </div>
    </div>

    <div class="building-preview" id="building-preview">
        <h3 id="preview-title">Preview</h3>
        <p id="preview-description"></p>
        <button id="cancel-construction">Cancel</button>
    </div>

    <div class="control-panel">
        <div class="tab">
            <button class="tab-btn active" onclick="switchTab('building')">Building</button>
            <button class="tab-btn" onclick="switchTab('resources')">Resources</button>
            <button class="tab-btn" onclick="switchTab('agents')">Agents</button>
        </div>

        <div id="building-tab" class="tab-content active">
            <h3>Buildings</h3>
            <button onclick="startConstruction('house')">House (1 Food/hr, 5 Population)</button>
            <button onclick="startConstruction('farm')">Farm (5 Food/hr, 10 Land)</button>
            <button onclick="startConstruction('water-well')">Water Well (2 Water/hr, 8 Energy)</button>
            <button onclick="startConstruction('solar-panel')">Solar Panel (3 Energy/hr, 10 Energy)</button>
        </div>

        <div id="resources-tab" class="tab-content">
            <h3>Resource Production</h3>
            <div id="production-stats"></div>
        </div>

        <div id="agents-tab" class="tab-content">
            <h3>Colony Agents</h3>
            <div id="agent-stats"></div>
        </div>
    </div>

    <script>
        // Game state
        const gameState = {
            resources: {
                food: 100,
                water: 100,
                energy: 100,
                population: 10
            },
            production: {
                food: 0,
                water: 0,
                energy: 0
            },
            buildings: {
                houses: 0,
                farms: 0,
                waterWells: 0,
                solarPanels: 0
            },
            agents: [],
            currentConstruction: null,
            constructionProgress: 0,
            constructionTime: 0
        };

        // Initialize Three.js scene
        let scene, camera, renderer, terrain, colonyGroup;
        let raycaster, mouse;
        let buildings = [];

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Initialize game world
            initWorld();

            // Initialize UI
            updateUI();

            // Start game loop
            animate();

            // Start resource production
            setInterval(produceResources, 1000);
        }

        function initWorld() {
            // Create colony group
            colonyGroup = new THREE.Group();
            scene.add(colonyGroup);

            // Create terrain
            createTerrain();

            // Create initial colony buildings
            placeBuilding('house', 0, 0, 0);
            placeBuilding('house', 2, 0, 0);
            placeBuilding('water-well', -2, 0, 0);

            // Set camera position
            camera.position.set(0, 20, 30);
            camera.lookAt(0, 0, 0);

            // Initialize raycaster for mouse picking
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Add mouse move event listener
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);
        }

        function createTerrain() {
            // Simple terrain using heightmap
            const geometry = new THREE.PlaneGeometry(100, 100, 50, 50);
            const vertices = geometry.vertices;

            // Create a simple hilly terrain
            for (let i = 0; i < vertices.length; i++) {
                const v = vertices[i];
                v.z = (Math.random() - 0.5) * 10;
            }

            geometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({
                color: 0x808080,
                roughness: 0.8,
                metalness: 0.2
            });

            terrain = new THREE.Mesh(geometry, material);
            terrain.rotation.x = -Math.PI / 2;
            terrain.receiveShadow = true;
            scene.add(terrain);
        }

        function createBuildingMesh(type, x, z) {
            let geometry, material;

            switch (type) {
                case 'house':
                    geometry = new THREE.BoxGeometry(2, 3, 2);
                    material = new THREE.MeshStandardMaterial({ color: 0xff9900 });
                    break;
                case 'farm':
                    geometry = new THREE.BoxGeometry(4, 1, 4);
                    material = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                    break;
                case 'water-well':
                    geometry = new THREE.CylinderGeometry(0.5, 0.5, 2, 8);
                    material = new THREE.MeshStandardMaterial({ color: 0x0000ff });
                    break;
                case 'solar-panel':
                    geometry = new THREE.BoxGeometry(2, 0.5, 2);
                    material = new THREE.MeshStandardMaterial({ color: 0xffff00 });
                    break;
                default:
                    geometry = new THREE.BoxGeometry(1, 1, 1);
                    material = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
            }

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            // Rotate solar panels to face up
            if (type === 'solar-panel') {
                mesh.rotation.y = Math.PI;
            }

            return mesh;
        }

        function placeBuilding(type, x, y, z) {
            const building = createBuildingMesh(type, x, z);
            building.position.set(x, y, z);
            building.userData = { type: type, x, z };
            colonyGroup.add(building);
            buildings.push(building);

            // Update game state
            gameState.buildings[type + 's']++;

            return building;
        }

        function startConstruction(type) {
            if (gameState.currentConstruction) {
                gameState.currentConstruction = null;
                gameState.constructionProgress = 0;
            }

            // Check if we can afford to build
            const cost = getBuildingCost(type);
            if (checkResources(cost)) {
                gameState.currentConstruction = type;
                gameState.constructionProgress = 0;
                gameState.constructionTime = 3000; // 3 seconds
                updateUI();
                showBuildingPreview(type);
            } else {
                showNotification('Not enough resources!');
            }
        }

        function getBuildingCost(type) {
            const costs = {
                'house': { food: 1, population: 5 },
                'farm': { food: 5, water: 1, energy: 1 },
                'water-well': { water: 2, energy: 8 },
                'solar-panel': { energy: 10 }
            };
            return costs[type] || {};
        }

        function checkResources(cost) {
            for (const [resource, amount] of Object.entries(cost)) {
                if (gameState.resources[resource] < amount) {
                    return false;
                }
            }
            return true;
        }

        function showBuildingPreview(type) {
            const preview = document.getElementById('building-preview');
            const title = document.getElementById('preview-title');
            const description = document.getElementById('preview-description');

            const buildingInfo = {
                'house': { title: 'House', description: 'Provides shelter for colonists. Increases population capacity.' },
                'farm': { title: 'Farm', description: 'Produces food from the land. Requires water and energy.' },
                'water-well': { title: 'Water Well', description: 'Extracts groundwater. Provides clean water for the colony.' },
                'solar-panel': { title: 'Solar Panel', description: 'Generates energy from sunlight. Powers the colony.' }
            };

            const info = buildingInfo[type];
            title.textContent = info.title;
            description.textContent = info.description;
            preview.style.display = 'block';
        }

        function hideBuildingPreview() {
            document.getElementById('building-preview').style.display = 'none';
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            if (gameState.currentConstruction) {
                raycaster.setFromCamera(mouse, camera);

                const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
                raycaster.ray.intersectPlane(plane, mouse);

                if (mouse) {
                    // Update preview position
                    const x = Math.round(mouse.x * 10) / 10;
                    const z = Math.round(mouse.z * 10) / 10;
                    showBuildingPreviewAtPosition(gameState.currentConstruction, x, z);
                }
            }
        }

        function showBuildingPreviewAtPosition(type, x, z) {
            // This would update a preview object at the mouse position
            // For simplicity, just show the info
            showBuildingPreview(type);
        }

        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Check if we clicked on a building
            const intersects = raycaster.intersectObjects(colonyGroup.children);
            if (intersects.length > 0) {
                const building = intersects[0].object;
                if (building.userData.type) {
                    showBuildingInfo(building.userData.type, building.userData.x, building.userData.z);
                }
            } else {
                // Try to build at the clicked position
                if (gameState.currentConstruction) {
                    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
                    raycaster.ray.intersectPlane(plane, mouse);

                    if (mouse) {
                        const x = Math.round(mouse.x * 10) / 10;
                        const z = Math.round(mouse.z * 10) / 10;

                        // Check if position is clear
                        if (isPositionClear(x, z)) {
                            constructBuilding(gameState.currentConstruction, x, z);
                        } else {
                            showNotification('Position not available or occupied!');
                        }
                    }
                }
            }
        }

        function isPositionClear(x, z) {
            // Check if position is occupied
            for (const building of buildings) {
                if (Math.abs(building.position.x - x) < 2 && Math.abs(building.position.z - z) < 2) {
                    return false;
                }
            }
            return true;
        }

        function constructBuilding(type, x, z) {
            // Check resources
            const cost = getBuildingCost(type);
            for (const [resource, amount] of Object.entries(cost)) {
                gameState.resources[resource] -= amount;
            }

            // Build the building
            placeBuilding(type, x, 0, z);

            // Hide preview
            hideBuildingPreview();
            gameState.currentConstruction = null;
            gameState.constructionProgress = 0;

            // Spawn agents if this is a house or farm
            if (type === 'house') {
                spawnAgent('colonist');
            } else if (type === 'farm') {
                spawnAgent('worker');
            }

            updateUI();
        }

        function produceResources() {
            // Calculate production
            const foodProduction = gameState.buildings.farms * 5;
            const waterProduction = gameState.buildings.waterWells * 2;
            const energyProduction = gameState.buildings.solarPanels * 3;

            gameState.production.food = foodProduction;
            gameState.production.water = waterProduction;
            gameState.production.energy = energyProduction;

            // Add resources
            gameState.resources.food += foodProduction;
            gameState.resources.water += waterProduction;
            gameState.resources.energy += energyProduction;

            // Consume resources for population
            const foodPerPerson = 1;
            const waterPerPerson = 2;
            const energyPerPerson = 1;

            const foodNeeded = gameState.resources.population * foodPerPerson;
            const waterNeeded = gameState.resources.population * waterPerPerson;
            const energyNeeded = gameState.resources.population * energyPerPerson;

            if (gameState.resources.food >= foodNeeded) {
                gameState.resources.food -= foodNeeded;
            } else {
                gameState.resources.population = Math.max(0, gameState.resources.population - Math.ceil((foodNeeded - gameState.resources.food) / foodPerPerson));
            }

            if (gameState.resources.water >= waterNeeded) {
                gameState.resources.water -= waterNeeded;
            } else {
                gameState.resources.population = Math.max(0, gameState.resources.population - Math.ceil((waterNeeded - gameState.resources.water) / waterPerPerson));
            }

            if (gameState.resources.energy >= energyNeeded) {
                gameState.resources.energy -= energyNeeded;
            } else {
                gameState.resources.population = Math.max(0, gameState.resources.population - Math.ceil((energyNeeded - gameState.resources.energy) / energyPerPerson));
            }

            updateUI();
        }

        function spawnAgent(type) {
            const agent = {
                id: Date.now(),
                type: type,
                x: 0,
                z: 0,
                currentTask: 'idle',
                efficiency: 1
            };

            gameState.agents.push(agent);
            updateUI();
        }

        function updateUI() {
            document.getElementById('food').textContent = gameState.resources.food;
            document.getElementById('water').textContent = gameState.resources.water;
            document.getElementById('energy').textContent = gameState.resources.energy;
            document.getElementById('population').textContent = gameState.resources.population;

            updateProductionStats();
            updateAgentStats();
        }

        function updateProductionStats() {
            const stats = document.getElementById('production-stats');
            stats.innerHTML = `
                <p>Food Production: ${gameState.production.food}/hr</p>
                <p>Water Production: ${gameState.production.water}/hr</p>
                <p>Energy Production: ${gameState.production.energy}/hr</p>
                <p>Houses: ${gameState.buildings.houses}</p>
                <p>Farms: ${gameState.buildings.farms}</p>
                <p>Water Wells: ${gameState.buildings.waterWells}</p>
                <p>Solar Panels: ${gameState.buildings.solarPanels}</p>
            `;
        }

        function updateAgentStats() {
            const stats = document.getElementById('agent-stats');
            if (gameState.agents.length === 0) {
                stats.innerHTML = '<p>No agents in colony</p>';
                return;
            }

            stats.innerHTML = gameState.agents.map(agent => `
                <div class="agent-slot">
                    <h4>${agent.type} #${agent.id}</h4>
                    <p>Task: ${agent.currentTask}</p>
                    <p>Efficiency: ${agent.efficiency * 100}%</p>
                </div>
            `).join('');
        }

        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
        }

        function showNotification(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            setTimeout(() => {
                status.textContent = 'Game running';
            }, 3000);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotate colony group slowly
            colonyGroup.rotation.y += 0.001;

            // Update construction progress
            if (gameState.currentConstruction && gameState.constructionProgress > 0) {
                gameState.constructionProgress = Math.min(gameState.constructionProgress + 100, gameState.constructionTime);
                updateUI();

                if (gameState.constructionProgress >= gameState.constructionTime) {
                    gameState.currentConstruction = null;
                    gameState.constructionProgress = 0;
                }
            }

            renderer.render(scene, camera);
        }

        function showBuildingInfo(type, x, z) {
            showNotification(`${type} located at (${x.toFixed(1)}, ${z.toFixed(1)})`);
        }

        // Window resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start the game when page loads
        window.addEventListener('load', () => {
            // Check if Three.js is available
            if (typeof THREE === 'undefined') {
                showNotification('Loading Three.js...');
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
                script.onload = () => {
                    init();
                };
                document.head.appendChild(script);
            } else {
                init();
            }
        });
