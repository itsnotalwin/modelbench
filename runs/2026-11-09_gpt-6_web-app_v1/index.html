function clone(x){return JSON.parse(JSON.stringify(x))}function validateState(s){if(!s||s.schema!==SCHEMA||!Array.isArray(s.shipments)||!Array.isArray(s.documents)||!Array.isArray(s.exceptions)||!Array.isArray(s.activity))throw Error('This file is not a compatible Harbor backup.');if(s.shipments.length>10000||s.documents.length>50000||s.exceptions.length>20000)throw Error('This backup is larger than Harbor can safely import.');let ids=new Set();for(let x of s.shipments){if(!x.id||ids.has(x.id))throw Error('Shipment IDs must be unique.');ids.add(x.id);if(!['Awaiting documents','In review','Ready to submit','Submitted','On hold','Released'].includes(x.status))throw Error('A shipment has an unsupported status.')}let docIds=new Set(),excIds=new Set();for(let d of s.documents){if(!ids.has(d.shipmentId))throw Error('A document refers to a shipment that does not exist.');if(!d.id||docIds.has(d.id))throw Error('Document IDs must be unique.');docIds.add(d.id)}for(let e of s.exceptions){if(!ids.has(e.shipmentId))throw Error('An exception refers to a shipment that does not exist.');if(!e.id||excIds.has(e.id))throw Error('Exception IDs must be unique.');excIds.add(e.id)}for(let sh of s.shipments.filter(x=>x.status==='Ready to submit')){let docs=s.documents.filter(d=>d.shipmentId===sh.id);if(!docs.length||docs.some(d=>d.status!=='Verified'))throw Error(sh.id+' cannot be ready: every supporting document must be verified.');if(s.exceptions.some(e=>e.shipmentId===sh.id&&e.status!=='Resolved'))throw Error(sh.id+' cannot be ready while an exception is open.')}return true}
function persist(){try{db.updatedAt=now();db.revision=(db.revision||0)+1;localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;document.querySelector('#storageWarning')?.remove();return true}catch(e){storageOK=false;showStorageWarning('Harbor could not save this change to browser storage. Your current tab still has the change, but it may not survive closing. Export a backup before leaving.');return false}}
function init(){try{let raw=localStorage.getItem(KEY);if(raw){let parsed=JSON.parse(raw);validateState(parsed);db=parsed}else{db=clone(seed);persist()}}catch(e){db=clone(seed);storageOK=false;showStorageWarning('Saved data could not be read. A fresh sample workspace is open. Export or recover a backup before continuing.');}render();updateCounts()}
function showStorageWarning(t){let old=document.querySelector('#storageWarning');if(!old){old=document.createElement('div');old.id='storageWarning';old.className='storage-warning';document.querySelector('#content').prepend(old)}old.textContent=t;old.style.display='block'}
function log(title,detail,kind='system'){db.activity.unshift({id:Date.now()+Math.random(),at:now(),title,detail,kind});db.activity=db.activity.slice(0,100)}function commit(label,fn){let before=clone(db);try{fn();validateState(db);let durable=persist();undoStack.push({label,before});if(undoStack.length>20)undoStack.shift();updateCounts();render();toast(durable?label+' saved':label+' is only in this tab. Export a backup now.',true)}catch(e){db=before;toast(e.message||'That change could not be saved.')}}
function undo(){let u=undoStack.pop();if(!u){toast('Nothing to undo');return}db=u.before;persist();updateCounts();render();toast('Undid: '+u.label)}
function toast(msg,withUndo=false){let el=document.querySelector('#toast');el.innerHTML=esc(msg)+(withUndo?' <button id="undoToast">UNDO · Ctrl Z</button>':'');el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),4200);el.querySelector('#undoToast')?.addEventListener('click',undo)}
function updateCounts(){let n=id=>document.getElementById(id);n('navShip').textContent=db.shipments.length;n('navDocs').textContent=String(db.documents.filter(x=>x.status!=='Verified').length).padStart(2,'0');n('navExc').textContent=String(db.exceptions.filter(x=>x.status!=='Resolved').length).padStart(2,'0');n('navRelease').textContent=String(db.shipments.filter(x=>x.status==='Ready to submit'||x.status==='Submitted').length).padStart(2,'0');let released=db.shipments.filter(x=>x.status==='Released').length;n('sidePace').textContent=Math.min(100,Math.round(released/11*100))+'%'}
function setPage(p){activePage=p;selected.clear();search='';statusFilter='all';activeView='all';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.querySelector('#crumb').textContent=({overview:'Command centre',shipments:'Shipments',documents:'Documents',exceptions:'Exceptions',release:'Release queue'})[p];document.querySelector('#sidebar').classList.remove('open');render()}

function shipmentTable(list,check=false){if(!list.length)return `<div class="empty"><strong>No consignments in this view</strong><p>Try a different filter, clear your search, or create a shipment to get the desk moving.</p><button class="btn primary" data-action="new-shipment">＋ New shipment</button></div>`;return `<div class="table-wrap"><table class="data-table"><thead><tr><th>${check?'<input type="checkbox" id="selectAll" aria-label="Select all visible">':''}</th><th>Reference</th><th>Importer / goods</th><th>Owner</th><th>ETA</th><th>Stage</th><th>Documents</th></tr></thead><tbody>${list.map(s=>shipmentRow(s,check)).join('')}</tbody></table></div>`}
function metric(label,val,foot){return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${val}</div><div class="metric-foot">${foot}</div></div>`}
function overview(){let active=db.shipments.filter(s=>s.status!=='Released').length,urgent=db.shipments.filter(s=>s.priority==='Urgent'&&s.status!=='Released').length,blocked=db.shipments.filter(s=>s.status==='On hold'||s.status==='Awaiting documents').length,ready=db.shipments.filter(s=>s.status==='Ready to submit').length,unverified=db.documents.filter(d=>d.status!=='Verified').length;let due=db.shipments.filter(s=>s.status!=='Released').sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,5);return `<div class="pagehead"><div><div class="kicker">Monday desk brief · Johannesburg</div><h1>Good morning. Let's clear the quay.</h1><p>Your working picture for ${new Intl.DateTimeFormat('en-ZA',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}.</p></div><div class="head-actions"><button class="btn" data-action="reset">↺ Reset samples</button><button class="btn" data-action="export">↓ Export desk</button><button class="btn primary" data-action="new-shipment">＋ Create shipment</button></div></div><div class="metrics">${metric('Active consignments',active,`<span class="up">${urgent} urgent</span> · across all owners`)}${metric('Awaiting a decision',blocked,`${unverified} documents still outstanding`)}${metric('Ready for submission',ready,'Complete packs · value check next')}${metric('Exceptions open',db.exceptions.filter(e=>e.status!=='Resolved').length,`<span style="color:var(--red)">${db.exceptions.filter(e=>e.severity==='Critical'&&e.status!=='Resolved').length} critical</span> · needs attention`)}</div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>Consignments in motion</h2><p>The next files most likely to need your attention</p></div><button class="btn small" data-page="shipments">View all ↗</button></div>${shipmentTable(due)}</section><section class="panel"><div class="panel-head"><div><h2>Priority desk</h2><p>Exceptions and deadlines, in order</p></div><span class="badge b-red">${urgent+db.exceptions.filter(e= d.status==='Rejected').length} rejected · ${db.documents.filter(d=>d.status==='Pending').length} pending. Update the register as soon as a document lands.</div></div></section></div>`}
function shipmentsPage(){let arr=db.shipments.filter(s=>(!search||[s.id,s.client,s.goods,s.origin,s.owner].join(' ').toLowerCase().includes(search.toLowerCase()))&&(statusFilter==='all'||s.status===statusFilter)&&(activeView!=='urgent'||s.priority==='Urgent')&&(activeView!=='docs'||s.status==='Awaiting documents')&&(activeView!=='ready'||s.status==='Ready to submit'));arr.sort((a,b)=>{let x=a[sortKey]||'',y=b[sortKey]||'';return String(x).localeCompare(String(y))*sortDir});return `<div class="pagehead"><div><div class="kicker">The live register</div><h1>Shipments</h1><p>One record from instruction to release. Keep the handoffs visible.</p></div><div class="head-actions"><button class="btn" data-action="import">↑ Import</button><button class="btn" data-action="export">↓ Export</button><button class="btn primary" data-action="new-shipment">＋ New shipment</button></div></div><section class="panel"><div class="savedviews">${db.savedViews.map(v=>`<button class="viewchip ${activeView===v.id?'active':''}" data-view="${v.id}">${esc(v.name)}</button>`).join('')}<button class="viewchip" data-action="save-view">＋ Save current view</button></div><div class="toolbar"><div class="searchbox"><span>⌕</span><input id="tableSearch" placeholder="Search reference, importer, goods, owner…" value="${esc(search)}" aria-label="Search shipments"></div><select id="statusFilter" aria-label="Filter by status"><option value="all">All stages</option>${['Awaiting documents','In review','Ready to submit','Submitted','On hold','Released'].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select><select id="sortSelect" aria-label="Sort shipments"><option value="eta" ${sortKey==='eta'?'selected':''}>Sort: ETA</option><option value="client" ${sortKey==='client'?'selected':''}>Sort: importer</option><option value="status" ${sortKey==='status'?'selected':''}>Sort: stage</option><option value="owner" ${sortKey==='owner'?'selected':''}>Sort: owner</option><option value="deadline function exceptionsPage(){let list=db.exceptions.filter(e=>(!search||[e.id,e.title,e.shipmentId,e.owner,e.description].join(' ').toLowerCase().includes(search.toLowerCase()))&&(statusFilter==='all'||e.status===statusFilter));return `<div class="pagehead"><div><div class="kicker">The things that stop release</div><h1>Exceptions</h1><p>Give each blocker an owner, a due date and a next move.</p></div><div class="head-actions"><button class="btn primary" data-action="new-exception">＋ Log exception</button></div></div><div class="exception-layout"><section class="panel"><div class="panel-head"><div><h2>Open exception log</h2><p>${list.filter(e=>e.status!=='Resolved').length} unresolved · sorted by severity</p></div><select id="statusFilter"><option value="all">All states</option>${['Open','In progress','Resolved'].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div>${list.sort((a,b)=>(a.severity==='Critical'?-1:1)-(b.severity==='Critical'?-1:1)).map(e=>`<article class="exception"><span class="priority-mark ${e.severity==='Critical'?'red':''}"></span><div><h3>${esc(e.title)} <span class="kbdhelp">· ${esc(e.id)}</span></h3><p>${esc(e.description)}</p><div class="meta">${esc(e.shipmentId)} · ${esc(e.owner)} · Due ${fmt(e.due)} · ${esc(e.severity)}</div></div><div class="exception-actions">${statusBadge(e.status)}<button class="iconbtn" data-edit-exception="${e.id}" aria-label="Edit exception">↗</button></div></article>`).join('')||'<div class="empty"><strong>No exceptions match</strong><p>Nothing in this filtered view. That is a good sign.</p></div>'}</div></section><section class="panel"><div class="panel-head"><div><h2>Escalation guide</h2><p>Make the next action explicit</p></div></div><div class="panel-body"><div class="priority-list"><div class="priority"><span class="priority-mark red"></span><div><b>Critical · stop the file</b><p>Keep shipment on hold. Escalate to the responsible broker or client immediately.</p></div></div><div class="priority"><span class="priority-mark"></span><div><b>High · protect the deadline</b><p>Assign an owner and agree a same-day response where possible.</p></div></div><div class="priority"><span class="priority-mark" style="background:#6b8ca0"></span><div><b>Normal · track the dependency</b><p>Record the next check-in and close the loop when evidence arrives.</p></div></div></div><p class="footnote" style="margin-top:18px">Resolving an exception does not automatically release a shipment. Verify its documents and clearance stage separately.</p></div></section></div>`}
function releasePage(){let list=db.shipments.filter(s=>['Ready to submit','Submitted'].includes(s.status));return `<div class="pagehead"><div><div class="kicker">Final mile</div><h1>Release queue</h1><p>Submission-ready files and declarations waiting on customs.</p></div></div><div class="metrics">${metric('Ready to submit',list.filter(s=>s.status==='Ready to submit').length,'Awaiting final value check')}${metric('Submitted',list.filter(s=>s.status==='Submitted').length,'Awaiting customs response')}${metric('Total declared value',money(list.reduce((n,s)=>n+s.value,0)),'Across the current queue')}${metric('Open blockers',db.exceptions.filter(e=>e.status!=='Resolved').length,'Resolve before release')}</div><section class="panel"><div class="panel-head"><div><h2>Queue by next action</h2><p>Move each consignment only when its evidence supports the transition</p></div></div>${shipmentTable(list)}</section><div class="panel" style="margin-top:15px;padding:16px 19px"><b style="font-size:11px">Release rule</b><p class="footnote">Harbor blocks submission while required documents are missing, pending or rejected, and blocks release until the shipment has been submitted. A resolved exception is not proof of customs release.</p></div>`}
function render(){let el=document.querySelector('#content');el.innerHTML=activePage==='overview'?overview():activePage==='shipments'?shipmentsPage():activePage==='documents'?documentsPage():activePage==='exceptions'?exceptionsPage():releasePage();bindContent()}
function bindContent(){document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));document.querySelectorAll('[data-open-shipment]').forEach(r=>r.addEventListener('click',()=>openShipment(r.dataset.openShipment)));document.querySelectorAll('[data-open-exception]').forEach(r=>r.addEventListener('click',()=>editException(r.dataset.openException)));document.querySelectorAll('[data-edit-doc]').forEach(b=>b.addEventListener('click',()=>editDocument(b.dataset.editDoc)));document.querySelectorAll('[data-delete-doc]').forEach(b=>b.addEventListener('click',()=>deleteDocument(b.dataset.deleteDoc)));document.querySelectorAll('[data-edit-exception]').forEach(b=>b.addEventListener('click',()=>editException(b.dataset.editException)));document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{let v=db.savedViews.find(x=>x.id===b.dataset.view);if(!v)return;activeView=v.id;search=v.search||'';statusFilter=v.statusFilter||'all';sortKey=v.sortKey||'eta';sortDir=v.sortDir||1;render()}));let q=document.querySelector('#tableSearch');q?.addEventListener('input',()=>{search=q.value;let pos=q.selectionStart;render();let nq=document.querySelector('#tableSearch');nq?.focus();nq?.setSelectionRange(pos,pos)});document.querySelector('#statusFilter')?.addEventListener('change',e=>{statusFilter=e.target.value;render()});document.querySelector('#sortSelect')?.addEventListener('change',e=>{sortKey=e.target.value;render()});document.querySelector('#selectAll')?.addEventListener('change',e=>{document.querySelectorAll('[data-select]').forEach(c=>{c.checked=e.target.checked;e.target.checked?selected.add(c.dataset.select):selected.delete(c.dataset.select)});document.querySelector('#bulkbar')?.classList.toggle('show',selected.size>0)});document.querySelectorAll('[data-select]').forEach(c=>c.addEventListener('change',()=>{c.checked?selected.add(c.dataset.select):selected.delete(c.dataset.select);document.querySelector('#bulkbar')?.classList.toggle('show',selected.size>0)}))}
function action(a){if(a==='new-shipment')shipmentForm();if(a==='new-document')documentForm();if(a==='new-exception')exceptionForm();if(a==='export')exportData();if(a==='import')importData();if(a==='save-view')saveView();if(a==='reset')resetWorkspace();if(a==='clear-selection'){selected.clear();render()}if(a==='bulk-delete')bulkDelete();if(a==='bulk-assign')bulkAssign();if(a==='bulk-status')bulkStatus()}
function openModal(title,body,foot){focusReturn=document.activeElement;let m=document.querySelector('#modal');m.innerHTML=`<div class="modal-head"><h2 id="modalTitle">${title}</h2><button class="iconbtn" data-close-modal aria-label="Close dialog">✕</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot||'<button class="btn" data-close-modal>Cancel</button>'}</div>`;document.querySelector('#modalOverlay').classList.add('open');m.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click',closeModal));m.querySelector('input,select,textarea,button')?.focus();document.querySelector('#modalOverlay').onclick=e=>{if(e.target.id==='modalOverlay')closeModal()}}
function closeModal(){document.querySelector('#modalOverlay').classList.remove('open');focusReturn?.focus?.()}
function field(label,name,value='',type='text',opts=null,required=false,full=false){let input=opts?`<select name="${name}" ${required?'required':''}>${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${name}">${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''}>`;return `<div class="field ${full?'full':''}"><label for="f-${name}">${label}${required?' *':''}</label>${input.replace(`name="${name}"`,`id="f-${name}" name="${name}"`)}<span class="error" data-error="${name}"></span></div>`}
function formValues(form){return Object.fromEntries(new FormData(form).entries())}function formError(form,name,msg){let el=form.querySelector(`[data-error="${name}"]`);if(el)el.textContent=msg;form.querySelector(`[name="${name}"]`)?.setAttribute('aria-invalid','true')}
function shipmentForm(s=null){let editing=!!s;openModal(editing?'Edit shipment':'New shipment',`<form id="shipmentForm" novalidate><div class="field-grid">${field('Importer / client','client',s?.client||'','text',null,true)}${field('Goods description','goods',s?.goods||'','text',null,true)}${field('Origin','origin',s?.origin||'','text',null,true)}${field('Transport mode','mode',s?.mode||'Air','text',['Air','Sea','Road','Rail'])}${field('ETA','eta',s?.eta||days(3),'date',null,true)}${field('Clearance deadline','deadline',s?.deadline||days(3),'date',null,true)}${field('Assigned owner','owner',s?.owner||'L. Mokoena','text',['L. Mokoena','T. Naidoo','S. Dlamini','P. Khumalo'])}${field('Priority','priority',s?.priority||'Normal','text',['Normal','High','Urgent'])}${field('Current stage','status',s?.status||'Awaiting documents','text',['Awaiting documents','In review','Ready to submit','Submitted','On hold','Released'])}${field('Declared value (ZAR)','value',s?.value||'','number',null,true)}${field('Incoterm','incoterm',s?.incoterm||'FOB','text',['EXW','FCA','FAS','FOB','CFR','CIF','CPT','CIP','DAP','DPU','DDP'])}${field('Port / terminal','port',s?.port||'Durban','text',['Durban','OR Tambo','Cape Town','Gqeberha'])}${field('Working notes','notes',s?.notes||'','textarea',null,false,true)}</div><p class="footnote">Fields marked * are required. Harbor will create a stable reference and a dated activity trail.</p></form>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="saveShipment">${editing?'Save changes':'Create shipment'}</button>`);document.querySelector('#saveShipment').onclick=()=>{let f=document.querySelector('#shipmentForm'),v=formValues(f),ok=true;['client','goods','origin','eta','deadline','owner','value'].forEach(k=>{if(!String(v[k]||'').trim()){formError(f,k,'This field is required.');ok=false}});if(Number(v.value)<=0){formError(f,'value','Enter a declared value greater than zero.');ok=false}if(v.deadline&&v.eta&&v.deadline<v.eta){formError(f,'deadline','Deadline cannot be earlier than ETA.');ok=false}if(!ok)return;if(s&&s.status==='Released'&&v.status!=='Released'&&v.status!=='On hold'){formError(f,'status','A released consignment cannot return to pre-release stages.');return}commit(editing?'Shipment updated':'Shipment created',()=>{if(s){Object.assign(s,v,{value:Number(v.value),updatedAt:now()});s.history.unshift({at:now(),text:'Shipment details updated'})}else{let x={...v,id:uid(),value:Number(v.value),createdAt:now(),updatedAt:now(),history:[{at:now(),text:'Shipment created'}]};db.shipments.unshift(x)}log(editing?'Shipment updated':'New shipment created',`${v.client} · ${s?.id||db.shipments[0].id}`)});closeModal()}}
function openShipment(id){let s=db.shipments.find(x=>x.id===id);if(!s)return;let docs=db.documents.filter(d=>d.shipmentId===id),exc=db.exceptions.filter(e=>e.shipmentId===id),verified=docs.filter(d=>d.status==='Verified').length,canSubmit=docs.length>0&&docs.every(d=>d.status==='Verified')&&!exc.some(e=>e.status!=='Resolved');document.querySelector('#drawer').innerHTML=`<div class="drawer-head"><div class="drawer-head-top"><span class="ref">${esc(s.id)} · ${esc(s.port)}</span><button class="iconbtn" id="closeDrawer" aria-label="Close shipment details">✕</button></div><h2>${esc(s.client)}</h2><p>${esc(s.goods)} · ${esc(s.origin)} · ${esc(s.mode)}</p><div style="margin-top:12px;display:flex;gap:8px;align-items:center">${statusBadge(s.status)} <span class="badge b-${s.priority==='Urgent'?'red':s.priority==='High'?'amber':'gray'}">${esc(s.priority)} priority</span></div></div><div class="drawer-body"><div class="detail-stats"><div class="detail-stat"><small>Declared value</small><b>${money(s.value)}</b></div><div class="detail-stat"><small>ETA</small><b>${fmt(s.eta)}</b></div><div class="detail-stat"><small>Owner</small><b style="font-size:12px">${esc(s.owner)}</b></div></div><div class="section-label">Clearance progression</div><div class="field-grid"><div class="field"><label>Current stage</label><select id="detailStatus">${['Awaiting documents','In review','Ready to submit','Submitted','On hold','Released'].map(x=>`<option ${x===s.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Next action</label><button class="btn" id="editShipment" style="justify-content:center">Edit shipment details</button></div></div><div class="section-label">Evidence · ${verified}/${docs.length} verified</div><div class="priority-list">${docs.map(d=>`<div class="priority"><div class="filetype" style="width:29px;height:31px;font-size:8px">${d.type.slice(0,3).toUpperCase()}</div><div style="flex:1"><b>${esc(d.name)}</b><p>${esc(d.note)}</p></div>${statusBadge(d.status)}<button class="iconbtn" data-edit-doc="${d.id}">↗</button></div>`).join('')||'<p class="footnote">No documents recorded yet. Add the evidence required for this consignment.</p>'}</div><button class="btn small" id="addDocForShipment">＋ Add document</button><div class="section-label">Exceptions · ${exc.length}</div>${exc.map(e=>`<div class="priority" data-open-exception="${e.id}"><span class="priority-mark ${e.severity==='Critical'?'red':''}"></span><div><b>${esc(e.title)}</b><p>${esc(e.description)}</p></div>${statusBadge(e.status)}</div>`).join('')||'<p class="footnote">No exceptions logged against this file.</p>'}<button class="btn small" id="addExcForShipment">＋ Log exception</button><div class="section-label">Working notes</div><p style="font-size:12px;line-height:1.65;color:#52645d">${esc(s.notes||'No notes recorded.')}</p><div class="section-label">File history</div><div class="timeline">${(s.history||[]).map(h=>`<div class="timeline-item"><b>${esc(h.text)}</b><small>${new Date(h.at).toLocaleString('en-ZA')}</small></div>`).join('')}</div><div class="section-label">File actions</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" id="duplicateShipment">Duplicate file</button><button class="btn small" id="deleteShipment" style="color:var(--red)">Delete file</button></div><p class="footnote" style="margin-top:15px">${canSubmit?'Evidence complete and no open exceptions. This file is eligible for submission.':'Submission is blocked until every document is verified and all exceptions are resolved.'}</p></div>`;document.querySelector('#detailOverlay').classList.add('open');document.querySelector('#closeDrawer').onclick=closeDrawer;document.querySelector('#detailStatus').onchange=e=>changeStatus(id,e.target.value);document.querySelector('#editShipment').onclick=()=>{closeDrawer();shipmentForm(s)};document.querySelector('#addDocForShipment').onclick=()=>{closeDrawer();documentForm(null,id)};document.querySelector('#addExcForShipment').onclick=()=>{closeDrawer();exceptionForm(null,id)};document.querySelector('#duplicateShipment').onclick=()=>{closeDrawer();let cp=clone(s);cp.id=uid();cp.status='Awaiting documents';cp.history=[{at:now(),text:'Duplicated from '+s.id}];cp.createdAt=now();shipmentForm(cp);document.querySelector('#modalTitle').textContent='Create from duplicate'};document.querySelector('#deleteShipment').onclick=()=>deleteShipment(id);document.querySelectorAll('[data-edit-doc]').forEach(b=>b.onclick=()=>{let did=b.dataset.editDoc;closeDrawer();editDocument(did)});document.querySelectorAll('[data-open-exception]').forEach(b=>b.onclick=()=>{let eid=b.dataset.openException;closeDrawer();editException(eid)})}
function closeDrawer(){document.querySelector('#detailOverlay').classList.remove('open')}
function changeStatus(id,next){let s=db.shipments.find(x=>x.id===id);if(!s)return;let reason='';if(next==='Ready to submit'){let docs=db.documents.filter(d=>d.shipmentId===id);if(!docs.length||docs.some(d=>d.status!=='Verified'))reason='Every supporting document must be verified before this file can be marked ready.';else if(db.exceptions.some(e=>e.shipmentId===id&&e.status!=='Resolved'))reason='Resolve every linked exception before marking this file ready.'}if(next==='Submitted'&&s.status!=='Ready to submit'&&s.status!=='Submitted')reason='Only a ready-to-submit file can be submitted.';if(next==='Released'&&s.status!=='Submitted'&&s.status!=='Released')reason='Customs release can only be recorded after submission.';if(s.status==='Released'&&next!=='Released')reason='A released file is final. Create a new file for a new movement.';if(reason){toast(reason);document.querySelector('#detailStatus').value=s.status;return}commit('Shipment stage changed',()=>{s.status=next;s.updatedAt=now();s.history.unshift({at:now(),text:'Stage changed to '+next});log('Shipment stage updated',`${id} · ${next}`,next==='Released'?'release':'system')});openShipment(id)}
function deleteShipment(id){if(!confirm('Delete this shipment and its linked documents and exceptions? This can be undone with Ctrl+Z.'))return;commit('Shipment and linked records deleted',()=>{db.shipments=db.shipments.filter(s=>s.id!==id);db.documents=db.documents.filter(d=>d.shipmentId!==id);db.exceptions=db.exceptions.filter(e=>e.shipmentId!==id);log('Shipment deleted',id)});closeDrawer()}
function documentForm(d=null,shipmentId=null){let edit=!!d;openModal(edit?'Update document':'Add document',`<form id="docForm" novalidate><div class="field-grid">${field('Linked shipment','shipmentId',d?.shipmentId||shipmentId||db.shipments[0]?.id,'text',db.shipments.map(s=>s.id),true)}${field('Document name','name',d?.name||'','text',null,true)}${field('Document type','type',d?.type||'Invoice','text',['Invoice','Transport','Packing','Permit','Origin','Finance','Other'])}${field('Document state','status',d?.status||'Pending','text',['Pending','Verified','Missing','Rejected'])}${field('Responsible owner','owner',d?.owner||'L. Mokoena','text',['L. Mokoena','T. Naidoo','S. Dlamini','P. Khumalo'])}${field('Required by','due',d?.due||days(2),'date',null,true)}${field('Notes / evidence reference','note',d?.note||'','textarea',null,false,true)}</div></form>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="saveDoc">${edit?'Save document':'Add document'}</button>`);document.querySelector('#saveDoc').onclick=()=>{let f=document.querySelector('#docForm'),v=formValues(f),ok=true;['shipmentId','name','due'].forEach(k=>{if(!v[k]){formError(f,k,'This field is required.');ok=false}});if(!ok)return;let linked=db.shipments.find(x=>x.id===v.shipmentId);if(['Ready to submit','Submitted','Released'].includes(linked?.status)&&v.status!=='Verified'){formError(f,'status','This file has advanced beyond document collection. Move it back to In review before changing the evidence state.');return}commit(edit?'Document updated':'Document added',()=>{if(edit)Object.assign(d,v,{updatedAt:now()});else db.documents.unshift({...v,id:'D-'+(1000+Math.floor(Math.random()*8999)),updatedAt:now()});let s=db.shipments.find(x=>x.id===v.shipmentId);if(s)s.history.unshift({at:now(),text:`Document ${v.name}: ${v.status}`});log(edit?'Document updated':'Document added',`${v.name} · ${v.shipmentId}`,v.status==='Rejected'?'warning':'system')});closeModal()}}
function editDocument(id){let d=db.documents.find(x=>x.id===id);if(d)documentForm(d)}function deleteDocument(id){let d=db.documents.find(x=>x.id===id);if(!d)return;if(!confirm('Remove '+d.name+' from '+d.shipmentId+'?'))return;commit('Document deleted',()=>{db.documents=db.documents.filter(x=>x.id!==id);log('Document removed',d.name+' · '+d.shipmentId)});render()}
function exceptionForm(e=null,shipmentId=null){let edit=!!e;openModal(edit?'Update exception':'Log an exception',`<form id="excForm" novalidate><div class="field-grid">${field('Linked shipment','shipmentId',e?.shipmentId||shipmentId||db.shipments[0]?.id,'text',db.shipments.map(s=>s.id),true)}${field('Issue title','title',e?.title||'','text',null,true)}${field('Severity','severity',e?.severity||'High','text',['Normal','High','Critical'])}${field('Status','status',e?.status||'Open','text',['Open','In progress','Resolved'])}${field('Assigned owner','owner',e?.owner||'L. Mokoena','text',['L. Mokoena','T. Naidoo','S. Dlamini','P. Khumalo'])}${field('Due date','due',e?.due||days(1),'date',null,true)}${field('Description / next action','description',e?.description||'','textarea',null,true,true)}</div></form>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="saveExc">${edit?'Save exception':'Log exception'}</button>`);document.querySelector('#saveExc').onclick=()=>{let f=document.querySelector('#excForm'),v=formValues(f),ok=true;['shipmentId','title','due','description'].forEach(k=>{if(!v[k].trim()){formError(f,k,'Add a clear value so this can be actioned.');ok=false}});if(!ok)return;commit(edit?'Exception updated':'Exception logged',()=>{if(edit)Object.assign(e,v);else db.exceptions.unshift({...v,id:'EX-'+(300+Math.floor(Math.random()*700)),createdAt:now()});log(edit?'Exception updated':'New exception logged',`${v.title} · ${v.shipmentId}`,v.severity==='Critical'?'warning':'system')});closeModal()}}
function editException(id){let e=db.exceptions.find(x=>x.id===id);if(e)exceptionForm(e)}
function bulkDelete(){if(!selected.size)return;if(!confirm(`Delete ${selected.size} selected shipments and linked records?`))return;let ids=[...selected];commit('Bulk delete',()=>{db.shipments=db.shipments.filter(s=>!ids.includes(s.id));db.documents=db.documents.filter(d=>!ids.includes(d.shipmentId));db.exceptions=db.exceptions.filter(e=>!ids.includes(e.shipmentId));log('Bulk delete',ids.length+' shipments removed')});selected.clear()}
function bulkAssign(){let ids=[...selected];openModal('Reassign selected files',`<p style="font-size:12px;color:var(--muted)">${ids.length} shipments will be assigned to one owner.</p><form id="bulkForm">${field('New owner','owner','L. Mokoena','text',['L. Mokoena','T. Naidoo','S. Dlamini','P. Khumalo'])}</form>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="applyBulk">Reassign files</button>`);document.querySelector('#applyBulk').onclick=()=>{let owner=new FormData(document.querySelector('#bulkForm')).get('owner');commit('Bulk reassignment',()=>{db.shipments.filter(s=>ids.includes(s.id)).forEach(s=>{s.owner=owner;s.updatedAt=now()});log('Files reassigned',ids.length+' files · '+owner)});selected.clear();closeModal()}}
function bulkStatus(){let ids=[...selected];openModal('Change stage for selected',`<p class="footnote">Harbor validates each file separately. Ineligible changes will remain unchanged and be reported.</p><form id="bulkForm">${field('New stage','status','In review','text',['Awaiting documents','In review','Ready to submit','Submitted','On hold'])}</form>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="applyBulk">Apply stage</button>`);document.querySelector('#applyBulk').onclick=()=>{let next=new FormData(document.querySelector('#bulkForm')).get('status'),changed=0,blocked=0;commit('Bulk stage update',()=>{ids.forEach(id=>{let s=db.shipments.find(x=>x.id===id),docs=db.documents.filter(d=>d.shipmentId===id),exc=db.exceptions.some(e=>e.shipmentId===id&&e.status!=='Resolved');if(next==='Ready to submit'&&(!docs.length||docs.some(d=>d.status!=='Verified')||exc)){blocked++;return}if(s.status==='Released'||next==='Submitted'&&s.status!=='Ready to submit'){blocked++;return}s.status=next;s.history.unshift({at:now(),text:'Bulk stage change to '+next});changed++});log('Bulk stage update',`${changed} changed · ${blocked} blocked`)});selected.clear();closeModal();if(blocked)toast(`${changed} updated, ${blocked} blocked by clearance rules.`)}}
function saveView(){openModal('Save this view',`<form id="viewForm">${field('View name','name','My working queue','text',null,true)}</form>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="saveViewBtn">Save view</button>`);document.querySelector('#saveViewBtn').onclick=()=>{let name=new FormData(document.querySelector('#viewForm')).get('name').trim();if(!name){toast('Give the view a name first.');return}commit('Saved view created',()=>db.savedViews.push({id:'v-'+Date.now(),name,filter:'all',search,statusFilter,sortKey,sortDir}));closeModal()}}
function exportData(){try{let blob=new Blob([JSON.stringify({...db,exportedAt:now(),app:'Harbor Clearance Desk'},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='harbor-backup-'+days(0)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported. Keep it somewhere safe.')}catch(e){toast('Export failed. Check browser download permissions.')}}
function importData(){openModal('Restore a Harbor backup',`<p style="font-size:12px;line-height:1.6;color:var(--muted)">Import replaces the current workspace. Export your current data first if you may need it. The backup is validated before anything changes.</p><div class="field"><label for="importFile">Harbor JSON backup</label><input id="importFile" type="file" accept="application/json,.json"><span class="error" id="importError"></span></div><label class="checkline" style="margin-top:15px"><input id="confirmImport" type="checkbox"> I understand this replaces the current workspace.</label>`,`<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="restoreBtn">Validate & restore</button>`);document.querySelector('#restoreBtn').onclick=async()=>{let f=document.querySelector('#importFile').files[0],err=document.querySelector('#importError');if(!f){err.textContent='Choose a JSON backup file.';return}if(f.size>15*1024*1024){err.textContent='This file exceeds the 15 MB safety limit.';return}if(!document.querySelector('#confirmImport').checked){err.textContent='Confirm that you understand this replaces the current workspace.';return}try{let parsed=JSON.parse(await f.text());validateState(parsed);if(!confirm(`Restore ${parsed.shipments.length} shipments, ${parsed.documents.length} documents and ${parsed.exceptions.length} exceptions?`))return;let old=clone(db);db=parsed;persist();undoStack.push({label:'Restore backup',before:old});updateCounts();closeModal();render();toast('Backup restored successfully',true)}catch(e){err.textContent=e.message||'Could not read this backup.'}}}
function globalSearch(){openModal('Find anything',`<div class="searchbox" style="margin-bottom:14px"><span>⌕</span><input id="globalSearch" placeholder="Shipment, importer, document, exception…" aria-label="Search all records" autocomplete="off"></div><div id="globalResults" class="priority-list"><p class="footnote">Start typing to search across shipments, documents and exceptions.</p></div><p class="kbdhelp" style="margin-top:15px">↑ Search is local to this workspace. Select a result to open its record.</p>`,'<button class="btn" data-close-modal>Close</button>');let input=document.querySelector('#globalSearch');input.oninput=()=>{let q=input.value.toLowerCase().trim(),out=[];if(q.length){db.shipments.filter(s=>[s.id,s.client,s.goods,s.owner].join(' ').toLowerCase().includes(q)).slice(0,5).forEach(s=>out.push({type:'Shipment',label:s.id+' · '+s.client,sub:s.status,fn:()=>{closeModal();openShipment(s.id)}}));db.documents.filter(d=>[d.id,d.name,d.shipmentId].join(' ').toLowerCase().includes(q)).slice(0,4).forEach(d=>out.push({type:'Document',label:d.name+' · '+d.shipmentId,sub:d.status,fn:()=>{closeModal();setPage('documents')}}));db.exceptions.filter(e=>[e.id,e.title,e.shipmentId].join(' ').toLowerCase().includes(q)).slice(0,4).forEach(e=>out.push({type:'Exception',label:e.title+' · '+e.shipmentId,sub:e.status,fn:()=>{closeModal();editException(e.id)}}))}document.querySelector('#globalResults').innerHTML=out.length?out.map((r,i)=>`<button class="priority" data-result="${i}" style="width:100%;text-align:left;background:white"><div class="activity-dot">⌕</div><div style="flex:1"><b>${esc(r.label)}</b><p>${r.type} · ${esc(r.sub)}</p></div>↗</button>`).join(''):q?'<div class="empty"><strong>No matching records</strong><p>Try a reference number, importer or document name.</p></div>':'<p class="footnote">Start typing to search across shipments, documents and exceptions.</p>';document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>out[Number(b.dataset.result)].fn())};input.focus()}
function resetWorkspace(){if(!confirm('Reset Harbor to its original editable sample workspace? This replaces all current records. Export a backup first if needed.'))return;let before=clone(db);db=clone(seed);db.activity.unshift({id:Date.now(),at:now(),title:'Workspace reset',detail:'Sample data restored',kind:'system'});persist();undoStack.push({label:'Workspace reset',before});updateCounts();setPage('overview');toast('Sample workspace restored',true)}
function duplicateShipment(id){let s=db.shipments.find(x=>x.id===id);if(!s)return;let cp=clone(s);cp.id=uid();cp.status='Awaiting documents';cp.createdAt=now();cp.updatedAt=now();cp.history=[{at:now(),text:'Duplicated from '+s.id}];cp.notes='Copied from '+s.id+'. Confirm all details before proceeding.';commit('Shipment duplicated',()=>{db.shipments.unshift(cp);log('Shipment duplicated',s.id+' → '+cp.id)});closeDrawer();openShipment(cp.id)}
function initEvents(){document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));document.querySelector('#newShipmentBtn').onclick=()=>shipmentForm();document.querySelector('#globalSearchBtn').onclick=globalSearch;document.querySelector('#mobileMenu').onclick=()=>document.querySelector('#sidebar').classList.toggle('open');document.querySelector('#detailOverlay').addEventListener('click',e=>{if(e.target.id==='detailOverlay')closeDrawer()});document.querySelector('#today').textContent=new Intl.DateTimeFormat('en-ZA',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).format(new Date());window.addEventListener('keydown',e=>{let mod=e.ctrlKey||e.metaKey;if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();globalSearch()}else if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}else if(e.key==='Escape'){closeModal();closeDrawer();document.querySelector('#sidebar').classList.remove('open')}else if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();globalSearch()}else if(e.key.toLowerCase()==='n'&&!mod&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();shipmentForm()}});window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{let next=JSON.parse(e.newValue);validateState(next);db=next;render();updateCounts();toast('Workspace refreshed from another tab.')}catch(err){toast('Another tab saved data that could not be read.')}}});window.addEventListener('beforeunload',()=>{if(storageOK)try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}})}
// Delegated shortcuts and actions remain available when page content is redrawn.
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b&&b.closest('#content'))setPage(b.dataset.page)});
// Repair the duplicate action to create a separate stable record, never mutate the source.
const _openShipment=openShipment;
// Replace the duplicate button handler after drawer creation via delegated event.
document.addEventListener('click',e=>{if(e.target.closest('#duplicateShipment')){let id=document.querySelector('#drawer .ref')?.textContent.split(' · ')[0];if(id)duplicateShipment(id)}});
init();initEvents();
})();
</script></body></html>
