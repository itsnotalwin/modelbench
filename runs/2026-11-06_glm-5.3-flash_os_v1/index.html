<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaOS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  /* ============ BASE / THEME ============ */
  :root{
    --desktop:#1A1A2E;
    --taskbar:#16213E;
    --titlebar:#0F3460;
    --titlebar-active:#155092;
    --panel:#1c2444;
    --panel-2:#141b31;
    --accent:#4f8cff;
    --text:#e7eaf6;
    --muted:#9aa3c0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    background:var(--desktop);
    user-select:none;
  }
  button{font-family:inherit;}

  /* ============ WALLPAPER (animated cross-fade navy <-> purple) ============ */
  #wall-a,#wall-b{position:fixed;inset:0;z-index:0;}
  #wall-a{background:linear-gradient(135deg,#1A1A2E 0%,#16213E 55%,#0F3460 100%);}
  #wall-b{
    background:linear-gradient(135deg,#1A1A2E 0%,#251a45 45%,#3b1d5e 100%);
    opacity:0;animation:wallShift 22s ease-in-out infinite;
  }
  @keyframes wallShift{0%,100%{opacity:0;}50%{opacity:1;}}

  /* ============ DESKTOP ICONS ============ */
  #desktop{position:fixed;inset:0 0 48px 0;z-index:1;}
  #icons{
    position:absolute;inset:0;
    display:grid;
    grid-auto-flow:column;
    grid-template-rows:repeat(auto-fill,96px);
    grid-auto-columns:88px;
    justify-content:start;
    align-content:start;
    padding:14px 6px;
  }
  .dicon{
    width:82px;height:92px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    border-radius:8px;cursor:default;padding:4px;text-align:center;
  }
  .dicon:hover{background:rgba(255,255,255,.08);}
  .dicon.sel{background:rgba(79,140,255,.28);outline:1px solid rgba(79,140,255,.55);}
  .dicon .ic{
    width:46px;height:46px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
  }
  .dicon .lbl{
    font-size:11.5px;line-height:1.25;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.9);
    max-width:80px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }

  /* ============ WINDOWS ============ */
  .window{
    position:fixed;
    display:flex;flex-direction:column;
    background:var(--panel-2);
    border:1px solid rgba(255,255,255,.09);
    border-radius:10px;
    box-shadow:0 8px 32px rgba(0,0,0,.5);
    min-width:320px;min-height:200px;
    overflow:hidden;
    animation:winOpen .16s ease-out;
  }
  @keyframes winOpen{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  .window.active{border-color:rgba(255,255,255,.16);}
  .titlebar{
    height:38px;flex:0 0 38px;
    background:var(--titlebar);
    display:flex;align-items:center;justify-content:space-between;
    padding-left:16px;
    user-select:none;
  }
  .window.active .titlebar{background:var(--titlebar-active);}
  .win-title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;letter-spacing:.2px;min-width:0;}
  .win-title i{opacity:.9;}
  .win-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .win-btns{display:flex;height:100%;}
  .wbtn{
    width:42px;height:100%;border:none;background:transparent;color:var(--text);
    font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .wbtn:hover{background:rgba(255,255,255,.14);}
  .wbtn.close:hover{background:#e0344a;color:#fff;}
  .win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--panel-2);}
  .window.maximized{left:0!important;top:0!important;width:100vw!important;height:calc(100vh - 48px)!important;border-radius:0;}
  .window.minimized{display:none;}

  /* resize handles (8 zones, inside the window bounds) */
  .rz{position:absolute;z-index:30;}
  .rz-n{top:0;left:12px;right:12px;height:5px;cursor:ns-resize;}
  .rz-s{bottom:0;left:12px;right:12px;height:6px;cursor:ns-resize;}
  .rz-e{right:0;top:12px;bottom:12px;width:5px;cursor:ew-resize;}
  .rz-w{left:0;top:12px;bottom:12px;width:5px;cursor:ew-resize;}
  .rz-ne{top:0;right:0;width:13px;height:13px;cursor:nesw-resize;}
  .rz-nw{top:0;left:0;width:13px;height:13px;cursor:nwse-resize;}
  .rz-se{bottom:0;right:0;width:15px;height:15px;cursor:nwse-resize;}
  .rz-sw{bottom:0;left:0;width:13px;height:13px;cursor:nesw-resize;}
  .window.maximized .rz{display:none;}

  /* ============ TASKBAR ============ */
  #taskbar{
    position:fixed;left:0;right:0;bottom:0;height:48px;z-index:4000;
    background:var(--taskbar);
    border-top:1px solid rgba(255,255,255,.07);
    display:flex;align-items:center;gap:6px;padding:0 10px;
  }
  #start-btn{
    height:36px;min-width:44px;padding:0 12px;border:none;border-radius:8px;
    background:linear-gradient(135deg,#0F3460,#1b4a86);color:#fff;font-size:16px;cursor:pointer;
    display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;
  }
  #start-btn:hover{filter:brightness(1.2);}
  #start-btn.on{outline:1px solid var(--accent);}
  #task-items{display:flex;gap:6px;flex:1;overflow:hidden;}
  .task-item{
    height:36px;max-width:180px;padding:0 12px;border:none;border-radius:8px;
    background:rgba(255,255,255,.07);color:var(--text);cursor:pointer;
    display:flex;align-items:center;gap:8px;font-size:12px;
  }
  .task-item:hover{background:rgba(255,255,255,.14);}
  .task-item.active{background:rgba(79,140,255,.30);box-shadow:inset 0 -2px 0 var(--accent);}
  .task-item.mini{opacity:.55;}
  .task-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #tray{display:flex;align-items:center;gap:4px;}
  #vol-btn{
    width:36px;height:36px;border:none;border-radius:8px;background:transparent;
    color:var(--text);font-size:14px;cursor:pointer;
  }
  #vol-btn:hover{background:rgba(255,255,255,.1);}
  #clock{
    text-align:right;line-height:1.15;padding:0 8px 0 10px;font-size:12px;color:var(--text);
    min-width:74px;
  }
  #clock .d{font-size:10.5px;color:var(--muted);}
  #vol-pop{
    position:fixed;right:10px;bottom:56px;z-index:4500;width:190px;
    background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:10px;
    box-shadow:0 8px 32px rgba(0,0,0,.5);padding:14px;display:none;
  }
  #vol-pop.open{display:block;}
  #vol-pop label{font-size:11px;color:var(--muted);display:block;margin-bottom:8px;}
  #vol-pop input[type=range]{width:100%;accent-color:var(--accent);}

  /* ============ LAUNCHER ============ */
  #launcher{
    position:fixed;left:50%;transform:translateX(-50%);bottom:58px;z-index:5000;
    width:540px;max-width:94vw;max-height:70vh;
    background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:14px;
    box-shadow:0 8px 32px rgba(0,0,0,.55);
    padding:16px;display:none;flex-direction:column;gap:14px;
  }
  #launcher.open{display:flex;}
  #launcher input{
    width:100%;height:38px;border-radius:9px;border:1px solid rgba(255,255,255,.14);
    background:var(--panel-2);color:var(--text);padding:0 14px;font-size:14px;outline:none;
  }
  #launcher input:focus{border-color:var(--accent);}
  #launcher-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;overflow-y:auto;
  }
  .lapp{
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;
    border-radius:10px;cursor:pointer;text-align:center;
  }
  .lapp:hover{background:rgba(255,255,255,.09);}
  .lapp .ic{
    width:48px;height:48px;border-radius:12px;font-size:23px;color:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.35);
  }
  .lapp .lbl{font-size:12px;}
  .lapp.none{grid-column:1/-1;color:var(--muted);font-size:13px;padding:20px;}

  /* ============ CONTEXT MENU ============ */
  #ctxmenu{
    position:fixed;z-index:6000;min-width:190px;display:none;
    background:var(--panel);border:1px solid rgba(255,255,255,.13);border-radius:9px;
    box-shadow:0 8px 32px rgba(0,0,0,.55);padding:5px;overflow:hidden;
  }
  #ctxmenu .mi{
    padding:9px 14px;border-radius:6px;font-size:13px;cursor:pointer;
    display:flex;align-items:center;gap:10px;
  }
  #ctxmenu .mi:hover{background:var(--accent);color:#fff;}
  #ctxmenu .mi i{width:16px;text-align:center;opacity:.85;}

  /* ============ BOOT ============ */
  #boot{
    position:fixed;inset:0;z-index:9000;background:var(--desktop);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .5s;
  }
  #boot.hide{opacity:0;pointer-events:none;}
  #boot .logo{font-size:34px;font-weight:700;letter-spacing:4px;}
  #boot .logo b{color:var(--accent);}
  #boot .bar{width:200px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;}
  #boot .bar i{display:block;height:100%;width:40%;background:var(--accent);border-radius:4px;animation:bootbar 1.1s ease-in-out infinite;}
  @keyframes bootbar{0%{transform:translateX(-110%);}100%{transform:translateX(320%);}}

  /* ============ APP: CALCULATOR ============ */
  .calc{display:flex;flex-direction:column;height:100%;padding:12px;gap:10px;}
  .calc-screen{
    background:#0d1326;border:1px solid rgba(255,255,255,.09);border-radius:10px;
    padding:10px 14px;text-align:right;min-height:76px;display:flex;flex-direction:column;justify-content:flex-end;
  }
  .calc-expr{font-size:13px;color:var(--muted);min-height:18px;overflow:hidden;white-space:nowrap;}
  .calc-main{font-size:30px;font-weight:600;overflow:hidden;white-space:nowrap;}
  .calc-pad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:8px;}
  .calc-pad button{
    border:none;border-radius:9px;font-size:17px;cursor:pointer;color:var(--text);
    background:#26304f;transition:filter .08s;
  }
  .calc-pad button:hover{filter:brightness(1.25);}
  .calc-pad button:active{filter:brightness(.85);}
  .calc-pad .op{background:#31406b;}
  .calc-pad .fn{background:#223055;}
  .calc-pad .eq{background:var(--accent);color:#fff;font-weight:700;}
  .calc-pad .wide{grid-column:1/-1;}

  /* ============ APP: TERMINAL ============ */
  .term{
    height:100%;display:flex;flex-direction:column;position:relative;
    background:#0a0e1c;font-family:Consolas,"Courier New",monospace;font-size:13.5px;
  }
  .term-out{flex:1;overflow-y:auto;padding:12px 14px 4px;line-height:1.5;user-select:text;}
  .term-out .tline{white-space:pre-wrap;word-break:break-word;}
  .term-out pre{font-family:inherit;line-height:1.25;margin:4px 0;user-select:text;}
  .term-out .p{color:#6fd08f;}
  .term-out .err{color:#ff7b7b;}
  .term-out .dim{color:#8b93b5;}
  .term-line{display:flex;align-items:baseline;padding:4px 14px 12px;cursor:text;}
  .term-line .p{color:#6fd08f;white-space:pre;}
  #term-text{white-space:pre;color:var(--text);}
  .term-cursor{
    display:inline-block;width:8px;height:16px;background:#cfd6f5;vertical-align:text-bottom;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .term-hidden{position:absolute;opacity:0;width:2px;height:2px;border:none;left:0;top:0;}

  /* ============ APP: NOTEPAD ============ */
  .notepad{display:flex;flex-direction:column;height:100%;}
  .np-menu{
    display:flex;gap:2px;padding:4px 8px;background:var(--panel);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .np-menu button{
    border:none;background:transparent;color:var(--text);font-size:12.5px;
    padding:6px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:7px;
  }
  .np-menu button:hover{background:rgba(255,255,255,.1);}
  .np-path{margin-left:auto;font-size:11px;color:var(--muted);align-self:center;padding-right:6px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .notepad textarea{
    flex:1;resize:none;border:none;outline:none;background:var(--panel-2);color:var(--text);
    font-family:Consolas,"Courier New",monospace;font-size:14px;line-height:1.6;padding:14px;
    user-select:text;
  }
  .np-status{
    flex:0 0 26px;display:flex;align-items:center;gap:18px;padding:0 14px;
    background:var(--panel);border-top:1px solid rgba(255,255,255,.08);
    font-size:11.5px;color:var(--muted);
  }

  /* ============ APP: FILES ============ */
  .files{display:flex;flex-direction:column;height:100%;}
  .files-bar{
    display:flex;align-items:center;gap:8px;padding:8px 10px;
    background:var(--panel);border-bottom:1px solid rgba(255,255,255,.08);
  }
  .files-bar button{
    border:none;background:rgba(255,255,255,.08);color:var(--text);width:30px;height:30px;
    border-radius:7px;cursor:pointer;font-size:13px;
  }
  .files-bar button:hover{background:rgba(255,255,255,.16);}
  .files-bar button:disabled{opacity:.35;cursor:default;}
  .files-path{
    flex:1;background:var(--panel-2);border:1px solid rgba(255,255,255,.09);border-radius:7px;
    padding:6px 12px;font-size:12.5px;font-family:Consolas,monospace;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:text;
  }
  .files-grid{
    flex:1;overflow-y:auto;padding:14px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start;
  }
  .files-grid .fitem{
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;
    border-radius:9px;cursor:default;text-align:center;
  }
  .files-grid .fitem:hover{background:rgba(255,255,255,.08);}
  .files-grid .fitem .ic{font-size:34px;}
  .files-grid .fitem .lbl{font-size:11.5px;word-break:break-all;max-width:92px;}
  .files-grid .empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:30px 0;font-size:13px;}
  .files-status{flex:0 0 26px;display:flex;align-items:center;padding:0 14px;background:var(--panel);border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:var(--muted);}

  /* ============ GAMES ============ */
  .game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;min-height:0;background:#0d1122;}
  .game-wrap canvas{
    max-width:100%;max-height:100%;border-radius:8px;
    box-shadow:0 0 0 1px rgba(255,255,255,.1),0 8px 24px rgba(0,0,0,.45);
    background:#0a0e1c;
  }
  .game-hint{font-size:11px;color:var(--muted);text-align:center;padding:0 10px;}
  .game-score{font-size:13px;font-weight:600;color:var(--text);}
  .game-overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(10,14,28,.78);backdrop-filter:blur(2px);
  }
  .game-overlay h2{font-size:26px;letter-spacing:2px;}
  .game-overlay p{font-size:13px;color:var(--muted);}
  .game-overlay button{
    border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;
    padding:10px 24px;border-radius:9px;cursor:pointer;
  }
  .game-overlay button:hover{filter:brightness(1.15);}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#33406b;border-radius:6px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:#465491;border:2px solid transparent;background-clip:content-box;}
</style>
</head>
<body>

<div id="wall-a"></div>
<div id="wall-b"></div>

<div id="desktop"><div id="icons"></div></div>

<div id="taskbar">
  <button id="start-btn"><i class="fa-brands fa-windows"></i> Start</button>
  <div id="task-items"></div>
  <div id="tray">
    <button id="vol-btn" title="Volume"><i class="fa-solid fa-volume-high"></i></button>
    <div id="clock"><div id="clock-time">--:--:--</div><div class="d" id="clock-date"></div></div>
  </div>
</div>

<div id="vol-pop">
  <label><i class="fa-solid fa-volume-high"></i> Volume</label>
  <input type="range" min="0" max="100" value="70">
</div>

<div id="launcher">
  <input id="launcher-search" type="text" placeholder="Search apps..." autocomplete="off">
  <div id="launcher-grid"></div>
</div>

<div id="ctxmenu"></div>

<div id="boot">
  <div class="logo">Nova<b>OS</b></div>
  <div class="bar"><i></i></div>
</div>

<script>
'use strict';
/* =====================================================================
   NovaOS — a browser desktop OS simulation. Vanilla JS, single file.
   ===================================================================== */

var $ = function(s, r){ return (r || document).querySelector(s); };
function el(tag, cls, html){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

/* =====================================================================
   VIRTUAL FILE SYSTEM
   ===================================================================== */
var VFS = {
  type: 'dir',
  children: {
    home: { type:'dir', children: {
      'welcome.txt': { type:'file', content:
        'Welcome to NovaOS!\n\n' +
        'This is a simulated operating system running entirely in your browser.\n\n' +
        'Things to try:\n' +
        '  - Open the Terminal and type "help"\n' +
        '  - Play Snake (careful, it is addictive)\n' +
        '  - Cause chaos in the GTA City Clone and get chased by police\n' +
        '  - Land the plane in Flight Simulator\n\n' +
        'Files you save in the Text Editor appear here in /home.\n' },
      'readme.txt': { type:'file', content:
        'NovaOS v1.0\n' +
        '===========\nKernel: none (it is JavaScript all the way down)\n' +
        'Shell:  novash 1.0\nUser:   kgpuser\n\n' +
        'Tip: the terminal supports cd, ls, cat, calc and cowsay.' },
      notes: { type:'dir', children: {
        'todo.txt': { type:'file', content:
          '- [x] Build a fake OS in one HTML file\n' +
          '- [ ] Beat my high score in Snake\n' +
          '- [ ] Escape the police with 3 stars\n' +
          '- [ ] Land the plane without crashing' }
      }}
    }},
    projects: { type:'dir', children: {
      'ideas.txt': { type:'file', content:
        'Project ideas:\n  1. A browser inside the browser OS (meta!)\n  2. Minesweeper\n  3. Paint app' }
    }},
    etc: { type:'dir', children: {
      'motd.txt': { type:'file', content: 'NovaOS: stay curious. (message of the day)' }
    }}
  }
};

function fsGet(path){
  if (path === '/' || path === '') return VFS;
  var node = VFS, parts = path.split('/').filter(Boolean);
  for (var i = 0; i < parts.length; i++){
    if (!node || node.type !== 'dir' || !node.children[parts[i]]) return null;
    node = node.children[parts[i]];
  }
  return node;
}
function fsResolve(cwd, p){
  if (!p) return cwd;
  var parts = (p.charAt(0) === '/') ? [] : cwd.split('/').filter(Boolean);
  var segs = p.split('/');
  for (var i = 0; i < segs.length; i++){
    var s = segs[i];
    if (!s || s === '.') continue;
    if (s === '..') parts.pop();
    else parts.push(s);
  }
  return '/' + parts.join('/');
}
function fsWriteFile(path, content){
  var parts = path.split('/').filter(Boolean);
  if (!parts.length) return 'cannot write to /';
  var name = parts.pop();
  var parent = fsGet('/' + parts.join('/'));
  if (!parent || parent.type !== 'dir') return 'no such directory: /' + parts.join('/');
  parent.children[name] = { type:'file', content: content };
  return null;
}
function fsMakeDir(path){
  var parts = path.split('/').filter(Boolean);
  if (!parts.length) return 'cannot create /';
  var name = parts.pop();
  var parent = fsGet('/' + parts.join('/'));
  if (!parent || parent.type !== 'dir') return 'no such directory: /' + parts.join('/');
  if (parent.children[name]) return 'already exists: ' + name;
  parent.children[name] = { type:'dir', children:{} };
  return null;
}
function prettyPath(p){
  return (p === '/home' || p.indexOf('/home/') === 0) ? ('~' + p.slice(5)) : p;
}

/* =====================================================================
   WINDOW MANAGER
   ===================================================================== */
var zTop = 100;
var winSeq = 0;
var openWins = new Map();   // id -> rec
var focusedWin = null;

function focusWin(rec){
  if (!rec) return;
  rec.el.style.zIndex = ++zTop;
  openWins.forEach(function(w){ w.el.classList.remove('active'); });
  rec.el.classList.add('active');
  focusedWin = rec;
  openWins.forEach(function(w){
    if (w.taskBtn) w.taskBtn.classList.toggle('active', w === rec && !w.minimized);
  });
  if (rec.onFocus) { try { rec.onFocus(); } catch(e){} }
}

function createWindow(app, opts){
  opts = opts || {};
  var rec = {
    id: 'win' + (++winSeq),
    app: app,
    el: null, body: null, taskBtn: null,
    minimized: false, maximized: false, prevRect: null,
    onClose: null, onKey: null, onFocus: null
  };
  var w = el('div', 'window');
  var W = Math.min(opts.width || 640, window.innerWidth - 40);
  var H = Math.min(opts.height || 460, window.innerHeight - 96);
  w.style.width = W + 'px';
  w.style.height = H + 'px';
  var n = openWins.size;
  w.style.left = clamp(80 + (n * 32) % 240, 6, Math.max(6, window.innerWidth - W - 10)) + 'px';
  w.style.top  = clamp(40 + (n * 28) % 150, 6, Math.max(6, window.innerHeight - H - 60)) + 'px';

  w.innerHTML =
    '<div class="titlebar">' +
      '<div class="win-title"><i class="fa-solid ' + app.icon + '"></i><span>' + esc(app.name) + '</span></div>' +
      '<div class="win-btns">' +
        '<button class="wbtn min" title="Minimize"><i class="fa-solid fa-minus"></i></button>' +
        '<button class="wbtn max" title="Maximize"><i class="fa-regular fa-square"></i></button>' +
        '<button class="wbtn close" title="Close"><i class="fa-solid fa-xmark"></i></button>' +
      '</div>' +
    '</div>' +
    '<div class="win-body"></div>';
  ['n','s','e','w','ne','nw','se','sw'].forEach(function(d){
    var h = el('div', 'rz rz-' + d);
    h.dataset.dir = d;
    w.appendChild(h);
  });

  rec.el = w;
  rec.body = $('.win-body', w);
  if (typeof opts.build === 'function') opts.build(rec);

  /* --- focus on any click --- */
  w.addEventListener('mousedown', function(){ focusWin(rec); });

  /* --- titlebar drag --- */
  var tb = $('.titlebar', w);
  tb.addEventListener('mousedown', function(e){
    if (e.target.closest('.wbtn')) return;
    if (rec.maximized) return;
    e.preventDefault();
    focusWin(rec);
    var r = w.getBoundingClientRect();
    var offX = e.clientX - r.left, offY = e.clientY - r.top;
    function move(ev){
      var nx = clamp(ev.clientX - offX, -r.width + 90, window.innerWidth - 90);
      var ny = clamp(ev.clientY - offY, 0, window.innerHeight - 48 - 40);
      w.style.left = nx + 'px';
      w.style.top = ny + 'px';
    }
    function up(){
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
  tb.addEventListener('dblclick', function(e){
    if (e.target.closest('.wbtn')) return;
    toggleMaximize(rec);
  });

  /* --- window control buttons --- */
  $('.wbtn.min', w).addEventListener('click', function(){ minimizeWin(rec); });
  $('.wbtn.max', w).addEventListener('click', function(){ toggleMaximize(rec); });
  $('.wbtn.close', w).addEventListener('click', function(){ closeWin(rec); });

  /* --- 8-zone resize --- */
  Array.prototype.forEach.call(w.querySelectorAll('.rz'), function(h){
    h.addEventListener('mousedown', function(e){
      if (rec.maximized) return;
      e.preventDefault(); e.stopPropagation();
      focusWin(rec);
      var dir = h.dataset.dir;
      var r = w.getBoundingClientRect();
      var sx = e.clientX, sy = e.clientY;
      var MINW = 320, MINH = 200;
      function move(ev){
        var dx = ev.clientX - sx, dy = ev.clientY - sy;
        var x = r.left, y = r.top, ww = r.width, hh = r.height;
        if (dir.indexOf('e') >= 0) ww = Math.max(MINW, r.width + dx);
        if (dir.indexOf('s') >= 0) hh = Math.max(MINH, r.height + dy);
        if (dir.indexOf('w') >= 0){ ww = Math.max(MINW, r.width - dx); x = r.right - ww; }
        if (dir.indexOf('n') >= 0){
          hh = Math.max(MINH, r.height - dy);
          y = r.bottom - hh;
          if (y < 0){ hh += y; y = 0; }
        }
        w.style.left = x + 'px'; w.style.top = y + 'px';
        w.style.width = ww + 'px'; w.style.height = hh + 'px';
      }
      function up(){
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
      }
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  });

  /* --- taskbar button --- */
  var tb2 = el('button', 'task-item');
  tb2.innerHTML = '<i class="fa-solid ' + app.icon + '"></i><span>' + esc(app.name) + '</span>';
  tb2.addEventListener('click', function(){
    if (rec.minimized){ restoreWin(rec); }
    else if (focusedWin === rec){ minimizeWin(rec); }
    else { focusWin(rec); }
  });
  $('#task-items').appendChild(tb2);
  rec.taskBtn = tb2;

  document.body.appendChild(w);
  openWins.set(rec.id, rec);
  focusWin(rec);
  return rec;
}

function minimizeWin(rec){
  rec.minimized = true;
  rec.el.classList.add('minimized');
  rec.el.classList.remove('active');
  if (rec.taskBtn) rec.taskBtn.classList.add('mini');
  if (focusedWin === rec) focusedWin = null;
  /* focus topmost remaining visible window */
  var best = null, bz = -1;
  openWins.forEach(function(w){
    if (!w.minimized){
      var z = parseInt(w.el.style.zIndex || 0, 10);
      if (z > bz){ bz = z; best = w; }
    }
  });
  if (best) focusWin(best);
}
function restoreWin(rec){
  rec.minimized = false;
  rec.el.classList.remove('minimized');
  if (rec.taskBtn) rec.taskBtn.classList.remove('mini');
  focusWin(rec);
}
function toggleMaximize(rec){
  if (!rec.maximized){
    var r = rec.el.getBoundingClientRect();
    rec.prevRect = { left: r.left, top: r.top, width: r.width, height: r.height };
    rec.maximized = true;
    rec.el.classList.add('maximized');
  } else {
    rec.maximized = false;
    rec.el.classList.remove('maximized');
    if (rec.prevRect){
      rec.el.style.left = rec.prevRect.left + 'px';
      rec.el.style.top = rec.prevRect.top + 'px';
      rec.el.style.width = rec.prevRect.width + 'px';
      rec.el.style.height = rec.prevRect.height + 'px';
    }
  }
}
function closeWin(rec){
  if (rec.onClose){ try { rec.onClose(); } catch(e){} }
  rec.el.remove();
  if (rec.taskBtn) rec.taskBtn.remove();
  openWins.delete(rec.id);
  if (focusedWin === rec){
    focusedWin = null;
    var best = null, bz = -1;
    openWins.forEach(function(w){
      if (!w.minimized){
        var z = parseInt(w.el.style.zIndex || 0, 10);
        if (z > bz){ bz = z; best = w; }
      }
    });
    if (best) focusWin(best);
  }
  if (rec.app._win === rec) rec.app._win = null;
}

/* Global keyboard router: send keys to focused window app */
document.addEventListener('keydown', function(e){
  if (focusedWin && focusedWin.onKey && !focusedWin.minimized){
    focusedWin.onKey(e);
  }
});

/* =====================================================================
   APP REGISTRY
   ===================================================================== */
var APPS = [];
function registerApp(a){ APPS.push(a); return a; }

function openApp(app){
  if (app.single && app._win && openWins.has(app._win.id)){
    if (app._win.minimized) restoreWin(app._win);
    else focusWin(app._win);
    return app._win;
  }
  var rec = createWindow(app, { width: app.width, height: app.height, build: app.build });
  if (app.single) app._win = rec;
  return rec;
}

/* =====================================================================
   SAFE EXPRESSION EVALUATION (used by calculator + terminal calc)
   ===================================================================== */
function safeEval(expr){
  expr = String(expr).trim();
  if (!expr) return null;
  expr = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  if (!/^[0-9+\-*/().%\s]+$/.test(expr)) return null;
  if (/[*/+\-.%]{3,}/.test(expr.replace(/\s+/g,''))) return null;
  try {
    var fn = new Function('"use strict"; return (' + expr + ');');
    var v = fn();
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  } catch (e) { return null; }
}

   APP: CALCULATOR
   ===================================================================== */
registerApp({
  key: 'calculator', name: 'Calculator', icon: 'fa-calculator',
  color: 'linear-gradient(135deg,#f39c12,#e67e22)', single: true,
  width: 300, height: 430,
  build: function(rec){
    var expr = '', cur = '0', err = false;
    var root = el('div', 'calc');
    root.innerHTML =
      '<div class="calc-screen"><div class="calc-expr"></div><div class="calc-main">0</div></div>' +
      '<div class="calc-pad"></div>';
    var exprEl = $('.calc-expr', root), mainEl = $('.calc-main', root), pad = $('.calc-pad', root);
    var buttons = [
      ['C','fn'], ['⌫','fn'], ['%','fn'], ['÷','op'],
      ['7',''],['8',''],['9',''],['×','op'],
      ['4',''],['5',''],['6',''],['−','op'],
      ['1',''],['2',''],['3',''],['+','op'],
      ['±','fn'], ['0',''], ['.',''], ['√','fn'],
      ['=','eq wide']
    ];
    buttons.forEach(function(b){
      var btn = el('button', b[1], esc(b[0]));
      btn.addEventListener('click', function(){ press(b[0]); });
      pad.appendChild(btn);
    });

    function render(){
      if (err){
        mainEl.textContent = 'Error';
        exprEl.textContent = expr;
        return;
      }
      mainEl.textContent = cur === '' ? '0' : cur;
      exprEl.textContent = expr;
    }
    function clearErr(){ if (err){ err = false; expr = ''; cur = '0'; } }
    function press(k){
      clearErr();
      if (k === 'C'){ expr = ''; cur = '0'; }
      else if (k === '⌫'){ cur = cur.length > 1 ? cur.slice(0, -1) : '0'; }
      else if (k === '±'){
        if (cur !== '0' && cur !== '') cur = cur.charAt(0) === '-' ? cur.slice(1) : '-' + cur;
      }
      else if (k === '%'){
        var p = parseFloat(cur);
        if (!isNaN(p)) cur = String(p / 100);
      }
      else if (k === '√'){
        var s = parseFloat(cur);
        if (isNaN(s) || s < 0){ err = true; }
        else cur = String(Math.round(Math.sqrt(s) * 1e10) / 1e10);
      }
      else if (k === '+' || k === '−' || k === '×' || k === '÷'){
        if (cur === '' && expr === '') return;
        if (cur === '' && /[+−×÷]$/.test(expr)){
          expr = expr.slice(0, -1) + k;      /* replace trailing operator */
        } else {
          expr += cur + k;
          cur = '';
        }
      }
      else if (k === '='){
        var full = expr + (cur === '' ? '' : cur);
        if (!full) return;
        var v = safeEval(full);
        expr = full + ' =';
        if (v === null){ err = true; cur = ''; }
        else { cur = String(Math.round(v * 1e10) / 1e10); expr = full + ' ='; }
      }
      else if (k === '.'){
        if (cur.indexOf('.') < 0) cur = (cur === '' || cur === '-') ? cur + '0.' : cur + '.';
      }
      else if (/^[0-9]$/.test(k)){
        if (cur === '0') cur = k; else if (cur.length < 15) cur += k;
      }
      render();
    }
    rec.onKey = function(e){
      var k = e.key;
      if (/^[0-9]$/.test(k)) { press(k); e.preventDefault(); }
      else if (k === '.' || k === ',') press('.');
      else if (k === '+') press('+');
      else if (k === '-') press('−');
      else if (k === '*') press('×');
      else if (k === '/') press('÷');
      else if (k === 'Enter' || k === '=') press('=');
      else if (k === 'Backspace') press('⌫');
      else if (k === 'Escape') press('C');
      else if (k === '%') press('%');
      else if (k === 's' || k === 'S') press('√');
      else if (k === 'F9') press('±');
      else return;
      e.preventDefault();
    };
    rec.body.appendChild(root);
    render();
  }
});

   APP: TERMINAL
   ===================================================================== */
registerApp({
  key: 'terminal', name: 'Terminal', icon: 'fa-terminal',
  color: 'linear-gradient(135deg,#2c3e50,#0a0e1c)', single: true,
  width: 660, height: 430,
  build: function(rec){
    var cwd = '/home';
    var history = [], histIdx = 0;
    var root = el('div', 'term');
    root.innerHTML =
      '<div class="term-out"></div>' +
      '<div class="term-line">' +
        '<span class="p"></span>' +
        '<span id="term-text"></span>' +
        '<span class="term-cursor"></span>' +
        '<input class="term-hidden" autocomplete="off" autocapitalize="off" spellcheck="false">' +
      '</div>';
    var out = $('.term-out', root);
    var promptEl = $('.term-line .p', root);
    var mirror = $('#term-text', root);
    var input = $('.term-hidden', root);

    function promptText(){ return 'kgpuser@nova:' + prettyPath(cwd) + '$ '; }
    function updatePrompt(){ promptEl.textContent = promptText(); }
    function print(text, cls, asPre){
      if (asPre){
        var pre = el('pre', cls || null);
        pre.textContent = text;
        out.appendChild(pre);
      } else {
        var d = el('div', 'tline' + (cls ? ' ' + cls : ''));
        d.textContent = text;
        out.appendChild(d);
      }
      out.scrollTop = out.scrollHeight;
    }
    function printHTML(html){
      var d = el('div', 'tline');
      d.innerHTML = html;
      out.appendChild(d);
      out.scrollTop = out.scrollHeight;
    }

    function cowsay(text){
      text = String(text).slice(0, 120) || 'moo';
      var w = text.length;
      return ' ' + '_'.repeat(w + 2) + '\n' +
             '< ' + text + ' >\n' +
             ' ' + '-'.repeat(w + 2) + '\n' +
             '        \\   ^__^\n' +
             '         \\  (oo)\\_______\n' +
             '            (__)\\       )\\/\\\n' +
             '                ||----w |\n' +
             '                ||     ||';
    }

    function run(raw){
      print(promptText() + raw, 'dim');
      var line = raw.trim();
      if (!line) return;
      var parts = line.split(/\s+/);
      var cmd = parts[0].toLowerCase();
      var rest = line.slice(parts[0].length).trim();

      switch (cmd){
        case 'help':
          print('Available commands:', 'p');
          ['  help          - show this help',
           '  ls [path]     - list directory contents',
           '  cd <path>     - change directory',
           '  pwd           - print working directory',
           '  cat <file>    - print file contents',
           '  echo [text]   - print text',
           '  date          - show current date & time',
           '  whoami        - current user',
           '  calc [expr]   - evaluate a math expression',
           '  cowsay [text] - the cow speaks',
           '  clear         - clear the screen'].forEach(function(l){ print(l); });
          break;
        case 'ls': {
          var target = fsResolve(cwd, rest || '');
          var node = fsGet(target);
          if (!node){ print('ls: no such file or directory: ' + rest, 'err'); break; }
          if (node.type === 'file'){ print(parts[parts.length-1] || target); break; }
          var names = Object.keys(node.children).sort();
          if (!names.length){ print('(empty)', 'dim'); break; }
          names.forEach(function(nm){
            var c = node.children[nm];
            printHTML(c.type === 'dir'
              ? '<span style="color:#6fa8ff;font-weight:600">' + esc(nm) + '/</span>'
              : esc(nm));
          });
          break;
        }
        case 'cd': {
          if (!rest){ cwd = '/home'; updatePrompt(); break; }
          var t2 = fsResolve(cwd, rest);
          var n2 = fsGet(t2);
          if (!n2){ print('cd: no such directory: ' + rest, 'err'); break; }
          if (n2.type !== 'dir'){ print('cd: not a directory: ' + rest, 'err'); break; }
          cwd = t2;
          updatePrompt();
          break;
        }
        case 'pwd': print(cwd); break;
        case 'cat': {
          if (!rest){ print('cat: missing file operand', 'err'); break; }
          var f = fsGet(fsResolve(cwd, rest));
          if (!f){ print('cat: no such file: ' + rest, 'err'); break; }
          if (f.type === 'dir'){ print('cat: ' + rest + ' is a directory', 'err'); break; }
          print(f.content || '(empty file)');
          break;
        }
        case 'echo': print(rest); break;
        case 'date': print(new Date().toString()); break;
        case 'whoami': print('kgpuser'); break;
        case 'clear': out.innerHTML = ''; break;
        case 'calc': {
          if (!rest){ print('calc: usage: calc <expression>   e.g. calc 2*(3+4)', 'err'); break; }
          var v = safeEval(rest);
          if (v === null) print('calc: invalid expression: ' + rest, 'err');
          else print('= ' + v, 'p');
          break;
        }
        case 'cowsay': print(cowsay(rest), null, true); break;
        case 'mkdir': {
          if (!rest){ print('mkdir: missing operand', 'err'); break; }
          var e1 = fsMakeDir(fsResolve(cwd, rest));
          if (e1) print('mkdir: ' + e1, 'err');
          else print('created directory ' + rest, 'dim');
          break;
        }
        default:
          print('novash: command not found: ' + cmd + '  (try \'help\')', 'err');
      }
    }

    input.addEventListener('input', function(){ mirror.textContent = input.value; });
    input.addEventListener('keydown', function(e){
      e.stopPropagation();
      if (e.key === 'Enter'){
        var v = input.value;
        input.value = ''; mirror.textContent = '';
        if (v.trim()){ history.push(v); histIdx = history.length; }
        run(v);
        out.scrollTop = out.scrollHeight;
      } else if (e.key === 'ArrowUp'){
        e.preventDefault();
        if (history.length){
          histIdx = Math.max(0, histIdx - 1);
          input.value = history[histIdx] || '';
          mirror.textContent = input.value;
        }
      } else if (e.key === 'ArrowDown'){
        e.preventDefault();
        if (history.length){
          histIdx = Math.min(history.length, histIdx + 1);
          input.value = history[histIdx] || '';
          mirror.textContent = input.value;
        }
      }
    });
    root.addEventListener('mousedown', function(){ setTimeout(function(){ input.focus(); }, 0); });
    rec.onFocus = function(){ input.focus(); };

    rec.body.appendChild(root);
    updatePrompt();
    print('NovaOS novash 1.0 — type \'help\' for a list of commands.', 'dim');
    var motd = fsGet('/etc/motd.txt');
    if (motd) print(motd.content, 'dim');
    print('');
    setTimeout(function(){ input.focus(); }, 50);
  }
});

      ta.value = '';

      ta.focus();
    }

      var name = prompt('Save file as (written to /home and downloaded):', filePath ? filePath.split('/').pop() : 'untitled.txt');
      if (name === null) return;
      name = (name.trim() || 'untitled.txt').replace(/[\\/:*?"<>|]/g, '_');
      if (!/\.txt$/i.test(name)) name += '.txt';
      var path = fsResolve('/home', name);
      var err = fsWriteFile(path, ta.value);
      setPath(err ? null : path);
      rec.el.querySelector('.win-title span').textContent = name + ' — Text Editor';
      renderDesktopIcons();
      /* download */
      var blob = new Blob([ta.value], { type: 'text/plain' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    }
    /* File > Open : real file picker */
    var fileInput = el('input');
    fileInput.type = 'file';
    fileInput.accept = '.txt,.md,.json,.js,.css,.html,text/plain';
    fileInput.style.display = 'none';
    fileInput.addEventListener('change', function(){
      var f = fileInput.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function(){
        ta.value = String(reader.result);
        setPath(null);
        rec.el.querySelector('.win-title span').textContent = f.name + ' — Text Editor';
        updateStatus();
      };
      reader.readAsText(f);
      fileInput.value = '';
    });
    document.body.appendChild(fileInput);

    root.querySelector('[data-act=new]').addEventListener('click', doNew);
    root.querySelector('[data-act=open]').addEventListener('click', function(){ fileInput.click(); });
    root.querySelector('[data-act=save]').addEventListener('click', doSave);

    rec.onKey = function(e){
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); doSave(); }
    };

    /* external open (Files app / desktop icon) */
    rec.openVFile = function(path){
      var node = fsGet(path);
      if (!node || node.type !== 'file') return;
      ta.value = node.content || '';
      setPath(path);
      rec.el.querySelector('.win-title span').textContent = path.split('/').pop() + ' — Text Editor';
      updateStatus();
    };
    rec.body.appendChild(root);
    updateStatus();
    setTimeout(function(){ ta.focus(); }, 50);
  }
});

registerApp({
  key: 'files', name: 'Files', icon: 'fa-folder-open',
  color: 'linear-gradient(135deg,#f1c40f,#d4a017)', single: true,
  width: 620, height: 430,
  build: function(rec){
    var cwd = '/home';
    var root = el('div', 'files');
    root.innerHTML =
      '<div class="files-bar">' +
        '<button class="f-up" title="Up"><i class="fa-solid fa-arrow-up"></i></button>' +
        '<button class="f-home" title="Home"><i class="fa-solid fa-house"></i></button>' +
        '<div class="files-path"></div>' +
        '<button class="f-newdir" title="New folder"><i class="fa-solid fa-folder-plus"></i></button>' +
      '</div>' +
      '<div class="files-grid"></div>' +
      '<div class="files-status"></div>';
    var grid = $('.files-grid', root), pathEl = $('.files-path', root), statusEl = $('.files-status', root);

    function render(){
      pathEl.textContent = prettyPath(cwd) + (cwd === '/' ? '' : '  —  ' + cwd);
      var node = fsGet(cwd);
      grid.innerHTML = '';
      if (!node || node.type !== 'dir'){ cwd = '/home'; render(); return; }
      var names = Object.keys(node.children).sort(function(a, b){
        var da = node.children[a].type === 'dir', db = node.children[b].type === 'dir';
        if (da !== db) return da ? -1 : 1;
        return a.localeCompare(b);
      });
      if (!names.length) grid.appendChild(el('div', 'empty', 'This folder is empty'));
      names.forEach(function(nm){
        var c = node.children[nm];
        var isDir = c.type === 'dir';
        var item = el('div', 'fitem');
        item.innerHTML =
          '<div class="ic" style="color:' + (isDir ? '#f1c40f' : '#7fb2ff') + '">' +
            '<i class="fa-solid ' + (isDir ? 'fa-folder' : 'fa-file-lines') + '"></i></div>' +
          '<div class="lbl">' + esc(nm) + '</div>';
        item.addEventListener('dblclick', function(){
          var childPath = (cwd === '/' ? '' : cwd) + '/' + nm;
          if (isDir){ cwd = childPath; render(); }
          else if (/\.txt$|\.md$|\.json$/i.test(nm)){
            var np = openApp(getApp('notepad'));
            np.openVFile(childPath);
          } else {
            var np2 = openApp(getApp('notepad'));
            np2.openVFile(childPath);
          }
        });
        grid.appendChild(item);
      });
      statusEl.textContent = names.length + ' item' + (names.length === 1 ? '' : 's');
    }
    $('.f-up', root).addEventListener('click', function(){
      if (cwd !== '/'){ cwd = fsResolve(cwd, '..'); render(); }
    });
    $('.f-home', root).addEventListener('click', function(){ cwd = '/home'; render(); });
    $('.f-newdir', root).addEventListener('click', function(){
      var nm = prompt('New folder name:', 'New Folder');
      if (nm === null) return;
      nm = nm.trim();
      if (!nm) return;
      var err = fsMakeDir((cwd === '/' ? '' : cwd) + '/' + nm);
      if (err) alert(err);
      render();
    });
    rec.refresh = render;
    rec.onFocus = render;   /* pick up files saved by the Text Editor */
    rec.body.appendChild(root);
    render();
  }
});

/* =====================================================================
   APP: SNAKE
   ===================================================================== */
registerApp({
  key: 'snake', name: 'Snake', icon: 'fa-staff-snake',
  color: 'linear-gradient(135deg,#27ae60,#1e8449)', single: true,
  width: 500, height: 560,
  build: function(rec){
    var root = el('div', 'game-wrap');
    root.innerHTML =
      '<div class="game-score">Score: <span class="sc">0</span> &nbsp;·&nbsp; Best: <span class="bs">0</span></div>' +
      '<canvas width="440" height="440"></canvas>' +
      '<div class="game-hint">Arrow keys / WASD to steer</div>';
    rec.body.appendChild(root);
    var cv = $('canvas', root), ctx = cv.getContext('2d');
    var scEl = $('.sc', root), bsEl = $('.bs', root);
    var CELLS = 22, CELL = 20;
    var snake, dir, pendingDir, apple, score, best = 0, alive, timer = null;

    function overlay(show, msg, sub){
      var old = root.querySelector('.game-overlay');
      if (old) old.remove();
      if (!show) return;
      var ov = el('div', 'game-overlay');
      ov.innerHTML = '<h2>' + esc(msg || 'Game Over') + '</h2><p>' + esc(sub || '') + '</p><button>Restart</button>';
      ov.querySelector('button').addEventListener('click', function(e){ e.stopPropagation(); reset(); });
      root.appendChild(ov);
    }
    function placeApple(){
      var ok = false;
      while (!ok){
        apple = { x: Math.floor(Math.random()*CELLS), y: Math.floor(Math.random()*CELLS) };
        ok = !snake.some(function(s){ return s.x === apple.x && s.y === apple.y; });
      }
    }
    function reset(){
      snake = [{x:10,y:11},{x:9,y:11},{x:8,y:11}];
      dir = {x:1,y:0}; pendingDir = null;
      score = 0; alive = true;
      scEl.textContent = '0';
      placeApple();
      overlay(false);
    }
    function step(){
      if (!alive) return;
      if (focusedWin !== rec || rec.minimized) return;  /* pause when unfocused */
      if (pendingDir){ dir = pendingDir; pendingDir = null; }
      var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS ||
          snake.some(function(s){ return s.x === head.x && s.y === head.y; })){
        alive = false;
        best = Math.max(best, score);
        bsEl.textContent = String(best);
        overlay(true, 'Game Over', 'Score: ' + score);
        return;
      }
      snake.unshift(head);
      if (head.x === apple.x && head.y === apple.y){
        score++;
        scEl.textContent = String(score);
        placeApple();
      } else {
        snake.pop();
      }
    }
    function draw(){
      ctx.fillStyle = '#0a0e1c';
      ctx.fillRect(0, 0, cv.width, cv.height);
      /* subtle grid */
      ctx.strokeStyle = 'rgba(255,255,255,.03)';
      ctx.lineWidth = 1;
      for (var i = 1; i < CELLS; i++){
        ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, cv.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(cv.width, i*CELL); ctx.stroke();
      }
      /* apple */
      if (apple){
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(apple.x*CELL + CELL/2, apple.y*CELL + CELL/2, CELL*0.36, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(apple.x*CELL + CELL/2 - 1, apple.y*CELL + 2, 2, 5);
      }
      /* snake */
      snake.forEach(function(s, i){
        var t = 1 - i / (snake.length + 4);
        ctx.fillStyle = i === 0 ? '#7bed9f' : 'rgba(46,204,113,' + Math.max(0.35, t) + ')';
        var pad = i === 0 ? 1 : 2;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2, 5);
        else ctx.rect(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2);
        ctx.fill();
      });
      /* eyes on head */
      if (snake && snake.length){
        var h = snake[0];
        ctx.fillStyle = '#0a0e1c';
        var cx = h.x*CELL + CELL/2, cy = h.y*CELL + CELL/2;
        var ex = dir.x*3.4, ey = dir.y*3.4;
        ctx.beginPath(); ctx.arc(cx + ex - dir.y*3, cy + ey - dir.x*3, 1.7, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + ex + dir.y*3, cy + ey + dir.x*3, 1.7, 0, 7); ctx.fill();
      }
    }
    rec.onKey = function(e){
      var k = e.key;
      var nd = null;
      if (k === 'ArrowUp' || k === 'w' || k === 'W') nd = {x:0,y:-1};
      else if (k === 'ArrowDown' || k === 's' || k === 'S') nd = {x:0,y:1};
      else if (k === 'ArrowLeft' || k === 'a' || k === 'A') nd = {x:-1,y:0};
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') nd = {x:1,y:0};
      if (nd){
        e.preventDefault();
        if (!(nd.x === -dir.x && nd.y === -dir.y)) pendingDir = nd;
      }
    };
    reset();
    draw();
    timer = setInterval(function(){ step(); draw(); }, 110);
    rec.onClose = function(){ clearInterval(timer); };
  }
});

/* =====================================================================
   APP: GTA CITY CLONE
   ===================================================================== */
registerApp({
  key: 'gta', name: 'GTA City Clone', icon: 'fa-car-side',
  color: 'linear-gradient(135deg,#8e44ad,#5b2c6f)', single: true,
  width: 780, height: 580,
  build: function(rec){
    var root = el('div', 'game-wrap');
    root.innerHTML =
      '<canvas width="720" height="470"></canvas>' +
      '<div class="game-hint">WASD to drive · speed into the blue POLICE ZONE to earn wanted stars — the cops WILL chase you. Buildings are solid.</div>';
    rec.body.appendChild(root);
    var cv = $('canvas', root), ctx = cv.getContext('2d');

    var P = 120, ROAD = 30, COLS = 9, ROWS = 6;
    var WORLD_W = COLS * P + ROAD, WORLD_H = ROWS * P + ROAD;
    var BLOCK = P - ROAD;
    var keys = {}, closed = false;

    /* ---- build the city ---- */
    var buildings = [], parks = [], zone = null;
    var palette = ['#2b3a55','#34435f','#3d3350','#263850','#453a5e','#31405c'];
    var zoneCandidate = null;
    for (var cy = 0; cy < ROWS; cy++){
      for (var cx = 0; cx < COLS; cx++){
        var bx = cx * P + ROAD, by = cy * P + ROAD;
        if (Math.random() < 0.16){
          parks.push({ x: bx, y: by, w: BLOCK, h: BLOCK });
          var ccx = Math.floor(COLS/2), ccy = Math.floor(ROWS/2);
          if (!zoneCandidate || (Math.abs(cx-ccx)+Math.abs(cy-ccy)) < zoneCandidate.d){
            zoneCandidate = { d: Math.abs(cx-ccx)+Math.abs(cy-ccy), x: bx, y: by };
          }
        } else if (Math.random() < 0.5){
          buildings.push({ x: bx+12, y: by+12, w: BLOCK-24, h: BLOCK-24, c: palette[(Math.random()*palette.length)|0] });
        } else {
          if (Math.random() < 0.5){
            buildings.push({ x: bx+12, y: by+10, w: BLOCK-24, h: (BLOCK-30)/2, c: palette[(Math.random()*palette.length)|0] });
            buildings.push({ x: bx+12, y: by+BLOCK/2+5, w: BLOCK-24, h: (BLOCK-30)/2, c: palette[(Math.random()*palette.length)|0] });
          } else {
            buildings.push({ x: bx+10, y: by+12, w: (BLOCK-30)/2, h: BLOCK-24, c: palette[(Math.random()*palette.length)|0] });
            buildings.push({ x: bx+BLOCK/2+5, y: by+12, w: (BLOCK-30)/2, h: BLOCK-24, c: palette[(Math.random()*palette.length)|0] });
          }
        }
      }
    }
    if (zoneCandidate){ zone = { x: zoneCandidate.x, y: zoneCandidate.y, w: BLOCK, h: BLOCK }; }
    else {
      var pc = Math.floor(COLS/2), pr = Math.floor(ROWS/2);
      zone = { x: pc*P+ROAD, y: pr*P+ROAD, w: BLOCK, h: BLOCK };
      parks.push({ x: zone.x, y: zone.y, w: BLOCK, h: BLOCK });
    }

    /* ---- static city layer (offscreen) ---- */
    var cityCv = document.createElement('canvas');
    cityCv.width = WORLD_W; cityCv.height = WORLD_H;
    var cctx = cityCv.getContext('2d');
    cctx.fillStyle = '#20242e';          /* asphalt */
    cctx.fillRect(0, 0, WORLD_W, WORLD_H);
    /* park grass */
    parks.forEach(function(p){
      cctx.fillStyle = '#2c4a38';
      cctx.fillRect(p.x, p.y, p.w, p.h);
      cctx.fillStyle = 'rgba(0,0,0,.15)';
      for (var i = 0; i < 6; i++){
        cctx.beginPath();
        cctx.arc(p.x + 12 + Math.random()*(p.w-24), p.y + 12 + Math.random()*(p.h-24), 5, 0, 7);
        cctx.fill();
      }
    });
    /* road markings */
    cctx.strokeStyle = 'rgba(240,220,80,.45)';
    cctx.lineWidth = 2;
    cctx.setLineDash([12, 14]);
    for (var i = 0; i <= COLS; i++){
      cctx.beginPath(); cctx.moveTo(i*P + ROAD/2, 0); cctx.lineTo(i*P + ROAD/2, WORLD_H); cctx.stroke();
    }
    for (var j = 0; j <= ROWS; j++){
      cctx.beginPath(); cctx.moveTo(0, j*P + ROAD/2); cctx.lineTo(WORLD_W, j*P + ROAD/2); cctx.stroke();
    }
    cctx.setLineDash([]);
    /* buildings */
    buildings.forEach(function(b){
      cctx.fillStyle = b.c;
      cctx.fillRect(b.x, b.y, b.w, b.h);
      cctx.fillStyle = 'rgba(0,0,0,.28)';
      cctx.fillRect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);
      cctx.fillStyle = 'rgba(255,255,220,.16)';
      for (var wx = b.x + 10; wx < b.x + b.w - 8; wx += 12){
        for (var wy = b.y + 10; wy < b.y + b.h - 8; wy += 12){
          if (Math.random() < 0.6) cctx.fillRect(wx, wy, 5, 5);
        }
      }
    });

    /* ---- ambient traffic ---- */
    var traffic = [];
    for (var t = 0; t < 6; t++){
      var horiz = Math.random() < 0.5;
      traffic.push({
        horiz: horiz,
        lane: horiz ? (1 + ((Math.random()*(ROWS-1))|0)) * P + (Math.random()<.5 ? 8 : ROAD-8)
                    : (1 + ((Math.random()*(COLS-1))|0)) * P + (Math.random()<.5 ? 8 : ROAD-8),
        pos: Math.random() * (horiz ? WORLD_W : WORLD_H),
        dir: Math.random() < 0.5 ? 1 : -1,
        speed: 70 + Math.random()*40,
        c: ['#c8c8d0','#5b7fbf','#bf5b5b','#c9b45b','#6fbf73'][(Math.random()*5)|0]
      });
    }

    /* ---- game state ---- */
    var player = { x: 4*P + ROAD/2, y: 3*P + ROAD/2, angle: -Math.PI/2, speed: 0 };
    var police = null, wanted = 0, wantedTimer = 0, busted = 0, starTimer = 0;

    function onKeyDown(e){
      if (focusedWin !== rec) return;   /* never steal keys from other apps */
      var k = e.key.toLowerCase();
      if ('wasd'.indexOf(k) >= 0){ keys[k] = true; e.preventDefault(); }
    }
    function onKeyUp(e){ keys[e.key.toLowerCase()] = false; }
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);

    function circleHitsBuilding(x, y, r){
      for (var i = 0; i < buildings.length; i++){
        var b = buildings[i];
        var nx = clamp(x, b.x, b.x + b.w), ny = clamp(y, b.y, b.y + b.h);
        var dx = x - nx, dy = y - ny;
        if (dx*dx + dy*dy < r*r) return true;
      }
      return false;
    }
    function inRect(x, y, r){
      return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
    }
    function drawCar(x, y, angle, body, isPlayer){
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = 'rgba(0,0,0,.4)';
      ctx.fillRect(-11, -8, 24, 18);
      ctx.fillStyle = body;
      ctx.fillRect(-12, -9, 24, 18);
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.fillRect(2, -6, 4, 12);            /* windshield = direction indicator */
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.fillRect(-9, -6, 3, 12);
      if (isPlayer){
        ctx.fillStyle = '#e8e8f0';
        ctx.fillRect(-2, -9, 5, 18);
      }
      ctx.restore();
    }

    var last = performance.now();
    function loop(){
      if (closed) return;
      var now = performance.now();
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      /* keeps painting when unfocused; input is gated in onKeyDown instead */

      /* --- update player --- */
      if (busted > 0){
        busted -= dt;
        if (busted <= 0){
          player.x = 4*P + ROAD/2; player.y = 3*P + ROAD/2; player.angle = -Math.PI/2; player.speed = 0;
          wanted = 0; police = null;
        }
      } else {
        if (keys.w) player.speed += 300 * dt;
        if (keys.s) player.speed -= 340 * dt;
        if (!keys.w && !keys.s) player.speed *= Math.exp(-1.4 * dt);
        player.speed = clamp(player.speed, -130, 250);
        var turn = 0;
        if (keys.a) turn -= 1;
        if (keys.d) turn += 1;
        player.angle += turn * 2.7 * dt * clamp(Math.abs(player.speed)/130, 0, 1) * (player.speed < 0 ? -1 : 1);
        var nx2 = player.x + Math.cos(player.angle) * player.speed * dt;
        var ny2 = player.y + Math.sin(player.angle) * player.speed * dt;
        if (nx2 < 12 || ny2 < 12 || nx2 > WORLD_W - 12 || ny2 > WORLD_H - 12 || circleHitsBuilding(nx2, ny2, 10)){
          player.speed *= -0.3;
        } else {
          player.x = nx2; player.y = ny2;
        }

        /* --- wanted system --- */
        if (inRect(player.x, player.y, zone)){
          wantedTimer += dt;
          if (wantedTimer > 1.1){ wantedTimer = 0; wanted = Math.min(3, wanted + 1); }
        } else {
          wantedTimer = Math.max(0, wantedTimer - dt * 0.5);
          starTimer += dt;
          if (starTimer > 4 && wanted > 0 && (!police || Math.hypot(police.x - player.x, police.y - player.y) > 400)){
            starTimer = 0; wanted--;
          }
        }
        if (wanted > 0 && !police){
          police = { x: zone.x + zone.w/2, y: zone.y + zone.h/2, angle: 0 };
        }
        /* --- police chase --- */
        if (police){
          var ta = Math.atan2(player.y - police.y, player.x - police.x);
          var da = ((ta - police.angle + Math.PI*3) % (Math.PI*2)) - Math.PI;
          police.angle += clamp(da, -2.6*dt, 2.6*dt);
          var pv = 150 + wanted * 22;
          var px2 = police.x + Math.cos(police.angle) * pv * dt;
          var py2 = police.y + Math.sin(police.angle) * pv * dt;
          if (!circleHitsBuilding(px2, py2, 10) && px2 > 12 && py2 > 12 && px2 < WORLD_W-12 && py2 < WORLD_H-12){
            police.x = px2; police.y = py2;
          } else {
            police.angle += 1.8 * dt;   /* slide along walls */
          }
          if (Math.hypot(police.x - player.x, police.y - player.y) < 22){
            busted = 1.8;
          }
        }
      }

      /* --- ambient traffic --- */
      traffic.forEach(function(c){
        c.pos += c.dir * c.speed * dt;
        var limit = c.horiz ? WORLD_W : WORLD_H;
        if (c.pos > limit) c.pos = 0;
        if (c.pos < 0) c.pos = limit;
      });

      /* --- camera --- */
      var camX = clamp(player.x - cv.width/2, 0, Math.max(0, WORLD_W - cv.width));
      var camY = clamp(player.y - cv.height/2, 0, Math.max(0, WORLD_H - cv.height));

      /* --- draw --- */
      ctx.fillStyle = '#15181f';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.save();
      ctx.translate(-camX, -camY);

      ctx.drawImage(cityCv, 0, 0);

      /* police zone (pulsing, drawn on top of the city layer) */
      var pulse = 0.25 + 0.15 * Math.sin(now / 300);
      ctx.fillStyle = 'rgba(60,120,255,' + pulse + ')';
      ctx.fillRect(zone.x, zone.y, zone.w, zone.h);
      ctx.strokeStyle = 'rgba(90,160,255,.8)';
      ctx.lineWidth = 2;
      ctx.strokeRect(zone.x, zone.y, zone.w, zone.h);
      ctx.fillStyle = 'rgba(200,225,255,.85)';
      ctx.font = 'bold 13px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('POLICE ZONE', zone.x + zone.w/2, zone.y + zone.h/2);

      traffic.forEach(function(c){
        if (c.horiz) drawCar(c.pos, c.lane, c.dir > 0 ? 0 : Math.PI, c.c, false);
        else drawCar(c.lane, c.pos, c.dir > 0 ? Math.PI/2 : -Math.PI/2, c.c, false);
      });
      if (police && busted <= 0){
        drawCar(police.x, police.y, police.angle, '#2f6fd6', false);
        /* flashing light */
        var fl = Math.floor(now / 200) % 2 === 0;
        ctx.save();
        ctx.translate(police.x, police.y);
        ctx.rotate(police.angle);
        ctx.fillStyle = fl ? '#ff4040' : '#4090ff';
        ctx.fillRect(-3, -12, 6, 5);
        ctx.restore();
      }
      if (busted <= 0) drawCar(player.x, player.y, player.angle, '#e8b13a', true);
      ctx.restore();

      /* --- wanted stars --- */
      ctx.textAlign = 'center';
      ctx.font = '26px system-ui';
      for (var s = 0; s < 3; s++){
        ctx.fillStyle = s < wanted ? '#ffd23e' : 'rgba(255,255,255,.16)';
        ctx.fillText('★', cv.width/2 + (s-1)*30, 34);
      }
      /* speed */
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,255,255,.8)';
      ctx.font = '12px system-ui';
      ctx.fillText('SPEED ' + Math.abs(Math.round(player.speed)) + ' km/h', 12, 20);

      if (busted > 0){
        ctx.fillStyle = 'rgba(10,10,20,.6)';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = '#ff5b5b';
        ctx.font = 'bold 46px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('BUSTED', cv.width/2, cv.height/2);
      }

      /* --- minimap (bottom-left) --- */
      var MW = 150, MH = MW * WORLD_H / WORLD_W, mx = 12, my = cv.height - MH - 12;
      var ms = MW / WORLD_W;
      ctx.fillStyle = 'rgba(10,14,28,.8)';
      ctx.fillRect(mx - 2, my - 2, MW + 4, MH + 4);
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      ctx.strokeRect(mx - 2, my - 2, MW + 4, MH + 4);
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      buildings.forEach(function(b){ ctx.fillRect(mx + b.x*ms, my + b.y*ms, Math.max(1, b.w*ms), Math.max(1, b.h*ms)); });
      ctx.fillStyle = 'rgba(60,140,255,.55)';
      ctx.fillRect(mx + zone.x*ms, my + zone.y*ms, zone.w*ms, zone.h*ms);
      if (police && busted <= 0){
        ctx.fillStyle = '#ff4040';
        ctx.beginPath(); ctx.arc(mx + police.x*ms, my + police.y*ms, 3, 0, 7); ctx.fill();
      }
      ctx.fillStyle = '#ffd23e';
      ctx.beginPath(); ctx.arc(mx + player.x*ms, my + player.y*ms, 3.2, 0, 7); ctx.fill();
    }
    var loopTimer = setInterval(loop, 33);
    rec.onClose = function(){
      closed = true;
      clearInterval(loopTimer);
      document.removeEventListener('keydown', onKeyDown);
      document.removeEventListener('keyup', onKeyUp);
    };
  }
});

/* =====================================================================
   APP: FLIGHT SIMULATOR
   ===================================================================== */
registerApp({
  key: 'flight', name: 'Flight Simulator', icon: 'fa-plane',
  color: 'linear-gradient(135deg,#16a085,#0e6655)', single: true,
  width: 780, height: 580,
  build: function(rec){
    var root = el('div', 'game-wrap');
    root.innerHTML =
      '<canvas width="720" height="470"></canvas>' +
      '<div class="game-hint">W = throttle up · S = brake · A/D = bank & turn · fly fast to gain altitude, slow down low over the yellow pad to land</div>';
    rec.body.appendChild(root);
    var cv = $('canvas', root), ctx = cv.getContext('2d');
    var keys = {}, closed = false;
    var MAXV = 320, CRUISE = 140;

    var plane = { x: 0, y: 0, heading: -Math.PI/2, speed: 0, alt: 0, thr: 0, fuel: 100, bank: 0 };
    var pad = { x: 950, y: -650 };
    var score = 0, msg = '', msgT = 0, dead = 0;
    var clouds = [];
    for (var i = 0; i < 16; i++){
      clouds.push({
        x: (Math.random()-0.5)*3600, y: (Math.random()-0.5)*3600,
        s: 0.6 + Math.random()*1.2, vx: 6 + Math.random()*10
      });
    }

    function newPad(){
      var a = Math.random() * Math.PI * 2;
      var d = 700 + Math.random() * 700;
      pad = { x: Math.round(Math.cos(a)*d/50)*50, y: Math.round(Math.sin(a)*d/50)*50 };
    }
    function onKeyDown(e){
      if (focusedWin !== rec) return;   /* never steal keys from other apps */
      var k = e.key.toLowerCase();
      if ('wasd'.indexOf(k) >= 0 || k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright'){
        keys[k] = true; e.preventDefault();
      }
    }
    function onKeyUp(e){ keys[e.key.toLowerCase()] = false; }
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);

    function reset(msgText){
      plane = { x: 0, y: 0, heading: -Math.PI/2, speed: 0, alt: 0, thr: 0, fuel: 100, bank: 0 };
      dead = 0;
      if (msgText){ msg = msgText; msgT = 2.4; }
    }

    var last = performance.now();
    function loop(){
      if (closed) return;
      var now = performance.now();
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      /* keeps painting when unfocused; input is gated in onKeyDown instead */

      if (msgT > 0) msgT -= dt;

      if (dead > 0){
        dead -= dt;
        if (dead <= 0) reset('Back on the runway. Good luck, pilot.');
      } else {
        /* throttle */
        if (keys.w || keys.arrowup) plane.thr = Math.min(1, plane.thr + 0.7*dt);
        if (keys.s || keys.arrowdown) plane.thr = Math.max(0, plane.thr - 0.9*dt);
        if (plane.fuel <= 0) plane.thr = 0;
        plane.fuel = Math.max(0, plane.fuel - (0.12 + plane.thr * 0.5) * dt);

        plane.speed += (plane.thr * MAXV - plane.speed) * 0.55 * dt;

        /* banking + turn */
        var turn = 0;
        if (keys.a || keys.arrowleft) turn -= 1;
        if (keys.d || keys.arrowright) turn += 1;
        plane.bank += ((turn * 1) - plane.bank) * 4 * dt;
        plane.heading += turn * 1.9 * dt * (0.55 + 0.45 * plane.speed / MAXV);

        /* altitude: fast = climb, slow = sink */
        if (plane.speed > CRUISE) plane.alt = Math.min(3000, plane.alt + (plane.speed - CRUISE) * 0.28 * dt);
        else plane.alt = Math.max(0, plane.alt - (CRUISE - plane.speed) * 0.30 * dt);

        /* move */
        plane.x += Math.cos(plane.heading) * plane.speed * dt;
        plane.y += Math.sin(plane.heading) * plane.speed * dt;

        /* landing / crash checks */
        var dPad = Math.hypot(plane.x - pad.x, plane.y - pad.y);
        if (plane.alt <= 0){
          if (plane.speed > 185){
            dead = 2.2; msg = 'CRASHED!'; msgT = 2.2;
          } else if (dPad < 80 && plane.speed <= 115 && plane.speed > 5){
            score += 100;
            plane.fuel = 100; plane.thr = 0; plane.speed = 0;
            msg = 'LANDED! +100 · tank refuelled, new pad marked'; msgT = 3;
            newPad();
          }
        } else if (dPad < 80 && plane.alt < 120 && plane.thr > 0 && plane.speed < 130){
          msg = 'Cut throttle (S) and slow down to land!'; msgT = 0.5;
        }

        clouds.forEach(function(c){ c.x += c.vx * dt; });
      }

      /* ---- draw ---- */
      var camX = plane.x, camY = plane.y;
      ctx.fillStyle = '#2e4638';
      ctx.fillRect(0, 0, cv.width, cv.height);

      ctx.save();
      ctx.translate(cv.width/2, cv.height/2);
      /* ground grid in world space */
      var GS = 200;
      var x0 = Math.floor((camX - cv.width/2)/GS)*GS, y0 = Math.floor((camY - cv.height/2)/GS)*GS;
      ctx.strokeStyle = 'rgba(255,255,255,.06)';
      ctx.lineWidth = 1;
      for (var gx = x0; gx < camX + cv.width/2 + GS; gx += GS){
        ctx.beginPath(); ctx.moveTo(gx - camX, -camY - 50); ctx.lineTo(gx - camX, cv.height - camY + 50); ctx.stroke();
      }
      for (var gy = y0; gy < camY + cv.height/2 + GS; gy += GS){
        ctx.beginPath(); ctx.moveTo(-camX - 50, gy - camY); ctx.lineTo(cv.width - camX + 50, gy - camY); ctx.stroke();
      }
      /* landing pad */
      ctx.fillStyle = '#3c3f4a';
      ctx.fillRect(pad.x - camX - 60, pad.y - camY - 60, 120, 120);
      ctx.strokeStyle = '#ffd23e';
      ctx.lineWidth = 4;
      ctx.strokeRect(pad.x - camX - 60, pad.y - camY - 60, 120, 120);
      ctx.beginPath();
      ctx.arc(pad.x - camX, pad.y - camY, 36, 0, 7);
      ctx.stroke();
      ctx.fillStyle = '#ffd23e';
      ctx.font = 'bold 30px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('H', pad.x - camX, pad.y - camY + 11);

      /* plane (drawn before clouds so clouds drift over it) */
      ctx.save();
      ctx.translate(plane.x - camX, plane.y - camY);
      ctx.rotate(plane.heading);
      var bs = 1 - Math.abs(plane.bank) * 0.22;
      ctx.scale(bs, 1);
      ctx.fillStyle = '#e9edf5';
      ctx.beginPath();
      ctx.moveTo(20, 0); ctx.lineTo(4, -5); ctx.lineTo(-12, -4); ctx.lineTo(-12, 4); ctx.lineTo(4, 5);
      ctx.closePath(); ctx.fill();
      /* wings */
      ctx.beginPath();
      ctx.moveTo(5, 0); ctx.lineTo(-6, -20 * bs); ctx.lineTo(-11, -20 * bs); ctx.lineTo(-4, 0);
      ctx.lineTo(-11, 20 * bs); ctx.lineTo(-6, 20 * bs); ctx.closePath();
      ctx.fill();
      /* tail */
      ctx.beginPath();
      ctx.moveTo(-10, 0); ctx.lineTo(-16, -8); ctx.lineTo(-18, -8); ctx.lineTo(-15, 0);
      ctx.lineTo(-18, 8); ctx.lineTo(-16, 8); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#3956d6';
      ctx.beginPath(); ctx.arc(8, 0, 2.6, 0, 7); ctx.fill();
      ctx.restore();

      /* direction arrow to pad */
      var padAng = Math.atan2(pad.y - plane.y, pad.x - plane.x);
      ctx.save();
      ctx.translate(Math.cos(padAng)*52, Math.sin(padAng)*52);
      ctx.rotate(padAng);
      ctx.fillStyle = 'rgba(255,210,62,.9)';
      ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(-5,-6); ctx.lineTo(-5,6); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.restore();

      /* clouds on top (semi-transparent) */
      clouds.forEach(function(c){
        var sx = c.x - camX, sy = c.y - camY;
        if (sx < -140 || sy < -140 || sx > cv.width + 140 || sy > cv.height + 140) return;
        ctx.fillStyle = 'rgba(235,240,250,.30)';
        ctx.beginPath();
        ctx.ellipse(sx, sy, 52*c.s, 30*c.s, 0, 0, 7);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(sx + 34*c.s, sy + 8*c.s, 34*c.s, 20*c.s, 0, 0, 7);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(sx - 30*c.s, sy + 10*c.s, 30*c.s, 17*c.s, 0, 0, 7);
        ctx.fill();
      });

      /* ---- HUD ---- */
      ctx.textAlign = 'left';
      ctx.font = '12.5px system-ui';
      var hx = 14, hy = 22, lh = 20;
      ctx.fillStyle = 'rgba(10,14,28,.75)';
      ctx.fillRect(6, 8, 158, 108);
      ctx.strokeStyle = 'rgba(255,255,255,.15)';
      ctx.strokeRect(6, 8, 158, 108);
      ctx.fillStyle = '#cfd6f5';
      ctx.fillText('SPD ' + Math.round(plane.speed) + ' kt', hx, hy);
      ctx.fillText('ALT ' + Math.round(plane.alt) + ' ft', hx, hy + lh);
      ctx.fillText('THR ' + Math.round(plane.thr * 100) + '%', hx, hy + lh*2);
      ctx.fillText('FUEL', hx, hy + lh*3 + 2);
      /* fuel bar */
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      ctx.fillRect(hx + 42, hy + lh*3 - 9, 104, 10);
      ctx.fillStyle = plane.fuel > 25 ? '#39c26d' : '#e74c3c';
      ctx.fillRect(hx + 42, hy + lh*3 - 9, 104 * plane.fuel / 100, 10);
      /* alt bar */
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      ctx.fillRect(hx + 42, hy + lh - 9, 104, 10);
      ctx.fillStyle = '#4f8cff';
      ctx.fillRect(hx + 42, hy + lh - 9, 104 * plane.alt / 3000, 10);
      ctx.fillStyle = '#cfd6f5';
      ctx.fillText('SCORE ' + score, hx, hy + lh*4 + 8);

      /* minimap (bottom-right, centred on plane) */
      var MW = 130, mx = cv.width - MW - 12, my = cv.height - MW - 12, ms = 0.045;
      ctx.fillStyle = 'rgba(10,14,28,.8)';
      ctx.fillRect(mx - 2, my - 2, MW + 4, MW + 4);
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      ctx.strokeRect(mx - 2, my - 2, MW + 4, MW + 4);
      /* pad, clamped to map edge so it is always findable */
      var ppx = clamp(mx + MW/2 + (pad.x - plane.x) * ms, mx + 6, mx + MW - 6);
      var ppy = clamp(my + MW/2 + (pad.y - plane.y) * ms, my + 6, my + MW - 6);
      ctx.fillStyle = '#ffd23e';
      ctx.fillRect(ppx - 3, ppy - 3, 6, 6);
      ctx.fillStyle = '#e9edf5';
      ctx.save();
      ctx.translate(mx + MW/2, my + MW/2);
      ctx.rotate(plane.heading);
      ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(-4,-4); ctx.lineTo(-4,4); ctx.closePath(); ctx.fill();
      ctx.restore();

      /* message */
      if (msgT > 0 && msg){
        ctx.textAlign = 'center';
        ctx.font = 'bold 20px system-ui';
        ctx.fillStyle = 'rgba(10,14,28,.7)';
        var tw = ctx.measureText(msg).width;
        ctx.fillRect(cv.width/2 - tw/2 - 16, cv.height/2 - 60, tw + 32, 38);
        ctx.fillStyle = msg === 'CRASHED!' ? '#ff5b5b' : '#7bed9f';
        ctx.fillText(msg, cv.width/2, cv.height/2 - 34);
      }
      if (dead > 0){
        ctx.fillStyle = 'rgba(120,20,20,.35)';
        ctx.fillRect(0, 0, cv.width, cv.height);
      }
    }
    var loopTimer = setInterval(loop, 33);
    rec.onClose = function(){
      closed = true;
      clearInterval(loopTimer);
      document.removeEventListener('keydown', onKeyDown);
      document.removeEventListener('keyup', onKeyUp);
    };
  }
});

/* =====================================================================
   LAUNCHER
   ===================================================================== */
var launcherEl = $('#launcher'), launcherGrid = $('#launcher-grid'), launcherSearch = $('#launcher-search');

function renderLauncher(filter){
  launcherGrid.innerHTML = '';
  var f = (filter || '').toLowerCase();
  var shown = 0;
  APPS.forEach(function(a){
    if (f && a.name.toLowerCase().indexOf(f) < 0) return;
    shown++;
    var item = el('div', 'lapp');
    item.innerHTML = '<div class="ic" style="background:' + a.color + '"><i class="fa-solid ' + a.icon + '"></i></div><div class="lbl">' + esc(a.name) + '</div>';
    item.addEventListener('click', function(){
      openApp(a);
      toggleLauncher(false);
    });
    launcherGrid.appendChild(item);
  });
  if (!shown) launcherGrid.appendChild(el('div', 'lapp none', 'No apps match "' + esc(filter) + '"'));
}
function toggleLauncher(force){
  var open = (force !== undefined) ? force : !launcherEl.classList.contains('open');
  launcherEl.classList.toggle('open', open);
  $('#start-btn').classList.toggle('on', open);
  if (open){
    launcherSearch.value = '';
    renderLauncher('');
    setTimeout(function(){ launcherSearch.focus(); }, 30);
  }
}
launcherSearch.addEventListener('input', function(){ renderLauncher(launcherSearch.value); });
launcherSearch.addEventListener('keydown', function(e){
  e.stopPropagation();
  if (e.key === 'Enter'){
    var first = launcherGrid.querySelector('.lapp:not(.none)');
    if (first){ first.click(); }
  } else if (e.key === 'Escape'){ toggleLauncher(false); }
});
$('#start-btn').addEventListener('click', function(e){ e.stopPropagation(); toggleLauncher(); });
document.addEventListener('mousedown', function(e){
  if (launcherEl.classList.contains('open') && !e.target.closest('#launcher') && !e.target.closest('#start-btn')){
    toggleLauncher(false);
  }
  if (!e.target.closest('#ctxmenu')) hideCtxMenu();
  if (!e.target.closest('#vol-pop') && !e.target.closest('#vol-btn')) $('#vol-pop').classList.remove('open');
});

/* =====================================================================
   DESKTOP ICONS + CONTEXT MENU
   ===================================================================== */
var DESKTOP_APPS = ['terminal','files','notepad','calculator','snake','gta','flight'];
var desktopFiles = [];  /* { name, path } */
var iconsEl = $('#icons');

function getApp(key){
  for (var i = 0; i < APPS.length; i++) if (APPS[i].key === key) return APPS[i];
  return null;
}
function renderDesktopIcons(){
  iconsEl.innerHTML = '';
  DESKTOP_APPS.forEach(function(k){
    var a = getApp(k);
    if (!a) return;
    var d = el('div', 'dicon');
    d.innerHTML = '<div class="ic" style="background:' + a.color + '"><i class="fa-solid ' + a.icon + '"></i></div><div class="lbl">' + esc(a.name) + '</div>';
    d.addEventListener('dblclick', function(){ openApp(a); });
    d.addEventListener('click', function(e){
      e.stopPropagation();
      Array.prototype.forEach.call(iconsEl.children, function(c){ c.classList.remove('sel'); });
      d.classList.add('sel');
    });
    iconsEl.appendChild(d);
  });
  desktopFiles.forEach(function(f){
    var d = el('div', 'dicon');
    d.innerHTML = '<div class="ic" style="background:linear-gradient(135deg,#2980b9,#155fa0)"><i class="fa-regular fa-file-lines"></i></div><div class="lbl">' + esc(f.name) + '</div>';
    d.addEventListener('dblclick', function(){
      var np = openApp(getApp('notepad'));
      np.openVFile(f.path);
    });
    d.addEventListener('click', function(e){
      e.stopPropagation();
      Array.prototype.forEach.call(iconsEl.children, function(c){ c.classList.remove('sel'); });
      d.classList.add('sel');
    });
    iconsEl.appendChild(d);
  });
}
$('#desktop').addEventListener('click', function(){
  Array.prototype.forEach.call(iconsEl.children, function(c){ c.classList.remove('sel'); });
});

function desktopNewFile(){
  var base = 'untitled', n = 1, name = 'untitled.txt';
  var home = fsGet('/home');
  while (home.children[name]){ n++; name = base + '-' + n + '.txt'; }
  fsWriteFile('/home/' + name, '');
  desktopFiles.push({ name: name, path: '/home/' + name });
  renderDesktopIcons();
  var frec = getApp('files')._win;
  if (frec && frec.refresh) frec.refresh();
}
function showCtxMenu(x, y){
  var m = $('#ctxmenu');
  m.innerHTML = '';
  var items = [
    { icon: 'fa-rotate-right', label: 'Refresh', fn: function(){ renderDesktopIcons(); } },
    { icon: 'fa-file-circle-plus', label: 'New File', fn: desktopNewFile }
  ];
  items.forEach(function(it){
    var d = el('div', 'mi', '<i class="fa-solid ' + it.icon + '"></i>' + esc(it.label));
    d.addEventListener('click', function(){ hideCtxMenu(); it.fn(); });
    m.appendChild(d);
  });
  m.style.display = 'block';
  var r = m.getBoundingClientRect();
  m.style.left = clamp(x, 0, window.innerWidth - r.width - 4) + 'px';
  m.style.top = clamp(y, 0, window.innerHeight - r.height - 52) + 'px';
}
function hideCtxMenu(){ $('#ctxmenu').style.display = 'none'; }
document.addEventListener('contextmenu', function(e){
  if (e.target.closest('.window') || e.target.closest('#taskbar') || e.target.closest('#launcher') || e.target.closest('.dicon')) return;
  e.preventDefault();
  showCtxMenu(e.clientX, e.clientY);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    toggleLauncher(false);
    hideCtxMenu();
    $('#vol-pop').classList.remove('open');
  }
});

/* =====================================================================
   TASKBAR: CLOCK + VOLUME TRAY
   ===================================================================== */
function updateClock(){
  var d = new Date();
  var p = function(x){ return (x < 10 ? '0' : '') + x; };
  $('#clock-time').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  $('#clock-date').textContent = d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
setInterval(updateClock, 1000);
updateClock();

$('#vol-btn').addEventListener('click', function(e){
  e.stopPropagation();
  $('#vol-pop').classList.toggle('open');
});

/* =====================================================================
   BOOT
   ===================================================================== */
setTimeout(function(){ $('#boot').classList.add('hide'); }, 1300);
setTimeout(function(){ var b = $('#boot'); if (b) b.remove(); }, 2000);

/* init desktop */
renderDesktopIcons();

/* auto-open welcome terminal on first boot */
setTimeout(function(){ openApp(getApp('terminal')); }, 1500);
</script>
