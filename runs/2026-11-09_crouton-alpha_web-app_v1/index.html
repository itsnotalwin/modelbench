<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldline - Service Dispatch</title>
<meta name="description" content="Fieldline dispatch desk for facilities service teams: jobs, crew, sites and parts in one shared board.">
<style>
:root{
  --paper:#F6F3EC; --paper2:#EFE9DC; --card:#FFFDF8; --ink:#171C1A; --ink2:#3A4440; --muted:#6B7672;
  --line:#D9D2C2; --line2:#C9C0AC; --pine:#0E3B32; --pine2:#0E6B5C; --pine-soft:#DCEBE4;
  --amber:#B7791F; --amber-bg:#FDF0D5; --red:#B42318; --red-bg:#FDECEA; --slate-bg:#E8EDF0;
  --gold:#E8A33D; --radius:14px;
  --shadow:0 1px 2px rgba(23,28,26,.06),0 8px 28px rgba(23,28,26,.07);
  --shadow-lg:0 18px 50px rgba(10,20,17,.22);
  --focus:#0E6B5C;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--pine2)}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-50px;background:var(--pine);color:#fff;padding:10px 16px;border-radius:8px;z-index:200;transition:top .2s}
.skip:focus{top:12px;color:#fff}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--pine);color:#D9EADF;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.rail-brand{padding:22px 20px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.rail-brand .mark{font-family:var(--serif);font-size:26px;letter-spacing:.2px;color:#fff;line-height:1}
.rail-brand .mark em{color:var(--gold);font-style:normal}
.rail-brand p{margin:6px 0 0;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#9FBFAF}
.rail-nav{padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.rail-nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:#C8DDD0;padding:10px 12px;border-radius:9px;font-size:14.5px}
.rail-nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.rail-nav button[aria-current="page"]{background:#fff;color:var(--pine);font-weight:700}
.rail-nav button .ic{width:22px;text-align:center;font-size:15px;flex:none}
.rail-nav button .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.16);padding:2px 7px;border-radius:99px;font-family:var(--mono)}
.rail-nav button[aria-current="page"] .cnt{background:var(--pine-soft);color:var(--pine)}
.rail-foot{padding:14px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;color:#9FBFAF}
.rail-foot button{display:block;width:100%;text-align:left;background:none;border:1px solid rgba(255,255,255,.18);color:#E6F2EA;border-radius:8px;padding:8px 10px;margin-top:8px}
.rail-foot button:hover{background:rgba(255,255,255,.08)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:25;background:rgba(246,243,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 28px 12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.topbar h1{font-family:var(--serif);font-size:26px;margin:0;font-weight:600;letter-spacing:.1px}
.topbar .date{font-size:12.5px;color:var(--muted);margin-top:2px}
.global-search{flex:1;min-width:220px;max-width:520px;margin-left:auto;position:relative}
.global-search input{width:100%;padding:10px 14px 10px 40px;border:1px solid var(--line2);border-radius:99px;background:var(--card);font-size:14px}
.global-search .k{position:absolute;left:14px;top:9px;color:var(--muted);font-size:15px}
.global-search kbd{position:absolute;right:12px;top:8px;font-family:var(--mono);font-size:11px;background:var(--paper2);border:1px solid var(--line);padding:2px 7px;border-radius:6px;color:var(--muted)}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:8px 14px;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--pine2);color:var(--pine)}
.btn.primary{background:var(--pine);color:#fff;border-color:var(--pine)}
.btn.primary:hover{background:var(--pine2);color:#fff}
.btn.danger{background:#fff;color:var(--red);border-color:#E8B4AE}
.btn.danger:hover{background:var(--red-bg)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.content{padding:22px 28px 60px;max-width:1680px;width:100%;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .value{font-family:var(--serif);font-size:32px;line-height:1.1;margin-top:4px}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat.warn .value{color:var(--red)}
.banner{display:none;border-radius:var(--radius);padding:13px 16px;margin-bottom:16px;font-size:14px;border:1px solid}
.banner.show{display:flex;gap:12px;align-items:flex-start}
.banner.err{background:var(--red-bg);border-color:#E8B4AE;color:#7A1F18}
.banner.info{background:var(--amber-bg);border-color:#EAD9A8;color:#5C4300}
.banner button{margin-left:auto;flex:none}
.board{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:8px}
.col{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);min-height:340px;display:flex;flex-direction:column}
.col.drop-over{outline:3px dashed var(--pine2);outline-offset:-3px;background:#E3F0E9}
.col-head{padding:12px 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.col-head .dot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.12)}
.col-head h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0}
.col-head .n{margin-left:auto;font-family:var(--mono);font-size:12px;background:var(--card);border:1px solid var(--line);padding:1px 8px;border-radius:99px}
.col-body{padding:10px;display:flex;flex-direction:column;gap:10px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:0 1px 3px rgba(23,28,26,.05);cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--pine2);box-shadow:var(--shadow)}
.card.dragging{opacity:.45}
.card h3{margin:0 0 4px;font-size:15px;line-height:1.3}
.card .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .foot{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:99px;border:1px solid}
.pill.P1{color:var(--red);background:var(--red-bg);border-color:#F0BBB4}
.pill.P2{color:#7A5400;background:var(--amber-bg);border-color:#EAD9A8}
.pill.P3{color:#3F5058;background:var(--slate-bg);border-color:#CBD6DC}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.time-chip{font-family:var(--mono);font-size:11.5px;background:var(--paper2);padding:2px 7px;border-radius:6px}
.col-empty{border:1.5px dashed var(--line2);border-radius:10px;padding:18px 12px;text-align:center;color:var(--muted);font-size:13px;background:rgba(255,253,248,.5)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .spacer{flex:1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--card);font-size:14px;min-width:130px}
.field input[type="search"]{min-width:240px}
.saved-views{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.saved-views .sv{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px}
.saved-views .sv[aria-pressed="true"]{background:var(--pine);color:#fff;border-color:var(--pine)}
.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:900px}
thead th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:11px 12px;border-bottom:1px solid var(--line);background:#FBF8F0;white-space:nowrap}
thead th button{background:none;border:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;font-weight:700;padding:0}
tbody td{padding:11px 12px;border-bottom:1px solid #EDE6D5;vertical-align:top;font-size:14px}
tbody tr{cursor:pointer}
tbody tr:hover{background:#FBF8F0}
tbody tr.selected{background:#EAF3EE}
.mono{font-family:var(--mono);font-size:12.5px}
.status{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600}
.status .dot{width:8px;height:8px;border-radius:50%}
.bulkbar{display:none;background:var(--pine);color:#fff;border-radius:10px;padding:9px 14px;margin-bottom:12px;align-items:center;gap:10px;flex-wrap:wrap}
.bulkbar.show{display:flex}
.bulkbar select,.bulkbar .btn{border-color:rgba(255,255,255,.3)}
.bulkbar .btn{background:rgba(255,255,255,.12);color:#fff}
.bulkbar .btn:hover{background:rgba(255,255,255,.22)}
.compact tbody td{padding:6px 12px}
.count-note{font-size:13px;color:var(--muted);margin-top:9px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 6px;font-family:var(--serif);font-size:19px}
.panel .sub{color:var(--muted);font-size:13px}
.meter{height:8px;background:var(--paper2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.meter > i{display:block;height:100%;background:var(--pine2)}
.meter.hot > i{background:var(--red)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #F0EADA;font-size:14px}
.kv:last-child{border-bottom:0}
.qty-ctl{display:inline-flex;align-items:center;gap:6px}
.qty-ctl button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line2);background:#fff;font-weight:700}
.qty-ctl output{font-family:var(--mono);min-width:36px;text-align:center}
.scrim{position:fixed;inset:0;background:rgba(14,25,21,.45);z-index:40;display:none}
.scrim.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100dvh;width:min(560px,96vw);background:var(--card);z-index:50;box-shadow:var(--shadow-lg);transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer-head h2{font-family:var(--serif);font-size:22px;margin:0;line-height:1.2}
.drawer-body{padding:18px 22px;overflow:auto;flex:1}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#FBF8F0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line2);border-radius:8px;background:#fff;width:100%}
.fld .hint{font-size:12px;color:var(--muted)}
.fld .err{font-size:12.5px;color:var(--red);font-weight:600}
.fld input[aria-invalid="true"],.fld select[aria-invalid="true"]{border-color:var(--red);background:#FFF5F4}
.transitions{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 14px}
.timeline{margin:0;padding:0;list-style:none}
.timeline li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #F0EADA;font-size:13.5px}
.timeline li:last-child{border-bottom:0}
.timeline .t{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;padding-top:2px}
.sec-title{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:20px 0 10px}
.sec-title:first-child{margin-top:0}
.dialog{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;background:rgba(14,25,21,.45)}
.dialog.show{display:flex}
.dialog-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow-lg);width:min(640px,96vw);max-height:82dvh;display:flex;flex-direction:column;overflow:hidden}
.dialog-card header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dialog-card header h2{margin:0;font-family:var(--serif);font-size:20px}
.dialog-card .body{padding:18px 20px;overflow:auto}
.dialog-card footer{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#FBF8F0}
.palette input{width:100%;padding:13px 15px;font-size:16px;border:0;border-bottom:1px solid var(--line)}
.palette-list{overflow:auto;max-height:52dvh}
.palette-list button{display:flex;gap:11px;width:100%;text-align:left;background:none;border:0;padding:10px 16px;align-items:center}
.palette-list button:hover,.palette-list button.active{background:var(--pine-soft)}
.palette-list .kind{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper2);padding:2px 7px;border-radius:99px;color:var(--muted);font-weight:800;flex:none}
.palette-list .sub{color:var(--muted);font-size:12.5px;margin-left:auto;flex:none}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,92vw)}
.toast{background:var(--pine);color:#fff;border-radius:11px;padding:11px 16px;box-shadow:var(--shadow-lg);display:flex;gap:12px;align-items:center;font-size:14px;width:100%}
.toast button{background:#fff;color:var(--pine);border:0;border-radius:7px;padding:5px 11px;font-weight:800;flex:none}
.toast.err{background:var(--red)}
.kbd-help{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kbd-help kbd{font-family:var(--mono);background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;white-space:nowrap}
.empty{background:var(--card);border:1.5px dashed var(--line2);border-radius:var(--radius);padding:44px 28px;text-align:center}
.empty h2{font-family:var(--serif);font-size:24px;margin:0 0 8px}
.empty p{color:var(--muted);max-width:520px;margin:0 auto 16px}
.skeleton{background:linear-gradient(100deg,var(--paper2) 40%,#fff 50%,var(--paper2) 60%);background-size:200% 100%;animation:sh 1.1s infinite linear;border-radius:8px;min-height:18px}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;align-items:center;z-index:45}
  .rail-brand{display:none}.rail-foot{display:none}
  .rail-nav{flex-direction:row;padding:8px;overflow-x:auto}
  .rail-nav button{flex-direction:column;gap:2px;font-size:11px;padding:7px 10px;min-width:64px;text-align:center}
  .rail-nav button .cnt{display:none}
  .main{padding-bottom:72px}
  .topbar{padding:12px 16px}.content{padding:16px 16px 40px}
  .topbar h1{font-size:21px}
  .stats{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .global-search{order:5;max-width:none;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="app">
  <nav class="rail" aria-label="Primary">
    <div class="rail-brand"><div class="mark">Field<em>line</em></div><p>Dispatch Desk</p></div>
    <div class="rail-nav" role="tablist" aria-label="Views">
      <button type="button" data-nav="board" role="tab" aria-current="page"><span class="ic" aria-hidden="true">B</span>Board <span class="cnt" id="cnt-board"></span></button>
      <button type="button" data-nav="jobs" role="tab"><span class="ic" aria-hidden="true">J</span>Jobs <span class="cnt" id="cnt-jobs"></span></button>
      <button type="button" data-nav="sites" role="tab"><span class="ic" aria-hidden="true">S</span>Sites <span class="cnt" id="cnt-sites"></span></button>
      <button type="button" data-nav="crew" role="tab"><span class="ic" aria-hidden="true">C</span>Crew <span class="cnt" id="cnt-crew"></span></button>
      <button type="button" data-nav="parts" role="tab"><span class="ic" aria-hidden="true">P</span>Parts <span class="cnt" id="cnt-parts"></span></button>
    </div>
    <div class="rail-foot">
      <div id="storage-note">Saved locally in this browser.</div>
      <button type="button" id="rail-export">Export data (JSON)</button>
      <button type="button" id="rail-help">Keyboard shortcuts (?)</button>
    </div>
  </nav>
  <div class="main">
    <header class="topbar">
      <div><h1 id="view-title">Dispatch Board</h1><div class="date" id="view-date"></div></div>
      <div class="global-search">
        <span class="k" aria-hidden="true">Q</span>
        <input id="global-search" type="search" placeholder="Search jobs, sites, crew - or press Ctrl+K" aria-label="Global search">
        <kbd>Ctrl K</kbd>
      </div>
      <button class="btn" type="button" id="btn-import">Import</button>
      <button class="btn" type="button" id="btn-export">Export</button>
      <button class="btn primary" type="button" id="btn-new">+ New job</button>
      <input type="file" id="file-import" accept="application/json,.json" hidden aria-label="Import JSON file">
    </header>
    <main class="content" id="main" tabindex="-1">
      <div class="banner err" id="banner-err" role="alert"><span id="banner-err-text"></span><button class="btn small" type="button" id="banner-retry">Dismiss</button></div>
      <div class="banner info" id="banner-info" role="status"><span id="banner-info-text"></span><button class="btn small" type="button" id="banner-info-x">Dismiss</button></div>
      <div id="view-root" aria-live="polite"></div>
    </main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Job details" aria-hidden="true">
  <div class="drawer-head">
    <div style="flex:1"><div class="mono" id="d-id" style="color:var(--muted)"></div><h2 id="d-title">Job</h2><div id="d-badges" style="margin-top:8px;display:flex;gap:7px;flex-wrap:wrap"></div></div>
    <button class="btn ghost" type="button" id="d-close" aria-label="Close details">X</button>
  </div>
  <div class="drawer-body" id="d-body"></div>
  <div class="drawer-foot" id="d-foot"></div>
</aside>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <div class="dialog-card" id="dialog-card"></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="sr-only" aria-live="polite" id="sr-live"></div>
<script>
"use strict";
const LS_KEY="fieldline.v1", SCHEMA=1;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function loadState(){
 try{
  const raw=localStorage.getItem(LS_KEY);
  if(!raw) return seedData();
  const parsed=JSON.parse(raw);
  if(!parsed||typeof parsed!=="object"||!Array.isArray(parsed.jobs)) throw new Error("Stored data is damaged (missing jobs list).");
  if(parsed.schema!==SCHEMA) parsed.schema=SCHEMA;
  if(!Array.isArray(parsed.sites)) parsed.sites=[];
  if(!Array.isArray(parsed.techs)) parsed.techs=[];
  if(!Array.isArray(parsed.parts)) parsed.parts=[];
  if(!Array.isArray(parsed.savedViews)) parsed.savedViews=[];
  return parsed;
 }catch(e){ bootError=e; try{return seedData()}catch(_){return blankState()} }
}

function assignError(job,techId){
 if(!techId)return null;
 const t=techById(techId);
 if(!t)return "That crew member no longer exists.";
 if(!t.active)return t.name+" is inactive and can't take jobs. Pick an active crew member or unassign.";
 const cap=t.cap||99, load=dayLoad(techId,job.date);
 const selfCount=(job.techId===techId&&["scheduled","en_route","on_site"].includes(job.status))?1:0;

function canTransition(from,to){return (TRANSITIONS[from]||[]).includes(to)}
function legalHint(from){const l=TRANSITIONS[from]||[];return l.length?"Allowed next: "+l.map(s=>STATUS_MAP[s].label).join(", ")+".":"This is a final state."}
function changeStatus(job,to,opts){
 opts=opts||{};
 if(job.status===to)return {ok:false,reason:"Already: "+STATUS_MAP[to].label+"."};
 if(!canTransition(job.status,to))return {ok:false,reason:"Can't go from "+STATUS_MAP[job.status].label+" to "+STATUS_MAP[to].label+". "+legalHint(job.status)};
 if(to==="scheduled"&&!job.techId)return {ok:false,reason:"Assign a crew member before scheduling - a scheduled job with no owner tends to vanish."};
 if(to==="scheduled"&&job.techId){const e=assignError(job,job.techId);if(e)return {ok:false,reason:e}}
 if(!opts.silent)pushUndo(STATUS_MAP[job.status].label+" to "+STATUS_MAP[to].label);

}

function applyFilters(list){
 const f=ui.filters,q=ui.search.trim().toLowerCase(),t=todayStr();
 const weekEnd=(()=>{const d=new Date();d.setDate(d.getDate()+6);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")})();
 return list.filter(j=>{
  if(j.archived)return false;
  if(f.openOnly&&["done","cancelled"].includes(j.status))return false;
  if(f.status!=="all"&&j.status!==f.status)return false;
  if(f.priority!=="all"&&j.priority!==f.priority)return false;
  if(f.tech!=="all"&&j.techId!==f.tech)return false;
  if(f.site!=="all"&&j.siteId!==f.site)return false;
  if(f.zone!=="all"){const s=siteById(j.siteId);if(!s||s.zone!==f.zone)return false}
  if(f.when==="today"&&j.date!==t)return false;
  if(f.when==="week"&&(j.date<t||j.date>weekEnd))return false;
  if(q){
   const hay=[j.id,j.title,j.notes||"",siteById(j.siteId)?siteById(j.siteId).name:"",techById(j.techId)?techById(j.techId).name:""].join(" ").toLowerCase();
   if(!hay.includes(q))return false;
  }
  return true;
 });
}
function sorted(list){
 const {key,dir}=ui.sort,[...arr]=list;
 const prio={P1:0,P2:1,P3:2};
 arr.sort((a,b)=>{
  let r=0;
  if(key==="priority")r=prio[a.priority]-prio[b.priority]||a.date.localeCompare(b.date);
  else if(key==="date")r=a.date.localeCompare(b.date)||prio[a.priority]-prio[b.priority];
  else if(key==="title")r=a.title.localeCompare(b.title);
  else if(key==="status")r=STATUS_MAP[a.status].label.localeCompare(STATUS_MAP[b.status].label);
  else if(key==="site")r=((siteById(a.siteId)||{}).name||"").localeCompare((siteById(b.siteId)||{}).name||"");
  else if(key==="tech")r=((techById(a.techId)||{}).name||"~").localeCompare((techById(b.techId)||{}).name||"~");
  else if(key==="hours")r=(a.hours||0)-(b.hours||0);
  return r*dir;
 });
 return arr;
}

 };
 $("#d-dup").onclick=()=>{pushUndo("Duplicate "+j.id);const c=JSON.parse(JSON.stringify(j));c.id=uid("job");c.title=j.title+" (copy)";c.archived=false;c.created=nowStamp();c.updated=nowStamp();c.history=[{t:nowStamp(),msg:"Duplicated from "+j.id}];state.jobs.push(c);persist();renderAll();openJob(c.id);toast("Duplicated as "+c.id+".")};
 $("#d-archive").onclick=()=>{pushUndo((j.archived?"Unarchive ":"Archive ")+j.id);j.archived=!j.archived;addHist(j,j.archived?"Archived":"Unarchived");touch(j);persist();renderAll();toast(j.archived?"Archived. Undo to restore.":"Restored from archive.")};
 $("#d-delete").onclick=()=>{
  if(!confirm("Delete job: "+j.title+"? This removes it from the board and register. You can undo immediately after."))return;
  pushUndo("Delete "+j.id);state.jobs=state.jobs.filter(x=>x.id!==j.id);persist();closeDrawer();renderAll();
  toast("Job deleted.",false,"Undo",doUndo);
 };
}
function showDialog(html){$("#dialog-card").innerHTML=html;$("#dialog").classList.add("show");const first=$("#dialog-card input")||$("#dialog-card select")||$("#dialog-card button");if(first)first.focus()}
function closeDialog(){$("#dialog").classList.remove("show")}

function wireDialog(){
 $$("[data-close]").forEach(b=>b.onclick=closeDialog);

function newJobDialog(){
 showDialog(dlgHead("New job")+"<div class='body'><form id='nj-form' novalidate><div class='form-grid'>"+
  "<div class='fld full'><label for='nj-title'>Job title *</label><input id='nj-title' maxlength='120' placeholder='e.g. AHU 3 fan coil leak - Level 1'><span class='err' id='nj-e-title' hidden></span></div>"+
  "<div class='fld'><label for='nj-site'>Site *</label><select id='nj-site'><option value=''>- pick a site -</option>"+state.sites.map(s=>"<option value='"+esc(s.id)+"'>"+esc(s.name)+"</option>").join("")+"</select><span class='err' id='nj-e-site' hidden></span></div>"+
  "<div class='fld'><label for='nj-tech'>Crew (optional)</label><select id='nj-tech'><option value=''>Unassigned</option>"+state.techs.map(t=>"<option value='"+esc(t.id)+"'>"+esc(t.name)+(t.active?"":" (inactive)")+"</option>").join("")+"</select><span class='err' id='nj-e-tech' hidden></span></div>"+
  "<div class='fld'><label for='nj-pri'>Priority</label><select id='nj-pri'><option>P1</option><option selected>P2</option><option>P3</option></select></div>"+
  "<div class='fld'><label for='nj-date'>Date</label><input id='nj-date' type='date' value='"+todayStr()+"'></div>"+
  "<div class='fld'><label for='nj-hours'>Est. hours</label><input id='nj-hours' type='number' min='0.5' max='16' step='0.5' value='2'></div>"+
  "<div class='fld full'><label for='nj-notes'>Notes</label><textarea id='nj-notes' rows='2' maxlength='1000' placeholder='What the crew should know before they leave'></textarea></div>"+
  "</div></form></div><footer><button class='btn' type='button' data-close>Cancel</button><button class='btn primary' type='button' id='nj-create'>Create job</button></footer>");
 wireDialog();
 $("#nj-create").onclick=()=>{
  const title=$("#nj-title").value.trim(),siteId=$("#nj-site").value,techId=$("#nj-tech").value,date=$("#nj-date").value||todayStr(),hours=parseFloat($("#nj-hours").value);
  let bad=false;
  const setErr=(id,msg)=>{const e=$(id);e.hidden=!msg;e.textContent=msg||"";if(msg)bad=true};
  setErr("#nj-e-title",title.length<4?"Give the job a real title - at least 4 characters.":"");
  setErr("#nj-e-site",!siteId?"Pick the site - jobs cannot be dispatched without a location.":"");
  setErr("#nj-e-tech",techId?assignError({date,techId:null,status:"unassigned"},techId)||"":"");
  if(bad){toast("Fix the highlighted fields first.",true);return}
  pushUndo("New job");
  const job={id:uid("job"),title,siteId,techId:techId||null,status:techId?"scheduled":"unassigned",priority:$("#nj-pri").value,date,hours:isNaN(hours)?2:hours,notes:$("#nj-notes").value.trim(),partsNeeded:[],archived:false,created:nowStamp(),updated:nowStamp(),history:[{t:nowStamp(),msg:"Created"}]};
  state.jobs.push(job);persist();closeDialog();ui.view="board";renderAll();openJob(job.id);
  toast("Job created - " + (techId?"scheduled for "+techById(techId).name:"unassigned, waiting for an owner")+".");
 };
}

function addPartDialog(){
 showDialog(dlgHead("Add part")+"<div class='body'><div class='form-grid'>"+
  "<div class='fld'><label for='np-sku'>SKU *</label><input id='np-sku' maxlength='20' placeholder='e.g. FLT-420'><span class='err' id='np-e' hidden></span></div>"+
  "<div class='fld'><label for='np-name'>Part name *</label><input id='np-name' maxlength='80'></div>"+
  "<div class='fld'><label for='np-qty'>On hand</label><input id='np-qty' type='number' min='0' value='5'></div>"+

  "</div></div><footer><button class='btn' type='button' data-close>Cancel</button><button class='btn primary' type='button' id='np-go'>Add part</button></footer>");

  state.parts.push({id:uid("part"),sku,name,qty:Math.max(0,parseInt($("#np-qty").value)||0),min:Math.max(0,parseInt($("#np-min").value)||0),unit:"pcs",cost:Math.max(0,parseFloat($("#np-cost").value)||0)});
  persist();closeDialog();renderAll();toast("Part "+sku+" added.");
 };

 showDialog(dlgHead("Keyboard shortcuts")+"<div class='body'><div class='kbd-help'>"+
  "<kbd>Ctrl/Command K</kbd><span>Command palette - jump to any job, site, crew member, or action</span>"+

let palIndex=0,palItems=[];
function openPalette(){
 showDialog("<div class='palette' style='display:flex;flex-direction:column'><input id='pal-input' placeholder='Jump to a job, site, crew member - or type an action' aria-label='Command palette'><div class='palette-list' id='pal-list' role='listbox'></div></div>");
 wireDialog();
 const input=$("#pal-input");const upd=()=>renderPalette(input.value);input.oninput=upd;upd();input.focus();
 input.onkeydown=e=>{
  if(e.key==="ArrowDown"){e.preventDefault();palIndex=Math.min(palItems.length-1,palIndex+1);renderPalette(input.value)}
  if(e.key==="ArrowUp"){e.preventDefault();palIndex=Math.max(0,palIndex-1);renderPalette(input.value)}
  if(e.key==="Enter"&&palItems[palIndex]){palItems[palIndex].run();closeDialog()}
  if(e.key==="Escape")closeDialog();
 };
}
function renderPalette(q){
 q=(q||"").toLowerCase();
 const acts=[
  {kind:"Action",label:"+ New job",sub:"N",run:()=>newJobDialog()},
  {kind:"Action",label:"Go to Board",sub:"G B",run:()=>{ui.view="board";renderAll()}},
  {kind:"Action",label:"Go to Jobs",sub:"G J",run:()=>{ui.view="jobs";renderAll()}},
  {kind:"Action",label:"Go to Sites",sub:"G S",run:()=>{ui.view="sites";renderAll()}},
  {kind:"Action",label:"Go to Crew",sub:"G T",run:()=>{ui.view="crew";renderAll()}},
  {kind:"Action",label:"Go to Parts",sub:"G P",run:()=>{ui.view="parts";renderAll()}},
  {kind:"Action",label:"Export JSON backup",sub:"",run:exportJSON},
  {kind:"Action",label:"Import JSON",sub:"",run:()=>$("#file-import").click()},
  {kind:"Action",label:"Undo last change",sub:"Ctrl Z",run:doUndo},
  {kind:"Action",label:"Keyboard shortcuts",sub:"",run:helpDialog},
  {kind:"Action",label:"Reset to sample data",sub:"",run:resetToSample},
  {kind:"Action",label:"Clear everything (empty workspace)",sub:"",run:clearAll},
 ];
 const jobs=liveJobs().map(j=>({kind:"Job",label:j.title,sub:j.id+" - "+STATUS_MAP[j.status].label+" - "+j.priority,run:()=>openJob(j.id)}));
 const sites=state.sites.map(s=>({kind:"Site",label:s.name,sub:s.zone,run:()=>{ui.filters={status:"all",priority:"all",tech:"all",site:s.id,when:"all",openOnly:false,zone:"all"};ui.view="jobs";renderAll()}}));
 const techs=state.techs.map(t=>({kind:"Crew",label:t.name,sub:t.role+" - "+t.zone+" - "+(t.active?"active":"inactive"),run:()=>{ui.filters={status:"all",priority:"all",tech:t.id,site:"all",when:"all",openOnly:false,zone:"all"};ui.view="jobs";renderAll()}}));
 palItems=[...acts,...jobs,...sites,...techs].filter(x=>!q||x.label.toLowerCase().includes(q)).slice(0,14);
 palIndex=Math.min(palIndex,Math.max(0,palItems.length-1));
 $("#pal-list").innerHTML=palItems.length?palItems.map((x,i)=>"<button type='button' role='option' aria-selected='"+(i===palIndex)+"' class='"+(i===palIndex?"active":"")+"' data-i='"+i+"'><span class='kind'>"+x.kind+"</span><span>"+esc(x.label)+"</span><span class='sub'>"+esc(x.sub)+"</span></button>").join(""):"<p style='padding:16px;color:var(--muted)'>No matches. Try a job title, site name, or export.</p>";
 $$("#pal-list button").forEach(b=>b.onclick=()=>{palItems[parseInt(b.dataset.i)].run();closeDialog()});
 $$("#pal-list button").forEach((b,i)=>b.onmouseenter=()=>{palIndex=i;renderPalette($("#pal-input").value)});
}
function download(name,content,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportJSON(){download("fieldline-backup-"+todayStr()+".json",JSON.stringify(state,null,2),"application/json");toast("Backup downloaded - import it any time to restore.")}
function exportCSV(list){
 const head="id,title,site,crew,status,priority,date,hours,notes";
 const rows=list.map(j=>[j.id,j.title,(siteById(j.siteId)||{}).name||"",(techById(j.techId)||{}).name||"",STATUS_MAP[j.status].label,j.priority,j.date,j.hours||0,(j.notes||"").replace(/[\r\n,"]/g," ")].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(","));
 download("fieldline-jobs-"+todayStr()+".csv",head+"\n"+rows.join("\n"),"text/csv");toast(list.length+" jobs exported to CSV.");
}
function importJSON(file){
 const rd=new FileReader();
 rd.onload=()=>{
  try{
   const data=JSON.parse(rd.result);
   if(!data||!Array.isArray(data.jobs)||!Array.isArray(data.sites)||!Array.isArray(data.techs)||!Array.isArray(data.parts))throw new Error("That file does not look like a Fieldline backup (jobs, sites, techs and parts lists are required).");
   pushUndo("Import");
   state={schema:SCHEMA,jobs:data.jobs,sites:data.sites,techs:data.techs,parts:data.parts,savedViews:Array.isArray(data.savedViews)?data.savedViews:[],settings:data.settings||{density:"comfortable"},seeded:!!data.seeded,clearedOnce:!!data.clearedOnce};
   persist();renderAll();toast("Import complete: "+state.jobs.length+" jobs, "+state.sites.length+" sites, "+state.techs.length+" crew, "+state.parts.length+" parts.");
  }catch(e){toast("Import failed: "+e.message+" Your current data is untouched.",true)}
 };
 rd.onerror=()=>toast("Could not read that file. Try again or pick the JSON backup.",true);
 rd.readAsText(file);
}
function resetToSample(){
 if(!confirm("Replace all current data with the sample dispatch data? Export a backup first if you need the current data."))return;
 pushUndo("Reset to sample");
 state=seedData();persist();renderAll();toast("Sample data restored. Undo to get your data back.");
}
function clearAll(){
 if(!confirm("Clear EVERYTHING - jobs, sites, crew and parts - for an empty workspace? Export first if you want a backup. This can be undone."))return;
 pushUndo("Clear workspace");
 state=blankState();persist();renderAll();toast("Workspace cleared. Load sample data or start fresh.");
}
function wireCommon(root){
 const gs=$("#global-search");
 if(gs&&!gs.dataset.wired){gs.dataset.wired="1";gs.addEventListener("input",()=>{ui.search=gs.value;renderAll();const after=$("#global-search");if(after){after.focus();after.setSelectionRange(after.value.length,after.value.length)}});
 }
 const bs=$("#b-search");if(bs)bs.oninput=()=>{ui.search=bs.value;renderAll();const n=$("#b-search");n.focus();n.setSelectionRange(n.value.length,n.value.length)};
 const js=$("#j-search");if(js)js.oninput=()=>{ui.search=js.value;renderAll();const n=$("#j-search");n.focus();n.setSelectionRange(n.value.length,n.value.length)};
 const fst=$("#j-status");if(fst)fst.onchange=()=>{ui.filters.status=fst.value;renderAll()};
 const fpri=$("#j-pri");if(fpri)fpri.onchange=()=>{ui.filters.priority=fpri.value;renderAll()};
 const fte=$("#j-tech");if(fte)fte.onchange=()=>{ui.filters.tech=fte.value;renderAll()};
 const fsi=$("#j-site");if(fsi)fsi.onchange=()=>{ui.filters.site=fsi.value;renderAll()};
 const fwh=$("#j-when");if(fwh)fwh.onchange=()=>{ui.filters.when=fwh.value;renderAll()};
 const bst=$("#b-status");if(bst)bst.onchange=()=>{ui.filters.status=bst.value;renderAll()};
 const bpr=$("#b-pri");if(bpr)bpr.onchange=()=>{ui.filters.priority=bpr.value;renderAll()};
 $$("#view-root [data-row]").forEach(r=>{
  r.addEventListener("click",e=>{if(e.target.matches("input,button,select"))return;openJob(r.dataset.row)});
  r.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target===r)openJob(r.dataset.row)});
 });
 $$("#view-root [data-act]").forEach(b=>b.onclick=()=>{
  const a=b.dataset.act;
  if(a==="load-sample"){pushUndo("Load sample");state=seedData();persist();renderAll();toast("Sample dispatch data loaded.")}
  else if(a==="new-job")newJobDialog();

  else if(a==="add-tech")addTechDialog();
  else if(a==="add-part")addPartDialog();
 });

$$("[data-nav]").forEach(b=>b.onclick=()=>{ui.view=b.dataset.nav;renderAll()});
$("#btn-new").onclick=newJobDialog;
$("#btn-export").onclick=exportJSON;
$("#rail-export").onclick=exportJSON;
$("#btn-import").onclick=()=>$("#file-import").click();
$("#file-import").onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=""};
$("#rail-help").onclick=helpDialog;
$("#d-close").onclick=closeDrawer;
$("#scrim").onclick=closeDrawer;
$("#banner-retry").onclick=hideBanners;
$("#banner-info-x").onclick=hideBanners;
let gPending=false;
document.addEventListener("keydown",e=>{
 const inField=/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||"");
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette()}
 else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!inField){e.preventDefault();doUndo()}
 else if(e.key==="Escape"){closeDialog();closeDrawer()}
 else if(inField)return;
 else if(e.key==="/"){e.preventDefault();$("#global-search").focus()}
 else if(e.key==="n"||e.key==="N"){newJobDialog()}
 else if(e.key==="?"){helpDialog()}
 else if(e.key.toLowerCase()==="g"){gPending=true;setTimeout(()=>gPending=false,900)}
 else if(gPending){
  const m={b:"board",j:"jobs",s:"sites",t:"crew",p:"parts"}[e.key.toLowerCase()];
  if(m){ui.view=m;renderAll()}gPending=false;
 }
});
window.addEventListener("beforeunload",()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(_){}});
(function boot(){
 state=loadState();
 $("#view-root").innerHTML="<div class='stats'>"+("<div class='stat'><div class='skeleton' style='height:32px;width:60%'></div></div>").repeat(5)+"</div><div class='skeleton' style='height:340px'></div>";
 persist();
 setTimeout(()=>{renderAll();if(bootError)showBanner("err","Recovered from damaged saved data ("+esc(bootError.message)+"). Sample data was restored so you can keep working - export a backup when ready.")},420);
})();
</script>
