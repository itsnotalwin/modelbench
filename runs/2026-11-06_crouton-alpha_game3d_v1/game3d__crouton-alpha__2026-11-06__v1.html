<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crouton Alpha — 3D Shooting Range</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0a0a0c;font-family:Arial,Helvetica,sans-serif;color:#fff}
#game{position:fixed;inset:0}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.78);z-index:20;cursor:pointer;text-align:center}
#overlay h1{font-size:42px;letter-spacing:4px;margin:0 0 10px;color:#fff}
#overlay p{color:#bbb;max-width:520px;line-height:1.5}
#overlay .hint{margin-top:18px;padding:14px 28px;background:#e63946;border-radius:6px;font-weight:900;letter-spacing:2px}
#hudScore{position:fixed;top:16px;left:20px;font-size:22px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 6px #000;z-index:5}
#hudScore small{display:block;font-size:12px;color:#aaa;font-weight:400;margin-top:4px}
#hudAmmo{position:fixed;bottom:20px;right:22px;font-size:28px;font-weight:900;text-shadow:0 2px 8px #000;z-index:5}
#reloadText{position:fixed;bottom:58px;right:22px;font-size:14px;color:#ffd166;font-weight:700;letter-spacing:2px;display:none;z-index:5}
#crosshair{position:fixed;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);z-index:6;pointer-events:none;transition:transform .12s}
#crosshair span{position:absolute;background:#0f0;box-shadow:0 0 4px #000}
#crosshair .h{top:50%;left:0;width:100%;height:2px;transform:translateY(-50%)}
#crosshair .v{left:50%;top:0;height:100%;width:2px;transform:translateX(-50%)}
#crosshair .dot{left:50%;top:50%;width:4px;height:4px;border-radius:50%;transform:translate(-50%,-50%)}
#crosshair.fire{transform:translate(-50%,-50%) scale(1.5)}
#cleared{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);z-index:30;flex-direction:column}
#cleared h1{font-size:52px;margin:0;color:#2ecc71;letter-spacing:4px}
#cleared button{margin-top:20px;padding:16px 34px;font-size:18px;font-weight:800;background:#e63946;color:#fff;border:0;border-radius:8px;cursor:pointer}
#msg{position:fixed;top:70px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:800;color:#ffd166;text-shadow:0 2px 6px #000;z-index:5;opacity:0;transition:opacity .2s}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="game"></div>
<div id="hudScore">SCORE: 0<small>Bullseye 50 · Inner 25 · Outer 10 · Moving 1.5×</small></div>
<div id="msg"></div>
<div id="crosshair"><span class="h"></span><span class="v"></span><span class="dot"></span></div>
<div id="hudAmmo">30 / 30</div><div id="reloadText">RELOADING...</div>
<div id="overlay"><h1>3D SHOOTING RANGE</h1><p>Click to lock mouse · WASD move · Space jump · Left click shoot · R reload<br>Hit all 5 bullseyes to clear the range. 2 targets move — worth 1.5×.</p><div class="hint">▶ CLICK TO PLAY</div></div>
<div id="cleared"><h1>RANGE CLEARED</h1><p id="finalScore" style="font-size:22px">Score: 0</p><button id="again">Play Again</button></div>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// ---------- Renderer / Scene ----------
const container=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; container.appendChild(renderer.domElement);

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b0b0e); scene.fog=new THREE.Fog(0x0b0b0e,15,40);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,100); camera.position.set(0,1.6,6);
scene.add(camera);

scene.add(new THREE.AmbientLight(0xffffff,0.55));
const dir=new THREE.DirectionalLight(0xffffff,1.2); dir.position.set(5,10,5); dir.castShadow=true; scene.add(dir);
const fill=new THREE.PointLight(0x6688ff,0.6,30); fill.position.set(0,4,0); scene.add(fill);

// ---------- Floor: procedural noise canvas texture ----------
function makeFloorTexture(){ const c=document.createElement('canvas'); c.width=c.height=512; const g=c.getContext('2d'); g.fillStyle='#2a2a2e'; g.fillRect(0,0,512,512); for(let i=0;i<18000;i++){ const v=Math.random(); g.fillStyle=`rgba(${20+v*60|0},${20+v*60|0},${20+v*65|0},${0.25+Math.random()*0.4})`; g.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*3,1+Math.random()*3);} g.strokeStyle='rgba(0,0,0,.5)'; g.lineWidth=2; for(let i=0;i<=4;i++){ g.beginPath(); g.moveTo(i*128,0); g.lineTo(i*128,512); g.stroke(); g.beginPath(); g.moveTo(0,i*128); g.lineTo(512,i*128); g.stroke();} const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(8,8); return t; }
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,30), new THREE.MeshStandardMaterial({map:makeFloorTexture(),roughness:.95}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

// Warehouse walls
const wallMat=new THREE.MeshStandardMaterial({color:0x1e1e24,roughness:.9});
function wall(w,h,x,y,z,ry){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),wallMat); m.position.set(x,y,z); m.rotation.y=ry; scene.add(m); }
wall(40,6,0,3,-14,0); wall(40,6,0,3,18,Math.PI); wall(30,6,-18,3,2,Math.PI/2); wall(30,6,18,3,2,-Math.PI/2);
// ceiling beams / range lane markers
for(let i=-1;i<=1;i++){ const b=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,30),new THREE.MeshStandardMaterial({color:0x333333})); b.position.set(i*6,5.2,2); scene.add(b); }

// ---------- Targets: red bullseye SVG textures ----------
function bullseyeTexture(){ const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><rect width='512' height='512' fill='#f8f8f8'/><circle cx='256' cy='256' r='240' fill='#e63946'/><circle cx='256' cy='256' r='180' fill='#ffffff'/><circle cx='256' cy='256' r='120' fill='#e63946'/><circle cx='256' cy='256' r='60' fill='#1a1a2e'/><circle cx='256' cy='256' r='22' fill='#ffd166'/></svg>`; const tex=new THREE.Texture(); const img=new Image(); img.onload=()=>{ tex.image=img; tex.needsUpdate=true; }; img.src='data:image/svg+xml;base64,'+btoa(svg); return tex; }

const targetTexture=bullseyeTexture();
const targets=[]; // {group, plane, baseX, moving, bullHit, flashTime}
const positions=[[-4,1.6,-3],[4,1.6,-3],[0,1.6,-8],[ -5,1.6,-12],[5,1.6,-12]]; // distances 9m to 18m from player at z=6
// adjust so nearest is ~5m: player z 6 to target z1? keep as is, varying 5-20m via z -3..-12
positions.forEach((p,i)=>{
  const moving = i===0 || i===3; // 2 moving
  const group=new THREE.Group(); group.position.set(...p);
  const stand=new THREE.Mesh(new THREE.BoxGeometry(0.12,1.2,0.12),new THREE.MeshStandardMaterial({color:0x444444})); stand.position.y=-0.9; group.add(stand);
  const mat=new THREE.MeshStandardMaterial({map:targetTexture,roughness:.6,emissive:new THREE.Color(0x000000), emissiveMap:targetTexture});
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(1.2,1.2),mat);
  plane.userData.isTarget=true; plane.userData.index=i; group.add(plane);
  scene.add(group); targets.push({group,plane,mat,baseX:p[0],moving,bullHit:false,flash:0,index:i});
});

// ---------- Gun (bottom-right, merged BoxGeometry) ----------
const gunGroup=new THREE.Group();
const gunMat=new THREE.MeshStandardMaterial({color:0x222226,metalness:.75,roughness:.35});
function box(w,h,d,x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),gunMat); m.position.set(x,y,z); gunGroup.add(m); return m; }
box(0.08,0.12,0.55,0,0,0); // body
box(0.07,0.09,0.25,0,0.08,-0.28); // barrel
box(0.06,0.16,0.09,0,-0.12,0.15); // grip
box(0.05,0.05,0.12,0,0.01,-0.05); // sight base
box(0.02,0.04,0.02,0,0.09,-0.30); // front sight
gunGroup.position.set(0.32,-0.32,-0.55); gunGroup.rotation.y=0.05; camera.add(gunGroup);

// muzzle flash light
const muzzle=new THREE.PointLight(0xffee88,0,8); muzzle.position.set(0.32,-0.20,-1.1); camera.add(muzzle);
const flashMesh=new THREE.Mesh(new THREE.PlaneGeometry(0.25,0.25), new THREE.MeshBasicMaterial({color:0xffff88,transparent:true,opacity:0,side:THREE.DoubleSide})); flashMesh.position.set(0,0,-0.45); gunGroup.add(flashMesh);

// ---------- Controls / movement ----------
const controls=new PointerLockControls(camera,renderer.domElement);
const overlay=document.getElementById('overlay');
overlay.addEventListener('click',()=>controls.lock());
controls.addEventListener('lock',()=>overlay.style.display='none');
controls.addEventListener('unlock',()=>{ if(!clearedShown) overlay.style.display='flex'; });

const keys={}; addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='KeyR') reload(); });
addEventListener('keyup',e=>keys[e.code]=false);

let velY=0, onGround=true; const speed=4.5;
function updateMove(dt){
  const dirVec=new THREE.Vector3(); // player's forward for WASD via controls direction
  const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
  const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).negate(); // actually left? fix below use cross fwd x up
  right.crossVectors(fwd,new THREE.Vector3(0,1,0)); // right = fwd x up? normalize
  // Use standard: right = new Vector3().crossVectors(fwd, up) gives right? test sign visually: forward -Z, up Y => cross = -X? We'll just build from fwd:
  const r=new THREE.Vector3(-fwd.z,0,fwd.x); // perpendicular
  const move=new THREE.Vector3();
  if(keys.KeyW) move.add(fwd); if(keys.KeyS) move.sub(fwd); if(keys.KeyD) move.add(r); if(keys.KeyA) move.sub(r);
  if(move.lengthSq()>0){ move.normalize().multiplyScalar(speed*dt); camera.position.add(move); }
  camera.position.x=Math.max(-16,Math.min(16,camera.position.x)); camera.position.z=Math.max(-13,Math.min(15,camera.position.z));
  // jump / gravity
  if(keys.Space && onGround){ velY=5; onGround=false; }
  if(!onGround){ velY-=12*dt; camera.position.y+=velY*dt; if(camera.position.y<=1.6){ camera.position.y=1.6; velY=0; onGround=true; } }
}

// ---------- Audio (Web Audio API, no files) ----------
let actx; function audio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function sfxGun(){ const a=audio(),t=a.currentTime,buf=a.createBuffer(1,a.sampleRate*0.18,a.sampleRate),d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2); const s=a.createBufferSource(); s.buffer=buf; const g=a.createGain(); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18); const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1800; s.connect(f).connect(g).connect(a.destination); s.start(); }
function sfxClick(){ const a=audio(),t=a.currentTime,o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=180; g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.08); o.connect(g).connect(a.destination); o.start(); o.stop(t+0.08); }
function sfxPing(){ const a=audio(),t=a.currentTime,o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=880; g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22); o.connect(g).connect(a.destination); o.start(); o.stop(t+0.22); }

// ---------- HUD / game state ----------
let ammo=30, score=0, reloading=false, clearedShown=false;
const ammoEl=document.getElementById('hudAmmo'), scoreEl=document.getElementById('hudScore'), reloadEl=document.getElementById('reloadText'), crossEl=document.getElementById('crosshair'), clearedEl=document.getElementById('cleared'), msgEl=document.getElementById('msg');
function updateHUD(){ ammoEl.textContent=`${ammo} / 30`; scoreEl.firstChild.textContent=`SCORE: ${score}`; }
function showMsg(t){ msgEl.textContent=t; msgEl.style.opacity=1; setTimeout(()=>msgEl.style.opacity=0,900); }

function reload(){ if(reloading||ammo===30) return; reloading=true; reloadEl.style.display='block'; sfxClick(); setTimeout(()=>{ ammo=30; reloading=false; reloadEl.style.display='none'; updateHUD(); sfxClick(); },1500); }

// Recoil: camera kicks up 0.05 rad, eases back over 200ms
let recoil=0, recoilVel=0;
function kick(){ recoil=0.05; crossEl.classList.add('fire'); setTimeout(()=>crossEl.classList.remove('fire'),120); }

addEventListener('mousedown',e=>{ if(controls.isLocked && e.button===0) shoot(); });

function shoot(){
  if(reloading) return;
  if(ammo<=0){ reload(); return; }
  audio(); ammo--; updateHUD(); sfxGun(); kick();
  muzzle.intensity=6; flashMesh.material.opacity=0.95; setTimeout(()=>{ muzzle.intensity=0; flashMesh.material.opacity=0; },80); // 80ms
  // THREE.Raycaster fired from camera position in camera direction
  const raycaster=new THREE.Raycaster(); const ndc=new THREE.Vector2(0,0); raycaster.setFromCamera(ndc,camera); raycaster.far=50;
  const hits=raycaster.intersectObjects(targets.map(t=>t.plane),false);
  if(hits.length){
    const hit=hits[0]; const idx=hit.object.userData.index; const T=targets[idx];
    // local position for bullet hole decal
    const local=T.plane.worldToLocal(hit.point.clone());
    const hole=new THREE.Mesh(new THREE.CircleGeometry(0.03,12), new THREE.MeshBasicMaterial({color:0x111111,polygonOffset:true,polygonOffsetFactor:-1}));
    hole.position.set(local.x,local.y,0.006); T.plane.add(hole); // persists on mesh surface (do not clear on miss)
    // zone by distance from centre
    const d=Math.sqrt(local.x*local.x+local.y*local.y); let pts=0,zone='';
    if(d<=0.12){ pts=50; zone='BULLSEYE'; T.bullHit=true; } else if(d<=0.30){ pts=25; zone='INNER'; } else if(d<=0.60){ pts=10; zone='OUTER'; } else { pts=0; zone='MISS EDGE'; }
    if(T.moving) pts=Math.round(pts*1.5);
    score+=pts; updateHUD(); sfxPing();
    // flash white 150ms
    T.mat.emissive.setHex(0xffffff); T.mat.emissiveIntensity=0.9;
    setTimeout(()=>{ T.mat.emissive.setHex(0x000000); },150);
    showMsg(pts>0?`${zone} +${pts}${T.moving?' (moving 1.5×)':''}`:'Hit target');
    // check cleared: all 5 bullseye
    if(targets.every(t=>t.bullHit)){
      clearedShown=true; document.getElementById('finalScore').textContent=`Score: ${score}`;
      setTimeout(()=>{ clearedEl.style.display='flex'; controls.unlock(); },400);
    }
  }
}

document.getElementById('again').addEventListener('click',()=>{
  targets.forEach(t=>{ t.bullHit=false; // remove bullet holes
    [...t.plane.children].forEach(c=>t.plane.remove(c)); });
  score=0; ammo=30; clearedShown=false; clearedEl.style.display='none'; updateHUD(); controls.lock();
});

// ---------- Loop ----------
const clock=new THREE.Clock();
function animate(){ requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),0.05); const t=clock.elapsedTime;
  if(controls.isLocked) updateMove(dt);
  // moving targets: sine left/right
  targets.forEach(T=>{ if(T.moving) T.group.position.x=T.baseX+Math.sin(t*1.2+T.index)*1.5; });
  // recoil ease back over 200ms
  if(recoil>0){ recoil=Math.max(0,recoil-dt*0.25); }
  // apply recoil as pitch offset (subtract so it returns)
  camera.rotation.x += recoil*dt*5; // small kick applied incrementally; ease via recoil decay
  // gun sway / recoil position
  gunGroup.position.z=-0.55+recoil*0.6; gunGroup.rotation.x=recoil*0.8;
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
updateHUD(); animate();
</script></body></html>
