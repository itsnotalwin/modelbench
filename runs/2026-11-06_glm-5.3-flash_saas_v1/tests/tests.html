<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearLink — core logic tests</title>
  <style>
    body { font: 13px/1.5 ui-monospace, Consolas, monospace; background: #fff; color: #0a0a0a; max-width: 860px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 16px; } .pass { color: #262626; } .fail { font-weight: 700; background: #0a0a0a; color: #fff; display: inline-block; padding: 0 6px; }
    #sum { margin-top: 18px; font-size: 15px; font-weight: 700; border-top: 2px solid #0a0a0a; padding-top: 10px; }
  </style>
</head>
<body>
  <h1>ClearLink core logic — test suite</h1>
  <div id="out"></div>
  <div id="sum"></div>
  <script src="../js/core.js"></script>
  <script src="suite.js"></script>
  <script>
    var res = makeClearLinkSuite(window.CDCore);
    document.getElementById('out').innerHTML = res.log.map(function (l) {
      var cls = l.indexOf('FAIL') === 0 ? 'fail' : 'pass';
      return '<div class="' + cls + '">' + l.replace(/</g, '&lt;') + '</div>';
    }).join('');
    document.getElementById('sum').textContent =
      res.pass + ' passed, ' + res.fail + ' failed' + (res.fail ? ' — FIX BEFORE SHIPPING' : ' — all green');
  </script>
</body>
</html>
