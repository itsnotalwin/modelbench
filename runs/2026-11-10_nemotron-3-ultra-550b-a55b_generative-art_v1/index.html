<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronos — Generative Artwork</title>
<style>
:root {
  --bg: #0a0a0f;
  --fg: #e8e6e0;
  --muted: #4a4842;
  --accent: #c9a876;
  --accent-dim: #8b7355;
  --card: #12121a;
  --border: #2a2822;
  --focus: #d4b87a;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f3ed;
    --fg: #1a1814;
    --muted: #8a8882;
    --accent: #8b6f3d;
    --accent-dim: #a68a5a;
    --card: #ebe9e3;
    --border: #d4d0c8;
    --focus: #8b6f3d;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; transition: opacity 0.6s ease; }
#ui.hidden { opacity: 0; pointer-events: none; }
#ui:not(.hidden) { pointer-events: auto; }
.panel { position: absolute; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; font-size: 13px; line-height: 1.5; max-width: 280px; transition: transform 0.3s ease, opacity 0.3s ease; }
.panel.compact { font-size: 12px; padding: 10px 14px; }
#title-panel { top: 24px; left: 24px; }
#title-panel h1 { font-size: clamp(18px, 2.5vw, 28px); font-weight: 600; letter-spacing: -0.02em; margin-bottom: 4px; background: linear-gradient(135deg, var(--fg), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
#title-panel .subtitle { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
#controls-panel { bottom: 24px; left: 24px; display: flex; flex-direction: column; gap: 10px; }
#seed-panel { bottom: 24px; right: 24px; text-align: right; }
#performance-panel { top: 24px; right: 24px; text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, monospace; }
.btn { appearance: none; border: 1px solid var(--border); background: var(--card); color: var(--fg); padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; min-width: 44px; }
.btn:hover { border-color: var(--accent-dim); background: color-mix(in srgb, var(--card) 85%, var(--accent) 15%); }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-color: var(--focus); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
.btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.small { padding: 6px 12px; font-size: 12px; min-height: 36px; }
.seed-input { display: flex; align-items: center; gap: 8px; }
.seed-input label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.seed-input input { background: var(--bg); border: 1px solid var(--border); color: var(--fg); padding: 8px 12px; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 13px; width: 140px; }
.seed-input input:focus { outline: none; border-color: var(--focus); }
.stat-row { display: flex; justify-content: space-between; gap: 16px; padding: 4px 0; border-bottom: 1px solid var(--border); }
.stat-row:last-child { border-bottom: none; }
.stat-label { color: var(--muted); }
.stat-value { color: var(--fg); font-weight: 500; }
.scene-indicator { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.scene-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); border: 1px solid var(--border); transition: all 0.3s ease; }
.scene-dot.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px var(--accent); }
.scene-dot.complete { background: var(--muted); border-color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
@media (max-width: 768px) {
  #title-panel { top: 12px; left: 12px; right: 12px; max-width: none; }
  #controls-panel { bottom: 12px; left: 12px; right: 12px; flex-direction: row; justify-content: center; flex-wrap: wrap; max-width: none; }
  #seed-panel { bottom: 12px; right: 12px; }
  #performance-panel { top: 12px; right: 12px; }
  .panel { padding: 12px 16px; }
  .btn { padding: 12px 18px; }
}
@media (max-width: 480px) {
  #title-panel h1 { font-size: 20px; }
  .seed-input input { width: 100px; }
}
</style>
</head>
<body>
<canvas id="canvas" aria-hidden="true"></canvas>
<div id="ui">
  <div id="title-panel" class="panel">
    <h1>Chronos</h1>
    <div class="subtitle">Generative Study No. 1</div>
    <div class="scene-indicator" aria-label="Current movement">
      <div class="scene-dot" data-scene="0" title="Movement I: Genesis"></div>
      <div class="scene-dot" data-scene="1" title="Movement II: Flux"></div>
      <div class="scene-dot" data-scene="2" title="Movement III: Entropy"></div>
    </div>
  </div>
  <div id="controls-panel" class="panel">
    <div class="btn-group">
      <button class="btn primary" id="btn-play" aria-label="Pause animation" title="Space">⏸ Pause</button>
      <button class="btn" id="btn-reseed" aria-label="Generate new seed" title="R">⟳ Reseed</button>
      <button class="btn" id="btn-fullscreen" aria-label="Enter fullscreen" title="F">⛶ Fullscreen</button>
      <button class="btn" id="btn-export" aria-label="Export high-resolution PNG" title="E">⬇ Export PNG</button>
      <button class="btn" id="btn-audio" aria-label="Toggle generative audio" title="A">♪ Audio</button>
    </div>
  </div>
  <div id="seed-panel" class="panel compact">
    <div class="seed-input">
      <label for="seed-input">Seed</label>
      <input type="text" id="seed-input" spellcheck="false" autocomplete="off" aria-label="Random seed" placeholder="auto">
    </div>
  </div>
  <div id="performance-panel" class="panel compact">
    <div class="stat-row"><span class="stat-label">FPS</span><span class="stat-value" id="stat-fps">--</span></div>
    <div class="stat-row"><span class="stat-label">Resolution</span><span class="stat-value" id="stat-res">--</span></div>
    <div class="stat-row"><span class="stat-label">Particles</span><span class="stat-value" id="stat-particles">--</span></div>
    <div class="stat-row"><span class="stat-label">Scene</span><span class="stat-value" id="stat-scene">I: Genesis</span></div>
  </div>
</div>

<script id="shader-particle-vert" type="x-shader/x-vertex">
#version 300 es
precision highp float;
layout(location = 0) in vec4 a_data0; // x, y, age, life
layout(location = 1) in vec4 a_data1; // vx, vy, size, type
layout(location = 2) in vec4 a_data2; // hue, sat, brightness, trail
uniform float u_time;
uniform float u_delta;
uniform vec2 u_resolution;
uniform float u_sceneProgress;
uniform int u_sceneIndex;
uniform vec2 u_mouse;
uniform float u_mouseForce;
uniform uint u_seed;
out vec4 v_color;
out float v_size;
out float v_alpha;
out vec2 v_uv;
uint hash(uint x) {
  x ^= x >> 16; x *= 0x7feb352d; x ^= x >> 15; x *= 0x846ca68b; x ^= x >> 16; return x;
}
float rand(vec2 co) { return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453); }
float rand(uint x) { return float(hash(x)) / 4294967295.0; }
vec2 hash2(uint x) { uint h = hash(x); return vec2(float(h & 0xFFFF) / 65535.0, float(h >> 16) / 65535.0); }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float noise(vec2 p) {
  vec2 i = floor(p); vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(rand(i), rand(i + vec2(1,0)), f.x), mix(rand(i + vec2(0,1)), rand(i + vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p, int octaves) {
  float v = 0.0, a = 0.5; vec2 shift = vec2(100.0);
  for (int i = 0; i < 6; i++) {
    if (i >= octaves) break;
    v += a * noise(p); p = p * 2.0 + shift; a *= 0.5;
  }
  return v;
}
vec2 curlNoise(vec2 p) {
  float eps = 0.001;
  float n1 = fbm(p + vec2(eps, 0), 4);
  float n2 = fbm(p - vec2(eps, 0), 4);
  float n3 = fbm(p + vec2(0, eps), 4);
  float n4 = fbm(p - vec2(0, eps), 4);
  return vec2(n3 - n4, n2 - n1) * 0.5;
}
void main() {
  vec2 pos = a_data0.xy;
  float age = a_data0.z;
  float life = a_data0.w;
  vec2 vel = a_data1.xy;
  float baseSize = a_data1.z;
  float ptype = a_data1.w;
  float hue = a_data2.x;
  float sat = a_data2.y;
  float bright = a_data2.z;
  float trail = a_data2.w;
  float progress = age / life;
  vec2 mouseDir = u_mouse - pos;
  float mouseDist = length(mouseDir);
  if (mouseDist < 200.0 && u_mouseForce > 0.0) {
    float influence = (1.0 - mouseDist / 200.0) * u_mouseForce;
    vel += normalize(mouseDir) * influence * u_delta * 50.0;
  }
  if (u_sceneIndex == 0) {
    vec2 flow = curlNoise(pos * 0.002 + u_time * 0.05);
    vel += flow * u_delta * 30.0;
    vel *= pow(0.98, u_delta * 60.0);
    pos += vel * u_delta * 60.0;
    float pulse = sin(u_time * 2.0 + age * 10.0) * 0.5 + 0.5;
    bright *= 0.7 + 0.3 * pulse;
  } else if (u_sceneIndex == 1) {
    vec2 field = vec2(
      sin(pos.y * 0.005 + u_time * 0.3) * cos(pos.x * 0.003),
      cos(pos.y * 0.004 - u_time * 0.2) * sin(pos.x * 0.006)
    );
    vel += field * u_delta * 40.0;
    vel *= pow(0.95, u_delta * 60.0);
    pos += vel * u_delta * 60.0;
    float wave = sin(pos.x * 0.01 + u_time * 1.5) * sin(pos.y * 0.01 - u_time * 1.2);
    hue += wave * 0.05;
    sat *= 0.8 + 0.2 * (wave * 0.5 + 0.5);
  } else {
    vec2 toCenter = u_resolution * 0.5 - pos;
    float dist = length(toCenter);
    vec2 tangent = normalize(vec2(-toCenter.y, toCenter.x));
    vel += tangent * u_delta * 20.0 * (1.0 - progress);
    vel += normalize(toCenter) * u_delta * -15.0 * progress * progress;
    vel *= pow(0.97, u_delta * 60.0);
    pos += vel * u_delta * 60.0;
    bright *= 1.0 - progress * 0.5;
    baseSize *= 1.0 - progress * 0.3;
  }
  float wrap = 50.0;
  if (pos.x < -wrap) pos.x = u_resolution.x + wrap;
  if (pos.x > u_resolution.x + wrap) pos.x = -wrap;
  if (pos.y < -wrap) pos.y = u_resolution.y + wrap;
  if (pos.y > u_resolution.y + wrap) pos.y = -wrap;
  float easedProgress = progress * progress * (3.0 - 2.0 * progress);
  float alpha = 1.0 - easedProgress;
  alpha *= smoothstep(0.0, 0.1, progress);
  alpha *= smoothstep(1.0, 0.9, progress);
  v_size = baseSize * (0.5 + 0.5 * (1.0 - progress)) * (u_resolution.y / 1080.0);
  v_alpha = alpha * trail;
  vec3 hsv = vec3(fract(hue), sat, bright);
  vec3 rgb = clamp(abs(mod(hsv.x * 6.0 + vec3(0,4,2), 6.0) - 3.0) - 1.0, 0.0, 1.0);
  rgb = rgb * rgb * (3.0 - 2.0 * rgb);
  v_color = vec4(mix(vec3(1.0), rgb, hsv.y) * hsv.z, 1.0);
  v_uv = pos / u_resolution;
  gl_Position = vec4((pos / u_resolution) * 2.0 - 1.0, 0.0, 1.0);
  gl_PointSize = max(v_size, 1.0);
}
</script>

<script id="shader-particle-frag" type="x-shader/x-fragment">
#version 300 es
precision highp float;
in vec4 v_color;
in float v_size;
in float v_alpha;
in vec2 v_uv;
out vec4 fragColor;
void main() {
  vec2 center = gl_PointCoord - 0.5;
  float dist = length(center) * 2.0;
  float feather = smoothstep(1.0, 0.3, dist);
  float core = smoothstep(0.3, 0.0, dist);
  float alpha = v_alpha * (core + feather * 0.3);
  fragColor = vec4(v_color.rgb, alpha);
  if (alpha < 0.01) discard;
}
</script>

<script id="shader-field-frag" type="x-shader/x-fragment">
#version 300 es
precision highp float;
in vec2 v_texCoord;
uniform sampler2D u_particles;
uniform sampler2D u_prevField;
uniform float u_time;
uniform float u_delta;
uniform vec2 u_resolution;
uniform int u_sceneIndex;
uniform float u_sceneProgress;
uniform vec3 u_paletteBg;
uniform vec3 u_paletteFg;
uniform vec3 u_paletteAccent;
uniform vec3 u_paletteAccent2;
uniform vec3 u_paletteHighlight;
out vec4 fragColor;
float noise(vec2 p) {
  vec2 i = floor(p); vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = dot(i, vec2(12.9898, 78.233));
  float b = dot(i + vec2(1,0), vec2(12.9898, 78.233));
  float c = dot(i + vec2(0,1), vec2(12.9898, 78.233));
  float d = dot(i + vec2(1,1), vec2(12.9898, 78.233));
  float n1 = fract(sin(a) * 43758.5453);
  float n2 = fract(sin(b) * 43758.5453);
  float n3 = fract(sin(c) * 43758.5453);
  float n4 = fract(sin(d) * 43758.5453);
  return mix(mix(n1, n2, f.x), mix(n3, n4, f.x), f.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += a * noise(p); p *= 2.0; a *= 0.5;
  }
  return v;
}
vec3 hsv2rgb(vec3 c) {
  vec3 rgb = clamp(abs(mod(c.x * 6.0 + vec3(0,4,2), 6.0) - 3.0) - 1.0, 0.0, 1.0);
  rgb = rgb * rgb * (3.0 - 2.0 * rgb);
  return mix(vec3(1.0), rgb, c.y) * c.z;
}
void main() {
  vec2 uv = v_texCoord;
  vec4 particleData = texture(u_particles, uv);
  float density = particleData.r;
  vec3 baseCol = u_paletteBg;
  if (u_sceneIndex == 0) {
    float n = fbm(uv * 8.0 + u_time * 0.1);
    float band = sin(uv.y * 20.0 + u_time * 2.0 + n * 3.0) * 0.5 + 0.5;
    vec3 c1 = hsv2rgb(vec3(0.08, 0.6, 0.4));
    vec3 c2 = hsv2rgb(vec3(0.12, 0.5, 0.6));
    vec3 c3 = u_paletteAccent;
    baseCol = mix(mix(c1, c2, band), c3, density * 0.5);
    baseCol += u_paletteHighlight * density * 0.3;
    float vignette = 1.0 - length(uv - 0.5) * 1.2;
    baseCol *= vignette;
  } else if (u_sceneIndex == 1) {
    vec2 p = uv * 10.0;
    float rd = texture(u_prevField, uv).r;
    float laplace = (texture(u_prevField, uv + vec2(1.0/u_resolution.x, 0.0)).r +
                     texture(u_prevField, uv - vec2(1.0/u_resolution.x, 0.0)).r +
                     texture(u_prevField, uv + vec2(0.0, 1.0/u_resolution.y)).r +
                     texture(u_prevField, uv - vec2(0.0, 1.0/u_resolution.y)).r - 4.0 * rd);
    float f = texture(u_prevField, uv + vec2(0.001, 0.0)).g;
    float k1 = 0.055, k2 = 0.062;
    float rdNew = rd + (k1 * (1.0 - rd) - k2 * rd * f) * u_delta * 60.0;
    float fNew = f + (k2 * rd * f - k1 * f) * u_delta * 60.0 + laplace * 0.1 * u_delta * 60.0;
    float pattern = sin(p.x + u_time * 0.5) * cos(p.y - u_time * 0.3) + sin(p.y * 0.7 + u_time * 0.4);
    pattern = pattern * 0.5 + 0.5;
    vec3 cA = hsv2rgb(vec3(0.55 + pattern * 0.15, 0.7, 0.5));
    vec3 cB = hsv2rgb(vec3(0.95 - pattern * 0.1, 0.6, 0.6));
    baseCol = mix(cA, cB, rdNew);
    baseCol += u_paletteAccent2 * fNew * 0.4;
    baseCol *= 0.3 + 0.7 * (1.0 - length(uv - 0.5) * 1.5);
  } else {
    float rings = length(uv - 0.5) * 30.0;
    float angle = atan(uv.y - 0.5, uv.x - 0.5);
    float pattern = sin(rings + angle * 6.0 + u_time * 0.5) * 0.5 + 0.5;
    pattern = pow(pattern, 2.0);
    vec3 crystal = hsv2rgb(vec3(0.75 + pattern * 0.1, 0.3, 0.6 + pattern * 0.3));
    vec3 voidCol = u_paletteBg;
    baseCol = mix(voidCol, crystal, pattern * (1.0 - u_sceneProgress * 0.5));
    baseCol += u_paletteHighlight * density * 0.4 * (1.0 - u_sceneProgress);
    float vignette = 1.0 - pow(length(uv - 0.5) * 1.4, 2.0);
    baseCol *= vignette;
  }
  vec3 prev = texture(u_prevField, uv).rgb;
  float blend = 0.92;
  baseCol = mix(baseCol, prev, blend);
  baseCol = pow(baseCol, vec3(0.95));
  fragColor = vec4(baseCol, 1.0);
}
</script>

<script id="shader-composite-frag" type="x-shader/x-fragment">
#version 300 es
precision highp float;
in vec2 v_texCoord;
uniform sampler2D u_field;
uniform sampler2D u_particles;
uniform float u_time;
uniform float u_exposure;
uniform float u_gamma;
uniform vec3 u_paletteBg;
uniform vec3 u_paletteFg;
out vec4 fragColor;
float rand(vec2 co) { return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453); }
float filmGrain(vec2 uv, float t) { return rand(uv * 100.0 + floor(t * 60.0)) * 2.0 - 1.0; }
vec3 acesFilm(vec3 x) {
  const mat3 ACESInputMat = mat3(
    0.59719, 0.35458, 0.04823,
    0.07600, 0.90834, 0.01566,
    0.02840, 0.13383, 0.83777
  );
  const mat3 ACESOutputMat = mat3(
    1.60475, -0.53108, -0.07367,
    -0.10208, 1.10813, -0.00605,
    -0.00327, -0.07276, 1.07602
  );
  x = ACESInputMat * x;
  x = (x * (x * 2.51 + 0.03)) / (x * (x * 2.43 + 0.59) + 0.14);
  return ACESOutputMat * x;
}
void main() {
  vec3 fieldCol = texture(u_field, v_texCoord).rgb;
  vec4 particleCol = texture(u_particles, v_texCoord);
  vec3 col = fieldCol + particleCol.rgb * particleCol.a;
  float grain = filmGrain(v_texCoord, u_time) * 0.008;
  col += grain;
  col *= u_exposure;
  col = acesFilm(col);

      if (eInTrans) {
        eTransProg += eDt / config.transitionDuration;
        if (eTransProg >= 1) { eInTrans = false; eSceneIdx++; eSceneTime = 0; eTransProg = 0; }
        eSceneProg = easeInOutCubic(eTransProg);
      } else { eSceneProg = eSceneTime / durations[eSceneIdx]; }
      exportGl.bindFramebuffer(exportGl.FRAMEBUFFER, eParticleFBO);
      exportGl.viewport(0, 0, eW, eH);
      exportGl.clearColor(0,0,0,0); exportGl.clear(exportGl.COLOR_BUFFER_BIT);
      exportGl.useProgram(exportParticleProgram);
      exportGl.bindVertexArray(eParticleVAO);
      exportGl.uniform1f(exportGl.getUniformLocation(exportParticleProgram, 'u_time'), eTime);
      exportGl.uniform1f(exportGl.getUniformLocation(exportParticleProgram, 'u_delta'), eDt);
      exportGl.uniform2f(exportGl.getUniformLocation(exportParticleProgram, 'u_resolution'), eW, eH);
      exportGl.uniform1f(exportGl.getUniformLocation(exportParticleProgram, 'u_sceneProgress'), eSceneProg);
      exportGl.uniform1i(exportGl.getUniformLocation(exportParticleProgram, 'u_sceneIndex'), eSceneIdx);
      exportGl.uniform2f(exportGl.getUniformLocation(exportParticleProgram, 'u_mouse'), eW*0.5, eH*0.5);
      exportGl.uniform1f(exportGl.getUniformLocation(exportParticleProgram, 'u_mouseForce'), 0);
      exportGl.uniform1ui(exportGl.getUniformLocation(exportParticleProgram, 'u_seed'), seed);
      exportGl.enable(exportGl.BLEND);
      exportGl.blendFunc(exportGl.SRC_ALPHA, exportGl.ONE);
      exportGl.drawArrays(exportGl.POINTS, 0, particleCount);
      exportGl.disable(exportGl.BLEND);
      exportGl.bindVertexArray(null);
      exportGl.bindFramebuffer(exportGl.FRAMEBUFFER, eFieldFBOB);
      exportGl.useProgram(exportFieldProgram);
      exportGl.bindVertexArray(exportQuadVAO);
      exportGl.activeTexture(exportGl.TEXTURE0);
      exportGl.bindTexture(exportGl.TEXTURE_2D, eParticleTex);
      exportGl.uniform1i(exportGl.getUniformLocation(exportFieldProgram, 'u_particles'), 0);
      exportGl.activeTexture(exportGl.TEXTURE1);
      exportGl.bindTexture(exportGl.TEXTURE_2D, eFieldTexA);
      exportGl.uniform1i(exportGl.getUniformLocation(exportFieldProgram, 'u_prevField'), 1);
      exportGl.uniform1f(exportGl.getUniformLocation(exportFieldProgram, 'u_time'), eTime);
      exportGl.uniform1f(exportGl.getUniformLocation(exportFieldProgram, 'u_delta'), eDt);
      exportGl.uniform2f(exportGl.getUniformLocation(exportFieldProgram, 'u_resolution'), eW, eH);
      exportGl.uniform1i(exportGl.getUniformLocation(exportFieldProgram, 'u_sceneIndex'), eSceneIdx);
      exportGl.uniform1f(exportGl.getUniformLocation(exportFieldProgram, 'u_sceneProgress'), eSceneProg);
      exportGl.uniform3fv(exportGl.getUniformLocation(exportFieldProgram, 'u_paletteBg'), palette.bg);
      exportGl.uniform3fv(exportGl.getUniformLocation(exportFieldProgram, 'u_paletteFg'), palette.fg);
      exportGl.uniform3fv(exportGl.getUniformLocation(exportFieldProgram, 'u_paletteAccent'), palette.accent);
      exportGl.uniform3fv(exportGl.getUniformLocation(exportFieldProgram, 'u_paletteAccent2'), palette.accent2);
      exportGl.uniform3fv(exportGl.getUniformLocation(exportFieldProgram, 'u_paletteHighlight'), palette.highlight);
      exportGl.drawArrays(exportGl.TRIANGLES, 0, 6);
      exportGl.bindVertexArray(null);
      exportGl.bindFramebuffer(exportGl.FRAMEBUFFER, null);
      [eFieldTexA, eFieldTexB] = [eFieldTexB, eFieldTexA];
      [eFieldFBOA, eFieldFBOB] = [eFieldFBOB, eFieldFBOA];
    }
    exportGl.bindFramebuffer(exportGl.FRAMEBUFFER, null);
    exportGl.viewport(0, 0, eW, eH);
    exportGl.useProgram(exportCompositeProgram);
    exportGl.bindVertexArray(exportQuadVAO);
    exportGl.activeTexture(exportGl.TEXTURE0);
    exportGl.bindTexture(exportGl.TEXTURE_2D, eFieldTexA);
    exportGl.uniform1i(exportGl.getUniformLocation(exportCompositeProgram, 'u_field'), 0);
    exportGl.activeTexture(exportGl.TEXTURE1);
    exportGl.bindTexture(exportGl.TEXTURE_2D, eParticleTex);
    exportGl.uniform1i(exportGl.getUniformLocation(exportCompositeProgram, 'u_particles'), 1);
    exportGl.uniform1f(exportGl.getUniformLocation(exportCompositeProgram, 'u_time'), eTime);
    exportGl.uniform1f(exportGl.getUniformLocation(exportCompositeProgram, 'u_exposure'), 1.15);
    exportGl.uniform1f(exportGl.getUniformLocation(exportCompositeProgram, 'u_gamma'), 2.2);
    exportGl.uniform3fv(exportGl.getUniformLocation(exportCompositeProgram, 'u_paletteBg'), palette.bg);
    exportGl.uniform3fv(exportGl.getUniformLocation(exportCompositeProgram, 'u_paletteFg'), palette.fg);
    exportGl.drawArrays(exportGl.TRIANGLES, 0, 6);
    exportGl.bindVertexArray(null);
    exportCanvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `chronos-${seed.toString(16)}-${Date.now()}.png`;
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  }
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      canvas.requestFullscreen().catch(()=>{});
      document.getElementById('btn-fullscreen').textContent = '⛶ Exit FS';
    } else {
      document.exitFullscreen();
      document.getElementById('btn-fullscreen').textContent = '⛶ Fullscreen';
    }
  }
  function hideUI() { document.getElementById('ui').classList.add('hidden'); }
  function showUI() { document.getElementById('ui').classList.remove('hidden'); }
  let uiHideTimer = null;
  function scheduleUIHide() {
    clearTimeout(uiHideTimer);
    uiHideTimer = setTimeout(hideUI, 3000);
  }
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) / rect.width;
    mouse.y = (e.clientY - rect.top) / rect.height;
    showUI(); scheduleUIHide();
  });
  canvas.addEventListener('mouseleave', () => { targetMouseForce = 0; });
  canvas.addEventListener('mousedown', () => { targetMouseForce = 1; });
  canvas.addEventListener('mouseup', () => { targetMouseForce = 0; });
  canvas.addEventListener('touchstart', e => {
    if (e.touches[0]) {
      const rect = canvas.getBoundingClientRect();
      mouse.x = (e.touches[0].clientX - rect.left) / rect.width;
      mouse.y = (e.touches[0].clientY - rect.top) / rect.height;
      targetMouseForce = 1;
      showUI(); scheduleUIHide();
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (e.touches[0]) {
      const rect = canvas.getBoundingClientRect();
      mouse.x = (e.touches[0].clientX - rect.left) / rect.width;
      mouse.y = (e.touches[0].clientY - rect.top) / rect.height;
    }
  }, { passive: true });
  canvas.addEventListener('touchend', () => { targetMouseForce = 0; });
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    switch (e.code) {
      case 'Space': e.preventDefault(); running = !running; document.getElementById('btn-play').textContent = running ? '⏸ Pause' : '▶ Play'; break;
      case 'KeyR': reseed(); break;
      case 'KeyF': toggleFullscreen(); break;
      case 'KeyE': exportPNG(); break;
      case 'KeyA': toggleAudio(); break;
      case 'KeyH': document.getElementById('ui').classList.toggle('hidden'); break;
      case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4': case 'Digit5':
        setPalette(config.palettes[parseInt(e.code[5]) - 1]); break;
    }
  });
  document.getElementById('btn-play').addEventListener('click', () => { running = !running; document.getElementById('btn-play').textContent = running ? '⏸ Pause' : '▶ Play'; });
  document.getElementById('btn-reseed').addEventListener('click', () => reseed());
  document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);
  document.getElementById('btn-export').addEventListener('click', exportPNG);
  document.getElementById('btn-audio').addEventListener('click', toggleAudio);
  document.getElementById('seed-input').addEventListener('change', e => {
    const val = parseInt(e.target.value, 16);
    if (!isNaN(val)) reseed(val >>> 0);
  });
  document.addEventListener('fullscreenchange', () => {
    document.getElementById('btn-fullscreen').textContent = document.fullscreenElement ? '⛶ Exit FS' : '⛶ Fullscreen';
    setTimeout(resize, 100);
  });
  window.addEventListener('resize', resize);
  function createTexture(gl, w, h, fmt = gl.RGBA32F, type = gl.FLOAT) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, fmt, w, h, 0, gl.RGBA, type, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAX_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tex;
  }
  function createFBO(gl, tex) {
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return fbo;
  }
  seed = seedFromHash();
  document.getElementById('seed-input').value = seed.toString(16).padStart(8, '0');
  resize();
  initParticles(particleCount, seed);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fieldFBOA);
  gl.viewport(0, 0, width, height);
  gl.clearColor(palette.bg[0], palette.bg[1], palette.bg[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fieldFBOB);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  scheduleUIHide();
  requestAnimationFrame(frame);
})();
</script>
