  if(f) importImage(f);
});
function importImage(f){
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      commitFloat();
      let w=doc.w, h=doc.h, ox=Math.floor((doc.w-img.width)/2), oy=Math.floor((doc.h-img.height)/2);
      if(img.width>doc.w||img.height>doc.h){
        /* expand canvas so nothing is lost, centring old content */
        const nw=Math.max(doc.w,img.width), nh=Math.max(doc.h,img.height);
        const cx=Math.floor((nw-doc.w)/2), cy=Math.floor((nh-doc.h)/2);
        structOp(()=>{
          doc.frames.forEach((fr,fi)=>{
            doc.layers.forEach((L,li)=>{
              const c=getCel(li,fi);
              if(!c) return;
              const nc=mkCanvas(nw,nh);
              celCtx(nc).drawImage(c,cx,cy);
              doc.cels.get(L.id).set(fr.id,nc);
            });
          });
          doc.w=nw; doc.h=nh;
          ox=Math.floor((nw-img.width)/2); oy=Math.floor((nh-img.height)/2);
          comp=mkCanvas(nw,nh); compCtx=celCtx(comp); compValid=false;
        });
        toast('Canvas grew to '+nw+'×'+nh+' to fit the image');
        w=nw; h=nh;
      }
      structOp(()=>{
        const L={id:newId('L'), name:f.name? f.name.replace(/\.[^.]+$/,'').slice(0,24)||'imported':'imported', visible:true, opacity:1, locked:false};
        doc.layers.splice(cur.li+1,0,L);
        const m=new Map();
        doc.cels.set(L.id,m);
        const c=mkCanvas(doc.w,doc.h);
        celCtx(c).drawImage(img,ox,oy);
        m.set(doc.frames[cur.fi].id,c);
        touchCel(c);
        cur.li=cur.li+1;
      });
      fitView();
      toast('Imported “'+(L_lastName(f))+'” as a new layer','good');
      Sfx.ok();
      scheduleAutosave();
    };
    img.onerror=()=>{ toast('Could not decode that image','warn'); };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}
function L_lastName(f){ return f&&f.name? f.name : 'image'; }

/* --- GIF89a encoder (global 256-color table, LZW, Netscape loop) --- */
function gifEncode(framesRGBA,w,h,delaysMs,transparent){
  const frames=framesRGBA.length;
  const useT=!!transparent;
  const maxColors=useT?255:256;
  /* palette from frequency */
  const freq=new Map();
  for(const fr of framesRGBA){
    for(let i=0;i<fr.length;i+=4){
      if(useT&&fr[i+3]<128) continue;
      const k=(fr[i]<<16)|(fr[i+1]<<8)|fr[i+2];
      freq.set(k,(freq.get(k)||0)+1);
    }
  }
  const sorted=[...freq.entries()].sort((a,b)=>b[1]-a[1]);
  const pal=sorted.slice(0,maxColors).map(e=>e[0]);
  if(!pal.length) pal.push(0);
  const lut=new Map(pal.map((c,i)=>[c,useT?i+1:i]));
  function idxFor(k){
    let ix=lut.get(k);
    if(ix!==undefined) return ix;
    let best=0,bd=1e12;
    const r=(k>>16)&255,g=(k>>8)&255,b=k&255;
    for(let i=0;i<pal.length;i++){
      const c=pal[i];
      const dr=r-((c>>16)&255), dg=g-((c>>8)&255), db=b-(c&255);
      const dd=dr*dr+dg*dg+db*db;
      if(dd<bd){bd=dd;best=i;}
    }
    return useT? best+1 : best;
  }
  const indexed=framesRGBA.map(fr=>{
    const out=new Uint8Array(w*h);
    for(let i=0,p=0;i<fr.length;i+=4,p++){
      out[p]=(useT&&fr[i+3]<128)? 0 : idxFor((fr[i]<<16)|(fr[i+1]<<8)|fr[i+2]);
    }
    return out;
  });
  /* bytes */
  const bytes=[];
  const push=(...a)=>{ for(const v of a) bytes.push(v&255); };
  const push16=v=>{ push(v&255,(v>>8)&255); };
  push(71,73,70,56,57,97);           // GIF89a
  push16(w); push16(h);
  push(0x80|0x70|0x07);              // GCT, 256 entries
  push(0,0);                         // bg index 0, aspect 0
  for(let i=0;i<256;i++){            // global color table
    if(i===0&&useT){ push(0,0,0); continue; }
    const pi=useT? i-1 : i;
    if(pi<pal.length){ const c=pal[pi]; push((c>>16)&255,(c>>8)&255,c&255); }
    else push(0,0,0);
  }
  /* Netscape looping extension */
  push(0x21,0xFF,0x0B);
  for(const ch of 'NETSCAPE2.0') push(ch.charCodeAt(0));
  push(0x03,0x01); push16(0); push(0x00);
  /* frames */
  for(let f=0;f<frames;f++){
    const delay=clamp(Math.round(delaysMs[f]/10),2,6553);
    push(0x21,0xF9,0x04);
    push(useT?0x05:0x04);            // disposal 1 (+ transparency)
    push16(delay);
    push(useT?0:255); push(0x00);
    push(0x2C); push16(0); push16(0); push16(w); push16(h); push(0x00);
    push(8);                         // LZW minimum code size
    const data=lzwEncode(indexed[f],8);
    for(let i=0;i<data.length;i+=255){
      const chunk=data.subarray? data.subarray(i,Math.min(data.length,i+255)) : data.slice(i,Math.min(data.length,i+255));
      push(chunk.length);
      for(const v of chunk) push(v);
    }
    push(0x00);
  }
  push(0x3B);
  return new Uint8Array(bytes);
}
function lzwEncode(px,minCode){
  const initBits=minCode+1, clear=1<<minCode, eoi=clear+1;
  let nBits=initBits, maxCode=(1<<initBits)-1;
  let freeEnt=eoi+1;
  let dict=new Map();
  const out=new Uint8Array(4096*3+px.length*4);
  let ob=0, acc=0, accBits=0;
  const emit=code=>{
    acc|=code<<accBits;
    accBits+=nBits;
    while(accBits>=8){
      out[ob++]=acc&255;
      acc>>>=8; accBits-=8;
    }
    if(freeEnt>maxCode&&nBits<12){ nBits++; maxCode=(1<<nBits)-1; }
  };
  emit(clear);
  let prefix=px[0];
  for(let i=1;i<px.length;i++){
    const k=px[i];
    const key=(prefix<<8)|k;
    const hit=dict.get(key);
    if(hit!==undefined){ prefix=hit; continue; }
    emit(prefix);
    if(freeEnt<4096){
      dict.set(key,freeEnt++);
    }else{
      emit(clear);
      dict=new Map();
      nBits=initBits; maxCode=(1<<initBits)-1; freeEnt=eoi+1;
    }
    prefix=k;
  }
  emit(prefix);
  emit(eoi);
  if(accBits>0) out[ob++]=acc&255;
  return out.subarray(0,ob);
}
function collectFramesRGBA(){
  const frames=[];
  for(let fi=0;fi<doc.frames.length;fi++){
    const c=mkCanvas(doc.w,doc.h);
    compositeFrame(fi,c);
    frames.push(celCtx(c).getImageData(0,0,doc.w,doc.h).data);
  }
  return frames;
}
function exportGIF(transparent,scale){
  const w=doc.w*scale, h=doc.h*scale;
  const frames=[];
  for(let i=0;i<doc.frames.length;i++){
    const c=frameCanvas(i,scale);
    frames.push(celCtx(c).getImageData(0,0,w,h).data);
  }
  const bytes=gifEncode(frames,w,h,doc.frames.map(f=>f.dur),transparent);
  download(new Blob([bytes],{type:'image/gif'}),slug()+'.gif');
  toast('Exported '+slug()+'.gif — '+doc.frames.length+' frames'+(scale>1?' @ '+scale+'x':'')+' ('+fmtKB(bytes.length)+')','good');
  Sfx.ok();
}

}

/* ==================================================================
   23 · the sample sprite — “EMBER”, generated in code
   ================================================================== */
function buildSampleDoc(name){
  newDoc({w:32,h:32,name:name||'ember-32'});
  (function build(){
    /* layer order bottom→top: glow, flame, outline */
    doc.layers=[
      {id:newId('L'),name:'glow',visible:true,opacity:.85,locked:false},
      {id:newId('L'),name:'flame',visible:true,opacity:1,locked:false},
      {id:newId('L'),name:'outline',visible:true,opacity:1,locked:false},
    ];
    doc.frames=[0,1,2,3].map(i=>({id:newId('F'),dur:130}));
    doc.cels=new Map();
    doc.layers.forEach(L=>doc.cels.set(L.id,new Map()));
    const C={
      outline:{r:22,g:16,b:13,a:255},
      deep:{r:110,g:36,b:24,a:255},
      red:{r:160,g:51,b:35,a:255},
      burnt:{r:194,g:81,b:44,a:255},
      orange:{r:232,g:118,b:58,a:255},
      amber:{r:255,g:157,b:69,a:255},
      gold:{r:255,g:211,b:148,a:255},
      cream:{r:255,g:246,b:230,a:255},
      glow:{r:255,g:157,b:69,a:150},
      glow2:{r:255,g:157,b:69,a:70},
    };
    /* flame silhouette: half-width per row, 23 rows, tip→base */
    const W=[0,1,1,1,1,2,2,2,3,3,4,4,5,5,5,5,5,5,4,4,3,2,1];
    const rows=W.length;             // 23
    const topY=4;
    const band=dy=>{
      if(dy<=1) return C.deep;
      if(dy<=4) return C.red;
      if(dy<=8) return C.burnt;
      if(dy<=12) return C.orange;
      if(dy<=16) return C.amber;
      if(dy<=19) return C.gold;
      return C.cream;
    };
    const sway=[0,1,0,-1];
    const bob=[0,1,0,-1];
    for(let f=0;f<4;f++){
      const dy0=topY+bob[f];
      const flame=[];
      /* body pixels */
      for(let dy=0;dy<rows;dy++){
        const y=dy0+dy;
        if(y<0||y>=32) continue;
        const wob=(dy<8)? sway[f]*(dy<4?1:1) : 0;
        const cx=16+wob;
        const hw=W[dy];
        for(let x=cx-hw;x<=cx+hw;x++){
          if(x<0||x>=32) continue;
          let col=band(dy);
          /* dithered transitions exactly on band boundaries */
          const prevCol=dy>0? band(dy-1):null;
          if(prevCol&&prevCol!==col&&bayer(x,y,0.5)) col=prevCol;
          /* edge shading: roundness */
          if((x===cx-hw||x===cx+hw)&&dy>3&&dy<rows-2) col=band(Math.min(rows-1,dy+2));
          flame.push({x,y,col});
        }
      }
      /* eyes (blink on frame 2) */
      const eyeY=dy0+14;
      const blink=f===2;
      const eyes=[
        {x:13,y:eyeY},{x:13,y:eyeY+1},
        {x:18,y:eyeY},{x:18,y:eyeY+1},
      ];
      /* outline layer: 4-neighbors of body */
      const bodySet=new Set(flame.map(p=>p.x+'_'+p.y));
      const ol=[];
      for(const p of flame){
        for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nx=p.x+d[0], ny=p.y+d[1];
          if(nx<0||ny<0||nx>=32||ny>=32) continue;
          if(bodySet.has(nx+'_'+ny)) continue;
          ol.push({x:nx,y:ny});
        }
      }
      /* sparks rising above the tail */
      const sparks=[
        [{x:19,y:3},{x:13,y:5}],
        [{x:21,y:2},{x:12,y:4}],
        [{x:18,y:3},{x:14,y:1}],
        [{x:22,y:4},{x:11,y:3}],
      ][f];
      /* write cels */
      const gM=doc.cels.get(doc.layers[0].id);
      const fM=doc.cels.get(doc.layers[1].id);
      const oM=doc.cels.get(doc.layers[2].id);
      const gl=mkCanvas(32,32), fl=mkCanvas(32,32), olc=mkCanvas(32,32);
      const gg=celCtx(gl), fg=celCtx(fl), og=celCtx(olc);
      for(const p of flame){ fg.fillStyle=rgbaCss(p.col); fg.fillRect(p.x,p.y,1,1); }
      for(const e of eyes){ fg.fillStyle=rgbaCss(C.outline); fg.fillRect(e.x,e.y,1,blink?1:2); }
      for(const p of ol){ og.fillStyle=rgbaCss(C.outline); og.fillRect(p.x,p.y,1,1); }
      /* glow: pixels within distance 1–2 outside the outline */
      const outSet=new Set(ol.map(p=>p.x+'_'+p.y));
      const glowSet=new Set([...bodySet,...outSet]);
      for(const p of ol){
        for(let ddy=-2;ddy<=2;ddy++)for(let ddx=-2;ddx<=2;ddx++){
          const nx=p.x+ddx, ny=p.y+ddy;
          if(nx<0||ny<0||nx>=32||ny>=32) continue;
          if(glowSet.has(nx+'_'+ny)) continue;
          const d=Math.max(Math.abs(ddx),Math.abs(ddy));
          const col=(d===1)? C.glow : C.glow2;
          if(d===2&&!bayer(nx,ny,0.5)) continue;
          gg.fillStyle=rgbaCss(col);
          gg.fillRect(nx,ny,1,1);
          glowSet.add(nx+'_'+ny);
        }
      }
      for(const s of sparks){ fg.fillStyle=rgbaCss(s.y%2?C.gold:C.amber); fg.fillRect(s.x,s.y,1,1); }
      gM.set(doc.frames[f].id,gl);
      fM.set(doc.frames[f].id,fl);
      oM.set(doc.frames[f].id,olc);
      touchCel(gl); touchCel(fl); touchCel(olc);
    }
    S.grid=false;
  })();
  afterStructural();
  compValid=false;
  refreshAll();
}

/* ==================================================================
   24 · boot
   ================================================================== */
function refreshAll(){
  if(!doc) return;
  refreshLayersPanel();
  refreshFramesPanel();
  refreshDocInfo();
  refreshUndoUI();
  buildOptionsBar();
  syncChips();
  syncColorUI();
  invalidate();
  needsRender=true;
  statusDirty=true;
}
function boot(){
  $('wordmark').innerHTML=wordmarkSVG();
  scrCtx=screen.getContext('2d');
  loadSettings();
  Sfx.on=S.sound;
  buildPalSelect();
  /* icon pass for static buttons */
  [['btnUndo','undo'],['btnRedo','redo'],['btnOpen','open'],['btnImport','image'],['btnSave','save'],
   ['btnExport','exportd'],['btnHelp','help'],['layAdd','plus'],['layDup','copy'],['layMerge','layersi'],
   ['layDel','trash'],['frmPlay','play'],['frmAdd','plus'],['frmDup','copy'],['frmDel','trash'],
   ['frmLeft','left'],['frmRight','right']].forEach(([id,name])=>{ $(id).innerHTML=icn(name); });
  $('sndBtn').innerHTML=icn(S.sound?'soundon':'soundoff');
  $('sndBtn').classList.toggle('on',S.sound);
  buildToolbar();
  buildMenubar();
  buildOptionsBar();
  const restored=tryRestore();
  if(!restored){
    buildSampleDoc('ember-32');
    if(!RM) setPlaying(true);
  }else{
    $('restorebar').classList.remove('hidden');
  }
  syncColorUI();
  refreshAll();
  fitView();
  requestAnimationFrame(tick);
  if(!restored) setTimeout(()=>toast('Welcome to OXIDE — press ? for shortcuts'),600);
}
$('rbKeep').addEventListener('click',()=>{ $('restorebar').classList.add('hidden'); toast('Working with the restored project'); });
$('rbDiscard').addEventListener('click',()=>{
  $('restorebar').classList.add('hidden');
  buildSampleDoc('ember-32');
  if(!RM) setPlaying(true);
  fitView();
  flushAutosave();
  toast('Fresh start — the ember sample is on the canvas');
});

/* test hooks (harmless in production, used for automated verification) */
window.__oxide={
  doc:()=>doc, state:S, view, cur:()=>cur, sel:()=>sel, float:()=>float,
  tools:TOOLS,
  undoStack:()=>undoStack.length,
  redoStack:()=>redoStack.length,
  render,
  tickOnce(t){ tick(t||performance.now()); },
  paint(x,y){ const p={x,y}; if(beginStroke(cur.li,cur.fi,S.pri,'pencil')){ pencilTo(p,false); commitStroke(); } },
  setTool,
  fit:fitView,
  play:v=>setPlaying(v),
  exportGIFBlob(){
    const frames=collectFramesRGBA();
    const bytes=gifEncode(frames,doc.w,doc.h,doc.frames.map(f=>f.dur),true);
    return new Blob([bytes],{type:'image/gif'});
  },
  async testGifRoundtrip(){
    const frames=collectFramesRGBA();
    const bytes=gifEncode(frames,doc.w,doc.h,doc.frames.map(f=>f.dur),true);
    const blob=new Blob([bytes],{type:'image/gif'});
    const url=URL.createObjectURL(blob);
    try{
      const img=new Image();
      img.src=url;
      await img.decode();
      const c=mkCanvas(doc.w,doc.h);
      celCtx(c).drawImage(img,0,0);
      const got=celCtx(c).getImageData(0,0,doc.w,doc.h).data;
      let bad=0, checked=0;
      const src=frames[0];
      for(let i=0;i<src.length;i+=4){
        const transparent=src[i+3]<128;
        checked++;
        if(transparent){ if(got[i+3]!==0) bad++; continue; }
        const dr=Math.abs(got[i]-src[i]), dg=Math.abs(got[i+1]-src[i+1]), db=Math.abs(got[i+2]-src[i+2]);
        if(dr>12||dg>12||db>12) bad++;
      }
      return {ok:bad===0, bad, checked, bytes:bytes.length, w:img.width, h:img.height};
    }finally{ URL.revokeObjectURL(url); }
  },
  errors:[],
};

boot();


})();
