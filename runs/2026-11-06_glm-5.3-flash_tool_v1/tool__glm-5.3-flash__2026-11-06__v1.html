<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Ember — Pixel Studio</title>
<style>
:root{
  --bg0:#131009; --bg1:#1a1610; --bg2:#211c14; --bg3:#2b2418; --bg4:#37301f;
  --line:#332a1c; --line2:#4a3d26;
  --ink:#eee3cd; --dim:#a8977c; --faint:#6f5f47;
  --acc:#ffb454; --acc2:#ff8a3c; --hot:#ef5a2a; --good:#a5c261; --info:#6fb3d9; --bad:#e0604a;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --rad:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:12px/1.45 var(--mono); color:var(--ink); background:var(--bg1);
  display:grid; grid-template-rows:44px 1fr 26px; overflow:hidden;
  -webkit-user-select:none; user-select:none;
}
::selection{background:var(--acc);color:#1a1206}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
kbd{font:10px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;background:var(--bg2);border-radius:3px;padding:1px 5px;color:var(--dim)}
svg{display:block}

/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--bg3);border:3px solid var(--bg1);border-radius:6px}
*::-webkit-scrollbar-thumb:hover{background:var(--bg4)}
*::-webkit-scrollbar-corner{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--bg3) var(--bg1)}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--line);z-index:20}
#brand{display:flex;align-items:center;gap:8px;margin-right:6px}
#brand b{font-size:12px;letter-spacing:.22em;color:var(--ink)}
#brand span{font-size:9px;letter-spacing:.28em;color:var(--faint)}
#brand svg{filter:drop-shadow(0 0 6px rgba(255,138,60,.35))}
.tsep{width:1px;height:20px;background:var(--line);margin:0 6px;flex:none}
#docWrap{flex:1;display:flex;justify-content:center;min-width:0}
#docName{font-size:11.5px;color:var(--dim);padding:4px 10px;border-radius:4px;cursor:text;max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#docName:hover{color:var(--ink);background:var(--bg3)}
#docName input{width:100%;background:var(--bg0);border:1px solid var(--acc);border-radius:3px;padding:2px 6px;outline:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;min-width:30px;padding:0 7px;border-radius:var(--rad);color:var(--dim);border:1px solid transparent;position:relative;flex:none}
.btn:hover{background:var(--bg3);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.on{color:var(--acc);background:rgba(255,180,84,.10);border-color:rgba(255,180,84,.30)}
.btn.accent{background:var(--acc);color:#221503;border-color:var(--acc);font-weight:700}
.btn.accent:hover{background:var(--acc2);border-color:var(--acc2);color:#221503}
.btn svg{width:16px;height:16px}
#unsaved{width:6px;height:6px;border-radius:50%;background:var(--acc);display:none;margin-left:6px;flex:none}
#unsaved.show{display:block}

/* ---------- tooltips ---------- */
[data-tip]{position:relative}
[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 7px);
  background:#0d0a06;border:1px solid var(--line2);color:var(--ink);font-size:10.5px;line-height:1;
  padding:6px 8px;border-radius:4px;white-space:nowrap;z-index:80;pointer-events:none;
  animation:tipIn .12s .4s both;box-shadow:0 4px 14px rgba(0,0,0,.5);
}
[data-tipdir="down"]:hover::after{bottom:auto;top:calc(100% + 7px)}
@keyframes tipIn{from{opacity:0;translate:0 2px}to{opacity:1;translate:0 0}}

/* ---------- main ---------- */
#main{display:grid;grid-template-columns:48px 1fr 266px;min-height:0}
#rail{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;z-index:10}
#rail .btn{width:36px;height:34px}
#rail .btn svg{width:17px;height:17px}
#rail .rsep{width:26px;height:1px;background:var(--line);margin:6px 0;flex:none}
#rail .key{position:absolute;right:2px;bottom:1px;font-size:7.5px;color:var(--faint);pointer-events:none}
#rail .btn.on .key{color:var(--acc)}

#center{display:grid;grid-template-rows:38px 1fr 104px;min-width:0;min-height:0}

/* options bar */
#opts{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg1);border-bottom:1px solid var(--line)}
#optsTool{font-size:10px;letter-spacing:.22em;color:var(--acc);text-transform:uppercase;min-width:72px}
#optsBody{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
#optsBody:empty::before{content:"—";color:var(--faint)}
#optsRight{display:flex;gap:2px;flex:none}
.chip{height:22px;min-width:22px;padding:0 7px;border:1px solid var(--line);border-radius:3px;color:var(--dim);font-size:11px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip.on{color:var(--acc);border-color:rgba(255,180,84,.45);background:rgba(255,180,84,.08)}
.chip svg{width:13px;height:13px}
.chip:disabled{opacity:.4;pointer-events:none}
.olabel{font-size:9.5px;color:var(--faint);letter-spacing:.12em;margin-right:-2px}

/* viewport */
#vpwrap{position:relative;min-width:0;min-height:0;background:var(--bg0);overflow:hidden}
#vp{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#vp[data-tool="hand"]{cursor:grab}
#vp.grabbing,#vp.grabbing *{cursor:grabbing!important}
#vp[data-tool="move"]{cursor:move}
#vp.drop{outline:2px dashed var(--acc);outline-offset:-8px}
#vp[data-tool="pencil"],#vp[data-tool="eraser"],#vp[data-tool="fill"],#vp[data-tool="line"],
#vp[data-tool="rect"],#vp[data-tool="ellipse"],#vp[data-tool="marquee"],#vp[data-tool="picker"]{cursor:crosshair}

/* timeline */
#timeline{display:flex;align-items:stretch;background:var(--bg1);border-top:1px solid var(--line);min-width:0}
#tlLeft{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px 10px;border-right:1px solid var(--line);flex:none}
#tlBtns{display:flex;gap:2px;align-items:center}
#tlBtns .btn{height:26px;min-width:26px}
#fpsRow{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--faint);letter-spacing:.1em}
#tlFps{width:40px;background:var(--bg0);border:1px solid var(--line);border-radius:3px;color:var(--ink);text-align:center;padding:2px 0;font-size:11px}
#tlFps:focus{outline:0;border-color:var(--acc)}
#frames{flex:1;display:flex;gap:6px;align-items:center;padding:8px 10px;overflow-x:auto;min-width:0}
.fthumb{flex:none;width:54px;border:1px solid var(--line);border-radius:4px;background:var(--bg2);padding:3px;cursor:pointer;position:relative}
.fthumb:hover{border-color:var(--line2)}
.fthumb.sel{border-color:var(--acc);background:rgba(255,180,84,.07)}
.fthumb canvas{width:46px;height:46px;image-rendering:pixelated;display:block;border-radius:2px;background:var(--bg0)}
.fthumb i{position:absolute;top:5px;right:5px;font-style:normal;font-size:8.5px;color:var(--faint);background:rgba(19,16,9,.8);padding:0 3px;border-radius:2px}
.fthumb.sel i{color:var(--acc)}
#tlRight{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px 10px;border-left:1px solid var(--line);flex:none}
#tlRight .row{display:flex;gap:2px}
#frameLabel{font-size:9.5px;color:var(--faint);letter-spacing:.1em;text-align:center}

/* ---------- right panel ---------- */
#panel{background:var(--bg2);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden;z-index:10}
.sec{border-bottom:1px solid var(--line)}
.sechead{width:100%;display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:10px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.sechead:hover{color:var(--ink);background:var(--bg3)}
.sechead .chev{margin-left:auto;transition:rotate .15s;color:var(--faint)}
.sec.closed .chev{rotate:-90deg}
.sec.closed .secbody{display:none}
.secbody{padding:2px 12px 12px}

/* color section */
#swRow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.swatch{width:34px;height:34px;border-radius:4px;border:1px solid var(--line2);position:relative;flex:none;
  background-image:conic-gradient(#4a443c 25%,#37322b 0 50%,#4a443c 0 75%,#37322b 0);background-size:10px 10px;cursor:pointer;padding:0}
.swatch i{position:absolute;inset:2px;border-radius:2px}
.swatch.target{outline:2px solid var(--acc);outline-offset:1px}
#hex{flex:1;min-width:0;background:var(--bg0);border:1px solid var(--line);border-radius:3px;padding:4px 7px;font-size:11px;letter-spacing:.06em}
#hex:focus{outline:0;border-color:var(--acc)}
#sv{width:100%;height:96px;border-radius:4px;cursor:crosshair;touch-action:none;display:block;border:1px solid var(--line)}
#hue{width:100%;height:14px;margin-top:8px;border-radius:7px;cursor:crosshair;touch-action:none;display:block;border:1px solid var(--line)}
.sliderRow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:9.5px;color:var(--faint);letter-spacing:.1em}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:16px;background:transparent;cursor:pointer;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--bg4);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;background:var(--acc);border-radius:3px;border:1px solid #1a1206}
input[type=range]::-moz-range-track{height:4px;background:var(--bg4);border-radius:2px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--acc);border-radius:3px;border:1px solid #1a1206}
#alphaRow input::-webkit-slider-runnable-track{background:repeating-conic-gradient(#4a443c 25%,#2a251d 0 50%) 0/8px 8px}

/* palette */
#palTop{display:flex;gap:6px;align-items:center;margin-bottom:8px}
#palPreset{flex:1;background:var(--bg0);border:1px solid var(--line);border-radius:3px;padding:3px 6px;font-size:11px}
#palPreset:focus{outline:0;border-color:var(--acc)}
#palGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:118px;overflow-y:auto;padding-right:2px}
.psw{aspect-ratio:1;border-radius:3px;border:1px solid rgba(0,0,0,.4);cursor:pointer;position:relative;min-width:0}
.psw:hover{outline:1px solid var(--ink);outline-offset:0}
.psw.p{outline:2px solid var(--acc);outline-offset:1px}
.psw.s::after{content:"";position:absolute;inset:2px;border:1px dashed rgba(255,255,255,.85);border-radius:2px}
#palBtns{display:flex;gap:2px;margin-top:8px}
#palBtns .btn{height:24px;min-width:24px}
#palBtns svg{width:13px;height:13px}

/* layers */
#layBtns{display:flex;gap:2px;margin-bottom:6px}
#layBtns .btn{height:24px;min-width:24px}
#layBtns svg{width:13px;height:13px}
#layList{display:flex;flex-direction:column;gap:2px;max-height:168px;overflow-y:auto;padding-right:2px}
.lrow{display:flex;align-items:center;gap:7px;padding:3px 5px;border:1px solid transparent;border-radius:4px;cursor:pointer}
.lrow:hover{background:var(--bg3)}
.lrow.sel{border-color:rgba(255,180,84,.4);background:rgba(255,180,84,.06)}
.lthumb{width:22px;height:22px;border-radius:2px;flex:none;border:1px solid var(--line);background-color:var(--bg0);
  background-image:conic-gradient(#3d3830 25%,#2c2820 0 50%,#3d3830 0 75%,#2c2820 0);background-size:8px 8px}
.lthumb canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.lname{flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow.sel .lname{color:var(--acc)}
.lname input{width:100%;background:var(--bg0);border:1px solid var(--acc);border-radius:2px;padding:0 4px;outline:0;font-size:11px}
.lbtn{width:20px;height:20px;display:grid;place-items:center;border-radius:3px;color:var(--faint);flex:none}
.lbtn:hover{color:var(--ink);background:var(--bg4)}
.lbtn.off{color:var(--faint);opacity:.45}
.lbtn svg{width:12px;height:12px}
#layFoot{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;margin-top:8px;font-size:9.5px;color:var(--faint);letter-spacing:.1em}
#layBlend{background:var(--bg0);border:1px solid var(--line);border-radius:3px;padding:2px 4px;font-size:11px;grid-column:1/3;width:100%}
#layBlend:focus{outline:0;border-color:var(--acc)}
#layOpVal{color:var(--ink);min-width:34px;text-align:right}

/* preview */
#prev{width:100%;aspect-ratio:1;border-radius:4px;border:1px solid var(--line);image-rendering:pixelated;display:block;background:var(--bg0)}
#prevInfo{font-size:9.5px;color:var(--faint);letter-spacing:.14em;margin-top:6px;display:flex;justify-content:space-between}

/* ---------- status bar ---------- */
#status{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--bg2);border-top:1px solid var(--line);font-size:10px;color:var(--faint);z-index:20}
#stHint{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em}
#stCoords{color:var(--dim);min-width:70px;text-align:right}
#stZoom{color:var(--acc);min-width:44px;text-align:right;cursor:pointer}
#stZoom:hover{text-decoration:underline}
#stFrame,#stSize{color:var(--dim)}
#stSaveWrap{display:flex;align-items:center;gap:5px}
#stSave{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:background .3s}
#stSave.saved{background:var(--good)}
#stSave.pulse{animation:pulse .7s 3}
@keyframes pulse{50%{opacity:.25}}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:90;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:#241d11;border:1px solid var(--line2);border-radius:5px;padding:7px 12px;font-size:11px;color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.55);animation:tIn .16s ease-out;pointer-events:auto}
.toast.out{opacity:0;translate:0 6px;transition:all .25s}
.toast .dot{width:7px;height:7px;border-radius:50%;background:var(--info);flex:none}
.toast.good .dot{background:var(--good)}
.toast.bad .dot{background:var(--bad)}
.toast.warn .dot{background:var(--acc)}
.toast canvas{width:24px;height:24px;image-rendering:pixelated;border:1px solid var(--line2);border-radius:2px}
@keyframes tIn{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(8,6,3,.62);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:50}
#modal.show{display:flex}
.mbox{background:var(--bg1);border:1px solid var(--line2);border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.6);width:min(440px,92vw);max-height:86vh;overflow-y:auto;animation:mIn .16s ease-out}
@keyframes mIn{from{opacity:0;translate:0 10px;scale:.98}to{opacity:1;translate:0 0;scale:1}}
.mhead{display:flex;align-items:center;padding:13px 16px 10px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:11px;letter-spacing:.26em;color:var(--acc);font-weight:700;text-transform:uppercase}
.mhead .btn{margin-left:auto}
.mbody{padding:14px 16px 16px}
.frow{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center;margin-bottom:12px}
.frow>label{font-size:9.5px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.tin{width:100%;background:var(--bg0);border:1px solid var(--line);border-radius:3px;padding:5px 8px;font-size:12px}
.tin:focus{outline:0;border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.mrow{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.mnote{font-size:10px;color:var(--faint);margin-top:4px;line-height:1.5}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 22px}
.krow{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);padding:2.5px 0}
.krow kbd{min-width:20px;text-align:center}
.krow span{flex:1}
.msect{font-size:9.5px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin:14px 0 6px}
.msect:first-child{margin-top:0}
.restthumb{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.restthumb canvas{width:64px;height:64px;image-rendering:pixelated;border:1px solid var(--line2);border-radius:4px}

/* number inputs */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

:focus-visible{outline:1px solid var(--acc);outline-offset:1px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:900px){ #main{grid-template-columns:44px 1fr 220px} }
</style>
</head>
<body>

<header id="topbar">
  <div id="brand">
    <svg id="logo" width="18" height="18" viewBox="0 0 10 12" shape-rendering="crispEdges" aria-hidden="true"></svg>
    <b>EMBER</b><span>PIXEL STUDIO</span>
  </div>
  <div class="tsep"></div>
  <button class="btn" id="btnNew" data-ico="new" data-tipdir="down" data-tip="New document · Ctrl N" aria-label="New document"></button>
  <button class="btn" id="btnOpen" data-ico="upload" data-tipdir="down" data-tip="Open image or project · Ctrl O" aria-label="Open file"></button>
  <button class="btn" id="btnSave" data-ico="save" data-tipdir="down" data-tip="Save project (.json) · Ctrl S" aria-label="Save project"></button>
  <div class="tsep"></div>
  <button class="btn" id="btnUndo" data-ico="undo" data-tipdir="down" data-tip="Undo · Ctrl Z" aria-label="Undo"></button>
  <button class="btn" id="btnRedo" data-ico="redo" data-tipdir="down" data-tip="Redo · Ctrl Y" aria-label="Redo"></button>
  <div class="tsep"></div>
  <div id="docWrap"><span id="docName" title="Click to rename">untitled</span><i id="unsaved" title="Unsaved changes"></i></div>
  <div class="tsep"></div>
  <button class="btn" id="btnSound" data-ico="sound" data-tipdir="down" data-tip="Interface sound" aria-label="Toggle sound" aria-pressed="true"></button>
  <button class="btn" id="btnHelp" data-ico="help" data-tipdir="down" data-tip="Shortcuts & help · ?" aria-label="Help"></button>
  <button class="btn accent" id="btnExport" data-ico="download" data-tipdir="down" data-tip="Export PNG / GIF / sheet · Ctrl E" aria-label="Export"></button>
</header>

<div id="main">
  <nav id="rail" role="toolbar" aria-label="Tools"></nav>

  <div id="center">
    <div id="opts">
      <span id="optsTool">pencil</span>
      <div id="optsBody"></div>
      <div id="optsRight">
        <button class="chip" id="tglSymX" data-ico="symX" data-tip="Mirror X · draw both halves" aria-pressed="false" aria-label="Mirror X"></button>
        <button class="chip" id="tglSymY" data-ico="symY" data-tip="Mirror Y" aria-pressed="false" aria-label="Mirror Y"></button>
        <button class="chip" id="tglGrid" data-ico="grid" data-tip="Grid · Shift G" aria-pressed="false" aria-label="Toggle grid"></button>
        <button class="chip" id="tglOnion" data-ico="onion" data-tip="Onion skin · Shift O" aria-pressed="false" aria-label="Onion skin"></button>
      </div>
    </div>

    <div id="vpwrap">
      <canvas id="vp" data-tool="pencil" aria-label="Pixel canvas"></canvas>
    </div>

    <div id="timeline">
      <div id="tlLeft">
        <div id="tlBtns">
          <button class="btn" id="tlPrev" data-ico="prevF" data-tip="Previous frame · ," aria-label="Previous frame"></button>
          <button class="btn" id="tlPlay" data-ico="play" data-tip="Play / pause · Enter" aria-label="Play animation"></button>
          <button class="btn" id="tlNext" data-ico="nextF" data-tip="Next frame · ." aria-label="Next frame"></button>
          <button class="btn" id="tlLoop" data-ico="loop" data-tip="Loop playback" aria-label="Loop" aria-pressed="true"></button>
        </div>
        <div id="fpsRow"><label for="tlFps">FPS</label><input id="tlFps" type="number" min="1" max="30" value="8"></div>
      </div>
      <div id="frames" aria-label="Frames"></div>
      <div id="tlRight">
        <div class="row">
          <button class="btn" id="tlAdd" data-ico="addF" data-tip="New frame · N" aria-label="New frame"></button>
          <button class="btn" id="tlDup" data-ico="dupF" data-tip="Duplicate frame · Ctrl D" aria-label="Duplicate frame"></button>
          <button class="btn" id="tlDel" data-ico="delF" data-tip="Delete frame" aria-label="Delete frame"></button>
        </div>
        <div id="frameLabel">FRAME 1/1</div>

const Sound = {

vp.addEventListener('pointerdown', e => {

/* selection utilities */

function extractRegion(cel, r) { const c = mkCanvas(r.w, r.h); c.getContext('2d').drawImage(cel, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h); return c; }

  markDirty();
}
function copySel() {

}

  const px = S.sel ? S.sel.x : 0, py = S.sel ? S.sel.y : 0;
  const before = snapCel(cel);
  cel.getContext('2d').drawImage(S.clip, px, py);
  const after = snapCel(cel);

  S.sel = { x: clamp(px, 0, S.doc.w - 1), y: clamp(py, 0, S.doc.h - 1), w: S.clip.width, h: S.clip.height };

/* ---------------- layer ops ---------------- */

    undo: () => { S.doc.layers.splice(idx, 1); S.layer = Math.min(S.layer, S.doc.layers.length - 1); },

}

  doCmd({

    undo: () => { const [L] = S.doc.layers.splice(to, 1); S.doc.layers.splice(idx, 0, L); S.layer = idx; },

/* ---------------- frame ops ---------------- */

  updFrameLabel(); highlightFrames();
  updateLayerThumbs(true);
}
function addFrame(dup) {

  const clones = dup ? S.doc.layers.map(L => L.cels[S.frame] ? cloneCanvas(L.cels[S.frame]) : null) : null;
  doCmd({
    redo: () => { S.doc.layers.forEach((L, i) => L.cels.splice(at, 0, clones ? clones[i] : null)); S.frame = at; },
    undo: () => { S.doc.layers.forEach(L => L.cels.splice(at, 1)); S.frame = Math.min(S.frame, n - 1); },

  const at = S.frame, removed = S.doc.layers.map(L => L.cels[at]);

    undo: () => { S.doc.layers.forEach((L, i) => L.cels.splice(at, 0, removed[i])); S.frame = at; },

/* ---------------- open / save / import ---------------- */
function readFileAs(file, how) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = rej;
    if (how === 'text') r.readAsText(file); else r.readAsDataURL(file);
  });
}
function loadImage(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = rej;
    im.src = src;
  });
}
async function handleFiles(file) {
  try {
    if (file.name.toLowerCase().endsWith('.json') || file.type === 'application/json') {
      const data = JSON.parse(await readFileAs(file, 'text'));
      await loadProject(data, file.name.replace(/\.json$/i, ''));
      return;
    }
    if (file.type.startsWith('image/')) {
      const im = await loadImage(await readFileAs(file, 'dataurl'));
      let w = im.naturalWidth, h = im.naturalHeight;
      if (!w || !h) throw new Error('bad image');
      const f = Math.min(1, MAXDOC / Math.max(w, h));
      w = Math.max(MINDOC, Math.round(w * f)); h = Math.max(MINDOC, Math.round(h * f));
      const cel = mkCel(w, h), x = cel.getContext('2d');
      x.imageSmoothingEnabled = false;
      x.drawImage(im, 0, 0, w, h);
      const doc = { name: file.name.replace(/\.[a-z0-9]+$/i, ''), w, h, fps: S.fps, layers: [{ name: 'Layer 1', visible: true, opacity: 1, blend: 'normal', locked: false, cels: [cel] }] };
      layerSeq = 1;
      stopPlayback(); setDoc(doc);
      Sound.chime(); toast(`Imported ${file.name} — ${w}×${h}`, 'good', cel);
      return;
    }
    toast('Drop a PNG/JPEG image or a .json project', 'warn');
  } catch (err) { toast('Could not open that file', 'bad'); }
}
function serializeDoc() {
  return {
    v: 1, name: S.doc.name, w: S.doc.w, h: S.doc.h, fps: S.fps, pal: S.pal.slice(), preset: S.preset,
    primary: S.primary, secondary: S.secondary, layer: S.layer, frame: S.frame, tool: S.tool,
    layerSeq,
    layers: S.doc.layers.map(L => ({ name: L.name, visible: L.visible, opacity: L.opacity, blend: L.blend, locked: L.locked, cels: L.cels.map(c => c ? c.toDataURL('image/png') : null) })),
  };
}
async function loadProject(data, fallbackName) {
  if (!data || data.v !== 1 || !Array.isArray(data.layers) || !data.layers.length) throw new Error('bad project');
  const w = clamp(data.w | 0, MINDOC, MAXDOC), h = clamp(data.h | 0, MINDOC, MAXDOC);
  const layers = [];
  for (const L of data.layers.slice(0, 32)) {
    const cels = [];
    for (const src of (L.cels || []).slice(0, 256)) {
      if (!src) { cels.push(null); continue; }
      try { const im = await loadImage(src); const c = mkCel(w, h); c.getContext('2d').drawImage(im, 0, 0); cels.push(c); }
      catch (e) { cels.push(null); }
    }
    while (cels.length < 1) cels.push(null);
    layers.push({ name: String(L.name || 'Layer').slice(0, 40), visible: L.visible !== false, opacity: clamp(+L.opacity || 1, 0, 1), blend: BLENDS.includes(L.blend) ? L.blend : 'normal', locked: !!L.locked, cels });
  }
  const n = Math.max(...layers.map(L => L.cels.length));
  layers.forEach(L => { while (L.cels.length < n) L.cels.push(null); });
  const doc = { name: String(data.name || fallbackName || 'untitled').slice(0, 60), w, h, fps: clamp(data.fps | 0 || 8, 1, 30), layers };
  stopPlayback(); setDoc(doc);
  S.fps = doc.fps; $('tlFps').value = S.fps;
  if (Array.isArray(data.pal) && data.pal.length) { S.pal = data.pal.filter(hx => /^#[0-9a-f]{3}|^#[0-9a-f]{6}/i.test(hx)).slice(0, 96); if (S.pal.length) rebuildPalUI(); }
  if (data.primary) { S.primary = data.primary; S.secondary = data.secondary || S.secondary; updColorUI(); }
  S.layer = clamp(data.layer | 0, 0, layers.length - 1);
  setFrame(clamp(data.frame | 0, 0, n - 1));
  layerSeq = data.layerSeq || layers.length + 1;
  rebuildLayersUI(); updLayerFoot();
  Sound.chime(); toast(`Opened “${doc.name}”`, 'good', composite(S.frame));
}

const ASKEY = 'ember.pixel.studio.v1';
let storageOK = true, warnedStorage = false;
function storeSet(k, v) { if (!storageOK) return false; try { localStorage.setItem(k, v); return true; } catch (e) { storageOK = false; if (!warnedStorage) { warnedStorage = true; toast('Autosave unavailable — storage is blocked', 'warn', null, 3600); } return false; } }

function autosave() {
  if (!S.doc || !S.dirtySinceSave) return;
  try {
    const payload = JSON.stringify({
      doc: serializeDoc(),
      prefs: { sound: !Sound.muted, grid: S.grid, onion: S.onion, symX: S.symX, symY: S.symY, dither: S.dither, fps: S.fps, tool: S.tool },
    });

    if (storeSet(ASKEY, payload)) {
      S.dirtySinceSave = false; updTitle();
      const dot = $('stSave');
      dot.classList.add('saved', 'pulse');
      setTimeout(() => dot.classList.remove('pulse'), 2200);
      setTimeout(() => dot.classList.remove('saved'), 1400);

}

const TOOLKEYS = { b: 'pencil', e: 'eraser', g: 'fill', l: 'line', r: 'rect', o: 'ellipse', m: 'marquee', v: 'move', i: 'picker', h: 'hand' };

  if (e.key === 'Escape') {
    if (modalOpen) { closeModal(); return; }
    if (typing) { e.target.blur(); return; }
    if (S.sel) { selClear(); return; }
    return;
  }
  if (modalOpen || typing) return;
  const k = e.key.toLowerCase();
  if (e.ctrlKey || e.metaKey) {
    switch (k) {
      case 'z': e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return;
      case 'y': e.preventDefault(); doRedo(); return;
      case 'c': e.preventDefault(); copySel(); return;
      case 'x': e.preventDefault(); cutSel(); return;

/* ---------------- main loop ---------------- */
let lastT = performance.now();
function loop(t) {
  const dt = Math.min(100, t - lastT);
  lastT = t;
  if (S.playing) {
    S.acc += dt;
    const dur = 1000 / S.fps;
    let jumped = false;
    while (S.acc >= dur) {
      S.acc -= dur;
      const n = frameCount();
      if (S.frame + 1 < n) setFrame(S.frame + 1);
      else if (S.loop) setFrame(0);
      else { stopPlayback(); break; }
      jumped = true;
    }
    if (jumped) { D.thumbs = true; }
  }
  if (S.sel) D.view = true;
  if (D.view) { drawView(t); D.view = false; }
  if (D.thumbs) { updateFrames(); D.thumbs = false; }
  if (D.prev) { drawPreview(); D.prev = false; }
  requestAnimationFrame(loop);
}

/* ---------------- init ---------------- */
function init() {
  makeChecker();
  buildRail();
  buildPalPreset();
  rebuildPalUI();
  updColorUI();
  updSoundBtn();
  updPlayUI();
  setDoc(buildSampleDoc());
  setTool('pencil');
  resizeCanvas();
  setupPreview();
  fitDoc();

  const ro = new ResizeObserver(() => {
    resizeCanvas(); setupPreview();
    if (bootFitPending && viewW > 240 && viewH > 240) { fitDoc(); bootFitPending = false; }
  });
  ro.observe($('vpwrap'));
  window.addEventListener('resize', () => { resizeCanvas(); setupPreview(); });

  // restore prompt
  const saved = storeGet(ASKEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed && parsed.doc) {
        openModal(`
          <div class="mhead"><h3>Restore session?</h3></div>
          <div class="mbody">
            <div class="restthumb"><canvas id="rtC" width="64" height="64"></canvas>
              <div class="mnote" style="flex:1">Found an autosaved session: <b style="color:var(--ink)">“${String(parsed.doc.name || 'untitled').replace(/[<>&]/g, '')}”</b> — ${parsed.doc.w}×${parsed.doc.h}, ${(parsed.doc.layers || []).length} layers. Restore it or start from the sample sprite.</div>
            </div>
            <div class="mrow">
              <button class="btn" id="rtFresh">Start fresh</button>
              <button class="btn accent" id="rtGo">Restore</button>
            </div>
          </div>`, {
          onMount() {
            const rc = $('rtC'), rx = rc.getContext('2d');
            rx.fillStyle = '#131009'; rx.fillRect(0, 0, 64, 64);
            rx.fillStyle = '#ffb454'; rx.font = '28px monospace'; rx.textAlign = 'center'; rx.fillText('★', 32, 43);
            $('rtGo').addEventListener('click', async () => {
              closeModal();
              try { await loadProject(parsed.doc); if (parsed.prefs) applyPrefs(parsed.prefs); }
              catch (err) { toast('Autosave was damaged — kept the sample', 'bad'); }
            });
            $('rtFresh').addEventListener('click', () => { closeModal(); try { localStorage.removeItem(ASKEY); } catch (e) { } toast('Started fresh'); });
          }
        });
      }
    } catch (e) { }
  }
  requestAnimationFrame(loop);
}
function applyPrefs(p) {
  Sound.muted = !p.sound;
  updSoundBtn();
  S.grid = !!p.grid; S.onion = !!p.onion; S.symX = !!p.symX; S.symY = !!p.symY; S.dither = !!p.dither;
  ['tglGrid', 'tglOnion', 'tglSymX', 'tglSymY'].forEach((id, i) => {
    const key = ['grid', 'onion', 'symX', 'symY'][i];
    $(id).classList.toggle('on', S[key]);
    $(id).setAttribute('aria-pressed', S[key]);
  });
  if (p.tool && TOOLS.some(t => t.id === p.tool)) setTool(p.tool);
  if (p.fps) { S.fps = clamp(p.fps | 0, 1, 30); $('tlFps').value = S.fps; }
  updOptBar(); D.view = true; updPrevInfo();
}
init();
window.__ember = { S, composite, encodeGIF, serializeDoc, V, setTool, Undo, mkCanvas };
</script>
