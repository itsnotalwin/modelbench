<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kindling Drift</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#060b1a;font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;color:#eaf6ff}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;pointer-events:none;gap:10px;flex-wrap:wrap}
  .pill{background:rgba(8,16,38,.62);border:1px solid rgba(140,220,255,.28);border-radius:999px;padding:6px 13px;font-size:14px;letter-spacing:.04em;backdrop-filter:blur(6px);box-shadow:0 4px 18px rgba(0,0,0,.35)}
  .pill b{color:#ffd98a}
  #hud .mid{text-align:center}
  .heart{color:#ff7aa2}
  /* Overlay */
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(10,20,50,.25),rgba(3,6,18,.78));z-index:5;padding:18px}
  #overlay.hidden{display:none}
  .panel{max-width:620px;width:100%;text-align:center;background:linear-gradient(160deg,rgba(14,26,58,.92),rgba(8,12,30,.94));border:1px solid rgba(140,220,255,.32);border-radius:22px;padding:34px 30px 28px;box-shadow:0 24px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
  .panel h1{font-size:clamp(38px,7vw,64px);letter-spacing:.06em;line-height:1.02;background:linear-gradient(180deg,#fff3c4,#ffc65c 55%,#ff8a5c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 34px rgba(255,190,90,.18)}
  .panel h2{font-size:clamp(26px,5vw,40px);color:#ffe9ad;letter-spacing:.05em}
  .sub{color:#9fd8ff;letter-spacing:.28em;text-transform:uppercase;font-size:12px;margin:10px 0 4px}
  .panel p{color:#c7dcf5;font-size:15px;line-height:1.55;margin:12px auto;max-width:500px}
  .keys{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;text-align:left;margin:16px auto;max-width:480px;font-size:13.5px;color:#c7dcf5}
  .keys span{color:#ffd98a;font-weight:700}
  .btn{pointer-events:auto;cursor:pointer;border:none;border-radius:999px;padding:13px 34px;font-size:16px;font-weight:800;letter-spacing:.08em;color:#2a1602;background:linear-gradient(180deg,#ffe9a8,#ffb84d);box-shadow:0 8px 26px rgba(255,180,70,.35),inset 0 1px 0 #fff8;transition:transform .12s,box-shadow .12s;margin:8px 4px 0}
  .btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 32px rgba(255,180,70,.5)}
  .btn.ghost{background:transparent;color:#9fd8ff;border:1px solid rgba(140,220,255,.5);box-shadow:none}
  .bigscore{font-size:30px;color:#ffe9ad;margin:8px 0}
  .lanternGlow{font-size:44px;filter:drop-shadow(0 0 16px #ffcf6b);animation:flick 1.6s infinite alternate}
  @keyframes flick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.1) rotate(3deg)}}
  #hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(8,16,38,.68);border:1px solid rgba(140,220,255,.25);border-radius:14px;padding:10px 18px;font-size:14px;color:#dff2ff;text-align:center;pointer-events:none;transition:opacity .5s;max-width:92vw;z-index:4}
  #hint b{color:#ffd98a}
  /* Touch controls */
  #touch{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;align-items:flex-end;padding:0 16px 18px;z-index:6;pointer-events:none}
  #touch .grp{display:flex;gap:12px;pointer-events:auto}
  .tbtn{width:64px;height:64px;border-radius:50%;border:1px solid rgba(160,225,255,.5);background:rgba(10,22,48,.55);color:#dff2ff;font-size:24px;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;backdrop-filter:blur(4px)}
  .tbtn.on{background:rgba(255,190,90,.75);color:#241300}
  .tbtn.big{width:86px;height:86px;font-size:13px;font-weight:800;letter-spacing:.05em}
  @media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="pill">Level <b id="hLevel">1</b>/5 &nbsp;◆ <b id="hShards">0/0</b></div>
    <div class="pill mid">⏱ <b id="hTime">0:00</b> &nbsp; ✦ <b id="hScore">0</b></div>
    <div class="pill"><span class="heart" id="hHearts">♥♥♥</span> &nbsp; Best <b id="hBest">0</b></div>
  </div>

  <div id="hint"></div>

  <div id="touch">
    <div class="grp">
      <div class="tbtn" data-k="left">◀</div>
      <div class="tbtn" data-k="right">▶</div>
    </div>
    <div class="grp">
      <div class="tbtn" data-k="dash">⚡</div>
      <div class="tbtn big" data-k="latch">HOLD<br>LATCH</div>
    </div>
  </div>

  <div id="overlay"></div>
</div>

<script>
'use strict';
/* ============================================================
   KINDLING DRIFT — a lantern-swing game
   Swing from hanging lanterns, gather lumens, reach the gate.
   All art drawn procedurally on canvas. All audio Web Audio.
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const hintEl = document.getElementById('hint');
const $ = id => document.getElementById(id);

let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize); resize();

/* ---------- storage (guarded) ---------- */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
let bestScore = parseInt(store.get('kindlingDriftBest') || '0', 10) || 0;
let unlocked  = parseInt(store.get('kindlingDriftLevel') || '1', 10) || 1;
unlocked = Math.max(1, Math.min(5, unlocked));

/* ---------- utils ---------- */
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const dist  = (x1,y1,x2,y2)=> Math.hypot(x2-x1, y2-y1);
const TAU = Math.PI*2;
function fmtTime(s){ const m=Math.floor(s/60), ss=Math.floor(s%60); return m+':'+String(ss).padStart(2,'0'); }
function seeded(seed){ let s = seed*9973+7; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }

/* ---------- audio ---------- */
let AC=null, master=null, musicGain=null, sfxGain=null, musicTimer=0, chordIdx=0, melodyStep=0;
const CHORDS = [
  [220.00, 261.63, 329.63],  // A minor
  [174.61, 220.00, 261.63],  // F
  [196.00, 246.94, 293.66],  // G
  [164.81, 220.00, 261.63],  // E-ish lift
  [146.83, 220.00, 293.66],  // D
  [130.81, 196.00, 261.63],  // C
];
const PENTA = [440,523.25,587.33,659.25,783.99,880];
function initAudio(){
  if (AC) { if (AC.state==='suspended') AC.resume(); return; }
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.85; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.16; musicGain.connect(master);
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(master);
    musicTimer = AC.currentTime + 0.1;
  }catch(e){ AC = null; }
}
function tone(freq, t0, dur, type, vol, dest, slideTo){
  if(!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(dest || sfxGain); o.start(t0); o.stop(t0+dur+0.05);
}
function noiseBurst(t0, dur, vol, freq){
  if(!AC) return;
  const len = Math.max(1, Math.floor(AC.sampleRate*dur));
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||800; f.Q.value=0.8;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(sfxGain); src.start(t0);
}
const sfx = {
  latch(){ if(!AC)return; const t=AC.currentTime; tone(190,t,0.08,'square',0.12); tone(520,t+0.03,0.1,'sine',0.14); noiseBurst(t,0.06,0.08,2400); },
  release(){ if(!AC)return; const t=AC.currentTime; noiseBurst(t,0.22,0.14,1200); tone(300,t,0.2,'sine',0.06,sfxGain,520); },
  collect(n){ if(!AC)return; const t=AC.currentTime; const base=PENTA[clamp(n-1,0,PENTA.length-1)]; tone(base,t,0.35,'sine',0.2); tone(base*1.5,t+0.05,0.4,'sine',0.12); tone(base*2,t+0.1,0.3,'triangle',0.06); },
  dash(){ if(!AC)return; const t=AC.currentTime; noiseBurst(t,0.18,0.16,700); tone(220,t,0.18,'sawtooth',0.05,sfxGain,660); },
  hurt(){ if(!AC)return; const t=AC.currentTime; tone(160,t,0.3,'sawtooth',0.18,sfxGain,60); noiseBurst(t,0.2,0.2,400); },
  gate(){ if(!AC)return; const t=AC.currentTime; [523,659,784,1046].forEach((f,i)=>tone(f,t+i*0.09,0.5,'sine',0.16)); },
  win(){ if(!AC)return; const t=AC.currentTime; [392,523,659,784,1046,1318].forEach((f,i)=>tone(f,t+i*0.11,0.7,'triangle',0.16)); },
  over(){ if(!AC)return; const t=AC.currentTime; [392,330,262,196].forEach((f,i)=>tone(f,t+i*0.18,0.5,'sine',0.14)); },
  levelStart(){ if(!AC)return; const t=AC.currentTime; [262,392,523].forEach((f,i)=>tone(f,t+i*0.08,0.35,'sine',0.12)); }
};
function updateMusic(){
  if(!AC || state!=='playing') { if(AC && state!=='playing') musicTimer = Math.max(musicTimer, AC.currentTime+0.05); return; }
  if (AC.currentTime < musicTimer) return;
  const chord = CHORDS[chordIdx % CHORDS.length]; chordIdx++;
  const t = AC.currentTime;
  chord.forEach(f=>{
    tone(f/2, t, 4.4, 'sine', 0.22, musicGain);
    tone(f, t, 4.4, 'triangle', 0.06, musicGain);
  });
  // gentle melody pluck every other chord
  if (chordIdx % 2 === 0){
    for(let i=0;i<3;i++){
      const f = PENTA[Math.floor(Math.random()*PENTA.length)];
      tone(f, t + i*0.55 + Math.random()*0.15, 0.5, 'sine', 0.07, musicGain);
    }
  }
  musicTimer = t + 4.2;
}

/* ---------- levels ---------- */
const WORLD_H = 760;
function L(anchors, shards, thorns, gate, start, opts){ return {anchors, shards, thorns, gate, start, opts:opts||{}}; }
const LEVELS = [
  L(
    [[330,170],[600,130],[880,170],[1160,135],[1440,170],[1720,140]],
    [[465,330],[740,300],[1020,340],[1300,310],[1580,335]],
    [[700,745,90],[1500,745,90]],
    [2050,470], [295,355],
    {intro:'Hold <b>SPACE</b> / <b>CLICK</b> to latch onto a lantern. Pump with <b>A / D</b>, release to fly!'}
  ),
  L(
    [[300,190],[560,120],[830,180],[1100,120],[1370,180],[1640,120],[1910,180]],
    [[430,360],[695,300],[965,350],[1235,300],[1505,350],[1775,300]],
    [[900,745,110],[1700,745,110]],
    [2220,460], [270,385],
    {intro:'Reel in with <b>W</b>, pay out with <b>S</b>. Grab every lumen ◆ to wake the gate.'}
  ),
  L(
    [[280,160],[540,150],[800,150],[1060,150],[1320,150],[1580,150],[1840,150],[2100,160]],
    [[410,350],[670,330],[930,330],[1190,330],[1450,330],[1710,330],[1970,340]],
    [[600,745,120],[1300,745,120],[2000,745,120]],
    [2400,450], [250,355],
    {intro:'Press <b>SHIFT</b> to dash through the dark. Watch the briars below.'},
    {width:2600}
  ),
  L(
    [[300,200],[570,110],[840,200],[1110,110],[1380,200],[1650,110],[1920,200],[2190,110]],
    [[435,380],[705,290],[975,380],[1245,290],[1515,380],[1785,290],[2055,380]],
    [[500,745,130],[1150,745,130],[1800,745,130]],
    [2500,440], [270,395],
    {intro:'Some lanterns drift on their chains. Time your latch!', move:[{i:1,ax:60,sp:.9},{i:3,ax:80,sp:.7},{i:5,ax:60,sp:1.1},{i:7,ax:70,sp:.8}]},
    {width:2800}
  ),
  L(
    [[270,150],[520,110],[770,170],[1020,110],[1270,170],[1520,110],[1770,170],[2020,110],[2270,170],[2520,120]],
    [[395,320],[645,300],[895,350],[1145,300],[1395,350],[1645,300],[1895,350],[2145,300],[2395,340]],
    [[650,745,150],[1400,745,150],[2150,745,150]],
    [2820,430], [240,345],
    {intro:'The final choir. Every lumen, one gate. <b>Kindle the dark.</b>', move:[{i:2,ax:70,sp:1.0},{i:4,ax:90,sp:.8},{i:6,ax:70,sp:1.2},{i:8,ax:80,sp:.9}]},
    {width:3050}
  )
];

/* ---------- game state ---------- */
let state = 'title'; // title | playing | paused | levelclear | over | win
let levelIdx = 0, score = 0, runTime = 0, levelTime = 0, hearts = 3;
let combo = 0, comboTimer = 0, shake = 0, fade = 0, fadeDir = 0, fadeCb = null;
let clearTimer = -1, deadTimer = -1;
let cam = {x:0,y:0};
let particles = [], popups = [], trail = [];
let hintTimer = 0;
let level = null, anchors = [], shards = [], thorns = [], gate = null, worldW = 2300;
let decor = [];

const player = { x:110,y:520,vx:0,vy:0, r:15, attached:null, ropeLen:0, dashCd:0, dashT:0, invuln:0, face:1, dead:false };

function buildLevel(idx){
  const src = LEVELS[idx];
  level = src; levelIdx = idx; levelTime = 0; combo = 0; comboTimer = 0;
  worldW = src.opts.width || 2300;
  anchors = src.anchors.map((a,i)=>{
    const mv = (src.opts.move||[]).find(m=>m.i===i);
    return { bx:a[0], by:a[1], x:a[0], y:a[1], phase:Math.random()*TAU, sway:Math.random()*TAU, mv:mv||null, ox:0, oy:0 };
  });
  shards = src.shards.map(s=>({ x:s[0], y:s[1], taken:false, t:Math.random()*TAU }));
  thorns = src.thorns.map(t=>({ x:t[0], y:t[1], w:t[2] }));
  gate = { x:src.gate[0], y:src.gate[1], open:false };
  player.x = src.start[0]; player.y = src.start[1];
  player.vx = 0; player.vy = 0; player.attached = null; player.dashCd = 0; player.dashT = 0; player.invuln = 1; player.dead = false;
  trail = []; particles = []; popups = [];
  cam.x = clamp(player.x - W*0.35, 0, Math.max(0, worldW - W));
  cam.y = clamp(player.y - H*0.55, 0, Math.max(0, WORLD_H - H));
  buildDecor(idx);
  showHint(src.opts.intro || '', 5);
  updateHUD();
}
function buildDecor(idx){
  const rnd = seeded(idx+3);
  decor = { far:[], mid:[], dust:[] };
  for(let i=0;i<70;i++) decor.far.push({x:rnd()*worldW, y:rnd()*380, s:0.5+rnd()*1.6, tw:rnd()*TAU});
  for(let i=0;i<26;i++) decor.mid.push({x:rnd()*worldW, w:60+rnd()*170, h:90+rnd()*260});
  for(let i=0;i<90;i++) decor.dust.push({x:rnd()*worldW, y:rnd()*WORLD_H, s:0.6+rnd()*2.2, ph:rnd()*TAU, sp:0.2+rnd()*0.8});
}

/* ---------- input ---------- */
const keys = {};
let pointerDown = false, pointerLatch = false;
const virt = { left:false, right:false, up:false, down:false, latch:false, dash:false };

window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if (k==='p' || k==='escape'){ if(state==='playing') pauseGame(); else if(state==='paused') resumeGame(); return; }
  if (k==='enter'){ if(state==='title') startGame(); else if(state==='levelclear') nextLevel(); else if(state==='over'||state==='win') startGame(); return; }
  keys[k] = true; initAudio();
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

function latchHeld(){ return keys[' '] || pointerLatch || virt.latch || padLatch; }
function moveX(){ let v=0; if(keys['a']||keys['arrowleft']||virt.left) v-=1; if(keys['d']||keys['arrowright']||virt.right) v+=1; if(padAxisX) v+=padAxisX; return clamp(v,-1,1); }
function reelIn(){ return keys['w']||keys['arrowup']||virt.up; }
function reelOut(){ return keys['s']||keys['arrowdown']||virt.down; }
function dashPressed(){ return keys['shift']||keys['k']||virt.dash||padDash; }

canvas.addEventListener('pointerdown', e=>{
  initAudio();
  if (state==='playing'){ pointerDown = true; pointerLatch = true; }
});
window.addEventListener('pointerup', ()=>{ pointerDown=false; pointerLatch=false; });
window.addEventListener('pointercancel', ()=>{ pointerDown=false; pointerLatch=false; });
canvas.addEventListener('contextmenu', e=>e.preventDefault());

// touch buttons
document.querySelectorAll('.tbtn').forEach(el=>{
  const k = el.getAttribute('data-k');
  const on  = e=>{ e.preventDefault(); initAudio(); el.classList.add('on'); if(k==='latch') virt.latch=true; else virt[k]=true; };
  const off = e=>{ e.preventDefault(); el.classList.remove('on'); if(k==='latch') virt.latch=false; else virt[k]=false; };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
});

let padLatch=false, padDash=false, padAxisX=0, padPrev={};
function pollGamepad(){
  padLatch=false; padDash=false; padAxisX=0;
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  for(const gp of gps){
    if(!gp) continue;
    if(Math.abs(gp.axes[0]||0)>0.18) padAxisX = gp.axes[0];
    const b = i => gp.buttons[i] && gp.buttons[i].pressed;
    if(b(0)) padLatch = true;
    if(b(1) && !padPrev.dash) padDash = true;
    if(b(9) && !padPrev.pause){ if(state==='playing') pauseGame(); else if(state==='paused') resumeGame(); }
    padPrev.dash = b(1); padPrev.pause = b(9);
    break;
  }
}

/* ---------- HUD / overlays ---------- */
function updateHUD(){
  $('hLevel').textContent = levelIdx+1;
  const got = shards.filter(s=>s.taken).length;
  $('hShards').textContent = got + '/' + shards.length;
  $('hTime').textContent = fmtTime(runTime);
  $('hScore').textContent = score;
  $('hBest').textContent = bestScore;
  $('hHearts').textContent = '♥'.repeat(Math.max(0,hearts)) || '—';
}
function showHint(html, secs){ hintEl.innerHTML = html; hintEl.style.opacity = '1'; hintTimer = secs || 4; }
function showOverlay(html){ overlay.innerHTML = html; overlay.classList.remove('hidden'); }
function hideOverlay(){ overlay.classList.add('hidden'); overlay.innerHTML=''; }

function titleScreen(){
  state='title';
  showOverlay(`
    <div class="panel">
      <div class="lanternGlow">🏮</div>
      <h1>KINDLING DRIFT</h1>
      <div class="sub">a lantern-swing odyssey</div>
      <p>You are the last light-keeper of a drowned cavern. Swing from hanging lanterns,
      gather every fallen <b style="color:#ffd98a">lumen</b>, and carry the light to the gate —
      before the dark closes in.</p>
      <div class="keys">
        <div><span>SPACE / CLICK</span> — hold to latch, release to fly</div>
        <div><span>A / D</span> — pump your swing</div>
        <div><span>W / S</span> — reel rope in / out</div>
        <div><span>SHIFT</span> — light-dash</div>
        <div><span>P / ESC</span> — pause</div>
        <div><span>Touch / Pad</span> — on-screen latch &amp; pump</div>
      </div>
      <p style="font-size:13px;color:#8fb8dd">Best score: ${bestScore} &nbsp;·&nbsp; Level reached: ${unlocked}/5</p>
      <button class="btn" id="btnStart">▶ &nbsp;BEGIN THE DRIFT</button>
      ${unlocked>1 ? `<button class="btn ghost" id="btnContinue">Continue · Level ${unlocked}</button>` : ''}
    </div>`);
  $('btnStart').onclick = ()=> startGame(0);
  const c = $('btnContinue'); if(c) c.onclick = ()=> startGame(unlocked-1);
}
function startGame(fromLevel){
  initAudio();
  score = 0; runTime = 0; hearts = 3;
  buildLevel(fromLevel||0); levelIdx = fromLevel||0; buildLevel(levelIdx);
  state='playing'; hideOverlay(); sfx.levelStart();
  showHint(level.opts.intro||'', 5);
}
function pauseGame(){
  state='paused';
  showOverlay(`
    <div class="panel"><h2>Paused</h2>
      <p>The cavern holds its breath.</p>
      <button class="btn" id="btnResume">▶ Resume</button>
      <button class="btn ghost" id="btnRestart">↻ Restart level</button>
      <button class="btn ghost" id="btnTitle">Title</button>
    </div>`);
  $('btnResume').onclick = resumeGame;

}
function resumeGame(){ state='playing'; hideOverlay(); }
function levelClear(){
  state='levelclear';
  const timeBonus = Math.max(0, 600 - Math.floor(levelTime)*10);
  const noHit = hearts===3 ? 250 : 0;
  score += timeBonus + noHit;
  gateOpenFx();
  sfx.gate(); sfx.win();
  if (score > bestScore){ bestScore = score; store.set('kindlingDriftBest', String(bestScore)); }
  if (levelIdx+2 > unlocked){ unlocked = Math.min(5, levelIdx+2); store.set('kindlingDriftLevel', String(unlocked)); }
  updateHUD();
  clearTimer = 0.9; // counted down in the main loop (robust vs. tab throttling)
}
function showLevelClearOverlay(){

function gameOver(){

/* ---------- fx helpers ---------- */
function burst(x,y,color,n,spd,life){
  for(let i=0;i<n;i++){
    const a = Math.random()*TAU, s = (0.3+Math.random()*0.7)*(spd||240);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:(life||0.7)*(0.5+Math.random()*0.8),max:life||0.7,color,r:1.5+Math.random()*3});
  }
}
function popup(x,y,text,color){ popups.push({x,y,text,color:color||'#ffe9ad',life:1.1}); }
function gateOpenFx(){ burst(gate.x,gate.y,'#ffd98a',60,340,1.2); burst(gate.x,gate.y,'#7fe7ff',40,260,1.0); }
function hurtPlayer(){
  if (player.invuln>0 || player.dead) return;
  hearts--; player.invuln = 1.6; player.attached = null; shake = 14;
  burst(player.x,player.y,'#ff7aa2',34,320,0.8); sfx.hurt(); updateHUD();
  if (hearts<=0){ player.dead = true; deadTimer = 0.7; burst(player.x,player.y,'#ffe9ad',70,420,1.4); }
  else { // respawn at start of level
    player.x = level.start[0]; player.y = level.start[1]; player.vx=0; player.vy=0;
    popup(player.x, player.y-30, 'Ouch — back to the start', '#ff9db8');
  }
}

/* ---------- physics / update ---------- */
const GRAV = 980;
function tryAttach(){
  if (player.attached) return;
  let best=null, bd=1e9;
  for(const a of anchors){
    const d = dist(player.x,player.y,a.x,a.y);
    if (d < 310 && a.y < player.y + 60 && d < bd){ bd=d; best=a; }
  }
  if (best){
    player.attached = best;
    player.ropeLen = clamp(bd, 90, 250);
    sfx.latch(); burst(best.x,best.y,'#ffd98a',10,150,0.4);
  }
}
function release(){
  if (player.attached){ player.attached=null; sfx.release(); }
}
function doDash(){
  if (player.dashCd>0) return;
  let dx = moveX(), dy = 0;
  if (reelIn()) dy -= 1; if (reelOut()) dy += 1;
  if (dx===0 && dy===0){ const sp=Math.hypot(player.vx,player.vy)||1; dx=player.vx/sp; dy=player.vy/sp; }
  const m = Math.hypot(dx,dy)||1;
  player.vx += (dx/m)*560; player.vy += (dy/m)*560;
  player.dashCd = 1.1; player.dashT = 0.22; shake = Math.max(shake,5);
  burst(player.x,player.y,'#aef3ff',16,200,0.5); sfx.dash();
}

let wasLatch = false, wasDash = false;
function update(dt){
  pollGamepad();
  updateMusic();
  runTime += dt; levelTime += dt;
  if (hintTimer>0){ hintTimer-=dt; if(hintTimer<=0) hintEl.style.opacity='0'; }

  // anchors drift
  for(const a of anchors){
    a.ox = a.x; a.oy = a.y;
    if (a.mv){ a.x = a.bx + Math.sin(performance.now()/1000*a.mv.sp + a.phase)*a.mv.ax; }
    else a.x = a.bx + Math.sin(performance.now()/1000*0.5 + a.sway)*8;
    a.y = a.by;
  }

  // latch transitions
  const lh = latchHeld();
  if (lh && !wasLatch) tryAttach();
  if (!lh && wasLatch) release();
  wasLatch = lh;

  const dp = dashPressed();
  if (dp && !wasDash) doDash();
  wasDash = dp;

  player.dashCd = Math.max(0, player.dashCd-dt);
  player.dashT = Math.max(0, player.dashT-dt);
  player.invuln = Math.max(0, player.invuln-dt);
  comboTimer = Math.max(0, comboTimer-dt);
  if (comboTimer===0) combo = 0;

  // --- physics substeps ---
  const steps = 2, sdt = dt/steps;
  for(let s=0;s<steps;s++){
    player.vy += GRAV * sdt;
    const mx = moveX();
    if (player.attached){
      // pump along tangent
      const a = player.attached;
      let rx = player.x - a.x, ry = player.y - a.y;
      const rl = Math.hypot(rx,ry)||1; rx/=rl; ry/=rl;
      const tx = ry, ty = -rx; // tangent — D always pumps rightward along the arc
      const pump = 620;
      player.vx += tx * mx * pump * sdt * (tx*player.face>=0?1:1);
      // reel
      if (reelIn())  player.ropeLen = Math.max(70, player.ropeLen - 90*sdt);
      if (reelOut()) player.ropeLen = Math.min(260, player.ropeLen + 90*sdt);
      if (mx!==0) player.face = mx>0?1:-1;
    } else {
      player.vx += mx * 780 * sdt;
      if (mx!==0) player.face = mx>0?1:-1;
      if (reelIn()) player.vy -= 1020 * sdt;  // flutter (near-hover, never soft-locks)
      if (reelOut()) player.vy += 420 * sdt;
    }
    // drag & cap
    const drag = player.attached ? 0.12 : 0.35;
    player.vx *= (1 - drag*sdt); player.vy *= (1 - 0.12*sdt);
    const spd = Math.hypot(player.vx,player.vy), maxSpd = 1050;
    if (spd>maxSpd){ player.vx*=maxSpd/spd; player.vy*=maxSpd/spd; }
    player.x += player.vx*sdt; player.y += player.vy*sdt;

    // swing constraint
    if (player.attached){
      const a = player.attached;
      let dx = player.x - a.x, dy = player.y - a.y;
      const d = Math.hypot(dx,dy)||0.001;
      player.x = a.x + dx/d*player.ropeLen;
      player.y = a.y + dy/d*player.ropeLen;
      const nx = dx/d, ny = dy/d;
      const vrad = player.vx*nx + player.vy*ny;
      player.vx -= vrad*nx; player.vy -= vrad*ny;
      // follow moving anchor
      player.x += (a.x - a.ox); player.y += (a.y - a.oy);
    }
    player.x = clamp(player.x, 20, worldW-20);
  }

  // fell out of the world
  if (player.y > WORLD_H + 60) hurtPlayer();

  // shards
  for(const sh of shards){
    if (sh.taken) continue;
    if (dist(player.x,player.y,sh.x,sh.y) < 34){
      sh.taken = true; combo++; comboTimer = 3;
      const pts = 100 + (combo-1)*25;
      score += pts;
      burst(sh.x,sh.y,'#ffd98a',22,240,0.7); burst(sh.x,sh.y,'#fff3c4',10,150,0.5);
      popup(sh.x, sh.y-14, '+'+pts, '#ffe9ad');
      sfx.collect(combo); shake = Math.max(shake,3); updateHUD();
      if (shards.every(s=>s.taken)){ gate.open = true; popup(gate.x, gate.y-52, 'The gate wakes!', '#7fe7ff'); sfx.gate(); }
    }
  }

  // thorns (ground briars)
  for(const t of thorns){
    if (player.x > t.x - t.w/2 - 8 && player.x < t.x + t.w/2 + 8 && player.y > t.y - 46){
      hurtPlayer();
    }
  }

  // gate
  if (gate.open && dist(player.x,player.y,gate.x,gate.y) < 46){
    levelClear();
    return;
  }

  // trail
  trail.unshift({x:player.x,y:player.y});
  if (trail.length>16) trail.pop();

  // particles / popups
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.life -= dt;
    if (p.life<=0){ particles.splice(i,1); continue; }
    p.vy += 300*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= (1-1.5*dt);
  }
  for(let i=popups.length-1;i>=0;i--){ const p=popups[i]; p.life-=dt; p.y-=42*dt; if(p.life<=0) popups.splice(i,1); }

  // camera
  const lookX = player.x + player.vx*0.28, lookY = player.y + player.vy*0.18;
  cam.x = lerp(cam.x, clamp(lookX - W*0.38, 0, Math.max(0, worldW-W)), 1-Math.pow(0.001,dt));
  cam.y = lerp(cam.y, clamp(lookY - H*0.55, 0, Math.max(0, WORLD_H-H)), 1-Math.pow(0.001,dt));
  shake = Math.max(0, shake - 55*dt);
  updateHUDTime();
}
function updateHUDTime(){ $('hTime').textContent = fmtTime(runTime); }

/* ---------- drawing ---------- */
function drawBG(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a1430'); g.addColorStop(0.45,'#0b2140'); g.addColorStop(0.8,'#0d2f3d'); g.addColorStop(1,'#0a1a2a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // distant glow moon
  const mx = W*0.78 - cam.x*0.05 % (W+400), my = H*0.16;
  const mg = ctx.createRadialGradient(mx,my,10,mx,my,240);
  mg.addColorStop(0,'rgba(190,235,255,.5)'); mg.addColorStop(0.25,'rgba(120,200,255,.14)'); mg.addColorStop(1,'rgba(120,200,255,0)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx,my,240,0,TAU); ctx.fill();
  ctx.fillStyle = '#dff4ff'; ctx.beginPath(); ctx.arc(mx,my,26,0,TAU); ctx.fill();
  ctx.fillStyle = 'rgba(160,210,240,.25)'; ctx.beginPath(); ctx.arc(mx-8,my-6,7,0,TAU); ctx.arc(mx+9,my+8,5,0,TAU); ctx.fill();

  // far sparkling plankton
  ctx.save();
  for(const s of decor.far){
    const x = (s.x - cam.x*0.15) % (worldW+100); const xx = x<0?x+worldW+100:x;
    const tw = 0.4+0.6*Math.abs(Math.sin(performance.now()/900 + s.tw));
    ctx.globalAlpha = 0.25*tw; ctx.fillStyle='#bfeaff';
    ctx.beginPath(); ctx.arc(xx, s.y - cam.y*0.1 + Math.sin(performance.now()/1400+s.tw)*8, s.s, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // mid stalactite silhouettes (parallax)
  ctx.save(); ctx.translate(-cam.x*0.4, -cam.y*0.15);
  ctx.fillStyle = 'rgba(10,22,44,.85)';
  for(const st of decor.mid){
    ctx.beginPath();
    ctx.moveTo(st.x, -40); ctx.lineTo(st.x+st.w/2, st.h); ctx.lineTo(st.x+st.w, -40); ctx.closePath(); ctx.fill();
    // crystal tip
    ctx.fillStyle='rgba(110,220,255,.35)';
    ctx.beginPath(); ctx.moveTo(st.x+st.w/2-7, st.h-6); ctx.lineTo(st.x+st.w/2, st.h+22); ctx.lineTo(st.x+st.w/2+7, st.h-6); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(10,22,44,.85)';
  }
  ctx.restore();
}
function drawFloor(){
  // cave floor
  const y = WORLD_H;
  const g = ctx.createLinearGradient(0,y-30,0,y+40);
  g.addColorStop(0,'#12283f'); g.addColorStop(1,'#050c18');
  ctx.fillStyle=g; ctx.beginPath();
  ctx.moveTo(cam.x-50, y);
  for(let x=cam.x-50; x<cam.x+W+60; x+=28) ctx.lineTo(x, y + Math.sin(x*0.012)*10 + Math.sin(x*0.03)*4);
  ctx.lineTo(cam.x+W+60, y+80); ctx.lineTo(cam.x-50, y+80); ctx.closePath(); ctx.fill();
  // floor crystals
  ctx.fillStyle='rgba(110,220,255,.5)';
  const rndOff = Math.floor(cam.x/140)*140;
  for(let x=rndOff; x<cam.x+W+140; x+=140){
    const h = 14 + ((x*7)%23);
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+6,y-h); ctx.lineTo(x+12,y); ctx.closePath(); ctx.fill();
  }
}
function drawThorns(){
  for(const t of thorns){
    ctx.save(); ctx.translate(t.x, t.y);
    // briar mound
    ctx.fillStyle='#1c1030';
    ctx.beginPath(); ctx.ellipse(0,4,t.w/2,16,0,Math.PI,0); ctx.fill();
    // spikes
    for(let x=-t.w/2+6; x<t.w/2-4; x+=13){
      const h = 18 + ((Math.abs(x)*13)%26);
      ctx.fillStyle = (Math.abs(x)%26<13) ? '#3a1b52' : '#53206e';
      ctx.beginPath(); ctx.moveTo(x,2); ctx.lineTo(x+5,2-h); ctx.lineTo(x+10,2); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ff5c8a';
      ctx.beginPath(); ctx.moveTo(x+3,2-h*0.55); ctx.lineTo(x+5,2-h); ctx.lineTo(x+7,2-h*0.55); ctx.closePath(); ctx.fill();
    }
    // glow spores
    ctx.fillStyle='rgba(255,92,138,.7)';
    for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(-t.w/3+i*18, -10-((i*7)%12),2,0,TAU); ctx.fill(); }
    ctx.restore();
  }
}
function drawAnchors(){
  for(const a of anchors){
    const sway = Math.sin(performance.now()/900 + a.sway)*0.05;
    // chain to ceiling
    ctx.save();
    ctx.strokeStyle='rgba(150,180,210,.5)'; ctx.lineWidth=2; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(a.x - Math.sin(sway)*a.y, -20); ctx.lineTo(a.x, a.y); ctx.stroke(); ctx.setLineDash([]);
    // glow
    const g = ctx.createRadialGradient(a.x,a.y,4,a.x,a.y,64);
    g.addColorStop(0,'rgba(255,220,140,.9)'); g.addColorStop(0.3,'rgba(255,190,90,.28)'); g.addColorStop(1,'rgba(255,190,90,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(a.x,a.y,64,0,TAU); ctx.fill();
    // lantern body
    ctx.translate(a.x,a.y); ctx.rotate(sway);
    ctx.fillStyle='#3a2410'; ctx.beginPath(); ctx.ellipse(0,0,15,19,0,0,TAU); ctx.fill();
    ctx.fillStyle='#ffd98a'; ctx.beginPath(); ctx.ellipse(0,1,9,13,0,0,TAU); ctx.fill();
    ctx.fillStyle='#fff3c4'; ctx.beginPath(); ctx.ellipse(0,1,4.5,8,0,0,TAU); ctx.fill();
    ctx.strokeStyle='#8a5a22'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(0,0,15,19,0,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-13,-6); ctx.lineTo(13,-6); ctx.moveTo(-13,8); ctx.lineTo(13,8); ctx.stroke();
    // cap
    ctx.fillStyle='#5a3a16'; ctx.beginPath(); ctx.moveTo(-8,-18); ctx.lineTo(8,-18); ctx.lineTo(4,-26); ctx.lineTo(-4,-26); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
function drawShards(){
  for(const s of shards){
    if (s.taken) continue;
    const bob = Math.sin(performance.now()/600 + s.t)*6;
    ctx.save(); ctx.translate(s.x, s.y+bob);
    const g = ctx.createRadialGradient(0,0,2,0,0,38);
    g.addColorStop(0,'rgba(255,235,170,.95)'); g.addColorStop(1,'rgba(255,200,90,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,38,0,TAU); ctx.fill();
    ctx.rotate(performance.now()/800 + s.t);
    ctx.fillStyle='#ffe9ad';
    ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(9,0); ctx.lineTo(0,14); ctx.lineTo(-9,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff8e0';
    ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(4.5,0); ctx.lineTo(0,8); ctx.lineTo(-4.5,0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
function drawGate(){
  const open = gate.open;
  const pulse = 1 + Math.sin(performance.now()/400)*0.06;
  ctx.save(); ctx.translate(gate.x, gate.y); ctx.scale(pulse,pulse);
  const col = open ? '#ffd98a' : '#4d7fa8';
  const g = ctx.createRadialGradient(0,0,10,0,0,open?120:70);
  g.addColorStop(0, open?'rgba(255,230,160,.75)':'rgba(90,150,200,.28)');
  g.addColorStop(1,'rgba(255,230,160,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,open?120:70,0,TAU); ctx.fill();
  // stone arch ring
  ctx.lineWidth=9; ctx.strokeStyle='#22395c';
  ctx.beginPath(); ctx.arc(0,0,40,0,TAU); ctx.stroke();
  ctx.lineWidth=4; ctx.strokeStyle=col;
  ctx.beginPath(); ctx.arc(0,0,40,0,TAU); ctx.stroke();
  // runes
  for(let i=0;i<8;i++){
    const a = i/8*TAU + performance.now()/3000;
    ctx.fillStyle=col; ctx.globalAlpha = open?0.95:0.4;
    ctx.beginPath(); ctx.arc(Math.cos(a)*40, Math.sin(a)*40, 3.4, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  if (open){
    ctx.fillStyle='rgba(255,246,200,.9)';
    ctx.beginPath(); ctx.arc(0,0,16+Math.sin(performance.now()/300)*3,0,TAU); ctx.fill();
  } else {
    ctx.fillStyle='rgba(140,190,230,.75)'; ctx.font='12px Trebuchet MS'; ctx.textAlign='center';
    ctx.fillText('◆ ' + shards.filter(s=>!s.taken).length + ' left', 0, 58);
  }
  ctx.restore();
}
function drawPlayer(){
  // trail
  for(let i=trail.length-1;i>0;i--){
    const p = trail[i];
    ctx.globalAlpha = (1 - i/trail.length)*0.35;
    ctx.fillStyle = player.dashT>0 ? '#aef3ff' : '#ffd98a';
    ctx.beginPath(); ctx.arc(p.x,p.y, 10*(1-i/trail.length)+3, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  // rope
  if (player.attached){
    const a = player.attached;
    const sag = 0;
    ctx.strokeStyle='rgba(255,230,170,.9)'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(a.x,a.y);
    ctx.quadraticCurveTo((a.x+player.x)/2, (a.y+player.y)/2 + sag, player.x, player.y-14);
    ctx.stroke();
    // sparkles along rope
    ctx.fillStyle='#ffe9ad';
    for(let i=1;i<5;i++){
      const t=i/5, x=lerp(a.x,player.x,t), y=lerp(a.y,player.y-14,t);
      ctx.globalAlpha=0.5+0.5*Math.sin(performance.now()/200+i);
      ctx.beginPath(); ctx.arc(x,y,1.8,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // invuln blink
  if (player.invuln>0 && Math.floor(performance.now()/90)%2===0 && player.invuln<1.4) return;

  ctx.save(); ctx.translate(player.x, player.y);
  const tilt = clamp(player.vx*0.0004, -0.4, 0.4);
  ctx.rotate(tilt);
  // glow
  const g = ctx.createRadialGradient(0,0,4,0,0,52);
  g.addColorStop(0,'rgba(255,225,150,.85)'); g.addColorStop(0.4,'rgba(255,190,90,.22)'); g.addColorStop(1,'rgba(255,190,90,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,52,0,TAU); ctx.fill();
  // scarf (flowing opposite velocity)
  ctx.strokeStyle='#ff8a5c'; ctx.lineWidth=4.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-player.face*6,-6);
  const wob = Math.sin(performance.now()/120)*4;
  ctx.quadraticCurveTo(-player.face*18, -2+wob, -player.face*30, 6+wob*1.5);
  ctx.stroke();
  // cloak body (teardrop)
  const grad = ctx.createLinearGradient(0,-16,0,18);
  grad.addColorStop(0,'#2b4a7a'); grad.addColorStop(1,'#16294d');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(0,-15);
  ctx.bezierCurveTo(11,-8, 13,4, 8,15);
  ctx.bezierCurveTo(4,19, -4,19, -8,15);
  ctx.bezierCurveTo(-13,4, -11,-8, 0,-15);
  ctx.fill();
  ctx.strokeStyle='rgba(160,220,255,.55)'; ctx.lineWidth=1.4; ctx.stroke();
  // hood / face
  ctx.fillStyle='#ffe9ad';
  ctx.beginPath(); ctx.arc(player.face*2,-7,8,0,TAU); ctx.fill();
  // eyes
  ctx.fillStyle='#1a2a44';
  ctx.beginPath(); ctx.arc(player.face*5,-8,1.7,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(player.face*0.5,-8,1.7,0,TAU); ctx.fill();
  // little lantern in hand
  ctx.fillStyle='#ffd98a';
  ctx.beginPath(); ctx.arc(player.face*13,4,4.2,0,TAU); ctx.fill();
  ctx.fillStyle='#fff6d8'; ctx.beginPath(); ctx.arc(player.face*13,4,2,0,TAU); ctx.fill();
  ctx.restore();

  // dash cooldown pip
  if (player.dashCd>0){
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(player.x, player.y+26, 9, 0, TAU); ctx.fill();
    ctx.fillStyle='#aef3ff';
    ctx.beginPath(); ctx.arc(player.x, player.y+26, 9, -Math.PI/2, -Math.PI/2 + TAU*(1-player.dashCd/1.1)); ctx.fill();
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const p of popups){
    ctx.globalAlpha = clamp(p.life,0,1);
    ctx.fillStyle=p.color; ctx.font='bold 15px Trebuchet MS'; ctx.textAlign='center';
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha=1;
}
function drawDust(){
  ctx.save();
  for(const d of decor.dust){
    const x = d.x + Math.sin(performance.now()/2000*d.sp + d.ph)*22;
    const y = d.y + Math.cos(performance.now()/2600*d.sp + d.ph)*14;
    ctx.globalAlpha = 0.12+0.1*Math.sin(performance.now()/900+d.ph);
    ctx.fillStyle='#cfeeff';
    ctx.beginPath(); ctx.arc(x,y,d.s,0,TAU); ctx.fill();
  }
  ctx.restore();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBG();
  const shx = shake>0 ? (Math.random()-0.5)*shake : 0;
  const shy = shake>0 ? (Math.random()-0.5)*shake : 0;
  ctx.save();
  ctx.translate(-Math.round(cam.x)+shx, -Math.round(cam.y)+shy);
  drawFloor();
  drawThorns();
  drawGate();
  drawAnchors();
  drawShards();
  drawDust();
  drawPlayer();
  drawParticles();
  ctx.restore();
  // vignette
  const v = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.42,W/2,H/2,Math.max(W,H)*0.78);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(2,5,14,.55)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  // level fade-in
  if (fade>0){ ctx.fillStyle=`rgba(4,8,20,${fade})`; ctx.fillRect(0,0,W,H); }
}

/* ---------- main loop ---------- */
let lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - lastT)/1000; lastT = now;
  dt = clamp(dt, 0, 0.033);
  if (state==='playing') update(dt);
  else if (state==='levelclear' && clearTimer>0){ clearTimer-=dt; if(clearTimer<=0) showLevelClearOverlay(); }
  if (deadTimer>0){ deadTimer-=dt; if(deadTimer<=0) gameOver(); }
  else {
    // idle animation behind overlays
    for(const a of anchors){ if(!a.mv) a.x = a.bx + Math.sin(now/1000*0.5+a.sway)*8; }
    updateMusic();
  }
  if (level) draw();
}
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden && state==='playing') pauseGame();
});
window.addEventListener('blur', ()=>{ if(state==='playing') pauseGame(); });

// boot: build level 1 behind title for a live backdrop
buildLevel(0); levelIdx=0;
titleScreen();
requestAnimationFrame(loop);
</script>
</body>
