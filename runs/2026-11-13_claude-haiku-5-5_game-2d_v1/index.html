<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Run</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #04050d; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block; outline: none; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    box-shadow: 0 0 80px rgba(120, 150, 255, 0.08);
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Lantern Run, a 2D run and jump game"></canvas>
<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* ---------- constants ---------- */
const W = 960;
const H = 540;
const GROUND_Y = 430;            // top surface of the path
const PX = 170;                  // fixed on-screen x of the runner
const GRAVITY = 2400;
const JUMP_V = -820;
const DOUBLE_V = -700;
const MAX_FALL = 1400;
const FAST_FALL = 2100;
const STAND_H = 54;              // hitbox heights
const SLIDE_H = 28;
const THORN_H = 36;
const BRAMBLE_TOP = 360;         // branch hitbox band (standing hits, sliding passes)
const BRAMBLE_BOTTOM = 384;
const WRAP = 2400;               // parallax repeat width
const MAX_PARTS = 420;
const TAU = Math.PI * 2;
const STORE_KEY = 'lanternRun.best.v1';
const UI_FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
const DISPLAY_FONT = 'Georgia, "Palatino Linotype", "Book Antiqua", Palatino, serif';
const DANGER = '#ff6b8b';
const PAUSE_BTN = { x: W - 50, y: 40, w: 34, h: 34 };
const MUTE_BTN = { x: W - 94, y: 40, w: 34, h: 34 };
const JUMP_KEYS = new Set(['Space', 'ArrowUp', 'KeyW']);
const SLIDE_KEYS = new Set(['ArrowDown', 'KeyS']);
const PREVENT_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);

/* ---------- stages: each one darker, faster and denser than the last ---------- */
const STAGES = [
  { name: 'Moonwood', len: 9000, speed: 300, gap: 560, seed: 11, mote: 0.5, drain: 3.0, decor: 'pines',
    sky: ['#070b22', '#18275a', '#33407a'], far: '#1d2c5e', mid: '#14264f', near: '#0b1836',
    ground: '#27384f', soil: '#161f31', grass: '#5fd39c', accent: '#ffd66e',
    weights: { thorn: 4, bramble: 2, pit: 2, combo: 0 } },
  { name: 'Thornwood', len: 10000, speed: 340, gap: 510, seed: 23, mote: 0.46, drain: 3.4, decor: 'spires',
    sky: ['#0b0a1d', '#2a1645', '#5c2b52'], far: '#3a1f4f', mid: '#2a1438', near: '#170a24',
    ground: '#33233d', soil: '#1c1324', grass: '#c17be0', accent: '#ff9cc4',
    weights: { thorn: 3, bramble: 3, pit: 2, combo: 1 } },
  { name: 'Sunken Ruins', len: 11000, speed: 385, gap: 465, seed: 37, mote: 0.42, drain: 3.8, decor: 'ruins',
    sky: ['#061a24', '#14405a', '#2e6a72'], far: '#1b4a5a', mid: '#123844', near: '#09242d',
    ground: '#2e4b51', soil: '#18292d', grass: '#86e8c9', accent: '#a6f8ff',
    weights: { thorn: 2, bramble: 3, pit: 3, combo: 2 } },
  { name: 'The Long Dark', len: 12000, speed: 430, gap: 410, seed: 53, mote: 0.4, drain: 4.2, decor: 'pines',
    sky: ['#04030c', '#1b1236', '#462645'], far: '#2a1b44', mid: '#1b1131', near: '#0c0719',
    ground: '#2a2433', soil: '#13101b', grass: '#e7a2ff', accent: '#ffe27a',
    weights: { thorn: 2, bramble: 3, pit: 3, combo: 3 } }
];

const TOTAL_LEN = STAGES.reduce((sum, st) => sum + st.len, 0);
const STAGE_START = [];
{
  let acc = 0;
  for (const st of STAGES) { STAGE_START.push(acc); acc += st.len; }
}

/* ---------- helpers ---------- */
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, n) => ((a % n) + n) % n;
const hash01 = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
const stageAt = (x) => { for (let i = STAGES.length - 1; i > 0; i--) if (x >= STAGE_START[i]) return i; return 0; };
const fmtTime = (sec) => { const s = Math.floor(sec); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, color, align = 'left', weight = '600', family = UI_FONT) {
  ctx.font = `${weight} ${size}px ${family}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

/* ---------- best score (guarded storage) ---------- */
function loadBest() {
  try {
    const v = parseInt(window.localStorage.getItem(STORE_KEY), 10);
    return Number.isFinite(v) && v > 0 ? v : 0;
  } catch (err) {
    return 0;
  }
}

function saveBest(v) {
  try {
    window.localStorage.setItem(STORE_KEY, String(v));
  } catch (err) {
    /* storage unavailable: the score simply lasts for this session */
  }
}

let best = loadBest();
