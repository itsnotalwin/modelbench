<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON CORE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #040408; color: #e0e0ff; font-family: 'Courier New', Courier, monospace; -webkit-tap-highlight-color: transparent; }
  #canvas-wrap { position: absolute; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; z-index: 20; }
  .screen { pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; inset: 0; background: rgba(4,4,8,0.92); backdrop-filter: blur(4px); z-index: 21; }
  .hidden { display: none !important; }
  h1 { font-size: clamp(2rem, 8vw, 4rem); letter-spacing: 0.45rem; margin-bottom: 0.6rem; text-transform: uppercase; }
  p.sub { font-size: clamp(0.85rem, 3vw, 1.15rem); color: #88aadd; margin-bottom: 1rem; letter-spacing: 0.15rem; }
  button { font-family: inherit; font-size: clamp(0.9rem, 3vw, 1.1rem); padding: 0.7rem 1.6rem; background: transparent; color: #0fe; border: 2px solid #0fe; cursor: pointer; text-transform: uppercase; letter-spacing: 0.2rem; transition: all 0.15s; border-radius: 2px; }
  button:active { transform: scale(0.95); }
  button:hover { background: #0fe; color: #001; box-shadow: 0 0 20px rgba(0,255,238,0.6); }
  button.secondary { border-color: #ff6; color: #ff6; }
  button.secondary:hover { background: #ff6; color: #001; box-shadow: 0 0 20px rgba(255,255,100,0.6); }
  #hud { position: absolute; top: 16px; left: 16px; pointer-events: none; z-index: 22; display: flex; flex-direction: column; gap: 6px; }
  .hud-row { display: flex; gap: 12px; font-size: clamp(0.9rem, 2.5vw, 1.1rem); font-weight: bold; text-shadow: 0 0 8px rgba(0,255,238,0.5); }
  .hp { color: #ff4444; }
  .score { color: #0fe; }
  .hi { color: #ff6; }
  #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; border: 1.5px solid rgba(0,255,238,0.5); border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none; z-index: 1; }
  .hints { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 0.75rem; color: #446; pointer-events: none; z-index: 22; letter-spacing: 0.1rem; }
  .touch-layer { position: absolute; inset: 0; pointer-events: none; z-index: 15; display: flex; justify-content: space-between; padding: 24px; }
  .touch-side { pointer-events: auto; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .dpad { width: 110px; height: 110px; border: 2px solid rgba(0,255,238,0.25); border-radius: 50%; position: relative; touch-action: none; }
  .dpad-thumb { width: 42px; height: 42px; background: rgba(0,255,238,0.35); border-radius: 50%; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); pointer-events: none; }
  .btn-touch { width: 70px; height: 70px; border: 2px solid rgba(255,255,100,0.35); border-radius: 50%; color: #ff6; font-size: 0.65rem; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; margin-top: 14px; }
  .btn-touch:active { border-color: #ff6; background: rgba(255,255,100,0.15); }
  .lbl { font-size: 0.55rem; color: #666; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.08rem; }
  #pauseBtn { position: absolute; top: 16px; right: 16px; z-index: 22; font-size: 0.8rem; padding: 0.5rem 1rem; }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div id="hud">
  <div class="hud-row"><span class="hp" id="hpText">HP ♥♥♥</span><span class="score" id="scoreText">SCORE 0</span></div>
  <div class="hud-row"><span class="hi" id="hiText">HI 0</span><span id="dashText" style="color:#0fe;">DASH READY</span></div>
</div>
<div id="crosshair"></div>
<div class="hints">WASD/ARROWS: MOVE &nbsp;•&nbsp; SPACE: DASH &nbsp;•&nbsp; ESC: PAUSE</div>
<button id="pauseBtn">PAUSE</button>

<div class="touch-layer">
  <div class="touch-side">
    <div class="dpad" id="dpad"><div class="dpad-thumb" id="dpadThumb"></div></div>
    <div class="lbl">MOVE</div>
  </div>
  <div class="touch-side" style="align-items:flex-end;">
    <div class="btn-touch" id="btnDash">DASH<div class="lbl">SPACE</div></div>
  </div>
</div>

<div id="title" class="screen">
  <h1 style="color:#0fe; text-shadow:0 0 20px rgba(0,255,238,0.6);">NEON<span style="color:#ff6;">CORE</span></h1>
  <p class="sub">Collect light motes • Dodge corruption • Dash to survive</p>
  <button id="btnStart">INITIATE CORE</button>
  <div style="margin-top:1rem; font-size:0.85rem; color:#668;">HI: <span id="hiTitle">0</span></div>
</div>

<div id="pauseScreen" class="screen hidden">
  <h1 style="color:#ff6;">CORE HOLD</h1>
  <button id="btnResume" class="secondary">RESUME</button>
</div>

<div id="gameOver" class="screen hidden">
  <h1 style="color:#ff4444; text-shadow:0 0 25px rgba(255,68,68,0.7);">CORE BREACH</h1>
  <div id="finalScore" style="font-size:1.4rem; margin:0.5rem 0;">SCORE: 0</div>
  <div id="newHi" style="color:#ff6; font-size:0.9rem; margin-bottom:1rem; display:none;">NEW HIGH SCORE</div>
  <button id="btnRestart">REBOOT CORE</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

/* ============================================================
   NEON CORE — single-file procedural 3D arcade game
   ============================================================ */

const CFG = {
  playerSpeed: 13,
  dashSpeed: 36,
  dashDuration: 0.22,
  dashCooldown: 1.6,
  playerRadius: 1.1,
  orbRadius: 0.9,
  enemyRadius: 1.5,
  hpMax: 3,
  spawnBase: 2.6,
  spawnMin: 0.75,
  orbSpawnBase: 2.0,
  worldRadius: 34,
};

class AudioSys {
  constructor(){ this.ctx=null; this.ready=false; this.musicInterval=null; }
  init(){
    if(this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.ready=true;
  }
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); }
  _tone(freq,type,dur,vol,offsetMs=0){
    if(!this.ready) return;
    const t=this.ctx.currentTime+(offsetMs>0?offsetMs/1000:0);
    const o=this.ctx.createOscillator(); const g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t+dur);
  }
  _noise(dur,vol,offsetMs=0){
    if(!this.ready) return;
    const t=this.ctx.currentTime+(offsetMs>0?offsetMs/1000:0);
    const bufSize=this.ctx.sampleRate*dur;
    const buf=this.ctx.createBuffer(1,bufSize,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<bufSize;i++) d[i]=Math.random()*2-1;
    const n=this.ctx.createBufferSource(); n.buffer=buf;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
    n.connect(f); f.connect(g); g.connect(this.ctx.destination);
    n.start(t); n.stop(t+dur);
  }
  collect(){ this._tone(1000,'sine',0.09,0.22); this._tone(1500,'sine',0.07,0.16,70); }
  hit(){ this._noise(0.22,0.26); this._tone(110,'sawtooth',0.18,0.22,60); }
  dash(){ this._tone(420,'sawtooth',0.06,0.16); this._tone(950,'square',0.06,0.11,45); }
  gameover(){ this._tone(140,'sawtooth',0.3,0.26); this._tone(90,'sawtooth',0.45,0.26,330); this._noise(0.5,0.32); }
  startMusic(){
    if(this.musicInterval) return;
    let t=0;
    const arpeggio=[220,247,294,330,349,392,440,494,523];
    this.musicInterval=setInterval(()=>{
      if(!this.ready) return;
      const note=arpeggio[Math.floor((t/420)%arpeggio.length)];
      this._tone(note,'triangle',300,0.055);
      if(t%1700===0) this._tone(100,'sine',350,0.035);
      t+=420;
    },420);
  }
  stopMusic(){ if(this.musicInterval){ clearInterval(this.musicInterval); this.musicInterval=null; } }
}
const Audio = new AudioSys();

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

function buildPlayer(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,1), new THREE.MeshStandardMaterial({color:0x0fe, emissive:0x0fe, emissiveIntensity:1.5, roughness:0.1, metalness:0.6}));
  body.castShadow=true;
  const core=new THREE.Mesh(new THREE.IcosahedronGeometry(0.5,2), new THREE.MeshBasicMaterial({color:0xffffff}));
  core.position.y=0.35;
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.55,0.9,16), new THREE.MeshBasicMaterial({color:0x0fe, side:THREE.DoubleSide}));
  ring.rotation.x=Math.PI/2;
  g.add(body,core,ring);
  return g;
}
function buildOrb(){
  const g=new THREE.Group();
  const mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(0.85,2), new THREE.MeshStandardMaterial({color:0xff6, emissive:0xff6, emissiveIntensity:2, roughness:0.05, metalness:0.8}));
  mesh.castShadow=true;
  const glow=new THREE.Mesh(new THREE.SphereGeometry(1.0,10,10), new THREE.MeshBasicMaterial({color:0xff6, transparent:true, opacity:0.35}));
  g.add(mesh,glow);
  return g;
}
function buildEnemy(){
  const g=new THREE.Group();
  const geom=new THREE.IcosahedronGeometry(1.35,1);
  const pos=geom.attributes.position;
  const tmp=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
    tmp.fromBufferAttribute(pos,i);
    tmp.multiplyScalar(1+Math.random()*1.0);
    pos.setXYZ(i,tmp.x,tmp.y,tmp.z);
  }
  geom.computeVertexNormals();
  const mesh=new THREE.Mesh(geom, new THREE.MeshStandardMaterial({color:0xff2244, emissive:0x770011, emissiveIntensity:1.3, roughness:0.3, metalness:0.5}));
  mesh.castShadow=true;
  const core=new THREE.Mesh(new THREE.SphereGeometry(0.5,10,10), new THREE.MeshBasicMaterial({color:0xffffff}));
  g.add(mesh,core);
  return g;
}
function buildParticle(color){
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.2), new THREE.MeshBasicMaterial({color}));
  return {mesh:m, vx:0,vy:0,vz:0,life:1};
}

class Game {
  constructor(){
    this.container=document.getElementById('canvas-wrap');
    this.renderer=null; this.scene=null; this.camera=null;
    this.playerMesh=null;
    this.player={x:0,y:0,z:0,vx:0,vz:0,hp:CFG.hpMax,invuln:0,dash:0,dashCd:0};
    this.orbs=[]; this.enemies=[]; this.particles=[];
    this.score=0; this.high=0; this.timeAlive=0;
    this.state='title';
    this.dt=0; this.last=0;
    this.keys={}; this.touch={dx:0,dy:0,active:false};
    this.shake=0;
    this.spawnTimer=0; this.orbTimer=0;
    this.speedAccel=2.2;
    this.initDOM();
    this.initThree();
    this.initInput();
    this.resize();
    window.addEventListener('resize',()=>this.resize());
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){ if(this.state==='playing') this.pause(); }
      else { if(this.state==='paused') this.resumeGame(); }
    });
    this.loadHigh();
    this.updateHUD();
    this.loop(0);
  }
  initDOM(){
    document.getElementById('btnStart').addEventListener('click',()=>{ Audio.init(); Audio.resume(); this.start(); });
    document.getElementById('btnResume').addEventListener('click',()=>{ Audio.init(); Audio.resume(); this.resumeGame(); });
    document.getElementById('btnRestart').addEventListener('click',()=>{ Audio.init(); Audio.resume(); this.start(); });
    document.getElementById('pauseBtn').addEventListener('click',()=>{ this.state==='playing'?this.pause():this.resumeGame(); });
    this.dpad=document.getElementById('dpad'); this.thumb=document.getElementById('dpadThumb');
    this.btnDashEl=document.getElementById('btnDash');
    const add=(el,down,up)=>{
      el.addEventListener('touchstart',e=>{e.preventDefault();down();},{passive:false});
      el.addEventListener('touchend',e=>{e.preventDefault();up();},{passive:false});
      el.addEventListener('touchcancel',e=>{e.preventDefault();up();},{passive:false});
    };
    add(this.dpad,()=>{this.touch.active=true;},()=>{this.touch.active=false;this.touch.dx=0;this.touch.dy=0;this.thumb.style.transform='translate(-50%,-50%)';});
    this.dpad.addEventListener('touchmove',e=>{
      e.preventDefault();
      const r=this.dpad.getBoundingClientRect();
      const cx=r.left+r.width/2, cy=r.top+r.height/2;
      let dx=e.touches[0].clientX-cx, dy=e.touches[0].clientY-cy;
      const dist=Math.hypot(dx,dy); const max=r.width/2-22;
      if(dist>max){dx*=max/dist;dy*=max/dist;}
      this.touch.dx=dx/max; this.touch.dy=-dy/max;
      this.thumb.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    },{passive:false});
    add(this.btnDashEl,()=>{this.tryDash();},()=>{});
  }
  initThree(){
    this.renderer=new THREE.WebGLRenderer({antialias:true, alpha:false});
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    this.renderer.setSize(window.innerWidth,window.innerHeight);
    this.renderer.shadowMap.enabled=true;
    this.renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    this.renderer.setClearColor(0x040408,1);
    this.container.appendChild(this.renderer.domElement);
    this.scene=new THREE.Scene();
    this.scene.fog=new THREE.FogExp2(0x040408,0.03);
    this.camera=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,0.1,140);
    this.camera.position.set(0,10,15);
    const al=new THREE.AmbientLight(0x404060,0.5);
    this.scene.add(al);
    const dl=new THREE.DirectionalLight(0x0feeee,0.9);
    dl.position.set(12,22,10);
    dl.castShadow=true;
    dl.shadow.mapSize.set(1024,1024);
    dl.shadow.camera.near=1; dl.shadow.camera.far=70;
    dl.shadow.camera.left=-22; dl.shadow.camera.right=22; dl.shadow.camera.top=22; dl.shadow.camera.bottom=-22;
    this.scene.add(dl);
    const pl=new THREE.PointLight(0xff6,0.5,28);
    pl.position.set(-12,6,-12);
    this.scene.add(pl);
    const sg=new THREE.BufferGeometry(); const sp=[];
    for(let i=0;i> -1 && i<220;i++){}
    for(let i=0;i<220;i++){
      sp.push(rand(-70,70),rand(1,42),rand(-70,70));
    }
    sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
    const sm=new THREE.PointsMaterial({size:0.13, color:0x88aaff, transparent:true, opacity:0.6});
    this.starsMesh=new THREE.Points(sg,sm);
    this.scene.add(this.starsMesh);
    const fg=new THREE.GridHelper(72,30,0x1a2a33,0x080810);
    fg.position.y=0;
    this.scene.add(fg);
    this.playerMesh=buildPlayer();
    this.playerMesh.position.set(0,CFG.playerRadius+0.35,0);
    this.scene.add(this.playerMesh);
    Audio.startMusic();
  }
  initInput(){
    window.addEventListener('keydown',e=>{
      this.keys[e.code]=true;
      if(e.code==='Escape'||e.code==='KeyP'){
        if(this.state==='playing') this.pause();
        else if(this.state==='paused') this.resumeGame();
      }
      if(e.code==='Space'&&this.state==='playing') this.tryDash();
    });
    window.addEventListener('keyup',e=>{this.keys[e.code]=false;});
  }
  resize(){
    const w=window.innerWidth,h=window.innerHeight;
    this.camera.aspect=w/h; this.camera.updateProjectionMatrix();
    this.renderer.setSize(w,h);
  }
  loadHigh(){
    try{ this.high=parseInt(localStorage.getItem('neoncore_hi')||'0',10)||0; }catch(e){ this.high=0; }
    document.getElementById('hiTitle').textContent=this.high;
    document.getElementById('hiText').textContent='HI '+this.high;
  }
  saveHigh(){
    try{ localStorage.setItem('neoncore_hi',String(this.high)); }catch(e){}
  }
  updateHUD(){
    document.getElementById('scoreText').textContent='SCORE '+this.score;
    document.getElementById('hiText').textContent='HI '+this.high;
    document.getElementById('hpText').textContent='HP '+'♥'.repeat(this.player.hp)+' '.repeat(CFG.hpMax-this.player.hp);
    const ready=this.player.dash<=0 && this.player.dashCd<=0;
    document.getElementById('dashText').textContent=ready?'DASH READY':'DASH CD';
    document.getElementById('dashText').style.color=ready?'#0fe':'#f66';
  }
  pause(){ if(this.state!=='playing')return; this.state='paused'; Audio.stopMusic(); document.getElementById('pauseScreen').classList.remove('hidden'); }
  resumeGame(){ if(this.state!=='paused')return; this.state='playing'; Audio.startMusic(); document.getElementById('pauseScreen').classList.add('hidden'); this.last=performance.now(); this.loop(this.last); }
  start(){
    this.state='playing';
    this.score=0; this.timeAlive=0;
    this.player.hp=CFG.hpMax; this.player.invuln=0; this.player.dash=0; this.player.dashCd=0;
    this.player.x=0; this.player.y=CFG.playerRadius+0.35; this.player.z=0;
    this.player.vx=0; this.player.vz=0;
    this.orbs.forEach(o=>this.scene.remove(o)); this.orbs=[];
    this.enemies.forEach(e=>this.scene.remove(e)); this.enemies=[];
    this.particles.forEach(p=>this.scene.remove(p.mesh)); this.particles=[];
    this.spawnTimer=0; this.orbTimer=0; this.shake=0;
    document.getElementById('title').classList.add('hidden');
    document.getElementById('gameOver').classList.add('hidden');
    document.getElementById('pauseScreen').classList.add('hidden');
    this.updateHUD();
    Audio.startMusic();
    this.last=performance.now();
    this.loop(this.last);
  }
  gameOver(){
    this.state='gameover';
    Audio.stopMusic(); Audio.gameover();
    let isNew=false;
    if(this.score>this.high){ this.high=this.score; this.saveHigh(); isNew=true; }
    document.getElementById('newHi').style.display=isNew?'block':'none';
    document.getElementById('finalScore').textContent='SCORE: '+this.score;
    document.getElementById('hiTitle').textContent=this.high;
    document.getElementById('gameOver').classList.remove('hidden');
  }
  tryDash(){
    if(this.state!=='playing')return;
    if(this.player.dash>0||this.player.dashCd>0)return;
    this.player.dash=CFG.dashDuration;
    this.player.dashCd=CFG.dashCooldown;
    let dx=(this.keys['KeyW']||this.keys['ArrowUp'])?1:(this.keys['KeyS']||this.keys['ArrowDown'])?-1:0;
    let dz=(this.keys['KeyD']||this.keys['ArrowRight'])?1:(this.keys['KeyA']||this.keys['ArrowLeft'])?-1:0;
    if(Math.abs(dx)<0.15){dx=this.touch.dx;}
    if(Math.abs(dz)<0.15){dz=-this.touch.dy;}
    if(Math.abs(dx)<0.15&&Math.abs(dz)<0.15){dz=1;}
    const len=Math.hypot(dx,dz); dx/=len; dz/=len;
    this.player.vx=dx*CFG.dashSpeed;
    this.player.vz=dz*CFG.dashSpeed;
    Audio.dash();
    for(let i=0;i<14;i++){
      const p=buildParticle(0x0fe);
      p.mesh.position.set(this.player.x,this.player.y,this.player.z);
      const a=Math.random()*Math.PI*2; const s=rand(4,10);
      p.vx=Math.cos(a)*s-dx*7; p.vy=rand(2,9); p.vz=Math.sin(a)*s-dz*7;
      p.life=1; this.particles.push(p); this.scene.add(p.mesh);
    }
  }
  spawnOrb(){
    const side=Math.floor(Math.random()*4);
    let x=0,z=0;
    if(side===0){x=rand(-CFG.worldRadius,CFG.worldRadius); z=CFG.worldRadius;}
    else if(side===1){x=rand(-CFG.worldRadius,CFG.worldRadius); z=-CFG.worldRadius;}
    else if(side===2){x=CFG.worldRadius; z=rand(-CFG.worldRadius,CFG.worldRadius);}
    else {x=-CFG.worldRadius; z=rand(-CFG.worldRadius,CFG.worldRadius);}
    const o=buildOrb();
    o.position.set(x,rand(1,5),z);
    o.vx=(0-x)*0.025; o.vz=(0-z)*0.025;
    o.bob=0; o.bobSpeed=rand(0.009,0.016);
    this.scene.add(o);
    this.orbs.push(o);
  }
  spawnEnemy(){
    const t=Math.min(this.timeAlive,45);
    const speed=rand(3+t*0.14, 7+t*0.26);
    const side=Math.floor(Math.random()*4);
    let x=0,z=0;
    if(side===0){x=rand(-CFG.worldRadius,CFG.worldRadius); z=CFG.worldRadius;}
    else if(side===1){x=rand(-CFG.worldRadius,CFG.worldRadius); z=-CFG.worldRadius;}
    else if(side===2){x=CFG.worldRadius; z=rand(-CFG.worldRadius,CFG.worldRadius);}
    else {x=-CFG.worldRadius; z=rand(-CFG.worldRadius,CFG.worldRadius);}
    const e=buildEnemy();
    e.position.set(x,rand(1,3.5),z);
    const dir=new THREE.Vector3(0-x,0,0-z).normalize();
    e.vx=dir.x*speed; e.vz=dir.z*speed;
    e.rotSpeed=rand(0.015,0.04);
    this.scene.add(e);
    this.enemies.push(e);
  }
  spawnParticles(x,y,z,color,n){
    for(let i=0;i<n;i++){
      const p=buildParticle(color);
      p.mesh.position.set(x,y,z);
      p.vx=rand(-5,5); p.vy=rand(-4,9); p.vz=rand(-5,5);
      p.life=1; this.particles.push(p); this.scene.add(p.mesh);
    }
  }
  orbCollect(o){
    const i=this.orbs.indexOf(o); if(i<0)return;
    this.orbs.splice(i,1);
    this.scene.remove(o);
    this.score+=12;
    Audio.collect();
    this.spawnParticles(this.player.x,this.player.y,this.player.z,0xff6,7);
    this.updateHUD();
  }
  enemyHitPlayer(){
    if(this.player.invuln>0||this.player.dash>0)return;
    this.player.hp--;
    this.player.invuln=1.5;
    Audio.hit();
    this.shake=0.55;
    this.spawnParticles(this.player.x,this.player.y,this.player.z,0xff2244,11);
    this.updateHUD();
    if(this.player.hp<=0){ this.gameOver(); }
  }
  update(dt){
    if(this.state!=='playing')return;
    let ax=0,az=0;
    if(this.keys['KeyW']||this.keys['ArrowUp']) az-=1;
    if(this.keys['KeyS']||this.keys['ArrowDown']) az+=1;
    if(this.keys['KeyA']||this.keys['ArrowLeft']) ax-=1;
    if(this.keys['KeyD']||this.keys['ArrowRight']) ax+=1;
    ax+=this.touch.dx; az-=this.touch.dy;
    const len=Math.hypot(ax,az);
    if(len>0){ax/=len;az/=len;}
    const targetVx=ax*CFG.playerSpeed;
    const targetVz=az*CFG.playerSpeed;
    const damp=0.8;
    this.player.vx+=(targetVx-this.player.vx)*(1-damp);
    this.player.vz+=(targetVz-this.player.vz)*(1-damp);
    if(this.player.dash>0){
      this.player.dash-=dt;
      if(this.player.dash<=0){ this.player.vx*=0.3; this.player.vz*=0.3; }
    }
    if(this.player.dashCd>0){ this.player.dashCd-=dt; if(this.player.dashCd<0)this.player.dashCd=0; }
    if(this.player.invuln>0){ this.player.invuln-=dt; if(this.player.invuln<0)this.player.invuln=0; }
    this.player.x+=this.player.vx*dt;
    this.player.z+=this.player.vz*dt;
    this.player.y=CFG.playerRadius+0.35+Math.sin(this.timeAlive*4)*0.22;
    const r=CFG.worldRadius-2.5;
    this.player.x=clamp(this.player.x,-r,r);
    this.player.z=clamp(this.player.z,-r,r);
    this.timeAlive+=dt;
    if(Math.floor(this.timeAlive*2)>Math.floor((this.timeAlive-dt)*2)){ this.score+=1; this.updateHUD(); }
    const spawnRate=Math.max(CFG.spawnMin, CFG.spawnBase - this.timeAlive*0.035);
    this.spawnTimer+=dt;
    if(this.spawnTimer>spawnRate){ this.spawnTimer=0; this.spawnEnemy(); }
    this.orbTimer+=dt;
    if(this.orbTimer>CFG.orbSpawnBase){ this.orbTimer=0; if(this.orbs.length<5) this.spawnOrb(); }
    for(let i=this.orbs.length-1;i>=0;i--){
      const o=this.orbs[i];
      o.position.x+=o.vx; o.position.z+=o.vz;
      o.bob+=o.bobSpeed; o.position.y=1+Math.sin(o.bob)*0.55;
      o.rotation.y+=0.025; o.rotation.x+=0.018;
      const dxo=o.position.x-this.player.x, dzo=o.position.z-this.player.z;
      if(dxo*dxo+dzo*dzo<(CFG.playerRadius+CFG.orbRadius)**2){ this.orbCollect(o); continue; }
      if(Math.abs(o.position.x)>CFG.worldRadius+6||Math.abs(o.position.z)>CFG.worldRadius+6){ this.scene.remove(o); this.orbs.splice(i,1); }
    }
    for(let i=this.enemies.length-1;i>=0;i--){
      const e=this.enemies[i];
      e.position.x+=e.vx*dt; e.position.z+=e.vz*dt;
      e.rotation.x+=e.rotSpeed; e.rotation.y+=e.rotSpeed*0.8;
      const pdx=this.player.x-e.position.x, pdz=this.player.z-e.position.z;
      const pl=Math.hypot(pdx,pdz);
      if(pl>0){ e.vx+=(pdx/pl)*this.speedAccel*dt; e.vz+=(pdz/pl)*this.speedAccel*dt; }
      const sl=Math.hypot(e.vx,e.vz);
      if(sl>0){ const cap=6+Math.min(this.timeAlive,45)*0.24; if(sl>cap){e.vx*=cap/sl;e.vz*=cap/sl;} }
      const dxe=this.player.x-e.position.x, dze=this.player.z-e.position.z;
      if(dxe*dxe+dze*dze<(CFG.playerRadius+CFG.enemyRadius)**2){ this.enemyHitPlayer(); }
      if(Math.abs(e.position.x)>CFG.worldRadius+9||Math.abs(e.position.z)>CFG.worldRadius+9){ this.scene.remove(e); this.enemies.splice(i,1); }
    }
    for(let i=this.particles.length-1;i>=0;i--){
      const p=this.particles[i];
      p.mesh.position.x+=p.vx*dt; p.mesh.position.y+=p.vy*dt; p.mesh.position.z+=p.vz*dt;
      p.vy-=15*dt;
      p.life-=dt*1.7;
      p.mesh.scale.setScalar(Math.max(0,p.life));
      p.mesh.material.opacity=Math.max(0,p.life);
      if(p.life<=0){ this.scene.remove(p.mesh); this.particles.splice(i,1); }
    }
    const leadX=this.player.x+this.player.vx*0.25;
    const leadZ=this.player.z+this.player.vz*0.25;
    this.camera.position.x += (leadX-this.camera.position.x)*0.11;
    this.camera.position.y = 10 + Math.sin(this.timeAlive)*0.35 + (this.shake>0?(Math.random()-0.5)*this.shake*0.5:0);
    this.camera.position.z += (this.player.z+14-this.camera.position.z)*0.11;
    this.camera.lookAt(leadX, this.player.y+0.8, leadZ);
    if(this.shake>0) this.shake-=dt*2.2;
    this.playerMesh.position.set(this.player.x,this.player.y,this.player.z);
    this.playerMesh.rotation.y+=0.025;
    const body=this.playerMesh.children[0];
    const core=this.playerMesh.children[1];
    if(this.player.invuln>0){ this.playerMesh.visible=Math.floor(this.timeAlive*18)%2===0; }
    else { this.playerMesh.visible=true; }
    if(this.player.dash>0){ body.material.color.setHex(0xff6); core.material.color.setHex(0xff6); }
    else { body.material.color.setHex(0x0fe); core.material.color.setHex(0xffffff); }
  }
  loop(now){
    if(this.state==='title'||this.state==='gameover'){
      this.starsMesh.rotation.y+=0.0004;
      this.renderer.render(this.scene,this.camera);
      requestAnimationFrame((t)=>this.loop(t));
      return;
    }
    if(this.state==='paused'){ requestAnimationFrame((t)=>this.loop(t)); return; }
    const dt=Math.min((now-this.last)/1000,0.05);
    this.last=now;
    this.update(dt);
    this.renderer.render(this.scene,this.camera);
    requestAnimationFrame((t)=>this.loop(t));
  }
}

window.addEventListener('DOMContentLoaded',()=>{ new Game(); });
</script>
