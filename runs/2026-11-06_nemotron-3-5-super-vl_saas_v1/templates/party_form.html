{% extends "base.html" %}
{% block title %}{{ "New party" if mode == "create" else "Edit party" }} &mdash; ClearOps{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ "New party" if mode == "create" else "Edit party" }}</h1>
  <a href="{{ url_for('parties_list') }}" class="btn ghost small">Back to list</a>
</div>

<div class="card" style="max-width: 640px;">
  <form method="post" action="{{ url_for(mode == 'create' and 'party_new' or 'party_edit', party_id=party_id) if mode=='edit' else url_for('party_new') }}">
    <div class="field">
      <label>Name</label>
      <input name="name" value="{{ party.name if party else '' }}" required autofocus>
    </div>
    <div class="field">
      <label>Type</label>
      <select name="type" required>
        <option value="importer" {% if party and party.type == 'importer' %}selected{% endif %}>Importer</option>
        <option value="exporter" {% if party and party.type == 'exporter' %}selected{% endif %}>Exporter</option>
        <option value="consignee" {% if party and party.type == 'consignee' %}selected{% endif %}>Consignee</option>
        <option value="agent" {% if party and party.type == 'agent' %}selected{% endif %}>Agent</option>
        <option value="carrier" {% if party and party.type == 'carrier' %}selected{% endif %}>Carrier</option>
      </select>
    </div>
    <div class="field full">
      <label>Address</label>
      <input name="address" value="{{ party.address if party else '' }}">
    </div>
    <div class="field">
      <label>Contact person</label>
      <input name="contact_person" value="{{ party.contact_person if party else '' }}">
    </div>
    <div class="field">
      <label>Email</label>
      <input name="email" type="email" value="{{ party.email if party else '' }}">
    </div>
    <div class="field">
      <label>Phone</label>
      <input name="phone" value="{{ party.phone if party else '' }}">
    </div>
    <div class="field">
      <label>Tax ID / GSTIN</label>
      <input name="tax_id" value="{{ party.tax_id if party else '' }}">
    </div>
    <div class="form-actions">
      {% if mode == 'edit' %}
        <a href="{{ url_for('parties_list') }}" class="btn ghost small">Cancel</a>
      {% endif %}
      <button class="btn" type="submit">{{ "Create party" if mode == 'create' else "Save changes" }}</button>
    </div>
  </form>
</div>
{% endblock %}
