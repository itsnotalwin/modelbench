<title>Clearline Ops — Customs Clearing &amp; Freight Forwarding</title>
<!--
  CLEARLINE OPS — SINGLE-FILE HTML EDITION
  ========================================
  HOW TO RUN: Open this file in any modern browser (double-click it).
  No server, no install, no internet, no API keys required.
  Data persists in this browser's localStorage. Use "Reset demo data"
  (signed in, footer) to wipe and re-seed.

  FAKE SIGN-IN: any email + any password signs you in (new emails auto-create a local account).
  Demo accounts also work: demo@clearline.local / Demo1234!
  Sign-up is also available on the sign-in screen.

  WHAT IT IS: A clearance command centre for clearing agents. It answers the
  three questions that block a cargo release: What do we owe customs?
  (CIF → duty → VAT costing with FX) · What documents are missing?
  (BL/invoice/packing/origin/permit checklist) · What is stuck?
  (legal status pipeline + >7-day overdue flag).

  ARCHITECTURE (in this one file): pure domain functions (calcCosts,
  canTransition, validateShipment, isOverdue, docsComplete) are separated from
  storage (localStorage) and rendering (hash router + template strings).
  They are exposed as window.Clearline for automated testing.
  KNOWN LIMITATIONS: Browser-local only — data does not sync between devices,
  passwords are hashed inside the browser (not a substitute for server-side
  auth), duty/VAT seed rates are illustrative, FX is manual, no file uploads.
-->
<style>

<script>
(function(){
"use strict";
/* ============ DOMAIN (pure, testable) ============ */
var STATUSES=["PRE_ARRIVAL","ARRIVED","LODGED","ASSESSED","QUERY","RELEASED","DELIVERED","CANCELLED"];
var STATUS_LABELS={PRE_ARRIVAL:"Pre-arrival",ARRIVED:"Arrived",LODGED:"Lodged",ASSESSED:"Assessed",QUERY:"Query / Hold",RELEASED:"Released",DELIVERED:"Delivered",CANCELLED:"Cancelled"};
var TRANSITIONS={PRE_ARRIVAL:["ARRIVED","CANCELLED"],ARRIVED:["LODGED","QUERY","CANCELLED"],LODGED:["ASSESSED","QUERY","CANCELLED"],ASSESSED:["RELEASED","QUERY","CANCELLED"],QUERY:["LODGED","ASSESSED","CANCELLED"],RELEASED:["DELIVERED","CANCELLED"],DELIVERED:[],CANCELLED:["PRE_ARRIVAL"]};
var MODES=["Sea","Air","Road","Rail"], DIRECTIONS=["Import","Export","Transit"];
var DOC_FIELDS=[["doc_bl","Bill of Lading / AWB"],["doc_invoice","Commercial Invoice"],["doc_packing","Packing List"],["doc_origin","Certificate of Origin"],["doc_import_permit","Import Permit / Rebate"],["doc_freight_invoice","Freight Invoice"]];
function num(v){if(v===null||v===undefined||String(v).trim()==="")return 0;var n=Number(String(v).replace(/,/g,""));return isFinite(n)?n:NaN;}
function calcCosts(o){var v=num(o.value),f=num(o.freight),i=num(o.insurance),dr=num(o.duty_rate),vr=(o.vat_rate===undefined?15:num(o.vat_rate)),cf=num(o.clearing_fee),db=num(o.disbursement),pc=num(o.port_charge),fx=num(o.fx_rate||1);
 [v,f,i,cf,db,pc,dr,vr,fx].forEach(function(x){if(isNaN(x))throw new Error("All cost inputs must be numeric");});
 if(fx<=0)throw new Error("FX rate must be greater than zero");
 if([v,f,i,cf,db,pc].some(function(x){return x<0;}))throw new Error("Costs cannot be negative");
 if(dr<0||dr>100||vr<0||vr>100)throw new Error("Duty and VAT rates must be between 0 and 100 (%)");
 var cif=v+f+i,duty=cif*dr/100,vat=(cif+duty+pc)*vr/100,payable=cif+duty+vat+pc,fees=cf+db,total=payable+fees;
 var r=function(x){return Math.round(x*100)/100;};
 return {cif:r(cif),duty:r(duty),vat:r(vat),total_payable:r(payable),agent_fees:r(fees),total_to_client:r(total),total_payable_local:r(payable*fx),total_to_client_local:r(total*fx),cif_local:r(cif*fx)};}
function canTransition(a,b){return (TRANSITIONS[a]||[]).indexOf(b)>=0;}
function validateShipment(d){var e=[];
 if(!String(d.reference||"").trim())e.push("Reference is required.");else if(String(d.reference).trim().length<3)e.push("Reference must be at least 3 characters.");
 if(!d.client_id)e.push("Client is required.");
 if(DIRECTIONS.indexOf(d.direction)<0)e.push("Direction must be Import, Export or Transit.");
 if(MODES.indexOf(d.mode)<0)e.push("Mode must be Sea, Air, Road or Rail.");
 if(STATUSES.indexOf(d.status)<0)e.push("Status is invalid.");
 ["value","freight","insurance","duty_rate","gross_weight_kg","fx_rate"].forEach(function(k){var n=num(d[k]);if(isNaN(n))e.push(k.replace(/_/g," ")+" must be a number.");else if(n<0)e.push(k.replace(/_/g," ")+" cannot be negative.");});
 var dr=num(d.duty_rate);if(!isNaN(dr)&&(dr<0||dr>100))e.push("Duty rate must be between 0 and 100 (%).");
 if(d.arrival_date&&!/^\d{4}-\d{2}-\d{2}$/.test(d.arrival_date))e.push("Arrival date must be YYYY-MM-DD.");
 if(!String(d.description||"").trim())e.push("Goods description is required.");
 if(!String(d.hs_code||"").trim())e.push("HS code is required.");
 return e;}
function daysSince(ds){if(!ds)return null;var d=new Date(ds+"T00:00:00");if(isNaN(d))return null;return Math.floor((new Date(new Date().toDateString())-d)/86400000);}
function isOverdue(s){if(["ARRIVED","LODGED","ASSESSED","QUERY"].indexOf(s.status)<0)return false;var d=daysSince(s.arrival_date);return d!==null&&d>7;}
function docsComplete(s){return DOC_FIELDS.every(function(p){return !!s[p[0]];});}
function money(n){return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function hash(s){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0;i<s.length;i++){var ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(16)+(h1>>>0).toString(16);}

/* ============ STORAGE + SEED ============ */
var KEY="clearline_ops_v1";

 return {users:[{id:1,email:"demo@clearline.local",name:"Demo Agent",pw:hash("sun::Demo1234!"),role:"admin"},{id:2,email:"agent@clearline.local",name:"Agent User",pw:hash("sun::Agent1234!"),role:"agent"}],

 shipments:[
  {id:1,reference:"CL-2026-001",client_id:1,direction:"Import",mode:"Sea",origin:"Santos, Brazil",destination:"Cape Town",port:"Cape Town",hs_code:"0901.21",description:"Roasted coffee beans, 12t",gross_weight_kg:12000,value:42000,freight:3800,insurance:210,duty_rate:0,currency:"USD",fx_rate:18.2,clearing_fee:4500,disbursement:1200,port_charge:650,arrival_date:D(2),status:"ASSESSED",priority:"High",doc_bl:1,doc_invoice:1,doc_packing:1,doc_origin:1,doc_import_permit:0,doc_freight_invoice:1,notes:"Awaiting payment confirmation."},
  {id:2,reference:"CL-2026-002",client_id:2,direction:"Export",mode:"Sea",origin:"Beaufort West",destination:"Rotterdam",port:"Cape Town",hs_code:"5208.52",description:"Greasy wool bales",gross_weight_kg:18000,value:68000,freight:5200,insurance:340,duty_rate:10,currency:"USD",fx_rate:18.2,clearing_fee:7800,disbursement:900,port_charge:720,arrival_date:D(12),status:"RELEASED",priority:"Normal",doc_bl:1,doc_invoice:1,doc_packing:1,doc_origin:1,doc_import_permit:0,doc_freight_invoice:1,notes:""},
  {id:3,reference:"CL-2026-003",client_id:3,direction:"Import",mode:"Sea",origin:"Guangzhou, China",destination:"Durban",port:"Durban",hs_code:"8708.99",description:"Motor vehicle spare parts",gross_weight_kg:9500,value:95000,freight:7900,insurance:475,duty_rate:25,currency:"USD",fx_rate:18.2,clearing_fee:8200,disbursement:2400,port_charge:1100,arrival_date:D(9),status:"QUERY",priority:"High",doc_bl:1,doc_invoice:1,doc_packing:0,doc_origin:0,doc_import_permit:1,doc_freight_invoice:1,notes:"Customs query: HS classification disputed."},
  {id:4,reference:"CL-2026-004",client_id:4,direction:"Import",mode:"Air",origin:"JHB OR Tambo",destination:"Johannesburg",port:"OR Tambo Intl",hs_code:"8517.12",description:"Mobile phones, 400 units",gross_weight_kg:320,value:28000,freight:2600,insurance:140,duty_rate:0,currency:"USD",fx_rate:18.2,clearing_fee:3100,disbursement:250,port_charge:180,arrival_date:D(1),status:"ARRIVED",priority:"Normal",doc_bl:1,doc_invoice:0,doc_packing:0,doc_origin:0,doc_import_permit:0,doc_freight_invoice:0,notes:"Invoice missing from forwarder."},
  {id:5,reference:"CL-2026-005",client_id:1,direction:"Import",mode:"Sea",origin:"Mombasa, Kenya",destination:"Durban",port:"Durban",hs_code:"1005.90",description:"White maize, bulk",gross_weight_kg:24000,value:31000,freight:2900,insurance:155,duty_rate:0,currency:"USD",fx_rate:18.2,clearing_fee:3900,disbursement:800,port_charge:540,arrival_date:D(20),status:"DELIVERED",priority:"Normal",doc_bl:1,doc_invoice:1,doc_packing:1,doc_origin:1,doc_import_permit:0,doc_freight_invoice:1,notes:""},
  {id:6,reference:"CL-2026-006",client_id:4,direction:"Export",mode:"Road",origin:"Witbank",destination:"Maputo",port:"Lebombo Border",hs_code:"2701.19",description:"Thermal coal to power plant",gross_weight_kg:20000,value:54000,freight:1800,insurance:0,duty_rate:0,currency:"ZAR",fx_rate:1,clearing_fee:2600,disbursement:400,port_charge:0,arrival_date:D(5),status:"LODGED",priority:"Normal",doc_bl:1,doc_invoice:1,doc_packing:1,doc_origin:0,doc_import_permit:0,doc_freight_invoice:1,notes:""},
  {id:7,reference:"CL-2026-007",client_id:3,direction:"Transit",mode:"Rail",origin:"Durban",destination:"Harare",port:"Durban",hs_code:"3004.90",description:"Medicaments in transit",gross_weight_kg:1500,value:19000,freight:2200,insurance:95,duty_rate:0,currency:"USD",fx_rate:18.2,clearing_fee:2800,disbursement:600,port_charge:410,arrival_date:D(0),status:"PRE_ARRIVAL",priority:"Low",doc_bl:0,doc_invoice:0,doc_packing:0,doc_origin:0,doc_import_permit:0,doc_freight_invoice:0,notes:"ETA tomorrow."},
  {id:8,reference:"CL-2026-008",client_id:2,direction:"Import",mode:"Sea",origin:"Valparaiso, Chile",destination:"Cape Town",port:"Cape Town",hs_code:"4901.99",description:"Printed books, cartons",gross_weight_kg:4200,value:15000,freight:2100,insurance:80,duty_rate:0,currency:"USD",fx_rate:18.2,clearing_fee:3900,disbursement:500,port_charge:380,arrival_date:D(15),status:"LODGED",priority:"Normal",doc_bl:1,doc_invoice:1,doc_packing:1,doc_origin:1,doc_import_permit:0,doc_freight_invoice:1,notes:""}],
  audit:[{id:1,user_id:1,shipment_id:null,action:"seed",detail:"Demo data loaded",at:new Date().toISOString()}],seq:{user:3,client:5,shipment:9,audit:2},session:null};}
function load(){try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);if(d&&d.users)return d;}}catch(e){}var d=seed();save(d);return d;}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}}
var DB=load();
function resetData(){if(confirm("Wipe all local data and re-seed demo data?")){DB=seed();save(DB);location.hash="#/login";render();}}
function audit(sid,action,detail){DB.audit.unshift({id:DB.seq.audit++,user_id:DB.session,shipment_id:sid,action:action,detail:detail,at:new Date().toISOString()});}
function me(){return DB.users.find(function(u){return u.id===DB.session;})||null;}
function clientName(id){var c=DB.clients.find(function(x){return x.id===Number(id);});return c?c.name:"—";}
function hsFor(code){return DB.hs.find(function(h){return h.code===code;});}
function costsFor(s){var h=hsFor(s.hs_code);try{return calcCosts({value:s.value,freight:s.freight,insurance:s.insurance,duty_rate:s.duty_rate,vat_rate:h?h.vat_rate:15,clearing_fee:s.clearing_fee,disbursement:s.disbursement,port_charge:s.port_charge,fx_rate:s.fx_rate});}catch(e){return null;}}

/* ============ RENDER HELPERS ============ */
function esc(v){return String(v===undefined||v===null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function badge(st){return '<span class="badge'+((st==="RELEASED"||st==="DELIVERED")?" solid":"")+'">'+esc(STATUS_LABELS[st]||st)+'</span>';}
function el(id){return document.getElementById(id);}
function renderChrome(){var u=me();el("nav").innerHTML=u?'<a href="#/">Dashboard</a><a href="#/shipments">Shipments</a><a href="#/clients">Clients</a><a href="#/calculator">Duty Calculator</a><a href="#/hs">HS Codes</a><a href="#" onclick="exportCSV();return false;">Export CSV</a>':'';
 el("who").innerHTML=u?esc(u.name)+' · '+esc(u.email)+' <button class="btn2" onclick="logout()">Sign out</button>':'';}
function logout(){DB.session=null;save(DB);location.hash="#/login";render();}
window.logout=logout;window.resetData=resetData;
function exportCSV(){var rows=[["reference","client","direction","mode","status","hs_code","description","value","currency","arrival_date"]].concat(DB.shipments.map(function(s){return [s.reference,clientName(s.client_id),s.direction,s.mode,s.status,s.hs_code,s.description,s.value,s.currency,s.arrival_date];}));
 var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="shipments.csv";a.click();}
window.exportCSV=exportCSV;

/* ============ VIEWS ============ */
function authView(signup){
 var body='<div class="auth"><h1>Clearline Ops</h1><p class="sub">Customs clearing &amp; freight forwarding — '+(signup?"create account":"sign in")+'.</p><div id="authErr"></div>'
 +'<form class="form" style="grid-template-columns:1fr" onsubmit="return doAuth(event,'+!!signup+')">'
 +(signup?'<div><label for="an">Full name</label><input id="an" required autocomplete="name"></div>':'')
 +'<div><label for="ae">Email</label><input id="ae" type="email" required autocomplete="email"></div>'
 +'<div><label for="ap">Password (any)</label><input id="ap" type="password" required autocomplete="current-password"></div>'
 +'<div class="actions"><button type="submit">'+(signup?"Create account":"Sign in")+'</button></div></form>'
 +'<p class="sub"><a href="#/signup">Create account</a> · <a href="#/login">Sign in</a></p>'
 +'<p class="sub">Fake sign-in: type <b>any email</b> + <b>any password</b> — you are in. No account needed. (Demo accounts still work: demo@clearline.local / Demo1234!)</p></div>';
 el("app").innerHTML=body;}
window.doAuth=function(ev,signup){ev.preventDefault();var email=(el("ae").value||"").trim().toLowerCase(),pw=el("ap").value||"",err="";
 /* FAKE SIGN-IN: any email + any password signs you in. New emails auto-create a local account. */
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))err="Enter any valid-looking email address.";
 else if(!pw)err="Enter any password.";
 else{
  var u=DB.users.find(function(x){return x.email===email;});
  if(!u){var name=(signup&&el("an")?el("an").value.trim():"")||email.split("@")[0].replace(/[._-]+/g," ").replace(/\b\w/g,function(c){return c.toUpperCase();})||"Agent";
   u={id:DB.seq.user++,email:email,name:name,pw:hash("sun::"+pw),role:"agent"};DB.users.push(u);}
  DB.session=u.id;save(DB);location.hash="#/";return false;}
 if(err)el("authErr").innerHTML='<div class="err">'+esc(err)+'</div>';return false;};

function dashboard(){var rows=DB.shipments,active=rows.filter(function(s){return s.status!=="DELIVERED"&&s.status!=="CANCELLED";});
 var overdue=rows.filter(isOverdue),pending=active.filter(function(s){return !docsComplete(s);});
 var payable=active.reduce(function(a,s){var c=costsFor(s);return a+(c?c.total_payable_local:0);},0);
 var cards=STATUSES.filter(function(st){return rows.some(function(s){return s.status===st;});}).map(function(st){return '<div class="card"><b>'+rows.filter(function(s){return s.status===st;}).length+'</b><span>'+STATUS_LABELS[st]+'</span></div>';}).join("")
  +'<div class="card"><b>'+rows.length+'</b><span>Total shipments</span></div><div class="card"><b>'+overdue.length+'</b><span>Overdue (&gt;7d)</span></div><div class="card"><b>R'+money(payable)+'</b><span>Payable, active (local)</span></div>';
 function mini(list,title){if(!list.length)return "<h2>"+title+'</h2><div class="empty">None — all clear.</div>';
  return "<h2>"+title+"</h2><table><tr><th>Ref</th><th>Client</th><th>Status</th><th>Arrival</th></tr>"+list.slice(0,8).map(function(r){return "<tr><td><a href='#/shipments/"+r.id+"'>"+esc(r.reference)+"</a></td><td>"+esc(clientName(r.client_id))+"</td><td>"+badge(r.status)+"</td><td>"+esc(r.arrival_date)+"</td></tr>";}).join("")+"</table>";}
 el("app").innerHTML="<h1>Dashboard</h1><p class='sub'>Welcome, "+esc(me().name)+". Clearance pipeline at a glance. Press <b>/</b> to search.</p><div class='grid'>"+cards+"</div>"+mini(overdue,"Overdue — needs attention")+mini(pending,"Documents pending")+"<div class='actions'><a class='btn' href='#/shipments/new'>New shipment</a><a class='btn btn2' href='#/shipments'>All shipments</a></div>";}

function shipmentsView(){var q=(el("q")?el("q").value:"");
 /* filters read from URL hash query */
 var params=new URLSearchParams((location.hash.split("?")[1]||""));
 var fq=params.get("q")||"",fs=params.get("status")||"",fc=params.get("client")||"",fm=params.get("mode")||"",fd=params.get("direction")||"",fo=params.get("overdue")==="1";
 var rows=DB.shipments.filter(function(s){return (!fq||(s.reference+" "+s.description+" "+clientName(s.client_id)).toLowerCase().indexOf(fq.toLowerCase())>=0)&&(!fs||s.status===fs)&&(!fc||String(s.client_id)===fc)&&(!fm||s.mode===fm)&&(!fd||s.direction===fd)&&(!fo||isOverdue(s));});
 function opts(items,cur,val,lab){return items.map(function(i){return '<option value="'+esc(i[val])+'"'+(String(i[val])===String(cur)?" selected":"")+">"+esc(i[lab])+"</option>";}).join("");}
 var statusOpts=STATUSES.map(function(s){return '<option value="'+s+'"'+(fs===s?" selected":"")+">"+STATUS_LABELS[s]+"</option>";}).join("");
 var modeOpts=MODES.map(function(m){return '<option'+(fm===m?" selected":"")+">"+m+"</option>";}).join("");
 var dirOpts=DIRECTIONS.map(function(m){return '<option'+(fd===m?" selected":"")+">"+m+"</option>";}).join("");
 var trs=rows.map(function(r){var c=costsFor(r);return "<tr><td><a href='#/shipments/"+r.id+"'>"+esc(r.reference)+"</a>"+(isOverdue(r)?' <span class="badge">OVERDUE</span>':"")+"</td><td>"+esc(clientName(r.client_id))+"</td><td>"+esc(r.direction)+" / "+esc(r.mode)+"</td><td>"+esc(r.hs_code)+"<br><small>"+esc(String(r.description).slice(0,50))+"</small></td><td>"+esc(r.arrival_date)+"</td><td>"+badge(r.status)+"</td><td>"+esc(r.priority)+"</td><td>"+(c?money(c.total_to_client_local):"")+" "+esc(r.currency)+"</td></tr>";}).join("");
 el("app").innerHTML="<h1>Shipments <span class='sub'>("+rows.length+")</span></h1>"
 +'<form class="toolbar" method="get" onsubmit="return applyFilters(event)"><input name="q" id="fq" placeholder="Search ref / goods / client…" value="'+esc(fq)+'" aria-label="Search"><select name="status" aria-label="Status"><option value="">All statuses</option>'+statusOpts+'</select><select name="client" aria-label="Client"><option value="">All clients</option>'+opts(DB.clients,fc,"id","name")+'</select><select name="mode" aria-label="Mode"><option value="">All modes</option>'+modeOpts+'</select><select name="direction" aria-label="Direction"><option value="">All directions</option>'+dirOpts+'</select><label class="chk"><input type="checkbox" name="overdue" value="1"'+(fo?" checked":"")+'> Overdue only</label><button>Filter</button><a class="btn btn2" href="#/shipments">Clear</a><a class="btn" href="#/shipments/new">+ New</a></form>'
 +"<table><tr><th>Ref</th><th>Client</th><th>Dir / Mode</th><th>HS / Goods</th><th>Arrival</th><th>Status</th><th>Priority</th><th>Total (local)</th></tr>"+(trs||'<tr><td colspan="8"><div class="empty">No shipments match. <a href="#/shipments/new">Create one</a>.</div></td></tr>')+"</table>";}
window.applyFilters=function(ev){ev.preventDefault();var f=el("fq").value;var sel=document.querySelectorAll(".toolbar select");var p=new URLSearchParams();if(f)p.set("q",f);if(sel[0].value)p.set("status",sel[0].value);if(sel[1].value)p.set("client",sel[1].value);if(sel[2].value)p.set("mode",sel[2].value);if(sel[3].value)p.set("direction",sel[3].value);if(document.querySelector(".toolbar input[type=checkbox]").checked)p.set("overdue","1");location.hash="#/shipments?"+p.toString();render();return false;};

function field(name,label,typ,val){return '<div><label for="'+name+'">'+label+'</label><input id="'+name+'" name="'+name+'" type="'+(typ||"text")+'" value="'+esc(val===undefined?"":val)+'"></div>';}
function selField(name,label,options,cur){return '<div><label for="'+name+'">'+label+'</label><select id="'+name+'" name="'+name+'">'+options.map(function(o){var v=(typeof o==="object"?o.v:o),l=(typeof o==="object"?o.l:o);return '<option value="'+esc(v)+'"'+(String(v)===String(cur||"")?" selected":"")+">"+esc(l)+"</option>";}).join("")+"</select></div>";}
function shipmentForm(id){var s=id?DB.shipments.find(function(x){return x.id===Number(id);}):null;if(id&&!s){el("app").innerHTML="<h1>Not found</h1>";return;}
 s=s||{reference:"",client_id:DB.clients[0]?DB.clients[0].id:"",direction:"Import",mode:"Sea",origin:"",destination:"",port:"",hs_code:"",description:"",gross_weight_kg:"",value:"",freight:"",insurance:"",duty_rate:0,currency:"USD",fx_rate:1,clearing_fee:"",disbursement:"",port_charge:"",arrival_date:today(0),status:"PRE_ARRIVAL",priority:"Normal",notes:""};
 var docs=DOC_FIELDS.map(function(p){return '<label class="chk"><input type="checkbox" name="'+p[0]+'"'+(s[p[0]]?" checked":"")+"> "+esc(p[1])+"</label>";}).join("");
 el("app").innerHTML="<h1>"+(id?"Edit":"New")+" shipment</h1><div id='formErr'></div><form class='form' onsubmit='return saveShipment(event,"+(id||0)+")'>"
 +field("reference","Reference *","text",s.reference)+selField("client_id","Client *",DB.clients.map(function(c){return {v:c.id,l:c.name};}),s.client_id)
 +selField("direction","Direction *",DIRECTIONS,s.direction)+selField("mode","Mode *",MODES,s.mode)
 +field("origin","Origin","text",s.origin)+field("destination","Destination","text",s.destination)+field("port","Port / Border post","text",s.port)
 +field("hs_code","HS Code *","text",s.hs_code)+field("description","Goods description *","text",s.description)
 +field("gross_weight_kg","Gross weight (kg)","number",s.gross_weight_kg)+field("value","Goods value","number",s.value)+field("freight","Freight","number",s.freight)+field("insurance","Insurance","number",s.insurance)
 +field("duty_rate","Duty rate (%)","number",s.duty_rate)+field("currency","Currency","text",s.currency)+field("fx_rate","FX to local","number",s.fx_rate)
 +field("clearing_fee","Clearing fee","number",s.clearing_fee)+field("disbursement","Disbursement","number",s.disbursement)+field("port_charge","Port charge","number",s.port_charge)
 +field("arrival_date","Arrival date","date",s.arrival_date)+selField("status","Status",STATUSES.map(function(x){return {v:x,l:STATUS_LABELS[x]};}),s.status)+selField("priority","Priority",["Low","Normal","High"],s.priority)
 +"<div><label>Documents checklist</label>"+docs+"</div><div><label for='notes'>Notes</label><textarea id='notes' name='notes'>"+esc(s.notes)+"</textarea></div>"
 +"<div class='actions'><button type='submit'>Save shipment</button><a class='btn btn2' href='#/shipments'>Cancel</a></div></form>"
 +"<p class='sub'>Tip: pick an HS code from the HS Codes page and copy its duty rate into Duty rate (%).</p>";}
window.saveShipment=function(ev,id){ev.preventDefault();var d={};["reference","client_id","direction","mode","origin","destination","port","hs_code","description","gross_weight_kg","value","freight","insurance","duty_rate","currency","fx_rate","clearing_fee","disbursement","port_charge","arrival_date","status","priority","notes"].forEach(function(k){d[k]=el(k)?el(k).value:"";});d.client_id=Number(d.client_id);
 DOC_FIELDS.forEach(function(p){d[p[0]]=document.querySelector('input[name="'+p[0]+'"]').checked?1:0;});
 ["gross_weight_kg","value","freight","insurance","duty_rate","fx_rate","clearing_fee","disbursement","port_charge"].forEach(function(k){d[k]=num(d[k])||0;});
 var errs=validateShipment(d);
 if(id){var old=DB.shipments.find(function(x){return x.id===Number(id);});if(old&&d.status!==old.status&&!canTransition(old.status,d.status))errs.push("Invalid status change: "+old.status+" → "+d.status+". Allowed: "+((TRANSITIONS[old.status]||[]).join(", ")||"none (terminal)"));}
 if(DB.shipments.some(function(x){return x.reference===d.reference&&String(x.id)!==String(id||"");}))errs.push("Reference already exists.");
 if(errs.length){el("formErr").innerHTML='<div class="err"><ul>'+errs.map(function(e){return "<li>"+esc(e)+"</li>";}).join("")+"</ul></div>";return false;}
 if(id){Object.assign(DB.shipments.find(function(x){return x.id===Number(id);}),d);audit(Number(id),"update","status → "+d.status);}
 else{d.id=DB.seq.shipment++;DB.shipments.unshift(d);audit(d.id,"create",d.reference);id=d.id;}
 save(DB);location.hash="#/shipments/"+id;render();return false;};

function detail(id){var s=DB.shipments.find(function(x){return x.id===Number(id);});if(!s){el("app").innerHTML="<h1>Not found</h1>";return;}
 var c=costsFor(s);var docs=DOC_FIELDS.map(function(p){return "<tr><td>"+esc(p[1])+"</td><td>"+(s[p[0]]?"✓ Received":"— Missing")+"</td></tr>";}).join("");
 var nxt=(TRANSITIONS[s.status]||[]).map(function(n){return '<button onclick="moveStatus('+s.id+',\''+n+'\')">→ '+STATUS_LABELS[n]+'</button>';}).join("");
 var audits=DB.audit.filter(function(a){return a.shipment_id===s.id;}).slice(0,10).map(function(a){return "<tr><td>"+esc(a.at.slice(0,19).replace("T"," "))+"</td><td>"+esc(a.action)+"</td><td>"+esc(a.detail)+"</td></tr>";}).join("")||'<tr><td colspan="3">No audit entries.</td></tr>';
 el("app").innerHTML="<h1>"+esc(s.reference)+" "+badge(s.status)+"</h1><p class='sub'>"+esc(clientName(s.client_id))+" · "+esc(s.direction)+" · "+esc(s.mode)+" · "+esc(s.origin)+" → "+esc(s.destination)+" ("+esc(s.port)+")</p>"
 +'<div class="grid"><div class="card"><b>'+esc(s.hs_code)+'</b><span>HS code</span></div><div class="card"><b>'+esc(s.arrival_date||"—")+'</b><span>Arrival</span></div><div class="card"><b>'+esc(s.priority)+'</b><span>Priority</span></div><div class="card"><b>'+money(s.value)+'</b><span>Goods value '+esc(s.currency)+'</span></div></div>'
 +"<h2>Goods</h2><p>"+esc(s.description)+" — "+money(s.gross_weight_kg)+" kg. "+esc(s.notes||"")+"</p>"
 +"<h2>Cost breakdown</h2><table><tr><th>Item</th><th>"+esc(s.currency)+"</th><th>Local (R)</th></tr>"
 +"<tr><td>CIF (Value+Freight+Insurance)</td><td>"+money(c.cif)+"</td><td>"+money(c.cif_local)+"</td></tr><tr><td>Duty</td><td>"+money(c.duty)+"</td><td></td></tr><tr><td>VAT</td><td>"+money(c.vat)+"</td><td></td></tr><tr><td>Port charge</td><td>"+money(s.port_charge)+"</td><td></td></tr><tr><td><b>Total payable (customs/port)</b></td><td><b>"+money(c.total_payable)+"</b></td><td><b>"+money(c.total_payable_local)+"</b></td></tr><tr><td>Agent fees (clearing + disbursement)</td><td>"+money(c.agent_fees)+"</td><td></td></tr><tr><td><b>Total to client</b></td><td><b>"+money(c.total_to_client)+"</b></td><td><b>"+money(c.total_to_client_local)+"</b></td></tr></table>"
 +"<h2>Documents</h2><table>"+docs+"</table><h2>Move status</h2><div class='actions'>"+(nxt||'<span class="sub">Terminal status — no further moves.</span>')+"</div>"
 +"<h2>Audit trail</h2><table><tr><th>When</th><th>Action</th><th>Detail</th></tr>"+audits+"</table>"
 +'<div class="actions"><a class="btn" href="#/shipments/'+s.id+'/edit">Edit</a><a class="btn btn2" href="#/documents/'+s.id+'/estimate">Cost estimate (print)</a><a class="btn btn2" href="#/documents/'+s.id+'/instruction">Clearing instruction (print)</a><button class="btn2" onclick="deleteShipment('+s.id+')">Delete</button></div>';}
window.moveStatus=function(id,st){var s=DB.shipments.find(function(x){return x.id===id;});if(!s)return;
 if(!canTransition(s.status,st)){alert("Cannot move "+s.status+" → "+st+". Allowed: "+((TRANSITIONS[s.status]||[]).join(", ")||"none"));return;}
 var old=s.status;s.status=st;audit(id,"status",old+"->"+st);save(DB);render();};
window.deleteShipment=function(id){var s=DB.shipments.find(function(x){return x.id===id;});if(!s||!confirm("Delete "+s.reference+"?"))return;audit(id,"delete",s.reference);DB.shipments=DB.shipments.filter(function(x){return x.id!==id;});save(DB);location.hash="#/shipments";render();};

function clientsView(){var trs=DB.clients.map(function(c){return "<tr><td>"+esc(c.name)+"</td><td>"+esc(c.contact)+"</td><td>"+esc(c.email)+"</td><td>"+esc(c.vat_no)+"</td><td>"+DB.shipments.filter(function(s){return s.client_id===c.id;}).length+"</td></tr>";}).join("");
 el("app").innerHTML="<h1>Clients</h1><div id='cErr'></div><form class='form' onsubmit='return addClient(event)'>"+["name","contact","email","vat_no","address"].map(function(n){return '<div><label for="c_'+n+'">'+n.replace("_"," ")+'</label><input id="c_'+n+'" name="'+n+'"'+(n==="name"?" required":"")+"></div>";}).join("")+"<div class='actions'><button>Add client</button></div></form><h2>Existing</h2><table><tr><th>Name</th><th>Contact</th><th>Email</th><th>VAT No</th><th>Shipments</th></tr>"+(trs||'<tr><td colspan="5"><div class="empty">No clients yet.</div></td></tr>')+"</table>";}
window.addClient=function(ev){ev.preventDefault();var name=el("c_name").value.trim();if(!name){el("cErr").innerHTML='<div class="err">Client name is required.</div>';return false;}
 if(DB.clients.some(function(c){return c.name.toLowerCase()===name.toLowerCase();})){el("cErr").innerHTML='<div class="err">Client already exists.</div>';return false;}
 DB.clients.push({id:DB.seq.client++,name:name,contact:el("c_contact").value,email:el("c_email").value,vat_no:el("c_vat_no").value,address:el("c_address").value});save(DB);render();return false;};

function calculator(){var params=new URLSearchParams((location.hash.split("?")[1]||""));var result="";
 if(params.get("value")){try{var c=calcCosts({value:params.get("value"),freight:params.get("freight"),insurance:params.get("insurance"),duty_rate:params.get("duty_rate"),vat_rate:params.get("vat_rate")||15,clearing_fee:params.get("clearing_fee"),disbursement:params.get("disbursement"),port_charge:params.get("port_charge"),fx_rate:params.get("fx_rate")});
  result="<h2>Result</h2><table><tr><td>CIF</td><td>"+money(c.cif)+"</td></tr><tr><td>Duty</td><td>"+money(c.duty)+"</td></tr><tr><td>VAT</td><td>"+money(c.vat)+"</td></tr><tr><td>Total payable</td><td><b>"+money(c.total_payable)+"</b></td></tr><tr><td>Total to client</td><td><b>"+money(c.total_to_client)+"</b></td></tr><tr><td>Total payable (local)</td><td><b>"+money(c.total_payable_local)+"</b></td></tr></table>";}catch(e){result='<div class="err">'+esc(e.message)+"</div>";}}
 var fields=["value","freight","insurance","duty_rate","vat_rate","clearing_fee","disbursement","port_charge","fx_rate"];
 el("app").innerHTML="<h1>Duty &amp; VAT Calculator</h1><p class='sub'>CIF = Value+Freight+Insurance · Duty = CIF×rate · VAT = (CIF+Duty+Port)×VAT%</p><form class='form' method='get' onsubmit='return runCalc(event)'>"+fields.map(function(n){return '<div><label for="calc_'+n+'">'+n.replace(/_/g," ")+'</label><input id="calc_'+n+'" type="number" step="0.01" value="'+esc(params.get(n)||"")+'"></div>';}).join("")+"<div class='actions'><button>Calculate</button></div></form>"+result;
 // stash fields for handler
 el("app").dataset.fields=fields.join(",");}
window.runCalc=function(ev){ev.preventDefault();var p=new URLSearchParams();el("app").dataset.fields.split(",").forEach(function(n){var v=el("calc_"+n).value;if(v!=="")p.set(n,v);});location.hash="#/calculator?"+p.toString();render();return false;};

function hsView(){el("app").innerHTML="<h1>HS Code Tariff</h1><table><tr><th>Code</th><th>Description</th><th>Duty %</th><th>VAT %</th></tr>"+DB.hs.map(function(r){return "<tr><td>"+esc(r.code)+"</td><td>"+esc(r.description)+"</td><td>"+r.duty_rate+"</td><td>"+r.vat_rate+"</td></tr>";}).join("")+"</table>";}

function documentView(id,kind){var s=DB.shipments.find(function(x){return x.id===Number(id);});if(!s){el("app").innerHTML="<h1>Not found</h1>";return;}
 var c=costsFor(s),title=kind==="estimate"?"COST ESTIMATE":"CLEARING INSTRUCTION";
 var docs=DOC_FIELDS.filter(function(p){return s[p[0]];}).map(function(p){return p[1];}).join(", ")||"None received";
 el("app").innerHTML='<div class="print"><h1>Clearline Ops — '+title+'</h1><p>Generated '+today(0)+' · Ref '+esc(s.reference)+'</p><table>'
 +"<tr><td>Client</td><td>"+esc(clientName(s.client_id))+"</td></tr><tr><td>Reference</td><td>"+esc(s.reference)+"</td></tr><tr><td>Route</td><td>"+esc(s.origin)+" → "+esc(s.destination)+" via "+esc(s.port)+"</td></tr><tr><td>HS / Goods</td><td>"+esc(s.hs_code)+" — "+esc(s.description)+"</td></tr><tr><td>Weight / Value</td><td>"+money(s.gross_weight_kg)+" kg / "+money(s.value)+" "+esc(s.currency)+"</td></tr><tr><td>CIF</td><td>"+money(c.cif)+" "+esc(s.currency)+"</td></tr><tr><td>Duty</td><td>"+money(c.duty)+"</td></tr><tr><td>VAT</td><td>"+money(c.vat)+"</td></tr><tr><td>Total payable</td><td><b>"+money(c.total_payable)+" "+esc(s.currency)+" (R"+money(c.total_payable_local)+")</b></td></tr><tr><td>Total to client</td><td><b>"+money(c.total_to_client)+" "+esc(s.currency)+" (R"+money(c.total_to_client_local)+")</b></td></tr><tr><td>Status</td><td>"+STATUS_LABELS[s.status]+"</td></tr></table>"
 +"<p><b>Documents received:</b> "+esc(docs)+"</p><p><b>Notes:</b> "+esc(s.notes||"")+"</p><p>Signature: ______________________ &nbsp; Date: ____________</p><div class='actions noprint'><button onclick='window.print()'>Print / Save as PDF</button><a class='btn btn2' href='#/shipments/"+s.id+"'>Back</a></div></div>";}

/* ============ ROUTER ============ */
function render(){renderChrome();var h=location.hash.replace(/^#/,"")||"/";var parts=h.split("?")[0].split("/").filter(Boolean);
 if(parts[0]==="login"||parts[0]==="signup"){if(me()){location.hash="#/";return;}authView(parts[0]==="signup");return;}
 if(!me()){location.hash="#/login";return;}
 if(parts.length===0)dashboard();
 else if(parts[0]==="shipments"&&parts[1]==="new")shipmentForm();
 else if(parts[0]==="shipments"&&parts[2]==="edit")shipmentForm(parts[1]);
 else if(parts[0]==="shipments"&&parts[1])detail(parts[1]);
 else if(parts[0]==="shipments")shipmentsView();
 else if(parts[0]==="clients")clientsView();
 else if(parts[0]==="calculator")calculator();
 else if(parts[0]==="hs")hsView();
 else if(parts[0]==="documents")documentView(parts[1],parts[2]||"estimate");
 else el("app").innerHTML="<h1>404</h1><p>Page not found.</p>";
 var app=el("app");if(app&&app.focus)app.focus({preventScroll:true});}
window.addEventListener("hashchange",render);
document.addEventListener("keydown",function(e){if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();var q=el("fq");if(q)q.focus();}});

/* expose pure domain + storage for tests */
window.Clearline={calcCosts:calcCosts,canTransition:canTransition,validateShipment:validateShipment,isOverdue:isOverdue,docsComplete:docsComplete,TRANSITIONS:TRANSITIONS,login:function(email,pw){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||!pw)return false;var u=DB.users.find(function(x){return x.email===email.toLowerCase();});if(!u){u={id:DB.seq.user++,email:email.toLowerCase(),name:email.split("@")[0],pw:hash("sun::"+pw),role:"agent"};DB.users.push(u);}DB.session=u.id;save(DB);return true;},state:function(){return DB;},seed:seed};
render();
})();
</script>
</body>
