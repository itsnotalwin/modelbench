name: Auto-sort inbox uploads

on:
  push:
    branches: [main]
    paths:
      - "inbox/*.zip"
      - "inbox/*.html"
      - "inbox/*.htm"
      - "runs/**/meta.json"
      - "prompts/**"
      - "tools/**"
      - "tests/**"
      - "manifest.json"
      - "src/data/catalog.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sort
  cancel-in-progress: false

jobs:
  sort:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Intake must run before the integrity suite so the manifest and compact
      # explorer catalog are tested against the same current runs/ snapshot.
      # continue-on-error lets us commit valid submissions even when another
      # upload is rejected and must remain in inbox for correction.
      - name: Sort inbox and rebuild manifest/catalog
        id: sort_inbox
        continue-on-error: true
        run: python tools/sort_inbox.py

      - name: Run importer and catalog regression tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests -p "test_sort_inbox.py" -v

      - name: Commit accepted runs and generated indexes
        if: always() && steps.sort_inbox.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A runs manifest.json inbox src/data/catalog.json public/briefs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sort: move inbox uploads into runs/"
            git push
          fi

      - name: Report rejected uploads or regression failures
        if: always() && (steps.sort_inbox.outcome == 'failure' || steps.tests.outcome == 'failure')
        run: |
          if [ "${{ steps.sort_inbox.outcome }}" = "failure" ]; then
            echo "::error::One or more inbox uploads were rejected or the importer failed. See the sort step logs; rejected files remain in inbox/."
          fi
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            echo "::error::Importer/catalog regression tests failed. Accepted inbox submissions and generated indexes were still committed for recovery."
          fi
          exit 1
